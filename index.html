{"t":"gto-fdf","ch":"Établissements","niv":"Chef d\u0027agrès","q":"Établissement d\u0027une lance 500 au moyen du dévidoir auxiliaire de 45 : quel est le rôle du chef d\u0027agrès dans cette manœuvre ?","c":["Il attaque avec la lance et sa vanne, puis la confie à l\u0027équipier 1","Il reste au CCF pour réguler la pompe pendant toute la manœuvre","Il prend le 2e raccord puis remonte la claie de 45 au point d\u0027attaque","Il double le porte-lance au premier raccord et surveille les tuyaux"],"r":0,"e":"Le chef d\u0027agrès prévoit l\u0027alimentation du CCF, prend la lance équipée de la vanne d\u0027arrêt et se rend au point d\u0027attaque en tirant l\u0027établissement. Il manœuvre la lance dès son arrivée puis la donne à l\u0027équipier 1, et fait réguler la pression en fonction du relief. Le 2e raccord et la claie de 45 reviennent à l\u0027équipier 2.","ref":"§ 1.2 L\u0027établissement d\u0027une lance 500 jusqu\u0027à 120 m — p. 59","p":"CHEF D\u0027AGRES [...] Prend la lance équipée [...] de la vanne d\u0027arrêt [...] Manœuvre la lance dès [...] donne à l\u0027équipier 1","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Chef d\u0027équipe","q":"Lors du prolongement d\u0027une lance 500, où l\u0027équipier 1 place-t-il la division ?","c":["Juste derrière la vanne d\u0027arrêt, au départ du prolongement","Au pied de l\u0027engin, sur la sortie de refoulement","Entre le dernier et l\u0027avant-dernier tuyau","À mi-longueur de l\u0027établissement, quelle que soit sa longueur"],"r":2,"e":"La longueur du prolongement est déterminée par le chef d\u0027agrès ; dans tous les cas, l\u0027équipier 1 place la division entre le dernier et l\u0027avant-dernier tuyau. Il la raccorde fermée et l\u0027ouvre sur ordre du chef d\u0027agrès.","ref":"§ 1.4 Le prolongement d\u0027une lance 500 — p. 61","p":"La longueur de prolongement est déterminée par le chef d\u0027agrès et dans tous les cas, la division est placée entre le dernier et l\u0027avant dernier tuyau par l\u0027équipier 1.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Équipier","q":"Parmi les points d\u0027eau utilisables pour ravitailler un CCF, le GTO cite les forages DFCI. Que signifie DFCI ?","c":["Dispositif forestier de contrôle des incendies","Détachement feux de cultures et d\u0027interface","Desserte forestière de circulation d\u0027intervention","Défense forestière contre l\u0027incendie"],"r":3,"e":"DFCI signifie défense forestière contre l\u0027incendie. Le GTO cite comme points d\u0027eau utilisables les points naturels, les points d\u0027eau artificiels, les forages DFCI et, par défaut, les poteaux ou bouches d\u0027incendie.","ref":"§ 2 Les établissements d\u0027alimentation — p. 63","p":"les forages de défense forestière contre l\u0027incendie (DFCI) ; les poteaux ou bouches incendie (par défaut).","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Équipier","q":"Dans le cadre d\u0027une noria, le conducteur se déplace seul entre le point d\u0027attaque et le point de ravitaillement en eau. Quelle règle s\u0027applique ?","c":["Il part de sa propre initiative et coupe la radio pour conduire","Il agit sur ordre, en liaison radio avec l\u0027échelon supérieur","Il attend qu\u0027un équipier l\u0027accompagne pour quitter le chantier","Il agit sur ordre mais ne rend compte qu\u0027à son retour sur le chantier"],"r":1,"e":"Les norias assurent le ravitaillement en eau des engins et la permanence de l\u0027eau sur le chantier. Le conducteur peut être amené, sur ordre, à se déplacer seul entre le point d\u0027attaque et le point de ravitaillement ; il reste alors en liaison radio avec l\u0027échelon hiérarchique supérieur.","ref":"§ 2 Les établissements d\u0027alimentation — p. 63","p":"Dans le cas d\u0027une noria, le conducteur peut être amené, sur ordre, à se déplacer seul entre le point d\u0027attaque et le point de ravitaillement en eau. Il reste alors en liaison radio avec l\u0027échelon hiérarchique supérieur.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Équipier","q":"Votre CCF a été rempli avec de l\u0027eau de mer ou à un point d\u0027eau naturel. Que prévoit le guide ensuite ?","c":["Réserver cette eau au seul noyage des lisières en fin de chantier","Ajouter un mouillant pour neutraliser le sel et les sédiments en suspension","Utiliser cette eau en priorité pour l\u0027autoprotection de la cabine","Rincer et contrôler les orifices de pompe et les buses d\u0027autoprotection"],"r":3,"e":"Dès que les citernes ont pu contenir de l\u0027eau de mer ou provenant de points d\u0027eau naturels ou artificiels, il faut effectuer un rinçage et, le cas échéant, vérifier qu\u0027aucun sédiment ou caillou n\u0027obstrue les orifices de pompe ou les buses d\u0027autoprotection, un démontage pouvant être requis.","ref":"§ 2 Les établissements d\u0027alimentation — p. 63","p":"il est nécessaire d\u0027effectuer un rinçage et le cas échéant de vérifier qu\u0027aucun sédiment ou caillou n\u0027obstrue les orifices de pompe ou les buses d\u0027autoprotection","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027agrès","q":"Retournement d\u0027un GIFF sur une piste : quel est le rôle du VLHR du chef de groupe ?","c":["Il ferme la marche et guide le dernier CCF","Il part en avant reconnaître une autre piste","Il se place en travers pour bloquer la piste","Il balise l\u0027emplacement du retournement"],"r":3,"e":"Au commandement « Retournement du détachement, emplacement balisé par le VLHR », le VLHR balise l\u0027emplacement, les 4 véhicules le dépassent, le VLHR fait son demi-tour, puis les chefs d\u0027agrès descendent et guident la marche arrière de leur véhicule, de façon synchronisée.","ref":"§ 2.2 La manœuvre de retournement — p. 70","p":"le VLHR balise l\u0027emplacement du retournement ; les 4 véhicules dépassent cet emplacement; le VLHR fait son 1/2 tour; les chefs d\u0027agrès descendent et guident la marche arrière de leur véhicule","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027agrès","q":"Selon le principe STOPD de reconnaissance avant un franchissement, quelles sont les limites de pente et de dévers d\u0027un CCF ?","c":["Pente 30 %, franchie en biais ; dévers 50 %","Pente 50 %, franchie de face ; dévers 30 %","Pente 70 %, franchie en biais ; dévers 40 %","Pente 50 %, franchie en biais ; dévers 50 %"],"r":1,"e":"La reconnaissance STOPD (S\u0027arrêter, Terrain, Obstacle, Pente, Dévers), menée par le chef d\u0027agrès et le conducteur avant chaque franchissement lorsque le contournement est impossible, rappelle qu\u0027une pente se franchit de face et ne doit pas dépasser 50 % pour un CCF, et que le dévers ne doit pas dépasser 30 %.","ref":"§ 3 Les règles d\u0027évolution en terrain accidenté — p. 72","p":"P – Pente : évaluée en pourcentage (%), elle se franchit de face et ne doit pas dépasser 50% pour un CCF ; • D – Dévers : [...] il ne doit pas dépasser 30% pour un CCF.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Équipier","q":"Votre CCF stationne longuement dans la zone brûlée. Quel risque le guide signale-t-il pour ses pneumatiques ?","c":["Une perte d\u0027adhérence sur les cendres, sans dommage pour le pneu","Un surgonflage temporaire qui disparaît au refroidissement","Une dégradation thermique irréversible, même à chaleur modérée","Aucun risque tant que les flammes n\u0027atteignent pas directement les pneus"],"r":2,"e":"Dans la zone brûlée, il faut garder à l\u0027esprit la dégradation thermique du pneumatique : une exposition prolongée à la chaleur, même d\u0027intensité modérée, peut provoquer des réactions chimiques qui diminuent de façon irréversible ses propriétés mécaniques.","ref":"§ 3 Les règles d\u0027évolution en terrain accidenté — p. 72","p":"Une exposition prolongée à la chaleur (même d\u0027intensité modérée) peut provoquer des réactions chimiques diminuant de façon irréversible les propriétés mécaniques du pneumatique.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Équipier","q":"Porte-lance du 1er CCF en progression, vous rabattez les flammes en balayant la lisière active. Comment répartissez-vous ce balayage ?","c":["Moitié dans le brûlé, moitié dans la végétation non brûlée","2/3 dans le brûlé et 1/3 dans la végétation non brûlée","Entièrement dans la végétation non brûlée, devant les flammes","1/3 dans le brûlé et 2/3 dans la végétation non brûlée"],"r":3,"e":"Le porte-lance du 1er CCF rabat les flammes par un mouvement vertical, tout en balayant la lisière active à 1/3 dans le brûlé et 2/3 dans la végétation non brûlée. Les porte-lances des CCF suivants complètent son action selon le même principe.","ref":"§ 4.1.1 La manœuvre offensive mobile à partir de CCF en progression — p. 76","p":"Rabat les flammes par un mouvement vertical, tout en effectuant un balayage de la lisière active de 1/3 dans brûlé et 2/3 dans la végétation non brûlée.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027équipe","q":"Manœuvre offensive mobile d\u0027une UIFF sur un flanc : à qui revient-il de s\u0027assurer de la parfaite extinction de la lisière ?","c":["Au porte-lance du dernier CCF engagé sur le flanc","Au porte-lance du premier CCF, qui rabat les flammes","Au conducteur du premier CCF, qui ouvre la progression","Au chef de l\u0027UIFF, qui désigne le point d\u0027attaque"],"r":0,"e":"Le porte-lance du 1er CCF rabat les flammes ; les porte-lances des CCF suivants complètent son action par un balayage de la lisière active. Celui du dernier CCF engagé sur le flanc doit s\u0027assurer de la parfaite extinction de la lisière.","ref":"§ 4.1.1 La manœuvre offensive mobile à partir de CCF en progression — p. 76","p":"Dans le cas où il est le dernier CCF engagé sur le flanc, il doit s\u0027assurer de la parfaite extinction de la lisière.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027équipe","q":"Les CCF de l\u0027UIFF ne peuvent pas pénétrer dans le massif : une attaque par établissements, CCF à l\u0027arrêt, est envisagée. À quelles conditions ?","c":["Tout type de feu, à condition que chaque équipier dispose d\u0027une radio","Feu violent uniquement, quand l\u0027attaque mobile devient impossible","Feu non violent, porte-lance seul, le binôme restant à l\u0027engin","Feu non violent, en binôme, à vue permanente du chef d\u0027UIFF"],"r":3,"e":"Ce type d\u0027attaque, mis en œuvre quand l\u0027état du terrain, le relief, la densité des peuplements ou des obstacles empêchent la pénétration des véhicules, ne peut se faire que sur feu non violent, en binôme et en contact visuel permanent avec le chef d\u0027UIFF.","ref":"§ 4.1.2 La manœuvre offensive à partir de CCF à l\u0027arrêt — p. 76","p":"Ce type d\u0027attaque ne peut se faire que sur feu non violent, en binôme et en contact visuel permanent avec le chef d\u0027UIFF.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027équipe","q":"Selon le GTO, laquelle de ces manœuvres est une manœuvre offensive, qui permet d\u0027aller chercher le feu ?","c":["La défense de points sensibles","L\u0027attaque par percée de flanc","La ligne d\u0027appui statique","L\u0027autodéfense en carré"],"r":1,"e":"Les manœuvres offensives (attaque de front, attaque de flanc, attaque par percée de flanc) permettent d\u0027aller chercher le feu. La défense de points sensibles et les lignes d\u0027appui relèvent des manœuvres défensives ; l\u0027autodéfense est une mesure de sécurité en situation d\u0027urgence.","ref":"§ 4.3 Les manœuvres du groupe — p. 80","p":"Les manœuvres offensives (attaque de front, attaque de flanc, attaque par percée de flanc) permettent d\u0027aller chercher le feu.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027agrès","q":"Défense d\u0027un point sensible (habitation menacée) : où positionnez-vous les engins, dans la mesure du possible ?","c":["Au maximum à l\u0027opposé du feu","Entre le feu et la façade exposée","Dans la végétation, au contact du front","Au bout de l\u0027accès, côté forêt"],"r":0,"e":"Dans la mesure du possible, les engins sont positionnés au maximum à l\u0027opposé du feu. Le COS ou son représentant réalise si possible une reconnaissance pour limiter l\u0027exposition des personnels, et le détachement s\u0027appuie sur des points d\u0027eau chaque fois que possible.","ref":"§ 5.1 La défense de points sensibles — p. 87","p":"Dans la mesure du possible, les engins sont positionnés au maximum à l\u0027opposé du feu.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027agrès","q":"Ligne d\u0027appui statique réalisée par un GIFF sur une piste : où se placent de préférence les CCF ?","c":["Au milieu de la piste, pour barrer la progression du feu","Côté opposé à l\u0027arrivée du feu, passage laissé libre","Côté piste exposé au feu, au plus près de la végétation","En épi dans la végétation, les cabines face au front"],"r":1,"e":"Les véhicules se placent sur un des côtés de la piste, si possible celui opposé à l\u0027arrivée du feu, en laissant le passage libre. Le chef du GIFF favorise le stationnement au plus loin de la végétation ; des LDT sont établies du côté opposé au front pour traiter d\u0027éventuelles sautes de feu.","ref":"§ 5.2.2 Les lignes d\u0027appui statique au moyen de GIFF — p. 89","p":"Les véhicules se placent sur un des côtés de la piste (si possible celui opposé à l\u0027arrivée du feu) en laissant le passage libre.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027agrès","q":"Votre CCF participe à une ligne d\u0027appui statique en GIFF, lance 500 établie. Qui décide de l\u0027ouverture des lances ?","c":["Chaque chef d\u0027agrès, dès que le feu arrive à portée de sa lance","Le porte-lance, dès qu\u0027il aperçoit les premières flammes","Le chef de secteur ou, à défaut, le chef du GIFF","Le conducteur, dès que la pompe est en pression"],"r":2,"e":"Sur une ligne d\u0027appui statique, chaque CCF établit au minimum une lance 500, mais l\u0027ouverture des lances se fait sur ordre du chef de secteur (à défaut, du chef du GIFF). Le chef d\u0027agrès fait ouvrir l\u0027eau sur l\u0027ordre du chef de groupe, et le conducteur l\u0027ouvre sur l\u0027ordre du chef d\u0027agrès.","ref":"§ 5.2.2 Les lignes d\u0027appui statique au moyen de GIFF — p. 89","p":"L\u0027ouverture des lances se fait sur ordre du chef de secteur (à défaut, le chef du GIFF).","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Manœuvres en unités organiques","niv":"Chef d\u0027équipe","q":"Sur une ligne d\u0027appui statique, pourquoi les engins établissent-ils une LDT du côté opposé au front de flammes ?","c":["Pour traiter d\u0027éventuelles sautes de feu derrière le dispositif","Pour réalimenter la lance 500 si un tuyau de 45 se rompt","Pour humidifier la piste et faciliter le passage des renforts","Pour permettre au conducteur de noyer la lisière arrière"],"r":0,"e":"Chefs de secteur, chef de GIFF et chefs d\u0027agrès restent attentifs aux sautes de feu qui compromettraient leur sécurité. Pour cela, une LDT est établie en attente du côté opposé au front, avec une réserve suffisante : l\u0027équipier 2 qui la sert traite les éventuelles sautes et protège le véhicule.","ref":"§ 5.2.2 Les lignes d\u0027appui statique au moyen de GIFF — p. 89","p":"Les chefs de secteur, chef de GIFF et chefs d\u0027agrès restent attentifs à d\u0027éventuelles sautes de feu qui compromettraient leur sécurité. Pour cela les engins établissent des LDT du côté opposé au front de flammes.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027agrès","q":"Feu en espace agricole : pour être en mesure de traiter un linéaire important, quels principes d\u0027attaque le GTO préconise-t-il ?","c":["Économiser l\u0027eau, privilégier la rapidité et la mobilité","Progresser à pied, les engins restant en bord de champ","Engager tous les engins d\u0027emblée pour noyer le front","Privilégier l\u0027attaque de front, engins à l\u0027arrêt"],"r":0,"e":"Sur les feux dans les espaces agricoles, il faut économiser l\u0027eau et privilégier la rapidité et la mobilité pour traiter un linéaire important. Les fronts étant peu profonds, on utilise de préférence la LDT ; le personnel pénètre par la zone déjà brûlée, dans l\u0027engin, et l\u0027attaque du front se fait par l\u0027arrière, en roulant.","ref":"§ 1.3 L\u0027attaque (feux dans les espaces agricoles) — p. 95","p":"économiser l\u0027eau, privilégier la rapidité et la mobilité pour être en mesure de traiter un linéaire important.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027agrès","q":"Feu de récoltes : vous sollicitez un agriculteur pour créer avec ses disques des zones à sol nu. Quelle largeur le guide préconise-t-il ?","c":["De 2 à 5 m de large","De 10 à 20 m de large","De 30 à 50 m de large","De 50 à 100 m de large"],"r":1,"e":"Le guide recommande de solliciter les agriculteurs pour réaliser, notamment avec des disques (meilleur compromis entre profondeur de travail du sol et rapidité), des zones à sol nu de 10 à 20 m de large, partout où c\u0027est possible sans exposer le conducteur de l\u0027engin : flancs à distance suffisante du front, arrière du feu.","ref":"§ 1.3 L\u0027attaque (feux dans les espaces agricoles) — p. 95","p":"la mise en œuvre d\u0027outils (notamment les disques, présentant le meilleur compromis entre profondeur du travail du sol et rapidité d\u0027exécution), pour la réalisation de zones à sol nu de 10 à 20 m de large","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Équipier","q":"Feu de récoltes : vous attaquez le front par l\u0027arrière, en jet diffusé, CCF en mouvement, sans marcher à côté de l\u0027engin. Que devez-vous impérativement faire ?","c":["Vous asseoir sur le pare-chocs, face aux flammes","Rester debout sur le marchepied sans vous attacher","Tenir la lance d\u0027une main et la portière de l\u0027autre","Être longé sur le CCF pour éviter tout risque de chute"],"r":3,"e":"Sur les feux dans les espaces agricoles, on procède à l\u0027attaque du front par l\u0027arrière, au moyen de lances en jet diffusé, tout en roulant. Si le porte-lance ne marche pas à côté de l\u0027engin, il doit impérativement être longé sur le CCF pour éviter tout risque de chute.","ref":"§ 1.3 L\u0027attaque (feux dans les espaces agricoles) — p. 95","p":"tout en roulant. Si le porte-lance ne marche pas à côté de l\u0027engin, il doit impérativement être longé sur le CCF pour éviter tout risque de chute","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027agrès","q":"Feu dans un espace agricole, à propagation rapide : vous arrivez avec votre CCF alors que les autres engins sont encore en route. Que préconise le guide ?","c":["Engager les engins au fur et à mesure de leur arrivée","Attendre les autres engins pour attaquer en groupe constitué","Protéger uniquement les bâtiments en attendant le groupe","Attendre la reconnaissance du chef de groupe avant d\u0027agir"],"r":0,"e":"Compte tenu de la vitesse de propagation de ce type de feu, les engins doivent être engagés au fur et à mesure de leur arrivée : il est inutile de vouloir procéder à une attaque en groupe constitué.","ref":"§ 1.4 Les cas particuliers (feux dans les espaces agricoles) — p. 97","p":"compte-tenu de la vitesse de propagation de ce type de feu, les engins doivent être engagés au fur et à mesure de leur arrivée (il est inutile de vouloir procéder à une attaque en groupe constitué)","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Équipier","q":"Feu dans un espace agricole : votre CCF, citerne vide, part se ravitailler au point d\u0027eau. Que fait le porte-lance ?","c":["Il reste sur place pour surveiller la lisière à pied","Il poursuit à pied l\u0027attaque avec un seau-pompe","Il remonte obligatoirement dans la cabine de l\u0027engin","Il rejoint à pied le CCF suivant engagé sur le front"],"r":2,"e":"Lorsque le 1er CCF est vide, le suivant prend la relève pour assurer la continuité de l\u0027attaque, et le porte-lance remonte obligatoirement dans la cabine de l\u0027engin qui se rend au point d\u0027eau.","ref":"§ 1.4 Les cas particuliers (feux dans les espaces agricoles) — p. 97","p":"le porte-lance remonte obligatoirement dans la cabine de l\u0027engin lorsque celui-ci se rend au point d\u0027eau","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027équipe","q":"Feu en espace agricole : vous devez attaquer un front de feu ascendant. Quelle position d\u0027attaque le GTO proscrit-il ?","c":["Par l\u0027arrière, depuis la zone brûlée","En position haute, au-dessus du front","En percée de flanc, par la zone arrière","Engin roulant, porte-lance longé sur le CCF"],"r":1,"e":"Le GTO impose de ne jamais attaquer un front de feu ascendant en position haute. En espace agricole, il préconise au contraire la percée de flanc par la zone arrière ou l\u0027attaque du front par l\u0027arrière, en roulant ; si le porte-lance ne marche pas à côté de l\u0027engin, il doit impérativement être longé sur le CCF.","ref":"§ 1.4 Les cas particuliers (feux dans les espaces agricoles) — p. 97","p":"ne jamais attaquer un front de feu ascendant en position haute.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027équipe","q":"Feu en interface périurbaine : des occupants sont dans une habitation en dur où leur sécurité est assurée. Quelle conduite est la règle ?","c":["Les évacuer en voiture dès l\u0027approche des fumées","Les faire sortir pour qu\u0027ils arrosent eux-mêmes le jardin","Les mettre à l\u0027abri à l\u0027intérieur de l\u0027habitation","Les regrouper dehors, sur le bord de la route"],"r":2,"e":"La mise à l\u0027abri des occupants demeure la règle dès lors que leur sécurité est assurée dans l\u0027habitation : la très grande majorité des décès constatés lors des feux de forêts surviennent pendant des phases de déplacement.","ref":"§ 3.1 L\u0027analyse de la ZI et la reconnaissance (interfaces périurbaines) — p. 99","p":"celle-ci demeurant la règle dans la mesure où la sécurité des occupants est assurée dans l\u0027habitation. […] la très grande majorité des décès constatés dans le cadre des feux de forêt le sont sur des phases de déplacement","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027agrès","q":"En interface périurbaine, dans quel type de zone l\u0027évacuation des personnes en danger est-elle systématique ?","c":["Les lotissements d\u0027habitat en dur débroussaillé","Les zones de cabanisation ou de camping","Les centres-villes desservis par des hydrants","Les bâtiments d\u0027exploitation agricole"],"r":1,"e":"Le COS donne la priorité au sauvetage et à l\u0027évacuation des personnes dont l\u0027habitation ne permet pas la mise à l\u0027abri ; cette évacuation est systématique dans les zones de cabanisation ou de camping. Elle s\u0027appuie sur les forces de police et de gendarmerie, en parfaite coordination.","ref":"§ 3.2 Les sauvetages et les mises en sécurité (interfaces périurbaines) — p. 99","p":"évacuation des personnes en danger dont l\u0027habitation ne permet pas la mise à l\u0027abri par tous les moyens disponibles. Celle-ci sera systématique dans le cas des zones de cabanisation ou de camping.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027agrès","q":"Le front de feu vient de passer sur l\u0027habitation que vous défendez. Avant de réengager votre engin sur un nouvel enjeu, que devez-vous faire ?","c":["Rien de particulier, le danger étant passé avec le front","Attendre l\u0027accord des forces de l\u0027ordre présentes","Faire évacuer les occupants vers la zone brûlée","Vous assurer que tout risque est écarté pour le bâtiment"],"r":3,"e":"Après le passage du front, comme pour tout feu d\u0027habitation, les moyens ne doivent pas être réengagés sur de nouveaux enjeux sans que le chef d\u0027agrès se soit assuré que tout risque est écarté pour le bâtiment : des dommages peuvent résulter de la combustion différée de pièces de charpente extérieures ou de mobilier.","ref":"§ 3.3 L\u0027attaque (interfaces périurbaines) — p. 100","p":"les moyens ne devront pas être réengagés sur de nouveaux enjeux, sans que le chef d\u0027agrès se soit assuré que tout risque est écarté pour le bâtiment.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027équipe","q":"En montagne, le feu bascule vers le versant opposé. Selon le GTO, à quoi faut-il s\u0027attendre ?","c":["À une accélération, l\u0027air y étant plus sec et plus chaud","À un passage en feu de cimes, la végétation y étant plus dense","À un ralentissement, le milieu y étant beaucoup plus humide","À aucun changement, l\u0027exposition n\u0027influençant pas le feu"],"r":2,"e":"Un feu qui bascule vers le versant opposé tombe sur un milieu beaucoup plus humide car moins exposé, facteur favorable au ralentissement de sa propagation. Les feux de montagne ont au contraire tendance à se produire sur les versants les plus exposés au soleil (sud), par hygrométrie très basse.","ref":"§ 4.3 L\u0027attaque (feux de végétation en montagne) — p. 101","p":"S\u0027il bascule vers le versant opposé, il tombera sur un milieu beaucoup plus humide car moins exposé, facteur favorable pour le ralentissement de sa propagation.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Agricole, interface et montagne","niv":"Chef d\u0027équipe","q":"Feu de végétation en montagne : le traitement reste identique à la méthode offensive d\u0027attaque de flanc. Comment se déroule-t-elle ?","c":["On attaque la tête de face, puis on redescend le long des flancs","On attaque un seul flanc depuis la végétation non brûlée, sans avancer","On crée une coupure devant la tête, puis on attend l\u0027arrivée du feu","On part de la base et on remonte vers la tête en réduisant les flancs"],"r":3,"e":"L\u0027attaque de flanc démarre à la base du feu et consiste à remonter vers la tête en réduisant les flancs. Le GTO rappelle ce principe pour les feux de montagne, dont le traitement reste identique à cette méthode offensive.","ref":"§ 4.3 L\u0027attaque (feux de végétation en montagne) — p. 102","p":"la méthode offensive d\u0027attaque de flanc, l\u0027action démarrant à la base du feu et consistant à remonter vers la tête en réduisant les flancs.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Chef d\u0027agrès","q":"Selon le GTO, à quelles conditions un feu tactique (contre-feu ou brûlage tactique) peut-il être allumé ?","c":["Par tout chef d\u0027agrès muni d\u0027une torche, après simple information du chef de groupe","Par tout équipier, dès lors qu\u0027une lance en eau est établie en protection","Par du personnel formé (a minima un cadre feux tactiques), sur autorisation du COS","Uniquement par des forestiers, sur autorisation écrite du propriétaire"],"r":2,"e":"Le feu tactique exige l\u0027emploi de personnel formé (a minima un cadre feux tactiques), le respect des consignes de sécurité et une autorisation obligatoire du COS. Le code forestier permet au COS d\u0027y recourir même sans l\u0027autorisation du propriétaire des fonds concernés.","ref":"§ Ch. 6 Les feux tactiques — p. 104","p":"un emploi de personnel formé (a minima, un cadre feux tactiques) ; le respect des consignes de sécurité ; une autorisation obligatoire du COS ( feu tactique autorisé )","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Chef d\u0027équipe","q":"Un contre-feu montant est allumé pour se propager en remontant la pente vers l\u0027incendie. Selon le GTO, comment évolue-t-il généralement ?","c":["Plus vite que l\u0027incendie, grâce à un effet de pente favorable","Au même rythme que l\u0027incendie, le relief n\u0027intervenant pas","Plus lentement que l\u0027incendie, car il est à contre-pente","Uniquement au rythme du vent, la pente restant sans effet"],"r":0,"e":"Allumé en amont de la zone d\u0027appui, le contre-feu montant bénéficie d\u0027un effet de pente favorable : il évolue généralement plus vite que l\u0027incendie et crée rapidement une zone brûlée suffisamment large. À l\u0027inverse, le contre-feu descendant évolue à contre-pente, assez lentement.","ref":"§ 1.1.2 Le contre-feu montant — p. 106","p":"le contre-feu évolue généralement plus rapidement que l\u0027incendie, en bénéficiant d\u0027un effet de pente favorable, générant en peu de temps une zone brûlée suffisamment large.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Équipier","q":"Brûlage tactique : en période estivale, quand une accalmie du vent, une baisse de la température et une hausse de l\u0027hygrométrie sont-elles généralement réunies ?","c":["En fin de matinée, avant les fortes chaleurs","En milieu d\u0027après-midi, au pic de chaleur","En fin d\u0027après-midi, quand le vent tourne","La nuit ou tôt au lever du jour"],"r":3,"e":"Pour un alignement de lisière par brûlage tactique, on recherche une fenêtre météo favorable, par exemple une accalmie du vent, une baisse de la température et une augmentation de l\u0027hygrométrie de l\u0027air. En période estivale, ces conditions sont généralement réunies la nuit ou tôt au lever du jour.","ref":"§ 2.1 L\u0027alignement de lisière — p. 111","p":"une accalmie du vent, une baisse de la température et une augmentation de l\u0027hygrométrie de l\u0027air. En période estivale, ces conditions sont généralement réunies la nuit ou tôt au lever du jour.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Chef d\u0027équipe","q":"Le binôme surveille une lisière. Selon le GTO, en présence de quel élément une lisière présente-t-elle notamment des risques de reprise ?","c":["Des rochers affleurants","Une piste en terre battue","Une couche d\u0027humus","Une culture irriguée"],"r":2,"e":"Le GTO cite le cas d\u0027une lisière encore active ou présentant des risques de reprise, notamment en présence d\u0027humus. L\u0027alignement de lisière par brûlage tactique permet alors d\u0027en parfaire l\u0027extinction, de façon nette et franche.","ref":"§ 2.1 L\u0027alignement de lisière — p. 111","p":"parfaire l\u0027extinction d\u0027une lisière de l\u0027incendie qui est encore active ou qui présente des risques de reprise, notamment en présence d\u0027humus.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Chef d\u0027équipe","q":"Avant l\u0027allumage d\u0027un brûlage tactique, quelle vérification de sécurité s\u0027impose concernant la position des personnes ?","c":["Que tous les personnels soient regroupés du côté de l\u0027incendie","Que personne ne se trouve entre la zone d\u0027allumage et l\u0027incendie","Que l\u0027équipe d\u0027allumage se tienne dans la végétation à brûler","Que l\u0027équipe de contrôle soit placée de l\u0027autre côté de l\u0027incendie"],"r":1,"e":"Avant l\u0027allumage, il faut s\u0027assurer que personne ne se trouve entre la zone d\u0027allumage et l\u0027incendie, définir une zone de repli et l\u0027itinéraire pour s\u0027y rendre, n\u0027allumer qu\u0027après l\u0027autorisation du COS et garder une liaison radio permanente avec le COS ou le chef de secteur.","ref":"§ 3.1 Les mesures de sécurité (feux tactiques) — p. 113","p":"Avant l\u0027allumage du brûlage tactique, il est nécessaire de • s\u0027assurer que personne ne se trouve entre la zone d\u0027allumage et l\u0027incendie ;","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Équipier","q":"Lors d\u0027un brûlage tactique, l\u0027équipage de votre CCF est désigné comme « équipe de contrôle ». Quel est son rôle ?","c":["Allumer la végétation le long de la zone d\u0027appui à la torche","Observer à distance l\u0027incendie et le feu tactique, muni d\u0027une radio","Contenir le feu tactique et traiter les sautes hors de la zone d\u0027appui","Éteindre complètement le feu tactique dès qu\u0027il s\u0027éloigne de la zone d\u0027appui"],"r":2,"e":"L\u0027équipe de contrôle, formée du personnel des engins de lutte en protection ou de personnel à pied doté de matériel d\u0027extinction portable, contient le feu tactique, baisse son rayonnement si nécessaire et intervient immédiatement en cas de saute au-delà de la zone d\u0027appui. L\u0027allumage revient à l\u0027équipe d\u0027allumage, l\u0027observation à la sonnette.","ref":"§ 3.2 La réalisation d\u0027un brûlage tactique — p. 114","p":"Le rôle de cette équipe est de contenir le feu tactique allumé, de baisser son rayonnement si nécessaire, et d\u0027intervenir immédiatement en cas de saute de feu au-delà de la zone d\u0027appui","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Chef d\u0027équipe","q":"Un feu tactique a été autorisé par le COS. Qui donne ensuite l\u0027ordre d\u0027allumage à l\u0027équipe d\u0027allumage ?","c":["Le cadre feux tactiques, et lui seul","Le COS lui-même, directement par radio","Le chef de secteur où le feu est allumé","Le chef d\u0027agrès du CCF en protection"],"r":0,"e":"Le COS autorise le feu tactique, mais une fois cette autorisation obtenue, l\u0027ordre d\u0027allumage est donné par le cadre feux tactiques et par lui seul. Celui-ci contrôle ensuite l\u0027évolution du feu tactique, régule la vitesse d\u0027allumage, commande son arrêt et rend compte au COS et au chef de secteur.","ref":"§ 3.2 La réalisation d\u0027un brûlage tactique — p. 115","p":"Une fois l\u0027autorisation du COS obtenue, l\u0027ordre d\u0027allumage est donné par le cadre feux tactiques et par lui seul.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Feux tactiques","niv":"Équipier","q":"Pourquoi est-il très important d\u0027informer les avions bombardiers d\u0027eau (ABE) qu\u0027un brûlage tactique est en cours ?","c":["Pour qu\u0027ils larguent en priorité sur le feu tactique allumé","Pour qu\u0027ils balisent la zone d\u0027allumage par un premier largage","Pour qu\u0027ils signalent au cadre l\u0027arrivée du front principal","Pour que les pilotes ne le prennent pas pour une saute de feu"],"r":3,"e":"Les pilotes pourraient prendre le brûlage tactique pour une saute de feu, donc pour un feu naissant à traiter. C\u0027est pourquoi le feu tactique autorisé par le COS est communiqué aux chefs de secteur et à l\u0027officier AERO, qui en informe les avions bombardiers d\u0027eau.","ref":"§ 3.2 La réalisation d\u0027un brûlage tactique — p. 115","p":"Il est très important de donner l\u0027information aux ABE afin que les pilotes ne pensent pas à une saute de feu et donc à un feu naissant","s":"gto-fdf"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Équipier","q":"Dans le vocabulaire du guide, à quoi le terme « ouvrage » est-il exclusivement réservé ?","c":["Aux installations électriques des sites industriels","Aux installations de production photovoltaïque et éolienne","Aux réseaux publics de transport et de distribution","À tout équipement alimenté en haute tension"],"r":2,"e":"Le guide réserve le terme « ouvrage » aux réseaux publics de transport et de distribution d\u0027électricité et à leurs annexes. Le terme « installation » s\u0027applique à toute installation électrique, à l\u0027exclusion des ouvrages.","ref":"§ 1 L\u0027environnement (chap. 1) — p. 16","p":"Le terme ouvrage est exclusivement réservé, aux réseaux publics de transport et de distribution d\u0027électricité et à leurs annexes. Le terme installation s\u0027applique à toute installation électrique à l\u0027exclusion des ouvrages.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Équipier","q":"Une ligne de distribution est exploitée sous 20 000 V alternatif. À quel domaine de tension appartient-elle ?","c":["À la basse tension (BT)","À la très basse tension (TBT)","À la haute tension B (HTB)","À la haute tension A (HTA)"],"r":3,"e":"En alternatif, la HTA est supérieure à 1 000 V et inférieure à 50 000 V ; au-delà de 50 000 V, il s\u0027agit de la HTB. Le réseau de distribution HTA est exploité en 20 000 V, le réseau BT en 230 V et 400 V.","ref":"§ 2.3.1 La tension (chap. 1) — p. 18","p":"la HTA est supérieure à 1000 volts en alternatif et 1500 volts en continu et inferieur a 50 000 Volts en alternatif","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Équipier","q":"Lors d\u0027un incendie, que faut-il savoir des panneaux photovoltaïques d\u0027une habitation ?","c":["Ils sont hors tension dès que le disjoncteur de l\u0027abonné est coupé","Ils ne présentent aucun risque, un panneau délivrant une faible tension","Ils sont mis hors tension en les arrosant abondamment au jet droit","Ils produisent du courant dès qu\u0027ils sont éclairés, même artificiellement"],"r":3,"e":"Tout panneau exposé à la lumière, naturelle ou artificielle, produit de l\u0027électricité en permanence : sauf occultation totale des panneaux ou la nuit (hors faisceau lumineux), cette production ne peut pas être coupée côté courant continu. Couper le réseau alternatif n\u0027empêche pas le champ solaire de rester sous tension.","ref":"§ 3.1.1 Le principe de fonctionnement (chap. 1) — p. 21","p":"Tout panneau PV exposé à la lumière, qu\u0027elle soit naturelle ou artificielle produit de l\u0027énergie électrique en permanence.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Équipier","q":"Quel est le rôle de l\u0027onduleur dans une installation photovoltaïque ?","c":["Stocker l\u0027énergie produite le jour pour la restituer la nuit","Convertir le courant continu des panneaux en courant alternatif","Protéger les panneaux des surtensions dues à la foudre","Mesurer la production injectée sur le réseau pour la facturer"],"r":1,"e":"Les panneaux photovoltaïques génèrent un courant continu, que l\u0027onduleur transforme en courant alternatif pour qu\u0027il puisse être utilisé dans l\u0027installation domestique ou vendu au fournisseur d\u0027énergie. Une coupure du courant continu en amont de l\u0027onduleur n\u0027interrompt pas la tension des panneaux.","ref":"§ 3.1.1 Le principe de fonctionnement (chap. 1) — p. 22","p":"L\u0027onduleur : Dispositif électronique permettant de transformer des courants continus en courants alternatifs exploitables par le réseau.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Équipier","q":"En reconnaissance, vous observez des capteurs sur une toiture. Quel équipement le guide signale-t-il comme pouvant être confondu avec des panneaux photovoltaïques ?","c":["Le chauffe-eau solaire","Le lanterneau de désenfumage","La fenêtre de toit","Le puits de lumière"],"r":0,"e":"Le guide signale que le chauffe-eau solaire, destiné à la production d\u0027eau chaude domestique, peut être confondu avec des panneaux photovoltaïques.","ref":"§ 3.1.4 Les types d\u0027installations photovoltaïques (chap. 1) — p. 26","p":"Le chauffe-eau solaire destiné à la production d\u0027eau chaude domestique peut être confondu avec des panneaux photovoltaïques.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Électricité et production","niv":"Chef d\u0027agrès","q":"Vous devez approcher un moyen aérien d\u0027une éolienne. Quelle mesure préalable le guide impose-t-il, et par qui est-elle réalisée ?","c":["Une mise à la terre du mât, réalisée par l\u0027équipage de l\u0027engin","Un arrêt d\u0027urgence au pied du mât, actionné par un équipier","Une consignation mécanique du rotor, par un technicien habilité","Une coupure du poste de livraison, ordonnée par le chef d\u0027agrès"],"r":2,"e":"Une consignation mécanique du rotor doit être faite à l\u0027approche d\u0027un moyen aérien ou pour un accès dans le rotor ; elle est réalisée par un technicien formé et habilité. Le dispositif d\u0027arrêt d\u0027urgence du pied de mât est, lui, manipulable par les techniciens de maintenance.","ref":"§ 3.2.1 La description d\u0027une éolienne (chap. 1) — p. 29","p":"Une consignation mécanique du rotor devra être faite à l\u0027approche d\u0027un moyen aérien ou en cas d\u0027intervention nécessitant un accès dans le rotor. Cette manipulation est réalisée par un technicien formé et habilité.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Équipier","q":"En métropole, quel opérateur exploite les lignes HTB de 63 000 à 400 000 V ?","c":["RTE","Enedis","EDF","Une entreprise locale de distribution"],"r":0,"e":"RTE exploite le réseau de transport HTB, qui achemine l\u0027électricité à des tensions de 63 000 à 400 000 volts. Enedis ou les entreprises locales de distribution gèrent le réseau de distribution, tandis qu\u0027EDF est producteur et fournisseur d\u0027électricité. En outre-mer, ces missions sont assurées par EDF SEI.","ref":"§ 5.1 Le réseau de transport de l\u0027électricité (chap. 1) — p. 38","p":"Réseau de transport d\u0027électricité (RTE) : le réseau de transport […] Ce réseau HTB, transportant l\u0027électricité à des tensions de 63 000 volts à 400 000 volts","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Équipier","q":"Au-dessus d\u0027une ligne de transport, le câble de garde ne transporte pas d\u0027énergie. Que faut-il retenir à son sujet ?","c":["Il ne subit aucun phénomène induit, étant isolé de la ligne","Il peut présenter un risque électrique s\u0027il est coupé","Il peut être manipulé sans précaution car il est passif","Il sert de conducteur de retour au courant de la ligne"],"r":1,"e":"Le câble de garde, disposé au-dessus de la ligne de transport, détourne les impacts de foudre. Bien que passif, il est soumis aux phénomènes induits et peut présenter un risque électrique s\u0027il est coupé.","ref":"§ 5.1.1 Les lignes aériennes (chap. 1) — p. 40","p":"Ce dispositif “passif” (pas de transport d\u0027énergie) permet d\u0027éviter des coupures brèves d\u0027alimentation en détournant les impacts de foudre. Bien que passif, il est soumis aux phénomènes induits. Il peut présenter un risque électrique s\u0027il est coupé.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Chef d\u0027équipe","q":"Pour identifier précisément un pylône RTE, que lit le chef d\u0027équipe sur sa plaque d\u0027identification ?","c":["Le numéro du pylône, le nom de la liaison et la tension des câbles","La hauteur du pylône, le nombre d\u0027isolateurs et la date de pose","La commune, le nom du propriétaire du terrain et la parcelle","L\u0027altitude du pylône et l\u0027intensité transportée par la ligne"],"r":0,"e":"Associée à un panneau de mise en garde, la plaque permet d\u0027identifier et de localiser avec précision chaque pylône : elle indique son numéro sur la ligne, le nom de la liaison (point de départ et point d\u0027arrivée) et le niveau de tension des câbles conducteurs.","ref":"§ 5.1.1 Les lignes aériennes (chap. 1) — p. 40","p":"cette plaque comporte : le numéro du pylône sur la ligne ; le nom de la liaison (son point de départ et son point d\u0027arrivée) ; le niveau de la tension des câbles conducteurs.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Équipier","q":"Dans certains postes électriques, les protections fonctionnent grâce au gaz SF6. Quel risque le guide associe-t-il à ce gaz ?","c":["Un risque d\u0027explosion au contact de l\u0027eau d\u0027extinction","Un risque de brûlure chimique au contact de la peau","Un risque d\u0027électrisation par conduction du gaz","Un risque d\u0027anoxie pour les personnes présentes"],"r":3,"e":"Dans les postes sous enveloppe métallique, les parties sous tension sont placées dans des caissons remplis de SF6, un gaz isolant sous pression. Le guide signale que le fonctionnement des protections au SF6 peut engendrer un risque d\u0027anoxie.","ref":"§ 5.1.3 Les postes électriques (chap. 1) — p. 43","p":"Le fonctionnement des protections grâce au gaz SF6 au sein des cellules “transformateurs” peut engendrer un risque d\u0027anoxie.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Équipier","q":"Quel est le rôle d\u0027un poste de transformation HTA/BT du réseau de distribution ?","c":["Produire l\u0027électricité consommée par le quartier qu\u0027il dessert","Stocker l\u0027énergie pour alimenter le quartier en cas de coupure","Assurer la liaison entre le réseau haute tension HTA et le réseau BT","Élever la tension pour le transport sur de longues distances"],"r":2,"e":"Le poste HTA/BT assure la liaison entre le réseau HTA et le réseau BT, qui alimente les particuliers et les petites entreprises en 230/400 V. Inaccessible au public, ce local n\u0027est accessible qu\u0027accompagné d\u0027un agent Enedis.","ref":"§ 5.2.3 Les postes de transformation HTA-BT (chap. 1) — p. 46","p":"Un poste HTA/BT est une installation, inaccessible au public, assurant la liaison entre le réseau haute tension HTA et le réseau basse tension (BT).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Équipier","q":"Pour mettre hors tension un logement, quel organe le guide désigne-t-il comme manœuvrable par les sapeurs-pompiers ?","c":["Le disjoncteur général","Le compteur électrique","Le coffret coupe-circuit principal collectif","Le transformateur du poste HTA/BT"],"r":0,"e":"L\u0027installation électrique du client comprend un compteur, un coupe-circuit principal individuel et un disjoncteur général ; seul ce dernier est désigné comme manœuvrable par les sapeurs-pompiers.","ref":"§ 5.2.5 Les installations clients (chap. 1) — p. 48","p":"d\u0027un disjoncteur général (manoeuvrable par les sapeurs-pompiers)","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Chef d\u0027équipe","q":"Dans un immeuble collectif, qui peut manœuvrer le coffret coupe-circuit principal collectif accessible depuis le domaine public ?","c":["Le chef d\u0027agrès, sur ordre du COS","Uniquement un technicien qualifié","Tout sapeur-pompier muni de gants","Le gardien ou le syndic de l\u0027immeuble"],"r":1,"e":"Accessible depuis le domaine public, ce coffret permet de mettre hors tension tout l\u0027immeuble ou la cage d\u0027escalier desservie, services communs compris, mais il n\u0027est manœuvrable que par un technicien qualifié.","ref":"§ 5.2.5 Les installations clients (chap. 1) — p. 48","p":"un coffret coupe-circuit principal collectif, accessible depuis le domaine public, permet de mettre hors tension l\u0027intégralité de l\u0027immeuble ou de la cage d\u0027escalier qu\u0027il dessert (y compris l\u0027alimentation des services communs). Il est manœuvrable uniquement par un technicien qualifié.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Chef d\u0027équipe","q":"Dans un ERP équipé de groupes électrogènes, le dispositif d\u0027arrêt d\u0027urgence situé en amont du TGBT est actionné. Que reste-t-il alimenté ?","c":["Plus rien : tout le bâtiment est coupé, groupes électrogènes compris","Uniquement les prises de courant des locaux techniques","Seulement l\u0027éclairage normal des circulations","Les installations de sécurité, comme le SSI ou le désenfumage"],"r":3,"e":"L\u0027arrêt d\u0027urgence situé en amont du TGBT coupe l\u0027ensemble des installations électriques classiques, mais pas le courant des installations de sécurité (SSI, désenfumage…). Un courant résiduel peut également subsister sur les onduleurs.","ref":"§ 5.2.7 Les spécificités des ERP (chap. 1) — p. 49","p":"une action sur l\u0027arrêt d\u0027urgence ne coupera pas le courant sur les installations de sécurité (SSI, désenfumage, etc.). Un courant résiduel peut également être retrouvé sur les onduleurs.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Chef d\u0027agrès","q":"Sur les lieux d\u0027un accident impliquant un ouvrage RTE, quel agent RTE est l\u0027interlocuteur direct des secours ?","c":["Le chargé de conduite (CCO) du dispatching","Le cadre d\u0027astreinte transport (CAT)","Le chargé d\u0027exploitation (CEX)","Le représentant RTE sur site"],"r":3,"e":"Le représentant RTE sur site est l\u0027interlocuteur direct des secours : il analyse le risque électrique avec le CAT et le CEX, relaie les décisions du CAT et assure la surveillance électrique de l\u0027opération. Le CCO, au dispatching, reçoit généralement l\u0027appel et réalise la mise hors tension d\u0027urgence.","ref":"§ 7.1 Le réseau de transport et de distribution d\u0027électricité (chap. 1) — p. 51","p":"le représentant RTE sur site: Il est l\u0027interlocuteur direct des secours sur le lieu de l\u0027accident. Il analyse la situation quant au risque électrique qu\u0027il partage avec le CAT et le CEX.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux et acteurs","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Une opération de secours doit être menée à moins de 5 m d\u0027une ligne RTE. À quelles conditions peut-elle être conduite ?","c":["Sur autorisation et aux conditions du représentant RTE sur place","Librement, la limite de voisinage ne visant que les moyens aériens","Sur simple accord du CODIS, sans contact préalable avec RTE","Après accord du maire, au titre de ses pouvoirs de police"],"r":0,"e":"Toute opération de secours à proximité des ouvrages RTE, à moins de 5 m des lignes ou dans les postes électriques, est réalisée sur autorisation et aux conditions fixées par le représentant RTE sur place. Cette règle ne se limite pas aux moyens aériens.","ref":"§ 7.1 Le réseau de transport et de distribution d\u0027électricité (chap. 1) — p. 51","p":"Toutes opérations de secours à proximités des ouvrages RTE à moins de 5 m des lignes ou dans les postes électriques seront réalisés sur autorisation et aux conditions fixées par le Représentant RTE sur place.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Quelle différence le guide fait-il entre électrisation et électrocution ?","c":["L\u0027électrisation concerne la basse tension, l\u0027électrocution la haute tension","L\u0027électrocution désigne une brûlure, l\u0027électrisation un simple choc","L\u0027électrocution est une électrisation mortelle, immédiate ou très précoce","Les deux termes désignent exactement le même accident"],"r":2,"e":"L\u0027électrisation est l\u0027ensemble des lésions provoquées par le passage d\u0027un courant électrique à travers le corps. Le terme électrocution est réservé à une électrisation mortelle, soit immédiatement, soit très précocement.","ref":"§ 1 L\u0027accident électrique de personnes (chap. 2) — p. 54","p":"L\u0027électrisation est l\u0027ensemble des lésions provoquées par le passage d\u0027un courant électrique à travers le corps. Le terme électrocution est réservé à une électrisation mortelle, soit immédiatement, soit très précocement.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Selon le guide, en quoi consistent les brûlures électriques ?","c":["Une atteinte limitée à l\u0027épiderme au point de contact","Une simple rougeur due au flash lumineux de l\u0027arc","Une réaction allergique de la peau au passage du courant","Une destruction de la peau et des tissus en profondeur"],"r":3,"e":"Les brûlures électriques correspondent à une destruction de la peau et des tissus en profondeur, jusqu\u0027à la carbonisation. Elles constituent l\u0027un des trois mécanismes de lésion par le courant, avec la stimulation ou l\u0027inhibition nerveuse et musculaire et la destruction irréversible de la membrane cellulaire.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 54","p":"des brûlures électriques : destruction de la peau et des tissus en profondeur jusqu\u0027à la carbonisation","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Chef d\u0027équipe","q":"Lors du bilan d\u0027une victime électrisée, pourquoi rechercher systématiquement les points d\u0027entrée et de sortie du courant ?","c":["Pour en déduire la tension exacte du réseau en cause","Pour déterminer depuis combien de temps l\u0027accident a eu lieu","Pour savoir quel gestionnaire de réseau prévenir","Pour guider l\u0027évaluation des organes traversés par le courant"],"r":3,"e":"Le courant suit le chemin offrant le moins de résistance électrique entre le point d\u0027entrée et le point de sortie du corps. La recherche systématique de ces deux points guide l\u0027évaluation des organes traversés ; il importe aussi de connaître l\u0027intensité du courant susceptible d\u0027avoir traversé la victime.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 54","p":"La recherche de ces points d\u0027entrée et de sortie doit être systématique afin de guider l\u0027évaluation des organes traversés.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Les seuils de danger du courant pour l\u0027homme (perception, réaction, fibrillation…) sont définis en fonction de quelle grandeur ?","c":["La tension nominale du réseau en cause","L\u0027intensité du courant traversant le corps","La puissance de l\u0027installation électrique","La longueur du câble mis en cause"],"r":1,"e":"Les seuils de danger (perception, réaction, paralysie respiratoire, non-lâcher, fibrillation cardiaque) sont définis en fonction de l\u0027intensité du courant traversant le corps humain. La résistance du corps est une variable importante dans la détermination de cette intensité.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"En fonction de l\u0027intensité du courant traversant le corps humain, plusieurs seuils de danger y sont définis","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Selon le guide, quel effet l\u0027eau (peau mouillée, eaux de ruissellement) a-t-elle sur le risque électrique ?","c":["Elle favorise la conduction du courant électrique","Elle isole l\u0027intervenant du sol et limite l\u0027électrisation","Elle n\u0027a aucun effet notable sur le passage du courant","Elle augmente la résistance du corps au courant"],"r":0,"e":"Le degré d\u0027humidité de la peau fait partie des facteurs dont dépend la résistance du corps : l\u0027eau favorise la conduction du courant. Lors de l\u0027extinction, le contact avec des eaux de ruissellement touchant un conducteur nu alimenté peut aussi électriser les intervenants.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"le degré d\u0027humidité de la peau (l\u0027eau favorise la conduction du courant)","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Comment le guide nomme-t-il le seuil de danger à partir duquel le courant provoque la contraction de certains muscles ?","c":["Le seuil de perception","Le seuil de paralysie respiratoire","Le seuil de fibrillation cardiaque","Le seuil de réaction"],"r":3,"e":"Selon l\u0027intensité du courant, le guide distingue le seuil de perception (premières sensations), le seuil de réaction (contraction de certains muscles), puis les seuils de paralysie respiratoire, de non-lâcher et de fibrillation cardiaque.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"le seuil de réaction (le courant est responsable de la contraction de certains muscles)","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"Quel seuil de danger constitue une valeur importante en sécurité électrique, utilisée pour le calibrage des différentiels ?","c":["Le seuil de perception","Le seuil de non-lâcher","Le seuil de paralysie respiratoire","Le seuil de fibrillation cardiaque"],"r":2,"e":"Parmi les seuils de danger définis selon l\u0027intensité du courant, le seuil de paralysie respiratoire est qualifié de valeur importante en sécurité électrique : il sert au calibrage des différentiels.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"le seuil de paralysie respiratoire, valeur importante en sécurité électrique (calibrage des différentiels)","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Chef d\u0027équipe","q":"Lors du bilan d\u0027une femme électrisée, pourquoi le guide demande-t-il de rechercher systématiquement une grossesse ?","c":["Parce que la grossesse augmente la résistance du corps","Parce que le placenta protège le fœtus du passage du courant","Parce que le liquide amniotique est un excellent conducteur","Parce que la grossesse abaisse le seuil de non-lâcher"],"r":2,"e":"Le liquide amniotique étant un excellent conducteur électrique, la grossesse doit être systématiquement recherchée pour évaluer toute atteinte du fœtus. Le bilan recherche aussi les complications traumatiques d\u0027une chute ou d\u0027une projection de la victime.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"Le liquide amniotique étant un excellent conducteur électrique, la grossesse devra être systématiquement recherchée pour évaluer toute atteinte du fœtus","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Chef d\u0027équipe","q":"Une personne électrisée en 230 V se dit indemne et ne présente aucun signe. Que doit savoir le chef d\u0027équipe ?","c":["Des manifestations secondaires peuvent encore apparaître","Si elle marche et parle normalement, il n\u0027existe plus aucun risque","Seule une électrisation en haute tension justifie un bilan complet","Il suffit de vérifier l\u0027absence de brûlures sur ses deux mains"],"r":0,"e":"Même si la victime ne présente aucun signe, des manifestations secondaires peuvent apparaître. Il faut aussi rechercher les éventuelles complications traumatiques d\u0027une chute ou d\u0027une projection de la victime.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"même si la victime ne présente aucun signe, des manifestations secondaires peuvent apparaitre.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Chef d\u0027équipe","q":"Selon le guide, quel risque présentent surtout les courants de basse tension (moins de 1 000 V) pour une victime ?","c":["Un risque cardiovasculaire immédiat","Un risque de brûlures tissulaires profondes","Un risque limité à de simples picotements","Un risque de paralysie définitive des membres"],"r":0,"e":"Les courants de basse tension (\u003c 1 000 V) présentent surtout un risque cardiovasculaire immédiat, alors que les courants de haute tension (\u003e 1 000 V) sont plus volontiers responsables de brûlures tissulaires profondes et graves, qui peuvent engager secondairement le pronostic vital.","ref":"§ 1.2.1 Les effets de l\u0027électricité sur l\u0027organisme (chap. 2) — p. 55","p":"Les courants de basse tension (\u003c1000 V) présentent surtout un risque cardiovasculaire immédiat, alors que les courants de haute tension (\u003e1000 V) sont plus volontiers responsables de brûlures tissulaires profondes et graves","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Effets sur l\u0027organisme","niv":"Équipier","q":"En courant alternatif, quelle est la tension limite conventionnelle de contact (UL), sous laquelle la tension de contact peut être maintenue indéfiniment sans danger ?","c":["12 V","25 V","50 V","60 V"],"r":1,"e":"En dessous de la tension limite conventionnelle de contact (UL), la tension de contact peut être maintenue indéfiniment sans danger pour les personnes. Elle est fixée à 25 V en courant alternatif ; la valeur de 60 V est celle retenue en courant continu.","ref":"§ 1.2.2 Les seuils de danger (chap. 2) — p. 55","p":"en courant alternatif, la tension limite conventionnelle de contact (UL) est fixée à 25 V.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Un équipier touche la carcasse métallique d\u0027un onduleur, portée accidentellement sous tension par un défaut interne. De quel type d\u0027accident s\u0027agit-il ?","c":["D\u0027un contact direct","D\u0027un amorçage à distance","D\u0027une tension de pas","D\u0027un contact indirect"],"r":3,"e":"Le contact indirect se produit lorsqu\u0027une personne touche à la fois la terre et une masse métallique portée accidentellement sous tension, comme l\u0027enveloppe d\u0027un appareil ou la carcasse d\u0027un onduleur. Le contact direct concerne une partie active, normalement sous tension en service.","ref":"§ 1.3.1 Le contact indirect (chap. 2) — p. 57","p":"Ce type de situation se produit principalement lorsqu\u0027une personne est en contact simultané, d\u0027une part avec la terre, d\u0027autre part avec une masse métallique portée accidentellement sous tension.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Selon le guide, qu\u0027est-ce qu\u0027un arc électrique ?","c":["L\u0027échauffement lent d\u0027un câble surchargé, sans flamme ni lumière","Le passage du courant dans le corps, d\u0027une main à l\u0027autre","Un dispositif de protection qui coupe le courant en cas de court-circuit","Un flash pouvant survenir à l\u0027ouverture ou la fermeture d\u0027un circuit"],"r":3,"e":"L\u0027arc électrique est un flash qui peut survenir à l\u0027ouverture ou à la fermeture d\u0027un circuit aux isolants défectueux, ou en reliant deux potentiels par un matériau conducteur. Il s\u0027accompagne d\u0027une onde de choc (coup d\u0027arc) et expose à des brûlures très graves, des éclats de métal, des rayons lumineux intenses et des vapeurs toxiques.","ref":"§ 1.3.4 L\u0027arc électrique (chap. 2) — p. 58","p":"Un arc électrique est un flash susceptible de se produire à l\u0027ouverture ou la fermeture d\u0027un circuit électrique","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Qu\u0027est-ce que la « tension de pas » ?","c":["La tension nominale d\u0027une batterie de véhicule, mesurée entre ses deux bornes de raccordement","La tension mécanique d\u0027un câble aérien tendu entre deux pylônes, qui augmente par temps froid","La différence de tension entre les pieds d\u0027une personne debout près d\u0027un point d\u0027entrée du courant à la terre","La différence de tension entre la main et les pieds d\u0027une personne qui touche une masse métallique sous tension"],"r":2,"e":"Lorsqu\u0027un conducteur haute tension entre en contact avec le sol (chute d\u0027un câble, engin aérien ou de levage), le courant se diffuse autour du point de contact : une personne proche peut être électrisée à distance par le contact de ses deux pieds écartés avec le sol. On se déplace alors à petits pas, voire à cloche-pied.","ref":"§ 1.4 La tension de pas (chap. 2) — p. 58","p":"La tension de pas est la différence de tension entre les pieds d\u0027une personne se tenant debout près d\u0027un point d\u0027entrée du courant à la terre.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Chef d\u0027équipe","q":"Selon le guide, comment une victime peut-elle quitter un véhicule potentiellement sous tension sans courir le même risque que si elle touchait un conducteur ?","c":["En descendant lentement, une main restant sur la portière","En sautant du véhicule, sans contact simultané véhicule/sol","En posant d\u0027abord un pied au sol, puis en lâchant le véhicule","En ouvrant la portière avec un chiffon sec avant de descendre"],"r":1,"e":"Sortir d\u0027un véhicule potentiellement sous tension présente le même risque que toucher un conducteur sous tension (électrisation par contact indirect), sauf si la victime est en capacité de sauter, sans contact simultané véhicule/terre. En zone à risque, on se déplace ensuite à petits pas, voire à cloche-pied, du fait de la tension de pas.","ref":"§ 1.4 La tension de pas (chap. 2) — p. 59","p":"Sortir d\u0027un véhicule potentiellement sous tension présente le même risque que toucher un conducteur potentiellement sous tension, sauf si la victime est en capacité de sauter du véhicule (ne pas être en contact simultané véhicule/terre).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Lors d\u0027un incendie sous une ligne électrique, quel effet de la forte chaleur sur l\u0027air le guide décrit-il ?","c":["L\u0027air chaud devient plus isolant et protège les intervenants","L\u0027air chaud déclenche la coupure automatique de la ligne en défaut","L\u0027air chaud soulève les câbles et les éloigne du sol","L\u0027air chaud devient moins isolant et favorise un arc avec le sol"],"r":3,"e":"Une forte chaleur modifie les caractéristiques isolantes de l\u0027air : plus il est chaud, moins il est isolant, ce qui favorise l\u0027apparition d\u0027un arc électrique avec le sol. Les fumées lourdes, riches en particules, peuvent également favoriser cet arc.","ref":"§ 1.6 Lors des opérations d\u0027extinction (chap. 2) — p. 60","p":"Une forte chaleur modifie les caractéristiques isolantes de l\u0027air. Plus l\u0027air est chaud, moins il est isolant. Ce phénomène favorise l\u0027apparition d\u0027un arc électrique avec le sol","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Un module photovoltaïque seul délivre généralement moins de 60 V continus. Pourquoi une installation PV présente-t-elle pourtant un risque mortel ?","c":["Les panneaux étant branchés en série, leurs tensions s\u0027additionnent","L\u0027onduleur élève la tension continue des panneaux à 20 000 V","Chaque panneau stocke l\u0027énergie produite comme une batterie","Le réseau public réinjecte sa tension alternative dans les panneaux"],"r":0,"e":"Un module pris individuellement ne présente pas de risque mortel, sa tension en circuit ouvert étant très généralement inférieure à 60 V continus. Mais les panneaux sont branchés en série : les tensions s\u0027additionnent et atteignent généralement plusieurs centaines de volts en sortie de chaîne.","ref":"§ 2.1.1 Le risque de choc électrique au contact des panneaux (chap. 2) — p. 61","p":"Dans une installation photovoltaïque, les panneaux étant branchés en série, les tensions s\u0027additionnent. Les tensions en sortie de chaîne et de champ atteignent généralement plusieurs centaines de volts.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Chef d\u0027équipe","q":"Le binôme envisage de sectionner un câble côté courant continu d\u0027une installation photovoltaïque en fonctionnement. Quel risque le guide signale-t-il ?","c":["La formation d\u0027un arc électrique très difficile à interrompre","Aucun, la coupure mettant aussitôt les panneaux hors tension","Un risque limité, une chaîne délivrant toujours moins de 60 V","Seulement une détérioration de l\u0027onduleur, sans risque humain"],"r":0,"e":"L\u0027ouverture d\u0027un circuit photovoltaïque, en charge ou en court-circuit, entraîne la formation d\u0027un arc électrique très difficile à interrompre, pouvant provoquer un départ de feu, un choc électrique ou des brûlures. Une coupure en amont de l\u0027onduleur n\u0027interrompt pas la tension des panneaux.","ref":"§ 2.1.2 Le risque d\u0027arc électrique (chap. 2) — p. 61","p":"L\u0027ouverture accidentelle d\u0027un circuit photovoltaïque qu\u0027il soit en charge ou en court-circuit entraine la formation d\u0027un arc électrique très difficile à interrompre","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Qu\u0027est-ce que l\u0027emballement thermique d\u0027un système de stockage électrochimique (batteries) ?","c":["Un échauffement passager qui cesse dès la déconnexion de la batterie","Un court-circuit interne sans dégagement de chaleur ni de gaz","Des réactions en chaîne qui s\u0027accélèrent, faute d\u0027évacuer la chaleur","Une surcharge sans danger, gérée automatiquement par le BMS"],"r":2,"e":"Faute de pouvoir évacuer suffisamment la chaleur, le stockage électrochimique peut engendrer des réactions en chaîne qui s\u0027accélèrent : c\u0027est l\u0027emballement thermique. Il peut être différé, survenant plusieurs heures voire plusieurs jours après un choc ou un incendie.","ref":"§ 3 Les installations de stockage par batteries (chap. 2) — p. 63","p":"En cas d\u0027incapacité à évacuer suffisamment la chaleur, le système de stockage électrochimique de l\u0027énergie peut engendrer des réactions en chaîne pouvant s\u0027accélérer et conduire à un phénomène d\u0027emballement thermique.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Accidents et risques spécifiques","niv":"Équipier","q":"Lors d\u0027un incendie de système de stockage par batteries, quel phénomène peut blesser gravement des intervenants situés à plusieurs dizaines de mètres ?","c":["La tension de pas due à l\u0027électrolyte répandu au sol","La projection de modules ou de fragments d\u0027enveloppe","Le rayonnement électromagnétique émis par les cellules","L\u0027effondrement de la dalle sous le poids du stockeur"],"r":1,"e":"Le guide signale un risque d\u0027effets missiles dû à la fragmentation des enveloppes des stockeurs ou à la projection de modules, qui peuvent être éjectés à plusieurs dizaines de mètres et blesser gravement la population et les secours autour du stockeur.","ref":"§ 3 Les installations de stockage par batteries (chap. 2) — p. 63","p":"Le risque d\u0027effets missiles dus à la fragmentation des enveloppes des stockeurs ou à la projection de modules pouvant être éjectés à plusieurs dizaines de mètres de nature à blesser gravement les populations et services de secours","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027équipe","q":"Le binôme découvre une victime électrisée encore en contact avec un appareil électrique d\u0027une habitation. Quelle est la première mesure ?","c":["La dégager en la tirant par le bras avec des gants en cuir","L\u0027écarter avec la perche isolante rangée dans le local électrique","Mettre l\u0027installation électrique hors tension","L\u0027arroser en jet diffusé pour interrompre le passage du courant"],"r":2,"e":"La première mesure à conduire est la mise hors tension de l\u0027installation électrique par du personnel connaissant les dispositifs et les risques. Les sapeurs-pompiers peuvent manœuvrer l\u0027interrupteur sectionneur ou le disjoncteur du particulier.","ref":"§ 1 Les règles générales (chap. 3) — p. 66","p":"la première mesure à conduire est la mise hors tension de l\u0027installation électrique par le personnel connaissant les dispositifs et les risques","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Équipier","q":"Dans un local électrique, le binôme trouve des gants et une perche isolante mis à disposition. Peut-il les utiliser ?","c":["Oui, ce matériel est prévu pour les interventions des secours","Oui, après un simple contrôle visuel de son état","Non, son entretien et son isolation ne sont pas garantis","Oui, mais uniquement sur une installation basse tension"],"r":2,"e":"Le matériel disposé à demeure dans les locaux ne peut être garanti du point de vue de son entretien et de ses qualités isolantes : il ne doit pas être utilisé par les intervenants.","ref":"§ 1 Les règles générales (chap. 3) — p. 66","p":"Le matériel disposé à demeure dans les locaux ne pouvant être garanti d\u0027un point de vue de l\u0027entretien et de ses qualités isolantes, il ne doit pas être utilisé par les intervenants","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027équipe","q":"Un équipier a frappé le bouton « coup de poing » d\u0027arrêt d\u0027urgence d\u0027une machine en feu. Que doit savoir le chef d\u0027équipe ?","c":["Un arrêt d\u0027urgence coupe toujours l\u0027alimentation électrique","Le voyant éteint de la machine confirme la mise hors tension","L\u0027immobilisation de la machine prouve l\u0027absence de tension","Cet arrêt n\u0027assure pas forcément la mise hors tension"],"r":3,"e":"L\u0027arrêt d\u0027urgence d\u0027un matériel (système « coup de poing ») n\u0027assure pas obligatoirement la mise hors tension. Dans les bâtiments, la mise hors tension est réalisée en actionnant le disjoncteur général ou un appareil général de commande et de protection (AGCP).","ref":"§ 2.1 La mise hors tension (chap. 3) — p. 67","p":"L\u0027arrêt d\u0027urgence d\u0027un matériel (système coup de poing) n\u0027assure pas obligatoirement la mise hors tension.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027équipe","q":"Sur le réseau HTA, comment les manœuvres de mise hors tension sont-elles réalisées ?","c":["Par le chef d\u0027agrès, sur l\u0027interrupteur aérien du poteau le plus proche","Par l\u0027agence de conduite régionale, à distance ou via un technicien","Par l\u0027opérateur du CTA, depuis le système de gestion de l\u0027alerte","Par l\u0027abonné le plus proche, en coupant son disjoncteur général"],"r":1,"e":"La mise hors tension BT est réalisée sur les lieux par les techniciens ; les manœuvres sur le réseau HTA sont pilotées par l\u0027agence de conduite régionale, à distance ou par un technicien sur le terrain. Les sapeurs-pompiers ne sont autorisés à manœuvrer que sur une alimentation BT (coffrets spécifiques, disjoncteurs).","ref":"§ 2.1 La mise hors tension (chap. 3) — p. 67","p":"Les manœuvres sur le réseau HTA sont pilotés par l\u0027agence de conduite régionale soit à distance soit par l\u0027intermédiaire d\u0027un technicien sur le terrain.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027équipe","q":"Une ligne haute tension vient d\u0027être mise hors tension, mais elle longe d\u0027autres ouvrages haute tension en service. Quel danger subsiste ?","c":["Aucun, puisque la ligne est hors tension","Un simple risque d\u0027électricité statique, sans conséquence","Un risque uniquement thermique, lié à l\u0027échauffement des câbles","Un courant dangereux par induction ou couplage capacitif"],"r":3,"e":"La proximité d\u0027autres ouvrages haute tension peut faire circuler un courant dangereux dans la ligne mise hors tension, par induction magnétique ou par couplage capacitif. Une ligne mise hors tension n\u0027est donc pas pour autant sans danger.","ref":"§ 2.1 La mise hors tension (chap. 3) — p. 67","p":"La proximité d\u0027autres ouvrages électriques de haute tension est susceptible de faire circuler un courant dangereux dans la ligne mise hors tension par phénomène soit d\u0027induction magnétique soit de couplage capacitif.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027équipe","q":"Qu\u0027est-ce que la consignation d\u0027une ligne électrique ?","c":["Une manœuvre du chef d\u0027agrès sur le disjoncteur, contrôlée au voltmètre","La fermeture à clé du local électrique pour en interdire l\u0027accès","La simple coupure du disjoncteur général de l\u0027abonné","Cinq opérations, dont la mise à la terre et en court-circuit de la ligne"],"r":3,"e":"Réalisée par les techniciens réseau, la consignation permet d\u0027intervenir sans risque de retour de courant (hors installation sauvage ou propre au client). Elle se traduit par cinq opérations, dont la mise à la terre et le court-circuit de la portion de ligne concernée, et nécessite souvent des délais importants (plus d\u0027une heure pour RTE).","ref":"§ 2.2 La consignation (chap. 3) — p. 67","p":"Elle se traduit par cinq opérations dont la mise à la terre et le court-circuit de la portion de ligne impactée par l\u0027intervention","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Chef d\u0027agrès","q":"Le technicien qui a consigné une ligne doit quitter les lieux alors que l\u0027opération de secours se poursuit. Que prévoit le guide ?","c":["La consignation reste valable jusqu\u0027à la fin de l\u0027opération","Un certificat pour tiers de consignation est remis au COS","Le chef d\u0027agrès reprend la consignation sous sa responsabilité","Un équipier est désigné pour garder l\u0027organe de coupure"],"r":1,"e":"Le départ de l\u0027agent entraîne obligatoirement la fin de la consignation. Si le technicien doit partir alors que la ligne doit rester consignée pour l\u0027opération, un certificat pour tiers de consignation (CTC) est remis au commandant des opérations de secours.","ref":"§ 2.2 La consignation (chap. 3) — p. 67","p":"Si le technicien est obligé de partir et si la ligne doit rester consignés pour la réalisation de l\u0027opération, un certificat pour tiers de consignation (CTC) est remis au commandant des opérations de secours.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Mise en sécurité électrique","niv":"Équipier","q":"Selon le guide, dans quel domaine de tension les interventions des sapeurs-pompiers sont-elles possibles en sécurité ?","c":["En basse tension : moins de 1 000 V alternatif et 1 500 V continu","En haute tension A : jusqu\u0027à 50 000 V alternatif avec gants isolants","En très basse tension uniquement : moins de 50 V alternatif","Jusqu\u0027à 20 000 V alternatif, avec le lot de protection électrique"],"r":0,"e":"Au regard du domaine de compétence des sapeurs-pompiers, seules les interventions dans le domaine de la basse tension (moins de 1 000 V en alternatif et 1 500 V en continu) sont possibles en sécurité. Une reconnaissance ou l\u0027approche d\u0027un ouvrage sous tension impose alors le port de matériel spécifique de sécurité.","ref":"§ 2.3 Le matériel spécifique de sécurité (chap. 3) — p. 68","p":"Au regard du domaine de compétence des sapeurs-pompiers, seules les interventions sur le domaine de la basse tension (inférieure à 1 000 V en courant alternatif et 1 500 V en courant continu) sont possibles en sécurité.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Avant de faire couper l\u0027alimentation électrique d\u0027un bâtiment sinistré, qu\u0027est-il nécessaire d\u0027évaluer au préalable ?","c":["Le coût de la remise en service pour le propriétaire du site","La consommation électrique habituelle du bâtiment","Le délai de réalimentation annoncé par le gestionnaire","Les impacts directs de la coupure, comme sur les ascenseurs"],"r":3,"e":"La mise hors tension et sa confirmation sont la priorité avant d\u0027engager une équipe en extinction, mais elles nécessitent d\u0027évaluer au préalable les impacts directs de la coupure (ascenseur, matériel médical, train bloqué sur les voies, etc.) et de mettre en œuvre toutes les mesures palliatives.","ref":"§ 3 Lors des opérations d\u0027extinction (chap. 3) — p. 68","p":"Elles nécessitent au préalable d\u0027évaluer les impacts directs d\u0027une telle coupure (ascenseur, matériel médical, train bloqué sur les voies, etc.) et de mettre en œuvre toutes les mesures palliatives.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027équipe","q":"Une fois la mise en sécurité électrique garantie, quel moyen le guide invite-t-il à privilégier pour éteindre le feu ?","c":["L\u0027extincteur à poudre","La lance en jet droit","L\u0027extincteur CO2","La lance à mousse"],"r":2,"e":"Une fois la mise en sécurité garantie, le feu est éteint avec les moyens ordinaires : extincteur CO2 (à privilégier), extincteur à poudre, qui peut endommager les installations électriques préservées, ou lance en jet diffusé d\u0027attaque. Il faut rester attentif aux installations secourues, qui peuvent être réalimentées automatiquement.","ref":"§ 3 Lors des opérations d\u0027extinction (chap. 3) — p. 68","p":"Une fois que la mise en sécurité est garantie, le feu est alors éteint avec les moyens ordinaires : un extincteur CO2 (à privilégier)","s":"gdo-elec"},
