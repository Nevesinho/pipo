{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027équipe","q":"Selon le guide, quelle opération est obligatoire avant toute action de désincarcération sur une zone du véhicule ?","c":["La dépose de toutes les vitres du véhicule","Le dégarnissage des plastiques de la zone travaillée","Le débranchement des câbles orange haute tension","Le dégonflage des pneumatiques du véhicule"],"r":1,"e":"Le dégarnissage consiste à retirer les matières plastiques pour identifier les éléments de sécurité passive et repérer les zones de découpe potentielles ou inappropriées (renforts) et les zones de danger (câbles HT, générateurs de gaz). Obligatoire avant toute action de désincarcération sur la zone travaillée, c\u0027est une condition essentielle de sécurité.","ref":"§ 3.3 Le dégarnissage (chap. 3) — p. 119","p":"Le dégarnissage est obligatoire avant toute action de désincarcération sur la zone travaillée. C\u0027est une condition essentielle de sécurité.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027équipe","q":"Pourquoi le guide proscrit-il d\u0027inscrire l\u0027état des victimes sur les véhicules accidentés lors du marquage ?","c":["Pour réserver au seul médecin la consignation écrite du bilan","Pour ne pas masquer les zones de découpe déjà repérées","Pour ne pas gêner l\u0027expertise ultérieure du véhicule par l\u0027assureur","Pour préserver leur dignité et éviter les fausses informations"],"r":3,"e":"Le marquage sert à signaler l\u0027énergie du véhicule (ES, GO, VE, HY…) pour alerter les sapeurs-pompiers, les acteurs du secours et les partenaires. Afin de préserver la dignité des victimes et d\u0027éviter la diffusion de fausses informations sur les réseaux sociaux, le guide proscrit d\u0027y inscrire leur état.","ref":"§ 3.4 Le marquage (chap. 3) — p. 119","p":"Afin de préserver la dignité des victimes et la diffusion de fausses informations sur les réseaux sociaux, il est proscrit d\u0027inscrire l\u0027état des victimes sur les véhicules.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027équipe","q":"Sur une désincarcération, le chantier est organisé pour travailler en sécurité. Selon le guide, sur quels trois parcs cette organisation s\u0027appuie-t-elle ?","c":["Un parc à matériels, un parc à engins et un parc à impliqués","Un parc à engins, un parc à cales et un parc presse","Un parc à matériels, un parc à débris et un parc SSUAP","Un parc à débris, un parc à dépanneuses et un parc à témoins"],"r":2,"e":"Le chantier s\u0027organise autour de trois parcs : un parc à matériels, où les outils ne servant pas immédiatement ou ayant servi sont rangés en position de sécurité ; un parc à débris ; un parc SSUAP organisé par le personnel VSAV et médical.","ref":"§ 3.5 L\u0027utilisation du matériel (chap. 3) — p. 119-120","p":"un parc à matériels où les outils ne servant pas immédiatement ou ayant servi sont rangés en position de sécurité ; […] un parc à débris ; […] un parc SSUAP organisé par le personnel VSAV et médical.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Équipier","q":"Comment l\u0027équipier doit-il se déplacer sur le chantier avec un outil de désincarcération ?","c":["Outil ouvert, prêt à l\u0027emploi, dirigé vers l\u0027avant","Outil porté par ses flexibles pour garder une main libre","Outil fermé, dirigé vers le bas","Outil fermé, posé sur l\u0027épaule"],"r":2,"e":"Le guide impose de toujours se déplacer avec l\u0027outil fermé, dirigé vers le bas, et de ne pas porter, tirer ou déplacer les outils par les flexibles, susceptibles d\u0027être endommagés. Au-delà de l\u0027abdomen, l\u0027outil est porté avec l\u0027avant-bras « comme un enfant ».","ref":"§ 3.5 L\u0027utilisation du matériel (chap. 3) — p. 120","p":"toujours se déplacer avec l\u0027outil fermé, dirigé vers le bas","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Équipier","q":"Lors d\u0027un feu de véhicule, à quelle distance le guide fixe-t-il le zonage a priori ?","c":["10 mètres","25 mètres","50 mètres","200 mètres"],"r":2,"e":"Lors des feux de véhicules, le guide fixe le zonage a priori à 50 mètres. Ce périmètre de sécurité « a priori » limite d\u0027abord l\u0027accès à la zone de danger principal ; le COS en fixe ensuite les contours effectifs au vu de sa reconnaissance.","ref":"§ 2 La lutte contre l\u0027incendie (chap. 3) — p. 117","p":"Lors des feux de véhicules, le zonage a priori est fixé à 50 mètres.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Équipier","q":"Selon le guide, dans quel axe le binôme d\u0027attaque doit-il progresser vers un véhicule en feu ?","c":["Dans l\u0027axe arrière, face au réservoir","Dans l\u0027axe avant, face au capot","Perpendiculairement, face aux portières","Dans l\u0027axe 3/4 avant du véhicule"],"r":3,"e":"Le guide demande au binôme de progresser dans l\u0027axe 3/4 avant du véhicule en feu et de réaliser les établissements, dans la mesure du possible, en se protégeant derrière des écrans (mobilier urbain, murs, engins).","ref":"§ 3.1 Les incendies de véhicules légers (chap. 5) — p. 133","p":"Le binôme doit progresser dans l\u0027axe 3/4 avant du véhicule en feu. Les établissements sont réalisés dans la mesure du possible en se protégeant derrière des écrans (mobilier urbain, murs, engins, etc.).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027équipe","q":"Quel débit minimum le guide fixe-t-il pour la lance à eau utilisée lors de l\u0027attaque d\u0027un feu de véhicule léger ?","c":["125 l/min","250 l/min","500 l/min","1 000 l/min"],"r":1,"e":"L\u0027attaque d\u0027un feu de véhicule léger est réalisée au moyen de lance à eau avec un débit minimum de 250 litres par minute. Le guide précise que l\u0027efficacité de l\u0027extinction doit être recherchée dès l\u0027ouverture à distance des lances en jet droit.","ref":"§ 3.1 Les incendies de véhicules légers (chap. 5) — p. 133","p":"L\u0027attaque est réalisée au moyen de lance à eau avec un débit minimum de 250 litres par minute.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027équipe","q":"Pourquoi le guide proscrit-il la couverture d\u0027extinction sur un véhicule dont la batterie est en emballement thermique ?","c":["Elle conduit le courant haute tension vers les équipiers qui la manipulent","Elle fond au contact du casing de la batterie et colle à la carrosserie","Elle empêche de contrôler la température de la batterie à la caméra thermique","Les gaz inflammables et toxiques piégés dessous rendent son retrait dangereux"],"r":3,"e":"Le guide proscrit la couverture d\u0027extinction face à un emballement thermique : les gaz inflammables et toxiques générés par la batterie restent piégés dessous, ce qui crée un danger lors de son retrait ultérieur. Elle reste utile notamment sur les feux naissants et les véhicules à énergie conventionnelle.","ref":"§ 3.1 Les incendies de véhicules légers (chap. 5) — p. 134","p":"à proscrire face à un emballement thermique du fait du dégagement de gaz inflammables et toxiques générés par la batterie qui restent piégés sous la couverture. Cette situation génère un danger lors du retrait ultérieur de la couverture.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Équipier","q":"Sur un feu de véhicule fonctionnant au gaz, quelle mesure le COS doit-il imposer au personnel d\u0027attaque ?","c":["Coiffer systématiquement l\u0027ARI","Attaquer seul pour limiter l\u0027exposition","Approcher dans l\u0027axe arrière du véhicule","Attaquer uniquement à la poudre"],"r":0,"e":"Pour anticiper le risque d\u0027explosion du réservoir ou d\u0027effet de torchère, le COS fait coiffer systématiquement l\u0027ARI par le personnel d\u0027attaque et fait réaliser l\u0027approche par l\u0027avant du véhicule, en dehors de son axe et des côtés. L\u0027attaque se fait au moyen de deux lances à eau, si possible additivée.","ref":"§ 3.1.1.1 Les véhicules au gaz (chap. 5) — p. 134","p":"faire coiffer systématiquement l\u0027ARI par le personnel d\u0027attaque","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027agrès","q":"Le feu d\u0027un véhicule au gaz est éteint. Avant de quitter les lieux ou de confier le véhicule au dépanneur, que devez-vous faire réaliser ?","c":["Une vidange complète des réservoirs de gaz","Des relevés explosimétriques sur les réservoirs","Un arrosage continu jusqu\u0027à l\u0027arrivée du dépanneur","La coupure des canalisations de gaz à la cisaille"],"r":1,"e":"Le guide impose, avant de quitter les lieux ou de confier le véhicule au dépanneur ou aux forces de l\u0027ordre, de s\u0027assurer de l\u0027absence de toute fuite de gaz sur les réservoirs à l\u0027aide de relevés explosimétriques.","ref":"§ 3.1.1.1 Les véhicules au gaz (chap. 5) — p. 135","p":"Avant de quitter les lieux, ou de confier le véhicule au dépanneur ou aux forces de l\u0027ordre, il est nécessaire de s\u0027assurer de toute absence de fuite de gaz sur les réservoirs à l\u0027aide de relevés explosimétriques.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027équipe","q":"Après extinction de l\u0027habitacle, la batterie de traction est en emballement et dépourvue de dispositif constructeur (trappe thermo-fusible). Que prévoit le guide ?","c":["Faire pénétrer l\u0027eau par les déformations, sans ouvrir le casing à l\u0027outil","Ouvrir le casing avec un outil de forcement pour noyer directement les cellules","Recouvrir entièrement la batterie de sable pour étouffer la réaction chimique","Arroser l\u0027extérieur du casing sans limite de durée jusqu\u0027au refroidissement"],"r":0,"e":"Sans dispositif constructeur, le guide prévoit d\u0027intégrer l\u0027eau dans le casing par les déformations de la batterie ou la fonte de parties fusibles, mais jamais en créant une ouverture avec un outil de forcement. Si c\u0027est inefficace, on s\u0027abstient de toute tentative d\u0027extinction et de refroidissement : seules la sécurité des tiers et la protection de l\u0027environnement sont recommandées.","ref":"§ 3.1.1.2 Les véhicules légers électriques et hybrides (chap. 5) — p. 136","p":"on cherchera à intégrer l\u0027eau dans le casing de la batterie (par les déformations de la batterie ou la fonte de parties fusibles mais jamais en créant une ouverture à l\u0027aide d\u0027un outil de forcement)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027agrès","q":"Feu de véhicule électrique : habitacle éteint, batterie HT toujours en emballement, sans trappe constructeur ; faire entrer l\u0027eau dans le casing s\u0027avère inefficace. Que faites-vous ?","c":["Percer le casing avec un outil de forcement pour y injecter de l\u0027eau","Recouvrir le véhicule d\u0027une couverture anti-feu jusqu\u0027à l\u0027extinction","S\u0027abstenir de l\u0027éteindre et protéger les tiers et l\u0027environnement","Arroser massivement la batterie jusqu\u0027à son extinction complète"],"r":2,"e":"Une batterie en emballement s\u0027éteint à l\u0027eau via le dispositif constructeur (trappe thermo-fusible) ou en intégrant l\u0027eau dans le casing, jamais en l\u0027ouvrant avec un outil de forcement. Si c\u0027est inefficace, on s\u0027abstient de toute extinction et de tout refroidissement : seules la sécurité des tiers et la protection de l\u0027environnement sont recommandées. La couverture est proscrite face à un emballement.","ref":"§ 3.1.1.2 Les véhicules légers électriques et hybrides (chap. 5) — p. 136","p":"il convient de s\u0027abstenir de toute tentative d\u0027extinction […] et de refroidissement de la batterie qui ne peut avoir que des effets indésirables […] Seules la sécurité des tiers et la protection de l\u0027environnement sont recommandées.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027agrès","q":"Un feu de véhicule électrique est éteint, mais sa batterie a été seulement partiellement détruite. Quelle mesure le guide prévoit-il face au risque de ré-ignition ?","c":["Remettre le véhicule au dépanneur sans consigne, le feu étant éteint","Le placer en quarantaine sur sol inerte et informer le dépanneur","Débrancher la batterie de traction et la déposer avant le départ","L\u0027immerger dans une benne remplie d\u0027eau pour son transport"],"r":1,"e":"Le guide demande de placer le véhicule en quarantaine sur un sol inerte (lit de sable par exemple) et d\u0027informer les forces de l\u0027ordre et la société de dépannage de l\u0027énergie du véhicule et du risque de ré-ignition. S\u0027il doit être déplacé, une benne avec un lit de matériau inerte est préférée à une benne d\u0027immersion.","ref":"§ 3.1.1.2 Les véhicules légers électriques et hybrides (chap. 5) — p. 136","p":"le véhicule doit être placé en quarantaine sur un sol inerte (lit de sable par exemple) ; les forces de l\u0027ordre et la société de dépannage doivent être informées de l\u0027énergie du véhicule et du risque de ré-ignition","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027agrès","q":"Un véhicule électrique brûle alors qu\u0027il est branché sur une borne de recharge. Sans confirmation de la coupure de l\u0027énergie, que faites-vous ?","c":["Débrancher le câble de recharge à la main","Attaquer le véhicule à la lance en jet droit","Couper le câble de recharge à la cisaille","Se limiter à la protection de l\u0027environnement"],"r":3,"e":"Sur un véhicule électrique ou hybride en charge, sans confirmation de coupure, le guide limite l\u0027action à la protection de l\u0027environnement. La borne s\u0027isole par son système d\u0027arrêt d\u0027urgence (sur la borne ou déporté à proximité) ou par la coupure électrique générale à laquelle elle est reliée.","ref":"§ 3.3 Les incendies dans les stations de recharge en énergie (chap. 5) — p. 138","p":"Lors d\u0027une intervention sur véhicule électrique ou hybride en charge, sans confirmation de coupure, on se limitera à protéger l\u0027environnement.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Lutte contre les incendies","niv":"Chef d\u0027agrès","q":"En tunnel, la circulation à contresens des engins dans un tube congestionné a été validée par l\u0027exploitant et le COS. Comment les engins circulent-ils ?","c":["Sur la voie de droite, à 30 km/h maximum, à 20 m les uns des autres","Sur la voie de droite, à 50 km/h maximum, à 10 m les uns des autres","Au centre du tube, à 30 km/h maximum, à 5 m les uns des autres","Sur la voie de gauche, à 50 km/h maximum, à 50 m les uns des autres"],"r":0,"e":"Le contresens dans un tube congestionné suppose une évacuation des fumées maîtrisée et une validation par l\u0027exploitant et le COS. Les engins circulent alors sur la voie de droite (le contresens devient double sens), feux de croisement, de détresse et gyrophares allumés, à 30 km/h maximum et à 20 m les uns des autres.","ref":"§ 3.5.2 La circulation en contresens des véhicules de secours (chap. 5) — p. 141","p":"circuler sur la voie de droite (le contre-sens devient double sens par le trafic des véhicules de secours) ; […] limiter sa vitesse à 30 km/h ; […] respecter une distance de sécurité entre les véhicules de 20 m.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027agrès","q":"Selon le guide, dans quel ordre se présentent les phases de la marche générale des opérations lors d\u0027une opération de secours routier ?","c":["Sécurisation du site, sécurisation du véhicule, SUAP, sécurisation des techniques, sortie de la victime","Sécurisation du véhicule, SUAP, sécurisation du site, sortie de la victime, sécurisation des techniques","SUAP, sécurisation du site, sécurisation des techniques, sécurisation du véhicule, sortie de la victime","Sécurisation du site, SUAP, sécurisation des techniques, sécurisation du véhicule, sortie de la victime"],"r":0,"e":"Le guide énumère cinq phases : sécurisation du site, sécurisation et stabilisation du véhicule, secours d\u0027urgence aux personnes (SUAP), sécurisation des techniques, puis sortie de la victime. La sécurisation du site s\u0027appuie en premier lieu sur le zonage opérationnel et la signalisation d\u0027urgence.","ref":"§ 4 Les opérations de secours routier (chap. 5) — p. 144","p":"repose sur différentes phases : […] la sécurisation du site ; la sécurisation et stabilisation du véhicule ; le secours d\u0027urgence aux personnes ; la sécurisation des techniques ; la sortie de la victime.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un accident avec victime incarcérée, sans feu ni fuite apparente. Que prévoyez-vous en matière de protection incendie ?","c":["Aucune, puisque le contact est coupé et la batterie 12 V isolée","Un moyen d\u0027extinction uniquement si une fuite de carburant apparaît","Un moyen d\u0027extinction uniquement pour un véhicule électrique ou au gaz","Une protection adaptée aux risques, prête pour tout départ de feu"],"r":3,"e":"La sécurisation du site comprend une protection incendie qui doit permettre d\u0027intervenir sur tout départ de feu et être adaptée aux risques, notamment pour les véhicules à énergie alternative (électrique, hybride, GPL, GNC, GNL, H2). Dans la zone de travail, une sphère est dédiée au risque incendie (extincteur du VSAV, lance du VSR ou d\u0027un FPT).","ref":"§ 4.1 La sécurisation du site (chap. 5) — p. 144","p":"La protection incendie doit permettre d\u0027intervenir sur tout départ de feu et sera adaptée aux risques, notamment dans le cas de véhicule à énergie alternative (électrique, hybride, GPL, GNC, GNL, H2).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Le binôme constate une flaque de carburant sous le véhicule accidenté. Quelle action le guide préconise-t-il pour éviter un départ de feu ?","c":["La rincer à grande eau avec la lance du dévidoir tournant","Déplacer le véhicule hors de la flaque à l\u0027aide du treuil de l\u0027engin","Accélérer la désincarcération pour sortir la victime avant l\u0027inflammation","La recouvrir de produit absorbant ou, à défaut, de sable ou de terre"],"r":3,"e":"Pour éviter un début d\u0027incendie, le guide prévoit de couper le contact et de retirer la clé, et de recouvrir les flaques d\u0027hydrocarbures et de fluides de produit absorbant ou, à défaut, de sable ou de terre. L\u0027absorbant s\u0027emploie de façon ciblée, sur une surface de travail raisonnable : cette tâche relève du gestionnaire de la route.","ref":"§ 2 La lutte contre l\u0027incendie (chap. 3) — p. 116","p":"recouvrir de produit absorbant ou à défaut de sable ou de terre les flaques d\u0027hydrocarbures et de fluides répandues sur le sol.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Dans l\u0027attente de l\u0027identification précise du véhicule accidenté, pourquoi recherche-t-on déjà son énergie (logos, réservoirs…) ?","c":["Pour remplir le compte rendu et informer l\u0027assureur du véhicule","Pour prendre les mesures conservatoires de sécurisation nécessaires","Pour savoir s\u0027il faut attendre l\u0027avis du constructeur avant toute action","Pour pouvoir remorquer le véhicule hors de la chaussée au plus vite"],"r":1,"e":"L\u0027identification du véhicule permet de cibler sa FAD et les informations utiles, dont son énergie. Sans attendre, la recherche de l\u0027énergie (logos, câbles orange, réservoirs…) permet de prendre les mesures conservatoires nécessaires : sécurisation de la zone d\u0027intervention et du véhicule.","ref":"§ 4.2.1 Identifier (chap. 5) — p. 144","p":"dans l\u0027attente de l\u0027identification du véhicule, la recherche de l\u0027énergie (logos, câbles orange, réservoirs…) peut être réalisée afin de prendre les mesures conservatoires nécessaires (sécurisation ZI, sécurisation véhicule).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Lors de la sécurisation du véhicule (méthode des 5 i), que permet l\u0027étape « Inspecter » ?","c":["Repérer une fuite, un câble HT sectionné ou une batterie HT abîmée","Mesurer les déformations pour calculer précisément la vitesse du choc","Relever les immatriculations des véhicules pour le compte rendu","Vérifier que les portes et le coffre peuvent encore être ouverts"],"r":0,"e":"L\u0027étape « Inspecter » permet de localiser, selon le type de véhicule, une fuite d\u0027essence, de gazole ou de GPL, un problème sur le chargement, un câble HT sectionné ou une batterie HT endommagée. Les 5 i sont : Identifier, Inspecter, Interdire, Immobiliser, Isoler. La détermination de l\u0027energy equivalent speed (EES) est, elle, impossible à réaliser sur le terrain de manière fiable et précise.","ref":"§ 4.2.2 Inspecter (chap. 5) — p. 144","p":"L\u0027inspection du véhicule permet de localiser en fonction du type de véhicule, une fuite d\u0027essence ou de gazole, un problème sur le chargement, un câble HT sectionné, une fuite GPL, une batterie HT endommagée.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Équipier","q":"Lors de la sécurisation d\u0027un véhicule accidenté (méthode des 5 i), en quoi consiste l\u0027étape « Immobiliser » ?","c":["Isoler la batterie 12 V puis déplacer le véhicule hors de la chaussée","Couper le contact, frein de parc, levier en position P et calage des roues","Laisser le moteur au ralenti, serrer le frein de parc et engager une vitesse","Retirer les ceintures des occupants et abaisser les dossiers des sièges"],"r":1,"e":"L\u0027étape « Immobiliser » associe la mise à l\u0027arrêt du moteur (coupure du contact, frein de parc, levier en position P) et le calage des roues, voire l\u0027arrimage dans l\u0027axe le plus menaçant. L\u0027isolement de la batterie 12 V relève de l\u0027étape suivante, « Isoler ».","ref":"§ 4.2.4 Immobiliser (chap. 5) — p. 144","p":"La mise à l\u0027arrêt moteur (coupure contact, complété par frein de parc et position «P» du levier de vitesse […]) et au calage des roues","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Équipier","q":"Lors de l\u0027immobilisation d\u0027un véhicule accidenté équipé d\u0027une smart key (carte « mains libres »), que fait-on de celle-ci ?","c":["On l\u0027éloigne du véhicule, à une distance de 5 mètres","On la laisse dans l\u0027habitacle, à portée de la victime","On la pose sur le siège conducteur pour la retrouver","On la range dans la boîte à gants, contact coupé"],"r":0,"e":"L\u0027étape « Immobiliser » comprend notamment la coupure du contact, le frein de parc et la position P du levier de vitesse. En présence d\u0027une smart key (carte intelligente), on prend soin de l\u0027éloigner du véhicule, à 5 mètres.","ref":"§ 4.2.4 Immobiliser (chap. 5) — p. 144","p":"En présence d\u0027une smart key (carte intelligente), on prendra soin de l\u0027éloigner (5 mètres).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Avant d\u0027isoler la batterie 12 V d\u0027un véhicule accidenté, à quoi faut-il avoir réfléchi ?","c":["Au retrait préalable des roues situées du côté de la victime","À la vidange préalable du réservoir dans un récipient adapté","Aux mobilités utiles : sièges, vitres, colonne de direction, coffre","À la dépose préalable des coussins gonflables du volant et du tableau de bord"],"r":2,"e":"Quelle que soit la carburation, la batterie 12 V n\u0027est isolée qu\u0027après réflexion sur les mobilités utiles à l\u0027accès ou à l\u0027extraction de la victime : sièges, vitres, colonne de direction, frein de stationnement, ouverture du coffre. La coupure du contact apporte déjà un premier niveau de sécurité.","ref":"§ 4.2.5 Isoler (chap. 5) — p. 145","p":"l\u0027isolement de la batterie 12V est réalisé après réflexion sur les mobilités nécessaires pour les actions facilitant l\u0027accès ou l\u0027extraction de la victime (mobilité des sièges, vitre, colonne de direction, frein de stationnement, ouverture du coffre)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Dans l\u0027étape « Isoler » des « 5 i », quel premier niveau de sécurité la coupure du contact apporte-t-elle sur un véhicule GPL, GNC ou hydrogène ?","c":["La vidange automatique du réservoir de gaz","L\u0027ouverture de la soupape de sécurité","La fusion du fusible thermique du réservoir","La fermeture des électrovannes de gaz"],"r":3,"e":"Selon le guide, la coupure du contact apporte un premier niveau de sécurité : ouverture des relais HT sur les véhicules électriques et hybrides, fermeture des électrovannes sur les véhicules GPL, GNC et hydrogène. La FAD peut recommander une action complémentaire, par exemple sur les vannes des véhicules GNC ou GNL lorsqu\u0027elles sont accessibles.","ref":"§ 4.2.5 Isoler (chap. 5) — p. 145","p":"La coupure du contact entraine un premier niveau de sécurité du véhicule à savoir l\u0027ouverture des relais HT pour les véhicules électriques et hybrides et la fermeture des électrovannes pour les véhicules GPL, GNc, H².","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027équipe","q":"Sur un véhicule électrique ou hybride accidenté, à quelle condition peut-on manipuler le service plug ou la « boucle d\u0027isolement » ?","c":["Systématiquement, dès l\u0027arrivée, avant même la coupure du contact","Uniquement en connaissant les préconisations de la FAD du véhicule","Après avoir sectionné les câbles orange à la cisaille hydraulique","Seulement après avoir arrosé la batterie de traction pour la décharger"],"r":1,"e":"La coupure du contact apporte un premier niveau de sécurité (ouverture des relais HT). Les constructeurs ne donnant pas tous les mêmes consignes, une action complémentaire sur le service plug ou la boucle d\u0027isolement ne se fait qu\u0027en connaissant les préconisations de la FAD du véhicule.","ref":"§ 4.2.5 Isoler (chap. 5) — p. 145","p":"Sans connaissance des préconisations de la FAD pour le véhicule : Pas de manipulation du service plug ou de la « boucle d\u0027isolement » !","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurisation site et véhicule","niv":"Chef d\u0027agrès","q":"Un véhicule s\u0027est immergé après une sortie de route. Selon le guide, quel préalable est nécessaire avant le dégagement du véhicule ?","c":["La consultation de la fiche d\u0027aide à la décision du véhicule","Le sectionnement des câbles orange haute tension depuis la berge","La vidange du réservoir de carburant par une équipe de plongeurs","L\u0027identification du propriétaire auprès des forces de l\u0027ordre"],"r":0,"e":"Pour un véhicule immergé, l\u0027énergie embarquée n\u0027est pas la priorité des sauveteurs. Mais certains constructeurs préconisant des procédures particulières, la consultation de la FAD est un préalable nécessaire avant le dégagement du véhicule.","ref":"§ 5.3 Les interventions pour un véhicule immergé (chap. 5) — p. 150","p":"Certains constructeurs préconisent des procédures particulières, la consultation de la FAD sera donc un préalable nécessaire avant le dégagement du véhicule.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Selon le guide, quel est l\u0027un des objectifs de la lecture de l\u0027accident réalisée par les secouristes ?","c":["Établir les responsabilités des conducteurs pour l\u0027enquête judiciaire","Rechercher les lésions non visibles, comme les hémorragies à bas bruit","Remplacer le bilan primaire tant que la victime reste incarcérée","Estimer la valeur des véhicules pour l\u0027expertise de l\u0027assureur"],"r":1,"e":"Selon le guide, la lecture de l\u0027accident guide les secouristes dans la recherche de lésions non visibles (hémorragies dites « à bas bruit »), aide à catégoriser la criticité des victimes et donne des critères communs avec la régulation médicale. C\u0027est une aide à la décision utilisée en complément du bilan primaire, sans le remplacer.","ref":"§ 4.3.2 La lecture de l\u0027accident (chap. 5) — p. 146","p":"La lecture de l\u0027accident est une aide à la décision, qui doit être utilisée en complément du bilan primaire […] guider les secouristes dans la recherche de lésions non visibles (hémorragies dites « à bas bruit »)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Pendant la désincarcération, comment la victime est-elle protégée contre les projections mécaniques ?","c":["Par l\u0027ouverture préalable de toutes les vitres de l\u0027habitacle","Par l\u0027arrosage préalable de l\u0027habitacle pour fixer les éclats de verre","Par l\u0027abaissement complet du dossier de son siège vers l\u0027arrière","Par l\u0027utilisation d\u0027une couverture ou d\u0027un bouclier de protection"],"r":3,"e":"Le guide prévoit que la victime soit protégée contre les risques de projections mécaniques lors de la désincarcération par l\u0027utilisation d\u0027une couverture ou d\u0027un bouclier de protection. Cette protection s\u0027inscrit dans le secours d\u0027urgence aux personnes, dont la prise en charge doit débuter le plus tôt possible.","ref":"§ 4.3.3 La protection des victimes (chap. 5) — p. 147","p":"La victime doit être protégée contre les risques de projections mécaniques lors de la désincarcération par l\u0027utilisation de couverture ou de bouclier de protection.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027agrès","q":"Selon le guide, de quoi le choix d\u0027une idée de manœuvre de désincarcération doit-il toujours s\u0027accompagner ?","c":["D\u0027une solution de remplacement","D\u0027une découpe systématique du toit","D\u0027une validation par les forces de l\u0027ordre","D\u0027un dégagement d\u0027urgence préventif"],"r":0,"e":"Le guide impose d\u0027accompagner toute idée de manœuvre de désincarcération d\u0027une solution de remplacement, afin d\u0027anticiper toute évolution négative de la situation. Il privilégie par ailleurs la reformation du véhicule à la découpe systématique de nombreuses parties.","ref":"§ 4.3.3 La protection des victimes (chap. 5) — p. 147","p":"Le choix d\u0027une idée de manœuvre de désincarcération doit toujours s\u0027accompagner d\u0027une solution de remplacement afin d\u0027anticiper toute évolution négative de la situation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Sur un véhicule « nouvelle génération » doté d\u0027une cellule de survie, quelle approche le guide privilégie-t-il pour libérer la victime ?","c":["La découpe systématique du toit et des montants pour une sortie dans l\u0027axe","Le retournement du véhicule pour accéder à la victime par le plancher","Le remorquage du véhicule vers une zone plus sûre avant toute découpe","La reformation, qui redonne du volume au véhicule ayant subi le choc"],"r":3,"e":"Les véhicules « nouvelle génération » disposent d\u0027une cellule de survie. La reformation, qui regroupe les actions visant à redonner du volume à un véhicule ayant subi un choc, suffit dans la plupart des situations à l\u0027extraction des victimes et doit être privilégiée à la découpe systématique de nombreuses parties du véhicule.","ref":"§ 4.4 La sécurisation des techniques (chap. 5) — p. 147","p":"La reformation regroupe l\u0027ensemble des actions visant à redonner du volume à un véhicule roulant ayant subi un choc. […] doit être privilégiée à la découpe systématique de nombreuses parties du véhicule.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Pour garantir une libération rapide de la victime en cas de besoin, comment les actions techniques de désincarcération sont-elles ordonnées ?","c":["De la victime (libération des pieds) vers l\u0027extérieur","De l\u0027extérieur (ouverture d\u0027un hayon) vers la victime","Du côté le moins déformé vers le côté le plus déformé","Du toit vers le plancher, quelle que soit la victime"],"r":0,"e":"Pour garantir la libération rapide de la victime en cas de besoin, l\u0027ensemble des actions techniques part de la victime (libération des pieds) vers l\u0027extérieur du cheminement d\u0027extraction (ouverture d\u0027un hayon). Le choix d\u0027une idée de manœuvre de désincarcération doit toujours s\u0027accompagner d\u0027une solution de remplacement.","ref":"§ 4.5 La sortie de la victime (chap. 5) — p. 148","p":"l\u0027ensemble des actions techniques mises en œuvre doit partir de la victime (libération des pieds) vers l\u0027extérieur du cheminement d\u0027extraction (ouverture d\u0027un hayon).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027agrès","q":"Un médecin est présent sur un accident avec victime incarcérée. À qui incombe la stratégie d\u0027extraction de la victime ?","c":["Au médecin, qui dirige aussi le choix des techniques de découpe","Au chef d\u0027équipe de désincarcération, sans concertation médicale","Aux forces de l\u0027ordre, qui doivent d\u0027abord achever les constatations","Au COS, qui s\u0027appuie sur les préconisations du médecin"],"r":3,"e":"La stratégie d\u0027extraction incombe au COS, au regard des contraintes imposées par l\u0027état de la victime. Lorsqu\u0027un médecin est présent, le COS s\u0027appuie sur lui pour parfaire l\u0027évaluation et recevoir ses préconisations (qualité d\u0027extraction, horizontalité stricte, immobilisation d\u0027un membre lésé…). En son absence, il anticipe la sortie en préparant les voies d\u0027extraction.","ref":"§ 4.5 La sortie de la victime (chap. 5) — p. 148","p":"La stratégie d\u0027extraction de la victime incombe au COS […] Le COS s\u0027appuie sur le médecin, lorsqu\u0027il est présent sur les lieux, pour parfaire l\u0027évaluation rapide des victimes et recevoir ses préconisations","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Selon le guide, dans quelle situation la sortie d\u0027une victime se fait-elle par un dégagement d\u0027urgence ?","c":["En présence d\u0027un danger réel vital, imminent et non contrôlable pour elle","Dès qu\u0027elle est incarcérée, sans attendre l\u0027arrivée du médecin sur les lieux","Lorsqu\u0027elle est consciente et peut participer elle-même à sa sortie","Lorsque l\u0027extraction nécessite la dépose complète du toit du véhicule"],"r":0,"e":"Le dégagement d\u0027urgence est réservé à un danger réel vital, imminent et non contrôlable pour la victime. Le guide distingue aussi l\u0027extraction rapide, qui privilégie le délai de mise en œuvre sur le respect strict de l\u0027axe tête-cou-tronc, et l\u0027extraction améliorée, quand la vie de la victime n\u0027est pas menacée dans l\u0027imminence.","ref":"§ 4.5 La sortie de la victime (chap. 5) — p. 148","p":"le dégagement d\u0027urgence : il est réalisé en présence d\u0027un danger réel vital, imminent et non contrôlable pour la victime","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027équipe","q":"Dans quelle situation la sortie de la victime se fait-elle par une extraction améliorée ?","c":["Lorsque le véhicule prend feu malgré la protection incendie","Lorsque sa vie n\u0027est pas menacée dans l\u0027imminence","Lorsqu\u0027il faut la sortir au plus vite, au détriment de l\u0027axe tête-cou-tronc","Lorsque l\u0027eau monte dans l\u0027habitacle d\u0027un véhicule immergé"],"r":1,"e":"L\u0027extraction améliorée permet de sortir la victime dans les meilleures conditions possibles, lorsque sa vie n\u0027est pas menacée dans l\u0027imminence. Une sortie au plus vite, privilégiant le délai sur le respect strict de l\u0027axe tête-cou-tronc, correspond à l\u0027extraction rapide ; un danger vital imminent et non contrôlable impose un dégagement d\u0027urgence.","ref":"§ 4.5 La sortie de la victime (chap. 5) — p. 148","p":"l\u0027extraction améliorée permettant de sortir la victime du véhicule accidenté dans les meilleures conditions possibles sans que sa vie ne soit menacée dans l\u0027imminence.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"SUAP et sortie de la victime","niv":"Chef d\u0027agrès","q":"Accident : la batterie HT d\u0027un véhicule électrique entre en emballement thermique (crépitements, bruit de gaz sous pression), un occupant à bord. Que décidez-vous pour l\u0027occupant ?","c":["Une extraction améliorée, après dépose complète du toit","Un maintien sur place en attendant l\u0027avis du médecin","Un dégagement d\u0027urgence des occupants du véhicule","Un refroidissement de la batterie avant toute sortie"],"r":2,"e":"Un emballement thermique de la batterie lors d\u0027un accident de circulation nécessite un dégagement d\u0027urgence des occupants ; il ne doit pas être confondu avec une simple fuite d\u0027électrolyte. Crépitements, bruit de gaz sous pression, épaississement des fumées ou flammes plus claires et plus vives caractérisent l\u0027emballement.","ref":"§ 5.2 Les fuites d\u0027énergie (chap. 5) — p. 150","p":"Ce type de situation est à différencier d\u0027un emballement thermique de la batterie, qui nécessitera en cas d\u0027accident de circulation, un dégagement d\u0027urgence des occupants du véhicule.","s":"gdo-sr"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Équipier","q":"Sur quel critère repose la distinction entre CCF léger (CCFL), moyen (CCFM) et super (CCFS) ?","c":["La masse totale en charge (MTC)","La capacité de la citerne en eau","Le nombre de places assises en cabine","Le débit maximal de la pompe"],"r":0,"e":"Le classement CCFL, CCFM et CCFS est une classification normative en fonction de la masse totale en charge ; il ne reflète pas les capacités opérationnelles du véhicule. Les CCFM sont classés en catégorie 3 (tout-terrain).","ref":"§ 1.1 Le camion-citerne feux de forêts — p. 17","p":"Le classement des engins (CCFL, CCFM, CCFS) ne concerne qu\u0027une classification normative en fonction de la MTC et ne reflète pas les capacités opérationnelles du véhicule.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Équipier","q":"Le camion-citerne rural (CCR) est classé en catégorie 2 au sens de la norme. Qu\u0027est-ce que cela implique pour son emploi en espace naturel ?","c":["Il peut évoluer en terrain non aménagé, comme un CCF moyen","Son emploi est réservé aux seuls feux de structure","Son emploi est limité à des terrains peu accidentés","Il ne peut circuler que sur les routes goudronnées"],"r":2,"e":"La catégorie 2 (rural) limite l\u0027emploi du CCR à des terrains peu accidentés, alors que les CCF moyens, classés en catégorie 3 (tout-terrain), peuvent se déplacer en terrain non aménagé. Le CCR est notamment employé dans la lutte contre les feux de récoltes sur pied.","ref":"§ 1.2 Le camion-citerne rural — p. 19","p":"Le camion-citerne rural est classé en catégorie 2 au sens de la norme 1846-1, ce qui limite son emploi à des terrains peu accidentés.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un FPT, premier engin arrivé sur un feu d\u0027espace naturel, mais son châssis l\u0027empêche d\u0027aller au contact du feu. À quoi le réservez-vous ?","c":["À l\u0027attaque du front par un établissement de grande longueur","À la défense de point sensible ou à la réalimentation des CCF","Au jalonnement du flanc en attendant l\u0027arrivée des premiers CCF","À l\u0027ouverture d\u0027un accès vers le front pour les autres CCF"],"r":1,"e":"Le châssis d\u0027un engin-pompe urbain limite ses capacités d\u0027évolution en espace naturel. S\u0027il ne peut pas aller au contact du feu, il est réservé à la défense de point sensible (habitation, bâtiment d\u0027exploitation), à la protection d\u0027équipements et matériels ou à la réalimentation des engins adaptés comme les CCF.","ref":"§ 1.5 L\u0027engin-pompe urbain — p. 20","p":"ne peut pas aller au contact du feu (FPT, etc.), il convient de le réserver à la défense de point sensible (habitation, bâtiment d\u0027exploitation…), à la protection d\u0027équipements et matériels ou à la réalimentation des engins adaptés","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Équipier","q":"De quoi est constitué un groupe d\u0027intervention feux de forêts (GIFF) ?","c":["1 VLHR et 2 CCF de classe M ou S","1 VLHR et 4 CCF de classe M","2 VLHR et 6 CCF de classe M","1 VLHR et 3 CCF de classe S"],"r":1,"e":"Le GIFF est constitué d\u0027un VLHR et de 4 CCF de classe M, placé sous les ordres d\u0027un chef de groupe feux de forêts (FDF3). L\u0027UIFF, elle, est constituée de 2 CCF de classe M ou S, sous le commandement d\u0027un chef d\u0027unité de niveau chef d\u0027agrès feux de forêts (FDF2).","ref":"§ 2.3 Le groupe d\u0027intervention feux de forêts (GIFF) — p. 22","p":"Le groupe d\u0027intervention feux de forêts est constitué d\u0027un VLHR et de 4 CCF de classe M, placé sous les ordres d\u0027un chef de groupe feux de forêts. (FDF3)","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Équipier","q":"Le forestage consiste à employer des engins de génie civil (bulldozers, broyeurs) ou des outils portables. Dans quel but ?","c":["Transporter les équipes et le matériel près du front","Assurer la noria d\u0027eau entre le point d\u0027eau et le chantier","Dégager les engins enlisés ou en panne sur les pistes","Créer des accès au feu ou une trouée séparant le combustible"],"r":3,"e":"Le forestage utilise des engins lourds du génie civil (bulldozers, broyeurs de végétaux) ou du matériel portable (tronçonneuses, débroussailleuses) afin de créer des accès au feu ou une trouée dans la végétation pour séparer le combustible. Le COS peut aussi employer un bulldozer pour créer des pénétrantes ou sécuriser des lisières.","ref":"§ 3.1.2 Les équipes de forestage — p. 25","p":"Le forestage consiste à utiliser des engins lourds du génie civil […] afin de créer des accès au feu ou une trouée dans la végétation pour séparer le combustible.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Engins et moyens d\u0027intervention","niv":"Équipier","q":"Où les équipes retardant terrestre créent-elles leur ligne d\u0027appui retardant ?","c":["En aval du front, pour renforcer une zone d\u0027appui","Au cœur de la zone brûlée, contre les reprises","Autour des CCF en autodéfense, pour les protéger","Sur les pistes, pour les rendre praticables"],"r":0,"e":"Conditionnées dans des porteurs lourds, les équipes retardant terrestre créent une ligne d\u0027appui retardant en aval du front de feu afin de renforcer une zone d\u0027appui à la lutte. Il existe des retardants long terme (RLT) et des retardants court terme, moussants (RCT).","ref":"§ 3.1.3 Les équipes retardant terrestre — p. 25","p":"ces équipes vont permettre de créer une ligne d\u0027appui retardant en aval du front de feu afin de renforcer une zone d\u0027appui à la lutte.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Équipier","q":"Que désigne le terme « lance 500 » dans le guide de techniques opérationnelles feux de forêts ?","c":["Une lance à débit variable alimentée en DN 25, débit maximal 500 l/min","Une lance à débit fixe alimentée en DN 70, débitant 500 l/min","Une lance à débit variable alimentée en DN 70, débit minimal 500 l/min","Une lance à débit variable alimentée en DN 45, débit maximal 500 l/min"],"r":3,"e":"La lance 500 est une lance à débit variable alimentée par un tuyau souple DN 45, d\u0027un débit maximal de 500 l/min. La lance 150, également à débit variable, est alimentée en DN 25 pour un débit maximal de 150 l/min.","ref":"§ 4.1 Les lances — p. 30","p":"les lances à débit variable alimentées par un tuyau souple DN 45 offrant un débit maximal de 500 litres par minute. Elles sont dénommées dans le présent guide sous le terme lance 500","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Équipier","q":"À quoi sert principalement une lance queue de paon lors de la lutte contre les feux d\u0027espaces naturels ?","c":["À créer un rideau d\u0027eau qui protège du rayonnement thermique","À projeter un jet droit à longue portée sur la tête du feu","À noyer les souches en profondeur lors du traitement des lisières","À alimenter deux lances 150 à partir d\u0027un seul tuyau de 45"],"r":0,"e":"La lance queue de paon crée un rideau d\u0027eau, utilisé lors des manœuvres d\u0027autodéfense d\u0027un groupe et pour protéger bâtiments, véhicules et personnels contre le rayonnement. Alimentée en DN 45 à 500 l/min, elle forme un écran d\u0027environ 7 m de haut sur 25 m de large ; en DN 70 à 1000 l/min, d\u0027environ 10 m sur 30 m.","ref":"§ 4.1 Les lances — p. 30","p":"Les lances queue de paon ont la particularité de créer un rideau d\u0027eau qui est utilisé lors des manœuvres d\u0027autodéfense d\u0027un groupe mais aussi pour : • protéger les bâtiments, les véhicules, les personnels contre le rayonnement,","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Chef d\u0027équipe","q":"Quel est le rôle de la vanne d\u0027arrêt FDF mise en place sur un établissement ?","c":["Réguler à la lance la pression de refoulement en fonction du relief","Faire passer la lance du jet droit au jet diffusé sans couper l\u0027eau","Garder l\u0027établissement en eau pour raccorder, prolonger ou transformer","Répartir le débit de la lance 500 entre deux lances 150 sur la division"],"r":2,"e":"La vanne d\u0027arrêt FDF permet de maintenir l\u0027établissement en eau pendant que l\u0027on débranche ou raccorde une lance, que l\u0027on établit les tuyaux d\u0027un prolongement ou d\u0027une transformation, ou que l\u0027on interrompt puis poursuit l\u0027extinction. Elle aide ainsi à maintenir le plus possible la permanence de l\u0027eau.","ref":"§ 4.3 La vanne d\u0027arrêt — p. 31","p":"La vanne d\u0027arrêt FDF mise en place sur l\u0027établissement permet de le maintenir en eau tout en procédant aux opérations suivantes : • débrancher ou raccorder une lance ; • établir le nombre de tuyaux correspondant au prolongement","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Chef d\u0027équipe","q":"Sur un établissement de grande longueur en pente positive, quel est l\u0027intérêt de la division mixte FDF à clapet si un tuyau se rompt ?","c":["Elle coupe l\u0027alimentation de la pompe pour protéger le conducteur","Elle évite la perte de la colonne d\u0027eau située en amont du clapet","Elle bascule automatiquement l\u0027eau vers une lance 150 de secours","Elle réduit la pression pour éviter le fouettement du tuyau rompu"],"r":1,"e":"La division mixte FDF à clapet maintient en eau l\u0027établissement de grande longueur sur les pentes positives en cas de rupture d\u0027un tuyau, en évitant la perte de la colonne d\u0027eau en amont du clapet. Elle fait aussi gagner du temps au refoulement (environ une minute pour cent mètres) et permet d\u0027ajouter une ou deux lances 150.","ref":"§ 4.4 La division mixte FDF — p. 31","p":"La division mixte FDF à clapet maintient en eau l\u0027établissement de grande longueur sur les pentes positives en cas de rupture d\u0027un tuyau en évitant la perte de la colonne d\u0027eau se trouvant en amont de ce clapet","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Équipier","q":"Le CCF doit se ravitailler à l\u0027hydro-éjecteur sur un point d\u0027eau naturel, faute de pouvoir se mettre en aspiration. Quelle réserve minimale doit rester dans la citerne ?","c":["100 litres","200 litres","300 litres","600 litres"],"r":2,"e":"L\u0027hydro-éjecteur permet de ravitailler l\u0027engin sur un point d\u0027eau naturel ou artificiel lorsque la mise en aspiration est impossible. Cette manœuvre nécessite une quantité suffisante d\u0027eau dans la citerne : 300 litres au minimum.","ref":"§ 4.5 Les autres matériels — p. 31","p":"L\u0027hydro-éjécteur permet le ravitaillement de l\u0027engin sur des points d\u0027eau naturels ou artificiels en cas d\u0027impossibilité de mise en aspiration. Cette manœuvre nécessite de disposer d\u0027une quantité suffisante d\u0027eau dans la citerne (300 litres).","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Équipier","q":"Pour quel usage le GTO prévoit-il le seau-pompe dorsal ?","c":["L\u0027alimentation d\u0027un CCF sur un point d\u0027eau naturel ou artificiel","La protection de la cabine du CCF lors de l\u0027autoprotection","Les feux de faible importance et la surveillance en périphérie","Le remplissage en carburant de la torche d\u0027égouttement"],"r":2,"e":"Variante du seau-pompe à main, le seau-pompe dorsal sert à l\u0027extinction de feux de faible importance (broussailles et autres végétaux) ainsi qu\u0027à la surveillance et à l\u0027extinction complète en périphérie des zones affectées par les feux de forêts.","ref":"§ 4.5 Les autres matériels — p. 31","p":"Il est utilisé pour l\u0027extinction de feux de faible importance, de broussailles et autres végétaux ainsi pour la surveillance et l\u0027extinction complète en périphérie des zones affectées par les feux de forêts.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Chef d\u0027équipe","q":"Selon le GTO, dans quels cas les outils de forestage (serpe, pelle, pioche, tronçonneuse…) sont-ils parfois les seuls moyens de lutte ?","c":["En terrain inaccessible aux moyens classiques ou en feu d\u0027humus","Sur les feux de chaumes, afin d\u0027économiser l\u0027eau des CCF","En interface habitat-forêt, pour protéger les haies des jardins","Sur les feux de cimes, pour abattre rapidement les arbres en feu"],"r":0,"e":"Les outils de forestage peuvent servir dans toutes les phases de la lutte (ouverture d\u0027accès, débroussaillage préventif, aménagement de terrain). En complément d\u0027extinction, ils sont quelquefois les seuls moyens de lutte sur un terrain inaccessible aux moyens traditionnels ou dans les feux d\u0027humus.","ref":"§ 4.7 Les matériels de forestage — p. 32","p":"En complément d\u0027extinction, ils sont quelquefois les seuls moyens de lutte sur le terrain inaccessible aux moyens traditionnels ou dans les feux d\u0027humus.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Matériels de lutte","niv":"Chef d\u0027agrès","q":"Que permet de reporter sur une carte la réglette feux de forêts ?","c":["L\u0027emplacement des points d\u0027eau DFCI les plus proches","L\u0027axe principal de propagation du sinistre","Les limites des secteurs attribués à chaque groupe","La position des engins engagés sur le chantier"],"r":1,"e":"La réglette feux de forêts est un dispositif de traçage rapide de direction permettant de reporter sur une cartographie l\u0027axe principal de propagation du sinistre. Ses deux échelles (1/25 000 et 1/100 000) facilitent la projection de la vitesse de propagation théorique.","ref":"§ 4.10 La réglette feux de forêts — p. 33","p":"La réglette feux de forêts est un dispositif de traçage rapide de direction permettant de reporter sur une cartographie l\u0027axe principal de propagation du sinistre.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Équipier","q":"Vous travaillez à proximité d\u0027un hélicoptère dont le rotor tourne. Quelles consignes de protection appliquez-vous ?","c":["Casque, lunettes baissées, se baisser tant que le rotor tourne","Casque retiré pour mieux entendre les consignes de l\u0027équipage","Rester debout près de la machine pour être bien vu du pilote","Se tenir face au souffle, lunettes relevées pour mieux voir"],"r":0,"e":"Le rotor des hélicoptères et les largages exposent à des projections de matériaux et à des chutes dues au souffle. Il faut porter son casque, lunettes baissées, se baisser tant que le rotor est en mouvement et ne jamais rester sous la machine ni dans sa zone d\u0027évolution.","ref":"§ 1 La sécurité individuelle (risques liés aux matériels) — p. 36","p":"Porter son casque lunettes […] Baissées. […] Se baisser tant que le rotor […] est en mouvement.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Équipier","q":"Un largage d\u0027aéronef est annoncé sur votre secteur. Quelle zone devez-vous évacuer, quel que soit l\u0027appareil ?","c":["L\u0027axe de largage, sur 10 mètres de part et d\u0027autre","L\u0027axe de largage, sur 40 mètres de part et d\u0027autre","L\u0027axe de largage, sur 80 mètres de part et d\u0027autre","L\u0027axe de largage, sur 150 mètres de part et d\u0027autre"],"r":1,"e":"Les largages exposent à des projections de matériaux et à des chutes par déséquilibre dues au souffle. Quel que soit l\u0027appareil, il faut évacuer l\u0027axe de largage sur 40 mètres de part et d\u0027autre ; le retardant, produit visqueux, peut en outre entraîner des chutes.","ref":"§ 1 La sécurité individuelle (risques liés aux matériels) — p. 36","p":"Quel que soit l\u0027appareil, […] évacuer l\u0027axe de largage (40 […] mètres de part et d\u0027autre).","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Chef d\u0027équipe","q":"Le binôme repère une ligne haute tension au-dessus de sa zone d\u0027action. Quelle conduite le GTO prescrit-il ?","c":["Faire couper le courant soi-même au poste le plus proche","Arroser la ligne en jet droit pour refroidir les câbles","Poursuivre l\u0027action dessous, la fumée isolant les câbles","Ne pas rester sous la ligne et prévenir le chef d\u0027agrès"],"r":3,"e":"Près des lignes haute tension, un arc électrique peut s\u0027amorcer sous l\u0027effet de la haute température et de la fumée. Il ne faut pas rester sous les lignes THT encore sous tension et il faut prévenir le chef d\u0027agrès de leur présence.","ref":"§ 1 La sécurité individuelle (risques liés au terrain) — p. 36","p":"Lignes haute tension […] Arc électrique amorcé par la […] Ne pas rester sous les lignes […] THT encore sous tension, Prévenir le chef d\u0027agrès de […] leur présence.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Équipier","q":"Sur un feu de forêt, chaleur et effort exposent à la déshydratation. Quelle conduite le GTO prescrit-il ?","c":["Boire l\u0027eau de la citerne du CCF pour économiser les bouteilles","Boire uniquement aux repas pour ne pas interrompre l\u0027action","Boire avant d\u0027avoir soif, en prévoyant des bouteilles d\u0027eau","Limiter la boisson pour réduire la transpiration sous la tenue"],"r":2,"e":"Face au risque de déshydratation lié à la chaleur et à l\u0027effort, il faut boire avant d\u0027avoir soif (prévoir des bouteilles d\u0027eau). L\u0027eau de la citerne du véhicule ne doit pas être bue, ni utilisée sur des plaies, en raison des risques d\u0027infection et d\u0027intoxication.","ref":"§ 1 La sécurité individuelle (risques liés à la vie sur le terrain) — p. 37","p":"Chaleur, effort […] Déshydratation […] Boire avant d\u0027avoir soif (prévoir bouteilles d\u0027eau)","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Équipier","q":"Vous êtes conducteur de CCF. Comment positionnez-vous votre engin à l\u0027arrêt sur le chantier ?","c":["Face au feu, moteur coupé pour économiser le carburant","Dans le sens du départ, moteur tournant, calé si nécessaire","En travers de la piste pour en bloquer l\u0027accès au public","Au plus près de la végétation pour raccourcir l\u0027établissement"],"r":1,"e":"Le conducteur positionne son véhicule dans le sens du départ, moteur tournant, en le calant si nécessaire, et le range sur le bord de la piste sans gêner la progression des autres véhicules. Il veille la radio et la permanence de l\u0027eau.","ref":"§ 1.1 L\u0027équipier et conducteur — p. 37","p":"range son véhicule sur le bord de la piste de façon à ne pas gêner la progression des autres véhicules. Il positionne son véhicule dans le sens du départ et moteur tournant en le calant si nécessaire.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un CCF engagé seul ; un hélicoptère bombardier d\u0027eau arrive sur votre feu. Que vous revient-il de faire ?","c":["Assurer la liaison radio, signaler les obstacles et autoriser le largage","Laisser le pilote choisir seul son axe, sans liaison radio avec le sol","Poster un équipier sous l\u0027axe de largage pour guider le pilote","Attendre un chef de groupe avant tout contact avec le pilote"],"r":0,"e":"Lorsque le CCF intervient isolé, le chef d\u0027agrès assure la liaison radio avec les pilotes des moyens aériens et leur signale les obstacles (antennes relais, lignes HT). Il donne l\u0027autorisation de largage après s\u0027être assuré qu\u0027aucun personnel n\u0027est présent dans la zone de largage.","ref":"§ 1.2 Le chef d\u0027agrès — p. 38","p":"Il assure la liaison radio avec les pilotes des moyens aériens s\u0027ils sont présents et leur signale les obstacles (antennes relais, lignes HT, etc.). [...] Il donne l\u0027autorisation de largage","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Sécurité individuelle et rôles","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un CCF engagé au sein d\u0027un GIFF. À quel moment faites-vous établir vos moyens hydrauliques ?","c":["Dès l\u0027arrivée sur la zone, à votre initiative, pour gagner du temps","Dès que le CCF qui vous précède a ouvert sa lance","Sur ordre du chef de groupe, dont vous connaissez l\u0027idée de manœuvre","Dès que votre conducteur vous a confirmé le niveau d\u0027eau de la citerne"],"r":2,"e":"En groupe, le chef d\u0027agrès connaît l\u0027idée de manœuvre du chef de groupe et attend son ordre avant de faire établir les moyens hydrauliques. En revanche, pour un CCF ou une unité intervenant de manière isolée, il adapte lui-même son idée de manœuvre en fonction de l\u0027importance du feu.","ref":"§ 1.2 Le chef d\u0027agrès — p. 39","p":"Dans le cas du CCF intervenant en groupe, le chef d\u0027agrès connait l\u0027idée de manœuvre du chef de groupe et attend l\u0027ordre du chef de groupe avant de faire établir les moyens hydrauliques.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027équipe","q":"Le feu est à plusieurs centaines de mètres de votre point d\u0027attaque. Pourquoi une saute de feu reste-t-elle une menace pour le binôme ?","c":["Elle produit surtout des fumées, sans risque thermique","Elle peut générer un nouveau front de flammes puissant près du binôme","Elle ne peut menacer que les engins stationnés, jamais le personnel","Elle s\u0027éteint d\u0027elle-même faute de combustible avant de l\u0027atteindre"],"r":1,"e":"Les sautes de feu, même lorsque le feu se trouve à plusieurs centaines de mètres du point d\u0027attaque ou de stationnement des véhicules, peuvent générer un nouveau front de flammes puissant à proximité des personnels en phase de travail (établissement, apport de matériel, forestage…).","ref":"§ 2 La protection des personnels à pied — p. 41","p":"des sautes de feux, même lorsque ce dernier se trouve à plusieurs centaines de mètres du point d\u0027attaque ou de stationnement des véhicules, peuvent générer un nouveau front de flammes puissant à proximité des personnels","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027équipe","q":"Le binôme observe le feu. Quels phénomènes le GTO signale-t-il comme pouvant menacer directement et très rapidement les personnels ?","c":["Fumée qui s\u0027éclaircit et flammes qui baissent","Baisse de la température et remontée de l\u0027hygrométrie","Accélération brutale et changement d\u0027axe de propagation","Arrivée des moyens aériens et premiers largages"],"r":2,"e":"Les feux d\u0027espaces naturels peuvent générer des sautes de feu, une accélération brutale (hauteur des flammes, puissance et vitesse de propagation) et un changement de l\u0027axe de propagation ou de la direction du front. Ces phénomènes peuvent se cumuler et conduire à l\u0027encerclement très rapide des personnels.","ref":"§ 2 La protection des personnels à pied — p. 41","p":"une accélération brutale de l\u0027incendie, la hauteur des flammes, la puissance du front, et surtout la vitesse de propagation peuvent augmenter très rapidement ; un changement de l\u0027axe de propagation et/ou de la direction de son front de flammes","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Équipier","q":"Face à un événement brutal (saute de feu, accélération soudaine), que le guide désigne-t-il comme l\u0027unique espace de survie des personnels ?","c":["Le dessous du châssis du CCF, à l\u0027abri du rayonnement","La végétation non brûlée située en contrebas du front de feu","Le couvert d\u0027un bosquet dense, à l\u0027abri des flammes","La cabine du véhicule avec ses équipements de protection"],"r":3,"e":"Selon le guide, la cabine du véhicule, avec ses équipements de protection, reste et restera toujours l\u0027unique espace de survie face à un événement brutal. Le repli d\u0027urgence vise à ramener l\u0027équipage dans la cabine ; lorsqu\u0027il est impossible, il peut permettre de rejoindre une zone de repli désignée au préalable.","ref":"§ 2.1 Généralités (protection des personnels à pied) — p. 42","p":"La cabine du véhicule, avec ses équipements de protection des personnels intrinsèque reste et restera toujours l\u0027unique espace de survie pour les personnels face à un évènement brutal.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Pendant l\u0027établissement, vous indiquez à vos personnels une zone pyro-résistante proche. Laquelle est à privilégier ?","c":["La zone déjà brûlée","Un sous-bois dense et ombragé","Un fond de vallon boisé","La végétation verte en aval du front"],"r":0,"e":"Lors des phases d\u0027établissement ou de lutte, le chef d\u0027agrès informe ses personnels de la zone pyro-résistante proche et de l\u0027itinéraire de repli jusqu\u0027à l\u0027engin. La zone brûlée reste à privilégier ; un cabanon, une maison, une piscine ou un point d\u0027eau peuvent aussi être exploités.","ref":"§ 2.1 Généralités (protection des personnels à pied) — p. 42","p":"les chefs d\u0027agrès informent leurs personnels de : la présence le cas échéant d\u0027une zone pyro-résistante à proximité. La zone brûlée reste à privilégier","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027équipe","q":"Quel est l\u0027intérêt de créer un sentier approximativement débroussaillé entre l\u0027engin et le point d\u0027attaque ?","c":["Servir de zone d\u0027appui pour l\u0027allumage d\u0027un futur contre-feu","Permettre un retour rapide à l\u0027engin et limiter la désorientation","Faciliter le passage des engins de génie civil jusqu\u0027à la lisière","Réduire les pertes de charge en raccourcissant l\u0027établissement"],"r":1,"e":"Ce sentier, appelé draille en Provence, permet un retour rapide à l\u0027engin, diminue le risque de désorientation et facilite l\u0027acheminement de matériel supplémentaire. Il complète l\u0027information donnée par le chef d\u0027agrès sur l\u0027itinéraire de repli jusqu\u0027à l\u0027engin.","ref":"§ 2.1 Généralités (protection des personnels à pied) — p. 42","p":"permettant un retour rapide à l\u0027engin, de diminuer le risque de désorientation, et l\u0027acheminement plus aisé de matériel supplémentaire","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027agrès","q":"Vous faites jalonner l\u0027établissement avec des lances 20/7 sur tuyaux de 20 m, disposées et signalées à vos personnels. Dans quel but ?","c":["Augmenter le débit total disponible au point d\u0027attaque","Baliser l\u0027itinéraire d\u0027accès des renforts jusqu\u0027au chantier","Préparer un futur prolongement de l\u0027établissement principal","Protéger le personnel entre l\u0027engin et le point d\u0027attaque"],"r":3,"e":"Ce jalonnement, au moyen de lances 20/7 et de tuyaux de 20 mètres judicieusement disposés et indiqués aux personnels, permet de les protéger en cas de dégradation de la situation entre l\u0027engin et le point d\u0027attaque (saute de feu, arrivée rapide du feu derrière le point d\u0027attaque…).","ref":"§ 2.1 Généralités (protection des personnels à pied) — p. 42","p":"le jalonnement le long de l\u0027établissement au moyen de lances de 20/7 […] permet de protéger le personnel en cas de dégradation de la situation entre l\u0027engin et le point d\u0027attaque","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Protection des personnels à pied","niv":"Chef d\u0027équipe","q":"Un binôme en difficulté alerte immédiatement son niveau N+1 par radio. Quelles informations doit-il pouvoir indiquer ?","c":["La situation, sa position précise et la protection envisagée","Son indicatif, le débit de sa lance et la pression à l\u0027engin","Le nombre de tuyaux établis et le volume d\u0027eau restant à bord","La direction du vent, la température et l\u0027hygrométrie relevées"],"r":0,"e":"Le contact radio doit être constant entre tous les échelons. L\u0027alerte du niveau N+1 (chef d\u0027agrès, chef de GIFF, chef de secteur…) doit pouvoir se faire immédiatement pour indiquer la situation, la position la plus précise possible et le moyen de protection provisoire envisagé (repli, mise à l\u0027abri, refuge dans le brûlé…).","ref":"§ 2.1 Généralités (protection des personnels à pied) — p. 42","p":"L\u0027alerte du niveau N+1 […] doit pouvoir se faire immédiatement afin que le personnel en difficulté puisse indiquer : la situation ; la position la plus précise possible ; le moyen de protection provisoire envisagé","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Équipier","q":"Le chef d\u0027agrès donne l\u0027ordre de repli d\u0027urgence. Que font d\u0027abord les personnels à la lance ?","c":["Ils s\u0027accroupissent, lance ouverte en jet diffusé de protection","Ils courent vers le CCF en abandonnant la lance fermée","Ils ferment la lance et enroulent le tuyau pour le ramener","Ils restent debout et passent la lance en jet droit"],"r":0,"e":"Au repli d\u0027urgence, les personnels s\u0027accroupissent au sol, la lance restant ouverte en jet diffusé de protection, puis coiffent leur masque de fuite. Le tuyau sert ensuite de ligne guide pour retrouver le CCF, la lance restant posée au sol, ouverte en jet diffusé.","ref":"§ 2.2 Le repli d\u0027urgence — p. 43","p":"Le chef d\u0027agrès donne l\u0027ordre de repli. […] Les personnels s\u0027accroupissent au sol. La lance reste ouverte en jet diffusé de protection.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Équipier","q":"À quoi le masque de fuite porté en feux de forêts est-il exclusivement destiné ?","c":["Aux reconnaissances rapides dans la fumée","Au repli ou au dégagement d\u0027urgence","Aux sauvetages de personnes piégées par le feu","Au travail prolongé sur les lisières enfumées"],"r":1,"e":"Le masque de fuite est un appareil isolant uniquement destiné au repli ou au dégagement d\u0027urgence ; il ne doit pas être utilisé pour des sauvetages ou des reconnaissances. Son autonomie est de 6 minutes ; si le phénomène est fulgurant, il peut être mis pendant le retour, lorsque l\u0027air devient irrespirable.","ref":"§ 2.2 Le repli d\u0027urgence — p. 43","p":"Cet appareil isolant, uniquement destiné à au repli ou au dégagement d\u0027urgence […] ne doit pas être utilisé pour réaliser des sauvetages et/ou des reconnaissances.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Chef d\u0027équipe","q":"Repli d\u0027urgence dans la fumée : sur quoi l\u0027équipage à pied s\u0027appuie-t-il pour retrouver le CCF ?","c":["Une corde tendue depuis le CCF avant le début de l\u0027attaque","Un azimut relevé à la boussole avant l\u0027engagement","Les traces laissées par le CCF dans la zone brûlée","Le tuyau de l\u0027établissement, utilisé comme ligne guide"],"r":3,"e":"Le chef d\u0027agrès organise le repli : le tuyau sert de ligne guide pour retrouver le CCF. Le chef d\u0027agrès tient ce tuyau et les équipiers le tiennent également, tandis que la lance reste posée au sol, ouverte en jet diffusé de protection.","ref":"§ 2.2 Le repli d\u0027urgence — p. 44","p":"Le chef d\u0027agrès organise le repli Le tuyau sert de ligne guide pour retrouver le CCF.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Équipier","q":"Dès le début d\u0027une situation d\u0027urgence imposant le repli de l\u0027équipe à pied vers le CCF, quel est le rôle du conducteur ?","c":["Partir à la rencontre de l\u0027équipe le long du tuyau","Dégager le CCF vers la zone de repli sans attendre son équipe","Enclencher l\u0027autoprotection et accueillir l\u0027équipe à l\u0027arrière","Couper le moteur et attendre l\u0027équipe dans la cabine"],"r":2,"e":"Dès le début de la situation d\u0027urgence, le conducteur enclenche l\u0027autoprotection et reste à l\u0027arrière du camion, masque de fuite coiffé si nécessaire. Il fait le point avec le chef d\u0027agrès pour s\u0027assurer que tout le personnel est présent, réceptionne ses coéquipiers et les répartit vers l\u0027intérieur de la cabine.","ref":"§ 2.2 Le repli d\u0027urgence — p. 45","p":"enclenche l\u0027autoprotection et reste à l\u0027arrière de son camion. Il percute et coiffe son masque de fuite si nécessaire.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Chef d\u0027équipe","q":"Lors du repli d\u0027urgence, le CCF est exposé au flux thermique. Par quel côté l\u0027équipage regagne-t-il la cabine ?","c":["Par la face non exposée, en longeant le CCF grâce au balisage","Par la face exposée, plus directe depuis le point d\u0027attaque","Par l\u0027arrière du CCF, en passant au-dessus de la citerne","Par le côté du conducteur, quelle que soit l\u0027exposition"],"r":0,"e":"Selon l\u0027exposition du CCF, le conducteur fait pénétrer tout le personnel par la face non exposée au flux thermique. Les personnels longent le CCF en se servant du balisage extérieur, puis ouvrent la surpression de la cabine et l\u0027air respirable et coiffent les demi-masques.","ref":"§ 2.2 Le repli d\u0027urgence — p. 46","p":"En fonction de l\u0027exposition du CCF, il fait pénétrer tout le personnel par la face non exposée au flux thermique. Les personnels longent le CCF en se servant du balisage extérieur pour regagner la cabine.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Repli d\u0027urgence","niv":"Équipier","q":"Après un repli d\u0027urgence, l\u0027équipage a regagné la cabine du CCF. Que font alors les personnels ?","c":["Ils ouvrent les vitres pour surveiller l\u0027avancée du feu","Ils retirent casque et masque pour mieux respirer","Ils ressortent dès que l\u0027avertisseur sonore retentit","Ils ouvrent la surpression cabine et l\u0027air respirable"],"r":3,"e":"Une fois en cabine, les personnels ouvrent la surpression de la cabine ainsi que l\u0027air respirable et coiffent les demi-masques ; le conducteur actionne l\u0027avertisseur sonore. La cabine, avec ses équipements de protection, reste l\u0027unique espace de survie face à un événement brutal.","ref":"§ 2.2 Le repli d\u0027urgence — p. 46","p":"Les personnels ouvrent la surpression de la cabine ainsi que l\u0027air respirable. Les personnels coiffent les demi-masques d\u0027air respirable.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Autoprotection et autodéfense","niv":"Équipier","q":"Que désigne la capacité d\u0027autoprotection (CA) d\u0027un camion-citerne feux de forêts ?","c":["La réserve d\u0027eau destinée aux lances et aux canons d\u0027extinction","L\u0027autonomie en air respirable de la cabine de l\u0027engin","La quantité d\u0027eau à garder pour réalimenter un autre CCF","La réserve d\u0027eau dédiée à la protection thermique de l\u0027engin"],"r":3,"e":"La capacité d\u0027autoprotection est une réserve d\u0027eau dédiée à la protection thermique du véhicule. La capacité utile (CU), utilisée par les lances et canons pour l\u0027extinction, exclut cette réserve. L\u0027autoprotection comprend notamment un système de protection thermique avec aspersion de la cabine et un système d\u0027air respirable.","ref":"§ 3.1 Les capacités d\u0027autoprotection des CCF — p. 47","p":"La capacité d\u0027autoprotection (CA) d\u0027un camion-citerne feux de forêt est une réserve d\u0027eau dédiée à la protection thermique du véhicule.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Autoprotection et autodéfense","niv":"Équipier","q":"Quelle autonomie minimale offre le système d\u0027air respirable intégré à la cabine d\u0027un CCF ?","c":["6 minutes pour 2 personnes","10 minutes pour 4 personnes","20 minutes pour 4 personnes","30 minutes pour 2 personnes"],"r":1,"e":"Le système d\u0027air respirable fait partie des aménagements de sécurité de l\u0027autoprotection : il offre une autonomie minimale de 10 minutes pour 4 personnes, sur la base d\u0027une consommation de 30 l/min par personne. Les 6 minutes correspondent à l\u0027autonomie du masque de fuite.","ref":"§ 3 L\u0027autoprotection des CCF — p. 47","p":"d\u0027un système d\u0027air respirable offrant une autonomie minimale de 10 minutes pour 4 personnes une consommation de 30l/min par personne.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Autoprotection et autodéfense","niv":"Chef d\u0027agrès","q":"Votre CCF et son équipage sont directement menacés par le feu. Parmi ces actions, laquelle relève du chef d\u0027agrès selon le guide ?","c":["Faire ouvrir les vitres de la cabine pour mieux observer le front","Faire couper le moteur et les avertisseurs pour économiser l\u0027énergie","Faire descendre l\u0027équipage pour établir une lance 500 de protection","Déclencher la communication de détresse (bouton d\u0027urgence ANTARES)"],"r":3,"e":"Personnel directement menacé, le chef d\u0027agrès dégage si possible l\u0027engin vers une zone sécurisée, assure l\u0027intégrité de l\u0027habitacle, regroupe les personnels dans le CCF, fait mettre en œuvre l\u0027autoprotection et l\u0027air respirable, alerte sa hiérarchie, demande des renforts et déclenche la communication de détresse (bouton ANTARES, géolocalisation). Il fait activer les avertisseurs sonores et lumineux.","ref":"§ 3.2 La mise en œuvre de l\u0027autoprotection — p. 48","p":"déclenche la communication de détresse (bouton d\u0027urgence ANTARES, géolocalisation) ; • fait activer les avertisseurs sonores et lumineux.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Autoprotection et autodéfense","niv":"Chef d\u0027agrès","q":"Attaque en UIFF : le CCF de tête tombe en panne pendant l\u0027attaque et prévient les CCF qui le suivent. Que fait immédiatement le 2e CCF ?","c":["Il le dépasse côté végétation non brûlée pour faire écran aux flammes","Il le dépasse côté zone brûlée pour poursuivre seul l\u0027attaque","Il recule vers la zone de repli et attend l\u0027arrivée des renforts","Il s\u0027arrête derrière lui et le remorque aussitôt vers la piste"],"r":0,"e":"Le CCF en panne ou enlisé prévient sa hiérarchie et les CCF qui le suivent. Le 2e CCF dépasse immédiatement le 1er du côté de la végétation non brûlée, de façon à s\u0027interposer entre les flammes et lui, et reste en protection jusqu\u0027à l\u0027arrivée des renforts.","ref":"§ 4.2 L\u0027autodéfense de l\u0027UIFF à l\u0027attaque — p. 50","p":"Le 2ème CCF dépasse immédiatement le 1er CCF en panne du côté de la végétation non brûlée de façon à s\u0027interposer entre les flammes et le CCF.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Autoprotection et autodéfense","niv":"Chef d\u0027agrès","q":"Dans quelle situation un largage de sécurité peut-il être demandé aux moyens aériens ?","c":["Pour appuyer une attaque de flanc qui peine à progresser","Pour traiter rapidement une saute de feu menaçant un établissement","Pour secourir un engin ou un groupe en situation d\u0027autodéfense","Pour noyer une lisière active avant la tombée de la nuit"],"r":2,"e":"Le largage de sécurité est effectué délibérément sur un véhicule ou un groupe en difficulté pour faire tomber les flammes et la température et permettre au personnel de se dégager. Ce n\u0027est pas un appui aérien : il n\u0027est demandé qu\u0027en situation d\u0027autodéfense.","ref":"§ 4.5 Le largage de sécurité — p. 56","p":"A ce titre, le largage de sécurité n\u0027est demandé qu\u0027en situation d\u0027autodéfense.","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Équipier","q":"Quel que soit l\u0027établissement réalisé par un CCF, dans quel sens s\u0027exécutent les manœuvres ?","c":["Du point d\u0027attaque vers l\u0027engin, en remontant l\u0027établissement","Du point d\u0027eau vers le point d\u0027attaque","Du milieu de l\u0027établissement vers ses deux extrémités","Dans le sens fixé par l\u0027équipier 1 selon le terrain"],"r":1,"e":"Toutes les manœuvres s\u0027exécutent du point d\u0027eau vers le point d\u0027attaque : elles ont été élaborées pour maintenir la permanence de l\u0027eau au fur et à mesure de la progression.","ref":"§ Ch. 3 Les établissements — p. 57","p":"toutes les manœuvres s\u0027exécutent du point d\u0027eau vers le point d\u0027attaque. Elles ont été élaborées afin de veiller au maintien de la permanence de l\u0027eau au fur et à mesure de la progression","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Équipier","q":"Lors de l\u0027établissement de la lance du dévidoir tournant (LDT), à quel moment le conducteur envoie-t-il l\u0027eau ?","c":["Sur ordre du chef d\u0027agrès uniquement","Sur ordre du porte-lance, transmis à la radio","Après le compte rendu de l\u0027équipier 2","Sans attendre aucun ordre"],"r":3,"e":"Pour la LDT, le conducteur met en œuvre la pompe, fait suivre le tuyau et envoie l\u0027eau sans ordre, pendant que l\u0027équipier 1 tire l\u0027établissement et procède à l\u0027extinction et que l\u0027équipier 2 le double. Pour une lance 500 établie avec des tuyaux roulés, en revanche, il raccorde et envoie l\u0027eau sur ordre.","ref":"§ 1.1 L\u0027établissement de la lance du dévidoir tournant — p. 58","p":"CONDUCTEUR [...] Fait suivre le tuyau [...] Envoie l\u0027eau sans ordre","s":"gto-fdf"},
{"t":"gto-fdf","ch":"Établissements","niv":"Chef d\u0027équipe","q":"La LDT est utilisée en phase d\u0027extinction complète des lisières (phase d\u0027arrosage). Comment travaille l\u0027équipier ?","c":["En cabine, il arrose par le toit ouvrant, engin roulant","Il établit 120 m de tuyaux avant d\u0027ouvrir la lance","À pied, quelques mètres de tuyau, il suit le CCF qu\u0027il dirige","Loin devant le CCF, il repère seul les points chauds à traiter"],"r":2,"e":"En phase d\u0027extinction complète des lisières, le tuyau de la LDT est déroulé de quelques mètres et l\u0027équipier se déplace à pied en suivant la progression du CCF, qu\u0027il dirige. La LDT sert principalement au conducteur à protéger le CCF, mais peut servir à d\u0027autres missions.","ref":"§ 1.1 L\u0027établissement de la lance du dévidoir tournant — p. 58","p":"le tuyau de la lance du dévidoir tournant est déroulé de quelques mètres, l\u0027équipier se déplace à pied en suivant la progression du CCF qu\u0027il dirige.","s":"gto-fdf"},
