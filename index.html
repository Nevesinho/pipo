{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027équipe","q":"Un feu se déclare sur un tableau électrique BT dont le courant ne peut pas être coupé à l\u0027arrivée des secours. Avec quoi l\u0027éteindre ?","c":["Avec une lance en jet droit dirigée à la base des flammes","Avec une lance à mousse pour étouffer le foyer","Avec du sable mouillé pour absorber la chaleur","Avec des extincteurs appropriés, au CO2 ou à poudre"],"r":3,"e":"Si le courant ne peut pas être coupé dès l\u0027arrivée des secours, l\u0027extinction se fait au moyen d\u0027extincteurs appropriés (CO2, poudre). Une lance n\u0027est mise en œuvre que s\u0027il n\u0027existe pas d\u0027autre possibilité.","ref":"§ 3.1 Les installations basse tension (chap. 3) — p. 69","p":"Si le courant ne peut pas être coupé dès l\u0027arrivée des secours, l\u0027extinction doit se faire au moyen d\u0027extincteurs appropriés (CO2, poudre).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Équipier","q":"Le courant ne peut pas être coupé sur une installation basse tension en feu et seule une lance est disponible. Quelle règle s\u0027applique ?","c":["Jet diffusé d\u0027attaque, à 5 m au moins de l\u0027installation","Jet droit, à 3 m au moins de l\u0027installation","Jet diffusé d\u0027attaque, à 1 m au moins de l\u0027installation","Jet droit ou diffusé, à 2 m au moins de l\u0027installation"],"r":0,"e":"S\u0027il n\u0027existe pas d\u0027autre possibilité que la mise en œuvre d\u0027une lance, seul le jet diffusé d\u0027attaque est autorisé, avec une distance minimale de 5 mètres entre la lance et l\u0027installation.","ref":"§ 3.1 Les installations basse tension (chap. 3) — p. 69","p":"S\u0027il n\u0027existe pas d\u0027autre possibilité que la mise en œuvre d\u0027une lance, seul le jet diffusé d\u0027attaque est autorisé, en respectant une distance minimale entre la lance et l\u0027installation de 5 mètres.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027équipe","q":"Près d\u0027une installation BT sous tension, le guide double la distance de sécurité lorsqu\u0027une lance en jet droit est nécessaire. Pourquoi ?","c":["Parce que le jet droit facilite la conductivité de l\u0027électricité","Parce que le jet droit projette des débris sur l\u0027installation","Parce que le jet droit refroidit trop brutalement les conducteurs","Parce que le jet droit perd sa portée à courte distance"],"r":0,"e":"Le guide précise que le jet droit facilite la conductivité de l\u0027électricité : c\u0027est pourquoi, lorsque son utilisation est nécessaire, la distance de sécurité est doublée.","ref":"§ 3.1 Les installations basse tension (chap. 3) — p. 69","p":"Le jet droit facilite la conductivité de l\u0027électricité. Toutefois, lorsque l\u0027utilisation du jet droit est nécessaire, la distance de sécurité est doublée.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Équipier","q":"Le porte-lance qui attaque un feu sur une installation basse tension non coupée ressent un picotement. Que doit-il faire ?","c":["Passer en jet droit pour s\u0027éloigner du courant","Fermer la lance et rester immobile en position","Reculer à la moindre sensation, sans attendre","Se mettre à genoux pour réduire la tension de pas"],"r":2,"e":"La manœuvre est confiée à un porte-lance aguerri, qui procède par gestes lents et précis et recule à la moindre sensation de picotement. Il évite aussi de marcher dans les eaux de ruissellement, qui peuvent conduire le courant.","ref":"§ 3.1 Les installations basse tension (chap. 3) — p. 69","p":"procéder par gestes lents et précis ; reculer à la moindre sensation de picotement ; faire attention au risque d\u0027électrisation : éviter de marcher dans les eaux de ruissellement qui peuvent conduire le courant","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Un incendie touche une installation haute tension (HTA-HTB) dont la mise hors tension n\u0027est pas encore confirmée. À quoi se résume l\u0027action des secours ?","c":["Éteindre le foyer au jet diffusé d\u0027attaque, à 5 m au moins","Mener des reconnaissances et protéger personnes et environnement","Attaquer le foyer au CO2 en restant à distance des conducteurs","Pénétrer dans le poste pour rechercher l\u0027organe de coupure"],"r":1,"e":"Aucune extinction ne doit être entreprise avant la confirmation de la mise hors tension de l\u0027ensemble de l\u0027installation par du personnel qualifié. En attendant, l\u0027action des secours se résume aux reconnaissances et à la protection des personnes et de l\u0027environnement, au cas où l\u0027incendie viendrait à se propager.","ref":"§ 3.2 Les installations haute tension (chap. 3) — p. 69","p":"Aucune extinction ne doit être entreprise avant la confirmation de la mise hors tension […] En attendant, l\u0027action des secours se résume à la conduite de reconnaissances […] ainsi qu\u0027à la protection des personnes et de l\u0027environnement","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Une lance doit protéger contre une propagation sous une ligne HTA restée sous tension. Quelle distance minimale respecter entre l\u0027eau projetée en jet droit et la ligne ?","c":["5 mètres","10 mètres","3 mètres","20 mètres"],"r":1,"e":"Entre l\u0027eau projetée et une installation HTA ou HTB alimentée, le guide impose dans tous les cas 5 mètres en jet diffusé d\u0027attaque et 10 mètres en jet droit. Le COS s\u0027assure que les eaux d\u0027extinction ne risquent pas d\u0027entrer en contact avec des installations sous tension ni de former des arcs par amorçage.","ref":"§ 3.2 Les installations haute tension (chap. 3) — p. 70","p":"il convient de respecter dans tous les cas une distance minimale de sécurité entre l\u0027eau projetée et l\u0027installation alimentée HT […] 5 mètres en jet diffusé d\u0027attaque et 10 m en jet droit.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027une échelle aérienne à mettre en station devant une façade desservie par des lignes aériennes. Que prescrit le guide avant de positionner l\u0027échelle ?","c":["Se fier au détecteur de lignes aériennes équipant l\u0027engin","Mouiller les stabilisateurs pour assurer la mise à la terre","Rechercher les câbles aériens par une reconnaissance attentive","Déployer l\u0027échelle puis repérer les lignes depuis la plateforme"],"r":2,"e":"Une recherche des câbles aériens est indispensable avant de positionner l\u0027échelle, pour exclure tout risque d\u0027électrisation ou d\u0027électrocution ; fumées, brouillard ou obscurité peuvent masquer les fils. Un éventuel détecteur de lignes ne remplace pas la vigilance des conducteurs et des chefs d\u0027agrès.","ref":"§ 3.3 Les distances limites de voisinage (chap. 3) — p. 70","p":"Une recherche des câbles aériens […] est indispensable avant de positionner l\u0027échelle pour exclure tout risque d\u0027électrisation ou d\u0027électrocution.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Lors de la mise en station d\u0027une échelle aérienne près d\u0027une ligne HTB (plus de 50 000 V), quelle distance limite de voisinage le guide retient-il ?","c":["3 mètres","10 mètres","1 mètre","5 mètres"],"r":3,"e":"Le tableau des distances limites de voisinage retient 5 mètres pour les lignes HTB comme pour les lignes HTA, les caténaires SNCF, les lignes aériennes de contact des tramways et les lignes BT nues ou isolées endommagées. Une distance étant difficile à évaluer sur le terrain, mieux vaut, si possible, un positionnement très largement dégagé des lignes haute tension.","ref":"§ 3.3 Les distances limites de voisinage (chap. 3) — p. 71","p":"DISTANCE LIMITES DE VOISINAGE 5 mètres […] Les caténaires SNCF. Les lignes HTA Les lignes HTB","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Votre échelle aérienne est équipée d\u0027un détecteur de lignes aériennes haute tension. Que devez-vous savoir sur ce dispositif ?","c":["Il dispense le chef d\u0027agrès de reconnaître l\u0027espace aérien","Il ne détecte pas les lignes en courant continu (tramway)","Il ne détecte une ligne qu\u0027au contact de la plateforme","Il est calibré pour les seules lignes HTB de transport"],"r":1,"e":"Ces détecteurs sont calibrés pour les lignes aériennes haute tension de 20 000 V alternatif, à 10 mètres environ, et ne détectent pas les lignes à courant continu, comme celles du tramway. Ils ne remplacent pas la vigilance des conducteurs et des chefs d\u0027agrès lors de la mise en station.","ref":"§ 3.3 Les distances limites de voisinage (chap. 3) — p. 71","p":"Ces détecteurs sont calibrés pour détecter les lignes aériennes haute tension 20 000V alternatif, à une distance de 10 mètres environ. Ce dispositif ne détecte pas les lignes aériennes à courant continu (tramway par exemple).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Extinction et moyens aériens","niv":"Chef d\u0027agrès","q":"Vous mettez en station une échelle aérienne à proximité d\u0027une ligne électrique. Dans quels cas le guide demande-t-il d\u0027augmenter les distances de sécurité ?","c":["S\u0027il pleut ou si une lance est établie à proximité","Par temps froid ou si la ligne a des câbles isolés","Par temps sec ou si le vent dépasse 50 km/h","Si l\u0027échelle n\u0027est pas équipée d\u0027un détecteur de lignes"],"r":0,"e":"Les distances limites de voisinage doivent être augmentées s\u0027il pleut ou si une lance est établie à proximité. Comme une distance est difficile à évaluer précisément sur le terrain, le guide recommande, si possible, un positionnement d\u0027échelle très largement dégagé des lignes haute tension.","ref":"§ 3.3 Les distances limites de voisinage (chap. 3) — p. 71","p":"Ces distances de sécurité devront être augmentées s\u0027il pleut ou si une lance est établie à proximité.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027équipe","q":"Un parapentiste est enchevêtré dans une ligne haute tension. Dans quelle catégorie de situation le guide classe-t-il ce cas ?","c":["Conducteur actif en contact avec le sol","Victime près d\u0027un conducteur nu sur pylône","Victime dans un poste de transformation","Victime sur une installation intérieure BT"],"r":1,"e":"Le guide distingue trois cas : conducteur actif en contact avec le sol, sinistre ou victime au voisinage d\u0027un conducteur nu sur pylône (feu sous ligne, manœuvre MEA dans la fumée, parapentiste enchevêtré dans les lignes HT), sinistre ou victime dans un poste de transformation.","ref":"§ 1 Les situations envisageables (chap. 4) — p. 75","p":"sinistre ou d\u0027une victime au voisinage d\u0027un conducteur nu sur pylône : feu sous ligne électrique, manœuvre MEA dans la fumée, parapentiste enchevêtré dans les lignes HT","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027agrès","q":"Incident sur le réseau Enedis basse tension, consignation en attente. Quel rayon de zone d\u0027exclusion le guide préconise-t-il par défaut ?","c":["1 mètre","3 mètres","5 mètres","10 mètres"],"r":3,"e":"Selon les périmètres de sécurité par défaut issus des conventions SIS/opérateurs, la zone d\u0027exclusion autour d\u0027un incident sur le réseau Enedis basse tension est de 10 mètres ; la zone contrôlée s\u0027étend ensuite jusqu\u0027à 20 mètres.","ref":"§ 1.2 Le zonage opérationnel en présence d\u0027électricité (chap. 5) — p. 84","p":"préconisent les périmètres de sécurité par défaut à mettre en œuvre par le COS : [...] EXCLUSION ENEDIS Basse Tension [...] 10 mètres","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Le gestionnaire annonce par téléphone qu\u0027il « va couper » la ligne. Pouvez-vous engager votre équipe au contact de l\u0027installation ?","c":["Oui, la demande ayant été transmise et prise en compte","Non, pas avant la confirmation de la mise hors tension","Oui, dès qu\u0027aucun bourdonnement n\u0027est plus audible","Oui, si les équipiers conservent leurs gants de feu"],"r":1,"e":"Une mise hors tension n\u0027est pas obligatoirement effective : les sapeurs-pompiers doivent toujours en avoir la confirmation par l\u0027opérateur électrique. La mise hors tension et sa confirmation sont la priorité du COS avant tout engagement d\u0027équipe dans la conduite de l\u0027extinction.","ref":"§ 2.2 Stabiliser (chap. 5) — p. 85","p":"une mise hors tension n\u0027est pas obligatoirement effective. De ce fait, ils devront toujours avoir la confirmation par l\u0027opérateur électrique.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un incident touchant un ouvrage électrique dont vous ignorez le gestionnaire. Que préconise le guide ?","c":["Attendre que le CODIS ait identifié le gestionnaire avant de le demander","Couper vous-même l\u0027ouvrage au poteau le plus proche en attendant","Demander au plus vite le gestionnaire, voire plusieurs en cas de doute","Solliciter uniquement RTE, compétent pour tous les ouvrages électriques"],"r":2,"e":"Le COS identifie l\u0027ouvrage, notamment pour en déterminer la tension, et demande au plus vite le gestionnaire concerné (RTE, Enedis-EDF-ELD, SNCF…) en précisant sa localisation et son identification. En cas de doute, il ne doit pas hésiter à demander plusieurs gestionnaires.","ref":"§ 3 Les opérations sur une installation électrique (chap. 5) — p. 86","p":"identifier l\u0027ouvrage afin notamment déterminer la tension et demander au plus vite le gestionnaire concerné (RTE, ENEDIS-EDF-ELD, SNCF, etc.) […] En cas de doute, ne pas hésiter à demander plusieurs gestionnaires","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Équipier","q":"Lors de la mise à la terre d\u0027un groupe électrogène du SIS, au-delà de quelle profondeur risque-t-on d\u0027endommager un conducteur électrique souterrain ?","c":["Au-delà de 10 cm","Au-delà de 30 cm","Au-delà de 70 cm","Au-delà de 1 m"],"r":0,"e":"Pour la mise à la terre des groupes électrogènes du SIS ou la réalisation de points d\u0027ancrage dans le sol (SMPM, USAR, etc.), le guide signale un risque d\u0027endommager un conducteur électrique souterrain dès que la profondeur dépasse 10 cm.","ref":"§ 3 Les opérations sur une installation électrique (chap. 5) — p. 86","p":"Pour la mise à la terre des groupes électrogènes des SIS ou la réalisation de points d\u0027ancrage dans le sol [...], le risque d\u0027endommagement d\u0027un conducteur électrique souterrain est présent dès lors que la profondeur est supérieure à 10 cm.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027équipe","q":"Une voiture est en contact avec une installation électrique ; ses occupants, conscients, sont indemnes. Quelle conduite le guide prescrit-il ?","c":["Les rassurer et leur demander de ne pas sortir avant la mise en sécurité","Les faire sortir un par un en les tenant par la main pour les guider","Vérifier l\u0027absence de tension en touchant la carrosserie du dos de la main","Arroser le véhicule au jet droit pour écouler le courant vers le sol"],"r":0,"e":"Il ne faut jamais toucher un véhicule en contact avec une installation électrique. Si des victimes conscientes sont à l\u0027intérieur, il importe de les rassurer et de leur demander de ne pas sortir du véhicule avant la mise en sécurité de la zone d\u0027intervention.","ref":"§ 3.1 Le secours d\u0027urgence à personnes (chap. 5) — p. 87","p":"Si des victimes conscientes sont à l\u0027intérieur, il importe de les rassurer et de leur demander de ne pas sortir du véhicule avant la mise en sécurité de la zone d\u0027intervention.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027équipe","q":"Une victime se trouve en zone d\u0027exclusion près d\u0027une installation basse tension non consignée. Quelle action le guide permet-il ?","c":["Aucune action avant la consignation du réseau","Un sauvetage avec le lot de protection électrique","Un sauvetage immédiat, sans équipement particulier","Un sauvetage après mise à la terre par les sapeurs-pompiers"],"r":1,"e":"Selon le tableau des actions réalisables, lorsque l\u0027installation n\u0027est pas consignée, le sauvetage en zone d\u0027exclusion est possible en basse tension avec le lot de protection électrique. La règle est différente en HTA et en HTB.","ref":"§ 3.1 Le secours d\u0027urgence à personnes (chap. 5) — p. 87","p":"ZONE TENSION ACTIONS RÉALISABLES Exclusion BT Action de sauvetage possible avec le lot de protection électrique","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027agrès","q":"Une victime gît près d\u0027un conducteur HTA tombé, dans la zone d\u0027exclusion ; la ligne n\u0027est pas consignée. Que prévoit le guide pour le sauvetage ?","c":["Un sauvetage immédiat par l\u0027équipier le plus léger, à petits pas","Un sauvetage avec le lot de protection électrique, sans attendre","Aucun sauvetage sans concertation préalable avec le technicien réseau","Un dégagement à la gaffe en bois sec, l\u0027équipier portant ses gants"],"r":2,"e":"Sur une installation non consignée, en zone d\u0027exclusion, l\u0027action de sauvetage est impossible en HTA et en HTB sans concertation préalable avec le technicien réseau. En zone contrôlée, elle n\u0027est possible en HTA et en HTB qu\u0027après la mise hors tension par le technicien réseau.","ref":"§ 3.1 Le secours d\u0027urgence à personnes (chap. 5) — p. 87","p":"Exclusion […] HTA HTB Action de sauvetage impossible sans concertation préalable avec le technicien réseau.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Zonage, principes et sauvetage","niv":"Chef d\u0027agrès","q":"Un véhicule a percuté un poteau électrique. Quel périmètre d\u0027exclusion le guide demande-t-il de mettre en place ?","c":["Au moins égal à la hauteur du poteau, de part et d\u0027autre","Limité à 3 mètres autour du véhicule accidenté","Égal à la moitié de la hauteur du poteau, côté du véhicule","Limité à l\u0027emprise de la chaussée concernée"],"r":0,"e":"Pour un accident de véhicule contre une installation électrique, un périmètre d\u0027exclusion au moins égal à la hauteur de l\u0027ouvrage (poteau) doit être mis en place de part et d\u0027autre de celui-ci. Il ne faut jamais toucher un véhicule en contact avec une installation électrique.","ref":"§ 3.1 Le secours d\u0027urgence à personnes (chap. 5) — p. 87","p":"Périmètre d\u0027exclusion supérieur, au moins égal à la hauteur de l\u0027ouvrage (poteau) doit être mis en place de part et d\u0027autre de celui-ci.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Chef d\u0027agrès","q":"Feu dans un poste électrique, le technicien Enedis n\u0027est pas encore arrivé. Quelle action engagez-vous dans un premier temps ?","c":["Pénétrer dans l\u0027enceinte pour attaquer le foyer en jet diffusé d\u0027attaque","Ouvrir la porte du poste pour reconnaître l\u0027intérieur","Enrayer la propagation aux tiers, sans lance vers les installations","Attaquer le transformateur au CO2 depuis l\u0027entrée du poste"],"r":2,"e":"Il est strictement interdit de pénétrer dans l\u0027enceinte d\u0027un poste sans l\u0027accord d\u0027un technicien compétent d\u0027Enedis ou de RTE. L\u0027action des secours consiste d\u0027abord à enrayer la propagation aux tiers, en respectant le périmètre de sécurité et sans diriger de lances vers les installations électriques.","ref":"§ 3.2.1 Le feu ou l\u0027explosion dans un poste électrique (chap. 5) — p. 88","p":"L\u0027action des secours consistera dans un premier temps à enrayer la propagation aux tiers, en respectant le périmètre de sécurité et sans diriger de lances vers les installations électriques.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Chef d\u0027agrès","q":"Feu dans un poste électrique : Enedis vous confirme que le transformateur contient des PCB (pyralène). Quelle mesure le guide prescrit-il ?","c":["Élargir la zone d\u0027exclusion à 100 mètres et imposer l\u0027ARI","Réduire la zone d\u0027exclusion pour limiter le nombre d\u0027exposés","Pénétrer sans attendre dans le poste pour isoler le transformateur","Attaquer à l\u0027eau en jet droit pour diluer les PCB"],"r":0,"e":"En présence de PCB, il faut faire respecter strictement le zonage et le port de l\u0027ARI, surveiller les trajectoires des fumées, élargir la zone d\u0027exclusion à 100 mètres et attaquer au CO2 ou à la poudre. Il reste strictement interdit de pénétrer dans l\u0027enceinte du poste sans l\u0027accord d\u0027un technicien compétent d\u0027Enedis ou de RTE.","ref":"§ 3.2.1 Le feu ou l\u0027explosion dans un poste électrique (chap. 5) — p. 88","p":"de faire respecter strictement le zonage opérationnel et le port de l\u0027ARI ; […] de surveiller les zones de trajectoires des fumées ; […] d\u0027élargir la zone d\u0027exclusion à 100 mètres","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Chef d\u0027équipe","q":"Feu de végétation sous une ligne électrique : à quelle distance minimale des câbles doivent rester les sapeurs-pompiers et leurs échelles ?","c":["3 mètres","5 mètres","10 mètres","20 mètres"],"r":2,"e":"Aucun sapeur-pompier ni matériel (échelle à mains ou échelle aérienne) ne doit s\u0027approcher à moins de 10 mètres des câbles électriques, en raison du risque d\u0027amorçage. La communication entre le CTA et l\u0027opérateur électrique doit se faire quasiment en temps réel.","ref":"§ 3.2.2 Le feu sous ou à proximité d\u0027une ligne (chap. 5) — p. 89","p":"Aucun sapeur-pompier ou matériel (échelle à mains ou échelle aérienne) ne doit s\u0027approcher à moins de 10 mètres des câbles électriques (risque d\u0027amorçage).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Équipier","q":"De la fumée blanche et des claquements s\u0027échappent d\u0027un tampon de trottoir. Que prévoit le guide pour l\u0027ouverture de ce tampon ?","c":["Le soulever avec des gants et un outil à manche isolant","Le refroidir en jet diffusé, puis le soulever pour reconnaître","Le soulever dès qu\u0027un extincteur CO2 est prêt à l\u0027emploi","L\u0027ouvrir uniquement en présence et avec l\u0027accord d\u0027un technicien"],"r":3,"e":"Ces signes peuvent traduire un court-circuit sous réseau enterré, avec un risque d\u0027explosion et de projection du tampon. On établit un périmètre de sécurité et on demande une mise hors tension ; les tampons ne sont ni ouverts ni manipulés sans la présence et l\u0027accord d\u0027un technicien.","ref":"§ 3.3.1 Le court-circuit sous réseau enterré (chap. 5) — p. 90","p":"Les tampons ne doivent pas être ouverts ou manipulés sans la présence et l\u0027accord d\u0027un technicien.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Équipier","q":"Une ligne électrique est tombée sur la chaussée et gêne la progression des secours. Quelle conduite adopter vis-à-vis du câble ?","c":["Le dégager avec une gaffe en bois bien sec pour libérer la voie","Ne pas tenter de le déplacer avant l\u0027accord formel d\u0027un technicien habilité","Le considérer hors tension s\u0027il ne produit ni étincelle ni bourdonnement","Le soulever avec des gants de feu après avoir coupé les disjoncteurs voisins"],"r":1,"e":"Le guide interdit de tenter de déplacer un câble tombé au sol avant l\u0027accord formel d\u0027un technicien habilité, chargé de sécuriser le site (consignation électrique). En attendant son arrivée, un périmètre de sécurité est fixé autour du site.","ref":"§ 3.4.1 Les câbles tombés au sol (chap. 5) — p. 90","p":"Ne pas tenter de déplacer le câble avant l\u0027accord formel d\u0027un technicien habilité.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Chef d\u0027équipe","q":"Un câble HTA est tombé au sol dans un champ. À quelle distance minimale du câble faut-il se tenir ?","c":["3 mètres","5 mètres","50 mètres","10 mètres"],"r":3,"e":"Il ne faut pas s\u0027approcher à moins de 10 mètres d\u0027un câble électrique HTA ou BT tombé au sol. La distance à respecter est plus grande pour un câble HTB.","ref":"§ 3.4.1 Les câbles tombés au sol (chap. 5) — p. 90","p":"Ne pas s\u0027approcher à moins de 10 mètres du câble électrique (HTA ou BT) et 50 mètres (HTB).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Feux, courts-circuits et câbles","niv":"Chef d\u0027équipe","q":"Un câble de ligne HTB est tombé au sol. À quelle distance minimale du câble l\u0027équipe doit-elle rester ?","c":["5 mètres","20 mètres","50 mètres","100 mètres"],"r":2,"e":"Le guide interdit de s\u0027approcher à moins de 50 mètres d\u0027un câble HTB tombé au sol ; la distance est moindre pour un câble HTA ou BT.","ref":"§ 3.4.1 Les câbles tombés au sol (chap. 5) — p. 90","p":"Ne pas s\u0027approcher à moins de 10 mètres du câble électrique (HTA ou BT) et 50 mètres (HTB). Ne pas tenter de déplacer le câble avant l\u0027accord formel d\u0027un technicien habilité.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027équipe","q":"L\u0027alerte ne mentionnait pas de photovoltaïque. Lors de la reconnaissance intérieure, la découverte de quel élément signale une installation PV ?","c":["Un délesteur","Un contacteur heures creuses","Un onduleur","Un disjoncteur divisionnaire"],"r":2,"e":"À l\u0027intérieur, il convient de rechercher la signalétique a.c., les deux AGCP et l\u0027onduleur. La découverte d\u0027un de ces éléments signifie qu\u0027une installation PV est présente : elle doit être considérée sous tension jusqu\u0027à la réalisation des opérations de mise en sécurité.","ref":"§ 4.1.2 À l\u0027intérieur du bâtiment (chap. 5) — p. 91","p":"Il convient de rechercher la présence de signalétique a.c., des deux AGCP et de l\u0027onduleur. [...] La découverte d\u0027un des éléments précités signifie qu\u0027une installation PV est présente sur la zone d\u0027intervention.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027équipe","q":"Lors d\u0027un feu de toiture, une bâche de protection est posée sur des panneaux photovoltaïques. Que faut-il en retenir ?","c":["Elle supprime toute production et permet de toucher les panneaux","Elle altère la production mais ne protège pas du risque électrique","Elle dispense de rechercher la mise en sécurité de l\u0027installation","Elle est proscrite en toutes circonstances sur une toiture"],"r":1,"e":"Si l\u0027état de la toiture le permet, une bâche peut être utilisée pour altérer la production d\u0027électricité et empêcher une reprise de feu à partir d\u0027arcs électriques. Mais elle ne protège pas contre le risque électrique, et la mise en sécurité de l\u0027installation doit toujours être recherchée en parallèle.","ref":"§ 4.2.1 Un feu en présence d\u0027une installation de PV (chap. 5) — p. 92","p":"une bache de protection peut-être utilisée pour altérer la production d\u0027électricité et empêcher une éventuelle reprise de feu à partir d\u0027arcs éléctriques. La bache ne protège pas contre le risque électrique.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu de nacelle d\u0027éolienne, au sommet du mât. Quelle conduite le guide prescrit-il ?","c":["Monter dans le mât pour attaquer le feu au plus près","Utiliser l\u0027élévateur interne pour atteindre la nacelle","Attaquer la nacelle depuis le pied du mât avec une lance canon","Limiter l\u0027extinction aux propagations, sans lutte en hauteur"],"r":3,"e":"Le temps nécessaire à l\u0027ascension du mât peut laisser l\u0027incendie se développer librement : toute action de lutte en hauteur ou dans le mât est proscrite et l\u0027extinction se limite aux propagations vers d\u0027autres cibles. L\u0027accès à l\u0027éolienne reste strictement limité aux sauvetages de vies humaines.","ref":"§ 5.1.1 Les feux en hauteur (chap. 5) — p. 93","p":"toute action de lutte en hauteur ou dans le mat est proscrite. Les actions d\u0027extinction seront limitées aux propagations du sinistre vers d\u0027autres cibles.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027agrès","q":"Feu en hauteur sur une éolienne : quel zonage minimal le COS fait-il réaliser autour du mât ?","c":["Un rayon égal à la moitié de la hauteur du mât","Un rayon fixe de 50 mètres, quelle que soit l\u0027éolienne","Un rayon égal au diamètre du rotor","Un rayon supérieur à la hauteur du mât, soit 1,2 × H"],"r":3,"e":"Le zonage doit être supérieur à la hauteur du mât (1,2 × H) pour tenir compte des chutes de débris enflammés et d\u0027une éventuelle ruine du mât ; il reste actif même après le départ des secours. Par vent fort, une distance supérieure est préférable.","ref":"§ 5.1.1 Les feux en hauteur (chap. 5) — p. 94","p":"Le COS veillera à réaliser un zonage adapté supérieur à la hauteur du mat (1,2 x H) [...], prenant en compte les chutes de débris enflammés et en anticipant une éventuelle ruine du mat.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Équipier","q":"Dans une éolienne, vous mettez en œuvre un défibrillateur automatique. Quelle précaution le guide demande-t-il si la surface le nécessite ?","c":["Placer un isolant entre la victime et le sol","Mouiller le sol pour améliorer le contact des électrodes","Allonger la victime au contact direct du mât métallique","Relier la victime à la terre par son harnais"],"r":0,"e":"En cas d\u0027emploi d\u0027un défibrillateur automatique dans une éolienne, un isolant doit être placé entre la victime et le sol si la surface le nécessite (fibre).","ref":"§ 5.2 Les opérations de secours à personnes (chap. 5) — p. 96","p":"En cas d\u0027emploi d\u0027un défibrillateur automatique, un isolant doit être placé entre la victime et le sol si la surface le nécessite (fibre).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Équipier","q":"Pour vérifier un début d\u0027emballement thermique dans une armoire de batteries, pourquoi le guide interdit-il d\u0027en ouvrir les portes ?","c":["Pour éviter un apport d\u0027oxygène dans le compartiment","Pour ne pas fausser la mesure de température","Pour ne pas déclencher l\u0027alarme du BMS","Pour éviter de couper l\u0027alimentation des cellules"],"r":0,"e":"La prise d\u0027information ne doit jamais se faire en ouvrant les portes des compartiments batteries, afin d\u0027éviter un apport d\u0027oxygène. On recherche plutôt les signes externes : fumées blanches ou noires, odeur forte, flammes, claquements, projections.","ref":"§ 6 Les interventions sur les stockages de batteries (chap. 5) — p. 97","p":"La prise d\u0027information ne doit jamais se faire en ouvrant les portes des compartiments batteries afin d\u0027éviter un apport d\u0027oxygène.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027agrès","q":"Une unité de stockage par batteries est en emballement thermique. Quelle stratégie le guide recommande-t-il au COS ?","c":["Noyer massivement la batterie pour stopper la réaction","S\u0027abstenir d\u0027éteindre et protéger l\u0027environnement","Étouffer le stockeur sous une bâche ignifugée","Ouvrir le local pour attaquer au plus près au CO2"],"r":1,"e":"Dès lors que la batterie est emballée, il convient, en fonction des enjeux environnementaux (propagation, isolement, etc.), de s\u0027abstenir de toute tentative d\u0027extinction, qui ne peut avoir que des effets indésirables : combustion prolongée, fumées accrues, projections de métal en fusion, forte consommation d\u0027eau, pollution. Seule la protection de l\u0027environnement est recommandée.","ref":"§ 6.1 Les opérations de lutte contre l\u0027incendie (chap. 5) — p. 97","p":"Dès lors que la batterie est emballée, en fonction des enjeux environnementaux (propagation, isolement, etc.), il convient de s\u0027abstenir de toute tentative d\u0027extinction qui ne peut avoir que des effets indésirables","s":"gdo-elec"},
{"t":"gdo-elec","ch":"PV, éoliennes et batteries","niv":"Chef d\u0027équipe","q":"Dans un local de stockage par batteries, une batterie en emballement émet des fumées blanches froides, sans flamme. Que faut-il retenir ?","c":["Elles sont inertes puisqu\u0027elles sont émises sans flamme","Elles sont inflammables : leur évacuation en milieu confiné est capitale","Il s\u0027agit de vapeur d\u0027eau, sans danger pour les intervenants","Elles ne présentent de danger qu\u0027une fois rejetées à l\u0027air libre"],"r":1,"e":"Les fumées blanches et froides émises en l\u0027absence de flamme sont inflammables et peuvent se condenser en déposant de l\u0027électrolyte inflammable : leur évacuation en milieu confiné est capitale. Dans un local à inertage automatique, elles sont traitées par ventilation avant toute pénétration des personnels.","ref":"§ 6.1.2 La gestion des fumées (chap. 5) — p. 98","p":"L\u0027évacuation des fumées en milieu confiné semble capitale à la vue de leur inflammabilité, y compris en ce qui concerne les fumées froides émises en absence de flamme.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Équipier","q":"Sous quelle tension la ligne aérienne de contact (caténaire) alimente-t-elle les trains du réseau ferré national ?","c":["750 V continu ou 400 V alternatif selon les cas","15 000 V alternatif ou 3 000 V continu selon les cas","25 000 V alternatif ou 1 500 V continu selon les cas","20 000 V alternatif ou 750 V continu selon les cas"],"r":2,"e":"Les postes d\u0027alimentation situés près des voies transforment le courant reçu en 25 000 volts alternatif ou 1 500 volts continu selon les cas, transmis aux trains par la ligne aérienne de contact et les pantographes. Les tramways sont, eux, alimentés en 750 V continu.","ref":"§ 6.3 Les trains de voyageurs et de marchandises (chap. 1) — p. 50","p":"Ils transforment le courant reçu en courant 25 000 volts alternatif ou 1 500 volts continu selon les cas.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Équipier","q":"Dans le métro, par quoi l\u0027énergie de traction est-elle transmise aux rames ?","c":["Par un rail de traction, entre les rails de roulement ou latéral","Par une caténaire à 25 000 V suspendue à la voûte du tunnel","Par des batteries embarquées rechargées en station à chaque arrêt","Par une ligne aérienne nue en 20 000 V fixée aux parois du tunnel"],"r":0,"e":"Les voies du métro comportent deux rails de roulement et un rail de traction qui fournit un courant continu de 750 V aux rames, capté par des frotteurs. En intervention, le COS demande la mise hors tension des rails de traction au chef de régulation et attend la confirmation de la coupure.","ref":"§ 6.1 Les trains à vocation de transport urbain (chap. 1) — p. 50","p":"d\u0027un rail de traction (1 rail pour le métro fer et deux rails pour le métro pneus) qui fournit de l\u0027électricité en courant continu à une tension de 750 volts au moteur de chaque rame.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Chef d\u0027équipe","q":"La coupure d\u0027urgence du courant de traction vient d\u0027être confirmée. Que doit encore craindre l\u0027équipe engagée près des voies ?","c":["Plus rien : la coupure immobilise instantanément tous les trains","La circulation de trains, notamment des trains thermiques (diesel)","Le rétablissement automatique du courant au bout de dix minutes","La mise sous tension des rails provoquée par la coupure"],"r":1,"e":"La coupure d\u0027urgence du courant de traction ne garantit pas l\u0027absence de circulation : elle n\u0027entraîne pas l\u0027arrêt immédiat des trains privés d\u0027alimentation électrique et n\u0027a aucun effet sur les circulations thermiques (diesel).","ref":"§ 4 Les règles sur les moyens de transport (chap. 3) — p. 73","p":"La coupure d\u0027urgence du courant de traction ne garantit pas l\u0027absence de circulation des trains. Elle n\u0027entraîne pas l\u0027arrêt immédiat des trains privés d\u0027alimentation électrique et n\u0027a aucun effet sur les circulations dites thermiques (diesels).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Chef d\u0027agrès","q":"Vous faites demander, via le CODIS, une coupure d\u0027urgence du courant de traction ferroviaire. Que doit comporter cet ordre ?","c":["La mention « coupure d\u0027urgence », la localisation, le motif et le demandeur","Le nombre de victimes, le type de train en cause et l\u0027heure exacte de l\u0027accident","Le numéro de l\u0027engin, les conditions météo et la durée prévue de coupure","La tension de la caténaire, le nom du conducteur et l\u0027état de la voie"],"r":0,"e":"L\u0027ordre de coupure d\u0027urgence comporte la mention « coupure d\u0027urgence », les indications de localisation de la zone à priver de tension (point kilométrique, n° du poteau caténaire, gares encadrantes, etc.), le motif et l\u0027identité ou la fonction du demandeur.","ref":"§ 7 Les interventions sur les réseaux ferrés (chap. 5) — p. 99","p":"Cet ordre doit comporter : la mention : « coupure d\u0027urgence » ; les indications permettant de localiser la zone à priver de tension […] ; le motif ; l\u0027identité du demandeur ou sa fonction.","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Chef d\u0027équipe","q":"Pour dégager une victime sous une voiture d\u0027un train à l\u0027arrêt, sans coupure d\u0027urgence, quelle mesure d\u0027isolement faut-il demander ?","c":["La pose de perches de mise à la terre par les sapeurs-pompiers","L\u0027abaissement des pantographes, demandé au conducteur","La coupure de la batterie de bord par le chef d\u0027agrès","Le calage des roues du train avec des cales en bois"],"r":1,"e":"Pour intervenir sous les voitures du matériel roulant, il faut les isoler en abaissant les pantographes du train, sur demande au conducteur. Seule compte alors la protection des personnels face aux risques de la circulation sur la voie adjacente.","ref":"§ 7.1.5 Les opérations de secours sans risque électrique (chap. 5) — p. 101","p":"Pour intervenir sous les voitures du matériel roulant (dégagement de personnes accidentées par exemple), il est nécessaire de les isoler en abaissant les pantographes du train (demande à formuler auprès du conducteur).","s":"gdo-elec"},
{"t":"gdo-elec","ch":"Réseaux ferrés","niv":"Équipier","q":"La coupure d\u0027urgence de la ligne aérienne de contact d\u0027un tramway est confirmée. Peut-on appuyer une échelle contre cette ligne ?","c":["Oui, dès que la coupure a été confirmée","Oui, si l\u0027échelle est en matériau isolant et sèche","Non, la coupure d\u0027urgence ne concerne que les rails","Non, une tension résiduelle peut y subsister"],"r":3,"e":"La coupure d\u0027urgence n\u0027est effective qu\u0027après confirmation, et une tension résiduelle liée à la longueur du tronçon peut subsister. Il est donc interdit d\u0027appuyer des échelles sur la ligne aérienne de contact.","ref":"§ 7.2.2 Les tramways et les trolley-bus (chap. 5) — p. 101","p":"Il peut subsister une tension résiduelle liée à la longueur du tronçon de la ligne affectée par l\u0027accident. En conséquence, il est interdit d\u0027y appuyer des échelles.","s":"gdo-elec"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Selon le guide, quelles sont les trois principales caractéristiques d\u0027un gaz que recherchent les primo-intervenants ?","c":["Sa couleur, son odeur et sa température de stockage dans le récipient","Sa toxicité pour les personnes, sa densité et sa plage d\u0027explosivité","Sa pression de stockage, son mode de transport et son utilisation finale","Son odeur, son point d\u0027ébullition et son pouvoir calorifique"],"r":1,"e":"Les principales caractéristiques que recherchent les primo-intervenants sont la toxicité pour les personnes, la densité du gaz (plus lourd ou plus léger que le milieu ambiant) et la plage d\u0027explosivité, c\u0027est-à-dire la proportion du mélange air-gaz pour qu\u0027une explosion puisse se produire.","ref":"§ 2 Les différents gaz (chap. 1) — p. 16","p":"Les principales caractéristiques que vont rechercher les primo-intervenants sont : la toxicité pour les personnes ; la densité du gaz, en ce qu\u0027il est plus lourd ou plus léger que le milieu ambiant ; la plage d\u0027explosivité","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Quel est le constituant principal du gaz naturel ?","c":["Le propane, issu du raffinage du pétrole","Le méthane, combustible d\u0027origine fossile","L\u0027hydrogène, produit par électrolyse de l\u0027eau","Le butane, stocké liquide sous pression"],"r":1,"e":"Le méthane (CH4) est le constituant principal du gaz naturel, à hauteur de 86 % à 98 %. Le butane et le propane sont, eux, les constituants des gaz de pétrole liquéfiés (GPL).","ref":"§ 2.1 Le gaz naturel (chap. 1) — p. 17","p":"Le méthane (CH4) est le constituant principal du gaz naturel, combustible d\u0027origine fossile (86 % à 98 %).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Qu\u0027est-ce que le gaz naturel liquéfié (GNL) ?","c":["Du gaz naturel rendu liquide par cryogénie à -160 °C","Du gaz naturel comprimé à haute pression à l\u0027état gazeux","Un mélange de butane et de propane liquéfié sous pression","Du biogaz épuré puis injecté dans le réseau de distribution"],"r":0,"e":"Condensé à l\u0027état liquide par cryogénisation à -160 °C, le gaz naturel prend l\u0027appellation de gaz naturel liquéfié (GNL). Le mélange de butane et de propane correspond aux GPL ; le biogaz épuré injecté dans les réseaux est le biométhane.","ref":"§ 2.1 Le gaz naturel (chap. 1) — p. 17","p":"Le gaz naturel peut également être importé condensé à l\u0027état liquide par un procédé de cryogénisation à -160 °C, il prend alors l\u0027appellation de gaz naturel liquéfié (GNL).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Pourquoi ajoute-t-on du tétrahydrothiophène (THT) au gaz naturel avant sa distribution ?","c":["Pour l\u0027odoriser, le méthane étant naturellement inodore","Pour le colorer, le méthane étant naturellement incolore","Pour l\u0027alourdir, le méthane étant plus léger que l\u0027air","Pour le stabiliser, le méthane étant très inflammable"],"r":0,"e":"Le méthane est incolore et inodore dans les conditions normales : avant d\u0027être distribué, le gaz naturel est donc odorisé par adjonction de THT. Une fuite de méthane non encore odorisé, par exemple sur une installation de biométhane, ne peut être détectée qu\u0027à l\u0027explosimètre ou au détecteur multigaz.","ref":"§ 2.1 Le gaz naturel (chap. 1) — p. 17","p":"Avant d\u0027être distribué, le gaz naturel est odorisé par adjonction de tétrahydrothiophène (THT).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"En cas de fuite à l\u0027air libre, comment se comporte le gaz naturel ?","c":["Plus lourd que l\u0027air, il forme une nappe au sol","De densité voisine de l\u0027air, il stagne à hauteur d\u0027homme","Plus léger que l\u0027air, il s\u0027élève et se disperse rapidement","Deux fois plus lourd que l\u0027air, il suit les caniveaux"],"r":2,"e":"À l\u0027état libre, le gaz naturel est plus léger que l\u0027air : il s\u0027élève rapidement et se disperse sans créer de nappe gazeuse, ni au sol ni dans l\u0027atmosphère. En milieu confiné en revanche, au-delà de 25 % de gaz dans le mélange, il se substitue à l\u0027oxygène et agit comme un asphyxiant.","ref":"§ 6.5.1 Le gaz naturel (chap. 2) — p. 93","p":"À l\u0027état libre, le gaz naturel est plus léger que l\u0027air. Il s\u0027élève rapidement et se disperse sans créer de nappe gazeuse ni au sol, ni dans l\u0027atmosphère.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"En cas de fuite de butane ou de propane (GPL), où le gaz a-t-il tendance à s\u0027accumuler ?","c":["En partie basse, ces gaz étant plus lourds que l\u0027air","En partie haute, ces gaz étant plus légers que l\u0027air","Nulle part, ces gaz se dispersant aussitôt dans l\u0027air","À mi-hauteur, ces gaz ayant la densité de l\u0027air"],"r":0,"e":"Le butane et le propane sont plus lourds que l\u0027air : en cas de fuite, les GPL s\u0027accumulent en partie basse. Pour ces gaz, les relevés à l\u0027explosimètre se font donc prioritairement en partie basse.","ref":"§ 2.2 Le gaz de pétrole liquéfié (chap. 1) — p. 18","p":"En cas de fuite, les GPL s\u0027accumulent en partie basse","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Chef d\u0027équipe","q":"Une bouteille de propane est couverte de givre et plus aucun gaz ne semble en sortir. Que doit en conclure le chef d\u0027équipe ?","c":["Elle est vide : elle peut être manipulée sans aucune précaution","Le givre annonce une montée en pression et un éclatement imminent","Le givre peut bloquer la sortie : elle n\u0027est pas forcément vide","Le givre révèle une fuite à travers la paroi qu\u0027il faut refroidir"],"r":2,"e":"Selon le guide, la formation de givre sur la paroi ne présente aucun risque, mais le givre peut bloquer la sortie de gaz et laisser penser à tort que le récipient est vide (accident avec des cartouches de camping-gaz).","ref":"§ 2.2 Le gaz de pétrole liquéfié (chap. 1) — p. 19","p":"la formation de givre sur la paroi ne présente aucun risque, mais le givre peut bloquer la sortie de gaz et laisser penser à tort que le récipient est vide","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Une fuite d\u0027oxygène liquide survient dans un local. Au-delà de quelle concentration d\u0027oxygène dans l\u0027air le guide parle-t-il de suroxygénation ?","c":["18,5 %","21 %","23,5 %","60 %"],"r":2,"e":"L\u0027air contient 21 % d\u0027oxygène. Le guide parle de suroxygénation dès que la concentration dépasse 23,5 % : les matières combustibles réagissent alors vivement et la combustion est accélérée. À 60 %, la combustion est instantanée, phénomène accru en espace confiné.","ref":"§ 2.6 L\u0027oxygène (chap. 1) — p. 24","p":"En cas de fuite d\u0027oxygène liquide, il peut y avoir suroxygénation du milieu. Ce phénomène se produit dès lors que la concentration en oxygène dans l\u0027air dépasse les 23,50 %.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Quelle affirmation décrit correctement le monoxyde de carbone (CO) à température et pression normales ?","c":["Il est plus lourd que l\u0027air et s\u0027accumule au sol","Son odeur d\u0027œuf pourri disparaît à forte dose","Il est incolore, inodore et non irritant","Il est très irritant pour les voies respiratoires"],"r":2,"e":"Le CO est un gaz incolore et inodore, de densité voisine de celle de l\u0027air, et non irritant ; son principal risque pour l\u0027homme est l\u0027intoxication. Certains détecteurs utilisés par les sapeurs-pompiers mesurent sa concentration en ppm. L\u0027odeur d\u0027œuf pourri est celle de l\u0027hydrogène sulfuré.","ref":"§ 2.7 Le monoxyde de carbone (chap. 1) — p. 24","p":"Le monoxyde de carbone est un gaz incolore et inodore à température et pression normale, avec une densité voisine de celle de l\u0027air. Non irritant","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Dans quelles conditions se forme le monoxyde de carbone (CO) ?","c":["Lors d\u0027une fuite de gaz naturel dans un local fermé","Lors du fonctionnement d\u0027un appareil électrique","Lors d\u0027une combustion incomplète, par manque d\u0027oxygène","Lors de la décomposition du THT dans le réseau"],"r":2,"e":"Le CO se forme lors de tout processus de combustion incomplète, c\u0027est-à-dire en présence d\u0027une quantité insuffisante d\u0027oxygène. Tous les combustibles sont concernés : gaz naturel, GPL, bois, charbon, fioul, essence… Les intoxications résultent le plus souvent d\u0027un appareil de chauffage défectueux ou mal entretenu dans un espace clos.","ref":"§ 2.7 Le monoxyde de carbone (chap. 1) — p. 25","p":"Le monoxyde de carbone se forme suite à tous les processus de combustion incomplète (c\u0027est à dire en présence d\u0027une quantité insuffisante d\u0027oxygène).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Que désigne le terme ATEX ?","c":["Une atmosphère explosive formée d\u0027air et de substances inflammables","Une alerte d\u0027explosion diffusée aux riverains par le centre d\u0027appel","Un agent extincteur à poudre destiné aux feux de gaz de classe C","Une attaque extérieure menée à distance sur une citerne de gaz"],"r":0,"e":"Une atmosphère explosive (ATEX) est un mélange avec l\u0027air de substances inflammables (gaz, vapeurs, brouillards ou poussières) dans lequel, après inflammation, la combustion se propage à tout le mélange non brûlé. Un matériel ne peut être utilisé en zone ATEX que s\u0027il porte le logo et le marquage réglementaires.","ref":"§ 3 L\u0027atmosphère explosive (chap. 1) — p. 26","p":"Une atmosphère explosive (ATEX) est un mélange avec l\u0027air, dans les conditions atmosphériques, de substances inflammables sous forme de gaz, vapeurs, brouillards ou poussières","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Que désignent la LIE et la LSE d\u0027un gaz combustible ?","c":["Les limites de température entre lesquelles le gaz s\u0027enflamme spontanément","Les limites de concentration dans l\u0027air entre lesquelles le gaz peut exploser","Les limites de pression entre lesquelles le gaz reste liquide dans son récipient","Les limites de distance entre lesquelles est fixée la zone d\u0027exclusion"],"r":1,"e":"La LIE (limite inférieure d\u0027explosivité) et la LSE (limite supérieure d\u0027explosivité) bornent la plage d\u0027explosivité, domaine de concentration en gaz combustible : elle définit les limites entre lesquelles un gaz peut s\u0027enflammer et exploser.","ref":"§ 3.2 La plage d\u0027explosivité (chap. 1) — p. 27","p":"La plage d\u0027explosivité est le domaine de concentration en gaz combustible borné par la limite inférieure d\u0027explosivité (LIE) et la limite supérieure d\u0027explosivité (LSE).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Chef d\u0027équipe","q":"Lors de la reconnaissance, l\u0027explosimètre affiche 20 % de la LIE. Où se situe le mélange par rapport à la plage d\u0027explosivité ?","c":["Dans la plage d\u0027explosivité, entre la LIE et la LSE","Sous la LIE : le mélange est encore trop pauvre en gaz","Au-dessus de la LSE : le mélange est trop riche","Exactement à la LIE : l\u0027explosion devient possible"],"r":1,"e":"L\u0027explosimètre mesure de 0 à 100 % de la LIE : à 20 % de la LIE, la concentration reste sous la limite inférieure, où le mélange est trop pauvre en combustible (gaz). La situation n\u0027est pas sûre pour autant : la concentration peut évoluer et les relevés doivent être poursuivis.","ref":"§ 3.2 La plage d\u0027explosivité (chap. 1) — p. 27","p":"Sous la LIE le mélange est trop pauvre en combustible (gaz), au-dessus de la LSE le mélange est trop riche en combustible (gaz).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Quelle est la limite inférieure d\u0027explosivité (LIE) du méthane dans l\u0027air ?","c":["0,5 %","2 %","15 %","5 %"],"r":3,"e":"Le méthane a une LIE de 5 % et une LSE de 15 % : il ne peut exploser qu\u0027entre ces deux concentrations dans l\u0027air. La valeur de 15 % correspond donc à sa limite supérieure, et non à sa limite inférieure.","ref":"§ Annexe E Plages d\u0027explosivité et densités — p. 155","p":"Méthane 5,00 % 15,00 % 0,55","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz et atmosphère explosive","niv":"Équipier","q":"Quelle est la limite inférieure d\u0027explosivité (LIE) du propane dans l\u0027air ?","c":["Environ 2 %","Environ 5 %","Environ 10 %","Environ 15 %"],"r":0,"e":"Le propane a une LIE de 2,10 % et une LSE de 9,50 % ; le butane, une LIE de 1,80 % et une LSE de 8,40 %. La valeur d\u0027environ 10 % correspond donc à la limite supérieure du propane, et non à sa limite inférieure.","ref":"§ Annexe E Plages d\u0027explosivité et densités — p. 155","p":"Propane 2,10 % 9,50 % 1,52","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un incident à un poste d\u0027injection de biométhane. Quel dispositif votre équipage peut-il actionner pour arrêter le process gaz ?","c":["L\u0027organe de coupure R1, sur la ligne d\u0027arrivée du gaz au poste","L\u0027organe de coupure R4, sur la ligne de sortie vers le réseau","L\u0027un des deux boutons « coup de poing » du poste d\u0027injection","L\u0027organe de coupure R6, sur la ligne de retour vers le producteur"],"r":2,"e":"La manœuvre des organes de coupure R1, R4 et R6 est interdite aux sapeurs-pompiers. Les deux boutons « coup de poing » (à l\u0027extérieur côté local odorisation et dans le local électrique) leur sont en revanche accessibles : ils coupent l\u0027alimentation des électrovannes, qui se ferment, et le gaz ne circule plus.","ref":"§ 4.4.1 Les installations de production du biométhane (chap. 1) — p. 34","p":"Pour arrêter le process gaz, il existe deux boutons « coup de poing » au niveau des postes d\u0027injection biométhane […] Ces boutons sont manœuvrables par les sapeurs-pompiers.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Chef d\u0027équipe","q":"Au poste d\u0027injection de biométhane, l\u0027alimentation électrique générale vient d\u0027être coupée. Que doit retenir le chef d\u0027équipe sur le risque électrique ?","c":["Plus aucun élément du poste n\u0027est sous tension","Seul l\u0027éclairage de secours du poste reste encore alimenté","La tension revient automatiquement au bout de quelques minutes","Les batteries de l\u0027onduleur restent toujours sous tension"],"r":3,"e":"Un à deux onduleurs peuvent maintenir l\u0027automate sous tension. Le bouton de coupure de l\u0027alimentation électrique générale coupe l\u0027alimentation globale du poste et le réseau ondulé, mais quelle que soit la coupure réalisée, les batteries de l\u0027onduleur restent sous tension.","ref":"§ 4.4.1 Les installations de production du biométhane (chap. 1) — p. 35","p":"Quelle que soit la coupure électrique réalisée, il restera toujours les batteries de l\u0027onduleur sous tension.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Sur une bouteille de gaz, quel est le rôle du détendeur ?","c":["Odoriser le gaz avant son arrivée chez l\u0027usager","Diminuer la pression du gaz et la maintenir constante","Mesurer la consommation de gaz de l\u0027installation","Couper seul le gaz en cas de débit excessif"],"r":1,"e":"Le détendeur a deux rôles principaux : diminuer la pression du gaz pour éviter tout risque et maintenir une pression constante pour une utilisation optimale. Équipé d\u0027un manomètre, il prend le nom de manodétendeur. C\u0027est le robinet qui sert à ouvrir et fermer la bouteille.","ref":"§ 4.6.1 Les bouteilles de gaz (chap. 1) — p. 38","p":"le détendeur, quant à lui, a deux rôles principaux : d\u0027un côté, il sert à diminuer la pression du gaz pour éviter tout risque ; de l\u0027autre, il permet de maintenir une pression constante pour une utilisation optimale du gaz.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Sur une bouteille de gaz industriel, quelle couleur d\u0027ogive signale un gaz toxique et/ou corrosif ?","c":["Rouge","Bleu clair","Vert vif","Jaune"],"r":3,"e":"Le code couleur des ogives classe les risques par ordre décroissant de danger : jaune pour toxique et/ou corrosif, rouge pour inflammable, bleu clair pour oxydant, vert vif pour inerte. En cas de risques multiples, l\u0027ogive est peinte selon le risque primaire. Ce codage ne concerne pas les bouteilles de GPL.","ref":"§ 4.6.2 Le code couleur des ogives de bouteille (chap. 1) — p. 40","p":"Ce codage est lié aux propriétés physico-chimiques ou toxicologiques du gaz, classées selon quatre grands risques, par ordre décroissant de danger. Toxique et/ou corrosif — Jaune (RAL 1018 – jaune zinc)","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Sous quelle forme le butane et le propane sont-ils stockés dans les bouteilles ?","c":["À l\u0027état gazeux, comprimés à très haute pression","À l\u0027état gazeux, dissous dans un solvant liquide","À l\u0027état liquide, sous pression, avec un ciel gazeux","À l\u0027état liquide, réfrigérés à basse température"],"r":2,"e":"Le butane et le propane sont des gaz liquéfiés : ils sont stockés sous pression à l\u0027état liquide, avec un ciel gazeux. Le gaz dissous concerne l\u0027acétylène ; le gaz comprimé, l\u0027air respirable ou l\u0027hydrogène.","ref":"§ 5 Les risques associés aux bouteilles (chap. 2) — p. 85","p":"gaz liquéfié : c\u0027est-à-dire stocké sous pression à l\u0027état liquide avec un ciel gazeux : cas du butane, du propane, de l\u0027ammoniac","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Quelle quantité de gaz contiennent les bouteilles de GPL (butane, propane) ?","c":["De 0,5 à 3 kg","De 50 à 150 kg","De 5 à 35 kg","De 100 à 400 kg"],"r":2,"e":"La quantité de gaz dans les bouteilles de GPL varie de 5 à 35 kg ; les bouteilles composites de nouvelle génération, plus légères, en contiennent de 5 à 10 kg. Les très petites cartouches (camping, bricolage) ne comportent pas de système de fermeture.","ref":"§ 4.6.4 Les bouteilles de gaz de pétroles liquéfiés (chap. 1) — p. 43","p":"La quantité de gaz dans ces bouteilles varie de 5 à 35 kg.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Que vous apprend la couleur d\u0027une bouteille de butane ou de propane du commerce ?","c":["Le gaz contenu, butane ou propane, selon un code normalisé","Le niveau de risque du gaz, selon le code couleur des ogives","Rien d\u0027utile : elle dépend des enseignes et des distributeurs","Le matériau de son enveloppe : acier ou composite"],"r":2,"e":"La couleur des bouteilles de GPL n\u0027a pas de lien avec la signalétique des bouteilles de gaz comprimés et n\u0027apporte pas d\u0027indication aux sapeurs-pompiers : elle est fonction des enseignes commerciales et des distributeurs. La norme de codage des ogives exclut d\u0027ailleurs les bouteilles de GPL.","ref":"§ 4.6.4 Les bouteilles de gaz de pétroles liquéfiés (chap. 1) — p. 43","p":"La couleur des bouteilles n\u0027a pas de lien avec la signalétique habituelle des bouteilles de gaz comprimés. Elle n\u0027apporte pas d\u0027indications aux sapeurs-pompiers. Elle est fonction des enseignes commerciales et des distributeurs.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Production et stockage des gaz","niv":"Équipier","q":"Pourquoi un espace vide appelé « ciel gazeux » est-il toujours laissé lors du remplissage d\u0027une bouteille de GPL ?","c":["Pour permettre la dilatation du liquide sous l\u0027effet de la chaleur","Pour permettre le mélange du gaz avec l\u0027air avant son utilisation","Pour loger le produit odorant ajouté au butane ou au propane","Pour faciliter le transvasement du gaz vers une autre bouteille"],"r":0,"e":"Stockés liquides, le butane et le propane se dilatent sous l\u0027effet de la chaleur. Le ciel gazeux permet cette augmentation de volume jusqu\u0027à environ 50 °C sans atteindre le volume complet de la bouteille, appelé « plein hydraulique », situation à considérer comme très dangereuse.","ref":"§ 4.6.4 Les bouteilles de gaz de pétroles liquéfiés (chap. 1) — p. 44","p":"Sous l\u0027effet de la chaleur, ils se dilatent. Afin de permettre cette dilatation sans danger, un espace vide, appelé ciel gazeux, est toujours laissé lors du remplissage de la bouteille à température ambiante.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Vous repérez une balise jaune « gaz haute pression » près de votre zone d\u0027intervention. Quelle information vous donne-t-elle sur la canalisation de transport ?","c":["Sa position exacte : elle passe à l\u0027aplomb de la balise","Sa proximité, mais pas sa localisation précise","Sa profondeur exacte d\u0027enfouissement en ce point","L\u0027emplacement du robinet de coupure le plus proche"],"r":1,"e":"Bornes, balises et plaques jaunes signalent la proximité d\u0027une canalisation de transport de gaz et non sa localisation précise. Leurs plaques portent la mention « gaz haute pression », le nom du transporteur et son numéro d\u0027urgence opérationnel, joignable 24h/24.","ref":"§ 5.1 Le transport (chap. 1) — p. 48","p":"Ces repères indiquent la proximité d\u0027une canalisation de transport de gaz et non pas sa localisation précise.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Le gestionnaire vous signale que la fuite concerne une « canalisation à périmètre de sécurité étendu ». Qu\u0027implique cette information selon le guide ?","c":["Sa rupture peut générer des flux thermiques au-delà des distances de la PGR","La canalisation relève du réseau de transport et non de la distribution","Le gaz transporté est plus lourd que l\u0027air et s\u0027accumule en partie basse","La fuite peut être gérée sans aucun périmètre, la pression y étant très faible"],"r":0,"e":"Certaines canalisations du réseau moyenne pression C, de plus grand diamètre et à pression plus élevée, sont dites « à périmètre de sécurité étendu » : en cas de rupture, l\u0027impact des flux thermiques peut dépasser les distances de sécurité prévues par la procédure gaz renforcée (PGR), d\u0027où des mesures de sécurité particulières.","ref":"§ 5.2 La distribution (chap. 1) — p. 56","p":"ces canalisations dites « canalisation à périmètre de sécurité étendu » nécessitent des mesures de sécurités particulières au regard des flux thermiques générés dont l\u0027impact peut dépasser les distances de sécurité prévues dans la procédure gaz renforcée (PGR).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027équipe","q":"Le chef d\u0027équipe doit faire couper le gaz de tout un immeuble collectif. Sur quel organe agit-il ?","c":["Sur l\u0027organe de coupure individuelle (OCI) du palier","Sur le robinet de l\u0027appareil de cuisson du logement","Sur le compteur du logement situé près de l\u0027entrée","Sur l\u0027organe de coupure générale (OCG) du branchement"],"r":3,"e":"L\u0027installation à usage collectif d\u0027un immeuble s\u0027étend de l\u0027organe de coupure générale (OCG) aux organes de coupure individuelle (OCI) : l\u0027OCG, accessible depuis la voie publique, coupe donc l\u0027ensemble, l\u0027OCI un seul logement. Si la situation l\u0027exige et en l\u0027absence de l\u0027exploitant, les sapeurs-pompiers peuvent fermer l\u0027OCG ou l\u0027OCI.","ref":"§ 5.2.1 Les canalisations (chap. 1) — p. 59","p":"installation à usage collectif : partie de l\u0027installation d\u0027un immeuble collectif comprise entre l\u0027organe de coupure générale (OCG) inclus et les organes de coupure individuelle (OCI) inclus.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Équipier","q":"Fuite de gaz naturel sur la voie publique : un robinet du réseau de distribution se trouve dans une chambre sous le trottoir. Qui peut le manœuvrer ?","c":["Un binôme de sapeurs-pompiers muni d\u0027une clé","Les agents de l\u0027opérateur du réseau de gaz","Le chef d\u0027agrès, si le gestionnaire tarde à arriver","Les forces de l\u0027ordre présentes sur place"],"r":1,"e":"La manœuvre des robinets du réseau de distribution est interdite aux sapeurs-pompiers, même en attendant le gestionnaire. Ils peuvent en revanche manœuvrer les organes de coupure générale (OCG) et individuelle (OCI) des installations.","ref":"§ 5.2.2 Les organes de coupure (chap. 1) — p. 59","p":"La manœuvre des robinets du réseau de distribution est interdite aux sapeurs-pompiers.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027équipe","q":"Sur un palier comportant plusieurs compteurs, comment identifier l\u0027organe de coupure individuelle (OCI) qui dessert l\u0027appartement concerné ?","c":["Par l\u0027étiquette du fournisseur d\u0027énergie collée sur chaque compteur","Par la couleur de la conduite, propre à chaque logement du palier","Par l\u0027ordre des compteurs, identique à celui des portes palières","Par le repère de la bague, reporté sur le chambranle de la porte"],"r":3,"e":"Une bague portant une lettre ou un chiffre peut être fixée sur la canalisation près de l\u0027OCI ; une plaque métallique avec le même repère est fixée en bas du chambranle extérieur de la porte palière du logement desservi. Les compteurs peuvent aussi se trouver sur un palier inférieur, intermédiaire ou supérieur.","ref":"§ 5.2.2 Les organes de coupure (chap. 1) — p. 63","p":"une bague avec un repérage (lettre ou chiffre) peut être fixée sur la canalisation à proximité immédiate de l\u0027OCI. Une plaque métallique avec ce même repérage est fixée en bas du chambranle extérieur de la porte palière","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Équipier","q":"En règle générale, comment ferme-t-on un OCG ou un OCI équipé d\u0027un robinet quart de tour ?","c":["D\u0027un quart de tour vers la gauche, dans le sens inverse des aiguilles","D\u0027un quart de tour vers la droite, sens des aiguilles d\u0027une montre","D\u0027un demi-tour vers la droite, jusqu\u0027à la butée du robinet","En tirant la poignée vers soi, puis en la tournant d\u0027un quart de tour"],"r":1,"e":"En règle générale, la fermeture se fait en tournant le robinet d\u0027un quart de tour vers la droite, dans le sens des aiguilles d\u0027une montre, ou en appuyant sur un bouton coup de poing.","ref":"§ 5.2.2 Les organes de coupure (chap. 1) — p. 64","p":"En règle générale la fermeture se fait en tournant le robinet d\u0027un quart de tour vers la droite (sens des aiguilles d\u0027une montre) ou en appuyant sur un bouton coup de poing.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027équipe","q":"Dans certains immeubles de type haussmannien, quelle particularité présente la fermeture de certains OCI anciens ?","c":["Elle se fait d\u0027un quart de tour à gauche, sens inverse des aiguilles","Elle exige une clé spéciale que seul le gestionnaire du réseau détient","Elle se fait en tirant le robinet vers soi avant de le tourner à droite","Elle se fait d\u0027un demi-tour à droite, jusqu\u0027à la butée du robinet"],"r":0,"e":"Dans certains immeubles de type haussmannien, des OCI anciens se ferment par un quart de tour dans le sens inverse des aiguilles d\u0027une montre, donc à gauche. Ils ne sont plus installés par GRDF mais restent en service ; la plupart portent une flèche de rotation gravée sur la porte de leur cadre.","ref":"§ 5.2.3 Les organes de coupure atypiques (chap. 1) — p. 67","p":"des organes de coupure individuelle dont la fermeture s\u0027effectue par un quart de tour dans le sens inverse des aiguilles d\u0027une montre, donc à gauche.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Dans un pavillon ancien, l\u0027organe de coupure le plus proche de la fuite est un té obturateur atypique et aucun technicien du gestionnaire n\u0027est présent. Quelle orientation donne le guide ?","c":["Le manœuvrer sans attendre avec l\u0027outillage de l\u0027engin","Le démonter pour obturer la conduite avec un bouchon provisoire","Renoncer à toute coupure avant l\u0027arrivée du gestionnaire","Couper plutôt depuis un organe utilisable par les sapeurs-pompiers"],"r":3,"e":"La manœuvre des organes de coupure atypiques nécessite du matériel adapté et une bonne connaissance de leur fonctionnement ; elle peut engendrer une fuite de gaz. En l\u0027absence d\u0027un technicien de l\u0027exploitant, le guide demande de privilégier la coupure à partir d\u0027un organe utilisable par les sapeurs-pompiers.","ref":"§ 5.2.3 Les organes de coupure atypiques (chap. 1) — p. 67","p":"en l\u0027absence d\u0027un technicien de l\u0027exploitant du réseau de distribution, il faut privilégier la coupure du gaz à partir d\u0027un organe de coupure utilisable par les sapeurs-pompiers.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Fuite sur un réseau de distribution de propane alimenté par une citerne : qui est habilité à intervenir sur l\u0027installation ?","c":["GRDF, gestionnaire du réseau de gaz naturel","Le fournisseur de gaz propane de l\u0027installation","GRTgaz, gestionnaire du réseau de transport","Les sapeurs-pompiers, sur l\u0027ensemble du réseau"],"r":1,"e":"GRDF et les exploitants du gaz naturel ne sont pas compétents sur ce type de réseau : seul le fournisseur de gaz est habilité à intervenir sur son installation, et son nom se trouve généralement près de la citerne. Les sapeurs-pompiers peuvent toutefois fermer le robinet de sortie de citerne.","ref":"§ 6 Le transport et la distribution du propane (chap. 1) — p. 68","p":"GRDF ou les exploitants du gaz naturel ne sont pas compétents sur ce type de réseau. Seul le fournisseur de gaz est habilité à intervenir sur son installation.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès et premier COS sur une fuite du réseau de distribution de gaz, avec qui formez-vous un binôme sur le terrain ?","c":["Le représentant des forces de l\u0027ordre","Le maire de la commune ou son représentant","Le chef d\u0027agrès du premier engin de renfort","Le représentant de l\u0027opérateur du réseau de gaz"],"r":3,"e":"Dans toutes les opérations partagées avec les partenaires opérationnels des SIS, le COS et le représentant de l\u0027opérateur forment un binôme : les intentions du COS et les conseils techniques de l\u0027opérateur doivent être partagés. Le COS reste chargé de la mise en œuvre de tous les moyens publics et privés mobilisés.","ref":"§ 8 Les acteurs (chap. 1) — p. 73","p":"dans toutes les opérations partagées avec les partenaires opérationnels des SIS, le COS et le représentant de l\u0027opérateur forment un binôme.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Transport, distribution, acteurs","niv":"Chef d\u0027agrès","q":"Dans la chaîne de sécurité gaz de GRDF, quel intervenant effectue la mise en sécurité dans les cas courants ?","c":["Le chef d\u0027exploitation (CE)","L\u0027appui terrain du chef d\u0027exploitation (ATCE)","L\u0027exploitant délégué du territoire","L\u0027intervenant sécurité (IS)"],"r":3,"e":"L\u0027intervenant sécurité (IS) effectue la mise en sécurité dans les cas courants et rend compte au chef d\u0027exploitation (CE). L\u0027appui terrain du chef d\u0027exploitation (ATCE), qui arrive après l\u0027IS, assure le relais entre le CE, les acteurs terrain et les services de sécurité.","ref":"§ 8 Les acteurs (chap. 1) — p. 75","p":"L\u0027intervenant sécurité (IS) : effectue la mise en sécurité dans les cas courants. Il doit rendre compte au chef d\u0027exploitation (CE).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Selon le guide, quel rôle joue le confinement dans la survenue et la gravité d\u0027une explosion de gaz ?","c":["Il est indispensable : sans lui, aucune explosion n\u0027est possible","Il n\u0027est pas indispensable mais aggrave l\u0027explosion et ses risques","Il atténue l\u0027explosion en contenant l\u0027onde de pression","Il n\u0027a aucune influence sur les dégâts causés par l\u0027explosion"],"r":1,"e":"Le confinement n\u0027est pas une condition indispensable de l\u0027explosion mais un facteur aggravant du phénomène et des risques associés : sans confinement, on obtient une combustion rapide avec des flammes importantes mais, généralement, sans effet de pression notable. Les dégâts dépendent aussi du niveau de confinement du local ou de l\u0027enceinte.","ref":"§ 1 L\u0027explosion (chap. 2) — p. 80","p":"Le confinement n\u0027est pas une condition indispensable mais représente un facteur aggravant du phénomène d\u0027explosion et des risques associés.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Par quelle étape débute, selon le guide, le phénomène d\u0027UVCE (explosion d\u0027un nuage de gaz en milieu non confiné) ?","c":["La rupture brutale d\u0027un réservoir de gaz liquéfié","La décomposition spontanée du gaz stocké","L\u0027inflammation immédiate de la fuite","Une fuite non enflammée de produit inflammable"],"r":3,"e":"L\u0027UVCE suppose successivement une fuite non enflammée de produit inflammable, la dispersion du nuage dans l\u0027air, son transport jusqu\u0027à une source d\u0027allumage, puis la propagation d\u0027un front de flamme avec rayonnement thermique et onde de surpression. La rupture brusque de l\u0027enveloppe d\u0027un réservoir de gaz liquéfié correspond, elle, au BLEVE.","ref":"§ 2 L\u0027explosion de gaz en milieu ouvert (UVCE) (chap. 2) — p. 81","p":"Ce phénomène suppose les étapes successives : une fuite non enflammée de produit inflammable avec une forte densité en phase gazeuse ou en phase liquide","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Équipier","q":"Qu\u0027appelle-t-on un BLEVE ?","c":["L\u0027explosion d\u0027un nuage de vapeurs inflammables en milieu non confiné","La décomposition explosive d\u0027un gaz dissous sous l\u0027effet de la chaleur","L\u0027explosion d\u0027un réservoir de gaz liquéfié dont l\u0027enveloppe se rompt","L\u0027inflammation d\u0027une fuite de gaz sous pression sous forme de jet"],"r":2,"e":"Le BLEVE est l\u0027explosion d\u0027un gaz stocké sous forme liquide dans un réservoir, lors de la rupture brusque de son enveloppe, due à sa fragilisation (effets thermiques ou mécaniques) et à l\u0027augmentation de la pression interne. Il est souvent concomitant à un incendie. L\u0027explosion d\u0027un nuage de vapeurs en milieu non confiné est un UVCE.","ref":"§ 3 La vaporisation violente à caractère explosif (BLEVE) (chap. 2) — p. 82","p":"Le BLEVE (Boiling Liquid Expending Vapor Explosion) est l\u0027explosion d\u0027un gaz stocké dans un réservoir sous forme liquide se produisant lorsqu\u0027il y a rupture brusque de l\u0027enveloppe.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Un BLEVE peut-il se produire sur un réservoir contenant un gaz liquéfié non inflammable ?","c":["Non, car le BLEVE est une réaction de combustion du gaz libéré","Oui, car il résulte d\u0027un changement d\u0027état et non d\u0027une combustion","Non, car seuls les gaz inflammables sont stockés sous forme liquide","Oui, mais seulement si le réservoir est exposé à un incendie"],"r":1,"e":"Le BLEVE est associé à un changement d\u0027état instantané et non à une réaction de combustion : il n\u0027est donc pas nécessaire que le produit soit inflammable. S\u0027il l\u0027est, le danger est aggravé par une boule de feu. La rupture de l\u0027enveloppe peut être due à des effets thermiques ou mécaniques.","ref":"§ 3 La vaporisation violente à caractère explosif (BLEVE) (chap. 2) — p. 82","p":"Le BLEVE est associé à un changement d\u0027état instantané et non à une réaction de combustion. Ainsi, il n\u0027est pas nécessaire que le produit concerné soit inflammable.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Selon le guide, comment se comporte au feu une bouteille de GPL en matériau composite ?","c":["Elle éclate plus violemment qu\u0027une bouteille traditionnelle en acier soudé","Elle se dilate fortement jusqu\u0027au plein hydraulique, puis éclate","Elle reste étanche et résiste au feu sans libérer de gaz","Son enveloppe devient poreuse et le gaz fuit en alimentant l\u0027incendie"],"r":3,"e":"Contrairement aux bouteilles traditionnelles, les bouteilles composites ne se dilatent que très faiblement. Au feu, leur enveloppe devient poreuse : le gaz fuit à travers et alimente l\u0027incendie. Le guide précise qu\u0027elles ne peuvent pas éclater.","ref":"§ 5.1 Les bouteilles de gaz de pétroles liquéfiés (chap. 2) — p. 86","p":"Soumise au feu, l\u0027enveloppe de la bouteille devient poreuse au contact de la chaleur, le gaz fuit à travers et vient alimenter l\u0027incendie. Les bouteilles en matériau composite ne peuvent pas éclater.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Une bouteille de GPL brûle au niveau de son robinet, resté accessible. Un équipier craint qu\u0027en le fermant, la flamme ne rentre dans la bouteille. Que lui répondez-vous ?","c":["Il a raison : seul un spécialiste du gaz peut fermer ce robinet","Il a raison : il faut d\u0027abord éteindre la flamme avant toute fermeture","La fermeture du robinet ne peut pas provoquer de retour de flamme","Le retour de flamme n\u0027est possible que si la bouteille est presque vide"],"r":2,"e":"Le guide est explicite : lors d\u0027un feu au niveau du robinet d\u0027une bouteille de GPL, la fermeture de celui-ci ne peut pas entraîner de retour de flamme à l\u0027intérieur de la bouteille.","ref":"§ 5.1 Les bouteilles de gaz de pétroles liquéfiés (chap. 2) — p. 87","p":"Lors d\u0027un feu au niveau du robinet de bouteille de GPL, la fermeture de celui-ci ne peut pas entrainer un retour de flamme à l\u0027intérieur de la bouteille.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Des bouteilles de gaz comprimé sont exposées à un incendie. L\u0027exploitant affirme qu\u0027elles sont munies de fusibles thermiques. Comment faut-il les considérer en opération ?","c":["Comme sans dispositif de sécurité, tout en craignant un déclenchement du fusible","Comme protégées de l\u0027éclatement par leur fusible, qui fera chuter la pression","Comme protégées, à condition de les refroidir jusqu\u0027au déclenchement du fusible","Comme sans danger tant que leur fusible thermique ne s\u0027est pas déclenché"],"r":0,"e":"En opération, il faut systématiquement considérer que les bouteilles exposées au sinistre ne sont pas dotées d\u0027un dispositif de sécurité, tout en prenant en compte les dangers d\u0027un déclenchement intempestif du fusible (flux thermique). Dans des conditions extrêmes, ces dispositifs ne se déclenchent pas suffisamment tôt.","ref":"§ 5.2 Les bouteilles de gaz comprimés (chap. 2) — p. 88","p":"En opération, il faut systématiquement considérer que les bouteilles de gaz exposées au sinistre ne sont pas dotées d\u0027un dispositif de sécurité en prenant en compte les dangers potentiels d\u0027un déclenchement intempestif du fusible (flux thermique).","s":"gdo-gaz"},
