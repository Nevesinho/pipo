{"t":"gto-vent","ch":"Antiventilation","niv":"Équipier","q":"Que désigne l\u0027antiventilation ?","c":["L\u0027arrêt du ventilateur et le repli du matériel en fin d\u0027intervention","Une ventilation menée à contre-courant du vent pour rabattre les fumées","L\u0027extraction des fumées par un ventilateur raccordé à une gaine","Une attaque qui prive le feu de comburant en limitant l\u0027apport d\u0027air"],"r":3,"e":"L\u0027antiventilation favorise l\u0027attaque du feu en le privant en grande partie de comburant : l\u0027objectif est de réduire au maximum l\u0027apport d\u0027air au combustible. Elle se combine avec une attaque hydraulique qui refroidit les fumées et les gaz chauds et les inerte par la vapeur d\u0027eau produite.","ref":"§ VEN-STR-ATT-2 1. Objectif — p. 53","p":"Cette technique opérationnelle permet de favoriser l\u0027attaque du feu en le privant en grande partie de comburant. L\u0027objectif est de réduire au maximum l\u0027apport d\u0027air au combustible.","s":"gto-vent"},
{"t":"gto-vent","ch":"Antiventilation","niv":"Équipier","q":"En antiventilation d\u0027attaque, comment la porte d\u0027accès aux locaux sinistrés est-elle laissée une fois franchie par le binôme ?","c":["Refermée sur le tuyau, l\u0027échange réduit à environ 0,2 m²","Entrouverte sur environ 1 m² pour limiter la chaleur","Dégondée et posée en biais pour dévier les fumées","Ouverte en grand et calée, afin de garantir un repli rapide"],"r":0,"e":"La porte d\u0027accès est refermée en laissant juste le passage du tuyau : la surface d\u0027échange est réduite à environ 0,2 m², ce qui limite fortement les risques de flashover, de backdraft et de FGI dans les volumes enfumés. Un stoppeur de fumées peut compléter ce dispositif.","ref":"§ VEN-STR-ATT-2 4.1. 1re phase — p. 54","p":"La porte d\u0027accès aux locaux concernés par le feu est refermée, laissant juste le passage du tuyau, ainsi la surface d\u0027échange sera réduite (estimée à environ 0,2 m²).","s":"gto-vent"},
{"t":"gto-vent","ch":"Antiventilation","niv":"Équipier","q":"En antiventilation, le binôme d\u0027attaque arrive à la porte du volume source du foyer. Que fait-il selon le guide ?","c":["Il ouvre la porte en grand et attaque le foyer en jet droit continu","Il entrouvre, fait une impulsion de 2 à 3 secondes et referme","Il crée un sortant dans le volume avant d\u0027en ouvrir la porte","Il attend la mise en route du ventilateur pour ouvrir la porte"],"r":1,"e":"Le binôme effectue une impulsion de deux ou trois secondes dans le volume source entrouvert, puis referme la porte : le feu reste privé d\u0027oxygène tandis que la vaporisation de l\u0027eau refroidit et inerte le volume. L\u0027opération est renouvelée plusieurs fois si nécessaire.","ref":"§ VEN-STR-ATT-2 4.2. 2e phase — p. 55","p":"Le binôme d\u0027attaque effectue une impulsion de deux ou trois secondes dans le volume source du foyer alors entrouvert, puis la referme.","s":"gto-vent"},
{"t":"gto-vent","ch":"Antiventilation","niv":"Chef d\u0027équipe","q":"Lors de l\u0027inertage en antiventilation, quel effet risque d\u0027avoir un débit d\u0027application de l\u0027eau trop important ?","c":["Un inertage plus rapide et plus durable du volume","Un embrasement immédiat des fumées par effet piston","Une remontée de la couche de fumées vers le plafond","Une production d\u0027eau tiède plus que de vapeur d\u0027eau"],"r":3,"e":"Le but n\u0027est pas d\u0027apporter beaucoup d\u0027eau mais surtout de la vaporiser, en récupérant par des impulsions la chaleur du volume gazeux et des parois les plus chaudes. Un débit trop important risque de produire de l\u0027eau tiède plus que de la vapeur d\u0027eau.","ref":"§ VEN-STR-ATT-2 5. Cohérence de l\u0027action — p. 58","p":"Un débit d\u0027application de l\u0027eau trop important lors de cette phase risque d\u0027avoir pour effet une production d\u0027eau tiède plus qu\u0027une production de vapeur d\u0027eau.","s":"gto-vent"},
{"t":"gto-vent","ch":"Antiventilation","niv":"Chef d\u0027équipe","q":"Pendant une attaque en antiventilation, quel événement peut provoquer un changement brutal du régime de combustion ?","c":["La fermeture de la porte d\u0027accès sur le tuyau d\u0027attaque","Une impulsion de deux secondes dans le volume","La rupture d\u0027un ouvrant comme un simple vitrage","La pose d\u0027un stoppeur de fumées sur la porte"],"r":2,"e":"Parmi les risques de l\u0027antiventilation couplée à une attaque offensive, le guide cite la rupture non souhaitée d\u0027un ouvrant, qui peut changer plus ou moins brutalement le régime de combustion : il faut se méfier des simples vitrages et des huisseries PVC.","ref":"§ VEN-STR-ATT-2 6. Limites d\u0027emploi — p. 58","p":"de la rupture non souhaitée d\u0027un ouvrant pouvant générer un changement plus ou moins brutal du régime de combustion (se méfier des simples vitrages et des huisseries PVC) ;","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Chef d\u0027agrès","q":"Feu dans un local de grand volume : on ouvre des sortants en partie haute en limitant les entrants en partie basse. Quel en est l\u0027effet ?","c":["La mise en surpression de la plus grande partie du volume","La descente des fumées chaudes jusqu\u0027au niveau du sol","La privation totale du foyer de tout apport d\u0027air","La mise en dépression de la plus grande partie du volume"],"r":3,"e":"Ouvrir des sortants en partie haute en limitant les entrants en partie basse met la plus grande partie du volume en dépression : le flux est orienté favorablement au niveau des entrants, ce qui permet l\u0027attaque, et le risque de propagation aux volumes adjacents est limité.","ref":"§ VEN-STR-PAR-1 2.3. Usage possible de la ventilation naturelle — p. 64","p":"L\u0027ouverture de sortants (partie haute) avec limitation des entrants (partie basse) aura pour effet de mettre la plus grande partie du volume en dépression ce qui oriente de façon favorable le flux au niveau des entrants","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Chef d\u0027agrès","q":"Feu de parking souterrain relié à des immeubles par des cages d\u0027escalier. Pourquoi mettre ces cages en surpression ?","c":["Pour protéger les immeubles et créer des zones sûres d\u0027accès et de repli","Pour désenfumer rapidement l\u0027ensemble des niveaux du parking après extinction","Pour apporter de l\u0027air au foyer et hâter la fin de la combustion","Pour chasser les fumées du parking vers les étages des immeubles"],"r":0,"e":"La surpression des cages (ventilateur devant la porte d\u0027entrée, sans sortant) protège les immeubles et crée à chaque niveau des zones sûres servant de points d\u0027accès et de repli. Ces ventilateurs modestes ne sont aucunement dimensionnés pour évacuer rapidement les fumées du parking, même après extinction.","ref":"§ VEN-STR-PAR-2 4. Cohérence de l\u0027action — p. 67","p":"La mise en place de surpression dans les cages d\u0027escalier permet : de protéger les immeubles ; de créer trois zones sûres à chaque niveau du parking pouvant servir de point d\u0027accès (et de repli) pour les intervenants","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Chef d\u0027agrès","q":"Feu développé dans un parking souterrain équipé d\u0027extracteurs. Quand ces moyens fixes de désenfumage retrouvent-ils toute leur pertinence ?","c":["Dès l\u0027arrivée des secours, avant toute reconnaissance","Après l\u0027extinction, quand cesse la production massive de fumée","Pendant l\u0027attaque, à condition d\u0027arrêter les ventilateurs mobiles","Lorsque le feu atteint son plein développement"],"r":1,"e":"Tant que le feu est développé, les moyens de désenfumage du parking sont insuffisants pour évacuer la totalité des fumées ; ils favorisent toutefois le maintien de la stratification. Ils retrouvent toute leur pertinence après l\u0027extinction, éventuellement complétés par les moyens mobiles des sapeurs-pompiers.","ref":"§ VEN-STR-PAR-2 5.1. Nature des ventilateurs utilisés — p. 68","p":"Les moyens de désenfumage du parking sont insuffisants pour évacuer la totalité des fumées lorsque le feu est développé, C\u0027est uniquement après l\u0027extinction et donc la production massive et continue de fumée qu\u0027ils retrouvent toute leur pertinence.","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Équipier","q":"Pour désenfumer un petit local borgne par son unique ouverture, à quelle distance placer un ventilateur conventionnel à jet évasé ?","c":["À 1 mètre de l\u0027ouverture","À 2 mètres de l\u0027ouverture","À 5 mètres de l\u0027ouverture","Au contact du seuil de l\u0027ouverture"],"r":0,"e":"L\u0027ouverture sert à la fois d\u0027entrant et de sortant : le ventilateur est placé à un mètre pour un modèle conventionnel à jet évasé, deux mètres pour un modèle à jet concentré. À moins d\u0027un mètre, une grande partie de l\u0027air et des fumées sortantes peut être réaspirée, avec un risque de surconcentration en CO pour un ventilateur thermique.","ref":"§ VEN-STR-PAR-3 2.1. Locaux de faible dimension — p. 69","p":"un ventilateur assez proche de l\u0027ouverture qui va servir à la fois d\u0027entrant et de sortant (un mètre pour un ventilateur conventionnel à jet évasé, deux mètres pour un ventilateur à jet concentré).","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Chef d\u0027équipe","q":"Un local borgne de grande profondeur est enfumé. Selon le guide, quelle technique est d\u0027usage pour le désenfumer ?","c":["Un ventilateur soufflant placé au seuil, réglé à sa puissance maximale","Un ventilateur en extraction placé au seuil et tourné vers l\u0027extérieur","Une gaine fixée sur le ventilateur et déployée vers le fond du local","Une lance en jet diffusé dirigée vers le fond du local, débit maximal"],"r":2,"e":"Soufflé directement, l\u0027air perd vite sa vitesse et revient vers l\u0027arrière du ventilateur sans atteindre le fond du local. Une gaine fixée sur le ventilateur et déployée vers le fond y injecte l\u0027air et met cette zone en surpression : les fumées se déplacent alors naturellement vers l\u0027extérieur.","ref":"§ VEN-STR-PAR-3 2.2. Locaux de plus grandes dimensions — p. 70","p":"Dans ces circonstances, il est d\u0027usage d\u0027utiliser une gaine de ventilation fixée sur le ventilateur. Cette gaine est déployée vers le fond du local.","s":"gto-vent"},
{"t":"gto-vent","ch":"Gros volumes, parkings, borgnes","niv":"Chef d\u0027équipe","q":"Selon le guide, que faut-il penser de l\u0027extraction des fumées par un ventilateur dans un local borgne ?","c":["Elle est plus efficace que le soufflage, car elle aspire les fumées à la source","Elle est la seule technique possible, faute de sortant dans le local","Elle est efficace à condition de placer le ventilateur au fond du local","Elle n\u0027est pas plus efficace que le soufflage sans gaine"],"r":3,"e":"Le guide dément une croyance répandue : l\u0027extraction n\u0027est pas plus efficace que le soufflage sans gaine, car sans circulation avec l\u0027extérieur le mouvement d\u0027air est très vite limité. L\u0027observation visuelle peut être trompeuse : les fumées qui semblent extraites seraient sorties même sans ventilation.","ref":"§ VEN-STR-PAR-3 2.2. Locaux de plus grandes dimensions — p. 71","p":"Si en règle générale il est bien compris que le soufflage avec un ventilateur, sans gaine, dans des locaux borgnes est sans effet, on note une croyance assez répandue que l\u0027extraction serait plus efficace ; il n\u0027en est rien.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Équipier","q":"On veut réduire la puissance de la ventilation, mais le ventilateur n\u0027a pas de réducteur de vitesse de rotation. Que propose le guide ?","c":["Éloigner le ventilateur de l\u0027entrant","Rapprocher le ventilateur au plus près de l\u0027entrant","Placer un ventilateur relais dans la veine d\u0027air","Créer un second sortant sur une autre façade"],"r":0,"e":"Faute de réducteur de vitesse de rotation, la puissance de la ventilation peut être réduite en éloignant le ventilateur de l\u0027entrant. Réduire la puissance peut être utile, par exemple pour éviter de déstratifier les fumées, qui se mélangeraient à l\u0027air frais et sortiraient plus lentement.","ref":"§ VEN-STR-PAR-4 2.3. Recherche du débit optimal — p. 77","p":"La réduction de la puissance de la ventilation, si elle ne peut être réalisée sur le ventilateur par action d\u0027un réducteur de vitesse de rotation pourra se faire en éloignant le ventilateur de l\u0027entrant.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027équipe","q":"Ventilation d\u0027attaque : des gaz chauds reviennent à contre-flux au-dessus du binôme, la porte de la pièce en feu étant grande ouverte. Que propose le guide ?","c":["Arrêter brutalement le ventilateur placé à l\u0027entrant","Ouvrir en grand toutes les portes intérieures du logement","Réduire le régime du ventilateur au ralenti","Refermer partiellement la porte de la pièce en feu"],"r":3,"e":"Porte très ouverte, le différentiel de pression créé par la ventilation peut être trop faible et les gaz de combustion revenir au-dessus des intervenants. Refermer partiellement la porte augmente les pertes de charge et rehausse la pression en amont, ce qui s\u0027oppose au retour des fumées.","ref":"§ VEN-STR-PAR-4 3.1. Création volontaire d\u0027une perte de charge — p. 78","p":"Le fait de refermer partiellement cette porte aura pour effet : d\u0027augmenter les pertes de charges ; de rehausser la pression en amont ; par conséquent de s\u0027opposer au retour des fumées","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027équipe","q":"Ventilation d\u0027attaque : le sortant doit être créé dans un vitrage. Quelle méthode est d\u0027usage selon le guide ?","c":["Ouvrir d\u0027abord en partie basse, puis agrandir vers le haut avant la mise en route","Ouvrir d\u0027abord en partie haute, puis agrandir une fois la veine d\u0027air établie","Ouvrir d\u0027emblée toute la fenêtre, avant l\u0027arrivée du binôme sur le palier","Ouvrir seulement après l\u0027extinction, une fois le binôme ressorti du volume"],"r":1,"e":"On cherche d\u0027abord une ouverture dans le vitrage en partie haute : les fumées les plus chaudes sont expulsées avec peu de déstratification et sans alimenter le foyer en oxygène. Une fois la ventilation en service à l\u0027entrant et la veine d\u0027air établie, le sortant peut être agrandi pour faire chuter la pression dans la pièce.","ref":"§ VEN-STR-PAR-4 3.3. Création du sortant en deux temps — p. 79","p":"il est d\u0027usage lorsque l\u0027on doit créer le sortant, de chercher une ouverture dans un vitrage en partie haute. […] une fois la ventilation mise en service à l\u0027entrant et la veine d\u0027air établie, le sortant pourra être agrandi","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027agrès","q":"Ventilation d\u0027attaque : vous faites créer un sortant en toiture à la gaffe. Quelle mesure de sécurité doit accompagner cette ouverture ?","c":["Engager un minimum de personnel pour réaliser l\u0027ouverture","Réduire la zone d\u0027exclusion pour faciliter l\u0027accès à l\u0027ouverture","Engager un binôme dans le volume par l\u0027ouverture créée","Retirer les moyens hydrauliques du secteur de l\u0027ouverture"],"r":0,"e":"La mise à l\u0027air libre de gaz chauds riches en gaz de pyrolyse impose des mesures adaptées : agrandissement de la zone d\u0027exclusion, engagement minimum de personnel pour réaliser l\u0027ouverture et, si nécessaire, moyen hydraulique prêt à être utilisé. Les intervenants ne doivent pas s\u0027engager par le sortant.","ref":"§ VEN-STR-PAR-4 3.3. Création du sortant en deux temps — p. 80","p":"la mise à l\u0027air libre de gaz chauds riches en gaz de pyrolyse, doit être accompagnée de mesures de sécurité adaptées (agrandissement de la zone d\u0027exclusion, engagement minimum de personnel pour réaliser l\u0027ouverture","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Équipier","q":"Porte palière fermée d\u0027un appartement enfumé. Selon le guide, à quel moment le binôme met-il en place le stoppeur de fumée ?","c":["Juste après l\u0027ouverture complète de la porte","Après l\u0027extinction, pour le désenfumage final","Une fois le binôme arrivé au local en feu","Avant de forcer ou d\u0027ouvrir la porte palière"],"r":3,"e":"Le stoppeur de fumée est positionné avant de forcer la porte palière : à l\u0027ouverture, l\u0027apport d\u0027air est limité et très peu de fumée envahit le couloir. Son rideau laisse passer le binôme et le tuyau, le chemin de repli est mieux sécurisé et la croissance du foyer est évitée.","ref":"§ VEN-STR-PAR-5 6.1. Sécurisation de l\u0027ouverture de la porte — p. 84","p":"A l\u0027arrivée des secours la porte palière est fermée. Avant de la forcer, les binômes positionnent le stoppeur de fumée. Ainsi, à l\u0027ouverture de la porte, l\u0027apport d\u0027air sera limité et très peu de fumée envahira le couloir.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Équipier","q":"Un stoppeur de fumée est en place au point de pénétration. Que recommande le guide pour le binôme de sécurité à proximité immédiate du rideau ?","c":["Qu\u0027il reste décapelé pour économiser son air","Qu\u0027il maintienne le rideau relevé en permanence","Qu\u0027il soit capelé, comme tout intervenant proche","Qu\u0027il se tienne à l\u0027intérieur du logement en feu"],"r":2,"e":"Au point de pénétration, il est préférable que le binôme de sécurité et les autres intervenants éventuels soient capelés s\u0027ils sont à proximité immédiate du rideau. Derrière celui-ci, le feu est maintenu en sous-ventilation et génère des fumées chargées en imbrûlés.","ref":"§ VEN-STR-PAR-5 5. Limites d\u0027emploi — p. 84","p":"Au point de pénétration, il est préférable que le binôme de sécurité et les autres intervenants éventuels soient capelés, s\u0027ils sont à proximité immédiate du rideau.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027équipe","q":"Derrière un stoppeur de fumée, le feu est maintenu en sous-ventilation. Quelle précaution le binôme d\u0027attaque prend-il pendant sa progression ?","c":["Ouvrir les fenêtres rencontrées pour évacuer au fur et à mesure les imbrûlés","Refroidir et saturer de vapeur les fumées par des applications raisonnées","Progresser lance fermée pour ne pas perturber la stratification des fumées","Relever le rideau du stoppeur pour garantir un apport d\u0027air frais suffisant"],"r":1,"e":"Le feu en sous-ventilation génère des fumées chargées en imbrûlés qui stagnent dans le volume. Le binôme les refroidit et les sature de vapeur d\u0027eau par des applications raisonnées pour empêcher leur inflammation, en inertant au fur et à mesure de sa progression.","ref":"§ VEN-STR-PAR-5 5. Limites d\u0027emploi — p. 84","p":"La précaution importante sera donc lors de la progression de refroidir et de saturer de vapeur d\u0027eau ces dernières, en procédant à des applications d\u0027eau raisonnées.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027équipe","q":"Feu d\u0027appartement : porte palière et une fenêtre ouvertes, cage d\u0027escalier enfumée. Que met en place le binôme pour pouvoir désenfumer la cage pendant qu\u0027il pénètre dans le logement ?","c":["Un stoppeur de fumée dans l\u0027encadrement de la porte palière","Un ventilateur dans le logement, soufflant vers la cage d\u0027escalier","Un stoppeur de vent plaqué contre la porte palière, côté cage","Une lance en jet diffusé orientée vers la cage d\u0027escalier"],"r":0,"e":"Le binôme sécurise la cage d\u0027escalier avec un stoppeur de fumée à la porte palière : le foyer ne prend plus que très peu d\u0027air par la porte. On peut alors désenfumer la cage pendant que le binôme pénètre ; la fumée ne s\u0027y propage plus et l\u0027on dispose d\u0027une zone de repli sécurisée. Le stoppeur de vent, lui, se place devant une fenêtre exposée au vent.","ref":"§ VEN-STR-PAR-5 6.2. Gestion des flux sur une porte ouverte — p. 85","p":"Une fois le stoppeur de fumée en place on peut procéder au désenfumage de la cage d\u0027escalier, pendant ce temps le binôme peut pénétrer dans l\u0027espace enfumé.","s":"gto-vent"},
{"t":"gto-vent","ch":"Optimisation et stoppeurs","niv":"Chef d\u0027équipe","q":"Feu en étage élevé, fenêtre ouverte sur une façade exposée à un vent fort. Quel risque crée l\u0027ouverture d\u0027un accès par la cage d\u0027escalier ?","c":["Le vent aspire les fumées vers la fenêtre et dégage la cage d\u0027escalier","Le vent refroidit les fumées, qui retombent et stagnent dans le logement","Le vent pousse les fumées vers la cage d\u0027escalier, voire la porte d\u0027entrée","Le vent reste sans effet, la cage d\u0027escalier étant à l\u0027abri de cette façade"],"r":2,"e":"L\u0027usage de la cage d\u0027escalier pour l\u0027accès des secours ou l\u0027évacuation des victimes crée une veine d\u0027air : depuis la façade exposée au vent, les fumées sont poussées vers la cage d\u0027escalier et même potentiellement vers la porte d\u0027entrée. C\u0027est le phénomène de « blow torching ».","ref":"§ VEN-STR-PAR-6 3. Application — p. 87","p":"L\u0027usage de la cage d\u0027escalier pour l\u0027accès des secours ou l\u0027évacuation des victimes va créer une veine d\u0027air qui poussera depuis la façade exposée au vent les fumées vers la cage d\u0027escalier et même potentiellement vers la porte d\u0027entrée.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilateurs thermiques et CO","niv":"Équipier","q":"À taille équivalente, quel avantage les ventilateurs thermiques présentent-ils sur les ventilateurs électriques et hydrauliques ?","c":["Des vitesses de rotation plus élevées","L\u0027absence totale de gaz d\u0027échappement","Un fonctionnement plus silencieux","Un emploi sans risque en local clos"],"r":0,"e":"Les ventilateurs thermiques permettent des vitesses de rotation plus élevées que les électriques et bien plus encore que les hydrauliques. Quoiqu\u0027un peu plus bruyants, ils constituent l\u0027essentiel du parc embarqué dans les engins-pompes, mais leur usage impose une vigilance particulière face au risque d\u0027intoxication.","ref":"§ VEN-STR-PAR-7 2. Les solutions alternatives — p. 89","p":"les ventilateurs thermiques présentent un intérêt certain, permettant des vitesses de rotation plus élevées que les électriques et bien plus encore que les hydrauliques (pour une taille équivalente).","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilateurs thermiques et CO","niv":"Équipier","q":"Pourquoi le guide juge-t-il indispensable de veiller à l\u0027entretien des ventilateurs thermiques ?","c":["Pour pouvoir travailler sans protection respiratoire","Pour garantir une combustion optimale du moteur","Pour pouvoir les placer à moins d\u0027un mètre de l\u0027entrant","Pour leur permettre d\u0027extraire des gaz chauds"],"r":1,"e":"L\u0027entretien des ventilateurs thermiques est indispensable pour garantir une combustion optimale du moteur. Respirer des gaz d\u0027échappement est en effet nocif, voire dangereux, et toute exposition non justifiée est à éviter.","ref":"§ VEN-STR-PAR-7 3. Analyse des risques — p. 89","p":"De plus, il est indispensable de veiller à l\u0027entretien de ces équipements, afin de garantir une combustion optimale du moteur.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilateurs thermiques et CO","niv":"Équipier","q":"Que prescrit le guide pour les travaux effectués sous une ventilation assurée par un ventilateur thermique ?","c":["Ils peuvent se faire sans protection respiratoire, l\u0027air insufflé étant frais","Ils sont autorisés sans ARI dès que le ventilateur est placé dehors","Ils doivent être limités à dix minutes par intervenant sans ARI","Ils ne doivent pas se faire sans protection respiratoire adaptée"],"r":3,"e":"Les gaz d\u0027échappement contiennent du CO, marqueur d\u0027autres polluants. Même si les débits d\u0027air les diluent fortement, les travaux sans protection respiratoire adaptée ne doivent pas se faire sous ventilation thermique, et il est fortement conseillé de garder l\u0027ARI dans la veine d\u0027air si l\u0027exposition est longue.","ref":"§ VEN-STR-PAR-7 3. Analyse des risques — p. 89","p":"Les travaux sans protection respiratoire adaptee ne doivent pas se faire sous ventilation thermique.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilateurs thermiques et CO","niv":"Chef d\u0027agrès","q":"Vous envisagez d\u0027utiliser un ventilateur thermique positionné à l\u0027intérieur d\u0027un local. Quelle mesure le guide exige-t-il notamment ?","c":["Un fonctionnement limité à cinq minutes","Un ventilateur certifié ATEX uniquement","Un régime moteur réduit au ralenti","Un contrôle en continu du taux de CO"],"r":3,"e":"Les accidents sérieux constatés relevaient d\u0027un usage inapproprié, notamment en intérieur. Un tel usage demande une grande attention, une bonne maîtrise des techniques et un contrôle en continu du CO : si la ventilation devient inefficace, le taux de CO peut croître considérablement alors que le brassage d\u0027air près du ventilateur peut donner l\u0027impression d\u0027une ventilation efficace.","ref":"§ VEN-STR-PAR-7 3. Analyse des risques — p. 90","p":"Il n\u0027est pas impossible de travailler avec des ventilateurs thermiques positionnés en intérieur, mais cela demande une grande attention, une bonne maîtrise des techniques de ventilation et la mise en place d\u0027un contrôle en continu du CO.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilateurs thermiques et CO","niv":"Équipier","q":"Lors d\u0027un déblai ventilé par un ventilateur électrique, pourquoi le guide demande-t-il de ne pas abandonner toute protection respiratoire ?","c":["Le ventilateur électrique produit lui aussi du monoxyde de carbone","La ventilation soulève des particules et accélère le dégazage","Le ventilateur électrique appauvrit l\u0027air en oxygène dans le local","La ventilation ravive systématiquement les foyers déjà éteints"],"r":1,"e":"Même sans moteur thermique, la ventilation d\u0027un déblai risque de mettre en suspension des particules solides (cendres, fibres de verre...) libérées par la destruction thermique des matériaux, et d\u0027accroître la vitesse de désorption de gaz toxiques.","ref":"§ VEN-STR-PAR-7 3. Analyse des risques — p. 90","p":"L\u0027usage de ventilateurs non thermiques pour un deblai ne doit pas conduire a abandonner toute protection respiratoire. En effet, la ventilation risque de mettre en suspension des particules solides","s":"gto-vent"},
{"t":"gto-vent","ch":"Lance et localisation du sortant","niv":"Équipier","q":"Sur quel principe repose la ventilation par entraînement d\u0027air à la lance ?","c":["L\u0027eau projetée refroidit le ventilateur et accroît son débit","Une turbine mue par l\u0027eau de la lance souffle l\u0027air dans le volume","Les gouttelettes du jet diffusé poussent l\u0027air devant elles","Un rideau d\u0027eau devant l\u0027entrant rafraîchit l\u0027air insufflé"],"r":2,"e":"La lance en jet diffusé projette vers l\u0027avant de nombreuses gouttelettes qui poussent l\u0027air devant elles ; cette accélération entraîne l\u0027air avoisinant et amplifie le débit. La technique ne peut pas fonctionner s\u0027il n\u0027y a pas de sortant.","ref":"§ VEN-STR-PAR-8 1. Objectif — p. 93","p":"La lance en jet diffusé projette vers l\u0027avant des gouttelettes d\u0027eau. En grand nombre, elles vont pousser l\u0027air devant elles qui se met en mouvement.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lance et localisation du sortant","niv":"Équipier","q":"Un porte-lance progresse en jet diffusé continu pour ventiler devant lui, mais le volume ne possède aucun sortant. Quel risque le guide signale-t-il ?","c":["Le flux revient sur lui en partie basse, avec un risque de brûlures","Le jet se brise sous l\u0027effet de la surpression créée dans le volume","Les fumées sont aspirées vers l\u0027entrant et la cage d\u0027escalier","La lance perd sa pression du fait de la contre-pression des fumées"],"r":0,"e":"La ventilation par entraînement d\u0027air à la lance ne fonctionne pas sans sortant : le jet repousse les fumées en partie haute, mais le flux, ne pouvant s\u0027échapper au-delà du foyer, revient sur le porte-lance en partie basse et l\u0027expose à des brûlures.","ref":"§ VEN-STR-PAR-8 2.1. Ventilation hydraulique en phase d\u0027attaque — p. 94","p":"le jet diffusé continu aura tendance à repousser les fumées en partie haute (impact et création de vapeurs) mais le flux ne pouvant s\u0027échapper au-delà du foyer va revenir sur le porte-lance en partie basse, générant un risque de brûlures.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lance et localisation du sortant","niv":"Chef d\u0027agrès","q":"Des fumées très abondantes sortent d\u0027une fenêtre, sans flammes visibles. Que préconise le guide avant de lancer une ventilation d\u0027attaque ?","c":["Démarrer aussitôt en prenant cette fenêtre comme sortant","Vérifier en reconnaissance qu\u0027il s\u0027agit bien du local en feu","Renoncer définitivement à toute ventilation sur cette intervention","Créer un second sortant en toiture avant la reconnaissance"],"r":1,"e":"Sans flammes visibles à la fenêtre, il est judicieux de ne pas se précipiter pour mettre en route d\u0027emblée une ventilation d\u0027attaque : la reconnaissance doit confirmer qu\u0027il s\u0027agit bien du local concerné par l\u0027incendie. Les équipes peuvent préparer le matériel de ventilation pour gagner du temps.","ref":"§ VEN-STR-PAR-9 4. Impact sur d\u0027éventuelles victimes — p. 100","p":"il est judicieux de ne pas se précipiter pour mettre en route d\u0027emblée une ventilation d\u0027attaque, afin de s\u0027assurer, lors de la reconnaissance, qu\u0027il s\u0027agit bien du local concerné par l\u0027incendie.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lance et localisation du sortant","niv":"Chef d\u0027équipe","q":"Étage enfumé par un feu assez peu ventilé. Où le guide situe-t-il essentiellement les chances de survie d\u0027éventuelles victimes ?","c":["Dans les couloirs, au plus près des portes palières","Dans la pièce en feu, près de la fenêtre","Dans les pièces fermées non touchées par le feu","Dans les pièces ouvertes sur la circulation"],"r":2,"e":"En cas de feu assez peu ventilé, les chances de survie se situent essentiellement dans les pièces fermées non concernées par le sinistre ; ailleurs, les concentrations en CO sont rapidement létales. Si elles restent fermées, ces zones de survie sont peu impactées par la création du sortant.","ref":"§ VEN-STR-PAR-9 4. Impact sur d\u0027éventuelles victimes — p. 100","p":"Dans les étages enfumés, en cas d\u0027un feu assez peu ventilé, les chances de survies se situent essentiellement dans les pièces fermées non concernées par le sinistre. Dans les autres pièces, les concentrations en CO sont rapidement létales.","s":"gto-vent"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Chef d\u0027agrès","q":"Vous êtes COS sur un sauvetage. Selon le GTO, quel critère doit guider le choix du moyen de sauvetage ?","c":["Le moyen le plus rapide, quel que soit le risque","Le moyen mobilisant le moins de personnels de l\u0027engin","Le moyen exposant le moins le sauveteur et la victime au risque","Le moyen permettant d\u0027évacuer le plus de personnes à la fois"],"r":2,"e":"L\u0027analyse rapide de la situation doit permettre au COS de réaliser le sauvetage en choisissant le moyen exposant le moins possible le sauveteur et la victime au risque. Le facteur temps est capital mais, dans la mesure du possible, le risque pris ne doit jamais se prolonger en intensité et en durée.","ref":"§ Chapitre 1 Connaissances générales — p. 13","p":"L\u0027analyse rapide de la situation doit permettre au COS de réaliser le sauvetage en choisissant le moyen exposant le moins possible le sauveteur et la victime au risque.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Chef d\u0027agrès","q":"Pour préserver les occupants d\u0027un immeuble, le COS fait désenfumer la cage d\u0027escalier. Selon le guide, de quel type d\u0027action s\u0027agit-il ?","c":["Une action sur la source du danger","Une action sur le flux de danger","Une action directe sur la cible","Une action de confinement des occupants"],"r":1,"e":"Le guide distingue les actions sur la source (ex. : action sur un organe de coupure gaz, attaque du foyer), sur le flux de danger (ex. : désenfumage d\u0027une cage d\u0027escalier, mise en place d\u0027un moyen hydraulique) et sur la cible (sauvetage, mise en sécurité, évacuation, confinement).","ref":"§ 1.3 Les moyens disponibles — p. 15","p":"et/ou sur le flux de danger (ex : désenfumage d\u0027une cage d\u0027escalier, mise en place d\u0027un moyen hydraulique, ...) ;","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Chef d\u0027agrès","q":"Selon le guide, quelle pratique permet de gagner du temps et de la réactivité lors d\u0027une opération de sauvetage ?","c":["Mettre en station l\u0027échelle aérienne avant toute reconnaissance des lieux","Attendre la fin de la reconnaissance avant de sortir le matériel des coffres de l\u0027engin","Établir d\u0027emblée une lance en protection sur chaque façade exposée","Descendre systématiquement échelles et dévidoirs mobiles et les mettre en attente"],"r":3,"e":"Le facteur temps étant capital lors d\u0027une opération de sauvetage, le guide indique que la descente systématique des échelles et des dévidoirs mobiles et leur mise en attente permettent de gagner du temps et de la réactivité.","ref":"§ 1.3.1 Le temps — p. 16","p":"La descente des échelles et des dévidoirs mobiles de manière systématique et leur mise en attente permet de gagner du temps et de la réactivité.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Équipier","q":"Comment le GTO définit-il le dégagement d\u0027urgence ?","c":["Un sauvetage sans matériel, vers un lieu sûr, en quelques secondes","Un sauvetage par l\u0027extérieur au moyen du LSPCC, sans attendre l\u0027échelle","Une mise en sécurité d\u0027une victime valide par les communications existantes","Un déplacement réalisé une fois l\u0027examen et les gestes de secours effectués"],"r":0,"e":"La réalisation d\u0027un sauvetage sans matériel est considérée comme un dégagement d\u0027urgence : il déplace la victime de quelques mètres ou plus, en quelques secondes, jusqu\u0027à un lieu sûr, où l\u0027examen et les gestes de secours peuvent ensuite être réalisés. Le GTO présente notamment la traction par les poignets ou par les chevilles et le « porter pompier ».","ref":"§ 1 Les dégagements d\u0027urgence — p. 39","p":"La réalisation d\u0027un sauvetage sans matériel est considérée comme étant un dégagement d\u0027urgence. Ce dernier est destiné à déplacer, de quelques mètres ou plus, en quelques secondes, la victime jusqu\u0027à un lieu sûr.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Chef d\u0027équipe","q":"Selon le GTO, à quelle condition un dégagement d\u0027urgence peut-il être réalisé ?","c":["Lorsque la victime est inconsciente, pour la placer plus vite en PLS","Lorsque le danger est réel, immédiat, vital et non contrôlable","Lorsque le brancard n\u0027est pas disponible pour rejoindre le VSAV","Lorsque la victime demande elle-même à être déplacée"],"r":1,"e":"Un dégagement d\u0027urgence ne doit être réalisé que lorsque le danger est réel, immédiat, vital et non contrôlable. Il permet ensuite de réaliser en toute sécurité l\u0027examen, les gestes de secours d\u0027urgence et la surveillance de la victime.","ref":"§ 1 Les dégagements d\u0027urgence — p. 39","p":"Un dégagement d\u0027urgence ne doit être réalisé que lorsque le danger est réel, immédiat, vital et non contrôlable.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Principes et dégagements","niv":"Chef d\u0027équipe","q":"Évacuation rapide d\u0027une victime avec la grande sangle du lot de sauvetage : le trajet d\u0027évacuation est restreint. Que prévoit le guide ?","c":["Nouer la sangle autour des chevilles de la victime","Renoncer à la sangle au profit d\u0027un plan dur","Nouer la sangle autour des poignets de la victime","Passer la sangle sous les genoux de la victime"],"r":2,"e":"Le guide décrit l\u0027emploi de la grande sangle du lot de sauvetage pour une évacuation rapide par un itinéraire sans contrainte ; lorsque le trajet d\u0027évacuation est restreint, la sangle est nouée autour des poignets de la victime pour faciliter son évacuation.","ref":"§ 1.2.2 L\u0027utilisation d\u0027une sangle du lot de sauvetage — p. 42","p":"Dans des contextes où le trajet d\u0027évacuation est restreint, la sangle est nouée autour des poignets de la victime pour faciliter son évacuation","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Équipier","q":"Une victime valide est capable de se soustraire d\u0027elle-même au danger. Comment le GTO nomme-t-il l\u0027action du sapeur-pompier auprès d\u0027elle ?","c":["Un sauvetage","Un dégagement d\u0027urgence","Une mise en sécurité","Une reconnaissance"],"r":2,"e":"Le GTO nomme mise en sécurité l\u0027action menée auprès d\u0027une victime valide capable de se soustraire d\u0027elle-même au danger. Dans ce cas, le sauveteur accompagne, aide et conseille la victime.","ref":"§ 2.1 Les personnes valides — p. 42","p":"Lorsque la victime est valide et capable de se soustraire d\u0027elle-même du danger, l\u0027action du sapeur-pompier est nommée mise en sécurité. Dans ce cas, le sauveteur accompagne, aide et conseille la victime.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Équipier","q":"Une victime vient d\u0027être déplacée lors d\u0027une mise en sécurité et se trouve hors de danger. Que prévoit le GTO ?","c":["Elle peut repartir seule dès qu\u0027elle est hors de la zone menacée","Elle est orientée seule vers le point de rassemblement le plus proche","Elle attend seule, à l\u0027abri, la fin de l\u0027intervention","Elle ne doit jamais être laissée seule, dans tous les cas"],"r":3,"e":"Dans tous les cas, une victime déplacée ne doit jamais être laissée seule. La mise en place d\u0027un lien de confiance et de réconfort avec la victime est importante durant toute la durée de l\u0027intervention.","ref":"§ 2.1 Les personnes valides — p. 42","p":"Dans tous les cas, une victime déplacée ne doit jamais être laissée seule.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Chef d\u0027agrès","q":"Par quelle voie la mise en sécurité de personnes valides doit-elle s\u0027effectuer en priorité ?","c":["Par l\u0027échelle aérienne, mise en station pour toute personne en étage","Par le LSPCC, depuis la fenêtre du logement de la personne","Par l\u0027échelle à crochets, de balcon en balcon jusqu\u0027au sol","Par les communications existantes du bâtiment"],"r":3,"e":"La mise en sécurité doit s\u0027effectuer prioritairement par les communications existantes du bâtiment. Le LSPCC n\u0027est qu\u0027une alternative, lorsque l\u0027emploi de moyens plus sûrs est impossible et/ou que la situation nécessite une action immédiate.","ref":"§ 2.1 Les personnes valides — p. 43","p":"La mise en sécurité doit s\u0027effectuer prioritairement par les communications existantes.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès : les communications existantes sont impraticables et plusieurs personnes valides sont à mettre en sécurité en étage. Quel moyen le guide privilégie-t-il ?","c":["Le lot de sauvetage (LSPCC)","Les moyens élévateurs aériens","L\u0027échelle à crochets","Les échelles à coulisse"],"r":1,"e":"La mise en sécurité s\u0027effectue prioritairement par les communications existantes. En cas d\u0027impraticabilité de celles-ci, ou lors de mises en sécurité multiples, le guide privilégie l\u0027emploi des moyens élévateurs aériens.","ref":"§ 2.1 Les personnes valides — p. 43","p":"La mise en sécurité doit s\u0027effectuer prioritairement par les communications existantes. En cas d\u0027impraticabilité de ces dernières, ou lors de mises en sécurité multiples, l\u0027emploi des moyens élévateurs aériens est à privilégier.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Chef d\u0027équipe","q":"Fermer la porte du local sinistré, réaliser un « tirer-lâcher », poser un stoppeur de fumée : à quelle méthode facilitant les mises en sécurité le guide rattache-t-il ces actions ?","c":["La diffusion de consignes","L\u0027assistance respiratoire","La ventilation","Le dégagement d\u0027urgence"],"r":2,"e":"Le guide cite la ventilation, qui assure une meilleure praticabilité des communications existantes : fermeture de la porte du local sinistré, ventilation opérationnelle, « tirer-lâcher », stoppeur de fumée. Les autres méthodes citées sont la diffusion de consignes (porte-voix) et l\u0027assistance respiratoire.","ref":"§ 2.1 Les personnes valides — p. 43","p":"la ventilation : qui assure une meilleure praticabilité des communications existantes (fermeture de la porte du local sinistré, ventilation opérationnelle, action du « tirer-lâcher », mise en place d\u0027un stoppeur de fumée, ...) ;","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Équipier","q":"Parmi les techniques d\u0027aide à la victime schématisées par le GTO, laquelle se réalise à deux sauveteurs ?","c":["Le « porter à dos »","La « chaise »","Le « porter pompier »","Le « porter dans les bras »"],"r":1,"e":"Sur le schéma des principales techniques d\u0027aide à la victime, la « chaise », ou « porter à 4 mains », est réalisée par deux sapeurs-pompiers. Le « porter à dos », le « porter pompier » et le « porter dans les bras » y sont réalisés par un seul sauveteur.","ref":"§ 2.1 Les personnes valides — p. 43","p":"Les principales techniques d\u0027aide à la victime peuvent être schématisées ainsi : [...] LE « PORTER À 4 MAINS » OU « CHAISE »","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Mises en sécurité","niv":"Chef d\u0027équipe","q":"Votre binôme évacue par la cage d\u0027escalier une personne en fauteuil roulant installée dans un EAS. Quelle précaution le GTO préconise-t-il ?","c":["Verrouiller les roues du fauteuil lors de sa manipulation","Laisser les roues libres pour faire rouler le fauteuil sur les marches","Faire descendre la personne seule, en s\u0027appuyant sur la rampe","Évacuer la personne sans lui expliquer la manœuvre, pour gagner du temps"],"r":0,"e":"Cette mise en sécurité demande un effort physique : il faut rassurer la victime, lui expliquer le déroulement des opérations et verrouiller les roues du fauteuil lors de sa manipulation dans la cage d\u0027escalier. Le binôme adapte sa posture pour limiter les troubles musculo-squelettiques.","ref":"§ 2.2 Les personnes à mobilité réduite — p. 44","p":"Il convient de rassurer la victime et de lui expliquer comment les opérations vont se dérouler. [...] important de verrouiller les roues du fauteuil lors de la manipulation de la victime dans la cage d\u0027escalier.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Équipier","q":"Selon le guide, comment l\u0027échelle à crochets est-elle mise en œuvre ?","c":["Elle s\u0027utilise en binôme mais se manipule seul","Elle s\u0027utilise seul mais se manipule en binôme","Elle s\u0027utilise et se manipule à deux binômes","Elle s\u0027utilise et se manipule seul"],"r":0,"e":"Parmi ses précautions d\u0027emploi, le guide précise que l\u0027échelle à crochets s\u0027utilise en binôme mais se manipule seul ; elle doit en outre être testée avant l\u0027engagement d\u0027un sapeur-pompier.","ref":"§ 2.1.1 L\u0027échelle à crochets — p. 17","p":"l\u0027échelle à crochets s\u0027utilise en binôme mais se manipule seul ;","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Équipier","q":"À quelle distance du mur place-t-on le pied d\u0027une échelle à coulisse deux plans pour qu\u0027elle soit stable ?","c":["Environ 1/10 de la longueur développée","Environ 1/5 de la longueur développée","Environ 1/3 de la longueur développée","Environ 1/2 de la longueur développée"],"r":2,"e":"Pour être stable, l\u0027échelle ne doit être ni trop développée ni trop inclinée : son pied est éloigné du mur d\u0027environ 1/3 de la longueur développée. Ce piétage peut être vérifié par un pas par étage, le test du coude ou la technique des bras tendus.","ref":"§ 2.1.2 Les échelles à coulisse deux plans — p. 18","p":"Pour être stable, l\u0027échelle ne doit être ni trop développée, ni trop inclinée ; aussi le pied de l\u0027échelle doit être éloigné du mur d\u0027environ 1/3 de la longueur développée.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027équipe","q":"Lors de sauvetages multiples par une échelle à coulisse, que préconise le guide concernant le trait ?","c":["L\u0027attacher aux échelons pour bloquer les plans en toute sécurité","Ne pas l\u0027attacher, mais le placer pour qu\u0027il ne gêne pas","Le confier à un équipier qui le maintient tendu à chaque descente","Le retirer de la poulie pour que les victimes ne s\u0027y entravent pas"],"r":1,"e":"Lors de sauvetages multiples, le guide ne recommande pas d\u0027attacher le trait, mais de le placer judicieusement afin qu\u0027il ne gêne pas les ascensions ou les descentes. S\u0027il doit toutefois être attaché, c\u0027est notamment pour éviter que le sauveteur ne s\u0027entrave avec le brin libre ou pour bloquer les plans en cas de mauvais verrouillage des parachutes.","ref":"§ 2.1.4 La technique pour attacher le trait — p. 21","p":"Lors de sauvetages multiples, il n\u0027est pas recommandé d\u0027attacher le trait, mais juste de le placer judicieusement afin qu\u0027il ne gêne pas les ascensions ou les descentes.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Équipier","q":"Comment l\u0027échelle à crochets s\u0027utilise-t-elle pour progresser en façade d\u0027étage en étage ?","c":["Suspendue par ses crochets à un balcon ou à un rebord de fenêtre","Posée sur les pieds de ses montants et appuyée contre la façade","Appuyée sous l\u0027ouvrant, comme une échelle à coulisse","Posée au sol et maintenue au pied par le second sapeur-pompier"],"r":0,"e":"L\u0027échelle à crochets s\u0027utilise généralement suspendue par ses crochets, jamais appuyée ou posée sur les pieds des montants, et ne peut supporter qu\u0027un homme. Elle permet de monter de balcon en balcon ou de rebord de fenêtre en rebord de fenêtre jusqu\u0027à la victime.","ref":"§ 1 L\u0027utilisation de l\u0027échelle à crochets — p. 45","p":"L\u0027échelle à crochets s\u0027utilise généralement suspendue par ses crochets, jamais appuyée ou posée sur les pieds des montants et ne peut supporter qu\u0027un homme.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Équipier","q":"Progression à l\u0027échelle à crochets : l\u0027une des pointes passe dans le vide et l\u0027échelle ne tient plus que sur une pointe. Que fait le sapeur-pompier ?","c":["Il quitte l\u0027échelle pour rejoindre l\u0027ouvrant","Il saute sur le balcon le plus proche","Il se rattrape à un élément de façade","Il termine sa progression sur l\u0027échelle"],"r":3,"e":"Le guide précise que cette situation ne doit pas amener le sapeur-pompier à sauter ou à se rattraper à un élément de façade : il est plus dangereux de quitter l\u0027échelle à crochets que de terminer la progression (ascension ou descente) sur une seule pointe.","ref":"§ 1.1.2 La progression de rebord de fenêtre en rebord de fenêtre — p. 47","p":"Il est plus dangereux de quitter l\u0027échelle à crochets que de terminer la progression (ascension ou descente) sur une seule pointe.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027équipe","q":"Échelle à crochets : une victime valide ne peut pas descendre seule et un sapeur-pompier monte l\u0027aider. Que fait le second sapeur-pompier ?","c":["Il monte derrière son équipier pour l\u0027assurer pendant la descente","Il va chercher le LSPCC pour équiper la victime d\u0027un harnais","Il se place sous l\u0027échelle pour réceptionner la victime en cas de chute","Il maintient fermement l\u0027échelle pour améliorer sa stabilité"],"r":3,"e":"Lorsque la victime, bien que valide, ne peut pas descendre d\u0027elle-même, un sapeur-pompier monte à son niveau, la rassure et l\u0027aide à s\u0027engager en lui conseillant de bien « se coller » à l\u0027échelle. Le second sapeur-pompier maintient fermement l\u0027échelle pour améliorer sa stabilité.","ref":"§ 1.2.2 La victime est valide mais ne peut pas descendre seule — p. 49","p":"le second sapeur-pompier maintient fermement l\u0027échelle pour améliorer la stabilité de l\u0027échelle.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027équipe","q":"Après une progression à l\u0027échelle à crochets, le binôme atteint une victime inconsciente. Selon le guide, comment est-elle descendue ?","c":["Sur le dos d\u0027un sapeur-pompier, par l\u0027échelle à crochets","En glissant dos contre les échelons de l\u0027échelle à crochets","Par un dispositif de descente mis en place avec le LSPCC","Attachée à l\u0027échelle à crochets, descendue avec celle-ci"],"r":2,"e":"Lorsque la victime est invalide ou inconsciente, les sapeurs-pompiers accèdent au niveau où elle se trouve et procèdent à la mise en place et en œuvre d\u0027un dispositif de descente au moyen du LSPCC.","ref":"§ 1.2.3 La victime est invalide ou inconsciente — p. 49","p":"Les sapeurs-pompiers accèdent au niveau où se trouve la victime et procèdent à la mise en place et en œuvre d\u0027un dispositif de descente au moyen du LSPCC.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027agrès","q":"Une échelle à crochets a été placée sur le faîtage d\u0027une toiture pour créer un cheminement d\u0027accès. Que prévoit le guide pour la suite de l\u0027intervention ?","c":["La retirer dès le sauvetage terminé","La maintenir comme accès secondaire ou itinéraire de repli","La déplacer au fil de la progression des sapeurs-pompiers","La remplacer dès que possible par une échelle à coulisse"],"r":1,"e":"Lorsqu\u0027un cheminement d\u0027accès a ainsi été créé, il est maintenu (sauf nécessité) tout au long de l\u0027intervention pour servir d\u0027accès secondaire ou d\u0027itinéraire de repli aux personnels. Dans la mesure du possible, l\u0027échelle à crochets est amarrée au niveau de la toiture ou du plan incliné.","ref":"§ 1.3.2 Les autres types de prolongement — p. 50","p":"Lorsqu\u0027un cheminement d\u0027accès a été ainsi créé, il est maintenu (sauf nécessité) tout au long de l\u0027intervention afin de servir d\u0027accès secondaire ou d\u0027itinéraire de repli pour les personnels.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027équipe","q":"Sauvetage d\u0027une victime valide à l\u0027échelle à coulisse deux plans : quelle position de l\u0027échelle le guide indique-t-il comme à privilégier ?","c":["En appui à côté de l\u0027ouvrant","En dépassant le rebord de la fenêtre","En appui au-dessus de l\u0027ouvrant","En appui sous l\u0027ouvrant, sans le dépasser"],"r":1,"e":"Le guide privilégie l\u0027échelle dépassant le rebord de la fenêtre ou du toit : la victime peut s\u0027aider des montants au moment du passage dans le vide. L\u0027appui à côté de l\u0027ouvrant est une technique justifiée par des conditions particulières d\u0027intervention ou par une configuration spécifique.","ref":"§ 2.1 Le sauvetage d\u0027une victime valide — p. 50","p":"Dépasser le rebord de la fenêtre ou du toit. permet un confort au moment du passage dans le vide de la victime qui peut s\u0027aider des montants. Cette technique est à privilégier.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Équipier","q":"Technique à trois sapeurs-pompiers pour une victime inconsciente à l\u0027échelle à coulisse : comment la victime est-elle placée sur l\u0027échelle ?","c":["Face aux échelons, portée sur le dos du sauveteur","Assise sur les échelons, retenue par les bras du sauveteur","À plat ventre sur les échelons, tête vers le bas","Dos aux échelons, genoux sur les épaules du sauveteur"],"r":3,"e":"Dans une action coordonnée des trois sapeurs-pompiers, la victime est levée, jambes passées au-dessus du rebord, genoux posés sur les épaules du sapeur-pompier situé sur l\u0027échelle ; elle est placée dos contre les échelons puis descendue par celui-ci. Un quatrième peut aider à la réception.","ref":"§ 2.2.1 La technique à trois sapeurs-pompiers — p. 52","p":"ses genoux posés sur les épaules du personnel situé sur l\u0027échelle. La victime est placée dos contre les échelons par les 3 personnels puis descendue par le sapeur-pompier situé sur l\u0027échelle.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Échelles à mains","niv":"Chef d\u0027équipe","q":"Accès à une victime en excavation par une échelle à coulisse : quelle mesure le guide rend-il obligatoire lors de la mise en place de l\u0027échelle ?","c":["Bloquer les plans avec une sangle ou le trait","Déployer l\u0027échelle au maximum avant de la descendre","Poser le pied de l\u0027échelle au contact de la victime","Engager l\u0027échelle le petit plan et la tête en avant"],"r":0,"e":"Le blocage des plans au moyen d\u0027une sangle ou du trait est obligatoire pour éviter le désengagement des parachutes et le déploiement intempestif de l\u0027échelle. Celle-ci est engagée pieds et grand plan en avant et descendue, dans la mesure du possible, à l\u0027écart de la victime.","ref":"§ 2.3 L\u0027accès en sécurité à une victime en excavation — p. 54","p":"Le blocage des plans au moyen d\u0027une sangle ou du trait est obligatoire afin d\u0027éviter le désengagement des parachutes et le déploiement intempestif de l\u0027échelle lors de sa mise en place.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Quels éléments composent principalement le lot de sauvetage et de protection contre les chutes (LSPCC) ?","c":["ARI, ligne guide, liaison personnelle, balise de détresse et lampe","Échelle à crochets, commande, sangle à tuyau, hache, grande pince et gants","Treuil électrique, civière barquette, sangles d\u0027arrimage et casque","Corde semi-statique, descendeur, anneaux de sangle, connecteurs, harnais"],"r":3,"e":"Le LSPCC se compose principalement d\u0027une corde semi-statique, d\u0027un dispositif de freinage de type descendeur, d\u0027anneaux de sangle cousus, de connecteurs (mousquetons), d\u0027une poulie, d\u0027un harnais et d\u0027un triangle d\u0027évacuation, transportés dans un sac. Selon les SIS, d\u0027autres matériels peuvent compléter le lot.","ref":"§ 2.2 Le lot de sauvetage et de protection contre les chutes — p. 23","p":"Le lot de sauvetage est composés principalement [...] d\u0027une corde semi-statique [...] d\u0027un dispositif manuel (de type descendeur par ex.) [...] d\u0027anneaux de sangle cousus [...] de connecteurs (nommés également mousquetons) [...] d\u0027un harnais","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Outre la régulation de la descente d\u0027une personne, que permet le dispositif de freinage (type descendeur) du LSPCC ?","c":["Démultiplier la force motrice lors de la remontée d\u0027une charge","Assurer une personne progressant avec un risque de chute","Assurer la liaison entre les différents matériels du lot","Réaliser les amarrages sur les points d\u0027ancrage choisis"],"r":1,"e":"Le dispositif manuel de type descendeur freine la charge et régule la descente d\u0027une personne ; il permet aussi d\u0027assurer une personne lors des progressions avec risque de chute. La démultiplication de l\u0027effort revient à la poulie, la liaison aux connecteurs et les amarrages aux anneaux de sangle cousus.","ref":"§ 2.2 Le lot de sauvetage et de protection contre les chutes — p. 23","p":"d\u0027un dispositif manuel (de type descendeur par ex.) permettant de freiner la charge et destiné à réguler la descente d\u0027une personne. Il permet d\u0027assurer une personne lors des progressions avec risque de chute","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Un équipier a un doute sur l\u0027intégrité d\u0027un élément du LSPCC. Que prévoit le guide ?","c":["L\u0027utiliser une dernière fois puis le signaler au retour","Le mettre de côté immédiatement et en rendre compte","Le doubler par un second élément identique et poursuivre","Le tester sous charge avec un mannequin avant de l\u0027employer"],"r":1,"e":"En cas de doute sur l\u0027intégrité du matériel, le guide impose de le mettre de côté immédiatement et d\u0027adresser un compte rendu à la personne compétente identifiée au sein de la structure. La multiplication est prévue pour un ancrage douteux, pas pour un matériel dont l\u0027intégrité est en doute.","ref":"§ 2.2 Le lot de sauvetage et de protection contre les chutes — p. 24","p":"En cas de doute sur l\u0027intégrité du matériel celui-ci doit être mis de côté immédiatement et un compte rendu doit être adressé vers la personne compétente identifiée au sein de la structure.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Les facteurs de chute supérieurs à 1 étant interdits, que faut-il rechercher dans la mesure du possible pour réduire ce risque ?","c":["Un point d\u0027amarrage situé au ras du sol","Une longueur de corde la plus courte possible","Un point d\u0027amarrage éloigné de la zone d\u0027évolution","Un point d\u0027amarrage situé en partie haute"],"r":3,"e":"Le facteur de chute est le rapport entre la hauteur de chute et la longueur de corde qui amortit la chute. Les facteurs 1 sont à éviter, ceux supérieurs à 1 interdits : le guide demande de rechercher, dans la mesure du possible, un point d\u0027amarrage en partie haute.","ref":"§ 2.2.1 Le facteur de chute — p. 25","p":"Les facteurs 1 sont à éviter. Les facteurs supérieurs à 1 sont interdits. Afin de réduire ce risque, il faut dans la mesure du possible rechercher un point d\u0027amarrage en partie haute","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Selon le guide, le syndrome de suspension (ou syndrome du harnais) est consécutif à :","c":["une suspension inerte et prolongée dans un harnais","une chute avec un facteur de chute supérieur à 1","un serrage excessif des sangles inférieures du harnais","un effet pendulaire avec collision contre la façade"],"r":0,"e":"Le syndrome de suspension engage le pronostic vital à très court terme. Une suspension qui dure peut diminuer significativement, voire arrêter, le retour veineux : le flux sanguin arrivant au cœur devient insuffisant, avec perte de connaissance en quelques minutes puis, sans prise en charge, arrêt cardio-respiratoire.","ref":"§ 2.2.3 Le syndrome de suspension ou syndrome du harnais — p. 25","p":"Le syndrome de suspension est une situation clinique engageant le pronostic vital à très court terme, associant perte de connaissance et défaillance multi viscérale, consécutive à une suspension inerte et prolongée dans un harnais.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Selon le guide, quelle affirmation concernant les frottements sur une corde est exacte ?","c":["Une corde en mouvement subit davantage les effets des frottements","Les frottements corde sur corde sont sans conséquence","Le brin de corde statique (brin dormant) doit être protégé","La gaine de la corde dispense de toute protection contre les frottements"],"r":2,"e":"Le guide demande de protéger des frottements le brin de corde statique (brin dormant) : une corde en mouvement en subit moins les effets, le frottement se répartissant sur l\u0027ensemble de la corde. Les frottements corde sur corde sont à surveiller et, dans la mesure du possible, des protections des cordes doivent être mises en place.","ref":"§ 2.2.1 Les frottements — p. 26","p":"LE BRIN DE CORDE STATIQUE (BRIN DORMANT) DOIT ÊTRE PROTÉGÉ PAR RAPPORT AUX FROTTEMENTS. UNE CORDE EN MOUVEMENT SUBIT MOINS D\u0027EFFETS DE FROTTEMENT.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027agrès","q":"Selon le guide, à qui appartient-il de valider l\u0027emploi du LSPCC sur une intervention ?","c":["Au chef d\u0027équipe engagé auprès de la victime","À l\u0027équipier qui met en œuvre le frein de charge","Au COS, au regard de son analyse des risques","Au médecin sapeur-pompier présent sur les lieux"],"r":2,"e":"Le LSPCC est une alternative lorsque l\u0027emploi de moyens plus sûrs (communications existantes, échelles aériennes ou à mains) est impossible et/ou que la situation nécessite une action immédiate. Il appartient au COS, au regard de son analyse des risques, de valider son emploi et/ou de faire appel à des équipes spécialisées.","ref":"§ Chapitre 4 L\u0027emploi du LSPCC (introduction) — p. 57","p":"Il appartient au COS au regard de son analyse des risques de valider l\u0027emploi du LSPCC et/ou de faire appel au renfort d\u0027équipes spécialisées","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Dans un système mis en œuvre avec le LSPCC, qu\u0027appelle-t-on l\u0027ancrage, ou point fixe ?","c":["Le point où la victime attend pendant l\u0027installation de la corde","Le support sur lequel sont amarrés le ou les dispositifs","Le nœud qui termine chaque extrémité de la corde semi-statique","Le connecteur qui relie le harnais de la victime à la corde"],"r":1,"e":"L\u0027ancrage, ou point fixe, est un support sur lequel sont amarrés le ou les dispositifs : naturel (arbre, rocher), structurel (poutre, pilier, rambarde, engin) ou artificiel (échelle à mains, outil de forcement, étais). Quelle que soit sa nature, en cas de doute, il doit être multiplié.","ref":"§ 1.1.1 L\u0027ancrage — p. 58","p":"L\u0027ancrage, ou point fixe est un support sur lequel est (sont) amarré(s) le(s) dispositif(s).","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Un fourgon doit servir de point d\u0027ancrage pour le LSPCC. Quelles conditions le guide exige-t-il ?","c":["Moteur arrêté et clé enlevée, vitesse engagée, frein de parc serré","Moteur au ralenti, frein de parc serré, feux de détresse allumés","Moteur arrêté, boîte au point mort, cales sous les roues avant","Moteur arrêté, frein de parc serré, clé laissée sur le contact"],"r":0,"e":"Le guide considère un véhicule comme point d\u0027ancrage si le moteur est arrêté et la clé de contact enlevée, une vitesse engagée et le frein de parc serré. Quelle que soit la nature de l\u0027ancrage, en cas de doute, celui-ci doit être multiplié.","ref":"§ 1.1.1 L\u0027ancrage — p. 59","p":"un véhicule est considéré comme point d\u0027ancrage si : le moteur est arrêté. La clé de contact enlevée ; et une vitesse est engagée ; et le frein de parc est serré.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Selon le guide, de quoi un amarrage est-il constitué a minima ?","c":["D\u0027un nœud de huit double et d\u0027une corde","De deux anneaux cousus reliés par un nœud","D\u0027un connecteur et d\u0027un anneau cousu","D\u0027un frein de charge et d\u0027un connecteur"],"r":2,"e":"L\u0027amarrage assure la connexion entre le ou les ancrages et un dispositif au moyen d\u0027agrès textiles et/ou métalliques ; il est constitué a minima d\u0027un connecteur et d\u0027un anneau cousu. Deux anneaux cousus sont toujours reliés entre eux par un mousqueton.","ref":"§ 1.1.2 L\u0027amarrage — p. 59","p":"Un amarrage sera constitué a minima d\u0027un connecteur et d\u0027un anneau cousu.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Le guide proscrit le travail d\u0027un mousqueton « en porte-à-faux ». Que désigne cette expression ?","c":["Sa bague de verrouillage est dévissée pendant la manœuvre","Il relie directement deux anneaux de sangle cousus entre eux","Il est en appui contre une arête vive du bâtiment","La traction s\u0027exerce de biais par rapport à son grand axe"],"r":3,"e":"Le mousqueton ne doit pas travailler en porte-à-faux, c\u0027est-à-dire que la traction ne doit pas s\u0027effectuer de biais par rapport à son grand axe. Relier deux anneaux cousus par un mousqueton est au contraire la règle.","ref":"§ 1.1.2 L\u0027amarrage — p. 59","p":"Le mousqueton ne doit pas travailler en porte-à-faux, c\u0027est-à-dire que la traction ne doit pas s\u0027effectuer de biais par rapport au grand axe du mousqueton.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Lors de la mise en œuvre du LSPCC, quelle règle le GTO impose-t-il ?","c":["Tester sur quelques centimètres le fonctionnement du frein de charge","Relier directement deux anneaux cousus entre eux, sans mousqueton","Laisser les mousquetons dévissés pour pouvoir les ouvrir rapidement","Poursuivre la descente sans vérifier la charge en tension"],"r":0,"e":"Le GTO impose notamment de tester sur quelques centimètres le bon fonctionnement du frein de charge, de visser les mousquetons, de toujours relier deux anneaux cousus par un mousqueton et, une fois la charge en tension, d\u0027effectuer une vérification avant de poursuivre la descente.","ref":"§ 2 Les techniques de mise en œuvre — p. 60","p":"veiller impérativement à ce que les mousquetons soient vissés [...] toujours utiliser un mousqueton pour relier deux anneaux cousus entre eux ; [...] tester sur quelques centimètres le bon fonctionnement du frein de charge.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027agrès","q":"Sauvetage par l\u0027extérieur au LSPCC, l\u0027urgence ne permettant aucun amarrage : l\u0027équipier sert de point fixe. Quel rôle le guide attribue-t-il alors au chef d\u0027agrès ?","c":["Il assure l\u0027équipier en point fixe avec une seconde corde","Il participe à la mise au vide de la victime","Il contrôle la descente à la place de l\u0027équipier","Il guide la descente depuis le sol avec une commande"],"r":1,"e":"Lorsque l\u0027urgence rend impossible tout amarrage, l\u0027équipier, muni du harnais équipé du descendeur, allongé, jambes à 90° contre le mur, sert de point fixe et contrôle la descente. Cette manœuvre est garante de rapidité ; dans ce cas, le chef d\u0027agrès doit participer à la mise au vide de la victime.","ref":"§ 2.2 Le sauvetage d\u0027une personne par l\u0027extérieur — p. 62","p":"Dans la mesure où l\u0027urgence de la situation rend impossible l\u0027installation de tout amarrage, l\u0027équipier sert de point fixe. […] Dans ce cas, le chef d\u0027agrès doit participer à la mise au vide de la victime.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Sauvetage par l\u0027extérieur au LSPCC : quelle hauteur minimale le guide impose-t-il entre le frein de charge et le point d\u0027appui sur le passage dans le vide ?","c":["10 cm","15 cm","20 cm","30 cm"],"r":2,"e":"Le guide impose que la hauteur entre le frein de charge et le point d\u0027appui sur le passage dans le vide soit obligatoirement supérieure ou égale à 20 centimètres. La mise au vide est une phase critique lors du sauvetage.","ref":"§ 2.2 Le sauvetage d\u0027une personne par l\u0027extérieur — p. 62","p":"La hauteur entre le frein de charge et le point d\u0027appui sur le passage dans le vide doit obligatoirement être supérieur ou égale à 20 centimètres.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027équipe","q":"Une victime inanimée gît au fond d\u0027une fosse et l\u0027on redoute une atmosphère viciée. Quelle protection respiratoire le sauveteur qui y descend doit-il porter ?","c":["Un appareil filtrant à cartouche","Un demi-masque antipoussière","Aucune, après ventilation de la fosse","Un appareil respiratoire isolant"],"r":3,"e":"Lors d\u0027un sauvetage dans un puits, une fosse ou une excavation, le port de l\u0027ARI est obligatoire lorsqu\u0027on redoute une atmosphère viciée. Le cheminement d\u0027accès vers la victime peut exposer le sauveteur à un risque, en général le même que celui auquel elle est soumise.","ref":"§ 2.3 Le sauvetage dans les puits, fosses ou en excavation — p. 64","p":"Le port de l\u0027ARI est obligatoire lorsqu\u0027on redoute une atmosphère viciée dans l\u0027excavation.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Chef d\u0027agrès","q":"Avant un sauvetage dans une excavation où l\u0027on redoute une atmosphère viciée, comment le contrôle préalable de l\u0027atmosphère est-il effectué ?","c":["Au moyen de la caméra thermique","Par la seule observation des lieux","Avec la sonde thermique de la balise","Au moyen d\u0027un détecteur de gaz"],"r":3,"e":"Lorsqu\u0027on redoute une atmosphère viciée dans un puits, une fosse ou une excavation, le GTO prévoit que le contrôle préalable de l\u0027atmosphère soit effectué au moyen du détecteur de gaz, en plus du port obligatoire de l\u0027ARI.","ref":"§ 2.3 Le sauvetage dans les puits, fosses ou en excavation — p. 64","p":"Le contrôle préalable est effectué au moyen du détecteur de gaz.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Lot de sauvetage (LSPCC)","niv":"Équipier","q":"Accès à un appartement depuis l\u0027étage supérieur avec le LSPCC : la reconnaissance succincte de la première pièce ne révèle aucun risque. Que fait le sauveteur ?","c":["Il prévient l\u0027équipier d\u0027assurance puis se désolidarise du système","Il reste amarré à la corde pendant toute la reconnaissance du logement","Il se désolidarise sans prévenir pour gagner du temps","Il remonte à l\u0027étage supérieur avant de poursuivre"],"r":0,"e":"Le sauveteur peut rester amarré durant la reconnaissance succincte de la première pièce. En l\u0027absence de risque, après avoir informé l\u0027équipier chargé de l\u0027assurance, il se désolidarise du système, fixe le mousqueton de la corde sur un point d\u0027attache et poursuit sa reconnaissance.","ref":"§ 2.4 L\u0027emploi du LSPCC lors des ouvertures de portes — p. 65","p":"En l\u0027absence de risque, après avoir informé l\u0027équipier chargé de l\u0027assurance, il se désolidarise du système, fixe le mousqueton de la corde sur un point d\u0027attache et poursuit sa reconnaissance.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Équipier","q":"À quel moment le matelas de sauvetage doit-il être positionné à l\u0027aplomb de la victime ?","c":["Dès sa sortie de la housse","Pendant la phase de gonflage","Une fois complètement gonflé","Avant de lancer le gonflage"],"r":2,"e":"Le guide demande de positionner le matelas à l\u0027aplomb de la victime seulement une fois celui-ci complètement gonflé. C\u0027est la surpression engendrée lors de l\u0027impact de la victime sur le plateau supérieur, associée au sous-dimensionnement des évents, qui amortit la chute.","ref":"§ 2.3.1 Le matelas de sauvetage — p. 28","p":"Positionner le matelas de sauvetage à l\u0027aplomb de la victime, seulement une fois celui-ci complètement « gonflé »","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Chef d\u0027agrès","q":"Vous mettez en station un moyen élévateur aérien. Que préconise le GTO pour l\u0027espace dans lequel évoluera la tourelle ?","c":["Le laisser sans balisage, pour ne gêner aucun engin","Le signaler par les seuls gyrophares de l\u0027engin","Le matérialiser au moyen de cônes de Lubeck ou de rubalise","Le réduire au minimum pour laisser la chaussée libre"],"r":2,"e":"Il est important de matérialiser l\u0027espace dans lequel évoluera la tourelle au moyen de cônes de Lubeck ou de rubalise. Lors du positionnement, il faut aussi s\u0027assurer que l\u0027espace autour de l\u0027échelle est suffisant pour permettre la stabilisation et le pivotement de la structure extensible.","ref":"§ 2.4.2 L\u0027environnement échelle — p. 32","p":"Il est important de matérialiser l\u0027espace dans lequel évoluera la tourelle, au moyen de cônes de Lubeck ou rubalise.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027une échelle aérienne. Sur laquelle de ces surfaces est-il formellement interdit de la stabiliser ?","c":["Une bordure de trottoir","Un trottoir","Un chemin de terre ou en calcaire","Une voie échelle"],"r":0,"e":"Le guide classe la bordure de trottoir parmi les sols interdits, avec la plaque d\u0027égout, la cave sous trottoir ou le parking sur dalle inférieur à 15 tonnes. Le trottoir et le chemin de terre ou en calcaire sont des sols instables, utilisables avec des cales de stabilisation ; la voie échelle est un sol stable.","ref":"§ 2.4.3 La surface portante — p. 33","p":"sol interdit : sols sur lesquels il est formellement interdit de stabiliser l\u0027échelle […] (plaque d\u0027égout, bordure de trottoir, cave sous trottoir, parking sur dalle inférieur à 15 tonnes).","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Chef d\u0027agrès","q":"Des fils aériens sont proches de la zone d\u0027évolution d\u0027un MEA, mais leur type (électricité, téléphone…) est difficile à distinguer. Que préconise le guide ?","c":["Approcher le panier de secours pour identifier les fils","Se fier à la couleur et au diamètre des fils","Considérer que des fils fins sont téléphoniques","Repérer le type de poteau qui supporte les fils"],"r":3,"e":"Fumées, brouillard ou obscurité peuvent masquer les fils aériens, dont le type est parfois difficile à distinguer : l\u0027utilisateur repère alors le type de poteau qui les supporte pour déterminer le réseau transporté. Le choc électrique pouvant survenir sans contact (arc), on privilégie si possible un positionnement très largement dégagé des lignes haute tension.","ref":"§ 2.4.4 Les dangers aériens — p. 34","p":"L\u0027utilisateur prendra soin alors de repérer le type de poteau supportant les fils afin de déterminer le réseau transporté.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Équipier","q":"Dans le panier de secours d\u0027un MEA, une mission prévoit la possibilité de sortir du panier (panier avec ouverture de porte). Quel EPI le guide préconise-t-il ?","c":["Un ceinturon de sécurité avec longe de maintien au travail","Un harnais contre les chutes et un absorbeur d\u0027énergie","Aucun EPI spécifique, le garde-corps du panier suffisant","Le seul casque avec jugulaire, l\u0027amarrage étant facultatif"],"r":1,"e":"Les sapeurs-pompiers se trouvant dans le panier de secours doivent obligatoirement être amarrés. Pour les missions avec possibilité de sortie du panier, le guide préconise un harnais de protection contre les chutes et un dispositif absorbeur d\u0027énergie ; le CSLMT est préconisé sans panier ou avec un panier sans ouverture de porte.","ref":"§ 2.5 Les dispositifs de sécurité obligatoires — p. 36","p":"Avec panier de secours avec ouverture de porte. Missions réalisées avec possibilité de sortie du panier ou nacelle. Harnais de protection contre les chutes et dispositif absorbeur d\u0027énergie.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Chef d\u0027équipe","q":"MEA doté d\u0027un panier de secours, victime valide à un ouvrant : comment le guide préconise-t-il idéalement de positionner le panier ?","c":["Au-dessus de l\u0027ouvrant, pour hisser la victime","À distance de la façade, pour éviter tout contact brutal","Le long de la façade, à côté de l\u0027ouvrant","En appui face à l\u0027ouvrant, pour créer une continuité"],"r":3,"e":"Idéalement, le panier est positionné en appui face à l\u0027ouvrant pour créer une continuité pour la victime : vide à franchir minimisé, sentiment de sécurité. Des conditions comme un flux thermique important ou une fumée épaisse peuvent toutefois imposer une arrivée du panier par en dessous de l\u0027ouvrant.","ref":"§ 1.1 La victime est valide (MEA avec panier) — p. 67","p":"il convient de positionner le panier de secours en appui face à l\u0027ouvrant de façon à créer une continuité pour la victime : minimisation du vide à franchir, sentiment de sécurité.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Équipier","q":"Une victime est suspendue par les bras à un rebord. Si le MEA le permet, comment le panier de secours l\u0027approche-t-il judicieusement ?","c":["En descendant vers elle depuis le haut de la façade","En « léchant » la façade de bas en haut","Par le côté, en restant à distance de la façade","En ligne droite vers ses mains, le plus vite possible"],"r":1,"e":"La victime pouvant lâcher prise à tout moment, l\u0027approche peut judicieusement se faire en « léchant » la façade de bas en haut, ce qui peut limiter les effets d\u0027une chute. L\u0027opérateur garde la victime en visuel tout au long de l\u0027approche pour anticiper une éventuelle réception.","ref":"§ 1.2 La victime est suspendue dans le vide — p. 69","p":"l\u0027approche du panier de secours peut judicieusement se faire en « léchant » la façade de bas en haut, si les capacités techniques du MEA le permettent ;","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Équipier","q":"Échelle aérienne sans panier de secours : une victime valide appréhende de descendre par le parc. Selon le guide, que fait le sauveteur ?","c":["Il l\u0027encadre en anticipant une chute vers l\u0027arrière","Il assure un maintien au niveau de ses lombaires","Il se borne à l\u0027aider à placer ses pieds sur les échelons","Il la laisse descendre seule en la guidant à la voix"],"r":0,"e":"Le guide distingue trois techniques : si la victime appréhende la descente, le sauveteur l\u0027encadre en anticipant une chute vers l\u0027arrière ; si elle descend « avec facilité », il assure un maintien au niveau des lombaires ; si elle rencontre des difficultés, il peut l\u0027aider à placer ses pieds sur les échelons.","ref":"§ 2.1 La victime est valide (MEA sans panier) — p. 70","p":"La victime a une appréhension à descendre. Le sauveteur l\u0027encadre en anticipant une chute vers l\u0027arrière.","s":"gto-sauv"},
{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Chef d\u0027agrès","q":"Lors des utilisations particulières d\u0027un MEA décrites par le guide, quelle action est interdite ?","c":["Descendre un sapeur-pompier depuis le panier de secours","Prolonger le MEA au moyen d\u0027une échelle à crochets","Déverrouiller les dispositifs de sécurité de l\u0027engin","Utiliser le MEA comme point d\u0027ancrage en surplomb"],"r":2,"e":"Il est interdit de déverrouiller les dispositifs de sécurité, car cela pourrait provoquer une bascule du véhicule ; il faut aussi se conformer strictement aux préconisations du constructeur. Descendre un ou deux sapeurs-pompiers depuis le panier, prolonger le MEA par une échelle à crochets ou en faire un point d\u0027ancrage sont des techniques prévues.","ref":"§ 3 Les utilisations particulières des MEA — p. 72","p":"Il est interdit de déverrouiller les dispositifs de sécurité, car ceci pourrait provoquer une bascule du véhicule.","s":"gto-sauv"},
