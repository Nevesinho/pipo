{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et COS. Quels indices observés dans des pièces exposées aux fumées peuvent vous conduire à renforcer la protection des personnels ?","c":["Suies abondantes sur les parois, odeurs fortes, poussières en suspension","Fumée claire et peu dense, sans aucune flamme visible dans le local","Température redevenue normale et local largement ventilé par les ouvrants","Vitres brisées, courant d\u0027air marqué et sol détrempé par l\u0027eau d\u0027extinction"],"r":0,"e":"Le COS peut être amené à renforcer la protection des personnels intervenant dans des pièces ou bâtiments fortement exposés aux fumées : suies en forte quantité sur les parois, odeurs fortes, poussières en suspension visibles. Il fait respecter le port des protections adaptées de la reconnaissance jusqu\u0027au déblai.","ref":"§ 1.2 Sur les lieux de l\u0027intervention (chap. 3) — p. 37","p":"le COS peut être amené à renforcer la protection des personnels intervenants dans des pièces ou bâtiments fortement exposées par les fumées : suies en forte quantité sur les parois, odeurs fortes, poussières en suspension visibles.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Pendant une pause sur les lieux, un équipier en tenue souillée propose une collation à son binôme. Quelle est la bonne conduite selon le guide ?","c":["Accepter, le risque ayant cessé avec l\u0027extinction","Manger avec ses gants de feu, qui protègent les aliments","Retirer ses EPI, se nettoyer visage, cou et mains, puis manger","Boire seulement, les liquides ne posant aucun risque"],"r":2,"e":"Lors des phases de repos, après retrait des EPI, le guide préconise de se nettoyer le visage, le cou et les mains (lingettes ou eau froide et savon) avant de s\u0027hydrater et de se restaurer. Boire expose aussi : l\u0027ingestion de particules peut survenir en s\u0027hydratant.","ref":"§ 1.2.1 Zone de soutien sanitaire et de réhabilitation (chap. 3) — p. 37","p":"Lors des phases de repos, après retrait des EPI, il est préconisé l\u0027usage de lingettes nettoyantes ou d\u0027eau froide et de savon pour se nettoyer le visage, le cou, les mains avant de s\u0027hydrater et de se restaurer.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Équipier","q":"Lors d\u0027une phase de repos sur intervention, après retrait des EPI et nettoyage de la peau, quel autre geste le guide préconise-t-il ?","c":["Se moucher pour évacuer les mucosités","Se rincer la tête à l\u0027eau chaude","Garder la cagoule pour protéger le cou","Remettre sa veste pour ne pas prendre froid"],"r":0,"e":"Lors des phases de repos, le visage, le cou et les mains sont nettoyés (lingettes, ou eau froide et savon) avant de s\u0027hydrater et de se restaurer. Les yeux et la bouche peuvent être lavés, et se moucher pour débarrasser le nez des mucosités est préconisé.","ref":"§ 1.2.1 Zone de soutien sanitaire et de réhabilitation (chap. 3) — p. 37","p":"Les yeux et la bouche peuvent être lavées. L\u0027action de se moucher le nez pour le débarrasser des mucosités est préconisé.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Quelles étapes d\u0027une intervention le guide identifie-t-il comme phases possibles de désorption et de transfert de toxiques ?","c":["Le départ du CIS, le trajet aller et l\u0027arrivée sur les lieux","La prise d\u0027appel, l\u0027alerte et l\u0027habillage avant le départ","La reconnaissance et le sauvetage, seules phases sous fumées","Le déblai, le transit vers le CIS et le reconditionnement"],"r":3,"e":"Le guide cite les temps de repos et de soutien sanitaire, le déblai, le nettoyage sur site, le transit vers le CIS et le reconditionnement au CIS comme étapes permettant désorption et transferts de toxiques.","ref":"§ 1.2.2 Phases de pollution et de désorption (chap. 3) — p. 38","p":"plusieurs étapes peuvent permettre des phases de désorption et de transferts possibles de toxiques : les temps de repos et de soutien sanitaire ; le déblai ; le nettoyage sur site ; le transit vers le CIS ; le reconditionnement au CIS.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu de structure. Où le guide préconise-t-il d\u0027installer la zone de réhabilitation pour le nettoyage des tenues et matériels ?","c":["Au plus près du volume sinistré, pour limiter les déplacements","En dehors du panache de fumées, en zone orange","Sous le vent du panache, près du sinistre","À l\u0027intérieur de la zone d\u0027exclusion, à l\u0027abri des intempéries"],"r":1,"e":"Le nettoyage des tenues et des matériels sur les lieux s\u0027appuie sur une zone de réhabilitation installée en dehors du panache de fumées : en zone orange sur feu de structure, hors de la zone brûlée sur feu d\u0027espace naturel.","ref":"§ 2 Nettoyage des tenues et matériels sur les lieux (chap. 3) — p. 39","p":"Elles s\u0027appuient sur la mise en place d\u0027une zone de réhabilitation, installée en dehors du panache de fumées, en zone orange sur feu de structure, ou hors de la zone brulée sur feu d\u0027espace naturel.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Quel membre de l\u0027équipage le guide désigne-t-il comme pouvant assurer la fonction de logisticien pour le nettoyage sur place ?","c":["Le chef de l\u0027équipe d\u0027attaque","Le conducteur de l\u0027engin-pompe","L\u0027équipier de l\u0027équipe d\u0027alimentation","Le chef de l\u0027équipe d\u0027alimentation"],"r":1,"e":"Le conducteur de l\u0027engin-pompe peut assurer la fonction de logisticien : il prépare un parc matériels propres, un parc matériels souillés et une zone de nettoyage des intervenants et des matériels, et fournit à ses équipiers les matériels demandés pour éviter le transfert de polluants dans le véhicule.","ref":"§ 2 Nettoyage des tenues et matériels sur les lieux (chap. 3) — p. 39","p":"Le conducteur de l\u0027engin-pompe, peut assurer la fonction de logisticien et prépare : un parc matériels propres, un parc matériels souillés, une zone de nettoyage des intervenants et des matériels","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Après une reconnaissance en milieu enfumé, la tenue d\u0027un équipier ne présente aucune trace visible. Que rappelle le guide ?","c":["La souillure n\u0027est pas le seul critère de pollution d\u0027un EPI","L\u0027absence de trace visible prouve que la tenue n\u0027est pas polluée","Seule une tenue mouillée par l\u0027eau d\u0027extinction est polluée","Seul un EPI porté pendant l\u0027attaque peut être pollué"],"r":0,"e":"Le guide précise que la souillure ne constitue pas le seul critère de pollution d\u0027un EPI : une tenue sans trace visible n\u0027est donc pas forcément exempte de pollution. Le guide demande aussi de prêter attention à une odeur éventuelle sur la tenue de service portée sous la tenue de feu, qui en imposera le nettoyage.","ref":"§ 2.1 Nettoyage des tenues de feu sur les lieux (chap. 3) — p. 39","p":"La souillure ne constitue pas le SEUL critère de pollution d\u0027un EPI.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Vous aidez au déshabillage d\u0027équipiers aux tenues souillées, en amont de la zone de soutien. De quelles protections devez-vous disposer ?","c":["Aucune protection, la tenue étant retirée hors des fumées","Gants de protection incendie seuls, sans protection respiratoire","Protection respiratoire, oculaire, cutanée et gants à usage unique","Tenue de service propre et lunettes, sans protection des mains"],"r":2,"e":"Le déshabillage est réalisé en amont de la zone de soutien par des sapeurs-pompiers disposant d\u0027une protection respiratoire (FFP2, FFP3, cagoule filtrante, masque à cartouche ou ARI), oculaire et cutanée adaptée au niveau de souillure, ainsi que de gants à usage unique.","ref":"§ 2.1 Nettoyage des tenues de feu sur les lieux (chap. 3) — p. 40","p":"par des sapeurs-pompiers disposant d\u0027une protection respiratoire (FFP2, FFP3, cagoule de protection filtrante, masque à cartouche filtrante ou ARI), oculaire et cutanée adaptée au niveau de souillure et des gants à usage unique.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Avant de réintégrer le véhicule après l\u0027intervention, quel lavage le guide rend-il systématique pour les personnels ?","c":["Le rinçage complet de la tenue de feu au jet de la lance","Le lavage des mains et des effets chaussants","Le lavage des cheveux à l\u0027eau de la tonne de l\u0027engin","Le rinçage du masque de l\u0027ARI"],"r":1,"e":"Le guide impose un lavage systématique des mains et des effets chaussants avant de réintégrer le véhicule. Les bonnes pratiques de nettoyage sur les lieux visent à limiter le transfert de particules et de résidus de combustion vers les CIS.","ref":"§ 2.1 Nettoyage des tenues de feu sur les lieux (chap. 3) — p. 40","p":"Un lavage systématique des mains et des effets chaussants doit être effectué avant de réintégrer le véhicule.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027agrès","q":"Une grande quantité de matériel souillé doit être ramenée au CIS. Quel type d\u0027engin le guide recommande-t-il pour ce transport ?","c":["L\u0027engin-pompe, matériel rangé en cabine","Un VSAV, sa cellule étant désinfectable","Un engin de servitude de type VTU","Un camion-citerne, dans ses coffres"],"r":2,"e":"Le guide recommande un engin de servitude du type VTU, dont le volume est facilement nettoyable après le transport. Il faut veiller à ce que ce vecteur dispose d\u0027une isolation entre l\u0027espace de conduite et l\u0027espace de stockage.","ref":"§ 4 Avant de regagner le CIS (chap. 3) — p. 44","p":"utiliser un engin de servitude, du type VTU s\u0027il y a une grande quantité de matériel souillé à transporter. L\u0027intérêt de ce type d\u0027engin est que le volume est facilement nettoyable, après le transport","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Soutien et nettoyage sur place","niv":"Chef d\u0027équipe","q":"Pour le retour au CIS, que fait-on des EPI qui restent souillés après le nettoyage sur place ?","c":["On les garde sur soi dans la cabine, veste ouverte pour évacuer la chaleur","On les range avec les tenues propres pour gagner de la place","On les pose sur les sièges de la cabine pour qu\u0027ils sèchent","On les isole des matériels propres (sac, bac étanche, espace dédié)"],"r":3,"e":"Les EPI et matériels qui restent souillés doivent être mis à l\u0027écart des matériels propres dans les véhicules : sacs spécifiques, bacs étanches ou espaces dédiés. Cette mesure fait partie des bonnes pratiques collectives avant de regagner le CIS, comme laver les matériels sur place pour limiter le transfert de résidus de combustion à l\u0027habitacle des véhicules et au centre de secours.","ref":"§ 4 Avant de regagner le CIS (chap. 3) — p. 44","p":"Les EPI et matériels qui restent souillés doivent être mis à l\u0027écart des matériels propres dans les véhicules (sacs spécifiques, bacs étanches ou espaces dédiés).","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Équipier","q":"De retour au CIS, pourquoi le guide préconise-t-il de retirer les suies sur la peau à l\u0027eau savonneuse froide avant la douche ?","c":["Parce que l\u0027eau froide limite l\u0027ouverture des pores de la peau","Parce que l\u0027eau froide fait sécher plus vite la peau et les cheveux","Parce que l\u0027eau froide abaisse plus vite la température de la tenue","Parce que l\u0027eau froide calme les rougeurs dues à la chaleur du feu"],"r":0,"e":"Au retour, les suies sur la peau sont retirées à l\u0027eau savonneuse froide avant de se doucher le plus rapidement possible : l\u0027eau froide limite l\u0027ouverture des pores et évite ainsi l\u0027intoxication par voie cutanée. Sous la douche, on insiste sur les zones de liaison entre EPI et sur les ongles.","ref":"§ 1 Les mesures concernant les personnels (chap. 4) — p. 45","p":"L\u0027emploi d\u0027eau froide limite l\u0027ouverture des pores de la peau évitant l\u0027intoxication possible par voie cutanée.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Équipier","q":"De retour au CIS, que prévoit le guide pour les effets vestimentaires portés sur intervention (polos, sous-vêtements) ?","c":["Les garder toute la garde s\u0027ils ne sont pas tachés","Les aérer au vestiaire avant de les remettre","Les changer avant de poursuivre la garde, puis les nettoyer","Les ranger avec la tenue de feu dans le casier personnel"],"r":2,"e":"Le guide juge indispensable de changer les effets vestimentaires portés sur intervention (polos, sous-vêtements…) avant de poursuivre la garde, et de les nettoyer, comme la cagoule de feu. Il prévoit aussi de ne pas stocker la tenue de feu avec le reste du vestiaire.","ref":"§ 1 Les mesures concernant les personnels (chap. 4) — p. 46","p":"changer les effets vestimentaires qui ont été portés sur intervention (polos, sous-vêtements, …) avant de poursuivre la garde ;","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Chef d\u0027équipe","q":"Vous êtes chef d\u0027équipe. De retour au CIS après un feu, votre équipier veut rejoindre la salle de repos. À quel moment est-ce possible selon le guide ?","c":["Dès la descente de l\u0027engin, pour s\u0027hydrater au plus vite","Après avoir seulement retiré sa veste et son casque","Après un simple lavage des mains","Uniquement après avoir pris sa douche"],"r":3,"e":"Le guide est formel : en aucun cas les espaces de vie ne doivent être rejoints par le personnel de retour d\u0027intervention avant la douche. De retour au CIS, les agents limitent leurs déplacements et prennent très rapidement une douche ; une hydratation soutenue est également recommandée.","ref":"§ 1 Les mesures concernant les personnels (chap. 4) — p. 46","p":"En aucun cas, les espaces de vie ne doivent pas être rejoints par le personnel de retour d\u0027intervention avant la douche.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Au retour d\u0027une intervention exposante, comment le guide préconise-t-il de traiter les engins pendant la phase de reconditionnement ?","c":["Les rentrer aussitôt en remise, portes fermées, pour confiner les particules","Les laisser dehors, vitres et/ou portes ouvertes","Les laisser moteur tournant, cabine ventilée","Les fermer hermétiquement jusqu\u0027au passage d\u0027une équipe de nettoyage"],"r":1,"e":"Pendant le reconditionnement, le guide préconise de laisser les engins dehors, vitres et/ou portes ouvertes ; si le temps ne s\u0027y prête pas, on laisse les portes de remise ouvertes pour aérer. Le reconditionnement au CIS fait partie des étapes pouvant permettre désorption et transferts de toxiques.","ref":"§ 2 Les mesures relatives aux matériels (chap. 4) — p. 46","p":"Laisser les engins dehors, vitres et/ou portes ouvertes durant la phase de reconditionnement. Si le temps ne s\u0027y prête pas, laisser les portes de remises ouvertes pour aérer.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Chef d\u0027agrès","q":"Lors du reconditionnement de l\u0027engin, sur quels éléments le guide demande-t-il une attention particulière si le vent a pu tourner sur l\u0027intervention ?","c":["Les feux de signalisation et les gyrophares","Les filtres moteur et de climatisation","La citerne et les crépines d\u0027aspiration","Les balais d\u0027essuie-glace et les vitres"],"r":1,"e":"Une attention particulière doit être portée aux filtres (moteur, climatisation) dès lors que le vent a pu tourner sur la zone d\u0027intervention. Le guide recommande aussi de laisser l\u0027engin dehors, vitres et/ou portes ouvertes, pendant le reconditionnement.","ref":"§ 2 Les mesures relatives aux matériels (chap. 4) — p. 46","p":"Une attention particulière doit également est portée sur les filtres (moteur, climatisation), dès lors que le vent sur la zone d\u0027intervention a pu tourner.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Chef d\u0027équipe","q":"Selon le guide, combien de temps la désorption d\u0027une tenue de feu laissée à l\u0027air libre peut-elle se poursuivre ?","c":["Moins d\u0027une heure","Environ six heures","Une douzaine d\u0027heures","Plus de 48 heures"],"r":3,"e":"À l\u0027air libre, la désorption d\u0027une tenue peut se poursuivre pendant plus de 48 heures. Elle s\u0027accentue sous l\u0027influence de la chaleur : dans une armoire de séchage, la température plus élevée favorise la désorption.","ref":"§ 3 Désorption et séchage au retour (chap. 4) — p. 48","p":"A l\u0027air libre, la désorption d\u0027une tenue peut se poursuivre pendant plus de 48 heures.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Après l\u0027opération","niv":"Chef d\u0027équipe","q":"Quel critère minimal le guide retient-il avant de réintégrer une tenue de feu séchée dans son lieu de stockage ?","c":["L\u0027absence d\u0027odeur sur la tenue","Une exposition prolongée au soleil direct","Un contrôle au détecteur multigaz","Un séchage d\u0027au moins une nuit"],"r":0,"e":"L\u0027absence d\u0027odeur est un critère minimal à rechercher avant de réintégrer la tenue dans le lieu de stockage prévu. Une exposition prolongée aux rayons directs du soleil n\u0027est, elle, pas toujours possible et peut ne pas être recommandée selon l\u0027usure, la nature et la teinte du matériau.","ref":"§ 3 Désorption et séchage au retour (chap. 4) — p. 48","p":"L\u0027absence d\u0027odeur avant de réintégrer la tenue dans le lieu de stockage prévu à cet effet est un critère minimal à rechercher.","s":"gdo-fum"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Équipier","q":"Sur autoroute, les exploitants numérotent les voies de circulation. Laquelle est désignée « V1 » ?","c":["La voie de gauche, la plus rapide","La voie médiane droite","La voie de droite, la plus lente","La bande d\u0027arrêt d\u0027urgence"],"r":2,"e":"Les exploitants autoroutiers numérotent les voies de la plus lente à la plus rapide : V1 est la voie de droite, V2 la voie médiane droite, V3 la voie médiane gauche et V4 la voie de gauche.","ref":"§ 1.1.1 Le réseau routier national (chap. 1) — p. 21","p":"les exploitants autoroutiers utilisent un système de numérotation des voies, allant de la plus lente à la plus rapide : V1 = Voie de droite ;","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Chef d\u0027équipe","q":"La ligne discontinue de guidage T1 est un repère pratique pour poser la signalisation d\u0027urgence. Quelles sont ses dimensions ?","c":["Traits de 39 m, intervalles de 3 m","Traits de 1,5 m, intervalles de 5 m","Traits de 10 m, intervalles de 3 m","Traits de 3 m, intervalles de 10 ou 13 m"],"r":3,"e":"Selon le tableau du guide, la ligne de guidage T1 a des traits de 3 m, séparés par 10 m sur les chaussées à sens unique et par 13 m sur les routes à double sens où le dépassement est autorisé. Le trait de 39 m correspond à la ligne de bande d\u0027arrêt d\u0027urgence.","ref":"§ 1.2.1 La signalisation routière (chap. 1) — p. 26","p":"Ligne de guidage (T1) […] 3 mètres […] 10 mètres […] Très pratique pour servir de repère pour le signalisation d\u0027urgence","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un engin de grande hauteur. Sauf exception dûment matérialisée, quelle hauteur libre le guide indique-t-il sous les ponts ?","c":["4,30 m sous autoroute et 4,75 m sur les autres routes","4,75 m sous autoroute et 4,30 m sur les autres routes","4,00 m sur l\u0027ensemble du réseau routier public","4,75 m sur l\u0027ensemble du réseau routier public"],"r":1,"e":"Le guide indique une hauteur libre de 4,75 m sous les ponts d\u0027autoroute et de 4,30 m sous ceux du reste des routes, sauf exception dûment matérialisée.","ref":"§ 1.3.1 Les ponts et les viaducs (chap. 1) — p. 27","p":"La hauteur libre sous un pont d\u0027autoroute est de 4,75 mètres comparativement aux restes des routes où les ponts sont à 4,30 mètres (sauf exception dûment matérialisée).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Équipier","q":"Dans un tunnel routier, les niches de sécurité abritent notamment un poste d\u0027appel d\u0027urgence (PAU) et des extincteurs. Protègent-elles des effets d\u0027un incendie ?","c":["Oui, dès lors qu\u0027elles sont munies d\u0027une porte","Oui, pour les usagers mais pas pour les sapeurs-pompiers","Non, même lorsqu\u0027elles sont munies de portes","Non, sauf dans les tunnels de plus de 300 mètres"],"r":2,"e":"Le guide précise que les niches de sécurité, même munies de portes, ne sont destinées à protéger ni les usagers ni les sapeurs-pompiers des effets d\u0027un incendie. La protection et l\u0027évacuation des usagers relèvent d\u0027autres aménagements, protégés par une porte coupe-feu.","ref":"§ 1.3.2 Les tunnels (chap. 1) — p. 33","p":"Les niches de sécurité, même dans le cas où elles sont munies de portes ne sont pas destinées à protéger les usagers ni les sapeurs-pompiers, des effets d\u0027un incendie.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Chef d\u0027agrès","q":"Un véhicule accidenté est en équilibre sur la rambarde d\u0027un pont, une victime à bord. Que préconise le guide pour la sécurisation du site ?","c":["L\u0027alléger pour ne pas surcharger le tablier du pont","La limiter au balisage amont de la chaussée","La réaliser comme sur une chaussée ordinaire","La renforcer, avec au besoin une expertise"],"r":3,"e":"Un accident sur ouvrage d\u0027art impose une adaptation opérationnelle : la sécurisation du site est renforcée si l\u0027ouvrage est endommagé ou si l\u0027intervention devient périlleuse (véhicule en équilibre sur une rambarde). Une expertise (SIS ou services extérieurs : ingénieur, expert en stabilité) peut utilement être mobilisée.","ref":"§ 1.3.3 Les autres types d\u0027ouvrages d\u0027art (chap. 1) — p. 38","p":"La sécurisation du site doit être renforcée soit : parce que l\u0027ouvrage d\u0027art a subi des dommages ; parce que les conditions d\u0027intervention deviennent périlleuses (secours dans un véhicule en équilibre sur une rambarde de pont","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Chef d\u0027agrès","q":"Sur un poids lourd accidenté, quel élément peut renseigner le COS sur la masse du véhicule et son chargement ?","c":["Le chronotachygraphe","La plaque de tare","Le certificat d\u0027assurance","La plaque d\u0027immatriculation"],"r":1,"e":"La plaque de tare d\u0027un poids lourd peut fournir au COS des informations importantes sur la masse du véhicule et son chargement. Un poids lourd se caractérise par un PTAC supérieur à 3,5 tonnes.","ref":"§ 1.4.3 Les véhicules poids lourds (chap. 1) — p. 40","p":"La plaque de tare d\u0027un véhicule poids-lourds peut fournir des informations importantes au COS sur la masse du véhicule et son chargement.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Environnement routier","niv":"Équipier","q":"Selon le guide, quelle particularité les engins de chantier présentent-ils surtout ?","c":["Un flux hydraulique sous pression et un équilibre particulier","Une batterie de traction haute tension reliée par des câbles orange","Un réservoir de gaz comprimé fixé derrière la cabine de conduite","Une caisse en tubes soudés recouverte d\u0027un habillage en tôles"],"r":0,"e":"Le guide souligne que les engins de chantier ont surtout la particularité d\u0027avoir un flux hydraulique sous pression et un point d\u0027équilibre particulier. Cette catégorie comprend aussi les grues mobiles destinées à lever et transporter des charges lourdes.","ref":"§ 1.4.7 Les engins agricoles et de chantier (chap. 1) — p. 43","p":"Les moyens présentés ont surtout la particularité d\u0027avoir un flux hydraulique sous pression et un point d\u0027équilibre particulier.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Les nouvelles technologies automobiles imposent d\u0027adapter la désincarcération. Comment le guide recommande-t-il de couper les aciers de nouvelle génération ?","c":["Avec la pointe des lames et à vitesse rapide","Avec la pointe des lames et à faible vitesse","Avec le cœur de l\u0027outil et à vitesse rapide","Avec le cœur de l\u0027outil et à faible vitesse"],"r":3,"e":"Les nouvelles technologies utilisées dans l\u0027industrie automobile demandent une adaptation des techniques de désincarcération : par exemple, les aciers de nouvelle génération doivent être coupés avec le cœur de l\u0027outil et à faible vitesse. La FAD du véhicule permet d\u0027identifier l\u0027emplacement des zones renforcées.","ref":"§ 2.1.1 La structure d\u0027un véhicule léger (chap. 1) — p. 54","p":"Par exemple, les aciers nouvelle génération doivent être coupés avec le cœur de l\u0027outil et à faible vitesse","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Que permet la fiche d\u0027aide à la décision (FAD) d\u0027un véhicule lors d\u0027une opération de secours routier ?","c":["Estimer la vitesse du véhicule au moment du choc pour orienter le bilan","Localiser les zones renforcées, la batterie HT et les prétensionneurs","Identifier le propriétaire du véhicule grâce à son immatriculation","Remplir le compte rendu avec les caractéristiques du constructeur"],"r":1,"e":"La FAD, document de 4 pages au maximum, intègre les éléments à prendre en compte pour une désincarcération en sécurité : emplacement des zones renforcées, de la batterie haute tension, des prétensionneurs de ceinture… Elle peut être consultée via des applications ou un QR code apposé sur certains véhicules.","ref":"§ 2.1.1 La structure d\u0027un véhicule léger (chap. 1) — p. 54 ; § 4 Le système haute tension, la batterie (chap. 1) — p. 78","p":"La fiche d\u0027aide à la décision (FAD) du véhicule permet d\u0027identifier l\u0027emplacement des zones renforcées. […] L\u0027emplacement de la batterie haute tension est indiqué sur la FAD","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Sur la cabine d\u0027un poids lourd, une zone renforcée en forme de H protège le conducteur en cas de choc frontal. Quelle contrainte présente-t-elle pour la désincarcération ?","c":["Elle gêne la poussée du tableau de bord","Elle renferme les générateurs des airbags","Elle abrite les câbles haute tension","Elle empêche la bascule de la cabine"],"r":0,"e":"Cette zone en H correspond à la traverse du tableau de bord des VL. Reliée par 4 points de fixation, elle apporte des contraintes lors de la poussée du tableau de bord ; le guide indique qu\u0027il conviendra alors de la traiter si besoin.","ref":"§ 2.1.2 La structure d\u0027un véhicule poids lourd (chap. 1) — p. 54","p":"Reliée par 4 points de fixations, elle apporte des contraintes lors de la poussée du tableau de bord, il conviendra alors de traiter cette zone si besoin.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Lors de la reconnaissance d\u0027un autocar de voyage accidenté, quel aménagement destiné à des personnes peut se trouver sous le plancher ?","c":["Un poste de conduite de secours à l\u0027arrière","Une salle de repos réservée aux passagers","Une cabine de couchage pour les conducteurs","Un espace de restauration pour les passagers"],"r":2,"e":"Le guide indique que sous le plancher des autocars de voyage se trouvent la soute à bagages, voire une cabine de couchage pour les conducteurs, ainsi que des toilettes au niveau de la porte centrale.","ref":"§ 2.1.3 La structure d\u0027un véhicule de transport en commun (chap. 1) — p. 55","p":"Sous le plancher (partie basse) des autocars dits de voyage, on trouve la soute à bagages, voire une cabine de couchage pour les conducteurs, des toilettes au niveau de la porte centrale.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Équipier","q":"Comment se comporte une vitre latérale en verre trempé lorsqu\u0027elle se brise ?","c":["Elle reste collée à un film plastique intercalaire","Elle se fend en longues lames très tranchantes","Elle se casse en une multitude de petits morceaux","Elle ne peut pas être brisée, seulement découpée à la scie"],"r":2,"e":"Le verre trempé, surtout utilisé pour les vitres latérales, les custodes et la lunette arrière, se casse en plein de petits morceaux, ce qui limite les risques de blessures. Le verre feuilleté, obligatoire pour les pare-brise, reste collé à sa feuille plastique et demande des matériels spécifiques (scie sabre, manuelle…) pour être enlevé ou découpé.","ref":"§ 2.2.1 Le verre trempé (chap. 1) — p. 55","p":"En effet le processus de refroidissement rapide lui permet de se casser en plein de petits morceaux.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Le marquage d\u0027une vitre latérale porte la mention « LAMISAFE ». Qu\u0027en déduisez-vous pour la manœuvre ?","c":["Verre trempé : il éclatera en petits morceaux","Verre feuilleté : il faudra un matériel spécifique","Polycarbonate : il résistera à l\u0027outil brise-vitre","Verre blindé : la vitre ne pourra pas être retirée"],"r":1,"e":"« LAMISAFE » et « TEMPERLITE » désignent respectivement le verre feuilleté et le verre trempé. Le feuilleté reste collé à sa feuille plastique en cas de bris : il demande des matériels spécifiques pour l\u0027enlever ou le découper (scie sabre, manuelle…). Son usage tend à se généraliser à toutes les vitres.","ref":"§ 2.2.3 Le marquage (chap. 1) — p. 57","p":"Les mentions « LAMISAFE » et « TEMPERLITE » correspondent respectivement au verre feuilleté et au verre trempé (normes étrangères). […] il demande des matériels spécifiques pour pouvoir l\u0027enlever ou le découper (scies sabre, manuelle, etc.)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Équipier","q":"Un airbag à générateur pyrotechnique vient de se déployer et de la fumée apparaît dans l\u0027habitacle. Que signifie cette fumée selon le guide ?","c":["Elle signale un départ de feu sous le tableau de bord","Elle trahit une fuite du circuit de climatisation","Elle indique un court-circuit de la batterie 12 V","Elle n\u0027est pas le signe d\u0027un départ d\u0027incendie"],"r":3,"e":"Au déploiement, un générateur pyrotechnique produit de la chaleur, libère de la fumée et génère un bruit de détonation : cette fumée n\u0027est pas le signe d\u0027un départ d\u0027incendie. Le déploiement de l\u0027airbag peut en revanche provoquer des blessures à la surface de la peau.","ref":"§ 2.3.2 Les éléments de sécurité passive (chap. 1) — p. 59","p":"Dans le premier cas, à son déploiement, il produit de la chaleur, libère de la fumée (ce qui n\u0027est pas le signe d\u0027un départ d\u0027incendie) et génère un bruit de détonation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Équipier","q":"Après un choc, les airbags d\u0027un véhicule sont restés pliés dans leur logement. Comment rend-on le système « airbag » inerte ?","c":["En coupant le contact ou en débranchant la batterie 12 V","En sectionnant le faisceau électrique qui alimente le volant","En arrosant le volant et la planche de bord avant la découpe","En provoquant volontairement leur déploiement avant la découpe"],"r":0,"e":"Le calculateur (ECU) qui commande airbags et prétensionneurs est alimenté par la batterie 12 V : couper le contact ou débrancher cette batterie rend le système inerte. À l\u0027inverse, si la batterie n\u0027est pas débranchée, couper un faisceau comprenant les fils d\u0027un générateur de gaz peut provoquer son déclenchement par court-circuit.","ref":"§ 2.3.2 Les éléments de sécurité passive (chap. 1) — p. 61","p":"Couper le contact ou débrancher la batterie 12 V du véhicule rend le système « airbag » inerte.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"La batterie 12 V est toujours branchée. Quel risque présente la coupe d\u0027un faisceau électrique comprenant les fils d\u0027un générateur de gaz ?","c":["Aucun, l\u0027ECU exigeant le signal de deux capteurs","Le déclenchement du générateur par court-circuit","La mise hors service définitive de l\u0027ECU airbag","L\u0027électrisation de l\u0027équipier tenant la cisaille"],"r":1,"e":"L\u0027ECU ne déclenche les éléments de sécurité que si deux capteurs signalent simultanément un « crash ». Mais si la batterie n\u0027a pas été débranchée, couper un faisceau comprenant les fils d\u0027un générateur de gaz peut provoquer son déclenchement par court-circuit. Couper le contact ou débrancher la batterie 12 V rend le système airbag inerte.","ref":"§ 2.3.2 Les éléments de sécurité passive (chap. 1) — p. 61","p":"Si la batterie n\u0027a pas été débranchée, le fait de couper un faisceau de câbles électriques comprenant les fils d\u0027alimentation d\u0027un générateur de gaz, peut provoquer son déclenchement, par un phénomène de court-circuit électrique.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Équipier","q":"Lors d\u0027un feu de véhicule, vers quelle température les générateurs de gaz se déclenchent-ils de façon sécurisée grâce à leur sécurité intrinsèque ?","c":["Autour de 60 à 80 °C","Autour de 110 °C","Autour de 180 à 220 °C","Au-delà de 500 °C"],"r":2,"e":"Les générateurs de gaz disposent d\u0027une sécurité intrinsèque qui entraîne leur déclenchement sécurisé autour de 180 à 220 °C. La valeur de 110 °C concerne d\u0027autres dispositifs : le thermo-fusible de certains réservoirs GPL-c, le fusible thermique des réservoirs GNC et le TPRD des réservoirs d\u0027hydrogène.","ref":"§ 2.3.2 Les éléments de sécurité passive (chap. 1) — p. 61","p":"dans le cas d\u0027un feu de véhicule, les générateurs de gaz disposent d\u0027une sécurité intrinsèque entrainant leur déclenchement sécurisé autour de 180- 220°C.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Conception des véhicules","niv":"Chef d\u0027équipe","q":"Certains véhicules portent une étiquette spécifique sur ou près de l\u0027organe de mise en sécurité de l\u0027énergie embarquée. Que représente-t-elle ?","c":["L\u0027action de mise en sécurité demandée par le constructeur","Le code de la source d\u0027énergie inscrit sur la carte grise","Les zones renforcées à éviter lors de la découpe","Le numéro de série de la batterie haute tension"],"r":0,"e":"Cette étiquette, placée sur ou près de l\u0027organe de mise en sécurité de l\u0027énergie embarquée (haute tension, GNV, GNC, H2…), reprend schématiquement l\u0027action demandée par le constructeur dans la FAD. Sans caractère réglementaire, elle ne se trouve pas systématiquement sur tous les véhicules.","ref":"§ 2.3.3 Les éléments de sécurité tertiaire (chap. 1) — p. 63","p":"une étiquette indiquant le mode d\u0027isolement de l\u0027énergie […] cette étiquette spécifique située à proximité ou sur l\u0027organe dédié à la mise en sécurité de l\u0027énergie embarquée […] Elle reprend schématiquement l\u0027action demandée par le constructeur dans la FAD.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"Sur un véhicule léger fonctionnant au GPL-c, où se trouve généralement le réservoir de gaz ?","c":["Sous le capot, à côté du moteur et de la batterie","Sous les sièges avant, de part et d\u0027autre du tunnel","Sur le toit, dans un carénage en matière plastique","À l\u0027arrière, dans le coffre ou fixé sous le châssis"],"r":3,"e":"Le GPL-c est stocké sous pression (10 bar maximum) dans un ou plusieurs réservoirs métalliques cylindriques, toriques (forme d\u0027une roue de secours) ou polyformes, situés généralement à l\u0027arrière, dans le coffre ou sous le châssis. Son orifice de remplissage, non normalisé et volontairement masqué, est très difficilement repérable.","ref":"§ 3.1.2 Le moteur thermique fonctionnant au gaz (chap. 1) — p. 67","p":"Il peut y avoir un ou plusieurs réservoirs par véhicule situé(s) généralement à l\u0027arrière du véhicule soit dans le coffre ou fixés sous le châssis.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Chef d\u0027équipe","q":"Vous intervenez sur un autobus fonctionnant au GNC. Où ses réservoirs de gaz se situent-ils généralement ?","c":["Sous le plancher, en soute","Sur le toit du véhicule","Derrière la cabine","Sur les côtés, entre les essieux"],"r":1,"e":"Les réservoirs GNC, où le gaz est stocké entre 200 et 250 bar, sont généralement situés sur le toit pour les bus, derrière la cabine pour les poids lourds et sur les côtés du tracteur pour les semi-remorques.","ref":"§ 3.1.2 Le moteur thermique fonctionnant au gaz (chap. 1) — p. 68","p":"Les réservoirs GNC sont généralement situés sur les côtés du tracteur pour les semi-remorques, derrière la cabine pour les poids lourds et sur le toit pour les bus.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"Le GNC est odorisé comme le gaz distribué sur le réseau GrDF. Qu\u0027en est-il du GNL, utilisé surtout par les poids lourds et les autocars ?","c":["Il est odorisé selon le même procédé que le GNC","Il est odorisé plus fortement que le GNC","Il n\u0027est pas odorant et parfois non odorisé","Il devient odorant en se vaporisant à l\u0027air"],"r":2,"e":"Le GNC, constitué d\u0027environ 97 % de méthane, est le même gaz que celui du réseau GrDF et il est odorisé selon le même procédé. Le GNL, obtenu par condensation du gaz naturel à -160 °C, n\u0027est pas odorant et parfois non odorisé.","ref":"§ 3.1.2 Le moteur thermique fonctionnant au gaz (chap. 1) — p. 70","p":"Le GNL est obtenu par condensation du gaz naturel à -160 °C. Il n\u0027est pas odorant et parfois non odorisé.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"Sur les lieux d\u0027un accident, quels indices permettent d\u0027identifier un véhicule électrique ?","c":["Une plaque orange réfléchissante fixée à l\u0027avant et à l\u0027arrière du véhicule","Un double pot d\u0027échappement chromé et un bruit de moteur plus aigu","L\u0027absence de pot d\u0027échappement, une trappe de charge, un logo spécifique","Des vitres teintées et un pare-brise à affichage tête haute"],"r":2,"e":"L\u0027absence de pot d\u0027échappement (donc de bruit) et la présence d\u0027une trappe de charge ou d\u0027un logo spécifique rendent les véhicules électriques identifiables. La plaque orange réfléchissante, elle, identifie le chargement d\u0027un transport de matières dangereuses.","ref":"§ 3 La motorisation des véhicules (chap. 1) — p. 73","p":"L\u0027absence de pot d\u0027échappement (donc de bruit) et la présence d\u0027une trappe de charge ou d\u0027un logo spécifique rendent ces véhicules identifiables.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"En conditions normales, la caisse d\u0027un véhicule électrique peut-elle être touchée sans danger ?","c":["Oui, elle est isolée des composants haute tension","Non, elle est reliée au pôle négatif de la batterie HT","Oui, mais uniquement avec des gants isolants","Non, sauf après retrait du service plug"],"r":0,"e":"Les boîtiers ou couvercles des composants haute tension sont isolés des conducteurs HT internes et, en conditions normales, la caisse du véhicule est isolée des composants HT : elle peut être touchée sans danger. Le système HT est en outre désactivé automatiquement en cas de détection d\u0027un choc ou d\u0027une fuite haute tension.","ref":"§ 4 Le système haute tension (chap. 1) — p. 77","p":"En conditions normales, la caisse du véhicule est isolée des composants électriques haute tension et peut être touchée sans danger.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"Sur un véhicule électrique ou hybride accidenté, que sont les câbles de couleur orange et quelle règle s\u0027applique ?","c":["Des câbles de signalisation basse tension, manipulables sans risque","Les câbles de la batterie 12 V, à sectionner en priorité lors de l\u0027isolement","Des gaines d\u0027éclairage de l\u0027habitacle, à retirer lors du dégarnissage","Des câbles haute tension, qu\u0027il faut éviter de toucher ou de sectionner"],"r":3,"e":"Les câbles d\u0027alimentation haute tension, de couleur orange, appartiennent à un système pouvant aller jusqu\u0027à 800 V. Selon la règle « Interdire », on évite de toucher, sectionner, déplacer ou comprimer tout vecteur d\u0027énergie. Certains constructeurs les enveloppent d\u0027une gaine noire protectrice qui rend leur identification difficile.","ref":"§ 4 Le système haute tension (chap. 1) — p. 77 ; § 4.2.3 Interdire (chap. 5) — p. 144","p":"Les câbles d\u0027alimentation haute tension sont de couleur orange […] Les intervenants doivent éviter de toucher, sectionner, déplacer, comprimer toute source (réservoir, batterie HT) ou vecteur d\u0027énergie (câble HT, tuyau GPL/GNc/GNL/H2).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Chef d\u0027équipe","q":"Avant une découpe sur un véhicule électrique, dans quelles zones le guide situe-t-il le passage des câbles haute tension ?","c":["Montants de pare-brise, pavillon, montants arrière","Planche de bord, volant et colonne de direction","Compartiment moteur, tunnel central, bas de caisse","Portières, lève-vitres et boîtiers de rétroviseurs"],"r":2,"e":"Les câbles d\u0027alimentation haute tension, de couleur orange, sont installés dans le compartiment du moteur thermique ou électrique, au centre du véhicule (tunnel central) ou de chaque côté des bas de caisse. Sur la FAD, tous les composants haute tension apparaissent en orange.","ref":"§ 4.2 Les câbles d\u0027alimentation (chap. 1) — p. 80","p":"Les câbles d\u0027alimentation haute tension sont installés dans le compartiment du moteur thermique/électrique et au centre du véhicule (dans le tunnel central), ou de chaque côté des bas de caisse.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Équipier","q":"Vous cherchez à repérer les câbles haute tension d\u0027un véhicule électrique. Quelle difficulté le guide signale-t-il ?","c":["Les câbles HT sont désormais de couleur rouge vif","Les câbles HT sont tous logés dans le pack batterie","Les câbles orange n\u0027équipent que les véhicules hybrides","Certains câbles orange sont enveloppés d\u0027une gaine noire"],"r":3,"e":"Les câbles d\u0027alimentation haute tension sont de couleur orange, mais certains constructeurs les enveloppent d\u0027une gaine noire protectrice qui rend leur identification difficile : une attention toute particulière doit être portée par les intervenants.","ref":"§ 4.2 Les câbles d\u0027alimentation (chap. 1) — p. 81","p":"Certains constructeurs enveloppent les câbles orange d\u0027une gaine noire protectrice rendant l\u0027identification difficile. Une attention toute particulière doit être portée par les intervenants.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Motorisations et haute tension","niv":"Chef d\u0027agrès","q":"Un autocar d\u0027un modèle connu en motorisation diesel a été converti par « rétrofit ». Quels problèmes le guide signale-t-il pour les secours ?","c":["Identification délicate, FAD et sécurité tertiaire absentes","Aucun, la conversion n\u0027étant homologuée qu\u0027avec une FAD","Seulement un réservoir de gazole de plus grande capacité","Seulement l\u0027absence de bruit de moteur à l\u0027approche du car"],"r":0,"e":"Le rétrofit transforme un véhicule thermique en véhicule électrique (batterie, prolongateur d\u0027autonomie ou pile à hydrogène). Le guide signale une identification difficile, l\u0027absence de FAD et l\u0027absence d\u0027équipements de sécurité tertiaire ; le kit peut être logé dans les soutes à bagages ou sur le toit.","ref":"§ 4.5 Le rétrofit (chap. 1) — p. 83","p":"Ces véhicules peuvent poser plusieurs problèmes aux secours : identification, absence de FAD, équipements de sécurité tertiaire absents.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Équipier","q":"À quoi reconnaît-on un poids lourd transportant des matières dangereuses en citerne ?","c":["À sa citerne obligatoirement peinte en rouge avec bandes réfléchissantes","À la présence d\u0027un gyrophare orange et d\u0027un panneau « convoi exceptionnel »","À la plaque orange avec le code danger en haut et le numéro ONU en bas","À l\u0027inscription du nom du produit en grandes lettres sur les flancs"],"r":2,"e":"Le chargement est identifié par des plaques orange réfléchissantes : code danger en partie haute, code matière ONU (toujours 4 chiffres) en partie basse, pour les matières transportées en citerne ou en vrac solide. Une plaque-étiquette de 25 cm x 25 cm représente le pictogramme du danger principal.","ref":"§ 5 Le transport de matières dangereuses (chap. 1) — p. 84","p":"Elles comportent un code danger en partie haute et un code matière ONU en partie basse dans le cas de matières dangereuses transportées en citerne ou en vrac solide","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Chef d\u0027équipe","q":"Un poids lourd porte des plaques orange réfléchissantes vierges de toute inscription. Que signalent-elles sur son chargement ?","c":["Des colis ou des matières différentes","Une citerne vide, nettoyée et dégazée","Un convoi exceptionnel hors gabarit","Une matière au numéro ONU inconnu"],"r":0,"e":"Les plaques orange portent un code danger et un code matière ONU pour les matières transportées en citerne ou en vrac solide ; elles peuvent être vierges de toute écriture en cas de transport de colis ou de matières différentes. Des documents obligatoires (n° ONU, quantité transportée, consignes écrites de sécurité…) permettent également d\u0027obtenir des informations.","ref":"§ 5.2 L\u0027identification du chargement (chap. 1) — p. 84","p":"Elles comportent un code danger […] dans le cas de matières dangereuses transportées en citerne ou en vrac solide ; ou peuvent être vierges de toute écriture dans le cas du transport de colis ou de matières différentes.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Équipier","q":"Une citerne porte une plaque orange avec le code danger 80 en partie haute. Que signifie ce code ?","c":["Matière corrosive au danger très amplifié","Matière corrosive sans danger secondaire","Gaz corrosif, sans autre danger associé","Matière radioactive sans danger secondaire"],"r":1,"e":"Le premier chiffre du code danger indique le danger principal (8 : matières corrosives). Lorsque le danger d\u0027une matière est suffisamment indiqué par un seul chiffre, celui-ci est complété par un 0. Un chiffre doublé (88) signalerait au contraire un danger amplifié.","ref":"§ 5.2 L\u0027identification du chargement (chap. 1) — p. 85","p":"le 1er chiffre correspond au danger principal ; […] 8 Matières corrosives […] Lorsque le danger d\u0027une matière peut être indiqué suffisamment par un seul chiffre, celui-ci est complété par un 0.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Chef d\u0027agrès","q":"Un camion-citerne multi-cuves livrant une station-service porte la seule plaque 33/1203. Que devez-vous en retenir ?","c":["Il ne peut transporter que de l\u0027essence","Ses cuves sont obligatoirement vides","Il transporte un gaz liquéfié inflammable","Il peut transporter divers hydrocarbures"],"r":3,"e":"Par dérogation à l\u0027ADR, un camion-citerne multi-cuves transportant des hydrocarbures destinés aux stations-services peut ne porter que la plaque 33/1203 alors qu\u0027il transporte divers produits, cette plaque majorant le danger.","ref":"§ 5.2 L\u0027identification du chargement (chap. 1) — p. 85","p":"En dérogation à l\u0027ADR, dans le cadre du transport des hydrocarbures destinés aux stations-services, un camion-citerne multi-cuves peut ne porter que la plaque 33/1203 alors qu\u0027il transporte divers produits. Celle-ci majorant le danger.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Chef d\u0027agrès","q":"Accident d\u0027un poids lourd transportant des matières dangereuses : auprès de qui se renseigner immédiatement sur le produit et les moyens d\u0027extinction ?","c":["Auprès du gestionnaire de voirie, qui recense les flux de TMD","Auprès des témoins, qui ont pu voir le produit s\u0027écouler","Auprès du conducteur, qui détient les fiches produit, et du CODIS","Auprès de la société de dépannage chargée d\u0027enlever le véhicule accidenté"],"r":2,"e":"En présence d\u0027un TMD, il faut se renseigner immédiatement sur le produit, ses caractéristiques et les moyens d\u0027extinction : auprès du conducteur, qui détient les fiches de produit, et du CODIS, qui peut disposer d\u0027une base de données. Il faut aussi caler le véhicule, délimiter un périmètre de sécurité et établir les moyens d\u0027extinction en tenant compte de la pente et du vent.","ref":"§ 5.1 Les opérations en présence d\u0027un TMD (chap. 5) — p. 149","p":"se renseigner immédiatement sur le produit, ses caractéristiques et les moyens d\u0027extinction à employer (auprès du conducteur, qui détient les fiches de produit et auprès du CODIS, qui peut disposer d\u0027une base de données sur les produits)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Chef d\u0027agrès","q":"Lors d\u0027une opération partagée avec un exploitant routier, comment le guide organise-t-il la relation entre le COS et le représentant de l\u0027exploitant ?","c":["Le représentant de l\u0027exploitant prend la direction des opérations","Ils forment un binôme partageant intentions et conseils techniques","Le COS informe l\u0027exploitant uniquement en fin d\u0027intervention","Ils échangent exclusivement par l\u0027intermédiaire du CODIS"],"r":1,"e":"Dans toutes les opérations partagées avec les partenaires opérationnels des SIS, le COS et le représentant de l\u0027opérateur forment un binôme : les intentions du COS comme les conseils techniques de l\u0027opérateur doivent être partagés. Le COS reste chargé de la mise en œuvre de tous les moyens publics et privés mobilisés.","ref":"§ 6 Les acteurs (chap. 1) — p. 87","p":"Binôme COS – Exploitant : dans toutes les opérations partagées avec les partenaires opérationnels des SIS, le COS et le représentant de l\u0027opérateur forment un binôme. Les intentions du COS comme les conseils techniques de l\u0027opérateur doivent être partagés.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Matières dangereuses et acteurs","niv":"Chef d\u0027agrès","q":"Sur une autoroute, laquelle de ces missions le guide confie-t-il à l\u0027exploitant routier ?","c":["Décider seul du rétablissement de la circulation","Réaliser les constatations nécessaires à l\u0027enquête","Informer les usagers par PMV et radio 107.7","Diriger les opérations de secours sur la chaussée"],"r":2,"e":"L\u0027exploitant protège les intervenants par la signalisation, informe les usagers (PMV, radio 107.7…), organise la circulation avec les forces de l\u0027ordre, l\u0027enlèvement des véhicules et la remise en état des lieux. Les constatations relèvent des forces de l\u0027ordre, qui décident du rétablissement de la circulation en lien avec le COS, après avis de l\u0027exploitant.","ref":"§ 6 Les acteurs (chap. 1) — p. 88","p":"L\u0027exploitant, dans le cadre de ses missions, s\u0027assure notamment de : […] informer les usagers (PMV, radio 107.7, plan de gestion du trafic…)","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"De jour, comment visualiser une éventuelle flamme d\u0027hydrogène en sortie de TPRD sur un véhicule à hydrogène ?","c":["Avec une caméra thermique, la flamme étant invisible à l\u0027œil nu","À l\u0027œil nu, grâce à sa couleur jaune orangé très lumineuse","Grâce au panache de fumée noire qui l\u0027accompagne toujours","Avec un explosimètre placé directement dans l\u0027axe du rejet de gaz"],"r":0,"e":"De jour, en l\u0027absence de poussières ou de fumées, la flamme d\u0027hydrogène est invisible à l\u0027œil nu : une caméra thermique permet de la visualiser en sortie de TPRD. Ce dispositif s\u0027ouvre vers 110 °C et libère l\u0027hydrogène vers l\u0027extérieur ; le rejet, orienté vers le bas sous le véhicule, est très bruyant donc facilement repérable.","ref":"§ 1.1.1 La présence d\u0027un gaz comme carburant (chap. 2) — p. 95","p":"La flamme d\u0027hydrogène étant invisible à l\u0027oeil nu de jour […] Une caméra thermique peut être utilisée afin de visualiser la flamme d\u0027hydrogène en sortie de TPRD, si la fuite est enflammée.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Parmi ces affirmations sur l\u0027emballement thermique d\u0027une batterie de traction, laquelle est exacte selon le guide ?","c":["Il ne survient qu\u0027en cas de choc direct sur le pack batterie","Il s\u0027arrête de lui-même dès que le véhicule est à l\u0027arrêt","Il ne concerne que le circuit basse tension 12 V du véhicule","Il dégage des gaz toxiques comme le fluorure d\u0027hydrogène"],"r":3,"e":"L\u0027emballement thermique peut survenir sous l\u0027effet d\u0027une température élevée, d\u0027un court-circuit interne ou d\u0027une surcharge. La réaction chimique dégage des gaz toxiques (fluorure d\u0027hydrogène, acide chlorhydrique…) et la combustion totale d\u0027une batterie peut durer plusieurs heures.","ref":"§ 1.1.2 La présence de batteries de traction haute tension (chap. 2) — p. 96","p":"En cas d\u0027emballement thermique, la réaction chimique entraîne un dégagement de gaz toxiques (fluorure d\u0027hydrogène, acide chlorhydrique, etc.).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Lors d\u0027un feu de véhicule électrique, quels signes doivent faire suspecter un emballement thermique de la batterie de traction ?","c":["Fumées qui s\u0027éclaircissent, flammes plus sombres, rayonnement qui baisse","Crépitements, bruit de gaz sous pression, flammes plus claires et vives","Odeur d\u0027essence, flammes orangées, fumées blanches de plus en plus fines","Arrêt soudain des flammes et refroidissement rapide du plancher"],"r":1,"e":"Le guide caractérise notamment l\u0027emballement thermique par des crépitements, un bruit de gaz sous pression assimilable à celui d\u0027une torchère, un épaississement des fumées, des flammes plus claires et plus vives, une élévation de la température, un feu entretenu et un flux rayonné important. Des fumées qui s\u0027éclaircissent et un rayonnement qui baisse décrivent l\u0027inverse.","ref":"§ 1.1.2 La présence de batteries de traction haute tension (chap. 2) — p. 96","p":"des crépitements ; un bruit de gaz sous pression qui peut être assimilé au bruit d\u0027une torchère ; un épaississement des fumées ; un changement de couleur des flammes qui vont être plus claires, plus vives","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Lors de l\u0027extinction d\u0027un feu de véhicule, quel risque présente l\u0027eau projetée sur des pièces en alliage d\u0027aluminium ou de magnésium (jantes, bloc-moteur) ?","c":["Une réaction violente avec projection de métaux en fusion","Un dégagement d\u0027acétonitrile, gaz toxique et inflammable","Une électrisation du porte-lance à travers la carrosserie","Une rupture immédiate du réservoir de carburant voisin"],"r":0,"e":"Le guide signale que l\u0027aluminium et le magnésium sont de plus en plus présents (carters, bloc-moteur, radiateurs, jantes) et que l\u0027eau utilisée sur ces alliages lors d\u0027un incendie peut entraîner une réaction violente avec projection de métaux en fusion. L\u0027acétonitrile concerne l\u0027écrasement de certains systèmes ultra-capacité.","ref":"§ 1.1.3 Les alliages (chap. 2) — p. 97","p":"Lors d\u0027incendie, l\u0027utilisation de l\u0027eau sur des alliages pourra entrainer une réaction violente avec projection de métaux en fusion.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Le feu d\u0027un poids lourd vient d\u0027être complètement éteint. Que rappelle le guide sur le risque d\u0027éclatement des pneumatiques ?","c":["Il disparaît dès que les pneumatiques ont été arrosés une fois","Il ne concerne que la phase de pleine combustion du véhicule","Il est faible sur les engins lourds, à structure métallique","Il demeure : l\u0027éclatement peut survenir à retardement"],"r":3,"e":"Selon le guide, l\u0027éclatement d\u0027un pneu peut être dangereux, voire mortel pour les secours (souffle, effets missiles, impact auditif) et survenir « à retardement » ou après l\u0027extinction complète du véhicule. Une attention particulière est demandée sur les engins lourds, où la pression résiduelle et la structure métallique sont conséquentes.","ref":"§ 1.1.5 Les pneumatiques (chap. 2) — p. 98","p":"l\u0027éclatement d\u0027un pneu peut s\u0027avérer dangereux voire mortel pour les secours (souffle, effets missiles, impact auditif). Il peut survenir « à retardement », ou après l\u0027extinction complète du véhicule.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Chef d\u0027équipe","q":"Un véhicule a subi un choc latéral côté conducteur, qui est blessé. Par quel côté le guide demande-t-il d\u0027aborder la victime quand c\u0027est réalisable ?","c":["Par le côté du choc","Par l\u0027arrière, via le hayon","Par le côté opposé au choc","Par l\u0027avant, via le pare-brise"],"r":2,"e":"Le guide qualifie le choc latéral de choc le plus létal pour les passagers (hors enfants installés dans leur siège auto), l\u0027habitacle y subissant le plus de déformation. Il impose un abord du côté opposé quand cela est réalisable.","ref":"§ 2.1.2 Le choc latéral (chap. 2) — p. 105","p":"lors d\u0027un choc latéral, l\u0027habitacle subit le plus de déformation. Il impose un abord du côté opposé quand cela est réalisable.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Qu\u0027appelle-t-on un sur-accident ?","c":["Un accident venant aggraver un accident qui s\u0027est déjà produit","Un accident dont le bilan dépasse les capacités du premier engin","Un accident impliquant un véhicule de transport de matières dangereuses","Un accident survenu à un engin de secours pendant son trajet"],"r":0,"e":"Un sur-accident est un accident venant aggraver un accident déjà survenu ; les carambolages sur autoroute en sont l\u0027exemple typique. C\u0027est l\u0027un des principaux risques auxquels s\u0027exposent les sapeurs-pompiers dès qu\u0027ils interviennent sur le réseau routier public.","ref":"§ 2.1.7 Le sur-accident (chap. 2) — p. 107","p":"Un sur-accident est un accident venant aggraver un accident s\u0027étant déjà produit. Les carambolages sont des sur-accidents typiques des accidents routiers sur une autoroute.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès du premier engin arrivé sur un accident de la route. Selon le guide, quelle action doit être prioritaire ?","c":["Engager aussitôt la désincarcération de la victime la plus grave","Prévenir le sur-accident par la mise en place d\u0027un balisage","Photographier les véhicules et la chaussée pour le rapport","Dégager la chaussée pour rétablir au plus vite la circulation"],"r":1,"e":"Le sur-accident est un des principaux risques auxquels s\u0027exposent les sapeurs-pompiers sur le réseau routier : sa prévention, qui passe notamment par la mise en place d\u0027un balisage, doit être une action prioritaire des primo-intervenants. Le dégagement de la voie ne relève pas directement des attributions des SIS.","ref":"§ 2.1.7 Le sur-accident (chap. 2) — p. 107","p":"La prévention du risque de sur-accident doit être une action prioritaire des primo-intervenants. Elle passe notamment par la mise en place d\u0027un balisage.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Selon le guide, quand une victime d\u0027accident de la route est-elle dite « incarcérée » ?","c":["Lorsqu\u0027elle présente une détresse vitale qui rend impossible toute sortie seule","Lorsque le véhicule déformé la comprime et exige des outils de désincarcération","Lorsqu\u0027un traumatisme décelé au bilan l\u0027empêche de s\u0027extraire elle-même","Lorsqu\u0027elle a été projetée hors de son véhicule sous la violence du choc"],"r":1,"e":"Une victime est incarcérée lorsque la déformation du véhicule la comprime au point d\u0027exiger la mise en œuvre combinée d\u0027outils de désincarcération ; cette définition est dissociée de son état de gravité. La victime « accessible » ne peut s\u0027extraire seule à cause d\u0027un traumatisme détecté au bilan ; la victime « éjectée » a été projetée hors du véhicule.","ref":"§ 2.2.1 Les automobilistes (chap. 2) — p. 107","p":"une victime est dite incarcérée dans un véhicule si la déformation de ce dernier cause une compression de celui-ci nécessitant la mise en œuvre combinée d\u0027outils de désincarcération […] Cette définition est dissociée de l\u0027état de gravité de la victime","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Dangers et risques","niv":"Équipier","q":"Pourquoi l\u0027eau d\u0027extinction projetée sur une fuite de GNL peut-elle provoquer une « explosion froide » ?","c":["L\u0027eau gèle instantanément au contact du GNL et fait éclater le réservoir","Le GNL s\u0027enflamme spontanément au contact de l\u0027eau, sans source d\u0027ignition","L\u0027eau réagit chimiquement avec le méthane et libère de l\u0027hydrogène","Le GNL à -160 °C se vaporise presque instantanément au contact de l\u0027eau"],"r":3,"e":"Le guide explique que la différence de température entre le GNL (-160 °C) et l\u0027eau d\u0027extinction peut provoquer sa vaporisation quasi instantanée, avec une expansion de volume de l\u0027ordre de 600 fois : c\u0027est l\u0027« explosion froide », une surpression sans combustion.","ref":"§ 5.2 Les fuites d\u0027énergie (chap. 5) — p. 150","p":"La différence de température entre le GNL (-160°C) et l\u0027eau d\u0027extinction peut provoquer la vaporisation quasi-instantanée du GNL avec une expansion du volume de l\u0027ordre de 600 fois d\u0027où ce phénomène « d\u0027explosion froide » (surpression sans combustion).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"À l\u0027arrivée sur une intervention routière, comment les sapeurs-pompiers descendent-ils de l\u0027engin ?","c":["Du côté de la circulation, pour mieux voir arriver les véhicules","Si la circulation le permet, et si possible du côté opposé à celle-ci","Par les portes arrière de la cellule, quelle que soit la circulation","Indifféremment, selon la place occupée en cabine, dès l\u0027arrêt complet"],"r":1,"e":"Avant de descendre de l\u0027engin, chacun s\u0027assure que la circulation le permet et, dans la mesure du possible, sort du côté opposé à la circulation. Sur le domaine routier, le port d\u0027EPI haute visibilité s\u0027ajoute aux autres EPI (tenue de feu, tenue de service et d\u0027intervention).","ref":"§ 1 La protection des intervenants (chap. 3) — p. 112","p":"Avant de descendre de l\u0027engin, il convient de s\u0027assurer que la circulation le permette et dans la mesure du possible, sortir du véhicule du côté opposé à la circulation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Chef d\u0027équipe","q":"Pendant les déplacements sur la chaussée, par quel moyen la vigilance du personnel peut-elle être complétée ?","c":["L\u0027extinction des feux de l\u0027engin pour ne pas éblouir les usagers","Des déplacements en courant, d\u0027un abri à l\u0027autre","Un équipier placé au milieu de la voie pour ralentir les usagers","Une vigie (sonnette) assurée par un personnel face à la circulation"],"r":3,"e":"Pendant tout déplacement sur la chaussée, la vigilance doit être accrue ; elle peut être complétée par une vigie (« sonnette ») assurée par un personnel faisant face à la circulation. En cas de déplacement seul, il est préférable de passer derrière les glissières de sécurité, par l\u0027itinéraire le plus éloigné de la circulation.","ref":"§ 1 La protection des intervenants (chap. 3) — p. 112","p":"Pendant tout déplacement sur la chaussée, la vigilance des personnels doit être accrue et peut être complétée par la mise en place d\u0027une vigie (sonnette) assurée par un personnel faisant face à la circulation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"Un équipier doit se déplacer seul le long d\u0027une voie rapide pour rejoindre un engin. Quel cheminement le guide lui recommande-t-il ?","c":["Sur la bande d\u0027arrêt d\u0027urgence, face à la circulation","Derrière les glissières, au plus loin de la circulation","Sur la voie neutralisée, au plus près des cônes posés","Au bord de la chaussée, dans le sens de la circulation"],"r":1,"e":"En cas de déplacement seul, le guide recommande de passer de préférence derrière les glissières de sécurité, en suivant l\u0027itinéraire le plus éloigné possible de la circulation. Pendant tout déplacement sur la chaussée, la vigilance des personnels doit être accrue.","ref":"§ 1 La protection des intervenants (chap. 3) — p. 112","p":"En cas de déplacement seul, le faire de préférence, derrière les glissières de sécurité, en suivant un itinéraire le plus éloigné possible de la circulation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"À l\u0027arrêt de l\u0027engin sur une intervention routière, comment le conducteur oriente-t-il les roues ?","c":["Braquées en direction opposée à la zone de flux de circulation","Droites, dans l\u0027axe de la route, pour faciliter un départ rapide","Braquées vers le lieu de l\u0027accident, pour protéger la zone de travail","Peu importe, dès lors que le frein de parc est bien serré"],"r":0,"e":"Le conducteur braque les roues en direction opposée à la zone de flux : en cas de choc violent par l\u0027arrière, l\u0027engin n\u0027est pas projeté dans la direction du lieu de l\u0027accident. Sur intervention, les manœuvres des engins sont par ailleurs obligatoirement guidées.","ref":"§ 1.1 L\u0027arrivée des moyens sur les lieux (chap. 3) — p. 112","p":"le conducteur veillera à braquer les roues du véhicule en direction opposée à la zone de flux de manière à éviter, en cas de choc violent par l\u0027arrière, la projection de l\u0027engin dans la direction du lieu de l\u0027accident.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Chef d\u0027agrès","q":"Vous arrivez en renfort sur un accident où des engins sont déjà engagés. Que doit faire votre conducteur à l\u0027arrivée, selon le guide ?","c":["Se placer du côté opposé pour élargir la zone protégée","Ralentir au dernier moment pour ne pas gêner le trafic","Se placer du même côté que les engins déjà engagés","Couper les avertisseurs lumineux pour ne pas éblouir"],"r":2,"e":"Le guide demande aux conducteurs de diminuer progressivement leur vitesse, d\u0027utiliser les clignotants, de maintenir les avertisseurs lumineux, de se mettre du même côté que les engins déjà engagés afin que le chantier soit organisé, et de se positionner conformément aux consignes du COS.","ref":"§ 1.1 L\u0027arrivée des moyens sur les lieux (chap. 3) — p. 112","p":"se mettre du même côté que les engins déjà engagés afin que le chantier soit organisé ; se positionner conformément aux consignes du COS.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"Sur une intervention pour accident de la route, à qui incombe la régulation de la circulation ?","c":["Aux sapeurs-pompiers du premier engin, jusqu\u0027à l\u0027arrivée du COS","Aux forces de l\u0027ordre (police ou gendarmerie nationale)","Au médecin du SMUR, une fois la victime prise en charge","Aux témoins désignés et équipés de gilets par le chef d\u0027agrès"],"r":1,"e":"La régulation de la circulation incombe aux forces de l\u0027ordre et non aux sapeurs-pompiers ; la police de la circulation est assurée, selon les zones, par la police nationale ou la gendarmerie nationale. Le SIS met en place la signalisation temporaire d\u0027urgence, premières actions de sécurisation de la zone d\u0027intervention.","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 113","p":"La régulation de la circulation est une mission qui incombe aux forces de l\u0027ordre et non aux sapeurs-pompiers.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Chef d\u0027agrès","q":"Selon le guide, de quels facteurs le zonage opérationnel sur le domaine routier doit-il notamment tenir compte ?","c":["Du nombre de témoins présents et de la proximité de commerces ou d\u0027habitations","De la marque des véhicules accidentés et de leur année de fabrication","De la visibilité, de la météo et de la vitesse réelle des usagers","De l\u0027âge des victimes et de leurs antécédents médicaux"],"r":2,"e":"Le zonage opérationnel routier doit tenir compte notamment des caractéristiques de la voie, de la visibilité (virages, bosses, brouillard, nuit), de l\u0027importance du trafic, des conditions météorologiques et de la vitesse de circulation réelle des usagers. Il doit être visible, compréhensible, adapté au danger et sans équivoque.","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 113","p":"de la visibilité liée aux facteurs géométriques de la route (virages, bosses...), mais également aux conditions ambiantes (brouillard, nuit...); […] des conditions météorologiques ; […] de la vitesse de circulation réelle des usagers.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"Dans la signalisation d\u0027urgence d\u0027une intervention routière, quel est le rôle de la zone tampon située en amont de la zone de travail ?","c":["Permettre à un usager n\u0027ayant pas vu la signalisation de s\u0027arrêter à temps","Accueillir les engins de renfort en attente d\u0027un engagement sur la zone","Regrouper les impliqués non blessés et les témoins à l\u0027écart du trafic","Recevoir les pièces découpées et les débris issus de la désincarcération"],"r":0,"e":"Située après la zone d\u0027approche et en amont de la zone de travail, la zone tampon limite le risque de sur-accident : un véhicule qui n\u0027aurait pas vu la signalisation d\u0027urgence doit pouvoir s\u0027y arrêter avant de percuter le premier véhicule de secours.","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 114","p":"elle doit permettre de limiter les risques de sur-accident face à un véhicule qui n\u0027aurait pas vu le dispositif de signalisation d\u0027urgence et de pouvoir s\u0027arrêter avant de percuter le premier véhicule de secours.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"Dans la signalisation temporaire d\u0027urgence, quel est le rôle du biseau de cônes ?","c":["Obliger les conducteurs à s\u0027arrêter avant la zone de travail","Délimiter le parc à matériels autour du véhicule accidenté","Inciter les conducteurs à changer de voie sans marquer d\u0027arrêt","Signaler aux usagers la fin de la zone d\u0027intervention routière"],"r":2,"e":"Le biseau doit inciter les conducteurs à changer de voie sans marquer d\u0027arrêt ; ses cônes sont espacés de façon régulière et son début matérialise le début de la zone tampon. Sur les routes à chaussées séparées, la flèche lumineuse d\u0027urgence (FLU) peut le remplacer ou le compléter.","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 114","p":"Le biseau, doit inciter les conducteurs à changer de voie sans marquer d\u0027arrêt. Les cônes de Lubeck doivent être espacés de façon régulière.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Chef d\u0027agrès","q":"Sur une route à chaussées séparées, combien de flèches lumineuses d\u0027urgence (FLU) peuvent être utilisées simultanément, tous services confondus ?","c":["Une seule","Deux au maximum","Trois au maximum","Une par engin engagé"],"r":1,"e":"Pour éviter un afflux d\u0027informations, le guide interdit d\u0027utiliser plus de deux FLU en simultané, gestionnaires de voirie et sapeurs-pompiers compris. La FLU peut remplacer ou compléter le biseau, uniquement sur les voies de circulation des routes à chaussées séparées.","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 114","p":"Afin d\u0027éviter un afflux d\u0027informations, il est interdit d\u0027utiliser plus de 2 FLU en simultanée (gestionnaires de voiries et sapeurs-pompiers compris).","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Chef d\u0027agrès","q":"Dans le zonage opérationnel d\u0027une intervention routière, où se situe en général la zone de stationnement des engins ?","c":["Avant la zone tampon, dans la zone d\u0027approche, engins alignés sur l\u0027accotement","Dans la zone tampon, entre le biseau et la zone de travail, en file indienne","Après la zone de travail, en file indienne et dans le sens de la circulation","Sur la voie de sens opposé, face à la zone de travail, engins en épi"],"r":2,"e":"La zone de stationnement, située après la zone de travail, permet de positionner tous les véhicules liés à l\u0027intervention, en général en file indienne et dans le sens de la circulation. C\u0027est la seule zone susceptible de s\u0027agrandir fortement. L\u0027ordre des zones peut toutefois être modifié selon la typologie de l\u0027intervention (écoulement de produit, fumées…).","ref":"§ 1.2 La matérialisation de la zone d\u0027intervention (chap. 3) — p. 115","p":"la zone de stationnement : Située après la zone de travail, elle permet de positionner tous les véhicules liés à l\u0027intervention. […] Le stationnement des véhicules se fait, en général, en file indienne et dans le sens de la circulation.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Protection et signalisation","niv":"Équipier","q":"En fin d\u0027intervention, comment le matériel de signalisation est-il retiré ?","c":["Dans le même ordre que sa pose, en commençant par le biseau","Par le premier équipier disponible, en marchant dos à la circulation","Uniquement par les forces de l\u0027ordre, après le départ des engins","Dans le sens inverse de sa pose, si possible protégé par un véhicule"],"r":3,"e":"Le retrait du matériel de signalisation se fait dans le sens inverse de sa pose et, dans la mesure du possible, sous la protection d\u0027un véhicule, en respectant le code de la route. Le départ des lieux est coordonné avec les différents services ; une fois l\u0027opération terminée, le code de la route s\u0027applique sans dérogation.","ref":"§ 1.3 Le désengagement des moyens (chap. 3) — p. 116","p":"Le retrait du matériel de signalisation se fait dans le sens inverse de sa pose et dans la mesure du possible, sous la protection d\u0027un véhicule tout en respectant le code de la route.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Équipier","q":"Lors de la découpe des vitrages pendant une désincarcération, quelle protection respiratoire le guide préconise-t-il ?","c":["Un appareil respiratoire isolant pour les seuls sauveteurs","Aucune, la découpe du verre ne produisant pas de poussières","Un masque a minima FFP2 pour les sauveteurs et les victimes","Un masque chirurgical, pour la victime uniquement, sous la bâche"],"r":2,"e":"Le guide préconise un masque a minima FFP2, pour les sauveteurs comme pour les victimes, lors de la découpe des vitrages et des matériaux pouvant produire des poussières. Les EPI doivent par ailleurs protéger des matériaux coupants ou tranchants tout en assurant la plus grande dextérité possible.","ref":"§ 3 Les opérations de désincarcération (chap. 3) — p. 117","p":"L\u0027utilisation d\u0027un masque, a minima FFP2, est préconisée pour les sauveteurs et les victimes lors de la découpe des vitrages et des matériaux pouvant produire des poussières lors de leur découpe.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès : un véhicule accidenté repose sur le toit dans un talus et risque de glisser. Quelle condition doit être remplie avant d\u0027engager du personnel à l\u0027intérieur ?","c":["Le véhicule doit avoir été remis sur ses roues au treuil","Le médecin doit avoir donné son accord à l\u0027engagement","Les vitres doivent avoir été brisées pour aérer l\u0027habitacle","Le véhicule doit être stabilisé ou arrimé totalement"],"r":3,"e":"Un véhicule pouvant glisser, basculer ou se déplacer (pente, relief) doit obligatoirement être arrimé sur un point fixe très résistant (arbre, poteau, engin calé ; lampadaires à proscrire). Aucun personnel n\u0027est engagé à l\u0027intérieur d\u0027un véhicule instable tant qu\u0027il n\u0027est pas stabilisé ou arrimé totalement.","ref":"§ 3.1 L\u0027arrimage (chap. 3) — p. 118","p":"Aucun engagement de personnel à l\u0027intérieur d\u0027un véhicule instable ne doit être réalisé tant qu\u0027il n\u0027est pas stabilisé ou arrimé totalement.","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027équipe","q":"Un véhicule risque de glisser dans un talus et doit être arrimé. Quel point fixe le guide demande-t-il de proscrire ?","c":["Un lampadaire","Un arbre","Un poteau","Un engin de secours calé"],"r":0,"e":"L\u0027arrimage doit se faire sur un point fixe très résistant comme un arbre ou un poteau ; un engin peut servir de point fixe à condition d\u0027être calé. Les lampadaires sont à proscrire car ils présentent une faible résistance.","ref":"§ 3.1 L\u0027arrimage (chap. 3) — p. 118","p":"L\u0027arrimage doit être sur un point fixe très résistant comme un arbre ou un poteau. Les lampadaires sont à proscrire car ils présentent une faible résistance","s":"gdo-sr"},
{"t":"gdo-sr","ch":"Sécurité en désincarcération","niv":"Chef d\u0027équipe","q":"Que recouvre la stabilisation d\u0027un véhicule accidenté ?","c":["Le maintien de la liaison au sol et la neutralisation des déséquilibres","La remise du véhicule sur ses roues avant toute action auprès de la victime","Le levage du véhicule pour dégager l\u0027accès à la batterie et au moteur","Le déplacement du véhicule hors des voies ouvertes à la circulation"],"r":0,"e":"La stabilisation intègre le maintien de la liaison du véhicule au sol et la neutralisation des déséquilibres potentiels, latéraux et avant/arrière. Elle est complétée et surveillée tout au long de l\u0027intervention. Certaines manœuvres de calage doivent tenir compte des sources d\u0027énergie (réservoirs de gaz, batteries HT).","ref":"§ 3.2 La stabilisation (chap. 3) — p. 118","p":"La stabilisation d\u0027un véhicule intègre le maintien de la liaison du véhicule au sol et la neutralisation des déséquilibres potentiels (latéraux et avant/arrière). Elle est complétée et surveillée tout au long de l\u0027intervention.","s":"gdo-sr"},
