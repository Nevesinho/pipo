{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Équipier","q":"Une bouteille de gaz comprimé chute et son robinet se rompt. Quel comportement de la bouteille le guide cite-t-il parmi les risques ?","c":["Une décomposition explosive spontanée du gaz qu\u0027elle contient","Une propulsion « fusée » par le jet de gaz à haute pression","Un givrage instantané du robinet qui bloque toute sortie de gaz","Une obturation automatique par le clapet de fond de la bouteille"],"r":1,"e":"Les pressions élevées des bouteilles de gaz comprimé sont un risque en soi : un choc, surtout sur le robinet, peut entraîner une fuite, un éclatement, la projection du détendeur ou un comportement de type « fusée », la bouteille étant propulsée par le jet de gaz après rupture du robinet.","ref":"§ 5.2 Les bouteilles de gaz comprimés (chap. 2) — p. 88","p":"un comportement de type « fusée » de la bouteille qui va être propulsée par jet de gaz à haute pression suite à la rupture du robinet","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Équipier","q":"Pourquoi une bouteille d\u0027oxygène doit-elle être manipulée sans aucune trace de corps gras ?","c":["Les corps gras peuvent provoquer l\u0027inflammation interne du détendeur","Les corps gras se mêlent à l\u0027oxygène et le rendent toxique","Les corps gras obstruent le détendeur et coupent le débit d\u0027oxygène","Les corps gras attaquent le métal de l\u0027ogive et causent des fuites"],"r":0,"e":"L\u0027ouverture rapide ou répétée du robinet échauffe le détendeur rempli d\u0027oxygène par compression adiabatique : c\u0027est le « coup de feu ». Graisse, huile ou mains sales jouent le rôle de combustible et peuvent provoquer l\u0027inflammation interne du détendeur, avec projection de flammes, voire de métal fondu.","ref":"§ 5.2 Les bouteilles de gaz comprimés (chap. 2) — p. 89","p":"Les contaminants (traces de graisse, huile, poussières, particules, joints non compatibles avec l\u0027oxygène, mains sales des utilisateurs, etc.) jouent le rôle de combustibles. Toutes les conditions sont réunies pour avoir une inflammation interne du détendeur","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Équipier","q":"Au-delà de quelle température une bouteille d\u0027acétylène est-elle exposée à la décomposition spontanée de son contenu ?","c":["65 °C","110 °C","350 °C","500 °C"],"r":0,"e":"L\u0027acétylène est instable et peut se décomposer spontanément de façon explosive. Cette décomposition intervient dès qu\u0027une bouteille d\u0027acétylène est soumise à une température supérieure à 65 °C ; elle peut aussi survenir si la bouteille est utilisée ou vidangée en position couchée.","ref":"§ 5.3 Les bouteilles d\u0027acétylène (chap. 2) — p. 89","p":"La décomposition spontanée de l\u0027acétylène intervient dès lors qu\u0027une bouteille d\u0027acétylène est soumise à une température supérieure à 65 °C.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Chef d\u0027équipe","q":"Une bouteille d\u0027acétylène froide a chuté sur un chantier. Selon le guide, quelle conséquence ce choc peut-il entraîner ?","c":["Une décomposition explosive immédiate de l\u0027acétylène","Une fuite au robinet ou par enfoncement de la bouteille","Une décomposition retardée dès la remise en position debout","Aucun risque, l\u0027acétylène étant dissous dans un solvant"],"r":1,"e":"Selon le guide, les chocs n\u0027entraînent pas de décomposition de l\u0027acétylène, mais peuvent créer des fuites, soit au robinet, soit à la bouteille elle-même par enfoncement. La décomposition est en revanche favorisée par la chaleur ou par une utilisation ou une vidange en position couchée.","ref":"§ 5.3 Les bouteilles d\u0027acétylène (chap. 2) — p. 89","p":"Ces chocs n\u0027entraînent pas de décomposition de l\u0027acétylène, mais peuvent créer des fuites soit au robinet soit à la bouteille elle-même (enfoncement).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Explosion, BLEVE et bouteilles","niv":"Équipier","q":"Quelle particularité de la flamme d\u0027hydrogène rend une fuite enflammée particulièrement dangereuse pour les intervenants ?","c":["Elle est rouge et fumigène, ce qui masque la fuite","Elle rayonne fortement et propage vite l\u0027incendie","Elle est peu chaude, autour de 500 °C seulement","Elle est incolore, donc quasiment invisible"],"r":3,"e":"La flamme d\u0027hydrogène, qui avoisine les 2 000 °C, est incolore et donc quasiment invisible. Son faible rayonnement limite en revanche fortement le risque de propagation de l\u0027incendie par rayonnement thermique.","ref":"§ 5.4 L\u0027hydrogène (chap. 2) — p. 90","p":"La température de la flamme résultant de la combustion de l\u0027hydrogène dans l\u0027air avoisine les 2 000 °C. Cette flamme est incolore ce qui la rend quasiment invisible.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Risques pour les personnes","niv":"Équipier","q":"Chez une victime d\u0027explosion, comment qualifie-t-on les lésions directement causées par l\u0027onde de choc (tympan, poumons, tube digestif) ?","c":["Lésions primaires","Lésions secondaires","Lésions tertiaires","Lésions quaternaires"],"r":0,"e":"Les lésions primaires sont liées à l\u0027onde de choc (organes creux et pleins). Les secondaires sont projectilaires (criblage), les tertiaires consécutives à la projection de la victime, les quaternaires dues aux brûlures, à l\u0027inhalation ou à l\u0027effondrement d\u0027un bâtiment.","ref":"§ 6.1 Les explosions (chap. 2) — p. 90","p":"les lésions primaires sont liées à l\u0027onde de choc","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Risques pour les personnes","niv":"Équipier","q":"En dessous de quelle teneur en oxygène de l\u0027atmosphère est-il interdit de travailler sans porter d\u0027appareil respiratoire isolant ?","c":["12 %","16 %","19 %","21 %"],"r":2,"e":"Le guide interdit de travailler dans une atmosphère à moins de 19 % d\u0027oxygène sans appareil respiratoire isolant. Les premiers signes d\u0027hypoxie apparaissent dès que la teneur en oxygène est inférieure à 18 %, et des pertes de connaissance pouvant conduire à la mort sont observées au-dessous de 8 %.","ref":"§ 6.4 Les atteintes respiratoires (chap. 2) — p. 93","p":"Il est interdit de travailler dans une atmosphère à moins de 19 % d\u0027oxygène sans porter un appareil respiratoire isolant.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Risques pour les personnes","niv":"Équipier","q":"Comment le monoxyde de carbone inhalé provoque-t-il un manque d\u0027oxygène dans l\u0027organisme ?","c":["En détruisant les voies aériennes, comme un gaz corrosif","En se fixant sur l\u0027hémoglobine à la place de l\u0027oxygène","En irritant fortement les bronches jusqu\u0027au spasme","En chassant l\u0027oxygène de l\u0027air de la pièce, comme un gaz inerte"],"r":1,"e":"Le CO pénètre par les voies respiratoires et se fixe rapidement sur l\u0027hémoglobine du sang (carboxyhémoglobine), pour laquelle il a 230 fois plus d\u0027affinité que l\u0027oxygène : il en résulte un manque d\u0027oxygène, d\u0027où le risque d\u0027une mort rapide. Il n\u0027est par ailleurs pas irritant.","ref":"§ 6.5.2 Le monoxyde de carbone (chap. 2) — p. 93","p":"il se fixe rapidement sur l\u0027hémoglobine du sang (carboxyhémoglobine ou HbCO) provoquant alors un manque d\u0027oxygène, d\u0027où le risque d\u0027une mort rapide.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Risques pour les personnes","niv":"Équipier","q":"Le CO testeur utilisé par les primo-intervenants mesure le taux de monoxyde de carbone :","c":["fixé sur l\u0027hémoglobine du sang de la victime","présent dans l\u0027air ambiant du logement","présent dans les fumées de la chaudière","présent dans l\u0027air expiré par la victime"],"r":3,"e":"Le guide distingue le taux d\u0027HbCO, mesuré par analyse sanguine ou CO-oxygénomètre de pouls, du taux mesuré par les primo-intervenants avec un CO testeur, qui porte sur le CO présent dans l\u0027air expiré. Les deux valeurs ne doivent pas être confondues.","ref":"§ 6.5.2 Le monoxyde de carbone (chap. 2) — p. 94","p":"Il ne doit pas être confondu avec le taux mesuré par les primo — intervenants à l\u0027aide d\u0027un CO testeur qui mesure le taux de CO présent dans l\u0027air expirée.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Risques pour les personnes","niv":"Chef d\u0027équipe","q":"Votre binôme doit pénétrer dans un réseau d\u0027assainissement visitable et le détecteur atteint un seuil d\u0027alerte. Qu\u0027impose le guide ?","c":["Le port d\u0027un masque à cartouche filtrante","Le port de l\u0027ARI capelé pour y pénétrer","Une ventilation, puis l\u0027entrée sans ARI","L\u0027entrée d\u0027un équipier encordé, sans ARI"],"r":1,"e":"L\u0027accès à un réseau d\u0027assainissement visitable se fait muni d\u0027un détecteur d\u0027H2S et d\u0027un détecteur de CH4. Dès qu\u0027un seuil d\u0027alerte est atteint, le port de l\u0027ARI capelé est obligatoire si les secours doivent pénétrer.","ref":"§ 6.5.3 L\u0027hydrogène sulfuré (chap. 2) — p. 96","p":"Dès qu\u0027un seuil d\u0027alerte est atteint le port de l\u0027ARI capelé est obligatoire si les secours doivent pénétrer.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, engagé pour une fuite de gaz en ville. Comment choisissez-vous l\u0027itinéraire d\u0027approche ?","c":["Par l\u0027axe le plus direct, même s\u0027il passe devant l\u0027adresse","Par un axe passant devant l\u0027adresse pour la reconnaître","Par un axe qui n\u0027oblige pas à passer devant l\u0027adresse","Par l\u0027axe qui permet de stationner face au bâtiment"],"r":2,"e":"Parmi les règles générales, le guide demande de veiller à ne pas arriver par un axe obligeant les secours à passer devant l\u0027adresse de l\u0027opération.","ref":"§ 1 Les règles générales (chap. 3) — p. 98","p":"Veiller à ne pas arriver par un axe obligeant les secours à passer devant l\u0027adresse de l\u0027opération.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, engagé pour une fuite de gaz. Où faites-vous stationner l\u0027engin ?","c":["Au droit de l\u0027adresse, pour faciliter les établissements","En amont de l\u0027adresse dans le sens de circulation, à distance","Au-delà de l\u0027adresse, après être passé devant pour la reconnaître","Au plus près de la fuite, pour protéger les intervenants"],"r":1,"e":"Les engins stationnent en amont de l\u0027adresse dans le sens de circulation, à une distance suffisante de l\u0027opération. L\u0027itinéraire d\u0027approche doit éviter un axe obligeant les secours à passer devant l\u0027adresse.","ref":"§ 1 Les règles générales (chap. 3) — p. 98","p":"Stationner les engins en amont de l\u0027adresse dans le sens de circulation et à une distance suffisante de l\u0027opération.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Sur une opération en présence de gaz, où le chef d\u0027agrès positionne-t-il le binôme de sécurité ?","c":["Dans la zone d\u0027exclusion, au contact du binôme engagé","Au pied de la façade concernée, pour évacuer les occupants","Avec le binôme de reconnaissance, pour doubler les relevés","Hors de la zone d\u0027exclusion, protégé et prêt à intervenir"],"r":3,"e":"Le binôme de sécurité est constitué en dehors de la zone d\u0027exclusion et protégé, en mesure d\u0027intervenir sans délai et de passer un message en cas d\u0027explosion. Son matériel reste à l\u0027engin, prêt à l\u0027emploi (engin alimenté, dévidoirs descendus), et il dispose d\u0027un moyen de communication rapide et sûr vers le CO.","ref":"§ 1 Les règles générales (chap. 3) — p. 98","p":"Constituer un binôme de sécurité en dehors de la zone d\u0027exclusion et protégé, en mesure d\u0027intervenir sans délai et de passer un message en cas d\u0027explosion","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Équipier","q":"Selon le guide, qu\u0027est-ce qui permet d\u0027éviter les effets du blast d\u0027une explosion de gaz ?","c":["La distance et/ou un écran solide","Un véhicule de tourisme servant d\u0027abri","La tenue de feu complète, visière baissée","Un rideau d\u0027eau établi devant le bâtiment"],"r":0,"e":"Le guide est explicite : les seuls moyens d\u0027éviter les effets du blast sont la distance et/ou un écran solide. Un véhicule de tourisme ne protège pas des effets d\u0027une explosion ; le personnel engagé se place autant que possible derrière des murs capables de résister.","ref":"§ 1 Les règles générales (chap. 3) — p. 98","p":"les seuls moyens permettant d\u0027éviter les effets du BLAST sont la distance et/ou un écran solide","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Équipier","q":"Votre radio portative n\u0027est pas « ATEX » et vous n\u0027avez pas de sachet étanche spécialement conçu. Que faites-vous avant d\u0027entrer en zone d\u0027exclusion ?","c":["Je la garde allumée, volume réduit au minimum","Je la laisse hors de la zone d\u0027exclusion","Je n\u0027émets que par messages très brefs","Je la confie à l\u0027équipier qui me suit en zone"],"r":1,"e":"Les radios portatives qui ne sont pas « ATEX » ou placées dans des sachets étanches spécialement conçus sont laissées hors de la zone d\u0027exclusion. Il en va de même pour tous les appareils connectés (téléphones mobiles, bip, etc.).","ref":"§ 1 Les règles générales (chap. 3) — p. 98","p":"Laisser les radios portatives, si elles ne sont pas « ATEX » ou mises dans des sachets étanches spécialement conçus, hors de la zone d\u0027exclusion.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Équipier","q":"Fuite de gaz suspectée dans un immeuble : le binôme doit prévenir les occupants d\u0027un logement voisin. Comment procède-t-il ?","c":["Il sonne, la sonnette étant en très basse tension","Il appelle les occupants sur leur téléphone","Il utilise l\u0027interphone depuis le hall d\u0027entrée","Il frappe à la porte, sans actionner la sonnette"],"r":3,"e":"Les sapeurs-pompiers ne doivent jamais utiliser d\u0027appareils électriques, de sonnettes ou de gâchettes électriques de porte, sources d\u0027inflammation possibles ; téléphones mobiles et appareils connectés restent hors de la zone d\u0027exclusion. Le guide conseille de même aux particuliers de prévenir les voisins sans sonner, en frappant à la porte.","ref":"§ 1 Les règles générales (chap. 3) — p. 99","p":"Ne jamais utiliser d\u0027appareils électriques, sonnettes, gâchettes électriques de porte, etc.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès face à un risque d\u0027explosion dans un immeuble. À quelle distance minimale placer le personnel pour tenir compte d\u0027un effondrement ?","c":["La moitié de la hauteur du bâtiment","1,5 fois la hauteur du bâtiment","3 fois la hauteur du bâtiment","10 mètres, quelle que soit la hauteur"],"r":1,"e":"Se trouver à une distance au moins égale à 1,5 fois la hauteur du bâtiment permet de prendre en compte l\u0027effondrement de la structure. Contre le blast, les seuls moyens de protection sont la distance et/ou un écran solide : un véhicule de tourisme ne protège pas.","ref":"§ 1 Les règles générales (chap. 3) — p. 99","p":"se trouver à une distance au moins égale à 1,5 fois la hauteur du bâtiment permet de prendre en compte l\u0027effondrement de la structure.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Sécurité des intervenants","niv":"Chef d\u0027équipe","q":"Feu de terrasse lors de travaux d\u0027étanchéité, avec des bouteilles de gaz abandonnées dans le foyer. Comment le binôme chemine-t-il au pied du bâtiment ?","c":["Au milieu de la voie, à distance des façades","Sur le trottoir d\u0027en face, abrité derrière les véhicules","En recul, pour garder la terrasse en vue en permanence","En longeant les façades du bâtiment sinistré"],"r":3,"e":"Les bouteilles abandonnées dans le foyer peuvent exploser à tout moment et être projetées à plusieurs centaines de mètres. Le cheminement au pied des bâtiments se fait donc en longeant les façades, là où le risque est le plus faible ; un large périmètre de sécurité au sol est mis en place dès l\u0027engagement.","ref":"§ 5 La présence de bouteilles de gaz lors d\u0027un feu de terrasse (chap. 3) — p. 105","p":"Afin de prévenir toute atteinte, le cheminement au pied des bâtiments se fait en longeant les façades, là où le risque est le plus faible.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Équipier","q":"Comment un explosimètre exprime-t-il la concentration de gaz inflammable mesurée ?","c":["En pourcentage de gaz dans le volume d\u0027air ambiant","En pourcentage de la limite inférieure d\u0027explosivité","En parties par million (ppm) de gaz dans l\u0027air mesuré","En millibars de pression partielle du gaz détecté"],"r":1,"e":"Les explosimètres sont adaptés à des mesures de concentration comprises entre 0 et 100 % de la LIE, par rapport à un gaz de référence. Le catharomètre indique, lui, un pourcentage de gaz dans l\u0027air ambiant ; les mesures en ppm concernent notamment le monoxyde de carbone et l\u0027hydrogène sulfuré.","ref":"§ 2 Les détecteurs de gaz (chap. 3) — p. 99","p":"Ils sont adaptés pour des mesures de concentrations de gaz dans l\u0027air situées entre 0 et 100 % de la LIE par rapport à un gaz de référence.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Chef d\u0027équipe","q":"Sur une fuite, l\u0027agent du gestionnaire de réseau annonce une valeur relevée au catharomètre. Comment cette valeur est-elle exprimée ?","c":["En pourcentage de gaz dans l\u0027air ambiant","En pourcentage de la LIE du gaz de référence","En parties par million (ppm) de gaz","En millibars de pression dans la conduite"],"r":0,"e":"Le catharomètre indique la mesure en pourcentage de gaz dans l\u0027air ambiant, alors que l\u0027explosimètre l\u0027exprime en pourcentage de la LIE par rapport à un gaz de référence. Le type d\u0027appareil et le gaz de référence expliquent en partie les écarts entre les valeurs des professionnels du gaz et celles des sapeurs-pompiers.","ref":"§ 2 Les détecteurs de gaz (chap. 3) — p. 99","p":"Il s\u0027agit du catharomètre. Il indique la mesure en pourcentage de gaz dans l\u0027air ambiant mesuré.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Équipier","q":"Pourquoi le détecteur de gaz doit-il être allumé hors de toute présence de gaz, en zone de soutien ?","c":["Pour que son alarme n\u0027inquiète pas les occupants","Pour économiser sa batterie avant la reconnaissance","Pour que l\u0027étalonnage annuel soit pris en compte","Pour éviter une mise à zéro faussée par le gaz"],"r":3,"e":"La mise à zéro est souvent réalisée automatiquement à l\u0027allumage. Si le détecteur est mis en marche en présence d\u0027un gaz, son point de référence risque d\u0027être décalé : les mesures sont alors erronées et le risque sous-estimé. Les appareils sont d\u0027ailleurs allumés dès le trajet.","ref":"§ 2 Les détecteurs de gaz (chap. 3) — p. 100","p":"Si le détecteur est mis en marche en présence d\u0027un gaz, le point de référence risque d\u0027être décalé et les mesures erronées entraînant une sous-estimation du risque.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Chef d\u0027équipe","q":"Le binôme relève à l\u0027explosimètre des valeurs différentes selon les points de mesure d\u0027un local. Quelle valeur retient-il ?","c":["La valeur la plus élevée","La moyenne des valeurs","La valeur la plus basse","La valeur relevée au centre"],"r":0,"e":"Les relevés se font prioritairement en partie haute pour les gaz plus légers que l\u0027air et en partie basse pour les plus lourds, mais dans l\u0027ensemble du volume afin de lever tout doute sur une éventuelle poche. Si les valeurs diffèrent, il faut toujours considérer la plus élevée.","ref":"§ 2 Les détecteurs de gaz (chap. 3) — p. 100","p":"Les valeurs mesurées en plusieurs points pouvant être différentes, dans ce cas toujours considérer la valeur la plus élevée.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Chef d\u0027équipe","q":"Votre équipe hésite sur l\u0027organe de coupure à manœuvrer et aucun représentant de l\u0027exploitant n\u0027est présent. Que préconise le guide ?","c":["S\u0027abstenir de manœuvrer l\u0027organe de coupure","Fermer tous les organes accessibles par précaution","Manœuvrer l\u0027organe le plus proche de la fuite","Faire manœuvrer l\u0027organe par l\u0027occupant des lieux"],"r":0,"e":"Dans le doute et en l\u0027absence d\u0027un représentant de l\u0027exploitant, les sapeurs-pompiers s\u0027abstiennent de manœuvrer un organe de coupure. Ceux qu\u0027ils peuvent manœuvrer sont facilement accessibles (voie publique, façade, palier, garage, appartement) ; ils ne manœuvrent jamais un organe desservant un réseau.","ref":"§ 3 Les règles de coupure du gaz naturel (chap. 3) — p. 101","p":"Dans le doute et en l\u0027absence d\u0027un représentant de l\u0027exploitant, les sapeurs-pompiers s\u0027abstiendront de manœuvrer un organe de coupure.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Chef d\u0027équipe","q":"Le binôme vient de fermer l\u0027organe de coupure individuelle d\u0027un logement, en l\u0027absence du gestionnaire. Que fait-il ensuite pour cet organe ?","c":["Il le rouvre après aération pour contrôler l\u0027installation","Il le démonte pour empêcher toute réouverture","Il le laisse sans surveillance, la fermeture suffisant","Il reste à côté ou y appose un signal d\u0027interdiction"],"r":3,"e":"Dès qu\u0027un organe de coupure a été manœuvré, un représentant des sapeurs-pompiers reste à proximité ou, à défaut, un signal d\u0027interdiction de manœuvrer y est apposé, afin d\u0027éviter toute manœuvre intempestive.","ref":"§ 3.1 La manœuvre des organes de coupure (chap. 3) — p. 102","p":"Dès qu\u0027un organe de coupure aura été manœuvré, un représentant des sapeurs-pompiers restera à proximité ou, à défaut un signal d\u0027interdiction de manœuvrer sera apposé sur cet organe de coupure","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Équipier","q":"Une fois le gaz fermé par les sapeurs-pompiers sur un organe de coupure, qui peut procéder à sa réouverture ?","c":["Le chef d\u0027agrès, après un contrôle à l\u0027explosimètre","L\u0027occupant, après aération complète du logement","Le COS, à la fin de l\u0027opération de secours","Les seuls agents du gestionnaire de réseau"],"r":3,"e":"Aucune manœuvre de réouverture des organes de coupure ne doit être effectuée par les sapeurs-pompiers : cette opération est du seul ressort des agents du gestionnaire de réseau. Le guide le rappelle : ne jamais rouvrir le gaz une fois qu\u0027il a été fermé.","ref":"§ 3.1 La manœuvre des organes de coupure (chap. 3) — p. 103","p":"Aucune manœuvre de réouverture des organes de coupure ne doit être effectuée par les sapeurs-pompiers, cette opération étant du seul ressort des agents du gestionnaire de réseau.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Détecteurs et règles de coupure","niv":"Chef d\u0027agrès","q":"Le COS envisage de couper le courant électrique d\u0027un immeuble en présence de gaz. Quelle mesure doit impérativement précéder cette coupure ?","c":["La mise en place d\u0027une lance en protection à proximité du tableau électrique","L\u0027évacuation totale des habitants et des secours éventuellement engagés","Une ventilation mécanique des parties communes de l\u0027immeuble","La fermeture des portes et fenêtres de l\u0027ensemble de l\u0027immeuble"],"r":1,"e":"La décision de coupure du courant est impérativement précédée de l\u0027évacuation totale des immeubles de leurs habitants et des personnels de secours éventuellement engagés. La coupure, qui peut créer un arc, est réalisée le plus loin possible de la zone de risque.","ref":"§ 4 La coupure du courant en présence de gaz (chap. 3) — p. 104","p":"La décision de coupure de courant est impérativement précédée de l\u0027évacuation totale des immeubles de leurs habitants et des personnels de secours éventuellement engagés.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Équipier","q":"Qu\u0027appelle-t-on une fuite « fermée » sur la voie publique ?","c":["Une fuite sur un tronçon dont l\u0027organe de coupure a déjà été fermé","Une fuite située à l\u0027intérieur d\u0027un bâtiment dont toutes les ouvertures sont closes","Une fuite colmatée provisoirement en attendant sa réparation","Une fuite non visible dont une partie du gaz ne s\u0027échappe pas à l\u0027air libre"],"r":3,"e":"La fuite fermée est une fuite non visible dont une partie du gaz ne s\u0027échappe pas à l\u0027air libre. Sa diffusion n\u0027est pas maîtrisable : risque de cheminement (fourreaux, égouts, soupiraux) et d\u0027accumulation dans les espaces confinés proches. La fuite ouverte, elle, est visible et le gaz s\u0027échappe à l\u0027air libre.","ref":"§ 1.2.2 La fuite fermée (chap. 4) — p. 110","p":"La fuite fermée est une fuite non visible dont une partie du gaz ne s\u0027échappe pas à l\u0027air libre. Sa diffusion n\u0027est pas maitrisable, il y a risque de cheminement (fourreaux, égouts, soupiraux, etc.)","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Feu de coffret gaz en façade : le gaz brûle. Qu\u0027en est-il du risque d\u0027explosion ?","c":["Il n\u0027est pas exclu, une partie du gaz ne brûlant pas","Il est nul tant que la flamme reste bien visible","Il n\u0027apparaît qu\u0027à l\u0027ouverture du coffret par les secours","Il ne concerne que les coffrets alimentés en propane"],"r":0,"e":"En principe, il n\u0027y a pas de risque d\u0027explosion tant que le gaz brûle, mais ce risque ne doit pas être exclu : une partie du gaz ne brûle pas et peut s\u0027accumuler, par exemple sous l\u0027avancée d\u0027une toiture, ou pénétrer dans des locaux.","ref":"§ 1.3 Le feu de coffret en façade (chap. 4) — p. 111","p":"En principe, il n\u0027y a pas de risque d\u0027explosion tant que le gaz brûle, mais ce risque ne doit pas être exclu. En effet, il y a toujours une partie du gaz qui ne brûle pas","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Équipier","q":"Sur une installation de production de biométhane, comment détecter une fuite de méthane survenant avant l\u0027étape d\u0027odorisation ?","c":["Seulement avec un explosimètre ou un détecteur multigaz","À l\u0027odeur du THT, comme pour le gaz du réseau","Au sifflement de la fuite, toujours audible sur ces installations","À la caméra thermique, le gaz qui s\u0027échappe étant froid"],"r":0,"e":"Dans les installations producteur et les postes d\u0027injection, une fuite survenant avant l\u0027odorisation libère du méthane non odorisé : la seule façon de la détecter est d\u0027utiliser un explosimètre ou un détecteur multigaz. L\u0027odorisation repose sur l\u0027ajout de THT au biométhane.","ref":"§ 1.4 Les incidents sur les installations de biométhane (chap. 4) — p. 112","p":"il est possible d\u0027avoir des fuites de méthane non odorisé, si celle-ci ont lieu avant son odorisation. La seule façon de le détecter est d\u0027utiliser un explosimètre ou un détecteur multigaz.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Sur une unité de méthanisation, le binôme ne perçoit aucune odeur d\u0027œuf pourri. Que peut-il en conclure sur l\u0027hydrogène sulfuré (H2S) ?","c":["Il est absent, l\u0027odeur se percevant dès les traces","Il est absent, ce gaz ne se formant qu\u0027en égout","Il est absent si aucune alarme méthane ne sonne","Il peut être présent, l\u0027odorat saturant à forte dose"],"r":3,"e":"Si l\u0027H2S a une odeur caractéristique d\u0027œuf pourri à faible concentration, il devient indétectable par le nez humain à plus forte concentration, car il sature les récepteurs olfactifs. Produit par la fermentation, il peut être présent sur ces installations : il faut s\u0027y équiper systématiquement d\u0027un détecteur multigaz.","ref":"§ 1.4 Les incidents sur les installations de biométhane (chap. 4) — p. 113","p":"il est indétectable par le nez humain dans des concentrations plus élevées car il sature les récepteurs olfactifs","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"Quel est l\u0027objectif principal de la procédure gaz renforcée (PGR) ?","c":["Lancer la procédure de coupure du réseau dès l\u0027alerte","Couper le gaz de l\u0027ensemble de la commune concernée","Faire manœuvrer les vannes du réseau par le SIS","Attendre le gestionnaire avant tout engagement"],"r":0,"e":"L\u0027objectif principal de la PGR est de lancer la procédure de coupure du réseau dès l\u0027alerte. Elle prévoit un engagement de moyens, des sapeurs-pompiers comme de l\u0027opérateur de réseau, plus important que la procédure gaz classique. Une PGC peut être requalifiée en PGR par le COS.","ref":"§ 2.5 La procédure gaz renforcée (chap. 4) — p. 119","p":"L\u0027objectif principal de la PGR est de lancer la procédure de coupure du réseau dès l\u0027alerte.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"Dans quels cas la procédure gaz renforcée (PGR) est-elle mise en œuvre de manière systématique ?","c":["Odeur de gaz signalée par plusieurs appels dans un même quartier","Fuite dans un bâtiment et fuite ouverte sur la voie publique","Fuite fermée sur la voie publique et feu de coffret en façade","Fuite sur un réseau moyenne pression, qu\u0027elle soit enflammée ou non"],"r":2,"e":"La PGR est systématique pour une fuite « fermée » sur la voie publique, quelle que soit la pression du réseau, et pour une fuite enflammée sur coffret en façade. Une fuite ouverte ou dans un bâtiment ne relève de la PGR qu\u0027à la demande expresse du centre opérationnel du SIS ou de l\u0027opérateur, ou à la demande du COS.","ref":"§ 2.5 La procédure gaz renforcée (chap. 4) — p. 120","p":"La procédure gaz renforcée est mise en œuvre de manière systématique pour : fuite « fermée » sur la voie publique et ce quelle que soit la pression du réseau ; fuite de gaz enflammée sur coffret situé en façade","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"En procédure gaz renforcée, que fait mettre en place le COS, en plus du contact avec le représentant de l\u0027opérateur ?","c":["La fermeture des vannes du réseau par ses équipes","Une réparation provisoire de la canalisation","Le désengagement dès l\u0027arrivée de l\u0027opérateur","Un périmètre de sécurité et un réseau de mesures"],"r":3,"e":"Le COS fait mettre en place un périmètre de sécurité et un réseau de mesures (explosimètres du SIS et/ou catharomètres de l\u0027opérateur) permettant de confirmer ou d\u0027infirmer le zonage et de surveiller en permanence l\u0027évolution de la situation. La stratégie pour réduire et supprimer la fuite relève de l\u0027opérateur, en concertation avec le COS.","ref":"§ 2.5 La procédure gaz renforcée (chap. 4) — p. 122","p":"Le commandant des opérations de secours fait mettre en place : un périmètre de sécurité ; un réseau de mesures à l\u0027aide des explosimètres du SIS et/ou des catharomètres de l\u0027opérateur du réseau de gaz.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"En PGR, la fuite a été rapidement stoppée par une action sur un organe de sécurité gaz. Quelle information le COS transmet-il au CO et à l\u0027opérateur gazier ?","c":["« Fuite colmatée — Demande de réouverture »","« Fin de PGR — Risque maîtrisé »","« Feu éteint — Fin d\u0027intervention »","« Situation stabilisée — Renforts maintenus »"],"r":1,"e":"Lorsque la situation et le risque ont été rapidement maîtrisés par une action adaptée sur un organe de sécurité gaz, le COS transmet au centre opérationnel et à l\u0027opérateur gazier l\u0027information « Fin de PGR — Risque maîtrisé ». Les renforts de l\u0027opérateur sont alors susceptibles de ne pas se déplacer.","ref":"§ 2.5 La procédure gaz renforcée (chap. 4) — p. 123","p":"la situation et le risque ont été rapidement maîtrisés par une action adaptée sur un organe de sécurité gaz, le COS transmettra au centre opérationnel et à l\u0027opérateur gazier l\u0027information : « Fin de PGR — Risque maîtrisé","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Malaise d\u0027une personne dans un logement en hiver. Quel indice doit faire penser à une intoxication au monoxyde de carbone ?","c":["Un chauffage en marche et de la buée sur les vitres","Une odeur d\u0027œuf pourri persistante dans la pièce","Une odeur d\u0027ail perçue près de la cuisinière","Une forte odeur de gaz perçue dans la cuisine"],"r":0,"e":"L\u0027utilisation de moteurs thermiques en intérieur ou d\u0027un chauffage (gaz, bois, fioul…) avec de la buée sur les vitres peut faire penser à une intoxication au CO, gaz incolore et inodore. L\u0027odeur d\u0027œuf pourri oriente vers l\u0027hydrogène sulfuré, l\u0027odeur d\u0027ail vers l\u0027acétylène.","ref":"§ 4.2.3 L\u0027intervention concerne une intoxication (chap. 4) — p. 127","p":"l\u0027utilisation de moteurs thermiques en intérieur ou d\u0027un chauffage (gaz, bois, fuel, etc.) avec de la buée sur les vitres peut faire penser à une intoxication au monoxyde de carbone.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Intoxication au CO suspectée dans un logement : quels conseils peuvent être donnés aux occupants pour les soustraire rapidement au gaz ?","c":["Fermer les fenêtres et s\u0027allonger sur place","Rallumer la chaudière pour observer sa flamme","Attendre sur place l\u0027arrivée des secours","Couper l\u0027appareil, évacuer et aérer les locaux"],"r":3,"e":"L\u0027opérateur du CTA peut conseiller de stopper les émanations en coupant si possible les appareils à combustion (chaudière, moteur thermique…), d\u0027évacuer et de faire évacuer rapidement les locaux en sortant à l\u0027extérieur, puis d\u0027aérer si possible en ouvrant les fenêtres.","ref":"§ 4.3.3 L\u0027intoxication par un gaz (chap. 4) — p. 128","p":"de stopper les émanations en coupant les appareils à combustion si cela est possible (…) ; d\u0027évacuer et de faire évacuer rapidement les locaux et sortir à l\u0027extérieur ; d\u0027aérer si possible les locaux en ouvrant les fenêtres","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et COS sur une fuite de gaz. Le binôme signale des valeurs croissantes à l\u0027explosimètre en limite de zone d\u0027exclusion. Que faites-vous ?","c":["Vous maintenez votre idée de manœuvre initiale","Vous réduisez la zone d\u0027exclusion","Vous reconsidérez votre idée de manœuvre","Vous confiez les opérations à l\u0027opérateur"],"r":2,"e":"Tout élément nouveau important doit amener le COS à reconsidérer son idée de manœuvre. Le réseau de mesures, dont les relevés sont faits régulièrement dans la zone d\u0027exclusion et en limite de celle-ci, sert justement à confirmer ou infirmer le zonage et à surveiller l\u0027évolution de la situation.","ref":"§ Chap. 5 La conduite des opérations (introduction) — p. 132","p":"Tout élément nouveau important doit amener le COS à reconsidérer son idée de manœuvre.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Équipier","q":"Quelles sont les trois zones du zonage opérationnel et leurs couleurs ?","c":["Contrôlée (rouge), d\u0027exclusion (orange), de soutien (verte)","D\u0027exclusion (orange), de soutien (rouge), contrôlée (verte)","De soutien (rouge), contrôlée (orange), d\u0027exclusion (verte)","D\u0027exclusion (rouge), contrôlée (orange), de soutien (verte)"],"r":3,"e":"Le zonage opérationnel respecte toujours le principe des trois zones : zone d\u0027exclusion dite rouge, zone contrôlée dite orange, zone de soutien dite verte. Les limites extérieures de la zone de soutien constituent le périmètre de sécurité.","ref":"§ 1.1 Principes généraux du zonage opérationnel (chap. 5) — p. 132","p":"une zone d\u0027exclusion dite rouge ; une zone contrôlée dite orange ; une zone de soutien dite verte.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Dans le zonage opérationnel, quelles zones sont placées sous le contrôle des forces de l\u0027ordre ?","c":["La zone d\u0027exclusion, à la place des sapeurs-pompiers","Toutes les zones, y compris la zone d\u0027exclusion","Les zones qui ne nécessitent pas le port d\u0027EPI","Aucune, le zonage relevant des seuls sapeurs-pompiers"],"r":2,"e":"Les zones qui ne nécessitent pas le port d\u0027EPI sont placées sous le contrôle des forces de l\u0027ordre. Lors d\u0027une PGR, le CTA alerte d\u0027ailleurs la police ou la gendarmerie selon le secteur de compétence.","ref":"§ 1.1 Principes généraux du zonage opérationnel (chap. 5) — p. 133","p":"Les zones qui ne nécessitent pas le port d\u0027EPI sont placées sous le contrôle des forces de l\u0027ordre.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Fuite sur une canalisation classique du réseau de distribution de gaz naturel : quels rayons de zones d\u0027exclusion et contrôlée le COS met-il en œuvre par défaut ?","c":["25 m et 50 m","50 m et 100 m","110 m et 180 m","200 m et 300 m"],"r":1,"e":"Pour un incident sur le réseau de distribution de gaz naturel, les procédures partagées SIS/GRDF préconisent par défaut une zone d\u0027exclusion d\u0027environ 50 m et une zone contrôlée d\u0027environ 100 m à partir de l\u0027origine du risque. Ces rayons sont portés à 110 m et 180 m pour une canalisation à périmètre de sécurité étendu.","ref":"§ 1.2 Le zonage opérationnel spécifique aux gaz (chap. 5) — p. 134","p":"la zone d\u0027exclusion, rayon d\u0027environ 50 mètres à partir de l\u0027origine du risque ; la zone contrôlée, rayon d\u0027environ 100 mètres à partir de l\u0027origine du risque.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Fuite de gaz : quelle mesure prédomine pour le public situé dans la zone d\u0027exclusion ?","c":["Le confinement dans les logements","Le maintien sur place, fenêtres ouvertes","L\u0027évacuation hors de la zone d\u0027exclusion","Le regroupement au pied du bâtiment concerné"],"r":2,"e":"Dans le cas d\u0027une fuite de gaz, l\u0027évacuation du public situé dans la zone d\u0027exclusion prédomine, car les conséquences pour les personnes peuvent être très importantes. Le choix entre confiner et évacuer reste guidé par la balance bénéfices/risques : temps d\u0027évacuation, exposition des personnes, effectifs à mobiliser, type et importance de la fuite.","ref":"§ 1.2 Le zonage opérationnel spécifique aux gaz (chap. 5) — p. 135","p":"Dans le cas d\u0027une fuite de gaz, l\u0027évacuation du public situé dans la zone d\u0027exclusion prédomine.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Fuite de gaz non enflammée : où le chef d\u0027agrès maintient-il les moyens hydrauliques établis par anticipation ?","c":["Au plus près de la fuite, pour diluer le nuage de gaz","À l\u0027abri d\u0027une explosion, en limite de zone d\u0027exclusion","Face aux ouvrants du bâtiment, prêts à l\u0027attaque","Au cœur de la zone d\u0027exclusion, lances en batterie"],"r":1,"e":"Pour anticiper une évolution de la situation, des moyens hydrauliques adaptés sont établis et maintenus à l\u0027abri des effets d\u0027une explosion afin de pouvoir réagir, si possible à la limite de la zone d\u0027exclusion. Le personnel en attente d\u0027engagement ne doit pas se trouver devant les ouvrants.","ref":"§ 2.1 L\u0027analyse de la situation (chap. 5) — p. 137","p":"Ces moyens sont maintenus à l\u0027abri des effets d\u0027une explosion afin de pouvoir réagir (dans la mesure du possible à la limite de la zone d\u0027exclusion).","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"La fuite de gaz dans un logement vient d\u0027être arrêtée. Que faut-il encore faire pour supprimer le risque d\u0027explosion ?","c":["Ventiler les locaux concernés jusqu\u0027à disparition du danger","Rouvrir le gaz pour contrôler l\u0027étanchéité de l\u0027installation","Remettre l\u0027électricité pour faire fonctionner la VMC","Laisser les locaux fermés une heure avant de les contrôler"],"r":0,"e":"L\u0027arrêt de la fuite ne suffit pas à supprimer le risque d\u0027explosion : il faut ventiler tous les locaux et bâtiments concernés jusqu\u0027à disparition complète du danger. La ventilation naturelle (ouverture des portes et fenêtres) est à rechercher dans la majorité des cas.","ref":"§ 2.3 La maîtrise de la situation (chap. 5) — p. 139","p":"L\u0027arrêt de la fuite de gaz ne suffit pas à supprimer le risque d\u0027explosion. Pour cela il est nécessaire de ventiler tous les locaux et bâtiments concernés jusqu\u0027à disparition complète du danger.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Fuite de gaz dans un logement : la fuite est arrêtée et les occupants ne sentent plus d\u0027odeur. Que faut-il faire avant de clore l\u0027intervention ?","c":["Aucune mesure, l\u0027absence d\u0027odeur confirmant la fin du risque","Une réouverture du gaz pour vérifier l\u0027étanchéité","Un dernier relevé près de la source et dans les cheminements","Un relevé unique au centre du logement, à hauteur d\u0027homme"],"r":2,"e":"L\u0027arrêt de la fuite ne suffit pas à supprimer le risque d\u0027explosion. Avant de clore, il est impératif de réaliser un dernier relevé de mesures près de la source de la fuite et dans les cheminements confinés qu\u0027aurait pu emprunter le gaz. Les sapeurs-pompiers ne rouvrent jamais le gaz une fois fermé.","ref":"§ 2.3 La maîtrise de la situation (chap. 5) — p. 139","p":"il est impératif de réaliser un dernier relevé de mesures près de la source de la fuite mais également dans les différents cheminements confinés qu\u0027aurait pu emprunter le gaz.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Pourquoi les mesures d\u0027explosimétrie doivent-elles être renouvelées régulièrement pendant l\u0027intervention ?","c":["Parce que l\u0027équilibre aéraulique instable fait varier les concentrations","Parce que l\u0027appareil s\u0027arrête seul après quelques minutes de fonctionnement","Parce que chaque relevé doit être noté pour justifier la durée","Parce que les équipiers doivent s\u0027entraîner à lire l\u0027appareil"],"r":0,"e":"L\u0027équilibre aéraulique peut être modifié volontairement (ventilation) ou involontairement (ouverture de porte, déplacement de personnes) : la concentration en gaz peut alors passer rapidement d\u0027une atmosphère non explosive à une atmosphère explosive. Des contrôles doivent donc être régulièrement effectués.","ref":"§ 2.3 La maîtrise de la situation (chap. 5) — p. 139","p":"Il faut garder à l\u0027esprit que l\u0027équilibre aéraulique est instable. La concentration en gaz peut rapidement changer et passer ainsi d\u0027une atmosphère non explosive à une atmosphère explosive.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Un local clos est saturé en gaz, au-delà de la LSE. Que va provoquer sa ventilation ?","c":["Une sortie immédiate du risque d\u0027explosion","Une concentration stable, le gaz étant en excès","Un passage du mélange par la plage d\u0027explosivité","Une dilution sans risque, le mélange restant trop riche"],"r":2,"e":"Lorsque l\u0027atmosphère initiale est non explosive car saturée en gaz (au-delà de la LSE), la ventilation fait systématiquement repasser le mélange par la plage d\u0027explosivité. L\u0027équilibre aéraulique étant instable, des contrôles réguliers doivent être effectués.","ref":"§ 2.3 La maîtrise de la situation (chap. 5) — p. 139","p":"Lorsque l\u0027atmosphère initiale est non explosive car saturée en gaz (au-delà de la LSE), la ventilation fera systématiquement repasser le mélange gazeux par la plage d\u0027explosibilité.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027agrès","q":"Vous êtes COS sur un feu dans un local alimenté en gaz. Tant que l\u0027alimentation n\u0027est pas barrée, à quoi limitez-vous votre action ?","c":["À la protection de l\u0027environnement contre l\u0027extension","À l\u0027attaque massive du foyer depuis l\u0027intérieur du local","À la ventilation du local par pression positive","À l\u0027extinction de la fuite enflammée au jet diffusé"],"r":0,"e":"Lorsque l\u0027incendie concerne un local alimenté en gaz, le COS cherche à barrer l\u0027alimentation et, en attendant, limite son action à la protection de l\u0027environnement pour éviter toute extension. Si le barrage est impossible, il n\u0027engage son personnel que s\u0027il existe un risque pour les personnes.","ref":"§ 3 La présence de gaz lors d\u0027un incendie (chap. 5) — p. 140","p":"Lorsque l\u0027incendie concerne un local alimenté en gaz, le COS doit chercher à barrer l\u0027alimentation en gaz. En attendant, il doit limiter son action à la protection de l\u0027environnement, afin d\u0027éviter toute extension du sinistre.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Équipier","q":"Sauf absolue nécessité, pourquoi une fuite de gaz enflammée n\u0027est-elle éteinte que par barrage de la conduite ?","c":["Pour ne pas endommager la canalisation avec l\u0027eau","Pour ne pas faire monter la pression du réseau","Pour ne pas recréer de risque d\u0027explosion","Pour que la flamme protège la canalisation"],"r":2,"e":"Sauf absolue nécessité, la fuite enflammée ne doit être éteinte que par barrage de la conduite ou fermeture de la bouteille, quand c\u0027est possible, afin de ne pas recréer de risque d\u0027explosion. Il faut donc prendre garde à ne pas souffler la flamme en manœuvrant les moyens d\u0027extinction.","ref":"§ 3 La présence de gaz lors d\u0027un incendie (chap. 5) — p. 140","p":"Sauf en cas d\u0027absolue nécessité, la fuite enflammée ne doit être éteinte que par barrage de la conduite ou fermeture de la bouteille, quand cela est possible, afin de ne pas recréer de risque d\u0027explosion.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027agrès","q":"Fuite enflammée sur le réseau de distribution : l\u0027extinction avant l\u0027arrêt de la fuite est envisagée. Qui prend cette décision ?","c":["Le chef d\u0027agrès seul, dès qu\u0027un bâtiment est menacé","Le représentant de l\u0027exploitant seul, sans avis du COS","Le CODIS, sur proposition du maire de la commune","Le COS, en concertation avec l\u0027exploitant sur place"],"r":3,"e":"Ces cas doivent rester très exceptionnels : la décision est prise en concertation entre le COS et le représentant de l\u0027exploitant sur place. Quatre facteurs sont pris en compte : urgence absolue, barrage impossible ou trop long, neutralisation possible au niveau de la fuite, absence de matière en ignition susceptible de rallumer le gaz.","ref":"§ 3 La présence de gaz lors d\u0027un incendie (chap. 5) — p. 141","p":"Ces cas doivent rester très exceptionnels et la décision d\u0027éteindre la flamme doit être prise en concertation entre le COS et le représentant de l\u0027exploitant sur place.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027équipe","q":"Lors d\u0027un incendie, le binôme découvre une bouteille de gaz dans un local. Quelle est la règle générale quant à sa manipulation ?","c":["La sortir systématiquement à l\u0027air libre","La coucher au sol pour éviter qu\u0027elle ne tombe","Ne pas la manipuler, sauf absolue nécessité","La vidanger en ouvrant son robinet dehors"],"r":2,"e":"Les sapeurs-pompiers ne doivent pas manipuler une bouteille de gaz, sauf en cas d\u0027absolue nécessité. Dans ce cas, ils surveillent sa déformation, toute fuite ailleurs qu\u0027au robinet et l\u0027aspect noirci ou fondu des accessoires ; l\u0027itinéraire et le lieu de dépose sont reconnus au préalable.","ref":"§ 4 Les opérations en présence de bouteilles de gaz (chap. 5) — p. 142","p":"La règle générale est que les sapeurs-pompiers ne doivent pas manipuler une bouteille de gaz sauf en cas d\u0027absolue nécessité.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027agrès","q":"Une bouteille de gaz intègre fuit et brûle au robinet, qu\u0027il est impossible de manœuvrer. Quelle conduite tenir ?","c":["L\u0027éteindre à la poudre, puis la sortir dehors","La déplacer dehors pour qu\u0027elle brûle sans danger","La laisser se vidanger en limitant les propagations","L\u0027éteindre au jet diffusé, puis colmater la fuite"],"r":2,"e":"Sur une fuite enflammée, la bouteille n\u0027est pas déplacée et l\u0027environnement soumis au flux thermique est protégé. S\u0027il n\u0027est pas possible de manœuvrer le robinet, on n\u0027engage que le personnel strictement nécessaire et correctement protégé pour limiter les risques de propagation jusqu\u0027à la vidange complète de la bouteille.","ref":"§ 4.1 La fuite sur une bouteille de gaz (chap. 5) — p. 143","p":"S\u0027il n\u0027est pas possible de manœuvrer le robinet de la bouteille, n\u0027engager que le personnel strictement nécessaire et correctement protégé afin de limiter les risques de propagation jusqu\u0027à la vidange complète de la bouteille.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027agrès","q":"Vous êtes COS : une bouteille de propane est exposée à un incendie. Quel rayon minimal de zone d\u0027exclusion mettez-vous en place en priorité ?","c":["30 m","50 m","100 m","500 m"],"r":2,"e":"Une bouteille soumise à un incendie ou exposée à la chaleur est l\u0027une des situations les plus dangereuses : une zone d\u0027exclusion d\u0027au moins 100 m est une priorité du COS. Cette distance est portée à 200 m pour une bouteille d\u0027acétylène ; 50 m correspond à une simple fuite sur une bouteille restée intègre.","ref":"§ 4.2 La bouteille de gaz soumise à un incendie (chap. 5) — p. 143","p":"La mise en place d\u0027une zone d\u0027exclusion d\u0027un rayon de 100 mètres minimum doit être une priorité du COS. Cette distance est portée de 200 mètres pour les bouteilles d\u0027acétylène.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027équipe","q":"Lors d\u0027un incendie, quel signe observé sur une bouteille de gaz indique qu\u0027elle a été exposée à la chaleur ?","c":["La peinture de son corps est cloquée","Du givre s\u0027est formé sur sa paroi","Sa surface reste mouillée après arrosage","Son étiquette est intacte et bien lisible"],"r":0,"e":"Les signes annonciateurs d\u0027une exposition à la chaleur sont : fumées noires, étiquettes brûlées, rondelle plastique fondue, peinture cloquée, déformation, vapeur d\u0027eau, surface qui sèche vite lorsqu\u0027on l\u0027arrose. Une surface qui reste mouillée indique au contraire une bouteille froide ; le givre, lié à l\u0027ouverture du robinet, ne présente aucun risque.","ref":"§ 4.2 La bouteille de gaz soumise à un incendie (chap. 5) — p. 143","p":"peinture du corps de la bouteille cloquée ; déformation visible sur la bouteille ; présence de vapeur d\u0027eau ; surface de la bouteille sèche rapidement lorsqu\u0027on applique de l\u0027eau.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027équipe","q":"Avec quel moyen le binôme refroidit-il une bouteille de gaz soumise au flux thermique d\u0027un incendie ?","c":["Une lance en jet droit direct, au débit maximal","Une lance en jet diffusé d\u0027attaque, 250 l/min au moins","Un extincteur à eau pulvérisée, au plus près de la bouteille","Une lance en jet diffusé de protection, 60 l/min au plus"],"r":1,"e":"Il est recommandé d\u0027utiliser une lance en jet diffusé d\u0027attaque d\u0027un débit de 250 l/min au minimum ; le jet droit direct est à proscrire. L\u0027efficacité se contrôle à l\u0027imagerie thermique : la température de la paroi doit revenir à la température ambiante et s\u0027y maintenir.","ref":"§ 4.2 La bouteille de gaz soumise à un incendie (chap. 5) — p. 144","p":"Il est recommandé d\u0027utiliser une lance en jet diffusé d\u0027attaque avec un débit de 250 l/min au minimum. Le jet droit direct est à proscrire.","s":"gdo-gaz"},
{"t":"gdo-gaz","ch":"Gaz, incendie et bouteilles","niv":"Chef d\u0027agrès","q":"Une bouteille de gaz est exposée à un incendie et la protection des porte-lances n\u0027est pas possible. Que privilégie le chef d\u0027agrès ?","c":["Un binôme au contact, sous couverture mouillée","Un jet droit direct depuis l\u0027engin","Un retrait total, sans refroidissement","Des moyens hydrauliques sur pied ou fixés"],"r":3,"e":"Si la protection des intervenants n\u0027est pas possible, il faut privilégier la mise en place de moyens hydrauliques sur pied ou fixés. Dans cette situation, l\u0027une des plus dangereuses, une zone d\u0027exclusion d\u0027au moins 100 mètres (200 mètres pour l\u0027acétylène) est une priorité du COS.","ref":"§ 4.2 La bouteille de gaz soumise à un incendie (chap. 5) — p. 144","p":"Si la protection des intervenants n\u0027est pas possible, privilégier la mise en place de moyens hydrauliques sur pied ou fixés.","s":"gdo-gaz"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Selon le guide, qu\u0027est-ce qui fait l\u0027intérêt du prompt secours ?","c":["Son déclenchement après un diagnostic approfondi","Son caractère réflexe et donc très rapide","Sa réalisation sur prescription du médecin régulateur","Sa mise en œuvre par des professionnels de santé"],"r":1,"e":"Le guide précise que l\u0027intérêt du prompt secours réside dans son caractère réflexe et donc très rapide ; il est assuré par des personnels formés et équipés. Il se distingue justement des actions qui exigent un diagnostic approfondi avant toute réponse.","ref":"§ 2.1 La notion de prompt secours (chap. 1) — p. 18","p":"L\u0027intérêt du prompt secours réside dans son caractère réflexe et donc très rapide. Il est assuré par des personnels formés et équipés.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Lequel de ces actes le guide range-t-il parmi ceux accessibles à tous les sapeurs-pompiers après formation ?","c":["L\u0027enregistrement et la transmission d\u0027un ECG","Le recueil de l\u0027hémoglobinémie","L\u0027injection d\u0027un médicament par stylo auto-injecteur","La mesure non invasive de la saturation en oxygène"],"r":3,"e":"Le recueil de la saturation en oxygène par voie non invasive fait partie des actes de recueil d\u0027informations cliniques accessibles à tous les sapeurs-pompiers après formation. L\u0027ECG, l\u0027hémoglobinémie et le stylo auto-injecteur relèvent d\u0027un sapeur-pompier habilité, sur prescription médicale.","ref":"§ 2.2 Les actes de secours et de soins d\u0027urgence (chap. 1) — p. 18","p":"Les actes visant à recueillir […] les informations à caractère clinique ou paraclinique […] accessibles à tous les sapeurs-pompiers après formation […] le recueil du taux de saturation en oxygène […] par voie non invasive.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027équipe","q":"Un sapeur-pompier habilité peut administrer un médicament par stylo auto-injecteur à une victime en choc anaphylactique. À quelle condition ?","c":["Sur décision du chef d\u0027agrès au vu des éléments du bilan","Sur demande de la victime ou de son entourage","Sur prescription du régulateur ou d\u0027un médecin présent","En présence d\u0027un infirmier de sapeurs-pompiers"],"r":2,"e":"Ces actes thérapeutiques sont réalisés, en l\u0027absence de professionnel de santé sur place, par un sapeur-pompier habilité et formé, sur prescription du médecin régulateur ou d\u0027un médecin présent sur les lieux.","ref":"§ 2.2 Les actes de secours et de soins d\u0027urgence (chap. 1) — p. 19","p":"Ces actes sont réalisés par un sapeur-pompier habilité après avoir suivi une formation adaptée et autorisé à pratiquer ces actes sur prescription du médecin régulateur ou d\u0027un médecin présent sur les lieux","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027agrès","q":"Un médicament a été administré par l\u0027équipe sur prescription du médecin régulateur. Que doit-on tracer précisément sur la fiche bilan ?","c":["Uniquement le médicament et son heure d\u0027administration","Rien, la conversation enregistrée au CRRA faisant foi","L\u0027heure de l\u0027appel au régulateur, sans autre précision","Le prescripteur, les actes, les médicaments et la posologie"],"r":3,"e":"Le guide impose de tracer de façon précise sur la fiche bilan tous les détails de la prescription : nom du prescripteur, actes réalisés, médicaments administrés et posologie. Noter seulement le médicament ou l\u0027heure de l\u0027appel est insuffisant.","ref":"§ 2.2 Les actes de secours et de soins d\u0027urgence (chap. 1) — p. 19","p":"Tous les détails de la prescription (le nom du prescripteur, les actes réalisés, médicaments administrés et posologie, etc.) doivent être tracés de façon précise sur la fiche bilan.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Selon le code général des collectivités territoriales, cité par le guide, une carence ambulancière correspond à…","c":["toute intervention SSUAP sans détresse vitale constatée sur place","un transport demandé directement au CTA par la victime","un transport prescrit par le SAMU faute de transporteur privé","un transport inter-hospitalier demandé par un établissement"],"r":2,"e":"Le CGCT définit la carence ambulancière comme un transport sanitaire prescrit par le SAMU, demandé suite à un défaut constaté de disponibilité des transporteurs sanitaires privés. Elle exige les mêmes critères de qualité de prise en charge qu\u0027une mission de SSUAP.","ref":"§ 4 La notion de carence ambulancière (chap. 1) — p. 20","p":"une intervention répondant à plusieurs critères, à savoir qu\u0027elle : correspond à un transport sanitaire prescrit par le SAMU ; est demandée suite à un défaut constaté de disponibilité des transporteurs sanitaires privés","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Quel terme le guide emploie-t-il pour une victime non blessée physiquement mais exposée directement à un risque de mort ou de blessure ?","c":["Malade","Blessé léger","Impliqué","Urgence relative"],"r":2,"e":"Un impliqué est une victime non blessée physiquement, exposée directement à un risque de mort ou de blessure, pouvant avoir besoin d\u0027une prise en charge notamment médico-psychologique. Le malade présente une affection, le blessé une atteinte corporelle traumatique.","ref":"§ 5 La victime (chap. 1) — p. 21","p":"un impliqué est une victime non blessée physiquement, exposée directement à un risque de mort ou de blessure pouvant avoir besoin d\u0027une prise en charge notamment médico-psychologique","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Hors constat par un médecin, dans quel cas le guide admet-il qu\u0027un secouriste constate le décès d\u0027une victime ?","c":["Victime sans pouls ni respiration au bilan","Victime en arrêt malgré une RCP prolongée","Victime inconsciente aux pupilles dilatées","Victime en état de rigidité cadavérique"],"r":3,"e":"Le décès est constaté par un médecin, ou par un secouriste quand la tête est détachée du tronc ou que la victime est en état de rigidité cadavérique ou de putréfaction. Les autres signes proposés ne figurent pas parmi ces critères.","ref":"§ 5 La victime (chap. 1) — p. 21","p":"un décédé est une victime dont le décès est constaté par un médecin ou par un secouriste quand la tête est détachée du tronc ou que la victime est en état de rigidité cadavérique ou de putréfaction.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027équipe","q":"Dans quel cadre le classement des victimes en « urgence absolue » (UA) ou « urgence relative » (UR) est-il utilisé ?","c":["Pour toute victime prise en charge par un VSAV","Uniquement dans le cadre d\u0027un plan NOVI","Lors de la prise d\u0027appel par l\u0027opérateur du CTA","Pour toute victime évacuée vers les urgences"],"r":1,"e":"Le classement UA/UR est utilisé uniquement dans le cadre d\u0027un plan NOVI. Les primo-intervenants, eux, catégorisent la victime selon son état clinique : état léger (EL) ou état grave (EG).","ref":"§ 5 La victime (chap. 1) — p. 21","p":"Le classement en « urgence absolue (UA) » ou en « urgence relative (UR) » est utilisé uniquement dans le cadre d\u0027un plan NOVI.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Pendant la prise en charge, que prévoit le guide au sujet des gestes pratiqués sur la victime ?","c":["Ils sont expliqués seulement si la victime le demande","Ils sont expliqués à la famille plutôt qu\u0027à la victime","Ils sont expliqués à la victime et justifiés par le bilan","Ils sont réalisés sans commentaire"],"r":2,"e":"Le contact physique est limité aux nécessités du bilan et des gestes de secours et de soins. Les gestes effectués doivent être expliqués à la victime et justifiés par le bilan, tout comme le déroulé de l\u0027opération.","ref":"§ 5.1 Les relations avec la victime (chap. 1) — p. 22","p":"Les gestes effectués doivent être expliqués à la victime et justifiés par le bilan. Tout le déroulé de l\u0027opération et les gestes pratiqués doivent être expliqués à la victime","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027agrès","q":"Arrivé aux urgences, le patient demande à être transféré vers un autre établissement de son choix. Selon le guide, ce transfert secondaire…","c":["n\u0027est normalement pas du ressort du SIS","est assuré par le même VSAV, dans la foulée","est assuré par le SIS sur demande de l\u0027IAO","relève du chef d\u0027agrès, après accord du CODIS"],"r":0,"e":"Une fois arrivé dans la structure de soins d\u0027accueil adaptée, le patient peut demander son transfert vers un autre établissement de son choix, mais ce transfert secondaire n\u0027est normalement pas du ressort du SIS.","ref":"§ 5.2 Le libre choix de destination de la victime (chap. 1) — p. 23","p":"Une fois arrivé dans la structure de soins d\u0027accueil adaptée, le patient peut demander son transfert vers un autre établissement de son choix. Ce transfert secondaire n\u0027est pas, normalement, du ressort du SIS.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Équipier","q":"Un journaliste demande à un équipier si la victime qu\u0027il vient de secourir a été hospitalisée. Que doit faire l\u0027équipier ?","c":["Confirmer l\u0027hospitalisation sans détail médical","Répondre si la victime est une personnalité publique","Lui indiquer l\u0027hôpital pour qu\u0027il s\u0027y renseigne","S\u0027abstenir de toute divulgation, même sur ce point"],"r":3,"e":"Le sapeur-pompier doit s\u0027abstenir, à l\u0027égard des tiers, de la presse et même d\u0027élus, de toute divulgation ou commentaire sur l\u0027identité ou l\u0027état de la victime, y compris sur le simple fait de son hospitalisation.","ref":"§ 5.3 La transmission des informations relatives à la victime (chap. 1) — p. 23","p":"le sapeur-pompier doit s\u0027abstenir, à l\u0027égard des tiers, de la presse et même d\u0027élus, de toute divulgation ou commentaire sur l\u0027identité ou l\u0027état de la victime, y compris sur le simple fait de leur hospitalisation.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027équipe","q":"Quelles informations concernant la victime l\u0027équipe peut-elle partager avec les forces de l\u0027ordre ?","c":["L\u0027intégralité du bilan patient-victime, sur simple demande","Toutes les informations médicales, dont le secret médical","Aucune, au nom du secret professionnel","Celles nécessaires à la prise en charge ou à la sécurité"],"r":3,"e":"Le secret médical ne peut pas être partagé avec les forces de l\u0027ordre. Les informations partagées avec elles doivent être limitées à ce qui est nécessaire à la prise en charge de la victime et/ou à la sécurité des intervenants.","ref":"§ 5.3 La transmission des informations relatives à la victime (chap. 1) — p. 23","p":"Les informations relevant du secret partagé avec les forces de l\u0027ordre doivent être limitées à ce qui est nécessaire à la prise en charge de la victime et/ou à la sécurité des intervenants.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Connaissances générales","niv":"Chef d\u0027équipe","q":"Dans lequel de ces cas la révélation d\u0027informations couvertes par le secret professionnel est-elle obligatoire ?","c":["Constatation de sévices sur un enfant de moins de 15 ans","Demande d\u0027informations d\u0027un élu sur l\u0027état de la victime","Demande du conjoint sur l\u0027état de santé de la victime","Demande de l\u0027employeur sur la durée d\u0027hospitalisation"],"r":0,"e":"La révélation est obligatoire notamment en cas de constatation de sévices infligés à un enfant de moins de 15 ans ou à une personne hors d\u0027état de se protéger. En revanche, le sapeur-pompier s\u0027abstient de toute divulgation envers les tiers, y compris les élus, et le conjoint ne fait pas partie des personnes avec qui le secret peut être partagé.","ref":"§ 5.3 La transmission des informations relatives à la victime (chap. 1) — p. 23","p":"Elle est obligatoire notamment dans les cas suivants […] constatation de sévices infligés à un enfant de moins de 15 ans ou aux personnes n\u0027étant pas en mesure de se protéger","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Dangers et risques","niv":"Équipier","q":"Selon le guide, comment se définit le risque, par opposition au danger ?","c":["La propriété intrinsèque d\u0027une substance ou d\u0027une situation","La probabilité que les effets du danger se produisent","La gravité des conséquences d\u0027un accident déjà survenu","L\u0027ensemble des personnes exposées à une situation"],"r":1,"e":"Le danger est la propriété intrinsèque d\u0027une substance, d\u0027un processus, d\u0027une situation ou d\u0027un matériel pouvant entraîner des conséquences néfastes. Le risque est la probabilité, la potentialité, que les effets de ce danger se produisent.","ref":"§ Les dangers et les risques, introduction (chap. 2) — p. 27","p":"Le risque quant à lui est la probabilité, la potentialité, que les effets du danger se produisent.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Dangers et risques","niv":"Équipier","q":"Une piqûre ou une projection de sang sur une muqueuse expose principalement à la transmission de quel type d\u0027agent ?","c":["Essentiellement bactérien","Essentiellement parasitaire","Essentiellement fongique","Essentiellement viral"],"r":3,"e":"L\u0027exposition au sang ou à un liquide biologique par piqûre, coupure ou contact sur peau lésée ou muqueuse engendre un risque de transmission d\u0027un agent essentiellement viral (hépatite B, hépatite C, VIH). Les sécrétions respiratoires exposent, elles, à une contamination principalement bactérienne et virale.","ref":"§ 1 Le risque infectieux (chap. 2) — p. 28","p":"L\u0027exposition par piqûre, coupure ou contact direct sur une peau lésée ou des muqueuses non protégées (bouche, yeux) avec du sang ou un liquide biologique engendre un risque de transmission d\u0027un agent essentiellement viral","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Dangers et risques","niv":"Équipier","q":"Selon le guide, quelle est la première cause d\u0027accidents liés à l\u0027activité du SSUAP ?","c":["Les accidents d\u0027exposition au sang","Les agressions physiques","Les troubles musculo-squelettiques","Les intoxications au monoxyde de carbone"],"r":2,"e":"Les troubles musculo-squelettiques (TMS) sont la première cause d\u0027accidents liés à l\u0027activité du SSUAP. Le port de charges lourdes et les postures inconfortables ou maintenues longtemps favorisent particulièrement ces troubles.","ref":"§ 5 Le risque de troubles musculo-squelettiques (chap. 2) — p. 29","p":"Il s\u0027agit de la première cause d\u0027accidents liés à l\u0027activité du SSUAP, et plus particulièrement le port de charges lourdes, les postures inconfortables ou maintenues durant de longues périodes peuvent favoriser ces troubles.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Dangers et risques","niv":"Chef d\u0027agrès","q":"Quel rôle le guide confie-t-il au chef d\u0027agrès vis-à-vis du conducteur du VSAV ?","c":["Assumer seul la responsabilité pénale de la conduite","Laisser le conducteur seul juge de son aptitude","Conduire lui-même lors des départs pour urgence vitale","Veiller à ce que le conducteur soit en état de conduire"],"r":3,"e":"Le guide rappelle que le conducteur reste responsable de sa conduite et que le chef d\u0027agrès veille à ce qu\u0027il soit en état de conduire. La fatigue ou la consommation d\u0027alcool, de stupéfiants ou de médicaments figurent parmi les causes d\u0027accidents citées.","ref":"§ 6 Le risque routier (chap. 2) — p. 30","p":"Le conducteur reste responsable de sa conduite. Le chef d\u0027agrès veille à ce que le conducteur soit en état de conduire.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Dangers et risques","niv":"Chef d\u0027agrès","q":"En cas de contentieux en SSUAP, quels éléments le guide présente-t-il comme essentiels ?","c":["Le témoignage oral du chef d\u0027agrès devant le juge","Les photographies de la scène prises par les équipiers sur place","La qualité du bilan et du compte rendu de sortie de secours","L\u0027attestation écrite de la famille de la victime"],"r":2,"e":"En cas de contentieux, la qualité et l\u0027exhaustivité des renseignements portés sur le bilan patient-victime et sur le compte rendu de sortie de secours sont essentielles, tout comme l\u0027enregistrement des différents messages transmis.","ref":"§ 7 Le risque juridique (chap. 2) — p. 30","p":"En cas de contentieux en SSUAP, la qualité et l\u0027exhaustivité des renseignements portés sur le bilan patient-victime et le compte-rendu de sortie de secours sont essentielles, tout comme l\u0027enregistrement des différents messages transmis.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Chef d\u0027équipe","q":"À l\u0027approche d\u0027une victime, comment le binôme évalue-t-il les dangers persistants qui peuvent la menacer ?","c":["Par un balayage visuel autour d\u0027elle, en restant à distance","Par un contact physique immédiat pour évaluer sa conscience","En interrogeant d\u0027abord le requérant par téléphone","En déposant le matériel au plus près avant toute observation"],"r":0,"e":"La sécurité collective passe notamment par une approche prudente, une attention permanente et un balayage visuel autour de la victime, en restant à distance d\u0027elle, afin d\u0027évaluer les dangers persistants qui peuvent la menacer.","ref":"§ 1 La sécurité collective (chap. 3) — p. 32","p":"un balayage visuel autour de la victime, en restant à distance d\u0027elle afin d\u0027évaluer les dangers persistants qui peuvent la menacer ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"Quand les occupants du VSAV doivent-ils être ceinturés ?","c":["Uniquement pendant le transport de la victime vers l\u0027hôpital","Uniquement lors des retours, hors urgence","À chaque phase de déplacement, sauf exception justifiée","Uniquement sur voies rapides et autoroutes"],"r":2,"e":"Tous les occupants du VSAV doivent être ceinturés à chaque phase de déplacement, et particulièrement vers le lieu de l\u0027opération, sauf justification médicale contraire pour la victime ou situation particulière. Le matériel embarqué doit aussi être arrimé pour ne pas devenir un projectile.","ref":"§ 1.2 La prévention du risque routier (chap. 3) — p. 33","p":"Tous les occupants du VSAV doivent être ceinturés à chaque phase de déplacement (sauf justification médicale contraire pour la victime ou situation/contexte) et particulièrement celle vers le lieu de l\u0027opération de secours.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"L\u0027usage des avertisseurs sonores et lumineux du VSAV est obligatoire, sauf ordre contraire de qui ?","c":["Du CODIS ou du chef d\u0027agrès","Du conducteur ou du chef d\u0027agrès","Du médecin régulateur","Des forces de l\u0027ordre présentes"],"r":0,"e":"L\u0027usage des avertisseurs sonores et lumineux est obligatoire sauf ordre contraire du CODIS ou du chef d\u0027agrès. Le chef d\u0027agrès contrôle par ailleurs la vitesse appliquée par le conducteur en fonction du degré d\u0027urgence de la mission.","ref":"§ 1.2.1 L\u0027adaptation de la vitesse à l\u0027urgence (chap. 3) — p. 33","p":"L\u0027usage des avertisseurs sonores et lumineux est obligatoire sauf ordre contraire du CODIS ou du chef d\u0027agrès.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"Par temps de brouillard, le VSAV se rend sur une détresse vitale. Quelle vitesse le conducteur doit-il adopter ?","c":["Libre, l\u0027urgence vitale justifiant tout dépassement de vitesse","Au plus 20 km/h au-dessus de la vitesse autorisée","Celle fixée par le médecin régulateur selon l\u0027urgence","Adaptée, dans la limite de la vitesse maximale autorisée"],"r":3,"e":"Lorsque les conditions climatiques réduisent l\u0027adhérence ou la visibilité (pluie, brouillard…), la vitesse est adaptée dans la limite de la vitesse maximale autorisée par la signalisation, quelle que soit l\u0027urgence de la mission. Aucun degré d\u0027urgence ne justifie une dérogation complète au code de la route.","ref":"§ 1.2.1 L\u0027adaptation de la vitesse à l\u0027urgence (chap. 3) — p. 33","p":"En cas de conditions climatiques réduisant l\u0027adhérence de la chaussée et/ou la visibilité (pluie, brouillard, etc.) la vitesse est adaptée dans la limite de la vitesse maximale autorisée par la signalisation routière, quelle que soit l\u0027urgence de la mission.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Où figure le nombre maximum de personnes admises à bord d\u0027un VSAV pendant le transport, hors victime allongée ?","c":["Dans le règlement opérationnel du SIS","Sur le certificat d\u0027immatriculation","Sur la fiche bilan de l\u0027intervention","Dans la convention entre le SIS et le SAMU"],"r":1,"e":"Le nombre maximum de personnes admises à bord pendant le transport, hors victime allongée, est indiqué sur le certificat d\u0027immatriculation. Si besoin, le chef d\u0027agrès, en liaison avec les services partenaires, transfère les effectifs supplémentaires dans les véhicules qui suivent jusqu\u0027à l\u0027hôpital.","ref":"§ 1.2.2 Le nombre de personnes à bord d\u0027un VSAV (chap. 3) — p. 34","p":"Le nombre maximum de personnes admises à bord pendant le transport est indiqué sur le certificat d\u0027immatriculation. Ce chiffre indique le nombre de personnes transportables simultanément hors victime allongée","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"Le médecin régulateur recommande une arrivée à l\u0027hôpital dans les plus brefs délais. En cas d\u0027accident du VSAV, cet avis…","c":["n\u0027exonère en rien la responsabilité du conducteur","transfère la responsabilité au médecin régulateur","engage la seule responsabilité du CTA-CODIS","dégage la responsabilité de tout l\u0027équipage"],"r":0,"e":"Un avis médical recommandant l\u0027arrivée à la structure de soins dans les plus brefs délais n\u0027exonère en rien la responsabilité du conducteur en cas d\u0027accident. L\u0027évacuation se fait en adaptant la vitesse à l\u0027état de la victime, avec pour priorité la non-aggravation de son état.","ref":"§ 1.2.2 Le nombre de personnes à bord d\u0027un VSAV (chap. 3) — p. 34","p":"Un avis médical recommandant l\u0027arrivée à la structure de soins d\u0027accueil dans les plus brefs délais, n\u0027exonère en rien la responsabilité du conducteur en cas d\u0027accident.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Malgré une attitude calme et ferme de l\u0027équipage, la menace d\u0027agression persiste. Que préconise le guide ?","c":["Poursuivre le bilan sur place coûte que coûte","Maîtriser l\u0027agresseur avec l\u0027ensemble de l\u0027équipage","Quitter les lieux en attendant les forces de l\u0027ordre","Confier la victime à l\u0027entourage et partir"],"r":2,"e":"Le guide prévoit de quitter les lieux en attendant les forces de l\u0027ordre si la menace persiste : l\u0027action des secours peut être différée en cas de risques graves d\u0027agression des intervenants (repli raisonné).","ref":"§ 1.3 La prévention du risque agression (chap. 3) — p. 34","p":"leur action peut être différée en cas de risques graves d\u0027agression des intervenants (repli raisonné). […] quitter les lieux en attendant les forces de l\u0027ordre si la menace persiste.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"Pendant le bilan à domicile, un équipier remarque un couteau à portée de main de la victime agitée. Que doit-il faire ?","c":["Le signaler à l\u0027équipage et l\u0027éloigner ou le cacher","N\u0027en rien dire pour ne pas aggraver la tension","Le mentionner uniquement dans le compte rendu","Demander poliment à la victime de le ranger elle-même"],"r":0,"e":"Les missions SUAP étant souvent réalisées en effectif réduit, il faut signifier à tout l\u0027équipage toute observation anormale (par exemple la présence d\u0027un couteau) et éloigner ou cacher tout objet pouvant être utilisé comme une arme.","ref":"§ 1.3 La prévention du risque agression (chap. 3) — p. 34","p":"signifier à l\u0027ensemble de l\u0027équipage toute observation anormale (ex : présence d\u0027un couteau) ; éloigner ou cacher de l\u0027agresseur tout objet pouvant être utilisé comme une arme","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Équipier","q":"Lors d\u0027un geste, un équipier reçoit une projection de liquide biologique dans l\u0027œil. Que préconise le guide ?","c":["Appliquer une solution hydro-alcoolique sur la paupière","Désinfecter l\u0027œil au Dakin pendant 5 minutes","Attendre l\u0027avis d\u0027un médecin avant tout rinçage","Rincer abondamment au sérum physiologique, à défaut à l\u0027eau"],"r":3,"e":"En cas de projection sur les muqueuses, le guide prévoit de rincer abondamment au sérum physiologique et, à défaut, avec de l\u0027eau. Le lavage au savon suivi d\u0027une désinfection concerne les piqûres ou coupures, pas les muqueuses.","ref":"§ 2.1 La prévention du risque infectieux (chap. 3) — p. 36","p":"En cas de projection sur les muqueuses, rincer abondamment au sérum physiologique, et à défaut avec de l\u0027eau.","s":"gdo-ssuap"},
