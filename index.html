{"t":"gto-sauv","ch":"Moyens aériens et matelas","niv":"Équipier","q":"Selon les abréviations du GTO Sauvetages et mises en sécurité, que signifie le sigle EPA ?","c":["Échelle pivotante automatique","Échelle pivotante articulée","Échelle portée aérienne","Engin porte-échelle automatique"],"r":0,"e":"Dans l\u0027annexe des abréviations du GTO, EPA signifie échelle pivotante automatique. Le guide y distingue aussi l\u0027EPSA (échelle pivotante semi-automatique), l\u0027EPS (échelle pivotante à mouvements séquentiels) et l\u0027EPC (échelle pivotante à mouvements combinés).","ref":"§ Annexe A Abréviations utilisées dans ce guide — p. 73","p":"EPA : échelle pivotante automatique","s":"gto-sauv"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Selon le GTO, quand une atmosphère impose-t-elle une protection des voies respiratoires ?","c":["Si sa température dépasse celle du corps humain","Si l\u0027oxygène y manque ou si elle contient des gaz ou vapeurs toxiques","Si la visibilité y est nulle en raison de l\u0027absence d\u0027éclairage","Si la liaison radio avec le contrôleur n\u0027y passe plus du tout"],"r":1,"e":"Les EPI de protection respiratoire alimentent l\u0027utilisateur en air respirable lorsqu\u0027il est exposé à une atmosphère dangereuse, soit parce que la concentration en oxygène est insuffisante, soit parce que l\u0027environnement contient des aérosols, des gaz ou des vapeurs toxiques.","ref":"§ Chapitre 1 Connaissances générales — p. 11","p":"lorsque ce dernier est exposé à une atmosphère dangereuse soit parce que la concentration en oxygène est insuffisante, soit parce que l\u0027environnement contient des aérosols, des gaz ou des vapeurs toxiques.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Que signifie le sigle ARI ?","c":["Appareil respiratoire isolant","Appareil respiratoire individuel","Assistance respiratoire d\u0027intervention","Appareil de respiration intégré"],"r":0,"e":"ARI signifie appareil respiratoire isolant. À circuit ouvert (ARICO), il alimente le porteur à la demande en air respirable provenant de la ou des bouteilles d\u0027air comprimé portées sur son dos.","ref":"§ Annexe A Abréviations utilisées dans ce guide — p. 53","p":"ARI : appareil respiratoire isolant","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Dans un ARI à circuit ouvert, quel élément ramène la haute pression de la bouteille à une moyenne pression ?","c":["Le manomètre","La soupape à la demande","Le flexible haute pression","Le détendeur HP/MP"],"r":3,"e":"L\u0027air de la bouteille (200 ou 300 bar) est d\u0027abord ramené à moyenne pression (6 ou 8 bar) par le détendeur HP/MP, puis passé en basse pression, légèrement supérieure à la pression atmosphérique, par la soupape à la demande, qui maintient une surpression dans le masque.","ref":"§ 1.1.1 L\u0027appareil respiratoire isolant à circuit ouvert — p. 13","p":"L\u0027air comprimé à haute pression (200 ou 300 bar) de la (ou des) bouteille(s) est ramené dans un premier temps à pression moyenne (6 ou 8 bar) par le détendeur HP/MP","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Chef d\u0027équipe","q":"Selon le GTO, de quoi dépend l\u0027autonomie d\u0027un ARI à circuit ouvert ?","c":["De la quantité d\u0027air disponible et de la consommation du porteur","De la seule pression de la bouteille, identique pour tous les porteurs","Du seul volume en eau de la bouteille, quelle que soit la pression","Du réglage de la soupape à la demande, fixé avant l\u0027engagement"],"r":0,"e":"L\u0027autonomie dépend de la quantité d\u0027air disponible et de la consommation du porteur, qui varie selon l\u0027individu et le travail effectué, de 10 L/min au repos à 135 L/min pour un travail très intense. Un sapeur-pompier qui perd son calme accélère aussi son rythme respiratoire et épuise rapidement sa réserve.","ref":"§ 1.1.1 L\u0027appareil respiratoire isolant à circuit ouvert — p. 14","p":"L\u0027autonomie d\u0027un appareil respiratoire isolant à circuit ouvert dépend de la quantité d\u0027air disponible ainsi que de la consommation du porteur, qui varie en fonction de l\u0027individu et du travail effectué.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Chef d\u0027équipe","q":"D\u0027après le calcul du GTO (facteur de compressibilité Z = 1,1), quel volume d\u0027air offre une bouteille d\u0027ARI de 7 litres gonflée à 300 bar ?","c":["Environ 700 litres","Environ 1 900 litres","Environ 2 100 litres","Environ 3 000 litres"],"r":1,"e":"Le volume d\u0027air disponible se calcule par (P × V) / (Z × Patm) : (300 × 7) / (1,1 × 1) ≈ 1 909 litres. Le simple produit 300 × 7 = 2 100 litres néglige la compressibilité de l\u0027air. À 100 L/min, cette bouteille offre environ 19 minutes d\u0027autonomie.","ref":"§ Annexe C Calcul théorique de l\u0027autonomie — p. 61","p":"Exemple de calcul pour une bouteille de 7 litres à 300 bar : Capacité [...] = (300*7) / (1.1 * 1) = 1909","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Chef d\u0027équipe","q":"La surpression maintenue dans le masque de l\u0027ARI est-elle garantie en toutes circonstances ?","c":["Oui, quel que soit le débit respiratoire du porteur","Oui, tant que la bouteille reste au-dessus de 55 bar","Non, elle n\u0027existe que si le by-pass est ouvert","Non, pas pour des débits de pointe supérieurs à 314 L/min"],"r":3,"e":"La soupape à la demande maintient une surpression dans la pièce faciale, mais celle-ci n\u0027est pas garantie pour des débits de pointe supérieurs à 314 L/min. Elle ne peut donc pas être considérée comme un argument de sécurité pour le porteur dans toutes les configurations.","ref":"§ Annexe B 1.2.2 Résistances respiratoires et débit de consommation — p. 56","p":"La surpression dans le masque n\u0027est pas garantie pour des débits de pointe supérieurs à 314 l/min. Elle ne peut donc pas être considérée comme un argument de sécurité pour le porteur dans toutes les configurations.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Une fois l\u0027ARI endossé, sur quoi doit-il reposer essentiellement ?","c":["Sur les bretelles du harnais, serrées au maximum","Sur les épaules, la ceinture ventrale restant ouverte","Sur le haut du dos, le dossard étant plaqué par le harnais","Sur la ceinture ventrale, pour préserver la couche d\u0027air"],"r":3,"e":"L\u0027ARI doit reposer essentiellement sur la ceinture ventrale afin de préserver la couche d\u0027air de la tenue de protection. Ceintures et harnais ne doivent pas être trop serrés, pour ne pas gêner les mouvements de progression et les positions de travail.","ref":"§ Annexe B 1.1 Les facteurs physiques — p. 55","p":"L\u0027ARI doit reposer essentiellement sur la ceinture ventrale afin de préserver la couche d\u0027air de la tenue de protection du porteur.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Chef d\u0027agrès","q":"Le COS envisage des appareils filtrants plutôt que des ARI. Parmi les conditions requises, quel seuil de concentration en oxygène le GTO fixe-t-il ?","c":["Plus de 12 %","Plus de 15 %","Plus de 17 %","Plus de 19,5 %"],"r":2,"e":"Les appareils filtrants ne peuvent être envisagés par le COS que si toutes les conditions sont réunies, dont une concentration en oxygène supérieure à 17 % et un polluant identifié et mesuré. Si une seule condition manque, le port de l\u0027ARI est indispensable ; il est obligatoire si l\u0027oxygène est inférieur à 17 %.","ref":"§ Chapitre 2 Les techniques d\u0027engagement — p. 32","p":"elle ne peut être envisagée par le commandant des opérations de secours que si les conditions suivantes sont réunies [...] la concentration de l\u0027oxygène dans l\u0027air est supérieure à 17 %","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Sur une ligne guide, que signale une olive isolée ?","c":["La direction du sinistre","Un point de dérivation de la ligne","La direction de la sortie","La fin de la ligne guide"],"r":2,"e":"La ligne guide comporte des repères de progression : une olive isolée indique la direction de la sortie (1 olive, 1 syllabe : « vie ») ; trois olives successives indiquent la direction du sinistre (3 olives, 3 syllabes : « in-cen-die »).","ref":"§ 1.3.1 La ligne guide — p. 19","p":"1 olive isolée en 2ème = en direction de la sortie (1 olive, 1 syllabe : « vie ») ; 3 olives successives en 2ème = en direction du sinistre","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Qu\u0027est-ce que la liaison personnelle utilisée lors d\u0027un engagement sous ARI ?","c":["Le câble qui relie la bouteille de l\u0027ARI à son dossard","La radio qui relie en permanence chaque porteur au contrôleur","Une ligne reliant les porteurs entre eux et à la ligne guide","La ligne filaire reliant le point de pénétration au COS"],"r":2,"e":"La liaison personnelle permet le déplacement le long de la ligne guide tout en assurant un lien constant entre les intervenants. Longue de 6 mètres au total, elle s\u0027utilise en version courte (1,25 m) ou longue (6 m). Ligne de vie = ligne guide + liaison personnelle.","ref":"§ 1.3.2 La liaison personnelle — p. 20","p":"La liaison personnelle permet le déplacement le long de la ligne guide tout en assurant un lien constant entre les intervenants.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Quel rôle assure la balise de sécurité et de détresse portée avec l\u0027appareil respiratoire ?","c":["Alerter de l\u0027immobilité ou de la détresse du porteur","Avertir le porteur que sa bouteille arrive en fin de charge","Assurer la liaison radio entre le binôme et le contrôleur","Baliser l\u0027itinéraire de repli par un signal lumineux"],"r":0,"e":"La balise de sécurité et de détresse comprend un détecteur d\u0027immobilité : elle alerte, par des signaux sonores et lumineux simultanés, de l\u0027immobilité ou de la détresse du porteur si le manque de mouvement dépasse une période donnée. La fin de charge de la bouteille est, elle, signalée par le sifflet.","ref":"§ 1.4.1 La balise de sécurité et de détresse — p. 21","p":"un détecteur d\u0027immobilité, dispositif de sécurité permettant d\u0027alerter de l\u0027immobilité ou de la détresse du porteur si le manque de mouvement dépasse une période donnée [...] en émettant simultanément des signaux sonores et lumineux","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : matériels et autonomie","niv":"Équipier","q":"Outre la détection d\u0027immobilité, quelle autre fonction assure la balise de sécurité et de détresse ?","c":["Indiquer la pression restante dans la bouteille","Avertir le porteur du dépassement d\u0027une température limite","Mesurer la teneur en oxygène de l\u0027atmosphère traversée","Guider le porteur vers la sortie par un signal sonore"],"r":1,"e":"La balise de sécurité et de détresse est à la fois un détecteur d\u0027immobilité et une sonde thermique : elle contrôle la température et avertit le porteur du dépassement de la température limite d\u0027exposition programmée. La pression se contrôle, elle, au manomètre.","ref":"§ 1.4.1 La balise de sécurité et de détresse — p. 22","p":"une sonde thermique, système configuré pour contrôler la température et avertir le porteur du dépassement de la température limite d\u0027exposition programmée.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Équipier","q":"Comment les deux membres d\u0027un binôme engagé sous ARI doivent-ils travailler ?","c":["Séparément, pour couvrir plus de surface, chacun relié par radio au contrôleur","Ensemble, avec un contact permanent physique, visuel ou verbal","En alternance : l\u0027un progresse pendant que l\u0027autre ressort changer de bouteille","Ensemble à l\u0027aller, puis chacun à son rythme pour le retour"],"r":1,"e":"Les personnels engagés travaillent en binôme indissociable, composé d\u0027un chef et d\u0027un équipier, avec un contact permanent physique, visuel ou verbal. Un sapeur-pompier ne doit jamais s\u0027engager seul : le binôme est la seule et unique unité de travail valide.","ref":"§ 2.1 Le binôme d\u0027exploration — p. 23","p":"Les personnels engagés doivent travailler en binôme indissociable. Ce binôme est composé d\u0027un chef et d\u0027un équipier. Le travail en binôme est réalisé avec un contact permanent (physique, visuel ou verbal) entre les deux intervenants.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027équipe","q":"Vous êtes chef d\u0027équipe. En cours d\u0027exploration, votre équipier n\u0027est plus en mesure d\u0027accomplir la mission. Que faites-vous ?","c":["Vous l\u0027envoyez seul vers la sortie et poursuivez la mission","Vous demandez un remplaçant qui vous rejoindra sur place","Vous poursuivez ensemble la mission en réduisant l\u0027allure","Vous faites replier le binôme entier, vous y compris"],"r":3,"e":"Si, pour une raison indéterminée, l\u0027un des sapeurs-pompiers n\u0027est plus en mesure d\u0027accomplir la mission, le binôme entier doit impérativement se replier. Un sapeur-pompier ne doit jamais s\u0027engager seul : le binôme est la seule et unique unité de travail valide.","ref":"§ 2.1 Le binôme d\u0027exploration — p. 24","p":"Si pour une raison indéterminée, un des sapeurs-pompiers n\u0027est plus en mesure d\u0027accomplir la mission, le binôme entier doit impérativement se replier.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Équipier","q":"Le code général d\u0027évacuation est transmis alors que votre binôme est engagé. Que faites-vous ?","c":["Vous vous désengagez vers le point de regroupement prédéfini","Vous terminez la mission en cours, puis vous vous repliez","Vous rejoignez le binôme engagé le plus proche pour l\u0027assister","Vous vous mettez à l\u0027abri dans la pièce reconnue la plus proche"],"r":0,"e":"En cas d\u0027évolution défavorable de la situation, le repli de tous les binômes est ordonné par la transmission du code général d\u0027évacuation préétabli. À ce signal, l\u0027ensemble du personnel se désengage et se rassemble au point de regroupement prédéfini.","ref":"§ 2.1 Le binôme d\u0027exploration — p. 24","p":"le repli de tous les binômes est ordonné par la transmission du code général d\u0027évacuation préétabli […] À ce signal, l\u0027ensemble du personnel se désengage et se rassemble au point de regroupement prédéfini.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Lors d\u0027un engagement sous ARI, où le contrôleur exerce-t-il sa mission ?","c":["Au point de pénétration, entre zone d\u0027exclusion et zone contrôlée","Au plus près du foyer, pour suivre la progression des binômes","Dans la cabine de l\u0027engin-pompe, à l\u0027abri du bruit et des fumées","Au point de rassemblement des évacués, à l\u0027écart du sinistre"],"r":0,"e":"Le contrôleur assure l\u0027enregistrement des binômes et régule un point de pénétration, frontière entre la zone d\u0027exclusion et la zone contrôlée, où il assure la sécurité des équipes engagées. Il est chargé d\u0027un seul point de pénétration et garde à proximité immédiate un binôme de sécurité équipé.","ref":"§ 2.2 Le contrôleur — p. 24","p":"Le contrôleur assure l\u0027enregistrement des binômes. [...] régule un point de pénétration (frontière entre la zone d\u0027exclusion et la zone contrôlée) et y assure la sécurité des équipes engagées.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Vous tenez le rôle de contrôleur. Combien de porteurs d\u0027ARI pouvez-vous gérer au maximum à votre point de pénétration ?","c":["6 porteurs, soit 2 binômes et le binôme de sécurité","8 porteurs, soit 3 binômes et le binôme de sécurité","10 porteurs, soit 4 binômes et le binôme de sécurité","12 porteurs, soit 5 binômes et le binôme de sécurité"],"r":2,"e":"Le contrôleur gère ou supervise au maximum l\u0027engagement de 10 porteurs, soit 4 binômes et le binôme de sécurité. Il n\u0027est chargé que d\u0027un seul point de pénétration et garde toujours à proximité immédiate un binôme de sécurité équipé.","ref":"§ 2.2 Le contrôleur — p. 24","p":"gérer / superviser au maximum l\u0027engagement de 10 porteurs, soit 4 binômes et le binôme de sécurité ;","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès lors d\u0027un engagement sous ARI en zone d\u0027exclusion. Quel est le rôle principal du binôme de sécurité ?","c":["Assister et porter secours au binôme engagé","Aider à l\u0027établissement des tuyaux du binôme engagé","Assurer le déblai des locaux déjà reconnus","Relever le binôme engagé à heure fixe"],"r":0,"e":"Mis en place par le COS dès que possible, le binôme de sécurité se tient au point de pénétration, en zone contrôlée, sous la seule autorité du contrôleur. Son rôle principal est d\u0027assister et de porter secours aux binômes engagés ; l\u0027aide à l\u0027établissement des tuyaux doit être confiée à un autre binôme.","ref":"§ 2.3 Le binôme de sécurité — p. 25","p":"Son rôle principal est d\u0027assister et de porter secours au(x) binôme(s) engagé(s).","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Un sauvetage impose d\u0027engager immédiatement un binôme sous ARI, sans contrôleur ni binôme de sécurité en place. Cet engagement :","c":["est interdit sans binôme de sécurité en place","est possible, l\u0027enregistrement restant toutefois primordial","est possible, l\u0027enregistrement étant reporté à la sortie","n\u0027est possible que si le chef d\u0027agrès accompagne le binôme"],"r":1,"e":"Un sauvetage peut justifier l\u0027envoi immédiat d\u0027un binôme sans contrôleur ARI ni binôme de sécurité. L\u0027information au chef d\u0027agrès et l\u0027enregistrement restent toutefois primordiaux, et une remontée d\u0027information doit être faite immédiatement au CODIS pour anticiper la venue de renforts.","ref":"§ 2.3 Le binôme de sécurité — p. 25","p":"Un sauvetage peut justifier l\u0027envoi immédiat d\u0027un binôme sans mise en œuvre d\u0027un contrôleur ARI ou d\u0027un binôme de sécurité. Toutefois, l\u0027information au chef d\u0027agrès et l\u0027enregistrement sont primordiaux.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Un binôme engagé rend compte par radio qu\u0027il rencontre des difficultés. Quelle conduite le GTO prévoit-il ?","c":["Le contrôleur quitte son poste pour aller le chercher seul à l\u0027intérieur","Le binôme de sécurité attend l\u0027accord du CODIS pour entrer","On attend l\u0027heure de sortie prévue avant toute autre action","Le chef d\u0027agrès ou le contrôleur engage le binôme de sécurité"],"r":3,"e":"Le binôme de sécurité est engagé sur ordre du chef d\u0027agrès ou du contrôleur dès qu\u0027un binôme engagé rencontre des difficultés : compte rendu radio, signal sonore de difficulté, déclenchement du signal sonore de la balise de détresse.","ref":"§ 2.3.2 Les missions en phase « ACTION » du binôme de sécurité — p. 26","p":"Le binôme de sécurité est engagé sur ordre du chef d\u0027agrès ou du contrôleur, dès que des difficultés sont rencontrées par l\u0027un des binômes engagés (compte-rendu radio, signal sonore de difficulté, déclenchement du signal sonore de la balise de détresse...).","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : rôles des intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Le binôme de sécurité vient d\u0027être engagé pour assister un binôme en difficulté. Que prévoit le guide ?","c":["Attendre son retour avant d\u0027en désigner un autre","Confier au contrôleur le rôle de binôme de sécurité","Désigner au plus tôt un nouveau binôme de sécurité","Confier ce rôle au seul conducteur de l\u0027engin"],"r":2,"e":"L\u0027engagement d\u0027un binôme de sécurité implique la désignation, au plus tôt, d\u0027un nouveau binôme de sécurité en remplacement : le contrôleur doit toujours garder à proximité immédiate un binôme de sécurité équipé.","ref":"§ 2.3.2 Les missions en phase « ACTION » du binôme de sécurité — p. 26","p":"L\u0027engagement d\u0027un binôme de sécurité implique la désignation d\u0027un nouveau binôme de sécurité en remplacement, au plus tôt.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Équipier","q":"Dans quel ordre le porteur d\u0027ARI met-il en place les trois protections de sa tête ?","c":["Cagoule, masque, puis casque","Masque, cagoule, puis casque","Cagoule, casque, puis masque","Masque, casque, puis cagoule"],"r":1,"e":"Pour la protection de la face et des voies respiratoires, le GTO impose de respecter le positionnement successif des trois protections de la tête : d\u0027abord le masque (nez, bouche, yeux), puis la cagoule, enfin le casque.","ref":"§ 1.1 L\u0027équipement — p. 32","p":"il est important de respecter le positionnement successif des trois protections de la tête : [...] le masque (nez, bouche, yeux) ; 2. la cagoule ; 3. le casque.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Équipier","q":"En phase d\u0027attente, le porteur ouvre la bouteille de son ARI. Que vérifie-t-il ensuite ?","c":["La date d\u0027épreuve de la bouteille et le serrage des sangles","Le débit du by-pass et la température de l\u0027air dans le masque","L\u0027armement du sifflet et la pression au manomètre","Le canal radio du binôme et la charge de sa lampe portative"],"r":2,"e":"En phase d\u0027attente, le porteur ouvre (ou fait ouvrir) la bouteille lentement et complètement, vérifie l\u0027armement du sifflet de fin de charge, qui siffle à la mise en pression, puis vérifie la pression au manomètre.","ref":"§ 1.1 L\u0027équipement — p. 32","p":"ouvrir (ou faire ouvrir) la bouteille lentement et complètement ; vérifier l\u0027armement du sifflet de fin de charge (sifflement à la mise en pression) ; vérifier la pression au manomètre.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Chef d\u0027équipe","q":"Avant l\u0027engagement d\u0027un binôme sous ARI, en quoi consiste le contrôle croisé ?","c":["Vérifier la liaison radio entre le contrôleur et le binôme avant l\u0027entrée","Compter les tuyaux et raccords disponibles pour garantir une réserve de progression","Mesurer le taux d\u0027oxygène à l\u0027entrée du local pour fixer la durée d\u0027engagement","Vérifier en vis-à-vis, entre membres du binôme, la mise en place correcte des EPI"],"r":3,"e":"Obligatoire, le contrôle croisé consiste à vérifier la mise en place correcte des EPI : tenue, cagoule, masque et son étanchéité, soupape à la demande, casque, pression de la bouteille. Il est réalisé en vis-à-vis sous la responsabilité du binôme et validé par le chef d\u0027agrès ou le contrôleur.","ref":"§ 1.2 Le contrôle croisé — p. 33","p":"Obligatoire, le contrôle croisé consiste à vérifier la mise en place correcte des EPI. Il est réalisé en vis-à-vis, sous la responsabilité du binôme et validé par le responsable du point de pénétration (chef d\u0027agrès, contrôleur).","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Équipier","q":"Lors du contrôle croisé, comment vérifie-t-on la liaison entre la soupape à la demande (SAD) et le masque ?","c":["En faisant pivoter la SAD tout en exerçant une légère traction","En actionnant le by-pass jusqu\u0027à entendre un sifflement continu","En vérifiant visuellement la présence du joint, sans la toucher","En déconnectant puis en reconnectant la SAD devant l\u0027équipier"],"r":0,"e":"La liaison SAD-masque se vérifie en faisant pivoter la SAD tout en exerçant une légère traction dessus. Le test d\u0027étanchéité du masque, distinct, se réalise selon les préconisations du fabricant.","ref":"§ 1.2 Le contrôle croisé — p. 33","p":"La liaison SAD-masque doit être vérifiée, en faisant pivoter la SAD, tout en exerçant une légère traction dessus.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Équipier","q":"Avec une bouteille de 300 bar, quelle pression minimale le porteur doit-il lire au manomètre avant de s\u0027engager ?","c":["200 bar","250 bar","270 bar","290 bar"],"r":2,"e":"Avant engagement, la pression ne doit pas être inférieure à la pression nominale de la bouteille moins 10 % : pour une bouteille de 300 bar, la pression minimale est donc de 270 bar.","ref":"§ 2.1 Les conditions minimales d\u0027engagement — p. 34","p":"la pression avant engagement ne doit pas être inférieure à la pression nominale de la bouteille moins 10% (exemple : pour une bouteille 300 bar, pression minimale de 270 bar)","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Chef d\u0027agrès","q":"Vous êtes responsable du point de pénétration. Un porteur affiche une pression inférieure à la pression minimale d\u0027engagement. Son engagement :","c":["est interdit tant que sa bouteille n\u0027a pas été changée","est possible sans restriction s\u0027il est associé à un porteur plein","est possible s\u0027il emporte une bouteille de rechange","est restreint à des missions limitées, que vous validez"],"r":3,"e":"Tout engagement en dessous de la pression minimale est restreint à des missions limitées et validé par le responsable du point de pénétration (chef d\u0027agrès ou contrôleur). Il n\u0027est donc ni interdit par principe, ni libre de toute restriction.","ref":"§ 2.1 Les conditions minimales d\u0027engagement — p. 34","p":"Tout engagement en dessous de la pression minimale est restreint à des missions limitées. Il est validé par le responsable du point de pénétration.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et enregistrez un binôme avant son engagement sous ARI. Que comprend cet enregistrement ?","c":["Adresse du sinistre, nom du propriétaire, type de bâtiment","Noms des porteurs, pression d\u0027engagement, heure d\u0027entrée","Nombre de tuyaux établis, débit et type de lance utilisée","Température extérieure, direction et force du vent"],"r":1,"e":"L\u0027enregistrement, réalisé en zone contrôlée auprès du chef d\u0027agrès ou du contrôleur, comprend l\u0027identification des porteurs (noms), la pression d\u0027engagement, l\u0027heure d\u0027entrée autant que possible, et la remise des clés des balises de détresse avec les plaquettes d\u0027enregistrement.","ref":"§ 2.1.1 L\u0027enregistrement — p. 34","p":"L\u0027enregistrement comprend l\u0027identification des porteurs (noms) et la pression d\u0027engagement ; l\u0027inscription de l\u0027heure d\u0027entrée (autant que possible) ;","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Équipier","q":"Le sifflet de fin de charge d\u0027un ARI se déclenche lorsque la pression dans la bouteille descend en dessous d\u0027environ :","c":["20 bar","55 bar","100 bar","150 bar"],"r":1,"e":"Selon le GTO, un sifflet de fin de charge se déclenche lorsque la pression dans la bouteille d\u0027ARI descend en dessous de 55 bar environ. Tout au long de la phase d\u0027engagement, le porteur contrôle lui-même l\u0027autonomie d\u0027air respirable dont il dispose.","ref":"§ 2.1.2 L\u0027autonomie du binôme — p. 35","p":"Lorsque la pression dans la bouteille d\u0027ARI descend en dessous de 55 bars environ, un sifflet de fin de charge se déclenche","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Chef d\u0027équipe","q":"En cours de mission, le sifflet de fin de charge de l\u0027ARI de votre équipier se déclenche. Que fait le binôme ?","c":["Il revient immédiatement et ensemble au point de pénétration","Il termine d\u0027abord sa mission, le sifflet laissant une réserve","Il attend sur place le binôme de sécurité qui apporte une bouteille","Il se sépare : l\u0027équipier ressort seul, le chef poursuit la mission"],"r":0,"e":"Le déclenchement du sifflet de fin de charge implique un retour systématique et immédiat du binôme au point de pénétration. Le binôme reste indissociable : si l\u0027un des sapeurs-pompiers n\u0027est plus en mesure d\u0027accomplir la mission, le binôme entier doit se replier.","ref":"§ 2.1.2 L\u0027autonomie du binôme — p. 35","p":"un sifflet de fin de charge se déclenche, impliquant un retour systématique et immédiat du binôme au point de pénétration","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : contrôle et engagement","niv":"Chef d\u0027équipe","q":"Pendant sa progression sous ARI, comment le binôme gère-t-il le moment de son retour ?","c":["Il attend le déclenchement du sifflet de fin de charge pour faire demi-tour","Il attend l\u0027ordre du binôme de sécurité, qui suit les pressions à l\u0027entrée","Il garde assez d\u0027air pour revenir en sécurité, quitte à repartir avant le sifflet","Il ressort lorsque la lance n\u0027est plus alimentée"],"r":2,"e":"Le binôme doit conserver suffisamment d\u0027autonomie en air pour revenir en sécurité au point de pénétration : la phase de retour peut donc être enclenchée avant le sifflet de fin de charge. Les porteurs surveillent régulièrement leur autonomie, qui doit couvrir l\u0027aller, la mission et le retour.","ref":"§ 2.1.2 L\u0027autonomie du binôme — p. 35","p":"Le binôme doit garder à l\u0027esprit de conserver suffisamment d\u0027autonomie en air pour revenir en sécurité au point de pénétration. La phase de retour peut donc être enclenché avant la mise en œuvre du sifflet de fin de charge.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Sur quoi doit reposer le choix d\u0027engager un binôme en reconnaissance avec ou sans moyen en eau ?","c":["Sur le volume d\u0027eau de la citerne de l\u0027engin","Sur une analyse du feu couplée à une analyse bâtimentaire","Sur la seule présence ou absence de victimes signalées","Sur l\u0027autonomie en air restante des porteurs d\u0027ARI"],"r":1,"e":"Le choix d\u0027engager un binôme en reconnaissance avec ou sans moyen en eau doit reposer sur une analyse du feu couplée à une analyse bâtimentaire, afin de prendre en compte les risques de phénomènes thermiques.","ref":"§ 3 Les différentes techniques d\u0027engagement — p. 35","p":"Le choix d\u0027engager un binôme en reconnaissance avec moyen en eau ou sans doit reposer sur une analyse du feu couplé à une analyse bâtimentaire permettant de prendre en compte les risques de phénomènes thermiques.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Équipier","q":"Un binôme réalise un engagement à vue, à l\u0027extérieur, en air respirable. Que prévoit le guide pour ses balises de détresse ?","c":["Elles peuvent rester désarmées puisque l\u0027air est respirable","Elles ne sont armées qu\u0027au moment où le binôme coiffe son masque","Elles sont armées : c\u0027est obligatoire, même en extérieur","Elles ne sont armées que lors d\u0027un engagement sur ligne de vie"],"r":2,"e":"Lors d\u0027un engagement à vue, le binôme ne se sépare pas et les balises de détresse sont armées ; même en extérieur, l\u0027armement est obligatoire. Si le porteur est immobile, le déclenchement de sa balise peut faciliter sa recherche, notamment en cas d\u0027explosion.","ref":"§ 3.1.1 L\u0027air est respirable — p. 36","p":"Le binôme ne se sépare pas et les balises de détresse sont armées. Même en extérieur, l\u0027armement de la balise est obligatoire.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"Lors d\u0027un engagement à vue en air respirable, des fumées apparaissent et une odeur particulière se fait sentir. Que fait le binôme ?","c":["Il poursuit sans masque, l\u0027engagement à vue n\u0027étant pas limité","Il sort sans rendre compte, pour coiffer son masque à l\u0027air libre","Il coiffe son masque et poursuit sa mission sans en rendre compte","Il coiffe son masque, rend compte et applique la décision reçue"],"r":3,"e":"En cas de changement de situation (fumées, odeur particulière), le binôme coiffe son masque et en rend compte au COS ou au contrôleur ; il continue ou abandonne la reconnaissance selon leur décision. L\u0027engagement est alors géré par un contrôleur, avec une équipe de sécurité.","ref":"§ 3.1.2 L\u0027air n\u0027est pas respirable ou se dégrade — p. 36","p":"le binôme coiffe son masque. Il en rend compte au COS ou au contrôleur. Il continue ou abandonne la reconnaissance en fonction de la décision du contrôleur / COS.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"Votre binôme doit reconnaître un local où la visibilité est nulle. Quelle technique d\u0027engagement le GTO prévoit-il ?","c":["Un engagement à vue, masque en attente et bouteille ouverte","Un engagement guidé par radio depuis le point de pénétration","Un engagement en suivant le marquage laissé par un autre binôme","Un engagement sur ligne de vie : ligne guide ou tuyau"],"r":3,"e":"L\u0027engagement au moyen d\u0027une ligne de vie s\u0027emploie notamment lorsque la visibilité est réduite ou nulle ; il se fait avec une ligne guide, ou avec un tuyau lorsque la progression se fait avec un moyen hydraulique. L\u0027engagement à vue exige au contraire une visibilité bonne et suffisante.","ref":"§ 3.2 Les engagements au moyen d\u0027une ligne de vie — p. 37","p":"L\u0027engagement au moyen d\u0027une ligne de vie est employé pour disposer d\u0027un lien physique et continu [...] Les conditions de mise en œuvre sont [...] la visibilité est réduite ou nulle","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"Lors d\u0027une reconnaissance avec un moyen hydraulique, le binôme doit reconnaître une pièce. Comment s\u0027organise-t-il ?","c":["Le chef tient la lance entre foyer et pièce ; l\u0027équipier reconnaît","Le chef reconnaît la pièce ; l\u0027équipier garde la lance dans le couloir","Les deux reconnaissent la pièce, la lance posée à l\u0027entrée","Le chef reconnaît la pièce, sa lance en main ; l\u0027équipier attend"],"r":0,"e":"Lors des reconnaissances avec un moyen hydraulique, le chef d\u0027équipe conserve le contrôle de sa lance, placée entre le foyer et la pièce à reconnaître ; l\u0027équipier réalise la reconnaissance du local à sa place. Ils restent reliés entre eux par la liaison personnelle.","ref":"§ 3.2 Les engagements au moyen d\u0027une ligne de vie — p. 39","p":"le chef d\u0027équipe conserve le contrôle de sa lance. Elle est placée entre le foyer et la pièce à reconnaître. Dans cette configuration, l\u0027équipier réalise la reconnaissance du local à la place du chef.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"En méthode latérale « en mode dissocié », lequel des porteurs est relié à la ligne guide, et comment ?","c":["Le chef, par sa liaison courte ; l\u0027équipier est relié à lui jusqu\u0027à 6 m","L\u0027équipier, par sa liaison courte ; le chef est relié à lui jusqu\u0027à 6 m","Les deux, chacun par sa liaison personnelle déployée en version longue","Aucun des deux : le binôme explore détaché de la ligne guide"],"r":1,"e":"En mode dissocié, l\u0027équipier est relié à la ligne guide par sa liaison courte et reste en contact immédiat avec elle ; la liaison du chef, reliée à l\u0027équipier, atteint jusqu\u0027à 6 m. Quel que soit le mode, les deux liaisons ne sont pas déployées en version longue en même temps.","ref":"§ 3.3 Ligne de vie « méthode latérale » — p. 40","p":"« en mode dissocié », l\u0027équipier est relié par sa liaison courte à la ligne guide. La liaison du chef est reliée à l\u0027équipier et atteint jusqu\u0027à 6 mètres.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"En méthode circulaire, dans quel cas les deux liaisons personnelles peuvent-elles être déployées dans leur intégralité ?","c":["En cas de présence avérée d\u0027une victime, à titre exceptionnel","Systématiquement, dès que la pièce dépasse la taille d\u0027une chambre","Lorsque la visibilité est bonne et que la pièce est dégagée","Jamais, seule la liaison du chef pouvant être déployée en entier"],"r":0,"e":"En cas de présence avérée d\u0027une victime dans une pièce, les deux liaisons personnelles peuvent exceptionnellement être déployées dans leur intégralité. Cette situation augmente le risque de zones non explorées (zones d\u0027ombre).","ref":"§ 3.4 Ligne de vie « méthode circulaire » — p. 42","p":"En cas de présence avérée d\u0027une victime dans une pièce, Les deux liaisons personnelles peuvent être déployées exceptionnellement dans leur intégralité. Cette situation génère une augmentation du risque de zones non explorées (zones d\u0027ombres).","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et envisagez la méthode AIDES pour explorer une chambre depuis l\u0027extérieur. Quelle condition est impérative ?","c":["La chambre doit avoir au moins deux portes intérieures","L\u0027explorateur doit progresser avec un moyen hydraulique","Le foyer ne doit pas se trouver dans la chambre concernée","L\u0027accès doit obligatoirement se faire au moyen d\u0027un MEA"],"r":2,"e":"La méthode AIDES est conditionnée par une lecture du feu depuis l\u0027extérieur, à l\u0027ouverture de l\u0027ouvrant puis tout au long de l\u0027exploration, et le foyer ne doit pas se trouver dans le local concerné. Elle se pratique sans moyen hydraulique, dans des pièces de surface modérée ne comportant normalement qu\u0027une porte intérieure.","ref":"§ 3.5 La méthode AIDES — p. 43","p":"Cette technique est conditionnée par une lecture du feu depuis l\u0027extérieur, au moment où l\u0027ouvrant est ouvert puis tout au long de l\u0027exploration. Le foyer ne doit pas se trouver dans le local concerné.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques d\u0027engagement","niv":"Chef d\u0027équipe","q":"Dans le compte rendu de fin d\u0027engagement au contrôleur, que recouvre la rubrique « Je redoute » ?","c":["Les accès actuels et possibles","Les actions réalisées par le binôme","Les propositions d\u0027actions à mettre en œuvre","L\u0027évolution du sinistre et ses conséquences"],"r":3,"e":"Associé à un schéma, le compte rendu établi au contrôleur peut se résumer à « J\u0027ai vu » (accès, parcours, niveaux et pièces), « J\u0027ai fait » (actions réalisées), « Je propose » (propositions d\u0027actions) et « Je redoute » (évolution du sinistre et conséquences).","ref":"§ 4 Le retour d\u0027engagement — p. 43","p":"l\u0027évolution du sinistre et les conséquences. Associé à un schéma, ce compte-rendu peut se résumer à : […] « Je redoute » (f).","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Équipier","q":"Qu\u0027est-ce qui caractérise la recherche secondaire de victimes ?","c":["Elle est menée au plus tôt, d\u0027abord aux endroits les plus probables","Elle est menée après la maîtrise du sinistre, de façon approfondie","Elle est limitée aux étages situés sous le niveau du foyer","Elle est confiée au binôme ayant réalisé la recherche primaire"],"r":1,"e":"La recherche secondaire est effectuée après la maîtrise du sinistre et la suppression des dangers : c\u0027est une recherche approfondie pour s\u0027assurer que toutes les victimes ont été retrouvées, menée si possible par des binômes différents de ceux de la recherche primaire. C\u0027est la recherche primaire qui s\u0027effectue au plus tôt.","ref":"§ 1 Les temps de recherche — p. 47","p":"la recherche secondaire est effectuée après la maîtrise du sinistre et la suppression des dangers. […] recherche approfondie pour s\u0027assurer que toutes les victimes ont été retrouvées.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Chef d\u0027équipe","q":"Lorsque la recherche de victimes est menée simultanément à l\u0027extinction, par où commence-t-elle ?","c":["Par la sortie du bâtiment, en progressant vers le foyer","Par les étages inférieurs, les plus faciles à évacuer","À proximité immédiate du foyer, en s\u0027en écartant vers la sortie","Par les pièces les plus éloignées du foyer, donc les moins enfumées"],"r":2,"e":"Lors de missions de recherche menées simultanément aux missions d\u0027extinction, la recherche commence à proximité immédiate du foyer pour s\u0027en écarter et atteindre la sortie du bâtiment. Cette méthode tient compte du niveau de menace du foyer et de sa propagation.","ref":"§ 1 Les temps de recherche — p. 47","p":"Lors de missions de recherche de victimes menées simultanément aux missions d\u0027extinction, la recherche de victimes commence à proximité immédiate du foyer pour s\u0027en écarter et atteindre la sortie du bâtiment.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Équipier","q":"Qu\u0027est-ce qu\u0027un espace d\u0027attente sécurisé (EAS) dans un établissement recevant du public ?","c":["Un local où les sapeurs-pompiers déposent leur matériel pendant l\u0027intervention","Une zone à l\u0027abri des fumées et des flammes où attendre son évacuation","Le poste de sécurité d\u0027où le personnel de l\u0027établissement suit l\u0027évacuation","La zone de stationnement réservée aux engins de secours devant l\u0027établissement"],"r":1,"e":"Un EAS constitue une zone à l\u0027abri des fumées, des flammes et du rayonnement thermique. Toute personne, quel que soit son handicap, doit pouvoir s\u0027y rendre et y attendre son évacuation différée grâce à une aide extérieure. Il est identifié par un balisage spécifique repérable par les secours.","ref":"§ 1 Les temps de recherche — p. 48","p":"Un EAS constitue une zone à l\u0027abri des fumées, des flammes et du rayonnement thermique. Toute personne, quel que soit son handicap, doit pouvoir s\u0027y rendre et y attendre son évacuation différée grâce à une aide extérieure.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu d\u0027appartement dans un immeuble à étages. Dans quel ordre les recherches s\u0027effectuent-elles généralement ?","c":["Étage du feu, étage juste au-dessus, dernier étage, puis les autres","Étage du feu, étage juste au-dessous, rez-de-chaussée, puis les autres","Dernier étage, étage juste au-dessus du feu, étage du feu, puis les autres","Étage juste au-dessus, étage du feu, dernier étage, puis les autres"],"r":0,"e":"En bâtiment avec étages, on recherche d\u0027abord à l\u0027étage du foyer, puis à l\u0027étage directement au-dessus, suivi du dernier étage, niveaux présentant un danger croissant lié au développement de l\u0027incendie ; les étages intermédiaires et inférieurs sont reconnus ensuite.","ref":"§ 2 La conduite des recherches — p. 49","p":"dans un premier temps à l\u0027étage du foyer ; dans un deuxième temps l\u0027étage directement au-dessus est reconnu, suivi ensuite du dernier étage du bâtiment.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Chef d\u0027équipe","q":"Votre binôme explore des pièces envahies de fumées. Quel mode de déplacement le GTO fait-il privilégier ?","c":["À quatre pattes, pour réduire le risque de chute de plain-pied","Debout, pour progresser plus vite et économiser son effort physique","Debout, pour garder une meilleure vue au-dessus des fumées","À plat ventre, pour respirer l\u0027air plus frais au ras du sol"],"r":0,"e":"Selon les conditions à l\u0027intérieur du bâtiment, l\u0027exploration s\u0027effectue debout, accroupi ou à quatre pattes. Le déplacement à quatre pattes réduit le risque de chute de plain-pied et doit être privilégié dès que les pièces sont envahies de fumées.","ref":"§ 2.1 Les déplacements — p. 50","p":"Le déplacement à quatre pattes réduit le risque de chute de plain-pied. Cette position doit être privilégiée dès lors que les pièces sont envahies de fumées.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Équipier","q":"Comment le binôme descend-il un escalier lors d\u0027une exploration en milieu enfumé ?","c":["Face à la pente, en tenant la main courante","Assis, en glissant d\u0027une marche à l\u0027autre","Face à la pente, à quatre pattes, tête en avant","En marche arrière, pour limiter les risques de chute"],"r":3,"e":"Le guide précise que la descente d\u0027un escalier se fait en marche arrière, pour limiter les risques de chute. Selon les conditions à l\u0027intérieur du bâtiment, l\u0027exploration s\u0027effectue par ailleurs debout, accroupi ou à quatre pattes.","ref":"§ 2.1 Les déplacements — p. 50","p":"La descente d\u0027un escalier se fait en marche arrière pour limiter les risques de chute.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Chef d\u0027équipe","q":"Avant tout engagement en recherche de victimes, que doit définir le binôme pour garder un repère dans l\u0027espace reconnu ?","c":["Le sens de reconnaissance, main gauche ou main droite","Le nombre de pièces à reconnaître avant de ressortir","L\u0027ordre de passage des deux porteurs dans chaque pièce","Un point de rendez-vous en cas de séparation du binôme"],"r":0,"e":"Pour réduire la désorientation et le stress, le sens de reconnaissance (« main gauche » ou « main droite ») est défini au sein du binôme avant tout engagement, et le binôme longe le mur du côté choisi. Le chef d\u0027agrès en est informé, ce qui permet de localiser le binôme en cas de problème.","ref":"§ 2.2 La progression — p. 50","p":"avant tout engagement, « le sens » de reconnaissance doit être défini au sein du binôme : « main gauche » ou « main droite ». […] Les binômes longent le mur du côté choisi.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Équipier","q":"Où le marquage des pièces reconnues est-il à privilégier ?","c":["En partie haute, pour être vu de loin par les autres binômes","Au centre de la porte, à hauteur des yeux d\u0027un porteur debout","En partie basse, pour rester visible en cas d\u0027enfumage","Sur le sol devant la porte, à l\u0027aide d\u0027une craie grasse"],"r":2,"e":"Le marquage est à privilégier en partie basse de la zone d\u0027écriture, afin de rester visible en cas d\u0027envahissement des circulations par les fumées. Il précise l\u0027avancée des reconnaissances et évite une perte de temps par répétition.","ref":"§ 2.3 Le marquage — p. 51","p":"ce marquage est à privilégier en partie basse de la zone d\u0027écriture, de façon à rester visible en cas d\u0027envahissement éventuel des circulations par les fumées.","s":"gto-ari"},
{"t":"gto-sauv","ch":"ARI : techniques de recherche","niv":"Chef d\u0027équipe","q":"Le binôme découvre une victime à évacuer sous cagoule d\u0027évacuation. À qui le guide recommande-t-il de confier cette mission ?","c":["Au chef de binôme, responsable de la victime","Au sauveteur le plus proche de la sortie","Au binôme de sécurité, seul habilité à évacuer une victime","Au sauveteur disposant de la plus grande autonomie"],"r":3,"e":"En cas de découverte d\u0027une victime, la mission est affectée au sauveteur disposant de la plus grande autonomie. Il prend contact avec la victime, lui explique la procédure, l\u0027équipe de la cagoule et l\u0027évacue vers un lieu protégé des effets du sinistre.","ref":"§ 3 La découverte de victime — p. 51","p":"Dans tous les cas, il convient d\u0027affecter cette mission au sauveteur disposant de la plus grande autonomie","s":"gto-ari"},
{"t":"gdo-fum","ch":"Composition des fumées","niv":"Équipier","q":"Lors d\u0027une reconnaissance, le binôme observe une fumée blanche. Que dit le guide de sa dangerosité ?","c":["Comme la fumée grise ou noire, elle est particulièrement dangereuse pour la santé","Elle est sans danger, car une fumée blanche n\u0027est que de la vapeur d\u0027eau","Elle ne devient dangereuse que lorsqu\u0027elle s\u0027épaissit et qu\u0027elle vire au gris ou au noir","Elle ne menace que les victimes, pas les intervenants équipés"],"r":0,"e":"Selon le guide, la fumée, qu\u0027elle soit blanche (riche en aérosols ou en vapeur d\u0027eau), grise (aérosols et particules solides) ou noire (grosses particules solides), est particulièrement dangereuse pour la santé. Une fumée blanche n\u0027est donc jamais anodine.","ref":"§ Introduction, caractéristiques des fumées (chap. 1) — p. 13","p":"La fumée, qu\u0027elle soit blanche (riche en aérosols ou en vapeur d\u0027eau…), grise (mélange d\u0027aérosols et de particules solides) ou noire (grosses particules solides est particulièrement dangereuse pour la santé.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Composition des fumées","niv":"Équipier","q":"Selon le guide, en quelles deux catégories peut-on classer les composés et produits de décomposition formés lors d\u0027un incendie ?","c":["Les gaz asphyxiants et les gaz irritants","Les particules lourdes et les particules légères","Les composés organiques et les composés minéraux","Les gaz chauds et les gaz froids de la couche de fumée"],"r":2,"e":"Le guide classe ces composés en deux catégories : les composés organiques, à squelette carboné (dont les COV et les HAP), et les composés minéraux ou inorganiques (métaux et leurs dérivés, composés simples du carbone comme le monoxyde de carbone).","ref":"§ 1.1 Produits de combustion des incendies de structures (chap. 1) — p. 14","p":"Les composés ou les produits de décomposition formés lors d\u0027un incendie peuvent être classés en deux catégories : les composés organiques et les composés minéraux, ou inorganiques.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Composition des fumées","niv":"Équipier","q":"Le guide évoque les HAP présents dans les fumées d\u0027incendie. De quoi s\u0027agit-il ?","c":["Des hydrates d\u0027azote et de phosphore, sans danger une fois refroidis","Des gaz asphyxiants plus légers que l\u0027air, accumulés en partie haute","Des additifs ignifugeants qui retardent le feu","Des hydrocarbures aromatiques polycycliques composant les suies"],"r":3,"e":"Les HAP (hydrocarbures aromatiques polycycliques) sont des molécules de benzène fusionnées appartenant aux COV ; les incendies produisent des suies qui en sont composées. Ils proviennent surtout de la pyrolyse de matières organiques et des imbrûlés, et, du fait de leur fort pouvoir d\u0027adsorption, de nombreux toxiques peuvent y être piégés.","ref":"§ 1.1 Produits de combustion des incendies de structures (chap. 1) — p. 14","p":"Les incendies produisent, également des suies composées d\u0027hydrocarbures aromatiques polycycliques (HAP) qui sont des molécules de benzène fusionnées et appartiennent à l\u0027ensemble des COV.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Composition des fumées","niv":"Équipier","q":"Sur un feu d\u0027espaces naturels, que dit le guide des suies émises par la combustion des végétaux ?","c":["Elles sont inoffensives, car issues de matières végétales naturelles","Elles se limitent aux cendres minérales laissées par les résidus","Elles ont les mêmes caractéristiques qu\u0027en feu de structure","Elles sont absentes, la combustion étant complète"],"r":2,"e":"Les suies figurent parmi les substances majoritairement libérées par la combustion des végétaux, et le guide précise qu\u0027elles ont les mêmes caractéristiques que celles des incendies de structure. Elles ne se confondent pas avec les cendres, issues des matières minérales du végétal.","ref":"§ 1.2 Feux de forêts et d\u0027espaces naturels (chap. 1) — p. 17","p":"Ces suies sont de mêmes caractéristiques que celles rencontrées dans les incendies de structure.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Exposition et désorption","niv":"Équipier","q":"Un sapeur-pompier resté hors de la zone « sale » aide un collègue à retirer sa tenue souillée. Comment le guide qualifie-t-il son exposition ?","c":["Une exposition indirecte, dite croisée","Une exposition directe, par inhalation","Une exposition directe, par ingestion","Aucune exposition, faute de fumée"],"r":0,"e":"L\u0027exposition indirecte ou croisée touche un personnel initialement isolé de la zone sale qui s\u0027expose aux polluants par un vecteur intermédiaire pollué. Le guide cite justement l\u0027aide au déshabillage et le rangement de matériel souillé.","ref":"§ 2 L\u0027exposition des personnels (chap. 1) — p. 18","p":"indirecte ou (croisée) : lorsqu\u0027un personnel, initialement isolé de la zone sale, s\u0027expose aux polluants par un vecteur intermédiaire pollué, comme un élément ou un objet. Par exemple, lorsque le sapeur-pompier aide au déshabillage ou range du matériel souillé.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Exposition et désorption","niv":"Équipier","q":"Les résidus de combustion se fixent sur les EPI par absorption ou par adsorption. Comment le guide définit-il l\u0027adsorption ?","c":["La pénétration d\u0027un composé dans un milieu, comme un textile","Le relargage d\u0027un composé auparavant piégé","La transformation d\u0027un composé sous l\u0027effet de la chaleur","La fixation d\u0027un composé sur une surface solide"],"r":3,"e":"L\u0027adsorption est la rétention d\u0027un composé par une surface ; elle explique par exemple la présence de toxiques à la surface des suies ou sur les fibres textiles et les cheveux. La pénétration dans un milieu correspond à l\u0027absorption, le relargage à la désorption.","ref":"§ 2.1.2 L\u0027adsorption (chap. 1) — p. 18","p":"L\u0027adsorption est un phénomène physico-chimique selon lequel un composé se fixe sur une surface solide. Il s\u0027agit donc de la rétention d\u0027un composé par une surface.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Exposition et désorption","niv":"Chef d\u0027équipe","q":"Un équipier de votre binôme juge sa tenue souillée sans risque une fois l\u0027intervention terminée. Pourquoi a-t-il tort selon le guide ?","c":["Parce que les toxiques ne s\u0027en échappent qu\u0027au lavage en machine","Parce que la désorption ne débute qu\u0027après plusieurs jours","Parce que les toxiques fixés continuent ensuite de se désorber","Parce que seule l\u0027humidité de la tenue libère les toxiques fixés"],"r":2,"e":"Les EPI exposés retiennent les toxiques par absorption et adsorption. La désorption, phénomène inverse, a lieu immédiatement ou à plus long terme : les produits et résidus de combustion s\u0027évaporent ou peuvent être déplacés par contact direct.","ref":"§ 2.2 La désorption (chap. 1) — p. 19","p":"Par la suite, les produits et résidus de combustion désorbent, s\u0027évaporent suivant leur volatilité, ou peuvent aussi être déplacés par contact direct.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Exposition et désorption","niv":"Chef d\u0027équipe","q":"Selon le guide, de quelle propriété des toxiques piégés sur les EPI et les matériels dépend leur désorption ?","c":["De leur odeur","De leur volatilité","De leur couleur","De leur dangerosité"],"r":1,"e":"La désorption dépend de la volatilité des toxiques : les plus volatils sont rapidement désorbés, les produits non volatils restent en surface. Elle peut avoir lieu immédiatement ou à plus long terme, la température intervenant aussi.","ref":"§ 2.2 La désorption (chap. 1) — p. 20","p":"Cette désorption dépend de la volatilité des toxiques. Les plus volatils sont rapidement désorbés. Les produits non volatils restent sur la surface.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Voies de pénétration","niv":"Équipier","q":"Pourquoi les particules les plus fines contenues dans les fumées sont-elles particulièrement préoccupantes en cas d\u0027inhalation ?","c":["Parce qu\u0027elles sont plus lourdes que l\u0027air et s\u0027accumulent au ras du sol","Parce qu\u0027elles pénètrent plus profondément dans l\u0027appareil pulmonaire","Parce qu\u0027elles encrassent les filtres à air des engins","Parce qu\u0027elles sont visibles de loin et signalent le sinistre au voisinage"],"r":1,"e":"Les fumées sont chargées de particules grossières et fines. Lors de l\u0027inhalation, voie de pénétration la plus connue, les particules peuvent atteindre des organes cibles selon leur dimension : plus elles sont fines, plus elles pénètrent profondément dans l\u0027appareil pulmonaire.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 20","p":"En fonction de leur dimension, les particules peuvent pénétrer et atteindre des organes cibles. Plus les particules sont fines, plus elles pénètrent profondément dans l\u0027appareil pulmonaire.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Voies de pénétration","niv":"Équipier","q":"Pendant une pause, un sapeur-pompier tient son sandwich avec des gants pleins de suie. Par quelle voie la suie déposée sur le sandwich pénètre-t-elle dans son organisme ?","c":["L\u0027inhalation","La voie percutanée","La voie oculaire","L\u0027ingestion"],"r":3,"e":"Manger de la nourriture polluée par ses mains ou des gants pleins de suie est un exemple d\u0027exposition directe cité par le guide : les particules entrent alors par ingestion, notamment lors des phases de repos où l\u0027on s\u0027hydrate et se restaure.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 20","p":"Ces particules peuvent aussi entrer dans l\u0027organisme par ingestion lors des phases de repos (exemple : en s\u0027hydratant et/ou en se restaurant).","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Voies de pénétration","niv":"Équipier","q":"Pourquoi le guide attire-t-il l\u0027attention sur les intoxications par voies percutanée et oculaire ?","c":["Elles ne concernent que la phase d\u0027attaque, sous les fumées","Elles ne surviennent qu\u0027en cas de brûlure de la peau ou des yeux","Souvent omises, elles sont souvent les voies privilégiées hors attaque","Elles irritent la peau et les yeux mais ne transportent rien vers le sang"],"r":2,"e":"Les intoxications percutanée et oculaire peuvent transporter molécules et particules vers le sang. Souvent ignorées ou omises, elles sont pourtant souvent les voies privilégiées des polluants en dehors de la phase d\u0027attaque (reconditionnement des matériels, restauration, hydratation).","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 21","p":"Elle peut transporter vers le sang des molécules et particules. Ces deux derniers modes de pénétrations sont souvent ignorés ou omis, alors qu\u0027ils sont souvent les voies privilégiées des polluants en dehors de la phase d\u0027attaque","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Voies de pénétration","niv":"Équipier","q":"Durant les opérations de lutte contre l\u0027incendie, quelles conditions favorisent l\u0027intoxication percutanée selon le guide ?","c":["Le froid et la sécheresse de la peau, qui la fragilisent","Une respiration lente et profonde sous le masque de l\u0027ARI","L\u0027effort physique réduit, qui ralentit la circulation sanguine","La hausse de la température corporelle et l\u0027humidité de la peau"],"r":3,"e":"Le guide cite plusieurs conditions favorisant l\u0027intoxication percutanée : l\u0027élévation de la température corporelle augmente le taux d\u0027absorption, l\u0027humidité de la peau prolonge la rétention des contaminants et la transpiration crée un « micro climat » à l\u0027intérieur des EPI.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 21","p":"la température : une élévation de la température corporelle augmente le taux d\u0027absorption ; l\u0027humidité de la peau : elle augmente considérablement le temps de rétention des contaminants à la surface de la peau","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Voies de pénétration","niv":"Équipier","q":"Le guide cite deux zones de contact plus sensibles à la pénétration cutanée des toxiques, du fait de la finesse de la peau. Lesquelles ?","c":["Le visage et le cou","Le torse et le ventre","Les avant-bras et les mollets","Les cuisses et le haut des bras"],"r":0,"e":"Parmi les conditions favorisant l\u0027intoxication percutanée, le guide cite les zones de contact : le visage et le cou sont plus sensibles à la pénétration cutanée en raison de la finesse de la peau. Sous la douche, il faut d\u0027ailleurs insister sur le brossage du cou.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 21","p":"les zones de contact : le visage et le cou sont plus sensibles à la pénétration cutanée, au regard de la finesse de la peau.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Effets et appréciation du risque","niv":"Équipier","q":"Selon le tableau des effets des agents toxiques du guide, quel type d\u0027atteinte le monoxyde de carbone (CO) provoque-t-il ?","c":["Une hypoxie générale du système nerveux central et du cœur","Une irritation des muqueuses du nez, de la gorge et des yeux","Une atteinte pulmonaire, oculaire et cutanée par contact","Une atteinte limitée à la peau, sous forme de brûlures chimiques"],"r":0,"e":"Le tableau des agents toxiques associe au monoxyde de carbone une hypoxie générale du système nerveux central et du cœur. Les atteintes pulmonaires, oculaires et cutanées y sont attribuées à d\u0027autres agents, comme les isocyanates.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 21","p":"Monoxyde de carbone hypoxie générale du système nerveux central et du cœur","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Effets et appréciation du risque","niv":"Équipier","q":"Selon le tableau des effets des agents toxiques du guide, quel effet l\u0027acide cyanhydrique (HCN) provoque-t-il ?","c":["Une narcose","Une asphyxie","Une irritation des muqueuses","Une atteinte oculaire"],"r":1,"e":"Dans le tableau des agents toxiques, l\u0027acide cyanhydrique est associé à l\u0027asphyxie, tandis que la narcose est attribuée au dioxyde de carbone. L\u0027asphyxie fait partie des effets aigus, qui se font sentir dans un temps relativement court.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 21","p":"Dioxyde de carbone narcose Acide cyanhydrique asphyxie","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Effets et appréciation du risque","niv":"Équipier","q":"Le guide distingue les effets aigus et les effets chroniques des polluants. Comment définit-il un effet chronique ?","c":["Un effet ressenti dans un délai court : minutes, heures ou jours","Un effet provoqué par une exposition unique très intense","Un effet limité à l\u0027hypoxie ou à l\u0027asphyxie en intervention","Un effet qui n\u0027apparaît qu\u0027après une exposition longue et répétée"],"r":3,"e":"Un effet chronique ne se manifeste qu\u0027après un temps d\u0027exposition relativement long, de façon régulière ou répétitive (semaines, mois, années). À l\u0027inverse, un effet aigu se fait sentir dans un temps relativement court (minutes, heures, jours), comme l\u0027hypoxie, les irritations ou l\u0027asphyxie.","ref":"§ 2.3 Les voies de pénétration (chap. 1) — p. 22","p":"un effet chronique ne se manifeste qu\u0027après un temps d\u0027exposition relativement long et de façon régulière ou répétitive (semaines, mois, années).","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Effets et appréciation du risque","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et COS. Sur quels trois facteurs principaux repose l\u0027appréciation du risque lié à l\u0027exposition aux fumées ?","c":["La couleur, l\u0027odeur et l\u0027opacité des fumées","La surface en feu, le nombre d\u0027engins engagés et la météo","La fréquence, la durée et l\u0027intensité de l\u0027exposition","L\u0027âge, l\u0027ancienneté et le grade des intervenants"],"r":2,"e":"L\u0027appréciation du risque repose sur la fréquence, la durée et l\u0027intensité de l\u0027exposition. Ces facteurs sont confrontés aux caractéristiques de la situation, le COS adaptant les mesures à l\u0027urgence ou au contexte de l\u0027intervention.","ref":"§ 3 L\u0027appréciation des risques (chap. 1) — p. 22","p":"L\u0027appréciation du risque repose sur trois facteurs principaux que sont : la fréquence ; la durée ; l\u0027intensité de cette exposition.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Équipier","q":"À partir de quand les règles de prévention et bonnes pratiques liées à la toxicité des fumées doivent-elles être abordées en formation ?","c":["Au stage de chef d\u0027agrès","Uniquement en formation des formateurs","Dès les formations initiales","Après la première intervention sur feu"],"r":2,"e":"Les règles de prévention et les bonnes pratiques doivent être abordées dans les formations incendie dès les formations initiales. Les sapeurs-pompiers doivent être sensibilisés et formés aux risques encourus, à l\u0027utilisation et à l\u0027entretien des moyens de protection et aux règles d\u0027hygiène.","ref":"§ 1 Une évolution nécessaire de la culture (chap. 2) — p. 23","p":"Les règles de prévention et les bonnes pratiques doivent être abordées au cours des formations suivies par les sapeurs-pompiers dans le domaine de l\u0027incendie et ce, dès les formations initiales.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Équipier","q":"Selon le guide, quelle responsabilité chaque sapeur-pompier porte-t-il face aux risques liés à la toxicité des fumées ?","c":["Aucune : la prévention relève uniquement de son employeur","Celle de sa santé et de sa sécurité, et envers ses collègues","Celle de sa seule santé, la sécurité des collègues relevant du chef","Celle de signaler ses symptômes, le reste relevant du service de santé"],"r":1,"e":"Au-delà des obligations du service employeur, chaque sapeur-pompier est responsable de sa propre sécurité et de sa santé, et l\u0027est également vis-à-vis de ses collègues dans le cadre d\u0027une prévention collective. L\u0027hygiène et la bonne santé physique sont primordiales pour sa protection.","ref":"§ 1 Une évolution nécessaire de la culture (chap. 2) — p. 23","p":"chaque sapeur-pompier est responsable de sa propre sécurité et de sa santé. Il l\u0027est également, vis-à-vis de ses collègues dans le cadre d\u0027une prévention collective.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Équipier","q":"Un équipier porte la cagoule de protection filtrante pendant la surveillance d\u0027un feu. Selon le guide, contre quoi cette cagoule est-elle sans effet ?","c":["Les suies","Les gaz","Les particules fines","La chaleur"],"r":1,"e":"La cagoule de protection filtrante protège du risque thermique et prévient la pollution par les suies et certaines particules fines, en dehors des phases nécessitant le port d\u0027un ARI. Le guide précise en revanche qu\u0027elle ne filtre pas les gaz.","ref":"§ 3.1 La cagoule de protection filtrante (chap. 2) — p. 29","p":"Cette cagoule ne filtre pas les gaz","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Équipier","q":"Pourquoi le guide impose-t-il de porter le masque de protection respiratoire de l\u0027ARI sur une peau rasée ?","c":["Pour garantir son étanchéité et prévenir les fuites","Pour limiter les irritations dues à la chaleur du masque","Pour faciliter le nettoyage du visage après le feu","Pour respecter une règle de présentation en service"],"r":0,"e":"Les notices d\u0027ARI demandent de vérifier qu\u0027aucun cheveu n\u0027est bloqué entre le masque et le visage et que l\u0027étanchéité n\u0027est pas affectée par une barbe, des favoris ou des branches de lunettes. Pour garantir une étanchéité optimale et prévenir des fuites dangereuses, le masque doit être porté sur une peau rasée.","ref":"§ 3.1.3 Exigences de santé et de sécurité des EPI (chap. 2) — p. 32","p":"Afin de garantir une étanchéité optimale et prévenir les fuites de nature à mettre en danger le sapeur-pompier, le masque de protection respiratoire d\u0027un ARI doit être porté sur une peau rasée","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Chef d\u0027équipe","q":"Quel suivi médical le guide préconise-t-il pour les formateurs utilisant régulièrement des outils de formation à feux réels ?","c":["Un suivi identique à celui des autres sapeurs-pompiers","Une visite médicale seulement après une intoxication","Un bilan médical unique, lors de l\u0027habilitation","Un suivi médical renforcé, à périodicité annuelle"],"r":3,"e":"En raison d\u0027une exposition aux fumées plus longue et plus fréquente, le guide propose pour ces formateurs un suivi médical renforcé à périodicité annuelle, avec le cas échéant des examens complémentaires, ainsi qu\u0027une liste de formateurs autorisés à utiliser les simulateurs.","ref":"§ 4 Formateurs réguliers avec feux réels (chap. 2) — p. 33","p":"un suivi médical renforcé avec une périodicité annuelle, avec le cas échéant des examens complémentaires","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Chef d\u0027équipe","q":"Le guide préconise un carnet de suivi des activités de brûlage pour les formateurs utilisant des simulateurs à feux réels. Quel en est le but ?","c":["Répertorier leurs activités et leur temps d\u0027exposition aux fumées","Justifier le versement d\u0027indemnités liées aux séances de brûlage réalisées","Planifier le réapprovisionnement en combustible des simulateurs","Évaluer les stagiaires sur leur lecture du feu en caisson"],"r":0,"e":"Le carnet de suivi répertorie toutes les activités réalisées par le formateur (passage en caisson, outils taille réduite…) et permet de connaître son temps d\u0027exposition aux fumées et au flux thermique. Ces préconisations tiennent à la durée et à la fréquence d\u0027exposition plus importantes des formateurs.","ref":"§ 4 Formateurs réguliers avec feux réels (chap. 2) — p. 33","p":"Ce carnet à pour but de répertorier toutes les activités réalisées par le formateur (Passage en caisson, utilisation des outils taille réduite, etc.) et disposer du temps d\u0027exposition aux fumées et au flux thermique auquel il a été confronté","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Équipier","q":"Après un exercice en caisson avec feu réel, à quel moment et où le guide préconise-t-il de mener l\u0027entretien d\u0027explication ?","c":["Dès la sortie du caisson, en tenue, sans attendre","Dans le caisson refroidi, devant les traces du feu","Après retrait des EPI et nettoyage de la peau, loin du brûlage","En salle de cours, tenue de feu conservée pour aller vite"],"r":2,"e":"Formateurs et stagiaires mènent l\u0027entretien d\u0027explication après avoir retiré leurs EPI et nettoyé les parties de peau souillées (lingettes ou eau froide savonneuse), dans un espace tenu à distance de la zone de brûlage.","ref":"§ 4 Formateurs réguliers avec feux réels (chap. 2) — p. 33","p":"réaliser des d\u0027entretien d\u0027explication après avoir retiré les EPI, s\u0027être nettoyé les parties de peau souillées (lingettes ou eau froide savonneuse) et dans un espace tenu à distance de la zone de brûlage","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Avant l\u0027opération","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Lors de la vérification de l\u0027engin, on vous signale une odeur de fumée persistante dans la cabine. Que préconise le guide ?","c":["Faire réaliser une action de nettoyage de la cabine","Ne rien faire, l\u0027odeur n\u0027étant qu\u0027une gêne sans risque","Masquer l\u0027odeur avec un désodorisant","Signaler l\u0027odeur lors de la prochaine révision annuelle"],"r":0,"e":"Au quotidien, le guide prévoit le nettoyage périodique des casiers et de la cabine des véhicules incendie, ainsi que la vérification des véhicules avec des gants. La persistance d\u0027une odeur de fumée dans les locaux ou dans les engins doit inciter à réaliser une action de nettoyage.","ref":"§ 5 Avant l\u0027intervention (chap. 2) — p. 34","p":"A ce titre, la persistance d\u0027une odeur de fumée dans les locaux ou dans les engins doit inciter à réaliser une action de nettoyage.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et construisez votre idée de manœuvre sur un incendie. Quel principe d\u0027exposition des personnels aux fumées le guide retient-il ?","c":["L\u0027exposition maximale tolérée, jusqu\u0027à l\u0027apparition des premiers symptômes","L\u0027exposition libre, chaque intervenant gérant lui-même son temps sous fumées","L\u0027exposition nulle, aucun engagement en milieu enfumé n\u0027étant admis","L\u0027exposition au juste besoin, aussi basse que raisonnablement possible"],"r":3,"e":"D\u0027un point de vue doctrinal, le guide retient le principe du juste besoin d\u0027exposition, en transposant le principe ALARA (aussi bas que raisonnablement possible). Tous les COS, dès le chef d\u0027agrès, intègrent dans leurs idées de manœuvre, autant que faire se peut, l\u0027exposition limitée des personnels aux fumées.","ref":"§ Introduction, principe du juste besoin (chap. 3) — p. 35","p":"D\u0027un point de vue doctrinal, il faut retenir le principe du juste besoin d\u0027exposition lors de la lutte contre les incendies. A ce titre, le principe ALARA (As Low As Reasonably Achievable c.-à-d. Aussi bas que raisonnablement possible)","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. À l\u0027arrivée sur les lieux d\u0027un incendie, comment le guide préconise-t-il de stationner les engins ?","c":["Vitres ouvertes, pour entendre l\u0027environnement","Vitres et ventilations fermées, même hors de la zone enfumée","Ventilation de cabine en marche, pour évacuer la chaleur","Portes ouvertes, pour faciliter le déchargement du matériel"],"r":1,"e":"À l\u0027arrivée des secours, le guide demande de privilégier un stationnement des engins vitres et ventilations fermées, et ce même en dehors de la zone d\u0027exposition aux fumées. Ouvrir les vitres ou faire tourner la ventilation de cabine va donc à l\u0027encontre de cette mesure.","ref":"§ 1.1 L\u0027arrivée sur les lieux (chap. 3) — p. 35","p":"A l\u0027arrivée des secours, un stationnement des engins avec vitres et ventilations fermées doit être privilégié même en dehors de la zone d\u0027exposition aux fumées.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027équipe","q":"Avant de s\u0027engager dans une zone exposée aux fumées, comment les personnels s\u0027assurent-ils du bon positionnement de leurs EPI ?","c":["Par un auto-contrôle, chacun vérifiant seul sa propre tenue","Par la seule vérification faite lors de la prise de garde","Par un contrôle limité au seul masque de l\u0027ARI","Par un contrôle croisé, attentif aux jonctions entre équipements"],"r":3,"e":"Avant l\u0027engagement dans des zones exposées aux fumées, les personnels s\u0027assurent par un contrôle croisé du bon positionnement de leurs EPI, en portant une attention particulière aux jonctions entre équipements. Les COS veillent par ailleurs au port complet des EPI (veste, pantalon, cagoule, gants, casque, protection respiratoire…).","ref":"§ 1.1 L\u0027arrivée sur les lieux (chap. 3) — p. 36","p":"Les personnels, avant l\u0027engagement dans des zones exposées aux fumées s\u0027assurent par un contrôle croisé du bon positionnement des équipements de protection individuelles, en portant une attention particulière sur les jonctions entre les équipements.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027équipe","q":"Le feu est éteint et le binôme entame le déblai et le dégarnissage. Que prévoit le guide en matière de protection des personnels ?","c":["Le retrait des protections respiratoires, le risque ayant cessé avec l\u0027extinction","Le port obligatoire d\u0027une protection respiratoire, cutanée et oculaire adaptée","Le port d\u0027une protection respiratoire seulement en cas de reprise du feu","Le port de gants seuls, les fumées résiduelles n\u0027étant plus toxiques"],"r":1,"e":"Le guide rend obligatoire le port d\u0027une protection respiratoire, cutanée et oculaire adaptée au-delà de la phase d\u0027attaque, en particulier lors du déblai et du dégarnissage. Le COS fait respecter le port des protections adaptées dans toutes les zones, de la reconnaissance jusqu\u0027au déblai.","ref":"§ 1.1 L\u0027arrivée sur les lieux (chap. 3) — p. 36","p":"Le port d\u0027une protection respiratoire, cutanée et oculaire adaptée est obligatoire au-delà de la phase d\u0027attaque en particulier lors des phases de déblai et dégarnissage.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu d\u0027habitation. À quel moment le zonage lié à la toxicité des fumées peut-il être mis en place selon le guide ?","c":["Avant tout engagement, dès l\u0027arrivée du premier engin","Uniquement après l\u0027extinction complète du foyer","Après les premières réactions immédiates","Sur demande du service de santé"],"r":2,"e":"Le zonage lié à la toxicité des fumées peut être mis en place après les premières réactions immédiates. Il est adaptable aux conditions de l\u0027intervention et aux moyens disponibles, et se matérialise par exemple par de la rubalise, des balises lumineuses, des panneaux ou la désignation d\u0027un contrôleur.","ref":"§ 1.2 Sur les lieux de l\u0027intervention (chap. 3) — p. 36","p":"Le zonage concernant la toxicité des fumées peut être mis en place après les premières réactions immédiates, il peut être matérialisé de plusieurs façons","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027équipe","q":"Le feu est éteint. Un équipier veut retirer son ARI alors qu\u0027il travaille encore en zone d\u0027exclusion. Que prévoit le guide ?","c":["Il peut le retirer dès que les flammes ont disparu du local","Il doit le garder jusqu\u0027à ce que les fumées s\u0027éclaircissent","Il doit le garder en permanence jusqu\u0027à la fin de l\u0027opération","Il peut le retirer si le COS l\u0027y autorise"],"r":2,"e":"Le COS peut ajuster les conditions de port des EPI selon son analyse des risques, sauf en zone d\u0027exclusion : celle-ci nécessite un port permanent de l\u0027ARI jusqu\u0027à la fin de l\u0027opération, même une fois les flammes disparues ou les fumées éclaircies.","ref":"§ 1.2 Sur les lieux de l\u0027intervention (chap. 3) — p. 36","p":"Il peut ajuster les conditions de port des EPI en fonction de son analyse des risques sauf en zone d\u0027exclusion qui nécessite un port permanent de l\u0027ARI jusqu\u0027à la fin de l\u0027opération.","s":"gdo-fum"},
{"t":"gdo-fum","ch":"Arrivée et zone d\u0027intervention","niv":"Chef d\u0027équipe","q":"Le feu est éteint. Votre binôme doit bâcher, assécher et déplacer du mobilier dans le local sinistré. Que prévoit le guide face au risque toxique ?","c":["Lever toute précaution, le risque cessant avec les flammes","Conserver la vigilance, même lors de ces opérations de protection","Retirer les EPI, ces tâches n\u0027exposant plus aux fumées","Ne garder que le casque, contre les chutes d\u0027objets"],"r":1,"e":"Le guide demande de conserver la vigilance même lors des opérations de protection (assèchement, bâchage, déplacement de mobilier) ou de consolidation d\u0027ouvrage (étaiement, reconnaissance structurelle). Le port d\u0027une protection respiratoire, cutanée et oculaire adaptée reste obligatoire au-delà de la phase d\u0027attaque.","ref":"§ 1.2 Sur les lieux de l\u0027intervention (chap. 3) — p. 36","p":"Une vigilance doit être conservée même lors des opérations de protection (assèchement, bâchage, déplacement de mobilier…) ou de consolidation d\u0027ouvrage (étaiement, reconnaissance structurelle, …).","s":"gdo-fum"},
