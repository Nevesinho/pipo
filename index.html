<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>P.I.P.O</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : écran unique type « fiche de manœuvre » — en-tête à bande rétro-réfléchissante, contenu centré 640px, actions en bas */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#e9ecf2; --fg:#141a26; --muted:#5b6478; --line:#d7dbe3;
  --accent:#1d3f8a; --accent-fg:#ffffff; --stripe:#ffcf1f;
  --ok:#1f7a3f; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#8a5a00; --warn-bg:#fff3d1;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1b2130; --sunk:#151a26; --fg:#eef0f5; --muted:#9aa3b8; --line:#2f3749;
  --accent:#ffd23f; --accent-fg:#141a26; --stripe:#ffd23f;
  --ok:#5fd38a; --ok-bg:#17301f; --bad:#ff7b72; --bad-bg:#3a1c1a; --warn:#ffc857; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1b2130; --sunk:#151a26; --fg:#eef0f5; --muted:#9aa3b8; --line:#2f3749;
  --accent:#ffd23f; --accent-fg:#141a26; --stripe:#ffd23f;
  --ok:#5fd38a; --ok-bg:#17301f; --bad:#ff7b72; --bad-bg:#3a1c1a; --warn:#ffc857; --warn-bg:#3a2e12; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:0 32px;padding-inline:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:4px solid var(--stripe);box-shadow:0 1px 0 var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;background:none;border:0;color:inherit;padding:0;font:inherit;min-width:0;text-align:left}
.brand h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.3rem;line-height:1.1;margin:0;letter-spacing:.04em;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:.62rem;line-height:1.3;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hd-actions{display:flex;gap:6px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:8px;cursor:pointer;min-height:44px;text-align:center}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.chip:focus-visible,.link:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.btn .n{font-family:var(--mono);font-weight:500;font-size:.8rem;opacity:.85}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h2{font-family:var(--display);font-stretch:125%;font-weight:700;font-size:1.4rem;margin:24px 0 8px;text-wrap:balance}
h3{font-family:var(--display);font-stretch:125%;font-weight:700;font-size:1.05rem;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-stretch:125%;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.today{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--stripe);border-radius:12px;padding:14px 16px;margin:16px 0}
.today p{margin:0;color:var(--muted);font-size:.9rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 24px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.themes{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.card .nom{font-weight:600;min-width:0}
.card .sub{font-size:.8rem;color:var(--muted);grid-column:1}
.card .pct{font-family:var(--mono);font-size:.9rem;grid-row:1/3;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1/3}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.progress{display:flex;align-items:center;gap:12px;margin:16px 0 8px;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{flex:1;grid-column:auto}
.progress .bar i{background:var(--accent)}
.timer{color:var(--fg)}
.timer.low{color:var(--bad)}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.qbox .eyebrow{margin-bottom:8px}
.question{font-size:1.1rem;font-weight:600;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit;width:100%;min-width:0}
.opt .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);flex:0 0 1.4em;padding-top:2px}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:14px 16px;margin-top:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.feedback.good{border-color:var(--ok)} .feedback.bad{border-color:var(--bad)}
.feedback .verdict{font-family:var(--display);font-stretch:125%;font-weight:700;margin:0}
.feedback.good .verdict{color:var(--ok)} .feedback.bad .verdict{color:var(--bad)}
.feedback p{margin:0}
.proof{margin:0;padding:8px 12px;border-left:3px solid var(--stripe);background:var(--sunk);border-radius:0 8px 8px 0;font-size:.9rem;color:var(--fg)}
.proof .eyebrow{display:block;margin-bottom:2px}
.ref{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.fb-tools{display:flex;gap:16px;flex-wrap:wrap}
.flagform{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.flagform select,.flagform textarea,.search{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.flagform textarea{min-height:70px;resize:vertical}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1;min-width:140px}
.result{text-align:center;padding:24px 0 8px}
.result .score{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:3.5rem;line-height:1;font-variant-numeric:tabular-nums}
.result .score small{font-size:1.2rem;color:var(--muted);font-weight:700}
.result .note{font-family:var(--mono);font-size:.95rem;margin-top:8px}
.review{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.review .item.ok{border-left-color:var(--ok)}
.review .item p{margin:0}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer}
.flash .side{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .answer{font-weight:600;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.fiche ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.fiche li{display:grid;gap:2px;padding-left:14px;border-left:2px solid var(--line)}
.fiche li b{font-weight:600}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.boxes{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0 4px}
.boxes i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:24px}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:10;max-width:calc(100% - 32px)}
mark{background:var(--warn-bg);color:inherit;padding:0 2px;border-radius:2px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header><div class="wrap">
  <button class="brand" id="home-btn" type="button"><h1>P.I.P.O</h1><small>Programme Interactif pour Pompier Organisé</small></button>
  <div class="hd-actions">
    <button class="btn ghost small" id="search-btn" type="button" title="Rechercher dans les questions">Rechercher</button>
    <button class="btn ghost small" id="stats-btn" type="button" title="Ma progression">Progression</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
// Banque de questions et fiches — générées depuis les PDF officiels DGSCGC (vérifiés), niveau équipier à chef d'agrès
const SOURCES = {"gdo-inc":"GDO Interventions sur les incendies de structures","gto-ext":"GTO Établissements et techniques d\u0027extinction","gto-vent":"GTO Ventilation opérationnelle","gto-sauv":"GTO Sauvetages et mises en sécurité (V2)","gto-ari":"GTO Engagement en milieu vicié (V2)","gdo-fum":"GDO Prévention des risques liés à la toxicité des fumées","gdo-sr":"GDO Opérations de secours en milieu routier (2025)","gto-fdf":"GTO Lutte contre les feux de forêts et d\u0027espaces naturels","gdo-elec":"GDO Opérations de secours en présence d\u0027électricité","gdo-gaz":"GDO Interventions en présence de gaz","gdo-ssuap":"GDO Secours et soins d\u0027urgence aux personnes (V1.1)","gto-sauvg":"GTO Sauvegarde opérationnelle","gdo-cmdt":"GDO Exercice du commandement et conduite des opérations (V2)","gdo-soutien":"GDO Préparation et soutien de l\u0027intervenant en opération (2026)","gdo-agri":"GDO Interventions en milieu agricole"};
const THEMES = [{"id":"gdo-inc","nom":"GDO Incendies de structures","court":"Incendie","src":"GDO Interventions sur les incendies de structures"},{"id":"gto-ext","nom":"GTO Établissements \u0026 extinction","court":"Extinction","src":"GTO Établissements et techniques d\u0027extinction"},{"id":"gto-vent","nom":"GTO Ventilation opérationnelle","court":"Ventilation","src":"GTO Ventilation opérationnelle"},{"id":"gto-sauv","nom":"GTO Sauvetages \u0026 milieu vicié","court":"Sauvetages / ARI","src":"GTO Sauvetages et mises en sécurité (V2) / GTO Engagement en milieu vicié (V2)"},{"id":"gdo-fum","nom":"GDO Toxicité des fumées","court":"Fumées","src":"GDO Prévention des risques liés à la toxicité des fumées"},{"id":"gdo-sr","nom":"GDO Secours en milieu routier","court":"Routier","src":"GDO Opérations de secours en milieu routier (2025)"},{"id":"gto-fdf","nom":"GTO Feux de forêts","court":"FDF","src":"GTO Lutte contre les feux de forêts et d\u0027espaces naturels"},{"id":"gdo-elec","nom":"GDO Présence d\u0027électricité","court":"Électricité","src":"GDO Opérations de secours en présence d\u0027électricité"},{"id":"gdo-gaz","nom":"GDO Présence de gaz","court":"Gaz","src":"GDO Interventions en présence de gaz"},{"id":"gdo-ssuap","nom":"GDO Secours à personnes (SSUAP)","court":"SSUAP","src":"GDO Secours et soins d\u0027urgence aux personnes (V1.1)"},{"id":"gto-sauvg","nom":"GTO Sauvegarde opérationnelle","court":"Sauvegarde","src":"GTO Sauvegarde opérationnelle"},{"id":"gdo-cmdt","nom":"GDO Commandement (≤ chef d\u0027agrès)","court":"Commandement","src":"GDO Exercice du commandement et conduite des opérations (V2)"},{"id":"gdo-soutien","nom":"GDO Soutien de l\u0027intervenant","court":"Soutien","src":"GDO Préparation et soutien de l\u0027intervenant en opération (2026)"},{"id":"gdo-agri","nom":"GDO Milieu agricole","court":"Agricole","src":"GDO Interventions en milieu agricole"}];
const FICHES = [

];
const QUESTIONS = [
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Selon le schéma du triangle du feu présenté par le guide, quels sont les trois éléments nécessaires à la combustion ?","c":["Combustible, comburant, vapeur d\u0027eau","Comburant, fumées, chaleur","Combustible, comburant, chaleur","Combustible, azote, chaleur"],"r":2,"e":"La combustion nécessite des réactifs, le combustible et le comburant, ainsi qu\u0027un initiateur, l\u0027apport d\u0027énergie, représenté par la chaleur sur le triangle du feu. Ce schéma illustre les composants nécessaires à la combustion et leur interdépendance.","ref":"§ 1.1.1 Combustion — p. 19","p":"La combustion est une réaction chimique induisant la présence de réactifs (le combustible et le comburant) et la nécessité d\u0027un initiateur (apport d\u0027énergie).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Quel élément le tétraèdre du feu ajoute-t-il au triangle du feu ?","c":["Les réactions en chaîne","La pression atmosphérique","La température ambiante","La vitesse du vent"],"r":0,"e":"Un quatrième élément, les réactions en chaîne, peut être ajouté au triangle : on parle alors de tétraèdre du feu. Ces étapes intermédiaires produisent des espèces très réactives, les radicaux libres ; certains agents extincteurs, comme les poudres, agissent sur eux et brisent ces réactions.","ref":"§ FSCI-CSF-3 Le triangle du feu — p. 100","p":"un quatrième élément peut être ajouté à ce triangle, il s\u0027agit des réactions en chaine (on parle alors de tétraèdre du feu).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Comment appelle-t-on la décomposition thermique d\u0027un solide qui libère des gaz combustibles avant même l\u0027apparition des flammes ?","c":["La convection","La sublimation","La pyrolyse","La calcination"],"r":2,"e":"Sous l\u0027effet d\u0027un transfert thermique, la matière s\u0027échauffe et peut se décomposer en émettant des gaz inflammables : c\u0027est la pyrolyse. Ces gaz, mélangés à l\u0027air, s\u0027enflamment si une énergie suffisante est apportée ; la flamme se maintient ensuite si les gaz, l\u0027air et les conditions thermiques le permettent.","ref":"§ 1.2 Physique et chimie du feu — p. 20","p":"Production des gaz de pyrolyse. La matière voit sa température augmenter par l\u0027intermédiaire d\u0027un transfert thermique et peut se décomposer en émettant des gaz inflammables","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Qu\u0027appelle-t-on l\u0027auto-inflammation des gaz de pyrolyse d\u0027un solide ?","c":["Leur inflammation au contact d\u0027une source externe, une étincelle par exemple","Leur inflammation explosive lors d\u0027un apport d\u0027air soudain dans un local clos","Leur combustion lente et sans flamme à l\u0027intérieur d\u0027un matériau poreux","Leur inflammation due au seul échauffement du solide, sans source externe"],"r":3,"e":"L\u0027inflammation des gaz de pyrolyse peut être due à une source d\u0027énergie externe, comme une étincelle, ou au seul échauffement du solide lui-même : on parle alors d\u0027auto-inflammation. La combustion lente et sans flamme correspond au feu couvant (smoldering), l\u0027inflammation lors d\u0027un apport d\u0027air soudain au backdraft.","ref":"§ FSCI-CSF-2 Inflammation des solides — p. 98","p":"mais elle peut également être liée à l\u0027échauffement du solide en lui-même. On parle alors d\u0027auto-inflammation.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Chef d\u0027équipe","q":"Dans un local clos où les flammes ont régressé faute d\u0027oxygène, pourquoi les gaz imbrûlés accumulés ne s\u0027enflamment-ils pas tant que le local reste fermé ?","c":["Leur mélange est au-dessus de sa limite supérieure d\u0027inflammabilité (trop riche)","Leur mélange est en dessous de sa limite inférieure d\u0027inflammabilité (trop pauvre)","Leur température est retombée sous leur point éclair, faute de flammes","Ils ne contiennent plus aucun gaz combustible, tout ayant déjà brûlé"],"r":0,"e":"Dans une pièce close en feu, la combustion est fortement incomplète et la flamme régresse faute d\u0027oxygène : le mélange gazeux passe au-dessus de la LSI, hors de son domaine d\u0027inflammabilité. À la rupture du confinement (bris de fenêtre, ouverture de porte), l\u0027air entrant peut ramener le mélange sous la LSI : énergie, combustible et comburant sont alors réunis, c\u0027est l\u0027exemple du backdraft.","ref":"§ FSCI-CSF-2 Mélange et inflammation, 1.3 Exemple d\u0027application — p. 97","p":"Au fur et à mesure du développement du sinistre, la flamme disparaît ou régresse, faute d\u0027oxygène : le mélange gazeux dans la pièce est alors au-dessus de la LSI, en dehors de son domaine d\u0027inflammabilité.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Une combustion incomplète se caractérise par :","c":["Des flammes bleues et une absence totale de fumées","Une consommation totale du combustible sans résidu","La production d\u0027imbrûlés et de monoxyde de carbone","Un dégagement de chaleur supérieur à celui d\u0027une combustion complète"],"r":2,"e":"Lorsque l\u0027oxygène manque, la combustion est incomplète : les fumées sont alors chargées en produits imparfaitement brûlés, comme le monoxyde de carbone, et en imbrûlés (suies, produits gazeux de pyrolyse). Ces gaz étant inflammables, les fumées peuvent s\u0027enflammer, voire exploser.","ref":"§ FSCI-CSF-5 Un mélange inflammable et explosif — p. 107","p":"Résultant d\u0027une combustion incomplète, les fumées sont chargées notamment en produits imparfaitement brûlés (monoxyde de carbone) ou imbrûlés (suies, produits gazeux de pyrolyse).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Dans un incendie, quel mode de transfert de chaleur correspond au déplacement des fumées et gaz chauds dans les volumes de la structure ?","c":["La conduction","La convection","Le rayonnement","La pyrolyse"],"r":1,"e":"La convection est un transfert de chaleur par l\u0027intermédiaire d\u0027un fluide en mouvement : dans l\u0027incendie, ce sont les fumées et gaz chauds qui se propagent dans les volumes. La conduction se fait de proche en proche dans le matériau ; le rayonnement ne nécessite pas de contact matériel. La pyrolyse est une décomposition, pas un transfert.","ref":"§ 1.3 Transferts de chaleur et modes de propagation — p. 21","p":"La convection désigne un transfert de chaleur s\u0027effectuant par l\u0027intermédiaire d\u0027un fluide en mouvement (liquide ou gaz). Dans le cas de l\u0027incendie, ce sont les fumées et gaz chauds qui se propagent dans les différents volumes de la structure.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Un feu se déclare dans une pièce ; une barre métallique traversant le mur initie un incendie dans la pièce voisine. Quel mode de transfert est en cause ?","c":["La conduction","Le rayonnement","La convection","La diffusion"],"r":0,"e":"La conduction transmet la chaleur de proche en proche dans le matériau, sans déplacement global de matière. Le guide cite l\u0027exemple d\u0027une barre métallique traversant deux pièces, qui peut initier un incendie dans la pièce voisine en y conduisant la chaleur.","ref":"§ FSCI-CSF-1 Conduction — p. 92","p":"Une barre métallique traversant deux pièces dont l\u0027une subi un incendie, pourra par exemple initier un incendie en conduisant la chaleur jusque à la pièce voisine.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Lors d\u0027un feu d\u0027appartement, la façade de l\u0027immeuble d\u0027en face s\u0027échauffe sans contact avec les flammes ni les fumées. Quel mode de transfert l\u0027explique ?","c":["La conduction","La diffusion","La convection","Le rayonnement"],"r":3,"e":"Le rayonnement propage l\u0027énergie sous forme d\u0027ondes électromagnétiques, sans contact matériel. Il varie avec la température, est prépondérant lors des incendies et peut jouer un rôle dans l\u0027inflammation de cibles éloignées. La lutte contre les propagations externes peut d\u0027ailleurs consister à réduire ce flux de chaleur rayonnée.","ref":"§ FSCI-CSF-1 Rayonnement — p. 92","p":"Le rayonnement varie en fonction de la température du corps considéré. Ce dernier sera prépondérant lors d\u0027incendies et pourra jouer un rôle dans l\u0027inflammation de cibles éloignées.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"À partir de quelle température le rayonnement des fumées commence-t-il à être important, au point de pouvoir brûler des personnes non protégées ?","c":["100 °C","200 °C","500 °C","800 °C"],"r":1,"e":"Les fumées emportent l\u0027essentiel de la chaleur par convection et rayonnent d\u0027autant plus que leur température est élevée. Selon le guide, les flux rayonnés commencent à être importants à partir de 200 °C et peuvent infliger des brûlures à des personnes non protégées ; au-delà, ils augmentent significativement la pyrolyse des combustibles exposés.","ref":"§ FSCI-CSF-5 Les dangers des fumées, 5. Un mélange rayonnant — p. 108","p":"Les flux rayonnés commencent à être important à partir de 200°C, pouvant infliger des brûlures à des personnes non protégées.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Dans quel ordre se succèdent les phases de la courbe classique de développement d\u0027un feu dans un local ventilé ?","c":["Croissance, naissance, régression, plein développement","Naissance, régression, croissance, plein développement","Naissance, croissance, plein développement, régression","Plein développement, croissance, naissance, régression"],"r":2,"e":"La courbe classique d\u0027un incendie dans un local ventilé passe par le feu naissant, le feu en croissance, le feu pleinement développé, ultime phase de croissance et conséquence immédiate d\u0027un embrasement généralisé, puis le feu en régression ou déclin, qui correspond à la fin de la combustion des matériaux.","ref":"§ 1.6 Phases de développement du feu — p. 22-23","p":"Feu naissant ; Cette phase initiale de la combustion […] Feu pleinement développé : Ultime phase de croissance du feu […] La phase de régression (ou déclin) correspond à la fin de la combustion des matériaux.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Équipier","q":"Un feu « sous-ventilé », ou feu limité par la ventilation (FLV), est un feu dont le développement est limité par :","c":["Le manque de combustible","Le manque de comburant","L\u0027eau d\u0027extinction projetée","La hauteur sous plafond"],"r":1,"e":"Le feu sous-ventilé (FLV) est limité en comburant. Deux issues sont possibles : le maintien du confinement, qui peut conduire à une quasi auto-extinction, ou sa rupture, qui relance la croissance du feu de façon plus ou moins rapide et violente. Le feu limité par le combustible (FLC) est, lui, correctement ventilé.","ref":"§ 1.6 Phases de développement du feu — p. 23","p":"Feu sous ventilé ou feu limité par la ventilation (FLV) : limité en comburant, deux alternatives sont possibles","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Chef d\u0027équipe","q":"Un feu se développe dans un appartement meublé. Une fois au stade du plein développement, quel est en règle générale son régime ?","c":["Limité par le combustible, l\u0027air étant disponible en excès","Limité par la ventilation, l\u0027apport d\u0027air devenant insuffisant","Limité par le combustible, la charge calorifique s\u0027épuisant","Indépendant de l\u0027apport d\u0027air, seule la nature des meubles comptant"],"r":1,"e":"Les feux développés en structure, dès lors qu\u0027ils abritent des pièces meublées, sont systématiquement limités par la ventilation en situation de plein développement. Le feu est limité par le combustible au stade naissant et le redevient en régression, lorsque les matériaux finissent de brûler.","ref":"§ 1.6 Phases de développement du feu — p. 23","p":"D\u0027une manière générale, les feux développés en structure, dès lors qu\u0027ils abritent des pièces meublées, seront systématiquement limités par la ventilation en situation de plein développement.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Notions essentielles du feu","niv":"Chef d\u0027équipe","q":"Quel effet produit l\u0027ouverture d\u0027une fenêtre ou d\u0027une porte sur un feu en phase de croissance dans un local clos ?","c":["Elle refroidit le local par l\u0027air frais entrant et ralentit toujours le feu","Elle n\u0027a aucune influence sur la combustion, seule l\u0027arrivée d\u0027eau la modifie","Elle supprime tout risque de phénomène thermique en évacuant les fumées chaudes","Elle apporte du comburant et peut accélérer brutalement le développement du feu"],"r":3,"e":"Dans un local clos, le feu en croissance devient limité par la ventilation. La rupture du confinement, par une ouverture de porte ou de fenêtre, lui apporte du comburant et conduit à une reprise de sa croissance, plus ou moins rapide et violente. Un tel apport d\u0027air peut aussi déclencher un backdraft ou un flashover induit par la ventilation.","ref":"§ 1.6 Phases de développement du feu — p. 23","p":"La rupture de ce confinement qui conduira à une reprise de la croissance du feu (plus ou moins rapide et violente).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Équipier","q":"Que désigne l\u0027embrasement généralisé éclair (flashover) ?","c":["L\u0027inflammation des fumées d\u0027un local sous-ventilé lors d\u0027un apport d\u0027air soudain","L\u0027inflammation de fumées refroidies, loin du foyer, au contact d\u0027une source d\u0027énergie","La baisse de puissance du feu lorsque tout le combustible du local est consommé","Le passage brutal d\u0027un feu localisé à l\u0027embrasement généralisé d\u0027un volume ventilé"],"r":3,"e":"Le flashover correspond au passage brutal d\u0027un feu localisé à l\u0027embrasement généralisé de tous les combustibles d\u0027un volume ventilé ; il aboutit systématiquement à un feu pleinement développé. L\u0027inflammation d\u0027un local sous-ventilé lors d\u0027un apport d\u0027air soudain décrit le backdraft, celle de fumées refroidies au contact d\u0027une énergie, une inflammation de gaz (FGI).","ref":"§ 1.7.1 Famille des Flashover — p. 24","p":"Cette famille rassemble les phénomènes qui correspondent au passage brutal d\u0027un feu localisé à l\u0027embrasement généralisé de tous les matériaux combustibles contenus dans un volume ventilé.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Dans l\u0027habitat actuel, combien de temps après la naissance d\u0027un feu correctement alimenté en air un embrasement généralisé éclair peut-il se produire ?","c":["Entre 30 secondes et 1 minute","Entre 3 et 5 minutes","Entre 15 et 20 minutes","Au-delà de 45 minutes"],"r":1,"e":"Selon le guide, dans l\u0027habitat actuel, l\u0027embrasement généralisé éclair se produit entre 3 et 5 minutes après la naissance du feu dès lors que celui-ci est correctement alimenté en air ; un facteur de ventilation moindre peut le retarder de quelques minutes. Le guide considère ce risque comme omniprésent, compte tenu de l\u0027excès de combustible dans les bâtiments et des délais d\u0027intervention.","ref":"§ FSCI-CSF-10 Flashover, 2. Scénario type d\u0027un embrasement généralisé éclair — p. 124","p":"on peut estimer que dans notre habitat actuel celui-ci se produit entre 3 à 5 minutes après la naissance du feu, dès lors que celui-ci est correctement alimenté en air.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Équipier","q":"Lors de la croissance d\u0027un feu de local, que désignent les « anges danseurs » (ghosting flames) observés dans la fumée ?","c":["Des reflets des flammes du foyer sur la vapeur d\u0027eau des lances","Des tourbillons d\u0027air frais aspirés par le bas de la porte","Des inflammations sporadiques de la couche de fumées","Des escarbilles incandescentes emportées par les fumées"],"r":2,"e":"Enrichie par les gaz de pyrolyse des objets chauffés, la couche de fumées commence à s\u0027enflammer sporadiquement (anges danseurs) lorsqu\u0027elle atteint sa température d\u0027auto-inflammation, puis à l\u0027interface air/fumées (roll-over). Le guide range la présence d\u0027anges danseurs parmi les signes annonciateurs du flashover.","ref":"§ FSCI-CSF-10 Flashover, 2. Scénario type d\u0027un embrasement généralisé éclair — p. 124","p":"Cette couche de fumées, enrichie par ces gaz de pyrolyse, va commencer à s\u0027enflammer sporadiquement (ghosting flames / « anges danseurs ») lorsqu\u0027elle atteint sa température d\u0027auto-inflammation","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Équipier","q":"Que désigne le « roll-over » (rouleaux de flammes) observé dans un local en feu ?","c":["L\u0027explosion du local lors d\u0027un apport d\u0027air soudain dans des fumées sous-ventilées","L\u0027inflammation de la couche de fumées à l\u0027interface air/fumées, avant le flashover","Le retournement des fumées vers le sol lorsque la ventilation inverse les flux","L\u0027extinction spontanée des flammes au plafond quand le combustible est épuisé"],"r":1,"e":"La couche de fumées, enrichie en gaz de pyrolyse, s\u0027enflamme d\u0027abord sporadiquement (« anges danseurs ») puis à l\u0027interface air/fumées : ce sont les roll-over, signe de l\u0027imminence de l\u0027embrasement généralisé éclair. L\u0027explosion des fumées lors d\u0027un apport d\u0027air soudain correspond, elle, au backdraft.","ref":"§ FSCI-CSF-10 Scénario type d\u0027un EGE — p. 124","p":"va commencer à s\u0027enflammer sporadiquement (ghosting flames / « anges danseurs ») lorsqu\u0027elle atteint sa température d\u0027auto-inflammation puis à s\u0027enflammer à l\u0027interface air/fumées (roll-over / rouleaux de flammes).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Le binôme progresse dans un local en feu et voit des rouleaux de flammes parcourir la couche de fumées (roll-over). Que doit-il faire ?","c":["Se redresser pour mieux observer les flammes et localiser le foyer","Ouvrir une fenêtre pour évacuer les gaz enflammés vers l\u0027extérieur","Poursuivre sa progression vers le foyer pour l\u0027attaquer au plus vite","Adopter une attitude défensive et se replier hors du volume concerné"],"r":3,"e":"Les roll-over sont le signe de l\u0027imminence de l\u0027embrasement généralisé éclair : le binôme confronté à ce phénomène doit adopter immédiatement une attitude défensive et se replier en dehors du volume concerné. Ce repli se fait sous la protection du moyen hydraulique.","ref":"§ FSCI-CSF-10 Flashover, signes annonciateurs — p. 125","p":"Le binôme confronté à ce phénomène doit adopter immédiatement une attitude défensive et se replier en dehors du volume concerné.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Équipier","q":"Pourquoi un binôme progressant dans un local en feu envahi par les fumées doit-il se tenir au plus près du sol ?","c":["Pour mieux entendre les ordres, la combustion étant moins bruyante au sol","Pour éviter de glisser sur un sol rendu glissant par l\u0027eau d\u0027extinction","Parce qu\u0027un plancher fragilisé supporte mieux une charge basse et répartie","Parce que la couche de fumées chaudes et rayonnantes occupe le haut du volume"],"r":3,"e":"Pendant la phase de croissance, les fumées s\u0027accumulent sous le plafond et forment une couche qui rayonne dans toutes les directions. Une couche de fumées rayonnantes impose une position au plus près du sol ; c\u0027est l\u0027un des signes annonciateurs du flashover.","ref":"§ FSCI-CSF-10 Flashover, signes annonciateurs — p. 125","p":"Couche de fumées rayonnantes, imposant une position au plus près du sol.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Lors de la lecture du feu, quelle évolution des fumées doit faire craindre un embrasement généralisé éclair ?","c":["Des fumées claires et peu abondantes, qui s\u0027évacuent sans difficulté","Des fumées blanchâtres stagnant dans un local éloigné du foyer","Des fumées sur plus de la moitié de la hauteur, qui s\u0027assombrissent","Des fumées qui s\u0027éclaircissent et dont la vitesse de sortie diminue"],"r":2,"e":"Pour le flashover, le tableau de synthèse décrit un envahissement de plus de la moitié de la hauteur du volume, un épaississement du plafond de fumées, un assombrissement vers le noir et une convection importante. Une fumée blanchâtre stagnant loin du foyer évoque plutôt un risque d\u0027inflammation de gaz (FGI).","ref":"§ 1.7.4 Synthèse des phénomènes (flashover) — p. 26","p":"Envahissement de plus de la moitié de la hauteur du volume, Épaississement du plafond de fumées, Assombrissement vers le noir,","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Le binôme observe un foyer vif aux flammes plutôt sombres, et non claires. D\u0027après les signes annonciateurs du flashover, le volume est :","c":["Correctement alimenté en air frais, propice à un flashover spontané","Alimenté en air, mais insuffisamment pour un flashover spontané","Totalement privé d\u0027air, où toute flamme a déjà disparu","En fin de combustion, dont le combustible est presque épuisé"],"r":1,"e":"Le guide distingue le flashover spontané (volume correctement alimenté en air frais, foyer vif, flammes claires) du flashover induit par la ventilation (volume alimenté en air mais insuffisamment, foyer vif, flammes plus sombres). Dans ce second cas, un apport d\u0027air, par exemple une ouverture de porte, peut déclencher le phénomène.","ref":"§ FSCI-CSF-10 Flashover, signes annonciateurs — p. 125","p":"Un volume semi-ouvert alimenté en air frais mais insuffisamment pour déclencher spontanément le flashover. Abaissement brutal de la couche de fumées. « Pulsations » possibles de la couche de fumées. Foyer vif, flammes plus sombres.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Lors de la reconnaissance, quel ensemble de signes doit faire craindre un risque de backdraft dans le local sinistré ?","c":["Fumées sortant par bouffées puis ré-aspirées, quasi-absence de flammes visibles","Flammes claires et vives, crépitements nets et fumées bien stratifiées au plafond","Fumée blanche et peu dense s\u0027élevant lentement, parois froides au toucher","Courant d\u0027air régulier entrant en partie basse et foyer vif bien visible"],"r":0,"e":"Parmi les signes annonciateurs du backdraft figurent des fumées pouvant sortir sous pression par bouffées et être ré-aspirées, et la quasi-absence de flammes visibles dans le volume. Un foyer vif aux flammes claires et des fumées stratifiées relèvent au contraire des signes du flashover spontané, dans un volume correctement alimenté en air.","ref":"§ FSCI-CSF-11 Backdraft, signes annonciateurs — p. 128","p":"Fumées pouvant sortir sous pression par bouffées et être ré-aspirées. Quasi absence de flammes visibles dans le volume concerné.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Lors de la reconnaissance, le binôme remarque des dépôts noirs et huileux sur les parois d\u0027un local fermé. Qu\u0027indiquent-ils ?","c":["Un local inoccupé depuis longtemps, couvert de poussière","Un feu éteint depuis longtemps, ne laissant que de la suie froide","Une condensation des gaz de pyrolyse sur les parois","Un local bien ventilé dont les fumées s\u0027évacuent par les joints"],"r":2,"e":"Les dépôts noirs indiquent une condensation des gaz de pyrolyse sur les parois sous forme de dépôts huileux. Avec les vitres noircies, c\u0027est un indicateur associé au risque de backdraft, à rechercher de l\u0027extérieur du local et avant toute ouverture d\u0027ouvrant.","ref":"§ 1.7.4 Synthèse des phénomènes (backdraft) — p. 26","p":"Les dépôts noirs indiquent de la condensation des gaz de pyrolyse sur les parois sous forme de dépôts huileux,","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Feu dans une maison « basse consommation » très isolée, aux fenêtres à double ou triple vitrage. Que signale le guide au sujet du risque de backdraft ?","c":["Il augmente, et les indicateurs de chaleur peuvent être moins évidents","Il diminue, car l\u0027étanchéité du bâtiment finit toujours par étouffer le feu","Il est inchangé : l\u0027isolation n\u0027influe que sur la puissance du feu","Il disparaît, car les vitrages étanches résistent toujours au feu"],"r":0,"e":"Le backdraft est probable lorsque le feu est confiné et que l\u0027enveloppe se rompt soudainement. Le guide précise que ce risque augmente dans les bâtiments « basse consommation » (bonne isolation, fenêtres étanches) et que les indicateurs de chaleur peuvent y être moins évidents du fait de l\u0027isolation.","ref":"§ 1.7.4 Synthèse des phénomènes à cinétique rapide — p. 26","p":"Le risque augmente dans les bâtiments « basse consommation » avec une bonne isolation et les fenêtres étanches (double ou triple vitrage). Les indicateurs de chaleur peuvent être moins évidents en raison de l\u0027isolation supérieure","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027agrès","q":"Selon le guide, quand et d\u0027où faut-il rechercher les signes annonciateurs d\u0027un backdraft ?","c":["De l\u0027intérieur du local, une fois la porte ouverte et la lance en eau","Depuis le palier, après avoir créé un exutoire en partie haute","De l\u0027extérieur du local sinistré, avant toute ouverture d\u0027ouvrants","Depuis l\u0027engin, uniquement à l\u0027aide de la caméra thermique"],"r":2,"e":"Selon le guide, les signes annonciateurs du backdraft sont à rechercher de l\u0027extérieur du local sinistré et avant toute ouverture d\u0027ouvrants, l\u0027admission brutale d\u0027air frais étant le plus souvent due à l\u0027ouverture ou à la rupture d\u0027un ouvrant. Ces signes peuvent être peu visibles, voire absents, et s\u0027inscrivent dans une analyse globale fondée sur la lecture du bâtiment et du feu.","ref":"§ FSCI-CSF-11 Backdraft, 3. Signes annonciateurs — p. 128","p":"Ces signes annonciateurs sont à rechercher de l\u0027extérieur du local sinistré, et avant toute ouverture d\u0027ouvrants. En fonction des situations, ils peuvent être plus ou moins visibles, voire absents.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Équipier","q":"Quel est l\u0027élément déclencheur d\u0027une inflammation de gaz issus d\u0027un incendie (FGI) ?","c":["Un apport soudain d\u0027air frais dans le volume","Une forte montée en pression des fumées dans le volume","Un apport d\u0027énergie d\u0027activation (source de chaleur)","Un refroidissement brutal des fumées par les lances"],"r":2,"e":"À la différence du backdraft, déclenché par un apport de comburant, le FGI est déclenché par l\u0027apport d\u0027énergie d\u0027activation : le feu lui-même ou toute autre source d\u0027ignition (appareil électrique, débris braisant lors du déblai). Il peut donc se produire avec des fumées refroidies, accumulées à distance du foyer.","ref":"§ 1.7.3 Famille des Fire Gas Ignition — p. 24","p":"A la différence du « backdraft » les conditions de ventilation dans la pièce concernée ne sont pas à l\u0027origine de l\u0027apparition du phénomène. L\u0027élément déclencheur est l\u0027apport d\u0027énergie d\u0027activation.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Pendant le déblai, une fumée blanchâtre stagne dans un local voisin du foyer. Quel risque le guide associe-t-il à cette situation ?","c":["Une inflammation, voire une explosion, des gaz de fumées mélangés à l\u0027air","Aucun risque : seule une fumée noire peut contenir des gaz inflammables","Un embrasement généralisé éclair du local voisin par rayonnement du foyer","Une simple condensation de vapeur d\u0027eau, sans danger une fois le feu éteint"],"r":0,"e":"Les inflammations de gaz issus d\u0027un incendie, explosives (smoke explosion) ou non (flash fire), touchent une zone de fumées pré-mélangée à l\u0027air ; elles sont possibles à toutes les phases, déblai compris, notamment dans les locaux adjacents. Sans signe annonciateur facilement identifiable, la présence de fumée en est le seul indicateur fiable : fumée stagnante, blanchâtre voire jaunâtre (gaz de pyrolyse).","ref":"§ FSCI-CSF-12 Inflammations de gaz issus d\u0027un incendie — p. 129","p":"des inflammations explosives (smoke explosion) ou non explosive (flash fire), d\u0027une zone de fumées pré-mélangée à l\u0027air. Ces phénomènes peuvent avoir lieu tout au long de l\u0027intervention, aussi bien dans le local sinistré que dans d\u0027autres locaux","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Le vent souffle vers la fenêtre ouverte du local en feu, en étage. Quel danger court un binôme placé entre le foyer et l\u0027exutoire ?","c":["Être pris dans une vague de flammes et de fumées poussée par le vent","Être exposé à des fumées refroidies par le vent et devenues inoffensives","Voir le foyer s\u0027étouffer par l\u0027air froid, rendant l\u0027attaque inutile","Subir une chute de pression à la lance provoquée par l\u0027effet venturi"],"r":0,"e":"Le vent peut pousser flammes et fumées à travers une porte, un couloir ou une cage d\u0027escalier non encloisonnée jusqu\u0027à un exutoire : c\u0027est l\u0027effet chalumeau, lié à l\u0027effet venturi. Un équipage placé entre le foyer et l\u0027exutoire est alors mis en difficulté face à cette vague de flammes, avec un risque de brûlures graves, voire de décès.","ref":"§ FSCI-CSF-13 Feux pilotés par le vent — p. 132","p":"Un équipage placé entre le foyer et l\u0027exutoire sera mis en difficulté face à cette vague de flamme.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027agrès","q":"Vous arrivez sur un feu au 12e étage d\u0027un immeuble. Au sol, vous ne ressentez aucun vent. Que devez-vous en conclure selon le guide ?","c":["Que le risque de feu piloté par le vent peut être écarté","Que cela ne signifie pas une absence de vent en hauteur","Que le vent n\u0027a d\u0027effet que sur les feux de forêts et d\u0027espaces naturels","Que la porte palière peut être ouverte sans précaution particulière"],"r":1,"e":"Selon le guide, le vent est un aléa très impactant mais pas toujours évident à identifier : obstacles masquant l\u0027ouvrant, faces du volume difficiles à reconnaître, indicateurs mal connus, et absence de ressenti au sol qui ne signifie pas absence de vent en hauteur (immeubles). Dès l\u0027arrivée sur les lieux, il faut essayer de trouver des indicateurs de vent.","ref":"§ FSCI-CSF-13 Feux pilotés par le vent, 2. Implication opérationnelle de l\u0027effet venturi — p. 132","p":"L\u0027absence de ressenti au sol ne signifie pas absence de vent en hauteur (immeubles)","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Phénomènes thermiques et vent","niv":"Chef d\u0027équipe","q":"Lors du protocole d\u0027ouverture sécurisée d\u0027une porte, comment le guide propose-t-il de rechercher, depuis l\u0027intérieur, un indicateur de vent poussant vers l\u0027ouvrant ?","c":["Par l\u0027ouverture complète et rapide de la porte, lance en eau","Par le toucher de la porte, au dos de la main, avant ouverture","Par la mise en route préalable d\u0027un ventilateur sur le palier","Par un entrebâillement de porte de quelques millimètres"],"r":3,"e":"Depuis l\u0027intérieur, le guide propose d\u0027intégrer la recherche d\u0027indicateurs au protocole d\u0027ouverture sécurisée, par exemple via un entrebâillement de porte de quelques millimètres. Depuis l\u0027extérieur, on observe drapeaux, arbres, poussières ou manche à air, et une sortie de flammes et fumées par bouffées ou asymétrique à l\u0027ouvrant.","ref":"§ FSCI-CSF-13 Feux pilotés par le vent, 3. Recherche d\u0027indicateurs — p. 134","p":"Depuis l\u0027intérieur : intégrer dans le protocole d\u0027ouverture sécurisée la recherche d\u0027indicateur(s), par exemple via un entrebâillement de porte de quelques millimètres.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Maîtrise et extinction du feu","niv":"Chef d\u0027agrès","q":"Pour diminuer le volume de fumées, vous envisagez de faire créer un exutoire en partie haute. Quel est le risque principal de cette mesure selon le guide ?","c":["Une arrivée d\u0027air frais augmentant la puissance du feu","Une augmentation de la pyrolyse des combustibles du local","Un accès au foyer rendu plus difficile pour le binôme","Une descente des fumées vers les niveaux inférieurs"],"r":0,"e":"Selon le guide, l\u0027exutoire en partie haute diminue significativement l\u0027agression thermique des combustibles, donc la pyrolyse et la propagation, et facilite l\u0027accès au foyer. Son risque principal : l\u0027évacuation des fumées peut être comblée par une arrivée d\u0027air frais augmentant la puissance. L\u0027instant et le lieu de sa création doivent donc être analysés au préalable.","ref":"§ FSCI-CSF-7 Système feu et modèle de Thomas, 3.2 Maîtrise des fumées — p. 115","p":"Cette mesure comporte un risque principal car l\u0027évacuation de la fumée peut être comblée par une arrivée d\u0027air frais augmentant la puissance.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Maîtrise et extinction du feu","niv":"Chef d\u0027équipe","q":"Le porte-lance réduit la taille des gouttelettes projetées. Quel inconvénient le guide associe-t-il à des particules d\u0027eau plus petites ?","c":["Elles absorbent moins d\u0027énergie en s\u0027évaporant dans les fumées","Elles atténuent moins bien le rayonnement des fumées et du foyer","Elles atteignent plus difficilement de longues distances","Elles séjournent moins longtemps dans les fumées chaudes"],"r":2,"e":"Selon le guide, réduire le diamètre des gouttes agrandit la surface d\u0027échange, augmente leur temps de séjour dans l\u0027incendie, maximise l\u0027évaporation et accroît l\u0027atténuation du rayonnement (effet d\u0027écran radiatif). En contrepartie, plus les particules sont petites, plus leur capacité à atteindre de longues distances est faible.","ref":"§ FSCI-CSF-7 Système feu et modèle de Thomas, 3.2 Maîtrise des fumées — p. 116","p":"Plus les particules seront petites, plus leur capacité à atteindre de longues distances sera faible.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Maîtrise et extinction du feu","niv":"Équipier","q":"L\u0027évaporation massive de l\u0027eau projetée dans un volume en feu peut produire un effet d\u0027inertage. Quel risque associé le guide signale-t-il ?","c":["Une explosion de la vapeur au contact des flammes","Une électrisation du porte-lance par la vapeur","Un enrichissement du local en oxygène","Un retour de vapeur chaude sur les intervenants"],"r":3,"e":"En s\u0027évaporant massivement, l\u0027eau peut jouer un rôle d\u0027inertage dans le volume. Selon le guide, les risques associés sont d\u0027ordre thermique, avec le retour de vapeur chaude sur les intervenants. L\u0027inertage abaisse au contraire la teneur en oxygène au voisinage des flammes.","ref":"§ FSCI-CSF-7 Système feu et modèle de Thomas, 3.2 Maîtrise des fumées — p. 116","p":"L\u0027évaporation massive de l\u0027eau peut aussi jouer un rôle d\u0027inertage dans un volume. Les risques associés sont d\u0027ordre thermique avec le retour de vapeur chaude sur les intervenants.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Maîtrise et extinction du feu","niv":"Chef d\u0027équipe","q":"D\u0027après le guide, quelle puissance de feu une LDV réglée à 250 L/min absorbe-t-elle réellement, une partie de l\u0027eau n\u0027étant pas totalement vaporisée ?","c":["Environ 1 MW","Environ 4 MW","Environ 12 MW","Environ 25 MW"],"r":1,"e":"Théoriquement, un débit de 250 L/min d\u0027eau à 20 °C peut absorber 11,93 MW. En réalité, une partie de l\u0027eau n\u0027est pas totalement vaporisée : la puissance réellement absorbée est voisine de 4 MW (rendement de l\u0027ordre de 30 %), à peine supérieure à la puissance libérée par la combustion d\u0027une chambre avec une porte de 1 m × 2 m.","ref":"§ FSCI-CSF-08 Les effets de l\u0027eau, 3.2 Application à une LDV — p. 119","p":"En réalité, une partie de l\u0027eau n\u0027est pas totalement vaporisée et la puissance réellement absorbée est voisine de 4 MW (rendement de l\u0027ordre de 30%)","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Maîtrise et extinction du feu","niv":"Équipier","q":"En passant de l\u0027état liquide à l\u0027état de vapeur à 100 °C, 1 litre d\u0027eau produit environ :","c":["17 litres de vapeur","170 litres de vapeur","1 700 litres de vapeur","17 000 litres de vapeur"],"r":2,"e":"Le guide calcule qu\u0027un litre d\u0027eau liquide produit environ 1 700 litres (1,7 m³) de vapeur : l\u0027eau multiplie son volume par 1 700 en passant à l\u0027état de vapeur à 100 °C. Cette vapeur incombustible fait baisser la concentration en vapeurs combustibles jusqu\u0027à passer sous la LII : c\u0027est l\u0027inertage.","ref":"§ FSCI-CSF-08 Les effets de l\u0027eau, 4. Inertage — p. 120","p":"1 litre d\u0027eau liquide produit 1700 litres (1,7 m³) de vapeur lors du passage de liquide à vapeur, donc nous en déduisons que l\u0027eau multiplie son volume par 1700 en passant à l\u0027état de vapeur à 100°C.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Équipier","q":"Comment le guide classe-t-il un hangar à structure métallique selon sa résistance et sa réaction au feu ?","c":["Bonne résistance, faible réaction au feu","Bonne résistance, importante réaction au feu","Mauvaise résistance, importante réaction au feu","Mauvaise résistance, faible réaction au feu"],"r":3,"e":"Les bâtiments métalliques (magasins, hangars) ont une mauvaise résistance mais une faible réaction au feu : ils s\u0027affaissent rapidement sous l\u0027effet de la chaleur. Le béton, la brique et la pierre allient bonne résistance et faible réaction ; le bois non traité cumule mauvaise résistance et importante réaction.","ref":"§ 2.1.3 Application — p. 27","p":"Une mauvaise résistance mais une faible réaction au feu. Ce sont les bâtiments métalliques (magasins, hangars...) qui s\u0027affaissent rapidement sous l\u0027effet de la chaleur ;","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"Pourquoi les conduits, les gaines et les faux plafonds d\u0027un bâtiment en feu doivent-ils retenir l\u0027attention des équipes ?","c":["Ils renferment toujours des canalisations de gaz qui alimentent directement le foyer","Ils permettent aux fumées d\u0027être transportées et de s\u0027accumuler loin du foyer","Ils stockent la chaleur et la restituent longtemps après l\u0027extinction","Ils empêchent toute propagation, étant obligatoirement coupe-feu"],"r":1,"e":"Les vides, conduits, cages, faux plafonds ou plafonds suspendus permettent à la fumée d\u0027être transportée et de s\u0027accumuler dans des zones voisines ou non du local d\u0027origine. Partiellement mélangée à l\u0027air, elle peut s\u0027y enflammer au contact d\u0027une énergie d\u0027activation (FGI) et donner de faux indicateurs sur l\u0027emplacement du foyer.","ref":"§ 1.7.4 Synthèse des phénomènes (FGI) — p. 26","p":"les faux plafonds ou les plafonds suspendus permettent à la fumée d\u0027être transportée et de s\u0027accumuler dans les zones voisines ou non de l\u0027enceinte d\u0027origine.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"À l\u0027arrivée sur les lieux, quels indicateurs extérieurs des fumées faut-il observer pour lire le feu ?","c":["Odeur, toxicité, humidité, température","Opacité, odeur, toxicité, hauteur du panache","Débit, couleur, vélocité, sens de tirage","Température, humidité, odeur, pression"],"r":2,"e":"La fumée et son mode de circulation sont deux des indicateurs les plus importants de la lecture du feu. À l\u0027arrivée, on observe pour les fumées leur débit, leur couleur, leur vélocité et leur sens de tirage, ainsi que les conditions aérauliques (vent, ouvrants ouverts ou fermés). L\u0027évaluation se poursuit tout au long de l\u0027opération grâce à l\u0027observation et aux comptes rendus des équipes.","ref":"§ 2.2 La fumée (indicateurs) — p. 35","p":"Fumées : débit, couleur, vélocité, sens de tirage","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"Lors de la lecture du feu, que traduit une sortie rapide des fumées par une ouverture du local sinistré ?","c":["Une forte pression et une température élevée dans le volume","Un feu naissant dont la combustion est encore bien alimentée","Une faible température et un volume en légère dépression","Un feu en régression dont les braises refroidissent lentement"],"r":0,"e":"Selon le tableau de synthèse des phénomènes thermiques, la sortie rapide de la fumée indique une forte pression à l\u0027intérieur du volume et une température élevée. La vélocité des fumées fait partie des indicateurs observés dès l\u0027arrivée et des effets de la chaleur à prendre en compte.","ref":"§ 1.7.4 Synthèse des phénomènes (backdraft) — p. 26","p":"La sortie de la fumée rapide indique une forte pression à l\u0027intérieur du volume et une température élevée,","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"Le binôme fait face à un feu présentant peu de flammes du fait de sa sous-ventilation. Selon le guide, qu\u0027est-ce qui doit caractériser l\u0027opération ?","c":["La rapidité d\u0027action, pour éteindre le feu avant qu\u0027il n\u0027évolue","La maîtrise du risque d\u0027explosion de type backdraft ou FGI","L\u0027ouverture rapide des ouvrants pour évacuer les fumées","Une attaque continue à fort débit, porte grande ouverte"],"r":1,"e":"Un feu présentant peu de flammes du fait de sa sous-ventilation n\u0027est pas un feu naissant : il doit être traité avec les précautions propres aux feux sous-ventilés. La rapidité n\u0027est alors plus un critère d\u0027efficacité et de sécurité ; c\u0027est la maîtrise du risque d\u0027explosion de type backdraft ou fire gas ignition qui doit caractériser l\u0027opération.","ref":"§ 3.3.1 Feux naissant — p. 37","p":"la rapidité n\u0027est plus un critère d\u0027efficacité et de sécurité, la maîtrise du risque d\u0027explosion de type backdraft ou de fire-gas ignition doit au contraire caractériser cette opération.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu de cave en sous-sol. Quelle difficulté propre à ce type de feu devez-vous anticiper ?","c":["Un désenfumage difficile, à cause de culs-de-sac formant des volumes morts","Un faible potentiel calorifique, les sous-sols servant rarement au stockage","Un feu toujours bref, la sous-ventilation limitant fortement sa durée","Un accès aisé par de nombreux escaliers, faciles à garder fermés"],"r":0,"e":"Le désenfumage des sous-sols est en règle générale difficile en raison des culs-de-sac, volumes morts d\u0027où il est difficile de chasser les fumées. S\u0027y ajoutent des accès limités, des escaliers qui s\u0027enfument si des tuyaux empêchent de fermer les portes, des stockages à fort potentiel calorifique et une sous-ventilation pouvant permettre un feu de très longue durée.","ref":"§ 3.3.3 Feux en infrastructures (sous-sol) — p. 38","p":"Le désenfumage des sous-sols est en règle générale difficile à réaliser en raison de la présence fréquente de culs de sac qui constituent autant de volumes morts d\u0027où il est difficile de chasser les fumées","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"Parmi ces caractéristiques, laquelle le guide relève-t-il pour les feux de combles ?","c":["Un désenfumage et un recoupement efficaces, présents de façon systématique","Une absence de stockage, donc un faible potentiel calorifique","Un accès toujours aisé par un escalier aux normes","Des séparations avec le reste du bâtiment aux résistances aléatoires"],"r":3,"e":"Les combles sont séparés des autres parties du bâtiment par des éléments de construction variés aux résistances aléatoires (dalle béton, faux plafond, plaques de plâtre...). On peut y trouver des stockages à fort potentiel calorifique ; l\u0027accès y est difficile (trappes, échelles de meunier) et le recoupement comme le désenfumage y sont régulièrement absents.","ref":"§ 3.3.4.2 Les feux de combles — p. 39","p":"Séparés des autres parties du bâtiment par des éléments de constructions variés aux résistances aléatoires","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Le feu concerne la cage d\u0027un escalier non protégé. Quelles caractéristiques de cet escalier devez-vous prendre en compte ?","c":["Il reste à l\u0027abri des fumées et isolé des circulations","Il n\u0027est pas isolé des logements et sa stabilité n\u0027est pas assurée","Il dispose d\u0027un exutoire et de dispositifs de sécurité","Il ne sert jamais au passage de canalisations de gaz ou d\u0027électricité"],"r":1,"e":"Contrairement à l\u0027escalier protégé, à l\u0027abri des fumées et isolé, l\u0027escalier non protégé n\u0027est pas isolé des appartements et circulations, ne comporte pas de dispositifs de sécurité, n\u0027a pas de stabilité assurée et sert au passage des canalisations. Les enjeux sont de limiter la propagation à tout le bâtiment et de conserver l\u0027accès aux niveaux supérieurs.","ref":"§ 3.3.4.5 Les feux de cages d\u0027escalier — p. 40","p":"Non isolé des appartements et circulations ; Absence de dispositifs de sécurité (EC, CS, CH, …) ; Stabilité non assurée ;","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Bâtiment et lecture du feu","niv":"Chef d\u0027équipe","q":"Lors d\u0027un feu de façade, quel risque particulier présente une isolation renforcée par l\u0027extérieur ?","c":["Un possible « effet cheminée » le long des renforts verticaux","Un effondrement immédiat de la façade dès que les flammes l\u0027atteignent","Une suppression du rayonnement vers les bâtiments voisins","Une accumulation de gaz naturel derrière l\u0027isolant"],"r":0,"e":"Pour les feux de façades, l\u0027isolation régulièrement renforcée par l\u0027extérieur est une source de risque supplémentaire : selon le mode choisi, elle peut générer des phénomènes de type « effet cheminée » le long des renforts verticaux. Ces feux se caractérisent aussi par une propagation extérieure rapide sous forme de langue de feu.","ref":"§ 3.3.5 Équipements techniques — p. 41","p":"L\u0027isolation en façade, qui, selon le mode choisi, peut générer des phénomènes de type « effet cheminée », le long des renforts verticaux","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Équipier","q":"Outre l\u0027inhalation, par quelle voie les polluants d\u0027un incendie, comme l\u0027amiante, peuvent-ils atteindre l\u0027intervenant selon le guide ?","c":["Par voie cutanée, directement ou via les équipements souillés","Par aucune autre voie, l\u0027ARI protégeant totalement l\u0027intervenant","Par voie digestive seulement, lors des repas pris sur les lieux","Par voie sanguine seulement, en cas de plaie ouverte non protégée"],"r":0,"e":"Le guide demande de prendre en compte l\u0027amiante et les autres particules solides en suspension : ces polluants peuvent aussi agir par voie cutanée, directe ou indirecte, via les équipements et matériels souillés. L\u0027exposition dépend aussi de la fonction : attaque et déblai n\u0027exposent pas aux mêmes risques.","ref":"§ 4.5 Risques toxiques — p. 42","p":"La présence de polluants tel que l\u0027amiante et autres particules solides en suspensions doit être prise en compte. Ces polluants peuvent également agir par voie cutanée directe ou indirecte (via les équipements et matériels souillés).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Équipier","q":"Quels signes annonciateurs d\u0027un risque d\u0027effondrement les intervenants doivent-ils rechercher ?","c":["Des fumées blanches aux étages supérieurs et un bruit de vapeur à l\u0027intérieur","Des craquements, des fléchissements ou une déformation des ouvrants","Une baisse de pression à la lance et des à-coups dans les tuyaux","Des occupants nombreux dehors et le déclenchement de l\u0027alarme"],"r":1,"e":"Les structures sont fragilisées par le feu (chaleur, destruction, eaux d\u0027extinction) et les bâtiments à ossature métallique présentent un fort risque de ruine. Les intervenants recherchent les signes annonciateurs : craquements, fléchissements ou déformation des ouvrants de grands volumes ou d\u0027éléments comme un conduit de cheminée.","ref":"§ 4.7 Risques liés à la fragilisation des structures — p. 43","p":"Les intervenants doivent à nouveau rechercher les signes annonciateurs de type craquements, fléchissements ou déformation des ouvrants intéressant des grands volumes ou élément tel que conduit de cheminée.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Équipier","q":"La coupure électrique principale du bâtiment a été effectuée. Que rappelle le guide au sujet du risque électrique ?","c":["Le risque électrique est écarté, y compris lors de l\u0027usage des lances","Le risque ne subsiste que pour les lignes aériennes extérieures","Le dégarnissage peut désormais se faire sans précaution particulière","Il faut rester attentif à des branchements doublés ou temporaires"],"r":3,"e":"Les branchements sont parfois non réglementaires, doublés ou temporaires : même après la coupure principale, il faut rester attentif. Le risque concerne notamment l\u0027utilisation des lances et le déblai, en particulier le dégarnissage ; l\u0027éloignement et la mise en sécurité de l\u0027installation, avec les services spécialisés, en sont les principes.","ref":"§ 4.8 Risques liés à l\u0027électricité — p. 43","p":"Les branchements sont quelques fois non réglementaires, doublés ou temporaires, donc même si la coupure principale est effectuée, il faut rester attentif.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Équipier","q":"Parmi les gaz des fumées d\u0027incendie, lequel est à lui seul à l\u0027origine de 90 % des décès lors des analyses post-mortem ?","c":["L\u0027acide chlorhydrique (HCl)","Le dioxyde de soufre (SO2)","Le monoxyde de carbone (CO)","L\u0027ammoniac (NH3)"],"r":2,"e":"Le monoxyde de carbone, l\u0027acide cyanhydrique et le dioxyde de carbone sont à l\u0027origine de la quasi-totalité des décès dus à l\u0027intoxication par les fumées. Le CO est à lui seul à l\u0027origine de 90 % des décès lors des analyses post-mortem, ce que le guide relie aux concentrations extrêmement faibles de CO responsables d\u0027atteintes chez les personnes exposées.","ref":"§ FSCI-HOM-1 Les effets du feu sur l\u0027Homme, 5. Effets toxiques — p. 144","p":"A lui seul le monoxyde de carbone est à l\u0027origine de 90% des décès lors des analyses post-mortem (USDA Forest Service, 1991). Ceci est lié aux concentrations extrêmement faibles de CO responsable d\u0027atteintes chez les personnes exposées","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Équipier","q":"Pourquoi faut-il assurer un apport d\u0027eau suffisant durant toute l\u0027opération, sans attendre que l\u0027intervenant ait soif ?","c":["Parce que la perte en eau est précoce alors que la soif est tardive","Parce que l\u0027eau bue refroidit directement la tenue de feu de l\u0027intervenant","Parce que boire après l\u0027effort provoque systématiquement des crampes","Parce que la soif apparaît trop tôt et pousse à boire avec excès"],"r":0,"e":"Selon le guide, l\u0027hydratation est un des piliers de la remise en condition : la perte en eau est précoce et importante, la soif tardive, et l\u0027état d\u0027hydratation conditionne notamment la contraction musculaire et les capacités cognitives. Le guide rappelle qu\u0027une déshydratation importante et rapide survient dès 15 minutes d\u0027effort, y compris en formation.","ref":"§ FSCI-HOM-2 Gérer le stress thermique, 9. Apport hydrique et énergétique — p. 149","p":"La perte en eau est précoce, importante, la soif est tardive et l\u0027état d\u0027hydratation est déterminant pour de nombreuses fonctions essentielles (telles que la contraction musculaire, les capacités cognitives,), il faut assurer un apport d\u0027eau suffisant durant toute l\u0027opération","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Risques pour les intervenants","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès : la contrainte pesant sur votre équipage augmente (forte chaleur, intervention longue). Comment adapter le ratio travail/repos ?","c":["L\u0027augmenter, pour terminer la mission avant l\u0027épuisement de l\u0027équipage","Le maintenir identique, le ratio étant fixé quelle que soit la contrainte","L\u0027adapter seulement si un équipier se plaint de la chaleur","L\u0027abaisser, en accordant davantage de repos par rapport au travail"],"r":3,"e":"Le guide préconise de fractionner l\u0027effort avec des temps de repos suffisants pour évacuer la chaleur accumulée. Des indicateurs (ambiance thermique, durée et horaires de l\u0027intervention, niveau de risque) aident à estimer la contrainte : plus elle est importante, plus le ratio travail/repos doit être bas. Si l\u0027opération impose d\u0027allonger le travail, il faut ensuite augmenter les phases de repos.","ref":"§ FSCI-HOM-2 Gérer le stress thermique, 8.1 Fractionnement de l\u0027effort — p. 149","p":"Plus la contrainte est importante plus le ratio travail / repos doit être bas.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"En reconnaissance, vous découvrez un feu de poubelle dans un bureau et envoyez un binôme avec un seau-pompe. Quel risque le guide souligne-t-il ?","c":["Que le seau-pompe disperse les braises et propage le feu au mobilier","Que l\u0027eau du seau-pompe déclenche un embrasement par vaporisation","Qu\u0027à son arrivée le binôme trouve un feu en plein développement","Que le binôme manque ensuite d\u0027eau pour le déblai de la poubelle"],"r":2,"e":"Le feu de structure évolue à l\u0027échelle de quelques minutes, comparable aux délais de mise en œuvre des actions : le binôme désigné risque de se retrouver face à un feu en plein développement contre lequel il n\u0027est pas suffisamment armé. L\u0027anticipation de l\u0027évolution du sinistre est donc primordiale.","ref":"§ 1.1 L\u0027évolution de la situation — p. 48","p":"lorsque le binôme d\u0027attaque désigné arrivera quelques minutes après avec son seau pompe, il risque de se retrouver face à un feu en plein développement contre lequel il n\u0027est pas suffisamment armé.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Équipier","q":"Lors d\u0027un engagement prolongé dans la chaleur, comment évolue la protection apportée par la tenue (EPI) selon le guide ?","c":["Elle reste constante tant que la tenue n\u0027est pas abîmée","Elle peut chuter fortement quand sa face interne s\u0027échauffe","Elle augmente, la tenue se rigidifiant sous la chaleur","Elle ne dépend que du temps restant dans la bouteille d\u0027ARI"],"r":1,"e":"Le temps peut jouer contre les sapeurs-pompiers : l\u0027effet de protection des EPI peut se réduire de façon importante lorsque l\u0027effet d\u0027inertie disparaît et que l\u0027EPI monte en température sur sa face interne. Un engagement trop long diminue ainsi la protection thermique de l\u0027intervenant.","ref":"§ 2.2 Tactiques défensives — p. 50","p":"l\u0027effet de protection des EPI peut se réduire de façon importante lorsque l\u0027effet d\u0027inertie disparait et que l\u0027EPI monte en température sur sa face interne.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Équipier","q":"Sur feu, de quelles causes résultent le plus souvent les accidents graves de sapeurs-pompiers selon le guide ?","c":["Des brûlures dues à des EPI mal ajustés ou mal fermés","Des intoxications au monoxyde de carbone en surveillance","Des glissades et chutes sur des sols détrempés par l\u0027eau","Du déplacement des effets du feu et des effondrements"],"r":3,"e":"Les accidents graves les plus fréquents sur feu résultent du déplacement des effets du feu (fumées, chaleur, flammes), les SP se trouvant piégés, et des effondrements ou chutes de matériaux. Le guide décrit une zone de danger non maîtrisé lorsque les SP s\u0027engagent dans les volumes en feu avec des moyens insuffisamment agressifs.","ref":"§ 2.3 Tactiques de transition — p. 51","p":"Sur feu, les accidents graves les plus fréquents résultent le plus souvent de l\u0027une des causes suivantes : Déplacement des effets du feu (fumées, chaleur, flammes), les SP se trouvant piégés ; Effondrements, chute de matériaux,","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès sur un feu d\u0027appartement en étage ; des occupants se trouvent aux étages supérieurs. Pourquoi faire maintenir la porte palière fermée ?","c":["Pour empêcher les occupants de revenir chercher leurs affaires","Pour isoler le feu des victimes potentielles situées sur le trajet des fumées","Pour que la chaleur accumulée facilite l\u0027extinction à l\u0027ouverture de la porte","Parce qu\u0027une porte palière est toujours coupe-feu tant qu\u0027elle est fermée"],"r":1,"e":"L\u0027isolement du feu est une condition de sécurité majeure si des victimes potentielles se trouvent dans le cheminement des fumées, comme ici les occupants des étages supérieurs. Restreindre l\u0027alimentation en air du feu peut en outre permettre de stabiliser la situation en attendant la mise en œuvre des moyens d\u0027extinction.","ref":"§ Ch. 2 Section II, 2 Les typologies de tactiques — p. 52","p":"l\u0027isolement du feu est une condition de sécurité majeure si les victimes potentielles sont dans le cheminement des fumées de l\u0027incendie","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"Parmi les termes de qualification de la situation, que signifie « feu stabilisé » ?","c":["Le feu ne progresse pas : plein développement atteint ou manque d\u0027air","Le feu ne peut plus se propager hors de son volume grâce aux moyens en place","Les moyens engagés réduisent l\u0027énergie produite et le feu entre en décroissance","Le feu décroît, généralement parce qu\u0027il est limité par le combustible"],"r":0,"e":"Feu stabilisé : le feu ne progresse pas, soit parce qu\u0027il a atteint son plein développement, soit parce que les conditions ne permettent pas son développement (manque d\u0027air par exemple). Les autres propositions décrivent le feu circonscrit, le maître du feu et le feu en régression.","ref":"§ 1 Qualification de la situation — p. 57","p":"Feu stabilisé : le feu ne progresse pas, soit parce qu\u0027il a atteint son plein développement et ne pourra pas aller au-delà, soit parce que les conditions ne permettent pas son développement (manque d\u0027air par exemple) ;","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"Dans un message, que signifie le terme « feu circonscrit » ?","c":["Le feu ne peut plus se propager hors du volume qu\u0027il concerne","Le feu est totalement éteint et les opérations de lutte sont terminées","Le feu perd de l\u0027intensité mais peut encore gagner les locaux voisins","Les reconnaissances sont terminées et la première lance est en place"],"r":0,"e":"Feu circonscrit : le feu ne peut plus se propager hors du volume concerné, grâce aux dispositifs constructifs ou aux actions des équipes. Suivent « maître du feu », « foyer(s) principal(aux) éteint(s) », où débutent déblai et surveillance, puis « feu éteint », qui marque la fin des opérations de lutte.","ref":"§ 2 Résultat des actions engagées — p. 58","p":"Feu circonscrit : le feu concernant un volume donné (lui-même potentiellement constitué du plusieurs autres volumes : principe de boîtes), ne peut plus se propager en dehors de celui-ci.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, premier COS, et transmettez « maître du feu ». Que signifie ce terme ?","c":["Le feu est éteint et le déblai est terminé, les engins peuvent rentrer","Le feu s\u0027étend encore malgré les lances, mais le commandement reste assuré","Les moyens engagés réduisent l\u0027énergie du feu, qui entre en décroissance","Le déblai est achevé et la surveillance est confiée au propriétaire"],"r":2,"e":"« Maître du feu » signifie que les moyens mis en œuvre aboutissent à la réduction de la production d\u0027énergie par le feu, qui entre en phase de décroissance. Ces termes renseignent efficacement la hiérarchie et maintiennent les équipes en alerte : tant que le feu n\u0027est pas éteint, elles restent vigilantes.","ref":"§ 2 Résultat des actions engagées — p. 58","p":"Maître du feu : les moyens mis en œuvre aboutissent à la réduction de la production d\u0027énergie par le feu. Il rentre ainsi en phase de décroissance ;","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Tactique et analyse de situation","niv":"Chef d\u0027agrès","q":"Lors du positionnement de votre engin, pourquoi le guide demande-t-il de prendre en compte les conditions astro-météorologiques ?","c":["Pour garantir l\u0027éclairage naturel du chantier à la tombée de la nuit","Pour protéger la pompe et les tuyaux du gel en cas de longue opération","Pour placer l\u0027engin face au vent et faciliter le refroidissement du moteur","Pour éviter de se retrouver dans la plume de propagation de la fumée"],"r":3,"e":"Le positionnement des engins vise notamment la sécurité (à l\u0027abri de l\u0027expansion du sinistre et des chutes de matériaux) et l\u0027accessibilité ; la prise en compte des conditions astro-météorologiques permet d\u0027éviter de se retrouver dans la plume de fumée. Il faut aussi préserver l\u0027accès des moyens arrivant ensuite, en particulier aériens.","ref":"§ 3.4 Le positionnement des engins — p. 59","p":"La prise en compte des conditions astro-météorologiques permet d\u0027éviter de se retrouver dans la plume de propagation de la fumée ;","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027équipe","q":"Engagé avec son binôme, un chef d\u0027équipe fait face à un péril imminent. Que prévoit le guide ?","c":["Attendre l\u0027ordre du chef d\u0027agrès avant d\u0027entreprendre toute action","Poursuivre la mission et rendre compte à la fin de l\u0027intervention","Agir de façon conservatoire et rendre compte sans délai","Rendre compte uniquement si la situation continue de se dégrader"],"r":2,"e":"Chaque intervenant, à son niveau, est chargé de surveiller, évaluer et rendre compte des situations dangereuses. Face à un péril imminent, il réalise les actions conservatoires qu\u0027il estime nécessaires et rend compte sans délai, sans attendre un ordre ni la fin de l\u0027intervention.","ref":"§ 1.1 Rôle des intervenants en matière de sécurité — p. 61","p":"Face à un péril imminent, chaque intervenant doit réaliser les actions conservatoires qu\u0027il estime nécessaire, il rend compte sans délai.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Équipier","q":"Selon le guide, qui est le premier responsable de la sécurité d\u0027un équipier ou d\u0027un chef d\u0027équipe engagé sur un feu ?","c":["Le chef d\u0027agrès qui a engagé son binôme","Le contrôleur placé au point d\u0027entrée","Le binôme de sécurité en zone contrôlée","Lui-même, directement exposé aux risques"],"r":3,"e":"Directement confronté aux risques de l\u0027incendie, l\u0027équipier ou le chef d\u0027équipe est le premier responsable de sa propre sécurité : il lit le feu, porte ses EPI de façon appropriée, respecte les consignes de sécurité du chef d\u0027agrès et communique avec ses collaborateurs. Le chef d\u0027agrès et le COS participent aussi à sa sécurité.","ref":"§ 1.1.1 L\u0027intervenant équipier ou chef d\u0027équipe — p. 61","p":"Directement confronté aux risques générés par l\u0027incendie, l\u0027intervenant équipier ou chef d\u0027équipe est le premier responsable de sa propre sécurité.","s":"gdo-inc"},
