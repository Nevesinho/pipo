    document.getElementById('go').onclick=()=>{const s=shuffle(p);startQuiz(count==='all'?s:s.slice(0,+count),t.nom);};
  }
  draw();window.scrollTo(0,0);
}

/* ───── Fiches de cours ───── */
function fichesPicker(){
  screen='fiches';
  app.innerHTML=`<h2>Fiches de cours</h2><p class="lead">L'essentiel de chaque chapitre, à lire avant de t'entraîner. Chaque point renvoie à la section et à la page du guide.</p><div class="themes">${THEMES.map(t=>{const n=FICHES.filter(f=>f.t===t.id);if(!n.length)return '';const pts=n.reduce((a,f)=>a+f.pts.length,0);return `<button class="card" type="button" data-f="${t.id}"><span class="nom">${esc(t.nom)}</span><span class="pct">${n.length} ch.</span><span class="sub">${pts} points clés</span></button>`;}).join('')}</div><div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>fiche(b.dataset.f));
  document.getElementById('back').onclick=home;window.scrollTo(0,0);
}
function pointHtml(p){const i=p.t.indexOf(' : ');const txt=i>0&&i<60?`<b>${esc(p.t.slice(0,i))}</b> : ${esc(p.t.slice(i+3))}`:esc(p.t);return `<li><span>${txt}</span><span class="ref">${esc(p.ref||'')}</span></li>`;}
function fiche(tid,chs){
  screen='fiche';
  const t=themeOf(tid);const fs=FICHES.filter(f=>f.t===tid&&(!chs||chs.includes(f.ch)));
  app.innerHTML=`<div class="eyebrow">Fiche de cours · ${esc(t.court)}</div><h2>${esc(t.nom)}</h2><p class="lead">Source : ${esc(t.src)}.</p>
  ${fs.map(f=>`<section class="fiche"><h3>${esc(f.ch)}</h3><ul>${f.pts.map(pointHtml).join('')}</ul><div class="actions"><button class="btn small" type="button" data-q="${esc(f.ch)}">S'entraîner sur ce chapitre</button></div></section>`).join('')||'<p class="empty">Pas encore de fiche pour cette sélection.</p>'}
  <div class="actions"><button class="btn ghost" id="back" type="button">Retour au guide</button><button class="btn primary" id="go" type="button">Quiz sur ${fs.length>1?'ces chapitres':'ce chapitre'}</button></div>`;
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const l=pool().filter(q=>q.t===tid&&q.ch===b.dataset.q);startQuiz(shuffle(l).slice(0,20),t.nom+' · '+b.dataset.q);});
  document.getElementById('back').onclick=()=>themeScreen(tid,chs);
  document.getElementById('go').onclick=()=>{const set=new Set(fs.map(f=>f.ch));startQuiz(shuffle(pool().filter(q=>q.t===tid&&set.has(q.ch))).slice(0,20),t.nom);};
  window.scrollTo(0,0);
}

/* ───── Points faibles ───── */
function weak(){
  const groups={};pool().forEach(q=>{const k=q.t+'|'+q.ch;(groups[k]=groups[k]||[]).push(q);});
  const ranked=Object.entries(groups).map(([k,l])=>({k,l,s:stats(l)})).filter(g=>g.s.seen>=3).sort((a,b)=>a.s.pct-b.s.pct||b.s.wrong-a.s.wrong);
  if(!ranked.length||ranked[0].s.pct>=90){app.innerHTML=`<h2>Mes points faibles</h2><p class="lead">${ranked.length?'Aucun chapitre sous 90 % de réussite : bravo. Continue avec la révision du jour ou de nouvelles questions.':'Réponds d\'abord à quelques questions (au moins 3 par chapitre) pour que l\'appli repère tes chapitres les moins maîtrisés.'}</p><div class="actions"><button class="btn primary" id="back" type="button">Accueil</button></div>`;document.getElementById('back').onclick=home;return;}
  const picked=[];const names=[];
  for(const g of ranked){if(picked.length>=20||g.s.pct>=90)break;names.push(g);const l=[...shuffle(g.l.filter(isWrong)),...shuffle(g.l.filter(q=>!isSeen(q))),...shuffle(g.l.filter(q=>isSeen(q)&&!isWrong(q)&&!isMastered(q)))];picked.push(...l.slice(0,Math.min(8,20-picked.length)));}
  screen='weak';
  app.innerHTML=`<h2>Mes points faibles</h2><p class="lead">Les chapitres où tu réussis le moins, d'après tes réponses. Relis la fiche puis entraîne-toi.</p>
  <div class="table-wrap"><table><thead><tr><th>Chapitre</th><th>Réussite</th><th></th></tr></thead><tbody>${names.map(g=>{const [tid,ch]=g.k.split('|');return `<tr><td>${esc(themeOf(tid).court)} · ${esc(ch)}</td><td class="num">${g.s.pct}% (${g.s.seen} vues)</td><td><button class="link" type="button" data-fiche="${esc(g.k)}">Fiche</button></td></tr>`;}).join('')}</tbody></table></div>
  <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button><button class="btn primary" id="go" type="button">S'entraîner · ${picked.length} questions</button></div>`;
  app.querySelectorAll('[data-fiche]').forEach(b=>b.onclick=()=>{const [tid,ch]=b.dataset.fiche.split('|');fiche(tid,[ch]);});
  document.getElementById('back').onclick=home;
  document.getElementById('go').onclick=()=>startQuiz(shuffle(picked),'Points faibles');
  window.scrollTo(0,0);
}

/* ───── Quiz d'entraînement et examen blanc ───── */
let quiz=null,timerH=null;
function stopTimer(){clearInterval(timerH);timerH=null;}
function startQuiz(list,title,exam){
  if(!list.length){home();return;}
  screen='quiz';stopTimer();
  quiz={list,title,i:0,answers:[],exam:!!exam,start:Date.now(),end:exam?Date.now()+EXAM_MIN*60000:0};
  if(exam)timerH=setInterval(tick,1000);
  renderQ();
}
function tick(){const el=document.getElementById('timer');const left=Math.max(0,quiz.end-Date.now());if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('low',left<5*60000);}if(!left){stopTimer();toast('Temps écoulé');finish(false);}}
function renderQ(){
  const q=quiz.list[quiz.i];const opts=shuffle(q.c.map((c,i)=>({c,i})));quiz.opts=opts;quiz.picked=null;quiz.done=false;
  const t=themeOf(q.t);
  app.innerHTML=`<div class="progress"><span>${quiz.i+1}/${quiz.list.length}</span><span class="bar"><i style="width:${100*quiz.i/quiz.list.length}%"></i></span>${quiz.exam?'<span class="timer" id="timer">'+EXAM_MIN+':00</span>':'<span>'+esc(quiz.title)+'</span>'}</div>
  <div class="qbox"><div class="eyebrow">${esc(t.court)} · ${esc(q.ch)} · ${esc(LEVELS[q.lv])}</div><p class="question">${esc(q.q)}</p></div>
  <div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span class="k">${letters[k]}</span><span>${esc(o.c)}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <div class="actions"><button class="btn ghost" id="quit" type="button">${quiz.exam?'Terminer':'Quitter'}</button><button class="btn primary" id="next" type="button" disabled>${quiz.exam?(quiz.i+1<quiz.list.length?'Valider et continuer':'Valider et terminer'):'Suivant'}</button></div>`;
  if(quiz.exam)tick();
  document.getElementById('quit').onclick=()=>finish(true);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  window.scrollTo(0,0);
}
function choose(i){
  if(quiz.done)return;
  if(quiz.exam){quiz.picked=i;app.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));const n=document.getElementById('next');n.disabled=false;n.onclick=()=>{commit(i);quiz.i++;quiz.i<quiz.list.length?renderQ():finish(false);};return;}
  commit(i);showFeedback(i);
}
function commit(i){const q=quiz.list[quiz.i];const good=i===q.r;quiz.done=true;quiz.answers.push({q,good,picked:i});record(q,good);}
function feedbackHtml(q,good,picked){
  return `<div class="feedback ${good?'good':'bad'}"><p class="verdict">${good?'Exact.':'Non. Bonne réponse : '+esc(q.c[q.r])}</p><p>${esc(q.e)}</p>${q.p?`<blockquote class="proof"><span class="eyebrow">Extrait du guide</span>« ${esc(q.p)} »</blockquote>`:''}<p class="ref">Réf. ${esc(refOf(q))}</p>
  <div class="fb-tools">${FICHES.some(f=>f.t===q.t&&f.ch===q.ch)?`<button class="link" type="button" data-fiche-of="${esc(q.id)}">Revoir la fiche du chapitre</button>`:''}${inClaude()?`<button class="link" type="button" data-flag="${esc(q.id)}">Signaler une erreur</button>`:''}</div><div data-flagbox="${esc(q.id)}"></div></div>`;
}
function wireFeedback(root){
  root.querySelectorAll('[data-fiche-of]').forEach(b=>b.onclick=()=>{const q=QUESTIONS.find(x=>x.id===b.dataset.ficheOf);stopTimer();fiche(q.t,[q.ch]);});
  root.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>flagForm(b.dataset.flag,root.querySelector(`[data-flagbox="${b.dataset.flag}"]`)));
}
function showFeedback(i){
  const q=quiz.list[quiz.i];const good=i===q.r;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const bi=+b.dataset.i;if(bi===q.r)b.classList.add('good');else if(bi===i)b.classList.add('wrong');});
  const fb=document.getElementById('fb');fb.innerHTML=feedbackHtml(q,good,i);wireFeedback(fb);
  const n=document.getElementById('next');n.disabled=false;n.textContent=quiz.i+1<quiz.list.length?'Suivant':'Voir le résultat';n.onclick=()=>{quiz.i++;quiz.i<quiz.list.length?renderQ():finish(false);};
  n.focus({preventScroll:true});
}
function finish(early){
  stopTimer();screen='result';
  const a=quiz.answers;if(!a.length){home();return;}
  const ok=a.filter(x=>x.good).length;const n=quiz.exam?quiz.list.length:a.length;const pct=Math.round(100*ok/n);
  let extra='';
  if(quiz.exam){
    const dur=Math.round((Date.now()-quiz.start)/60000);
    st.exams.push({at:Date.now(),n,ok,lvl:st.lvl,min:dur});st.exams=st.exams.slice(-40);save();
    const by={};a.forEach(x=>{const k=x.q.t;by[k]=by[k]||{n:0,ok:0};by[k].n++;if(x.good)by[k].ok++;});
    extra=`<div class="note" style="border:0;margin-top:4px">${n-a.length?`${n-a.length} question${n-a.length>1?'s':''} sans réponse (comptée${n-a.length>1?'s':''} fausse${n-a.length>1?'s':''}). `:''}Durée : ${dur} min.</div>
    <div class="table-wrap" style="text-align:left;margin-top:12px"><table><thead><tr><th>Guide</th><th>Résultat</th></tr></thead><tbody>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(themeOf(k).court)}</td><td class="num">${v.ok}/${v.n}</td></tr>`).join('')}</tbody></table></div>`;
  }
  let h=`<div class="result"><div class="eyebrow">${esc(quiz.title)}${early&&!quiz.exam?' · interrompu':''}</div><div class="score">${ok}<small> / ${n}</small></div>${quiz.exam?`<div class="note" style="border:0;font-family:var(--mono);color:var(--fg)">Note : ${String(Math.round(ok/n*40)/2).replace('.',',')} / 20</div>`:''}<p class="lead">${pct>=80?'Solide. Les questions réussies reviendront dans quelques jours.':pct>=50?'Correct. Relis les corrections ci-dessous : les questions ratées reviennent dès demain dans la révision du jour.':'À retravailler : relis la fiche des chapitres concernés, puis refais ce quiz.'}</p>
  <div class="actions"><button class="btn primary" id="again" type="button">${quiz.exam?'Nouvel examen':'Refaire'}</button><button class="btn" id="home2" type="button">Accueil</button></div></div>${extra}`;
  const miss=a.filter(x=>!x.good);
  if(miss.length){h+=`<div class="eyebrow" style="margin-top:16px">Questions ratées (${miss.length})</div><div class="review">`+miss.map(x=>`<div class="item"><p><b>${esc(x.q.q)}</b></p><p>Ta réponse : ${esc(x.q.c[x.picked])}</p><p style="color:var(--ok)">Bonne réponse : ${esc(x.q.c[x.q.r])}</p><p>${esc(x.q.e)}</p>${x.q.p?`<blockquote class="proof"><span class="eyebrow">Extrait du guide</span>« ${esc(x.q.p)} »</blockquote>`:''}<p class="ref">Réf. ${esc(refOf(x.q))}</p><div class="fb-tools">${inClaude()?`<button class="link" type="button" data-flag="${esc(x.q.id)}">Signaler une erreur</button>`:''}</div><div data-flagbox="${esc(x.q.id)}"></div></div>`).join('')+'</div>';}
  app.innerHTML=h;wireFeedback(app);
  const wasExam=quiz.exam;
  document.getElementById('again').onclick=()=>wasExam?examIntro():startQuiz(shuffle(quiz.list),quiz.title);
  document.getElementById('home2').onclick=home;
  window.scrollTo(0,0);
}
function examIntro(){
  screen='exam';
  const last=(st.exams||[]).slice(-5).reverse();
  app.innerHTML=`<h2>Examen blanc</h2><p class="lead">${EXAM_N} questions tirées au hasard dans tous les guides, au niveau ${esc(LEVELS[st.lvl])}. ${EXAM_MIN} minutes. Pas de correction pendant l'épreuve : tu vois ta note sur 20 et toutes les corrections à la fin.</p>
  ${last.length?`<div class="eyebrow">Derniers examens</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Score</th><th>Note</th></tr></thead><tbody>${last.map(x=>`<tr><td>${new Date(x.at).toLocaleDateString('fr-FR')}</td><td class="num">${x.ok}/${x.n}</td><td class="num">${String(Math.round(x.ok/x.n*40)/2).replace('.',',')} / 20</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button><button class="btn primary" id="go" type="button">Commencer l'examen</button></div>`;
  document.getElementById('back').onclick=home;
  document.getElementById('go').onclick=()=>{
    // tirage réparti : au moins une question par guide disponible, puis complété au hasard
    const all=pool();const byT={};all.forEach(q=>{(byT[q.t]=byT[q.t]||[]).push(q);});
    let pick=Object.values(byT).map(l=>shuffle(l)[0]);pick=shuffle(pick).slice(0,EXAM_N);
    const rest=shuffle(all.filter(q=>!pick.includes(q)));pick=pick.concat(rest.slice(0,EXAM_N-pick.length));
    startQuiz(shuffle(pick),'Examen blanc',true);
  };
  window.scrollTo(0,0);
}

/* ───── Signaler une erreur ───── */
function flagForm(qid,box){
  if(!box||box.innerHTML)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  box.innerHTML=`<form class="flagform" id="ff-${esc(qid)}"><label class="eyebrow" for="ft-${esc(qid)}">Type de problème</label><select id="ft-${esc(qid)}"><option>Réponse fausse</option><option>Question ambiguë</option><option>Explication incomplète</option><option>Faute ou coquille</option><option>Autre</option></select><label class="eyebrow" for="fm-${esc(qid)}">Ce qui ne va pas (facultatif)</label><textarea id="fm-${esc(qid)}" placeholder="Ex. : mon SDIS enseigne… / la page indiquée ne correspond pas…"></textarea><button class="btn small primary" type="submit">Envoyer le signalement</button></form>`;
  box.querySelector('form').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const f={qid,t:q.t,ch:q.ch,q:q.q,type:box.querySelector('select').value,msg:box.querySelector('textarea').value.trim().slice(0,1000),at:new Date().toISOString()};
    let sent=false;
    if(db){try{await db.collection('signalements').add(f);sent=true;}catch(e){}}
    if(!sent){st.flags=(st.flags||[]).concat(f);save();}
    box.innerHTML=`<p class="ref">${sent?'Signalement envoyé. Claude pourra le lire pour corriger la question.':'Signalement gardé sur cet appareil : il n\'a pas pu être envoyé depuis ce compte ou sans connexion.'}</p>`;
  });
}

/* ───── Recherche ───── */
function search(){
  screen='search';stopTimer();
  app.innerHTML=`<h2>Rechercher</h2><p class="lead">Un mot ou une notion (ex. « backdraft », « LSPCC », « distance d'approche ») : questions, réponses, explications et fiches.</p>
  <input class="search" id="sq" type="search" placeholder="Rechercher…" autocomplete="off"><div id="sr" class="review"></div>
  <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button></div>`;
  const inp=document.getElementById('sq'),out=document.getElementById('sr');
  const QI=QUESTIONS.map(q=>({q,s:fold([q.q,q.c[q.r],q.e,q.p||'',q.ch].join(' '))}));
  const FI=[];FICHES.forEach(f=>f.pts.forEach(p=>FI.push({f,p,s:fold(p.t+' '+f.ch)})));
  function run(){
    const terms=fold(inp.value).split(/\s+/).filter(w=>w.length>1);
    if(!terms.length){out.innerHTML='';return;}
    const fq=FI.filter(x=>terms.every(w=>x.s.includes(w))).slice(0,8);
    const qq=QI.filter(x=>terms.every(w=>x.s.includes(w))).slice(0,40);
    out.innerHTML=(fq.length?fq.map(x=>`<div class="item ok"><p class="eyebrow">Fiche · ${esc(themeOf(x.f.t).court)} · ${esc(x.f.ch)}</p><p>${esc(x.p.t)}</p><p class="ref">${esc(x.p.ref||'')}</p></div>`).join(''):'')+
      (qq.length?qq.map(x=>`<div class="item ok"><p class="eyebrow">${esc(themeOf(x.q.t).court)} · ${esc(x.q.ch)} · ${esc(x.q.niv)}</p><p><b>${esc(x.q.q)}</b></p><p style="color:var(--ok)">${esc(x.q.c[x.q.r])}</p><p>${esc(x.q.e)}</p><p class="ref">Réf. ${esc(refOf(x.q))}</p></div>`).join(''):'')+
      (!fq.length&&!qq.length?'<p class="empty">Aucun résultat. Essaie un autre mot ou une orthographe plus courte.</p>':'');
  }
  let h=null;inp.oninput=()=>{clearTimeout(h);h=setTimeout(run,150);};
  document.getElementById('back').onclick=home;inp.focus();window.scrollTo(0,0);
}

/* ───── Progression ───── */
function progress(){
  screen='stats';stopTimer();
  const all=pool();const s=stats(all);
  const boxes=[0,0,0,0,0,0,0];all.forEach(q=>{const e=S_(q);boxes[e?e[0]:0]++;});
  const cols=['var(--line)','var(--bad)','var(--warn)','#c9a227','var(--accent)','var(--ok)','var(--ok)'];
  const lab=['Jamais vues','À revoir','Boîte 2','Boîte 3','Boîte 4','Boîte 5','Boîte 6'];
  const ex=(st.exams||[]).slice(-10).reverse();
  app.innerHTML=`<h2>Ma progression</h2><p class="lead">Niveau ${esc(LEVELS[st.lvl])} · ${all.length} questions. Une question est maîtrisée quand tu l'as réussie plusieurs fois de suite à quelques jours d'intervalle (boîte 4 et plus).</p>
  <div class="stats"><div class="stat"><b>${s.seen}</b><span>vues</span></div><div class="stat"><b>${s.m}</b><span>maîtrisées</span></div><div class="stat"><b>${s.seen?s.pct+'%':'—'}</b><span>de réussite</span></div></div>
  <div class="boxes" role="img" aria-label="Répartition des questions par boîte de révision">${boxes.map((n,i)=>n?`<i style="width:${100*n/all.length}%;background:${cols[i]}"></i>`:'').join('')}</div>
  <div class="legend">${boxes.map((n,i)=>`<span style="--c:${cols[i]}">${lab[i]} · ${n}</span>`).join('')}</div>
  <h3 style="margin-top:20px">Par guide</h3>
  <div class="table-wrap"><table><thead><tr><th>Guide</th><th>Vues</th><th>Maîtrisées</th><th>Réussite</th></tr></thead><tbody>${THEMES.map(t=>{const l=all.filter(q=>q.t===t.id);if(!l.length)return '';const x=stats(l);return `<tr><td><button class="link" type="button" data-theme="${t.id}">${esc(t.court)}</button></td><td class="num">${x.seen}/${l.length}</td><td class="num">${x.m}</td><td class="num">${x.seen?x.pct+'%':'—'}</td></tr>`;}).join('')}</tbody></table></div>
  <h3 style="margin-top:20px">Examens blancs</h3>
  ${ex.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Niveau</th><th>Score</th><th>Note</th></tr></thead><tbody>${ex.map(x=>`<tr><td>${new Date(x.at).toLocaleDateString('fr-FR')}</td><td>${esc(LEVELS[x.lvl]||'')}</td><td class="num">${x.ok}/${x.n}</td><td class="num">${String(Math.round(x.ok/x.n*40)/2).replace('.',',')} / 20</td></tr>`).join('')}</tbody></table></div>`:'<p class="lead">Aucun examen blanc pour l\'instant.</p>'}
  <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button><button class="btn" id="reset" type="button">Remettre à zéro</button></div>`;
  app.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>themeScreen(b.dataset.theme));
  document.getElementById('back').onclick=home;
  document.getElementById('reset').onclick=()=>{
    app.innerHTML=`<h2>Remettre la progression à zéro ?</h2><p class="lead">Les questions vues, les révisions programmées et l'historique des examens seront effacés${progRef?' sur tous tes appareils':' sur cet appareil'}.</p><div class="actions"><button class="btn ghost" id="no" type="button">Annuler</button><button class="btn primary" id="yes" type="button">Oui, effacer</button></div>`;
    document.getElementById('no').onclick=progress;
    document.getElementById('yes').onclick=()=>{st.srs={};st.exams=[];save();home();toast('Progression remise à zéro');};
  };
  window.scrollTo(0,0);
}

/* ───── Flashcards ───── */
function flashPicker(){
  screen='flashpick';
  let sel=new Set(THEMES.map(t=>t.id));
  function draw(){
    app.innerHTML=`<h2>Flashcards</h2><p class="lead">Question au recto, réponse et explication au verso. Touche la carte pour la retourner. Niveau : ${esc(LEVELS[st.lvl])}.</p>
    <div class="chips">${THEMES.map(t=>`<button class="chip ${sel.has(t.id)?'on':''}" type="button" data-t="${t.id}">${esc(t.court)}</button>`).join('')}</div>
    <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button><button class="btn primary" id="go" type="button" ${sel.size?'':'disabled'}>Commencer</button></div>`;
    app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{sel.has(c.dataset.t)?sel.delete(c.dataset.t):sel.add(c.dataset.t);draw();});
    document.getElementById('back').onclick=home;
    document.getElementById('go').onclick=()=>{const l=pool().filter(q=>sel.has(q.t));if(l.length)flash(shuffle(l));};
  }
  draw();
}
function flash(list){
  screen='flash';
  let i=0,flipped=false;
  function draw(){
    const q=list[i];const t=themeOf(q.t);
    app.innerHTML=`<div class="progress"><span>${i+1}/${list.length}</span><span class="bar"><i style="width:${100*(i+1)/list.length}%"></i></span><span>Flashcards</span></div>
    <div class="flash" id="card" tabindex="0" role="button" aria-pressed="${flipped}"><div class="side">${(flipped?'Verso · ':'Recto · ')+esc(t.court)+' · '+esc(q.ch)}</div>
    ${flipped?`<p class="answer">${esc(q.c[q.r])}</p><p>${esc(q.e)}</p><p class="ref">Réf. ${esc(refOf(q))}</p>`:`<p class="question">${esc(q.q)}</p>`}</div>
    <div class="actions"><button class="btn ghost" id="prev" type="button" ${i?'':'disabled'}>Précédente</button><button class="btn" id="flip" type="button">${flipped?'Voir la question':'Voir la réponse'}</button><button class="btn primary" id="nx" type="button">${i+1<list.length?'Suivante':'Terminer'}</button></div>`;
    const card=document.getElementById('card');const flip=()=>{flipped=!flipped;draw();};
    card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
    document.getElementById('flip').onclick=flip;
    document.getElementById('prev').onclick=()=>{i--;flipped=false;draw();};
    document.getElementById('nx').onclick=()=>{if(i+1<list.length){i++;flipped=false;draw();}else home();};
  }
  draw();
}

/* ───── Clavier (ordinateur) : 1-4 ou A-D pour répondre, Entrée pour continuer ───── */
document.addEventListener('keydown',e=>{
  const tg=e.target;if(screen!=='quiz'||(tg&&tg.closest&&tg.closest('input,textarea,select')))return;
  const k=e.key.toLowerCase();const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);
  if(idx>=0&&quiz&&quiz.opts&&!quiz.done){const o=quiz.opts[idx];if(o){e.preventDefault();choose(o.i);}}
  else if(k==='enter'){const n=document.getElementById('next');if(n&&!n.disabled&&document.activeElement!==n){e.preventDefault();n.click();}}
});

document.getElementById('home-btn').onclick=home;
document.getElementById('search-btn').onclick=search;
document.getElementById('stats-btn').onclick=progress;
home();
})();
</script>

</body></html>
