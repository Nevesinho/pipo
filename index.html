{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"Que retient le guide à propos du jet droit ?","c":["Il dépose une masse d\u0027eau en limitant l\u0027effet cinétique, robinet peu ouvert","Il atteint une cible à distance mais consomme en général beaucoup d\u0027eau","Il produit de fines gouttelettes idéales pour refroidir la couche de fumées","Il s\u0027emploie surtout en phase de déblai, à faible débit, pour limiter l\u0027eau"],"r":1,"e":"Le jet droit sert à atteindre une cible à distance (atténuation, attaque massive, ricochet…) ; il est généralement consommateur d\u0027eau, le débit influant sur la distance projetée. L\u0027envoi d\u0027une masse d\u0027eau en limitant l\u0027effet cinétique du jet droit relève du jet brisé ; le déblai à faibles débits, du jet purge.","ref":"§ 2.2 Tableau de synthèse des différents types de jets — p. 82","p":"Atteindre une cible a distance (attenuation ; attaque massive ; ricochet ; …). Ce jet est generalement consommateur d\u0027eau.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Équipier","q":"Que retient le guide à propos du jet diffusé de protection ?","c":["Il est utilisé surtout en phase de déblai, avec de faibles débits d\u0027eau","Il s\u0027obtient diffuseur tourné à droite et robinet très peu ouvert","Il sert à générer une ventilation qui favorise la progression du binôme","Il forme un écran hydraulique sans grand effet mécanique sur les gaz"],"r":3,"e":"Le jet diffusé de protection est préconisé pour protéger l\u0027équipe face à un rayonnement important (foyer, phénomène à cinétique rapide) : il forme un écran hydraulique qui n\u0027a que très peu d\u0027incidence mécanique sur le volume gazeux. L\u0027usage en déblai à faibles débits concerne le jet purge ; la ventilation favorisant la progression, le jet diffusé d\u0027attaque.","ref":"§ 2.2 Tableau de synthèse des différents types de jets — p. 82","p":"Formation d\u0027un écran hydraulique qui n\u0027a que très peu d\u0027incidence mécanique sur le volume gazeux.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"Le chef d\u0027équipe constate que l\u0027extinction prend un temps inhabituel. Que prévoit le guide ?","c":["Poursuivre la même méthode en allongeant les applications","Faire remonter l\u0027information au chef d\u0027agrès","Demander au conducteur d\u0027augmenter la pression","Se replier hors du volume et attendre des ordres"],"r":1,"e":"Une extinction prenant un temps inhabituel doit faire l\u0027objet d\u0027une remontée d\u0027information au chef d\u0027agrès : la méthode utilisée peut être inappropriée à la situation et doit alors être réorientée. Le porte-lance rend compte régulièrement du résultat de ses actions et de ses besoins.","ref":"§ 3.1 Rôle du chef d\u0027équipe (porte-lance) — p. 82","p":"une extinction prenant un temps inhabituel, doit faire l\u0027objet d\u0027une remontee d\u0027information au chef d\u0027agres. La methode utilisee peut en effet etre inappropriee a la situation et doit alors faire l\u0027objet d\u0027une reorientation.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"Selon le guide, quelle zone le porte-lance doit-il éviter pour préserver la sécurité du binôme ?","c":["La zone située près du chemin de repli prévu","La zone au ras du sol, sous la couche de fumées","La zone à l\u0027écart des effets d\u0027un phénomène thermique","La zone située entre le foyer et le sortant"],"r":3,"e":"Parmi les décisions de sécurité du porte-lance figure le placement judicieux dans le sens de tirage, en amont du foyer : la zone entre le foyer et le sortant doit être évitée. Avant de pénétrer, il se place le plus bas possible, à l\u0027écart des effets éventuels d\u0027un phénomène thermique, et prévoit un chemin de repli.","ref":"§ 3.1 Rôle du chef d\u0027équipe (porte-lance) — p. 83","p":"le placement judicieux dans le sens de tirage, en amont du foyer (la zone entre le foyer et le sortant doit etre evitee).","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"Le binôme s\u0027apprête à ouvrir la porte d\u0027un local en feu. Comment les rôles se répartissent-ils en général ?","c":["Le porte-lance ouvre la porte, l\u0027équipier tenant la lance derrière lui","Le chef d\u0027agrès ouvre la porte, le binôme restant en retrait","Les deux ouvrent ensemble, debout dans l\u0027axe, pour voir le local","Le porte-lance décide de l\u0027ouverture, l\u0027équipier agit sur la porte"],"r":3,"e":"Le porte-lance prend les décisions nécessaires à la sécurité du binôme, notamment l\u0027ouverture sécurisée des ouvrants, et se place au plus bas, à l\u0027écart des effets d\u0027un phénomène thermique. L\u0027équipier, généralement le plus sollicité physiquement, agit sur les ouvrants et manipule l\u0027établissement afin que le chef puisse agir sur le feu.","ref":"§ 3.3 Gestion des efforts au sein du binôme — p. 83","p":"L\u0027equipier est generalement le plus sollicite physiquement, car il manipule en continue l\u0027etablissement, agit sur les ouvrants, deplace des materiaux et meubles, afin que le chef puisse agir sur le feu","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"En progression dans un local, le porte-lance constate une baisse anormale de l\u0027arrivée d\u0027eau à sa lance. Que doit-il faire ?","c":["Se replier avec son équipier et rendre compte","Poursuivre vers le foyer en attendant le retour de l\u0027eau","Attendre sur place que le conducteur rétablisse le débit","Envoyer l\u0027équipier seul remonter le tuyau pour trouver la cause"],"r":0,"e":"Lorsqu\u0027il pénètre dans un local, le porte-lance doit notamment se replier en cas de baisse anormale d\u0027arrivée de l\u0027eau à la lance et rendre compte. Avant d\u0027entrer, il a prévu un chemin de repli jusqu\u0027à une zone de sécurité.","ref":"§ 3.1 Rôle du chef d\u0027équipe (porte-lance) — p. 83","p":"Se replier en cas d\u0027une baisse anormale d\u0027arrivee de l\u0027eau a la lance et rendre compte ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Équipier","q":"Pendant la progression, quel rôle de sécurité tient l\u0027équipier (double porte-lance) ?","c":["Rester à l\u0027entrée du bâtiment pour surveiller l\u0027établissement","Observer le feu et signaler au chef d\u0027équipe toute aggravation","Relayer le porte-lance à la lance en cas de fatigue","S\u0027éloigner du porte-lance pour rechercher seul les victimes"],"r":1,"e":"L\u0027équipier facilite le travail du chef d\u0027équipe : il fait suivre l\u0027établissement, le protège des zones à risque et l\u0027aide à obtenir l\u0027angle d\u0027application. Il participe aussi à la sécurité du binôme en observant le feu et en informant le chef d\u0027équipe de tout signe d\u0027aggravation.","ref":"§ 3.2 Rôle de l\u0027équipier (double porte-lance) — p. 83","p":"observant le feu et en informant le chef d\u0027equipe de tout signe d\u0027aggravation de la situation.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Équipier","q":"Pourquoi l\u0027équipier se place-t-il de l\u0027autre côté du tuyau par rapport au chef d\u0027équipe ?","c":["Pour avoir un champ de vision complet : à deux, 360°","Pour équilibrer la réaction de la lance de chaque côté","Pour laisser le passage libre aux autres équipes","Pour s\u0027abriter du rayonnement derrière le porte-lance"],"r":0,"e":"L\u0027équipier participe activement à la sécurité du binôme en se plaçant de l\u0027autre côté du tuyau : il dispose ainsi d\u0027un champ de vision complet, et le binôme couvre 360° (équipier + chef d\u0027équipe).","ref":"§ 3.2 Rôle de l\u0027équipier (double porte-lance) — p. 83","p":"se plaçant de l\u0027autre cote du tuyau pour avoir un champ de vision complet et ainsi ameliorer securite de l\u0027equipe (equipier + chef d\u0027equipe = 360°)","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Chef d\u0027équipe","q":"Le binôme découvre une victime pendant l\u0027attaque. Quelle répartition des rôles le guide juge-t-il pertinente ?","c":["L\u0027équipier extrait seul la victime, le chef d\u0027équipe attaquant","Le binôme laisse la lance et extrait la victime ensemble","Le chef d\u0027équipe prend en charge la victime, l\u0027équipier tient la lance","Le chef d\u0027équipe reste à la lance et attend une équipe de renfort"],"r":2,"e":"L\u0027équipier est généralement le plus sollicité physiquement : il manipule l\u0027établissement, agit sur les ouvrants, déplace matériaux et meubles. À la découverte d\u0027une victime, il peut donc être pertinent que le chef d\u0027équipe, probablement moins fatigué, prenne en charge la victime, l\u0027équipier utilisant la lance le temps de l\u0027extraction.","ref":"§ 3.3 Gestion des efforts au sein du binôme — p. 83","p":"En cas de decouverte de victime, il peut etre pertinent d\u0027operer un changement de personnel, afin que le chef d\u0027equipe, probablement moins fatigue que l\u0027equipier, prenne en charge la victime.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Équipier","q":"Comment le binôme progresse-t-il dans un local enfumé pour assurer sa protection ?","c":["Au ras du sol, accroupi ou à genoux, en évaluant la situation","Debout, bras tendus, pour gagner en portée au-dessus des fumées","Debout le long des murs, en restant dans le sens du tirage","Courbé, le plus vite possible, sans marquer d\u0027arrêt jusqu\u0027au foyer"],"r":0,"e":"Pour se protéger, le binôme progresse au ras du sol (position accroupie ou à genoux) en évaluant en permanence la situation. Le porte-lance explore le local dans la position la plus basse possible, par avancées successives, en évitant de rester dans le sens du tirage.","ref":"§ 4 Techniques de protection du binôme — p. 84","p":"progresser au ras du sol (position accroupie ou a genoux) en binome en evaluant en permanence la situation operationnelle .","s":"gto-ext"},
{"t":"gto-ext","ch":"Lances et action du binôme","niv":"Équipier","q":"Le repli n\u0027est plus possible et un phénomène thermique menace directement le binôme. Que fait-il ?","c":["Il ouvre une fenêtre pour évacuer la chaleur et se poste derrière elle","Il se redresse et court vers la sortie la plus proche, lance fermée","Il se jette au sol face contre terre, regroupé, lance au-dessus des casques","Il dirige un jet droit à plein débit vers le foyer pour l\u0027éteindre"],"r":2,"e":"Si le repli n\u0027est plus possible et que les intervenants sont directement menacés par le phénomène, le binôme se jette au sol face contre terre, regroupé, et maintient la lance au-dessus des casques en jet de diffusion de protection au débit maximum.","ref":"§ 4 Techniques de protection du binôme — p. 84","p":"se jeter au sol face contre terre, binome regroupe ; maintenir la lance au-dessus des casques en jet de diffusion de protection au debit maximum.","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Équipier","q":"Lors du refroidissement des fumées (gas cooling), par quel mécanisme l\u0027eau projetée refroidit-elle la fumée ?","c":["Elle repousse la fumée vers l\u0027extérieur grâce à la pression du jet","Elle rabat la fumée vers le sol, où celle-ci se dépose en refroidissant","Elle est convertie en vapeur grâce à l\u0027énergie thermique de la fumée","Elle ruisselle sur les parois et ne refroidit que les murs du local"],"r":2,"e":"Le gas cooling vise à utiliser l\u0027énergie thermique contenue dans la fumée pour convertir l\u0027eau en vapeur, ce qui la refroidit. Il permet notamment de prévenir le flashover et d\u0027éviter d\u0027atteindre la température d\u0027auto-inflammation de la fumée.","ref":"§ 1 Objectif (Refroidissement des fumées) — p. 85","p":"L\u0027objectif des applications d\u0027eau a produire est d\u0027utiliser l\u0027energie thermique contenu dans la fumee pour convertir l\u0027eau en vapeur et ainsi la refroidir.","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Équipier","q":"Selon le guide, quel effet le refroidissement des fumées a-t-il sur le plafond de fumée ?","c":["Il le fait descendre vers le sol","Il le stabilise, voire le rehausse","Il le disperse dans le volume","Il n\u0027a aucun effet sur sa hauteur"],"r":1,"e":"Le volume de fumée refroidi se contracte : le plafond de fumée est stabilisé, voire rehaussé. Le refroidissement des fumées diminue aussi l\u0027impact radiatif sur les intervenants et prévient le déclenchement du flashover.","ref":"§ 1 Objectif (refroidissement des fumées) — p. 85","p":"stabiliser / rehausser le plafond de fumee (contraction du volume refroidi)","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Chef d\u0027équipe","q":"Le binôme progresse dans un appartement enfumé et refroidit les fumées par impulsions courtes. Comment le porte-lance réalise-t-il chaque impulsion ?","c":["Ouverture et fermeture du robinet les plus rapides possible (0,5 s au plus)","Ouverture rapide du robinet, puis fermeture progressive en 2 à 5 secondes","Ouverture partielle du robinet en jet droit, avec un lent balayage des parois","Ouverture complète du robinet en jet droit, dirigée vers le milieu du plafond"],"r":0,"e":"L\u0027impulsion courte s\u0027obtient par une ouverture/fermeture du robinet la plus rapide possible (une demi-seconde au plus), devant soi ; elle est à privilégier dans les locaux d\u0027habitation standards, hôtels ou bureaux. L\u0027ouverture rapide suivie d\u0027une fermeture progressive en 2 à 5 secondes environ correspond à l\u0027impulsion longue.","ref":"§ 2 Méthodes (Refroidissement des fumées) — p. 85","p":"Les impulsions courtes (short puls ou pulsing) : qui s\u0027obtiennent par une manœuvre du robinet de lance en ouverture / fermeture la plus rapide possible (cibler une demi seconde au plus)","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Chef d\u0027équipe","q":"Le binôme progresse dans un entrepôt enfumé de grand volume. Quelle technique de refroidissement des fumées le guide privilégie-t-il ?","c":["Des impulsions longues, à fermeture progressive","Des impulsions courtes, d\u0027une demi-seconde au plus","Un jet droit en balayage continu vers le sol","Un jet diffusé de protection maintenu en continu"],"r":0,"e":"Les impulsions longues (ouverture rapide du robinet, puis fermeture progressive, 2 à 5 secondes environ) sont à privilégier dans les magasins, entrepôts, atriums ou garages, ainsi qu\u0027aux passages de portes. Les impulsions courtes (une demi-seconde au plus) conviennent aux locaux d\u0027habitation standards, hôtels et bureaux.","ref":"§ 2 Méthodes (refroidissement des fumées) — p. 86","p":"Les impulsions longues (long puls) consistent en une ouverture rapide sur l\u0027ouverture du robinet de la lance puis 2 a 5 secondes env., en une fermeture progressive. Cette technique est a privilegier dans des structures type magasins, entrepots","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Chef d\u0027équipe","q":"Plafond de fumée bas, interface fumée/air très turbulente : la situation est proche du flashover. Pourquoi les impulsions sont-elles alors fortement déconseillées ?","c":["Elles consomment trop d\u0027eau et risquent de vider la citerne","Elles refroidissent la fumée, qui retombe alors sur le binôme","Elles masquent les anges danseurs, signes d\u0027alarme","Elles brassent les couches de fumée et peuvent la mettre à feu"],"r":3,"e":"Près du flashover, le plafond de fumée est très instable : l\u0027angle de diffusion des impulsions risquerait de produire un effet piston/dispersion, et le brassage anarchique des couches de fumée qui s\u0027ensuivrait pourrait mettre la fumée à feu.","ref":"§ 3 Limite d\u0027utilisation des impulsions — p. 87","p":"L\u0027angle de diffusion utilise lors de ces applications risquerait de produire un effet piston/dispersion. Le brassage anarchique des couches de fumee qui s\u0027en suivrait pourrait etre a l\u0027origine de la mise a feu de la fume e.","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Chef d\u0027équipe","q":"Plafond de fumée bas, interface fumée/air très turbulente, sans que le repli s\u0027impose : comment le guide préconise-t-il de sécuriser l\u0027ambiance ?","c":["Impulsions courtes répétées en jet diffusé, au cœur de la couche de fumée","Impulsions longues à grand angle de diffusion, dirigées vers le plafond","Jet diffusé de protection à plein débit, dirigé vers la couche de fumée","Jet droit balayant le haut des parois et le plafond, robinet entrouvert"],"r":3,"e":"Proche du flashover, les impulsions sont fortement déconseillées. Si le repli ne s\u0027impose pas, on passe en jet droit (100 à 300 L/min env.) en balayant progressivement le haut des parois et le plafond, robinet partiellement ouvert, pour produire de la vapeur dans la couche de fumée et l\u0027inerter sans la déstratifier.","ref":"§ 3 Limite d\u0027utilisation des impulsions — p. 87","p":"Passer en jet droit ; debit de 100 a 300 L/Min env ; appliquer l\u0027eau sur les parties hautes des parois laterales et sur le plafond en operant un balayage (sweep)","s":"gto-ext"},
{"t":"gto-ext","ch":"Refroidissement des fumées","niv":"Équipier","q":"Le binôme observe des rollovers au-dessus de lui. Que doit-il faire selon le guide ?","c":["Les éteindre par impulsions courtes, puis poursuivre sa progression","Accélérer sa progression pour traiter le foyer","Se replier, car c\u0027est le signe d\u0027un flashover imminent","S\u0027immobiliser au sol jusqu\u0027à leur disparition"],"r":2,"e":"Le binôme ne doit pas évoluer sous des rollovers : c\u0027est le signe d\u0027un flashover imminent, il doit se replier. Réaliser des impulsions dans des rollovers est inadapté : ce sont des flammes établies, qui réapparaîtraient aussitôt tant que le foyer n\u0027est pas traité.","ref":"§ 3 Limite d\u0027utilisation des impulsions — p. 87","p":"Vous ne devez pas évoluer sous des Rollovers car c\u0027est le signe d\u0027un Flashover imminent. Repliez-vous !!!","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Équipier","q":"Qu\u0027appelle-t-on « extinction directe » ?","c":["Produire de la vapeur sur les parois chaudes pour inerter le local","Placer l\u0027eau sur les combustibles, directement ou par ricochet","Refroidir les fumées par impulsions afin de sécuriser la progression","Associer vapeur et refroidissement des surfaces dans un même geste"],"r":1,"e":"L\u0027extinction directe regroupe les applications dont l\u0027objectif est de placer l\u0027eau directement sur les surfaces combustibles, que l\u0027eau y soit projetée directement ou indirectement (par ricochet au plafond par exemple). La production de vapeur sur les parois relève de l\u0027extinction indirecte ; l\u0027association des deux, de l\u0027extinction combinée.","ref":"§ 1 Objectifs (L\u0027extinction directe) — p. 89","p":"L\u0027extinction directe concerne toutes les applications dont l\u0027objectif est de placer de l\u0027eau directement sur les surfaces combustibles et ce, que l\u0027eau soit projetee sur le combustible directement ou indirectement (par ricochets au plafond par exemple).","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Équipier","q":"Quel mode extincteur l\u0027extinction directe met-elle en avant ?","c":["L\u0027inertage du volume par la vapeur d\u0027eau","La dilution des gaz combustibles par la vapeur","La légère surpression qui limite l\u0027arrivée d\u0027air","Le refroidissement des surfaces combustibles"],"r":3,"e":"En extinction directe, l\u0027eau projetée s\u0027étale à l\u0027impact et s\u0027écoule sur le combustible pour lui prendre de l\u0027énergie : le mode extincteur mis en avant est le refroidissement des surfaces combustibles. Inertage, dilution et surpression sont les modes privilégiés de l\u0027extinction indirecte.","ref":"§ 1 Objectifs (L\u0027extinction directe) — p. 89","p":"Le mode extincteur mis en avant par cette technique est donc le refroidissement des surfaces combustible.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Quelle application d\u0027eau permet de déposer une masse d\u0027eau sur une surface en feu, parfois à plusieurs mètres, sans déstratifier le plafond de fumée ?","c":["Le badigeonnage (painting)","L\u0027impulsion longue (long pulse)","L\u0027extinction indirecte","L\u0027extinction combinée (massive)"],"r":0,"e":"Le badigeonnage dépose une masse d\u0027eau sur une surface en feu, éventuellement à plusieurs mètres, sans créer de déstratification du plafond de fumée, par exemple en zigzag ou en balayage. L\u0027impulsion longue, elle, sert au refroidissement des fumées.","ref":"§ 2.1 Le badigeonnage (painting) — p. 89","p":"Cette application d\u0027eau permet de deposer sur une surface plus ou moins importante en feu une masse d\u0027eau sans creer de destratification du plafond de fumee.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Équipier","q":"Lors d\u0027un badigeonnage (painting), comment le porte-lance manœuvre-t-il le robinet de lance ?","c":["Il l\u0027ouvre complètement pour gagner en portée","Il l\u0027ouvre partiellement pour déposer l\u0027eau","Il l\u0027ouvre et le ferme par impulsions très brèves","Il l\u0027ouvre complètement, en jet diffusé large"],"r":1,"e":"Le badigeonnage dépose une masse d\u0027eau sur une surface en feu sans déstratifier le plafond de fumée, par exemple en zigzag ou en balayage. Pour casser l\u0027effet mécanique du jet droit, le robinet de lance est ouvert partiellement, afin que l\u0027eau soit « déposée » et ruisselle sur le combustible.","ref":"§ 2.1 Le badigeonnage (painting) — p. 89","p":"De façon a casser l\u0027effet mecanique du jet droit, le robinet de lance doit etre ouvert partiellement, de façon a ce que l\u0027eau projete soit « deposee » sur les surfaces.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Des surfaces en feu sont masquées et ne peuvent pas être atteintes par une application directe. Quelle application le guide propose-t-il ?","c":["Un badigeonnage en zigzag, de haut en bas","Un penciling, par une ouverture brève du robinet","Un ricochet du jet étroit sur le plafond","Des impulsions courtes dans la couche de fumée"],"r":2,"e":"Le ricochet utilise le plafond pour modifier l\u0027angle du jet étroit et le rediriger sur les surfaces combustibles masquées, robinet de lance complètement ouvert. Le but restant de placer l\u0027eau sur le combustible, l\u0027extinction est directe. Badigeonnage et penciling supposent au contraire que l\u0027eau puisse être déposée directement sur les surfaces.","ref":"§ 3.1 Le ricochet — p. 90","p":"Il s\u0027agit d\u0027une application d\u0027eau qui utilise le plafond pour modifier l\u0027angle d\u0027application du jet, lorsque des surfaces combustibles ne peuvent pas etre atteintes par une application directe.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Le binôme applique l\u0027eau par ricochet au plafond, mais l\u0027application reste inefficace. Que préconise le guide, notamment pour limiter les dégâts des eaux ?","c":["Prolonger l\u0027application jusqu\u0027à l\u0027extinction complète","Passer en jet diffusé de protection à débit maximal","Changer de point d\u0027attaque pour atteindre l\u0027objectif","Ouvrir la lance en grand pour noyer l\u0027ensemble du local"],"r":2,"e":"Lors d\u0027un ricochet, il faut veiller à limiter les dégâts des eaux : si l\u0027application n\u0027est pas efficace, on change de point d\u0027attaque pour pouvoir atteindre l\u0027objectif. On limite aussi les temps d\u0027application pour contrôler l\u0027efficacité de l\u0027action, et on veille à ne pas mettre en suspension des braises.","ref":"§ 3.1 Le ricochet — p. 91","p":"veiller a limiter les degats d\u0027eaux dans la mesure du possible. Si l\u0027application n\u0027est pas efficace, changer de point d\u0027attaque afin de pouvoir atteindre l\u0027objectif ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Dans quelle situation l\u0027extinction indirecte peut-elle être mise en œuvre ?","c":["Foyer masqué par un écran, extinction directe impossible","Foyer visible, que le jet peut atteindre directement","Local dont la porte détruite ne peut plus être fermée","Progression du binôme dans un couloir enfumé"],"r":0,"e":"L\u0027extinction indirecte produit de la vapeur grâce à l\u0027énergie des parois pour rendre le milieu impropre à la combustion (inertage, dilution, surpression). Elle s\u0027emploie quand le foyer est masqué et qu\u0027une extinction directe n\u0027est pas envisageable, dans un local dont la porte peut être refermée. La progression en couloir enfumé relève du refroidissement des fumées.","ref":"§ 2 Application (Les extinctions indirectes) — p. 93","p":"Cette technique d\u0027application d\u0027eau peut etre mise en œuvre lorsque le foyer est masque par un ecran et qu\u0027une extinction directe n\u0027est pas envisageable.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Lors d\u0027une extinction indirecte d\u0027un local dont on peut refermer la porte, que fait-on après chaque application ?","c":["On ouvre la porte en grand pour évacuer la vapeur","On pénètre aussitôt pour attaquer le foyer en jet droit","On ouvre une fenêtre opposée pour créer un courant d\u0027air","On repousse la porte pour que la vapeur se répande"],"r":3,"e":"L\u0027extinction indirecte produit de la vapeur grâce à l\u0027énergie des parois, pour inerter le volume et limiter l\u0027arrivée d\u0027air. Elle s\u0027applique aux locaux dont on peut refermer la porte : après chaque application (jet diffusé de 20 à 30° env. badigeonnant le plafond), la porte est repoussée pour que la vapeur se répande dans tout le local.","ref":"§ 2 Application (extinctions indirectes) — p. 93","p":"Cette methode est a utiliser sur des locaux dont il est possible de refermer la porte. Apres chaque application, la porte sera repoussee afin que la vapeur puisse se repandre dans l\u0027ensemble du local.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Que permet d\u0027associer la technique d\u0027extinction combinée (ou massive) ?","c":["Le refroidissement des fumées et l\u0027attaque directe du foyer","L\u0027eau et un émulseur dans une même lance pour étouffer le feu","Les effets des extinctions directe et indirecte en un même geste","Deux lances utilisées en même temps, l\u0027une en jet droit, l\u0027autre en diffusé"],"r":2,"e":"La technique combinée associe, sur la base du même geste technique (mouvement en T, Z, O, 8…), les effets de l\u0027extinction directe (refroidissement massif des surfaces combustibles) et de l\u0027extinction indirecte (production importante de vapeur). Elle s\u0027opère depuis l\u0027extérieur sur des feux pleinement développés.","ref":"§ 1 Objectif (Extinction combinée / massive) — p. 95","p":"La technique combinee (ou massive) permet d\u0027associer les effets de l\u0027extinction directe (refroidissement massif de surfaces combustibles) et indirecte (production importante de vapeur) sur la base du meme geste technique.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Pourquoi l\u0027extinction combinée (massive) doit-elle être réalisée depuis l\u0027extérieur du local ou de la structure ?","c":["Pour éviter toute propagation vers un volume adjacent","Pour ne pas subir le retour de la vapeur produite","Pour garder le vent dans le dos pendant l\u0027attaque","Pour utiliser le jet droit à sa pleine portée"],"r":1,"e":"La technique combinée produit à la fois un refroidissement massif des surfaces et une importante production de vapeur : elle se réalise depuis l\u0027extérieur du local ou de la structure afin de ne pas subir le retour de vapeur. Elle peut au contraire entraîner une propagation vers un volume adjacent si un ouvrant relie les deux volumes.","ref":"§ 2 Application (Extinction combinée / massive) — p. 96","p":"Ce type d\u0027extinction est à réaliser depuis l\u0027extérieur du local/de la structure afin de ne pas subir le retour de vapeur.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Le binôme réalise une extinction combinée (massive) depuis l\u0027extérieur. Quel risque, lié à la présence d\u0027un ouvrant, le guide signale-t-il ?","c":["Une propagation du feu à un volume adjacent","Une explosion de fumées dans le local","Un effondrement brutal du plancher du local","Une rupture des tuyaux par coup de bélier"],"r":0,"e":"L\u0027extinction combinée associe le refroidissement massif des surfaces combustibles et une production importante de vapeur, sur des feux pleinement développés. Elle peut entraîner une propagation de l\u0027incendie à un autre volume adjacent, en présence d\u0027un ouvrant entre les deux volumes.","ref":"§ 2 Application (extinction combinée / massive) — p. 96","p":"Cette technique peut entrainer une propagation de l\u0027incendie à un autre volume adjacent, en présence d\u0027un ouvrant entre les deux volumes.","s":"gto-ext"},
{"t":"gto-ext","ch":"Extinctions directe et indirecte","niv":"Chef d\u0027équipe","q":"Situation pré-backdraft : après une application d\u0027eau par la porte entrouverte, celle-ci est refermée à 1 cm environ. Quel signe indique que l\u0027ambiance du local est contrôlée ?","c":["Une sortie de vapeur nettement sous pression","Un appel d\u0027air frais vers le local","Une fumée plus sombre s\u0027échappant par le haut","Une sortie de vapeur sans surpression notable"],"r":3,"e":"On entrouvre la porte, on applique l\u0027eau en jet 30° vers le plafond pendant 1 à 2 secondes (plus si le local est grand ou haut), puis on la referme en laissant 1 cm environ : la sortie ou non de vapeur sous pression renseigne sur l\u0027ambiance thermique. On recommence jusqu\u0027à une sortie de vapeur sans surpression remarquable, puis on pénètre pour traiter le foyer en attaque directe.","ref":"§ 2 Extinction indirecte (Situation pré-backdraft) — p. 97","p":"Reproduire l\u0027application d\u0027eau jusqu\u0027a ce que les indicateurs indiquent que l\u0027ambiance dans le local est controlee (sortie de vapeur sans surpression remarquable).","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Chef d\u0027équipe","q":"Malgré ses applications d\u0027eau, le binôme constate que la chaleur ressentie persiste. Qu\u0027en déduit-il selon le guide ?","c":["Qu\u0027il ne prend pas le dessus et doit se replier","Qu\u0027il doit se rapprocher du foyer pour l\u0027éteindre","Que son action est efficace et qu\u0027il peut poursuivre","Qu\u0027il doit refermer sa lance pour limiter la vapeur"],"r":0,"e":"L\u0027efficacité de l\u0027action de lance s\u0027apprécie par la disparition des anges danseurs et/ou une amélioration des contraintes thermiques ressenties. Si la chaleur persiste malgré l\u0027action, l\u0027équipe n\u0027est pas en mesure de prendre le dessus : elle se replie pour modifier la méthode et les moyens mis en œuvre.","ref":"§ 2.1 Repli sous refroidissement des fumées — p. 101","p":"La persistance de la chaleur ressentie malgre l\u0027action de lance est donc le signe que l\u0027equipe n\u0027est pas en mesure de prendre le dessus sur le feu. Elle doit alors se replier","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Équipier","q":"Qu\u0027appelle-t-on « anges danseurs » dans un local enfumé ?","c":["Des tourbillons de fumée claire qui se forment au ras du sol","Des flammes qui s\u0027échappent en façade par une fenêtre ouverte","Des volutes de vapeur blanche produites par la lance","Des flammes isolées dans la fumée, sans lien avec le foyer principal"],"r":3,"e":"Les anges danseurs sont des flammes isolées, discontinues et sans lien avec le foyer principal, apparaissant au sein de la fumée. Ils indiquent une prédisposition du mélange gazeux à s\u0027enflammer complètement : c\u0027est la mise à feu de la fumée qui sera à l\u0027origine du flashover. Ces signes ne sont pas toujours faciles à voir.","ref":"§ 2.1 Repli sous refroidissement des fumées — p. 101","p":"L\u0027apparition au sein de la fumee de flammes isolees, discontinues et sans lien avec le foyer principal (anges danseurs). Ces inflammations indiquent une predisposition du melange gazeux a s\u0027enflammer completement.","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Chef d\u0027agrès","q":"Feu d\u0027appartement piloté par le vent. Depuis quelle pièce le guide recommande-t-il, si possible, de mener l\u0027attaque ?","c":["Une pièce située sur la façade opposée au vent","Une pièce située sur la même face exposée au vent","La cage d\u0027escalier, porte palière laissée grande ouverte","Une pièce du niveau supérieur, au-dessus du feu"],"r":1,"e":"Le vent crée une surpression sur la façade exposée et une dépression sur les faces non exposées ; si la veine d\u0027air passe par le foyer, sa puissance s\u0027accroît notablement. Le guide recommande d\u0027attaquer avec le vent dans le dos et privilégie, si possible, une attaque menée depuis une pièce de la même face exposée au vent.","ref":"§ 3 Quelques possibilités (feu soumis aux effets du vent) — p. 104","p":"l\u0027attaque menee depuis une piece situee sur la meme face exposee au vent afin de diminuer au mieux l\u0027impact de ces effets sera a privilegier dans la mesure du possible","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Équipier","q":"Sur un feu soumis aux effets du vent, à quoi sert un « stoppeur de vent » ?","c":["À ventiler le volume en soufflant de l\u0027air frais","À protéger le binôme du rayonnement par un rideau d\u0027eau","À mesurer la vitesse du vent au niveau de la façade","À occulter un ouvrant pour contrôler l\u0027effet du vent"],"r":3,"e":"Le stoppeur de vent est un système de rideau occultant placé devant les ouvrants pour contrôler l\u0027effet du vent. Le guide le cite parmi les possibilités face à un feu soumis au vent, avec l\u0027attaque d\u0027atténuation lorsque l\u0027ouvrant est à portée de lance.","ref":"§ 3 Quelques possibilités (feu soumis aux effets du vent) — p. 104","p":"la mise en place de systeme de rideau occultant (stoppeur de vent) a venir place devant les ouvrants pour controler l\u0027effet du vent.","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Chef d\u0027agrès","q":"Quel est l\u0027objectif de l\u0027attaque d\u0027atténuation (attaque transitoire) menée dès l\u0027arrivée des premiers engins ?","c":["Stopper très rapidement le développement du sinistre","Éteindre complètement l\u0027incendie depuis l\u0027extérieur","Inerter le volume par une production massive de vapeur","Ventiler le local pour faciliter l\u0027attaque intérieure"],"r":0,"e":"L\u0027attaque d\u0027atténuation n\u0027a pas pour objectif d\u0027éteindre l\u0027incendie, mais de stopper très rapidement le développement du sinistre dès l\u0027arrivée des premiers engins. Elle s\u0027applique depuis l\u0027extérieur sur des feux proches du flashover ou pleinement développés ; son efficacité repose sur la rapidité de mise en œuvre et la quantité d\u0027eau projetée.","ref":"§ 1 Objectif (attaque d\u0027atténuation) — p. 105","p":"cette méthode tactique n\u0027a pas pour objectif d\u0027éteindre l\u0027incendie, mais de stopper dans sa courbe de progression très rapidement le développement du sinistre, une fois les premiers engins incendie sur les lieux d\u0027une intervention.","s":"gto-ext"},
{"t":"gto-ext","ch":"Repli, vent et atténuation","niv":"Chef d\u0027équipe","q":"Attaque d\u0027atténuation menée depuis l\u0027extérieur sur un feu proche du flashover : comment la lance est-elle utilisée ?","c":["En jet diffusé large à travers l\u0027ouverture, pour noyer le local","En jet droit dirigé vers le plancher, pour balayer les braises","En jet droit à travers l\u0027ouverture, en visant le plafond","Par impulsions courtes en jet diffusé dans les fumées sortantes"],"r":2,"e":"La lance est réglée en jet droit pour ne pas perturber l\u0027aéraulique de la pièce ; le flux est projeté à travers une ouverture en visant le plafond, dont l\u0027impact disperse l\u0027eau en grosses gouttes sur les combustibles. Un jet diffusé n\u0027aurait aucun effet ; le débit de 250 L/min est un minimum.","ref":"§ 2 Application (Attaque d\u0027atténuation) — p. 105","p":"La lance doit être réglée en jet droit de façon à ne pas perturber l\u0027aéraulique de la pièce. Le flux d\u0027eau doit être projeté à travers une ouverture en visant le plafond.","s":"gto-ext"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Selon le lexique du guide, sur quel principe repose l\u0027entraînement de l\u0027air dans l\u0027Aneti, ventilateur hydraulique ?","c":["Le principe de Pascal","Le principe d\u0027Archimède","Le principe de Venturi","Le principe de Carnot"],"r":2,"e":"Le lexique présente l\u0027Aneti comme un ventilateur hydraulique dont l\u0027entraînement de l\u0027air se fait selon le principe de Venturi. Les ventilateurs à entraînement hydraulique sont, avec les ventilateurs électriques, une alternative aux ventilateurs thermiques.","ref":"§ Lexique — p. 11","p":"Aneti : Ventilateur hydraulique. L\u0027entrainement de l\u0027air se fait selon le principe de Venturi.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Selon le lexique du guide, un système de désenfumage installé dans un bâtiment peut notamment être asservi à quoi ?","c":["À la mise en eau de la colonne sèche","À l\u0027ouverture de la porte d\u0027entrée","À la mise en route d\u0027un ventilateur mobile","À une détection automatique d\u0027incendie"],"r":3,"e":"Les systèmes de désenfumage installés dans les bâtiments peuvent avoir un mode de déclenchement manuel, automatique par fusibles ou asservi à une détection automatique d\u0027incendie. Le désenfumage peut aussi être réalisé par des ouvertures pratiquées par les sapeurs-pompiers.","ref":"§ Lexique — p. 11","p":"Des systèmes de désenfumages installés dans les bâtiments peuvent avoir un mode de déclenchement manuel, automatique par fusibles ou asservi à une détection automatique d\u0027incendie.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Selon le lexique du guide, à quoi est-il proposé de réserver le terme « exutoire » ?","c":["Aux ouvertures pratiquées par les sapeurs-pompiers dans les cloisons","Aux dispositifs réalisés à cet effet dans le cadre de la prévention","Aux ouvertures par lesquelles l\u0027air frais entre dans le volume","Aux ventilateurs fixes d\u0027extraction équipant les parkings"],"r":1,"e":"L\u0027exutoire est une ouverture par laquelle peuvent sortir les fumées. Le guide propose de réserver ce terme aux dispositifs réalisés à cet effet (mesures de prévention), même s\u0027il est fréquent de le voir utilisé pour d\u0027autres « sortants ».","ref":"§ Lexique — p. 11","p":"Il est proposé de retenir ce terme pour les dispositifs réalisés à cet effet (mesures de prévention), même s\u0027il est fréquent de voir ce terme utilisé pour d\u0027autres « sortants ».","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Qu\u0027est-ce qu\u0027une ventilation « naturelle » ?","c":["Une ventilation assurée par un ventilateur thermique placé à l\u0027extérieur","Une ventilation obtenue par une lance en jet diffusé dirigée vers une ouverture","Une ventilation due aux seules différences de pression (vent, température)","Une ventilation limitée par la fermeture de toutes les portes et fenêtres"],"r":2,"e":"Une ventilation est dite naturelle lorsqu\u0027elle est réalisée exclusivement grâce aux différences de pression, dues soit au vent extérieur, soit aux différences de densité des gaz liées à leur température. Une ventilation qui ne fonctionne pas exclusivement selon ce mode naturel est dite mécanique.","ref":"§ Lexique — p. 12","p":"réalisé exclusivement grâce aux différences de pression entre volumes ou entre l\u0027intérieur et l\u0027extérieur d\u0027un bâtiment, ces différences de pression résultant soient d\u0027un vent extérieur soit de différences de densité des masses gazeuses liées à leur température","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Un local est désenfumé grâce aux ventilateurs de désenfumage fixes équipant le bâtiment. Selon le lexique du guide, comment qualifie-t-on cette ventilation ?","c":["Naturelle","Hydraulique","Passive","Mécanique"],"r":3,"e":"Une ventilation est dite mécanique lorsqu\u0027elle ne fonctionne pas exclusivement selon un mode naturel (vent ou tirage). Les moyens mécaniques sont les ventilateurs de désenfumage équipant les bâtiments ou les ventilateurs amenés sur site par les sapeurs-pompiers.","ref":"§ Lexique — p. 12","p":"Les moyens mécaniques utilisés sont des ventilateurs de désenfumage équipant les bâtiments ou des ventilateurs amenés sur site par les SP.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Que signifie le sigle VPP ?","c":["Ventilation par pression positive","Ventilation permanente de protection","Vérification de la pression de pompe","Ventilation par pulsion progressive"],"r":0,"e":"VPP signifie ventilation par pression positive : des ventilateurs sont utilisés pour envoyer de l\u0027air dans le volume. Selon le guide, elle peut être utilisée pour protéger des locaux, pour désenfumer ou pour attaquer le feu.","ref":"§ Lexique — p. 13","p":"VPP : ventilation par pression positive pouvant être utilisée soit pour protéger des locaux, pour désenfumer ou pour attaquer le feu.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Que recouvre la notion de ventilation opérationnelle (VO) ?","c":["Le refroidissement des tuyaux et des lances exposés à la chaleur du foyer","Les actions qui concourent à maîtriser les flux gazeux et thermiques","L\u0027assèchement des locaux après l\u0027extinction pour limiter les dégâts des eaux","L\u0027extinction du foyer par le seul apport d\u0027air frais, sans moyen hydraulique"],"r":1,"e":"Le guide regroupe sous le terme de ventilation opérationnelle l\u0027ensemble des actions des sapeurs-pompiers qui concourent à maîtriser les flux gazeux et thermiques dans la structure touchée par le feu. Ces actions peuvent porter sur la source (le foyer), sur le flux (fumées, particules, chaleur) ou sur les cibles (personnes, structure).","ref":"§ VEN-STR Préambule — p. 15","p":"On regroupera sous le vocable de ventilation opérationnelle (VO), l\u0027ensemble des actions entreprises par les sapeurs-pompiers qui concourent à maîtriser les flux gazeux et thermiques dans la structure impactée par le feu","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"En ventilation opérationnelle, qu\u0027appelle-t-on le « sortant » ?","c":["Tout ouvrant permettant l\u0027arrivée d\u0027air frais dans le volume","Le ventilateur placé devant l\u0027ouverture pour créer la surpression","Tout ouvrant refermé pour isoler le volume en feu du reste du bâtiment","Tout dispositif existant ou créé permettant la sortie des fumées"],"r":3,"e":"Le sortant est tout dispositif, existant ou créé (fenêtre, porte, exutoire, ouverture pratiquée par les sapeurs-pompiers…), permettant la sortie des fumées du volume. L\u0027ouvrant permettant l\u0027arrivée d\u0027air dans le volume est l\u0027« entrant ».","ref":"§ VEN-STR 1. Principes de la ventilation opérationnelle — p. 16","p":"On appelle « sortant », tout dispositif existant ou créé, permettant la sortie des fumées du volume.","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Dans un volume en feu, en quoi consiste le phénomène de tirage décrit par le guide ?","c":["L\u0027évacuation des gaz chauds en haut, qui aspire les gaz froids en partie basse","Le déplacement des fumées provoqué par un ventilateur placé devant l\u0027entrant","L\u0027entraînement des fumées par une lance en jet diffusé dirigée vers une ouverture","La descente des gaz chauds vers le sol, qui chasse l\u0027air frais par la partie haute"],"r":0,"e":"Les gaz chauds, plus légers, s\u0027élèvent ou sortent du volume ; les gaz « froids », plus lourds, redescendent ou sont aspirés dans le volume en feu, généralement en partie basse, par la dépression causée par l\u0027évacuation des gaz chauds, généralement en partie haute. C\u0027est le principe du tirage dans une cheminée.","ref":"§ VEN-STR 1. Principes de la ventilation opérationnelle — p. 16","p":"Quant aux gaz « froids » plus lourds, ils redescendent ou sont aspirés dans le volume en feu (généralement en partie basse) par la dépression causée par l\u0027évacuation des gaz chauds (généralement en partie haute)","s":"gto-vent"},
{"t":"gto-vent","ch":"Lexique et généralités","niv":"Équipier","q":"Quels sont les trois objectifs principaux de la ventilation opérationnelle ?","c":["Reconnaître, sauvegarder, éteindre","Alerter, protéger, secourir","Ventiler, refroidir, déblayer","Protéger, désenfumer, attaquer"],"r":3,"e":"La ventilation opérationnelle répond à trois objectifs principaux : protéger (empêcher les fumées de venir dans un volume), désenfumer (évacuer les fumées d\u0027un local sans lien direct avec le local en feu) et attaquer (agir sur les fumées et le foyer, canaliser leur propagation).","ref":"§ VEN-STR 2. Objectifs de la ventilation opérationnelle — p. 17","p":"La ventilation opérationnelle permet de répondre à trois objectifs principaux : protéger (empecher les fumees de venir dans un volume) ; désenfumer (evacuer les fumees d\u0027un local sans lien direct avec le local en feu) ; attaquer","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Chef d\u0027équipe","q":"Lors de la reconnaissance précédant la création d\u0027une veine d\u0027air, que recouvrent les « cheminements » à repérer selon le guide ?","c":["Les couloirs, escaliers… empruntés par les fumées et gaz chauds","Le trajet de l\u0027établissement de tuyaux depuis l\u0027engin-pompe jusqu\u0027au feu","Le tracé de la ligne guide déroulée par le binôme engagé","Les zones de dépose du matériel de ventilation à l\u0027extérieur"],"r":0,"e":"En reconnaissance, les équipes recherchent notamment les courants aérauliques (écoulement de l\u0027air, des fumées et des gaz chauds) et les cheminements de ces masses gazeuses : couloirs, escaliers… Elles repèrent aussi le sens du vent, les ouvrants et sortants possibles et les éléments de cloisonnement intérieurs.","ref":"§ VEN-STR 5.1. Points particuliers à rechercher lors de la reconnaissance — p. 18","p":"courants aérauliques (écoulement de l\u0027air, des fumées et gaz chauds) ; cheminements de ces masses gazeuses (couloirs, escaliers, …) ; sens du vent","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Équipier","q":"À quelle distance de l\u0027entrant un ventilateur thermique est-il généralement positionné ?","c":["Au contact direct du bâti de l\u0027ouvrant","À l\u0027intérieur du volume, juste derrière l\u0027ouvrant","À une distance équivalente à la hauteur de l\u0027ouvrant","À une distance équivalente à la largeur de l\u0027ouvrant"],"r":2,"e":"Un ventilateur thermique est généralement placé à une distance équivalente à la hauteur de l\u0027ouvrant (hauteur de la porte s\u0027il s\u0027agit d\u0027une porte). Ce positionnement peut être adapté en fonction du modèle utilisé et des circonstances.","ref":"§ VEN-STR 5.2. Mise en œuvre — p. 18","p":"Un ventilateur thermique est généralement positionné à une distance équivalente à la hauteur de l\u0027ouvrant (hauteur de porte si c\u0027est le cas)","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Chef d\u0027agrès","q":"Qui doit préciser toutes les indications nécessaires pour qu\u0027une action de ventilation soit menée sans ambiguïté ?","c":["L\u0027équipier chargé de mettre en place le ventilateur","Le commandant des opérations de secours (COS)","Le chef du binôme d\u0027attaque, au contact du feu","Le responsable ou l\u0027exploitant du bâtiment"],"r":1,"e":"Le COS précise la totalité des indications nécessaires : tactique de ventilation, moyen, emplacements (volume, entrant, sortant, accès), actions concomitantes et chronologie, consignes particulières et règles de sécurité. Le COS et les chefs d\u0027agrès veillent à partager et à coordonner les ordres donnés.","ref":"§ VEN-STR 5.2. Mise en œuvre — p. 18","p":"Le commandant des operations de secours devra preciser la totalite des indications necessaires pour que l\u0027action soit menee sans ambiguîte.","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et ordonnez une ventilation opérationnelle. Selon le guide, que doit notamment comporter votre ordre ?","c":["L\u0027autonomie, le niveau de carburant et la marque du ventilateur","Le nom, le grade et le canal radio de l\u0027équipier au ventilateur","La tactique, le moyen, les emplacements, la chronologie et la sécurité","Le bilan des victimes, l\u0027état des structures et l\u0027heure de fin envisagée"],"r":2,"e":"Selon le type de ventilation, l\u0027ordre comporte la tactique, le moyen, les emplacements (volume, entrant, sortant, accès et itinéraires), les actions concomitantes et leur chronologie, les éventuelles consignes particulières et les règles de sécurité, afin que l\u0027action soit menée sans ambiguïté.","ref":"§ VEN-STR 5.2. Mise en œuvre — p. 18","p":"Un ordre pour la mise en œuvre d\u0027une ventilation doit ainsi comporter selon le type de ventilation concerne : la tactique de ventilation (ventilation d\u0027attaque, antiventilation…) ; le moyen (ventilation naturelle, ventilateur hydraulique...)","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Équipier","q":"Une ventilation par pression positive est en place dans un bâtiment. Quelle règle s\u0027impose à tous les intervenants ?","c":["Ouvrir chaque fenêtre rencontrée pour renforcer le flux","Se regrouper dans la veine d\u0027air, à l\u0027abri des fumées","Fermer derrière soi toutes les portes, sans exception","Ne pas stationner dans la veine d\u0027air du ventilateur"],"r":3,"e":"Les intervenants doivent se sentir concernés et responsables de la qualité de la ventilation opérationnelle (maintien des portes ouvertes ou fermées, interdiction de stationner dans la veine d\u0027air). Il faut aussi vérifier que la veine d\u0027air n\u0027est pas perturbée et reste pérenne (porte qui se referme, présence de vent…).","ref":"§ VEN-STR 5.3. Règles de sécurité — p. 19","p":"les intervenants doivent se sentir concernes et responsables de la qualite de la ventilation operationnelle (maintien des portes ouvertes ou fermees, interdiction de stationner dans la veine d\u0027air...)","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Quelle situation interdit d\u0027entreprendre une ventilation d\u0027attaque ?","c":["Des personnes se trouveraient entre le foyer et le sortant","Des fenêtres risquent de casser sous l\u0027effet de la chaleur","Les locaux permettent une veine d\u0027air de forme allongée","Le feu est déjà ventilé par une fenêtre ouverte de la pièce"],"r":0,"e":"Une ventilation d\u0027attaque ne doit pas être entreprise si elle a pour conséquence de placer des victimes ou des intervenants entre le foyer et un sortant. Les trois autres situations sont au contraire celles où le guide juge ce mode d\u0027attaque particulièrement adapté.","ref":"§ VEN-STR 5.3. Règles de sécurité — p. 19","p":"la mise en place d\u0027une ventilation operationnelle d\u0027attaque ne doit pas etre entreprise si elle a pour consequence de placer des victimes ou des intervenants entre le foyer et un sortant","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Équipier","q":"Une ventilation opérationnelle est en place. Selon les règles de sécurité du guide, par où est-il interdit aux intervenants de s\u0027engager ?","c":["Par l\u0027entrant, où est placé le ventilateur","Par le sortant, d\u0027où sortent les fumées","Par une cage d\u0027escalier mise en surpression","Par une porte d\u0027accès située hors du flux"],"r":1,"e":"Parmi les principes forts de sécurité, le guide pose que les intervenants ne doivent pas s\u0027engager par le sortant, ouverture par laquelle sortent les fumées. Il proscrit aussi toute ventilation d\u0027attaque qui placerait victimes ou intervenants entre le foyer et un sortant.","ref":"§ VEN-STR 5.3. Règles de sécurité — p. 19","p":"les intervenants ne doivent pas s\u0027engager par le sortant.","s":"gto-vent"},
{"t":"gto-vent","ch":"Mise en œuvre et sécurité","niv":"Chef d\u0027agrès","q":"Vous voulez que le ventilateur ne soit démarré que sur votre ordre. Quand devez-vous formuler cette restriction ?","c":["Au moment où le binôme atteint le foyer","Une fois le ventilateur déjà en marche","Dans l\u0027ordre initial donné aux équipes","Seulement si l\u0027équipier vous le demande"],"r":2,"e":"Les restrictions à l\u0027engagement doivent être formulées dans l\u0027ordre initial, par exemple : « vous ne démarrez la ventilation que sur mon ordre ». Il s\u0027agit que toutes les équipes partagent une même vision de l\u0027ordre des actions.","ref":"§ VEN-STR 5.4. Coordination des actions — p. 19","p":"Si des restrictions a l\u0027engagement doivent etre faites, elles doivent etre formulees dans l\u0027ordre initial. Il peut en etre ainsi d\u0027une indication de mise en route d\u0027un ventilateur sur ordre.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Équipier","q":"Quel est l\u0027objectif principal du recloisonnement du feu ?","c":["Priver totalement le foyer d\u0027oxygène pour l\u0027éteindre sans apport d\u0027eau","Empêcher les flammes de rattraper les fumées des volumes voisins","Mettre le local en feu en surpression pour repousser les fumées dehors","Créer un sortant dans le local en feu avant l\u0027engagement du binôme"],"r":1,"e":"Le recloisonnement isole le feu des zones enfumées pour les sécuriser et éviter que les flammes ne rattrapent et n\u0027enflamment les fumées ayant envahi les volumes adjacents (couloirs, pièces voisines, étage…). Les autres actions, généralement des sauvetages, peuvent alors être engagées avec plus de sécurité.","ref":"§ VEN-STR-PRO-1 1. Objectif — p. 23","p":"Cette technique operationnelle est destinee a isoler le feu des zones enfumees pour les securiser et eviter que les flammes presentes dans le volume en feu ne rattrapent et n\u0027enflamment les fumees qui ont envahi les volumes adjacents","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Chef d\u0027équipe","q":"Un feu est contenu dans une chambre à la porte ouverte ; le couloir est enfumé et une victime est signalée à côté. Quelle action en première intention ?","c":["Ouvrir les fenêtres du couloir pour le désenfumer","Attaquer le feu dans la chambre avant tout sauvetage","Mettre en route un ventilateur à la porte palière","Fermer immédiatement la porte de la chambre en feu"],"r":3,"e":"Fermer la porte du volume en feu le recloisonne : le feu est isolé des zones enfumées, pour éviter que les flammes n\u0027enflamment les fumées des volumes adjacents, et le sauvetage peut être engagé dans les meilleurs délais. Sans risque particulier, cette manœuvre peut être entreprise avant même d\u0027avoir achevé la reconnaissance.","ref":"§ VEN-STR-PRO-1 5. Cohérence de l\u0027action — p. 24","p":"La fermeture de la porte interieure permet de recloisonner le feu. Sans cette manœuvre, le sauvetage dans les volumes adjacents et particulierement dans les etages superieurs, presente un tres haut niveau de risque.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Équipier","q":"Dans le local siège du feu, où les gaz chauds créent-ils une surpression relative par rapport aux locaux voisins ?","c":["En partie supérieure du local","En partie inférieure du local","À mi-hauteur, au niveau des ouvrants","Uniformément sur toute la hauteur du local"],"r":0,"e":"Sauf cas exceptionnel, les gaz chauds créent en partie supérieure du local en feu une surpression relative par rapport aux points situés à même hauteur dans les locaux voisins. Cela favorise la propagation horizontale des fumées et de l\u0027incendie, que la mise en dépression du local en feu est destinée à éviter.","ref":"§ VEN-STR-PRO-2 1. Objectifs — p. 29","p":"La présence de gaz chauds dans le volume siège du feu crée (sauf cas exceptionnel) en partie supérieure de ce local une surpression relative par rapport aux points situés à même hauteur dans les locaux voisins.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Chef d\u0027équipe","q":"Pour mettre en dépression un local en feu situé en sous-sol, à quoi raccorde-t-on le ventilateur fonctionnant en extraction ?","c":["À la colonne sèche desservant les étages du bâtiment","Au raccord « ZAG » présent sur la façade du bâtiment","À la gaine de ventilation mécanique des logements","À la bouche d\u0027incendie la plus proche du bâtiment"],"r":1,"e":"Un ventilateur fonctionnant en extraction (hydroventilateur, ventilateur électrique ATEX…) est raccordé au raccord « ZAG », courant en façade des bâtiments disposant de locaux en sous-sol (caves notamment), puis mis en action. Il faut employer des manches et ventilateurs conçus pour l\u0027extraction de gaz chauds.","ref":"§ VEN-STR-PRO-2 4. Mise en œuvre — p. 30","p":"Un ventilateur (hydro ventilateur ; ventilateur electrique ATEX ; …) fonctionnant en extraction est raccorde au raccord ZAG, puis mis en action.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Chef d\u0027agrès","q":"Feu de sous-sol entré en régime sous-ventilé. Selon le guide, quand une ventilation par extraction de ce local peut-elle être mise en place ?","c":["Dès l\u0027arrivée, pour abaisser la température avant l\u0027engagement","Avant l\u0027attaque, pour réduire la quantité de gaz combustibles","Après extinction totale, dans un objectif de désenfumage","Pendant l\u0027attaque, pour améliorer la visibilité du binôme"],"r":2,"e":"Sur un feu sous-ventilé, l\u0027extraction réduit le volume de gaz, ce qui peut améliorer les proportions du mélange et provoquer son inflammation. Le guide réserve donc cette ventilation à l\u0027après-extinction totale, dans un objectif de désenfumage.","ref":"§ VEN-STR-PRO-2 6.3. Cas des feux sous-ventilés — p. 31","p":"La reduction du volume de gaz peut en effet ameliorer les proportions du melange et provoquer son inflammation. Cette ventilation ne sera mise en place qu\u0027apres extinction totale dans un objectif de desenfumage.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Équipier","q":"Pour protéger un local sain contigu au local en feu, on le met en surpression. Comment le guide décrit-il ce dispositif ?","c":["Un ventilateur en extraction dans le local sain, raccordé à une gaine souple","Un ventilateur devant la porte du local en feu, avec un sortant dans le local sain","Un ventilateur dans le local sain, orienté vers la cloison qui le sépare du feu","Un ventilateur devant une porte extérieure du local sain, sans créer de sortant"],"r":3,"e":"Un ventilateur à pression positive est placé devant une porte extérieure donnant dans le local sain (entrant) et aucun sortant n\u0027est créé. Le local sain est ainsi en surpression par rapport au local en feu : c\u0027est une action défensive qui limite l\u0027extension du feu dans cette direction.","ref":"§ VEN-STR-PRO-3 4. Mise en œuvre — p. 34","p":"Devant une porte extérieure donnant dans le local sain (entrant), un ventilateur à pression positive est mis en œuvre. Il n\u0027est pas créé de sortant (exutoire de fumée).","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour protéger","niv":"Chef d\u0027agrès","q":"Vous faites mettre en surpression un local sain contigu au local en feu. Quelle est la seule précaution importante ?","c":["Créer un sortant dans le local sain avant la mise en route du ventilateur","Vérifier l\u0027absence de grandes ouvertures vers le local en feu","Établir une lance en eau à l\u0027intérieur du local sain","Attendre l\u0027extinction complète du foyer avant de ventiler"],"r":1,"e":"Cette mise en surpression, sans création de sortant, est sans risque car l\u0027air qui atteint le foyer par les défauts d\u0027étanchéité est très faible. Mais s\u0027il existait de grandes ouvertures (porte, trémie…) vers le local en feu, on risquerait d\u0027augmenter la puissance du feu, peut-être de façon violente (backdraft).","ref":"§ VEN-STR-PRO-3 6. Limites d\u0027emploi — p. 34","p":"La seule precaution importante est la verification de l\u0027absence de grandes ouvertures vers le local en feu (aisee a constater puisqu\u0027au depart le local est libre de fumees) de type porte, tremie etc…","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027agrès","q":"Un appartement situé au-dessus de l\u0027étage du feu est envahi par les fumées. À quelle condition peut-on le désenfumer ?","c":["Le déblai du logement sinistré est entièrement terminé et contrôlé","Une victime a été signalée par un témoin dans l\u0027appartement enfumé","Le feu est éteint ou suffisamment isolé de l\u0027appartement enfumé","Le binôme d\u0027attaque est arrivé au palier du logement en feu"],"r":2,"e":"Ce désenfumage concerne un volume non touché par le feu : le feu doit être éteint ou suffisamment isolé, sans possibilité d\u0027allumage des fumées par le foyer initial. La manœuvre ne présente alors pas de risque particulier, dès lors qu\u0027on est sûr que le feu ne peut atteindre la veine d\u0027air.","ref":"§ VEN-STR-DEF-1 2. Configuration opérationnelle — p. 37","p":"Le feu est éteint ou suffisamment isolé de l\u0027appartement envahi par les fumées (pas de possibilité d\u0027allumage des fumées par le foyer initial).","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027équipe","q":"Comment s\u0027assurer de l\u0027efficacité d\u0027une ventilation par pression positive en cours ?","c":["Mesurer le temps écoulé depuis la mise en route","Contrôler la température de l\u0027air à l\u0027entrant","Vérifier l\u0027absence de fumée autour du ventilateur","Observer la vitesse des fumées au sortant"],"r":3,"e":"Selon le guide, c\u0027est la vitesse des fumées au sortant qui permet de s\u0027assurer de l\u0027efficacité de la ventilation. L\u0027important est d\u0027évacuer les fumées les plus concentrées possible, et non l\u0027air frais introduit par le ventilateur.","ref":"§ VEN-STR-DEF-1 4. La mise en œuvre — p. 38","p":"La vitesse des fumées au sortant permet de s\u0027assurer de l\u0027efficacité de la ventilation.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027équipe","q":"Désenfumage par VPP : l\u0027efficacité de la ventilation paraît insuffisante. Selon le guide, quels points faut-il alors vérifier ?","c":["La pression des ARI, la température des fumées et la couleur des flammes au sortant","Le vent contraire au sortant, l\u0027intégrité de la veine d\u0027air et le ventilateur","La taille de l\u0027entrant, le nombre de victimes et la durée d\u0027engagement","Le régime de la pompe, la longueur des tuyaux et le débit de la lance"],"r":1,"e":"À défaut d\u0027une vitesse suffisante des fumées au sortant, on vérifie l\u0027absence de vent contraire au niveau du sortant, l\u0027intégrité de la veine d\u0027air et le bon fonctionnement du ventilateur.","ref":"§ VEN-STR-DEF-1 4. La mise en œuvre — p. 38","p":"A défaut on vérifiera : l\u0027absence de vent contraire au niveau du sortant ; l\u0027intégrité de la veine d\u0027air […] le bon fonctionnement du ventilateur.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Équipier","q":"Au-delà de quelle vitesse un vent soufflant vers le sortant empêchera-t-il très probablement les fumées de sortir lors d\u0027un désenfumage ?","c":["10 km/h","50 km/h","18 km/h","80 km/h"],"r":2,"e":"Le guide admet que, si un vent vient en direction du sortant, le désenfumage perd en efficacité au-delà de 18 km/h (5 m/s) : un tel vent empêchera très probablement les fumées de sortir. Le même seuil rend la ventilation d\u0027attaque risquée.","ref":"§ VEN-STR-DEF-1 6. Limites d\u0027emploi — p. 38","p":"la présence d\u0027un vent ayant une vitesse supérieure à 18 Km/h empêchera très probablement les fumées de sortir.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027équipe","q":"Sans ventilateur, quelle disposition des ouvertures par rapport au vent crée naturellement un gradient de pression favorable entre l\u0027entrant et le sortant ?","c":["Entrant sur une face exposée au vent, sortant sur une face abritée","Entrant sur une face abritée, sortant sur une face exposée au vent","Entrant et sortant sur la même face, exposée au vent","Entrant et sortant sur la même face, abritée du vent"],"r":0,"e":"Le gradient de pression entre entrant et sortant peut avoir une origine naturelle, par exemple lorsque l\u0027entrant est sur une face exposée au vent et le sortant sur une face abritée. À l\u0027inverse, un vent de plus de 18 km/h venant en direction du sortant fait perdre en efficacité la technique de désenfumage.","ref":"§ VEN-STR-DEF-1 Remarques — p. 39","p":"il peut aussi avoir une origine naturelle. Par exemple si l\u0027entrant est situé sur une face exposée au vent alors que le sortant est sur une face abritée.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027équipe","q":"Qu\u0027est-ce que la ventilation séquentielle d\u0027un volume compartimenté ?","c":["Le désenfumage des pièces les unes après les autres","L\u0027alternance de phases de marche et d\u0027arrêt du ventilateur","Le relais d\u0027équipes successives au ventilateur pendant l\u0027intervention","L\u0027emploi successif de deux ventilateurs de puissance croissante"],"r":0,"e":"En ventilation séquentielle, les volumes sont ventilés les uns après les autres : pendant le désenfumage d\u0027une pièce, les autres sont fermées ; une fois la pièce suffisamment ou totalement libre de fumée, on referme sa porte et on passe à la suivante. On conserve ainsi au mieux l\u0027effet piston.","ref":"§ VEN-STR-DEF-2 6.2. Choix de la méthode séquentielle ou simultanée — p. 43","p":"La ventilation séquentielle (les volumes unitaires sont ventilés les uns après les autres) ou simultanée dépend de la configuration des lieux et par conséquent des pertes de charges associées.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventiler pour désenfumer","niv":"Chef d\u0027équipe","q":"Vous désenfumez un appartement dont le couloir dessert plusieurs pièces enfumées. Par quelle pièce le guide recommande-t-il de commencer, si possible ?","c":["Par la pièce la plus proche de l\u0027entrant","Par la pièce la plus enfumée du logement","Par une pièce au bout de la circulation","Par la pièce dotée de la plus grande fenêtre"],"r":2,"e":"En désenfumage séquentiel, on commence si possible par une pièce située à l\u0027extrémité de la circulation, toutes les autres étant fermées : la circulation est ainsi totalement libérée des fumées assez rapidement. On referme ensuite la porte de la pièce et on passe à la suivante.","ref":"§ VEN-STR-DEF-2 4. La mise en œuvre — p. 42","p":"On commencera par désenfumer une des pièces situées à l\u0027extrémité de la circulation si possible. Ainsi cette circulation sera totalement libérée des fumées assez rapidement. Pendant le désenfumage de cette pièce, toutes les autres sont fermées.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Équipier","q":"Quel est l\u0027objectif de la ventilation d\u0027attaque ?","c":["Remplacer par de l\u0027air frais les fumées de l\u0027accès au volume en feu","Assainir les locaux après l\u0027extinction pour faciliter le déblai final","Empêcher les fumées de pénétrer dans un local sain contigu","Priver le feu de comburant en réduisant au maximum l\u0027apport d\u0027air"],"r":0,"e":"La ventilation d\u0027attaque vise à faciliter et sécuriser l\u0027attaque : les fumées qui ont envahi l\u0027accès au volume en feu sont remplacées par de l\u0027air frais et rejetées à l\u0027extérieur, ce qui permet une attaque rapide grâce à la visibilité retrouvée. Priver le feu de comburant relève de l\u0027antiventilation.","ref":"§ VEN-STR-ATT-1 1. Objectif — p. 47","p":"Il s\u0027agit d\u0027orienter les flux gazeux pour remplacer les fumées qui ont envahi l\u0027accès au volume en feu par de l\u0027air frais, les fumées sont rejetées à l\u0027extérieur.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"Lors d\u0027une attaque en ventilation positive, qu\u0027advient-il de la chaleur convective du feu ?","c":["Elle est ramenée vers l\u0027entrant, derrière le binôme","Elle est poussée vers les locaux adjacents sains","Elle est rabattue en partie basse du volume en feu","Elle est repoussée au-delà du foyer"],"r":3,"e":"L\u0027attaque en ventilation positive est une tactique offensive : la chaleur convective du feu est repoussée au-delà du foyer, les sapeurs-pompiers vont rapidement au contact du feu avec une bonne visibilité, dans une zone en grande partie sécurisée par la veine d\u0027air frais.","ref":"§ VEN-STR-ATT-1 3. Application — p. 47","p":"Une attaque en ventilation positive est une tactique offensive agressive par rapport au feu : la chaleur convective du feu est repoussée au-delà du foyer","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"Ventilation d\u0027attaque : où le sortant doit-il être réalisé ?","c":["Du côté opposé au feu, pour protéger le ventilateur","Dans une pièce éloignée du feu, afin de ne pas attiser le foyer","Au plus près du foyer, de façon non destructrice si possible","Au rez-de-chaussée, à proximité immédiate de l\u0027entrant"],"r":2,"e":"Après reconnaissance, le sortant est réalisé au plus près du foyer, en partie haute, de façon non destructrice si possible. Les gaz de combustion très chauds sont ainsi en très grande partie rejetés à l\u0027extérieur.","ref":"§ VEN-STR-ATT-1 4. Mise en œuvre — p. 48","p":"Après reconnaissance, un sortant est réalisé au plus près du foyer en partie haute, de façon non destructrice si possible.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027agrès","q":"Vous préparez une ventilation d\u0027attaque ; le sortant donne sur une façade exposée à un risque de propagation. Que prévoit le guide ?","c":["Renoncer à ce sortant et attaquer plutôt en antiventilation","Établir un moyen hydraulique pour contrer ce risque","Placer un stoppeur de vent devant le sortant créé","Réduire la taille du sortant au strict minimum"],"r":1,"e":"Pendant l\u0027attaque, des gaz très chauds et des flammes peuvent propager l\u0027incendie au sortant. S\u0027il existe un risque de propagation en façade, un moyen hydraulique est établi pour le contrer. Le stoppeur de vent, lui, sert à refermer artificiellement une fenêtre ouverte sur une façade exposée à un vent fort.","ref":"§ VEN-STR-ATT-1 4. Mise en œuvre — p. 48","p":"S\u0027il existe un risque de propagation en façade, un moyen hydraulique sera établi afin de contrer celui-ci.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"En ventilation d\u0027attaque, quel risque présente un sortant de taille trop faible ?","c":["Un refoulement des gaz chauds à contre-sens du flux","Un arrêt du foyer par manque d\u0027apport d\u0027air frais","Une suroxygénation du foyer par un excès de débit d\u0027air","Une chute brutale de la pression dans la pièce en feu"],"r":0,"e":"Avec un sortant trop petit, la pression en partie haute de la pièce risque au contraire de croître : une partie des gaz chauds en hauteur peut alors être refoulée en sens inverse du flux général de ventilation.","ref":"§ VEN-STR-ATT-1 4. Mise en œuvre — p. 48","p":"la taille de ce sortant risque d\u0027être trop faible. La pression en partie haute de la pièce risque ainsi de croître. Une partie des gaz chaud en hauteur, peut alors être refoulée en sens inverse du flux général de ventilation.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"Ventilation d\u0027attaque : en dessous de quelle surface le sortant risque-t-il d\u0027être trop petit ?","c":["0,5 m²","1 m²","2 m²","4 m²"],"r":1,"e":"Selon le guide, en dessous de 1 m², la taille du sortant risque d\u0027être trop faible : la pression en partie haute de la pièce risque alors de croître.","ref":"§ VEN-STR-ATT-1 4. Mise en œuvre — p. 48","p":"En dessous de 1 m², la taille de ce sortant risque d\u0027être trop faible. La pression en partie haute de la pièce risque ainsi de croître.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"VPP en cours : que faire des portes intermédiaires situées sur le trajet de la veine d\u0027air ?","c":["Les caler, car elles peuvent se refermer sous l\u0027effet du courant d\u0027air","Les fermer pour freiner le passage des fumées vers le sortant","Les démonter de leurs gonds pour agrandir l\u0027entrant","Les laisser libres, le courant d\u0027air suffisant à les maintenir ouvertes"],"r":0,"e":"Des portes intermédiaires non calées peuvent se refermer sous l\u0027effet du courant d\u0027air et compromettre l\u0027intégrité de la veine d\u0027air : il faut y prêter attention et les caler.","ref":"§ VEN-STR-ATT-1 4. Mise en œuvre — p. 49","p":"l\u0027intégrité de la veine d\u0027air (attention aux portes intermédiaires non calées qui peuvent se refermer sous l\u0027effet du courant d\u0027air)","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027agrès","q":"Effectif réduit : une fois le ventilateur positionné à l\u0027entrant pour une ventilation d\u0027attaque, qui peut en assurer la gestion ?","c":["Le chef du binôme d\u0027attaque","L\u0027équipier du binôme d\u0027attaque","Le chef de groupe arrivé en renfort","Le conducteur de l\u0027engin-pompe"],"r":3,"e":"La mise en place d\u0027une VPP est généralement peu chronophage : le chef d\u0027agrès peut aider le conducteur à descendre le ventilateur et à le positionner à l\u0027entrant, puis le conducteur peut gérer lui-même le ventilateur.","ref":"§ VEN-STR-ATT-1 6.3. Moyens humains limités — p. 50","p":"Le chef d\u0027agrès peut rapidement aider le conducteur à descendre le ventilateur et le positionner à l\u0027entrant, par la suite ce ventilateur peut être géré par le conducteur lui-même.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027agrès","q":"Selon le guide, dans quelle situation la ventilation d\u0027attaque est-elle particulièrement adaptée ?","c":["Feu sous-ventilé dans un local clos, avec un risque de backdraft identifié","Feu dans un entrepôt de grand volume, vent fort contraire au sortant","Feu déjà ventilé avec sortant, volumes permettant une veine allongée","Feu dans un local borgne en sous-sol, sans sortant réalisable"],"r":2,"e":"La ventilation d\u0027attaque est particulièrement adaptée quand le feu est déjà ventilé (présence d\u0027un sortant), quand des fenêtres risquent de casser rapidement sous la chaleur et quand la volumétrie permet une veine d\u0027air de forme allongée. En cas de risque de backdraft, la reconnaissance et la lecture du feu doivent au contraire permettre d\u0027éviter de la mettre en œuvre.","ref":"§ VEN-STR-ATT-1 6.2. Quand privilégier ce mode — p. 50","p":"Ce mode d\u0027attaque est particulièrement adapté : quand le feu est déjà ventilé (présence d\u0027un sortant) ;","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027agrès","q":"Feu développé dans un bâtiment de grand volume. Que préconise le guide concernant une ventilation d\u0027attaque ?","c":["La privilégier, le grand volume diluant les fumées et la chaleur","L\u0027éviter : risque de suroxygénation du foyer, sans effet piston","La réserver aux cas de vent fort orienté vers le sortant","La réaliser uniquement avec des ventilateurs grand débit"],"r":1,"e":"Dans un gros volume, l\u0027effet piston n\u0027est pas présent : la ventilation d\u0027attaque risque de suroxygéner le foyer, la chaleur est peu évacuée aux sortants, les turbulences propagent l\u0027incendie et la situation se dégrade. Le guide la réserve uniquement à certains feux naissants.","ref":"§ VEN-STR-ATT-1 6.5. Gros volumes — p. 50","p":"Cette ventilation offensive, mise en œuvre dans de gros volumes, risque d\u0027induire une suroxygénation du foyer, qui sera a priori peu compensée par une évacuation de la chaleur au niveau des sortants et donc engendrer une dégradation de la situation.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027agrès","q":"Ventilation d\u0027attaque avec un vent soufflant face au sortant : quel danger le guide signale-t-il ?","c":["Le sortant peut brutalement se comporter en entrant","Le vent accélère l\u0027évacuation des fumées par le sortant","Le ventilateur cale sous la contre-pression","Les fumées se stratifient durablement contre le plafond"],"r":0,"e":"Le vent étant instable, les gaz de combustion peuvent brutalement changer de direction et le sortant se comporter en entrant, mettant en péril les personnels engagés. Un vent supérieur à 18 km/h rend l\u0027exercice risqué : quand l\u0027orientation du vent n\u0027est pas favorable, on évite la ventilation d\u0027attaque.","ref":"§ VEN-STR-ATT-1 6.6. Le risque lié au vent — p. 51","p":"La résultante est le risque de voir brutalement les gaz de combustion changer de direction et le sortant se comporter en entrant, mettant en péril les personnels engagés.","s":"gto-vent"},
{"t":"gto-vent","ch":"Ventilation d\u0027attaque","niv":"Chef d\u0027équipe","q":"Si une ventilation d\u0027attaque est entreprise sur un feu présentant un risque de backdraft, à quel moment le risque est-il maximal ?","c":["Après plusieurs minutes de ventilation à pleine puissance","Au moment de l\u0027arrêt du ventilateur en fin d\u0027opération","Dans les instants qui suivent la création de l\u0027exutoire","Pendant le déblai, quand les braises sont remuées"],"r":2,"e":"Un feu insuffisamment ventilé peut conduire à un backdraft si de l\u0027air frais entre dans la pièce ; la reconnaissance et la lecture du feu doivent permettre d\u0027éviter cette situation. Si une ventilation d\u0027attaque est malgré tout entreprise, le risque est maximal dans les instants qui suivent la création de l\u0027exutoire, puis diminue (sauf gros volumes).","ref":"§ VEN-STR-ATT-1 6.7.2. Risque de backdraft — p. 52","p":"si une ventilation positive d\u0027attaque etait entreprise dans ces conditions, le risque maximal sera present surtout dans les instants qui suivent la creation de l\u0027exutoire","s":"gto-vent"},
