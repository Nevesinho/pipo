{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027équipe","q":"Au sein d\u0027un binôme engagé en zone d\u0027exclusion, comment chaque membre participe-t-il à la sécurité de l\u0027équipe ?","c":["Par des angles de vue complémentaires, pour détecter tôt une aggravation","En laissant au seul chef d\u0027équipe le soin de surveiller l\u0027évolution du feu","En se séparant pour surveiller deux zones du volume à la fois","En rendant compte directement au COS, sans passer par le chef d\u0027agrès"],"r":0,"e":"Le binômage s\u0027impose en zone d\u0027exclusion. Chaque membre participe à la sécurité de l\u0027équipe, notamment par la complémentarité des angles de vue, qui permet de détecter au plus tôt les signes d\u0027aggravation. Cela suppose aussi le contrôle mutuel des EPI et une communication optimale au sein de l\u0027équipe et avec le chef d\u0027agrès.","ref":"§ 1.1.2 Le binôme — p. 61","p":"Chaque membre du binôme participe à la sécurité de l\u0027équipe, notamment par la complémentarité des angles de vues, permettant la détection au plus tôt des signes d\u0027aggravation de la situation opérationnelle.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027agrès","q":"Avant d\u0027engager ou de réengager un binôme, que doit prendre en compte le chef d\u0027agrès selon le guide ?","c":["Uniquement la pression restante dans les bouteilles d\u0027ARI","La charge opérationnelle : fatigue, stress, chaleur, météo","Uniquement l\u0027ancienneté et la qualification des équipiers","L\u0027avis des équipiers, seuls juges de leur capacité à repartir"],"r":1,"e":"Seul ou sous l\u0027autorité d\u0027un COS, le chef d\u0027agrès doit prendre en compte la charge opérationnelle pesant sur le binôme, c\u0027est-à-dire le cumul des effets de la fatigue, du stress psychologique et thermique et des conditions météorologiques, avant de l\u0027engager ou de le réengager.","ref":"§ 1.1.3 Le chef d\u0027agrès — p. 61","p":"il doit notamment prendre en compte la charge opérationnelle (cumul des effets dus à la fatigue, au stress psychologique et thermique, aux conditions météorologiques, ...) pesant sur le binôme avant de l\u0027engager ou de le réengager.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Équipier","q":"Où le binôme de sécurité est-il positionné et quelle est sa mission principale ?","c":["En zone contrôlée, pour sauver les intervenants en cas d\u0027accident","En zone d\u0027exclusion, en appui direct du binôme d\u0027attaque au feu","En zone de soutien, pour la réhabilitation des personnels relevés","Au point d\u0027entrée, pour suivre l\u0027engagement des binômes"],"r":0,"e":"Le binôme de sécurité est positionné en zone contrôlée, à disposition immédiate du COS ou de son représentant. Sa mission principale est d\u0027assurer le sauvetage du personnel intervenant en cas d\u0027accident ; il peut effectuer des missions secondaires s\u0027il reste en zone contrôlée, à l\u0027appel. Le suivi de l\u0027engagement au point d\u0027entrée revient au contrôleur.","ref":"§ 1.2.2 Binôme de sécurité — p. 63","p":"Il est positionné en zone contrôlée à disposition immédiate du COS ou de son représentant. Sa mission principale est d\u0027assurer le sauvetage du personnel intervenant en cas d\u0027accident.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès : aucun binôme de sécurité n\u0027est en place et vous engagez de façon limitée un binôme d\u0027attaque (BAT). Que prévoit le guide ?","c":["Engager le BAT sans mesure de sécurité particulière, faute d\u0027effectif","Confier la sécurité du BAT au conducteur, qui reste à la pompe","Interdire tout engagement tant qu\u0027il n\u0027y a pas de binôme de sécurité","Assurer vous-même la sécurité du BAT, en restant en contact permanent"],"r":3,"e":"À défaut de binôme de sécurité, pour l\u0027engagement limité d\u0027un binôme d\u0027attaque, le chef d\u0027agrès peut assurer lui-même la sécurité du BAT : il reste en contact permanent et peut disposer d\u0027un ARI. Le COS met en place le binôme de sécurité dès que le potentiel humain le permet et que les circonstances le nécessitent.","ref":"§ 1.2.2 Binôme de sécurité — p. 63","p":"A défaut d\u0027un binôme de sécurité, pour l\u0027engagement limité d\u0027un binôme d\u0027attaque (BAT), le chef d\u0027agrès peut assurer lui-même la sécurité du BAT, il reste en contact permanent et peut disposer d\u0027un ARI.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Équipier","q":"Selon le système alphabétique préconisé par le guide, comment les façades d\u0027un bâtiment sont-elles désignées ?","c":["A pour la façade la plus exposée au feu, puis B, C, D dans le sens horaire","A pour la façade nord, puis B, C, D dans le sens horaire","A pour la façade d\u0027accès principal, puis B, C, D dans le sens horaire","A pour la façade d\u0027accès principal, puis B, C, D dans le sens antihoraire"],"r":2,"e":"Pour qu\u0027un personnel en difficulté puisse indiquer sa position, et pour l\u0027organisation du chantier, le guide préconise le système alphabétique : la façade « A » est la façade d\u0027accès principal, les autres étant nommées « B », « C », « D » dans le sens des aiguilles d\u0027une montre.","ref":"§ 1.2.3.1 Appellations de façades — p. 64","p":"le système alphabétique est préconisé (la façade « A » étant la façade d\u0027accès principal et les autres étant nommées dans le sens des aiguilles d\u0027une montre","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et engagez un binôme. Quelles notions la procédure d\u0027évacuation d\u0027urgence qu\u0027il doit connaître intègre-t-elle a minima ?","c":["Heure d\u0027engagement, pression des bouteilles d\u0027ARI et nom des binômes engagés","Position du foyer, débit des lances et emplacement des points d\u0027eau utilisables","Signal d\u0027alarme, itinéraires de repli ou de secours, regroupement et comptage","Plan du bâtiment, liste des occupants et position des engins sur place"],"r":2,"e":"Le binôme doit connaître la procédure d\u0027évacuation d\u0027urgence en cas de danger grave et imminent. Elle intègre a minima la définition du signal d\u0027alarme d\u0027évacuation, le ou les itinéraires de repli et/ou de secours, les consignes sur la ou les zones de regroupement et la comptabilisation des intervenants.","ref":"§ 1.2.3.2 Procédure d\u0027évacuation — p. 64","p":"Cette procédure doit intégrer à minima les notions suivantes : définition du signal d\u0027alarme d\u0027évacuation, (ex. : « code rouge ») itinéraire(s) de repli et/ou de secours, consignes sur la (les) zone(s) de regroupement et comptabilisation des intervenants.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027équipe","q":"Qu\u0027appelle-t-on « itinéraire de repli » pour un binôme engagé dans un bâtiment ?","c":["Un chemin créé par échelles ou MEA si l\u0027accès normal n\u0027est plus utilisable","Le chemin d\u0027accès normal emprunté pour entrer, à utiliser en priorité","Le chemin le plus court vers la zone de regroupement extérieure","Un chemin désigné par radio par le chef d\u0027agrès au moment du repli"],"r":1,"e":"L\u0027itinéraire de repli est le chemin d\u0027accès normal emprunté par les binômes pour pénétrer dans le bâtiment : reconnu et libéré de toute entrave, il est à utiliser prioritairement et permet le repli avec les moyens hydrauliques. L\u0027itinéraire de secours s\u0027y substitue s\u0027il n\u0027est plus fonctionnel ; sa création s\u0027anticipe (échelles, MEA).","ref":"§ 1.2.3.3 Itinéraires de repli et de secours — p. 64","p":"Itinéraire de repli : est constitué par le chemin d\u0027accès normal qu\u0027ont emprunté les binômes pour pénétrer dans le bâtiment. Il a été reconnu et doit être libéré de toutes entraves [...] cet itinéraire est à utiliser prioritairement.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Équipier","q":"Un binôme va s\u0027engager en zone d\u0027exclusion. Outre sa tenue et sa protection respiratoire avec balise, de quoi doit-il disposer a minima ?","c":["D\u0027un moyen hydraulique, d\u0027un moyen de communication et d\u0027un éclairage","D\u0027une caméra thermique, d\u0027un outil de forcement et d\u0027une sangle de sauvetage","D\u0027une ligne guide, d\u0027un détecteur de CO et d\u0027un projecteur sur trépied","D\u0027un extincteur à poudre, d\u0027une hache et d\u0027une couverture d\u0027extinction"],"r":0,"e":"L\u0027engagement en zone d\u0027exclusion nécessite a minima, dans la plupart des cas, une tenue adaptée, une protection respiratoire associée à une balise, un moyen hydraulique immédiatement disponible, un moyen de communication (radio ou corne d\u0027appel) avec au moins un intervenant hors zone et un éclairage individuel. Caméra thermique, outil de forcement ou sangle sont des compléments.","ref":"§ 1.3.1 Principes de la protection individuelle — p. 65","p":"Un moyen hydraulique immédiatement disponible […] Un moyen de communication (Radio ou corne d\u0027appel) permettant au binôme de communiquer avec au moins un intervenant positionné hors zone d\u0027exclusion ; Un moyen d\u0027éclairage individuel","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Équipier","q":"La sécurité d\u0027un binôme devient gravement menacée alors qu\u0027il attaque un foyer. Que doit-il faire selon le guide ?","c":["Terminer l\u0027extinction du foyer avant de se protéger","Rester sur place et attendre l\u0027arrivée du binôme de sécurité","Demander l\u0027autorisation de se replier au chef d\u0027agrès","Assurer sa sauvegarde en priorité sur l\u0027action en cours"],"r":3,"e":"Si la sécurité d\u0027un ou plusieurs intervenants est gravement menacée, ils doivent assurer leur sauvegarde prioritairement à l\u0027action en cours, en mettant en œuvre les techniques d\u0027auto-sauvetage pour se mettre en sécurité face au péril imminent.","ref":"§ 1.3.2 Auto-sauvetage — p. 66","p":"Si la sécurité d\u0027un ou plusieurs intervenant(s) est gravement menacée, ils doivent assurer leur sauvegarde prioritairement à l\u0027action en cours.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Sécurité en intervention","niv":"Chef d\u0027agrès","q":"À l\u0027arrivée du premier engin sur un feu de structure, qui assure le commandement des opérations de secours ?","c":["Le conducteur de l\u0027engin, resté à l\u0027extérieur en liaison radio permanente","Le chef d\u0027équipe du binôme d\u0027attaque, au plus près du feu","Le chef d\u0027agrès, premier COS, jusqu\u0027à sa relève par un autre COS","Le propriétaire ou le gardien, jusqu\u0027à l\u0027arrivée d\u0027un officier"],"r":2,"e":"Le chef d\u0027agrès du premier engin est le premier COS : il est à la fois responsable de la sécurité et de la réhabilitation des intervenants placés sous son commandement. Les COS se succèdent ensuite, à partir du chef d\u0027agrès, au fil de la montée en puissance du dispositif.","ref":"§ 2.1 Cas des interventions courantes — p. 66","p":"Le chef d\u0027agrès d\u0027un engin, premier COS, est à la fois responsable de la sécurité et de la réhabilitation des intervenants placés sous son commandement.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Chef d\u0027agrès","q":"Selon le guide, à quoi correspond en réalité la marche générale des opérations (MGO) de lutte contre l\u0027incendie ?","c":["À un enchaînement chronologique strict d\u0027actions à mener dans l\u0027ordre","À l\u0027approche de réflexion des équipes, et en particulier du COS","À une liste d\u0027actions dont seules les reconnaissances sont obligatoires","À une procédure réservée aux feux mobilisant plusieurs engins"],"r":1,"e":"Trop souvent considérée comme un enchaînement chronologique d\u0027actions, la MGO correspond en fait à l\u0027approche que doivent avoir les équipes et en particulier le COS. Cette réflexion s\u0027appuie sur onze critères, des reconnaissances à la préservation des traces et indices, en passant par la ventilation, l\u0027attaque et la protection.","ref":"§ Section III La marche générale des opérations — p. 68","p":"Trop souvent considérée comme l\u0027enchainement chronologique de différentes actions, la marche générale des opérations de lutte contre l\u0027incendie correspond en fait à l\u0027approche que doivent avoir les équipes d\u0027intervenants et en particulier le commandant des opérations de secours.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Chef d\u0027agrès","q":"Vous êtes premier chef d\u0027agrès sur un feu et savez que vous resterez seul avec votre engin un certain temps. Quelle reconnaissance mener ?","c":["Une reconnaissance très sommaire, afin d\u0027engager au plus vite tout l\u0027équipage","Une reconnaissance plus approfondie, renseignement et renforts vous incombant","Aucune reconnaissance : elle reviendra au futur COS à son arrivée","Une reconnaissance limitée à la recherche du point d\u0027eau le plus proche"],"r":1,"e":"Le premier chef d\u0027agrès qui sait que les moyens se limiteront quelque temps à son engin doit faire des choix plus sûrs, ce qui peut nécessiter une reconnaissance plus approfondie, d\u0027autant que le renseignement et la demande éventuelle de renfort lui incombent. S\u0027il doit être vite rejoint par un SP destiné à prendre le commandement, une reconnaissance sommaire peut suffire.","ref":"§ 1 Les reconnaissances — p. 69","p":"A l\u0027inverse le premier chef d\u0027agrès qui sait que les moyens se limiteront pendant quelques temps à ceux dont il dispose (son agrès) va devoir effectuer des choix plus sûrs ce qui pourra nécessiter une reconnaissance plus approfondie","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Équipier","q":"Qu\u0027est-ce qui distingue un sauvetage d\u0027une mise en sécurité selon le guide ?","c":["Le sauvetage concerne les personnes, la mise en sécurité les animaux et les biens","Le sauvetage se fait toujours par l\u0027extérieur, la mise en sécurité toujours par l\u0027intérieur","Le sauvetage répond à un danger vital imminent, la mise en sécurité à une menace différée","Le sauvetage exige un binôme sous ARI, la mise en sécurité peut être confiée à un seul équipier"],"r":2,"e":"Le sauvetage consiste à extraire une personne soumise à un danger vital et imminent, qui ne peut s\u0027y soustraire par ses propres moyens ; la mise en sécurité consiste à éloigner des personnes d\u0027une menace plus ou moins différée. Le sauvetage peut justifier une plus grande exposition au risque des sapeurs-pompiers, selon la balance bénéfice/risque.","ref":"§ 3.1 Le sauvetage — p. 71","p":"Le sauvetage consiste à extraire une personne soumise à un danger vital et imminent [...] on distingue le sauvetage de la mise en sécurité qui consiste à éloigner des personnes d\u0027une menace plus ou moins différée.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Équipier","q":"Lors d\u0027un sauvetage à vue par échelle à main, quel est le risque prépondérant selon le guide ?","c":["L\u0027exposition des sauveteurs aux fumées et à la chaleur","La chute, pour les victimes comme pour les sauveteurs","L\u0027effondrement de la structure sur laquelle s\u0027appuie l\u0027échelle","La brûlure des victimes par le rayonnement des flammes"],"r":1,"e":"Les sauvetages à vue concernent des victimes visibles depuis l\u0027extérieur et nécessitent le plus souvent des échelles à main ou des MEA. Le risque prépondérant y est la chute, pour les victimes comme pour les sauveteurs ; fumées, chaleur et effondrement sont les risques prépondérants des sauvetages en exploration.","ref":"§ 3.2 Les sauvetages à vue — p. 71","p":"Le risque prépondérant dans ce type d\u0027action est le risque de chute pour les victimes comme pour les sauveteurs.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Chef d\u0027équipe","q":"Avant un sauvetage en exploration par un itinéraire enfumé, de quoi les sauveteurs doivent-ils disposer en premier lieu selon le guide ?","c":["D\u0027une échelle à crochets et d\u0027un lot de sauvetage","D\u0027un ventilateur installé en surpression devant l\u0027entrée","D\u0027un extincteur à poudre et d\u0027un brancard","D\u0027un moyen hydraulique adapté et d\u0027une ligne de vie"],"r":3,"e":"L\u0027accès par le milieu hostile exige en premier lieu un moyen hydraulique adapté à la mission, en particulier dans le local siège du foyer et ceux atteints par les fumées et gaz chauds, et une ligne de vie (moyen hydraulique, commande, ligne guide). La protection respiratoire de la victime doit être recherchée.","ref":"§ 3.3 Les sauvetages en exploration — p. 71","p":"L\u0027accès par le milieu hostile exige en premier lieu, que les sauveteurs disposent d\u0027un moyen hydraulique adapté à leur mission, [...] mais aussi qu\u0027ils possèdent une ligne de vie (ex. : le moyen hydraulique, une commande, une ligne guide","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Reconnaissances et sauvetages","niv":"Chef d\u0027équipe","q":"Technique AIDES : un binôme pénètre par la fenêtre dans une chambre où une victime est suspectée. Quelle étape doit-il réaliser rapidement après son entrée ?","c":["Fermer la porte de la chambre donnant sur la circulation intérieure","Ouvrir la porte de la chambre pour désenfumer par la circulation","Établir une lance dans la circulation avant toute recherche de victime","Rejoindre la circulation pour explorer les pièces voisines"],"r":0,"e":"AIDES (Accéder, Isoler, Désenfumer, Explorer, Sauver) consiste à explorer pièce par pièce, depuis l\u0027extérieur, les locaux où une victime est suspectée. Le risque, raisonnable, devient majeur si l\u0027isolement du feu par fermeture de la porte donnant sur la circulation intérieure n\u0027est pas réalisé rapidement. Elle est réservée aux pièces de surface modérée comme les chambres.","ref":"§ 3.4 AIDES — p. 72","p":"Cette technique expose le sauveteur à un risque raisonnable qui peut devenir majeur si l\u0027étape de l\u0027isolement du feu par fermeture de la porte du volume donnant dans la circulation intérieure n\u0027est pas réalisée rapidement après pénétration dans le volume.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Équipier","q":"Dans la lutte contre les propagations externes, à quoi sert une lance « queue de paon » ?","c":["À projeter un jet droit à grande portée sur le foyer par une ouverture","À perforer une cloison pour attaquer sans ouvrir la porte du local","À interposer un écran d\u0027eau pulvérisée entre les flammes et les biens","À noyer les décombres lors du déblai en limitant la quantité d\u0027eau"],"r":2,"e":"Pour réduire le flux de chaleur rayonnée, la lance « queue de paon » projette l\u0027eau pulvérisée en un plan vertical interposé entre les flammes et les biens susceptibles de pyrolyser puis de s\u0027enflammer. On peut aussi refroidir les fumées dès leur sortie par un sortant, ou arroser les biens exposés.","ref":"§ 4.1 Lutte contre les propagations externes — p. 72","p":"en faisant usage d\u0027une lance « queue de paon » qui projette l\u0027eau sous forme pulvérisée en un plan vertical que l\u0027on interpose entre les flammes et les biens susceptibles de pyroliser puis de s\u0027enflammer","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Chef d\u0027équipe","q":"Lors d\u0027une attaque menée avec ventilation positive, sur quoi le binôme dirige-t-il essentiellement l\u0027eau ?","c":["Sur la couche de fumées au plafond, de façon continue","Sur les surfaces en pyrolyse ou incandescentes","Sur les murs du couloir, pour produire de la vapeur","Sur le flux d\u0027air soufflé, pour le refroidir à l\u0027entrée"],"r":1,"e":"En ventilation positive, les fumées quittent rapidement le volume : leur refroidissement n\u0027est généralement pas utile et l\u0027eau sert essentiellement à refroidir les surfaces soumises à la pyrolyse ou incandescentes. Le moyen hydraulique doit toutefois pouvoir protéger l\u0027équipe si la veine d\u0027air est coupée (panne de ventilateur, porte qui se referme).","ref":"§ 4.5 Attaque menée avec ventilation positive — p. 74","p":"L\u0027eau sera utilisée essentiellement pour refroidir les surfaces soumises à la pyrolyse ou incandescentes. Le refroidissement des fumées n\u0027est généralement pas utile, puisque celles-ci quittent rapidement le volume.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Chef d\u0027équipe","q":"Lors d\u0027une attaque en antiventilation menée depuis l\u0027extérieur du local en feu, comment l\u0027eau est-elle appliquée ?","c":["Par séquences : ouverture de porte, aspersion brève, fermeture","Par un jet droit continu à travers la porte maintenue grande ouverte","Par une aspersion longue après avoir calé la porte en position ouverte","Par un arrosage continu après avoir ouvert toutes les fenêtres du local"],"r":0,"e":"L\u0027antiventilation prive le feu de son comburant en limitant les ouvertures entre le volume en feu et l\u0027extérieur. Menée depuis l\u0027extérieur du local, l\u0027attaque applique l\u0027eau par séquences « ouverture de porte / aspersion brève / fermeture », l\u0027aspersion inertant les gaz. Ouvrir largement ou caler la porte apporterait au contraire de l\u0027air au feu.","ref":"§ 4.6 Attaque menée en antiventilation — p. 75","p":"2ème cas : l\u0027attaque est menée depuis l\u0027extérieur du local en feu. L\u0027eau est appliquée par séquences « ouverture de porte/aspersion brève/fermeture ».","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Chef d\u0027agrès","q":"Qu\u0027appelle-t-on l\u0027attaque de transition, également appelée attaque d\u0027atténuation ?","c":["Le passage du jet droit au jet diffusé lorsque le binôme atteint le foyer","Le relais de deux binômes d\u0027attaque lors d\u0027un changement de bouteille d\u0027ARI","Le passage de l\u0027attaque au déblai, une fois les dernières flammes abattues","Une attaque brève de l\u0027extérieur, juste avant une attaque par l\u0027intérieur"],"r":3,"e":"L\u0027attaque de transition est une attaque limitée dans le temps, de l\u0027ordre de 10 à 15 secondes pour des volumes courants, menée de l\u0027extérieur avec un jet concentré dirigé vers le plafond du volume en feu. Elle réduit fortement la puissance du feu pour mener immédiatement derrière une attaque depuis l\u0027intérieur : on passe du mode défensif au mode offensif.","ref":"§ 4.7 Attaque de transition — p. 77","p":"menée de l\u0027extérieur, destinée à réduire grandement la puissance du feu pour mener immédiatement derrière une attaque depuis l\u0027intérieur (il s\u0027agit donc d\u0027un passage du mode défensif au mode offensif).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Chef d\u0027agrès","q":"Vous ne pouvez pas maîtriser la ventilation d\u0027un feu développé en phase de croissance. Que rappelle le guide sur une attaque offensive dans ces conditions ?","c":["Elle reste exceptionnelle et un excès de débit ne compense pas ce défaut","Elle devient sans risque dès que le débit de la lance est porté au maximum","Elle est la règle, la maîtrise de la ventilation restant secondaire","Elle est interdite en toutes circonstances, même sans alternative"],"r":0,"e":"Ces attaques comportent des risques certains. Elles restent exceptionnelles et ne se justifient que par l\u0027absence d\u0027alternative plus sûre, une balance bénéfice/risque favorable et un potentiel combustible limité. L\u0027excès de débit ne peut compenser le défaut de maîtrise de la ventilation, et l\u0027équipe peut devoir se replier pour modifier le dispositif.","ref":"§ 4.8 Impossibilité d\u0027agir sur la ventilation — p. 77","p":"L\u0027absence de maîtrise de la ventilation impose de fait des débits disponibles importants mais l\u0027excès de débit ne peut compenser le défaut de maîtrise de la ventilation car leur usage peut dans certaines circonstances mettre en danger les intervenants.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Chef d\u0027équipe","q":"Le binôme engagé entame un repli défensif. Comment doit-il utiliser sa lance pendant cette manœuvre ?","c":["Vers le sol devant lui, à faible débit, pour limiter la vapeur","Lance fermée, pour reculer plus vite vers la sortie du local","Vers la masse gazeuse au plafond, débit important, longues impulsions","Vers le foyer en jet droit, pour l\u0027éteindre avant de quitter le local"],"r":2,"e":"Le repli défensif se fait sous la protection du moyen hydraulique, avec un petit écartement entre les membres du binôme : le jet est dirigé vers la masse gazeuse au plafond avec un débit important et des impulsions assez longues pour absorber un maximum d\u0027énergie. Dès que possible, on referme la porte entre l\u0027équipe et le feu.","ref":"§ 4.9 Repli défensif — p. 78","p":"Les angles de diffusion du jet doivent être adaptés à la situation et dirigés naturellement vers la masse gazeuse au plafond et avec un débit important et des impulsions assez longues pour absorber un maximum d\u0027énergie.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Équipier","q":"Quel angle d\u0027ouverture le guide indique-t-il pour le jet diffusé d\u0027attaque ?","c":["De 10 à 20°","De 30 à 60°","De 90 à 120°","L\u0027angle maximum"],"r":1,"e":"L\u0027angle d\u0027ouverture du jet doit être adapté à l\u0027objectif et au volume à traiter : jet droit, jet diffusé d\u0027attaque de 30 à 60°, jet diffusé de protection à l\u0027angle maximum.","ref":"§ 4.10 Choix du moyen hydraulique — p. 78","p":"L\u0027angle d\u0027ouverture du jet doit être adapté à l\u0027objectif à atteindre et au volume à traiter : jet droit, jet diffusé d\u0027attaque (30 à 60°), jet diffusé de protection (angle maximum).","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Actions contre le feu","niv":"Équipier","q":"Quel est le moyen usuel de lutte contre les feux de structure selon le guide, et sa plage de débit habituelle ?","c":["La LDV, de 125 à 500 L/min en général","La LDV, de 500 à 1 000 L/min en général","La lance queue de paon, de 250 à 500 L/min","La petite lance, de 60 à 125 L/min en général"],"r":0,"e":"Pour sa polyvalence et ses performances, le moyen usuel est la lance à débit et jet réglables (LDJR), appelée couramment lance à débit variable (LDV), dont le débit varie généralement de 125 à 500 L/min. D\u0027autres matériels peuvent être retenus si leurs performances ont été évaluées et validées dans les conditions définies par le ministère.","ref":"§ 4.10 Choix du moyen hydraulique — p. 78","p":"le moyen usuel de lutte contre les feux de structure est la lance à débit et jet réglables : LDJR (appelée plus couramment lance à débit variable : LDV) dont le débit varie généralement de 125 à 500 L/Min.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, premier COS, sur un feu d\u0027appartement. Quand la question de la protection des biens doit-elle se poser ?","c":["Une fois le feu circonscrit et les lances d\u0027attaque en place","Dès le début de l\u0027intervention, parfois même avant l\u0027extinction","Pendant le déblai, lorsque l\u0027eau a cessé de ruisseler","Après l\u0027extinction, au moment de restituer les lieux aux occupants"],"r":1,"e":"Quand l\u0027eau ruisselle sur les biens à protéger, il est déjà trop tard : la protection peut être utile avant même le début de l\u0027extinction et la question se pose au COS dès le début de l\u0027intervention. Elle concerne les effets directs du feu et des fumées comme les dégâts dus à la lutte, tels que les eaux d\u0027extinction.","ref":"§ 6.3 La protection : protéger quand ? — p. 81","p":"Quand l\u0027eau ruisselle sur les biens à protéger, il est déjà trop tard. La protection peut être utile parfois même avant le début de l\u0027extinction (œuvres d\u0027art). C\u0027est dès le début de l\u0027intervention que la question se pose au COS.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Équipier","q":"Quel est l\u0027objectif des déblais à l\u0027issue de la lutte contre un feu de structure ?","c":["Évacuer les eaux d\u0027extinction pour éviter l\u0027affaissement des planchers","Nettoyer les locaux et remettre le mobilier en place pour les occupants","Inventorier les biens détruits pour l\u0027assurance et le rapport","Faciliter l\u0027extinction et éliminer les risques de reprise du feu"],"r":3,"e":"Les déblais facilitent l\u0027extinction et éliminent les risques de reprise du feu. C\u0027est une phase accidentogène : toxiques gazeux, fragilisation des structures, risque électrique, alors que la vigilance des intervenants diminue. Des déblais trop poussés peuvent aussi rendre difficile la recherche des causes et circonstances de l\u0027incendie.","ref":"§ 7 Les déblais — p. 81","p":"Les déblais permettent de faciliter l\u0027extinction et d\u0027éliminer les risques de reprise du feu.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Équipier","q":"Pourquoi le guide qualifie-t-il le déblai de phase accidentogène ?","c":["Le feu y reprend systématiquement dès que les lances sont fermées","Le port de l\u0027ARI y est interdit pour ne pas gêner les investigateurs","Les risques persistent alors que la vigilance des intervenants diminue","Les intervenants y travaillent toujours seuls, sans binôme ni chef d\u0027équipe"],"r":2,"e":"Selon le guide, au déblai les risques du site persistent (ambiance toxique, effondrement de structure, risque électrique, blessures) alors que la vigilance des intervenants diminue : fatigue, désengagement d\u0027une partie des moyens, personnels parfois engagés depuis les phases initiales. Le dispositif de protection des intervenants doit être évalué et maintenu durant cette phase.","ref":"§ III-7 Les déblais — p. 81","p":"Le déblai est une phase accidentogène, les risques présents sur le site d\u0027intervention persistent (ambiance toxique, effondrement de structure, risque électrique, risque de blessures…) alors que le niveau de vigilance des intervenants diminue","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027équipe","q":"Pendant le déblai, des mesures de toxiques gazeux sont réalisées avec des appareils, éventuellement posés en balises. À quoi peuvent servir leurs indications selon le guide ?","c":["À adapter la protection respiratoire pour réduire la contrainte physique","À déterminer l\u0027origine du feu pour l\u0027enquête des investigateurs RCCI","À calculer le débit des lances nécessaire pour noyer les points chauds","À évaluer la stabilité des planchers avant d\u0027y engager le binôme"],"r":0,"e":"Le guide prévoit des mesures ponctuelles ou continues des toxiques et polluants gazeux, avec des appareils individuels ou collectifs éventuellement posés en balises. Sur ces indications, la protection respiratoire peut être adaptée afin de diminuer la contrainte physique, le dispositif de protection des intervenants restant évalué et maintenu durant cette phase.","ref":"§ III-7 Les déblais — p. 81","p":"Des mesures de toxiques et polluants gazeux peuvent être réalisées ponctuellement ou en continu avec des appareils individuels ou collectifs éventuellement posés en balises. Sur ces indications la protection respiratoire pourra être adaptée afin de diminuer la contrainte physique.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, COS d\u0027un feu d\u0027habitation dont le foyer principal est éteint. Pourquoi est-il souhaitable d\u0027échanger avec l\u0027OPJ, et un officier RCCI s\u0027il en existe, avant d\u0027entreprendre les déblais ?","c":["Les déblais ne peuvent légalement commencer qu\u0027après l\u0027accord écrit de l\u0027assureur","L\u0027OPJ doit désigner lui-même les sapeurs-pompiers chargés des déblais","L\u0027OPJ fixe la durée de la surveillance avant la levée du dispositif de secours","Des déblais trop poussés gênent l\u0027expertise judiciaire et celle des causes"],"r":3,"e":"Selon le guide, des déblais trop poussés rendent souvent très difficile l\u0027expertise judiciaire, mais aussi celle des causes et circonstances de l\u0027incendie. C\u0027est pourquoi il est souhaitable de les entreprendre après un échange entre le COS, un officier formé ou sensibilisé à la RCCI s\u0027il en existe, l\u0027OPJ, voire l\u0027autorité judiciaire, le propriétaire ou l\u0027assureur.","ref":"§ III-7 Les déblais — p. 81","p":"Des déblais trop poussés ont souvent comme conséquence de rendre très difficile l\u0027expertise judiciaire mais aussi celle des causes et circonstances de l\u0027incendie.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027agrès","q":"En situation courante, pendant combien de temps l\u0027absence de point chaud doit-elle avoir été vérifiée pour permettre au COS de considérer le feu comme totalement éteint ?","c":["1 heure","2 heures","4 heures","12 heures"],"r":1,"e":"La surveillance doit être effectuée en continu sur le site, avec les moyens permettant de répondre à toute évolution défavorable. Selon le guide, en situation courante, l\u0027absence de point chaud vérifiée pendant une période de deux heures peut permettre au COS de considérer le feu comme totalement éteint.","ref":"§ III-8 La surveillance — p. 81","p":"En situation courante, l\u0027absence de point chaud vérifiée pendant une période de deux heures peut permettre au COS de considérer le feu comme totalement éteint.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès, COS d\u0027un feu d\u0027appartement : le logement est inutilisable (suies, absence d\u0027énergie). Que devez-vous faire au sujet du relogement des occupants ?","c":["Organiser vous-même l\u0027hébergement des occupants avec l\u0027équipage","Attendre la fin de la surveillance pour aborder la question","Laisser les occupants regagner leur logement après ventilation","En informer au plus tôt le DOS, responsable du relogement"],"r":3,"e":"Le relogement relève de la responsabilité du DOS mais, souvent occulté dans les premiers temps de l\u0027opération, il peut devenir un point sensible au détriment des autres actions. Dès que des logements sont identifiés comme inutilisables (fumées, suies, stabilité de l\u0027édifice, absence d\u0027énergies), le COS doit en informer le DOS au plus tôt.","ref":"§ III-9 Le relogement — p. 82","p":"Dès lors que le ou les logements impactés sont identifiés comme inutilisables (effets directs du feu : fumées, suies, … ; ou indirects : stabilité de l\u0027édifice, absence d\u0027énergies, …), le COS devra en informer au plus tôt le DOS.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027équipe","q":"Selon le guide, avant de quitter les lieux d\u0027un feu de structure, que doit-on rechercher systématiquement, et où ?","c":["Les gaz de pyrolyse et de combustion, dans toute la structure","Les seuls points chauds visibles, dans le local d\u0027origine du feu","Les fuites d\u0027eau d\u0027extinction, dans les niveaux situés en dessous","Les traces d\u0027effraction, aux accès et aux ouvrants du logement"],"r":0,"e":"Avant de quitter les lieux, le guide impose de rechercher systématiquement, dans l\u0027ensemble de la structure, les gaz de pyrolyse (potentiellement inflammables) et les gaz de combustion (potentiellement toxiques). Se limiter aux points chauds visibles du local d\u0027origine ne répond pas à cette exigence.","ref":"§ III-9 Le relogement — p. 82","p":"Les gaz de pyrolyse (potentiellement inflammables) et gaz de combustion (potentiellement toxiques) doit doivent être systématiquement recherchés dans l\u0027ensemble de la structure avant de quitter les lieux de l\u0027intervention.","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Équipier","q":"Avant le départ des secours, une fumée blanche jaunâtre s\u0027échappe d\u0027un local alors qu\u0027aucune action d\u0027extinction n\u0027est en cours. Comment l\u0027interpréter ?","c":["Comme de la vapeur d\u0027eau résiduelle, sans danger","Comme de la poussière de plâtre soulevée par le déblai","Comme la condensation de fumées froides, inoffensive","Comme le signe d\u0027une pyrolyse toujours en cours"],"r":3,"e":"Toute présence visuelle de fumée doit être considérée comme dangereuse. Une fumée blanche que les actions d\u0027extinction n\u0027expliquent pas doit être considérée comme le résultat d\u0027une pyrolyse, et une teinte jaunâtre en est un indicateur plutôt fiable. Même une fumée blanche explicable par l\u0027extinction n\u0027est pas pour autant considérée comme sans risques.","ref":"§ III-9 Le relogement — p. 82","p":"Les fumées blanches ne pouvant être expliquées par des actions d\u0027extinction (vapeur d\u0027eau) doivent être considérées comme étant le résultat d\u0027une pyrolyse. Une fumée jaunâtre est un indicateur plutôt fiable de la présence de celle-ci","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Équipier","q":"Après un feu, le degré de souillure de vos EPI est jugé superficiel. Quel nettoyage le guide préconise-t-il sur les lieux ?","c":["Un lavage à grande eau en jet droit, à pleine pression, avec la lance d\u0027attaque de l\u0027engin","Un brossage énergique à l\u0027eau savonneuse avec une brosse métallique, puis un séchage à l\u0027air","Aucun nettoyage sur place : les EPI sont systématiquement emballés pour le retour au centre","Un brossage léger à sec, brosse à poils doux, puis si besoin un rinçage léger en jet diffusé"],"r":3,"e":"Pour une souillure superficielle, le guide prévoit un brossage léger à sec avec une brosse à poils doux, complété si besoin par un rinçage léger en jet diffusé à débit minimum avec la lance du dévidoir tournant. L\u0027eau savonneuse est réservée à une souillure importante avec dépôts gras, et l\u0027emballage aux cas où le nettoyage sur place est impossible ou non retenu.","ref":"§ III-10 Réhabilitation et reconditionnement — p. 82","p":"un nettoyage par brossage léger à sec est à réaliser avec une brosse à poils doux et complété si besoin par un rinçage léger en jet diffusé à débit minimum avec la lance du dévidoir tournant","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Équipier","q":"Le binôme engagé doit préserver ce qui peut faciliter la recherche des causes de l\u0027incendie. Dans quelle limite ?","c":["Seulement lorsqu\u0027un investigateur RCCI est déjà présent sur les lieux","Seulement après la fin complète de l\u0027extinction et de tout le déblai","Tant que cela ne nuit pas à la qualité de l\u0027opération de secours","Seulement sur ordre de l\u0027OPJ transmis par le COS au chef d\u0027agrès"],"r":2,"e":"Selon le guide, la préservation des traces et indices est d\u0027autant plus efficace qu\u0027elle est pratiquée tôt par le COS et les équipes engagées, qui veillent à préserver tout ce qui peut faciliter l\u0027analyse post-opération, dans la mesure où cela ne nuit pas à la qualité de l\u0027opération de secours. Les équipes de secours doivent y être sensibilisées ; les investigateurs RCCI de certains SIS interviennent en complément.","ref":"§ III-11 La préservation des traces et indices — p. 83","p":"Elle est d\u0027autant plus efficace qu\u0027elle est pratiquée de façon précoce par le COS et les équipes engagées qui doivent veiller à préserver, dans la mesure où cela ne nuit pas à la qualité de l\u0027opération de secours","s":"gdo-inc"},
{"t":"gdo-inc","ch":"Protection et fin d\u0027intervention","niv":"Chef d\u0027équipe","q":"Le déblai, indispensable à l\u0027extinction complète, va faire disparaître des éléments utiles à la recherche des causes. Que doivent faire les équipes ?","c":["Renoncer au déblai et placer le site sous simple surveillance","Les recueillir en amont du déblai, dans la mesure du possible","Poursuivre le déblai sans s\u0027en préoccuper, l\u0027extinction primant","Laisser le feu couver jusqu\u0027à l\u0027arrivée de l\u0027OPJ sur les lieux"],"r":1,"e":"Selon le guide, si les circonstances ne permettent pas de préserver ces éléments, notamment parce que le déblai nécessaire à la parfaite extinction du feu aboutira à leur disparition ou à leur dégradation, les équipes doivent veiller, dans la mesure du possible, à les recueillir en amont.","ref":"§ III-11 La préservation des traces et indices — p. 83","p":"notamment parce que le déblai, nécessaire à la parfaite extinction du feu, aboutira à leur disparition ou leur dégradation, les équipes doivent veiller, dans le mesure du possible, à les recueillir en amont.","s":"gdo-inc"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Chef d\u0027agrès","q":"Pourquoi le débit disponible sur un hydrant peut-il varier selon l\u0027heure de la journée ou la saison ?","c":["Parce que la pression du réseau est volontairement abaissée la nuit","Parce que les communes ferment partiellement les hydrants en été","Parce que la chaleur dilate les canalisations et freine l\u0027écoulement","Parce que la consommation d\u0027eau potable sur le même réseau varie"],"r":3,"e":"Les hydrants sont généralement alimentés par le réseau d\u0027eau de ville, qui alimente aussi les bâtiments en eau potable. La consommation varie selon l\u0027heure (douche le matin et le soir) et la saison (arrosage l\u0027été), ce qui fait varier la disponibilité du point d\u0027eau. Les travaux en cours peuvent aussi rendre le réseau indisponible ou le dégrader.","ref":"§ 5 Pérennité des points d\u0027eau dans le temps — p. 19","p":"les hydrants sont generalement alimentes par le reseau d\u0027eau de ville, qui sert aussi a alimenter en eau potable les differents batiments. En fonction de l\u0027heure et/ou de la saison, la consommation humaine varie","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Équipier","q":"Quelles pressions minimale et maximale un hydrant normalisé doit-il pouvoir fournir ?","c":["3 bars minimum et 10 bars maximum","0,5 bar minimum et 8 bars maximum","1 bar minimum et 16 bars maximum","2 bars minimum et 20 bars maximum"],"r":2,"e":"Quel que soit son modèle, un hydrant normalisé doit fournir une pression minimale de 1 bar et maximale de 16 bars. Il doit aussi être raccordé à un réseau sous pression capable de fournir le débit réglementaire pendant au moins 2 heures et être incongelable.","ref":"§ 1 Principes généraux et définition (Les points d\u0027eau incendie) — p. 21","p":"fournir une pression minimale de 1 bar et maximale de 16 bars","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Chef d\u0027équipe","q":"Chef du binôme d\u0027alimentation, vous devez utiliser un point d\u0027eau incendie haute pression. Comment ouvrez-vous l\u0027appareil ?","c":["Progressivement, dans le sens inverse des aiguilles d\u0027une montre","En grand d\u0027un seul coup, dans le sens inverse des aiguilles d\u0027une montre","Progressivement, dans le sens des aiguilles d\u0027une montre","En grand d\u0027un seul coup, dans le sens des aiguilles d\u0027une montre"],"r":0,"e":"Un PEI peut être considéré comme haute pression lorsque sa pression dynamique à 60 m³/h est supérieure à 6 bars. Il faut alors s\u0027assurer du raccordement correct des tuyaux, ouvrir l\u0027appareil progressivement dans le sens inverse des aiguilles d\u0027une montre et limiter la surpression dans la pompe de l\u0027engin.","ref":"§ 1 Principes généraux et définition (Les points d\u0027eau incendie) — p. 21","p":"d\u0027ouvrir progressivement l\u0027appareil dans le sens inverse des aiguilles d\u0027une montre","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Équipier","q":"Quel débit fournit un poteau d\u0027incendie de 100 mm ?","c":["30 m³/h, soit 500 L/min","60 m³/h, soit 1 000 L/min","120 m³/h, soit 2 000 L/min","90 m³/h, soit 1 500 L/min"],"r":1,"e":"Le PI de 100 délivre 60 m³/h, soit 17 L/s ou 1 000 L/min. À titre de comparaison, le PI de 80 délivre 30 m³/h et le PI de 150, 120 m³/h.","ref":"§ 3 Poteaux d\u0027incendie — p. 23","p":"Les PI de 100 : debit de 60 m3/h ou 17 l/s ou 1 000 l/min","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Équipier","q":"Vous repérez un poteau d\u0027incendie peint en jaune sur au moins la moitié de sa surface. Qu\u0027indique cette couleur ?","c":["Qu\u0027il est hors service et ne doit pas être utilisé","Qu\u0027il est réservé à l\u0027aspiration depuis une réserve d\u0027eau","Que son débit nominal est inférieur à 30 m³/h","Qu\u0027il est branché sur un réseau surpressé et/ou additivé"],"r":3,"e":"Les poteaux branchés sur des réseaux surpressés (surpression permanente ou au moment de l\u0027utilisation) et/ou additivés sont jaunes sur au moins 50 % de leur surface. Le jaune signale un appareil dont la mise en œuvre nécessite des précautions particulières. Le poteau d\u0027aspiration, lui, est de couleur bleue.","ref":"§ 3.2 Poteaux sur canalisation d\u0027eau surpressée — p. 26","p":"Les PI branches sur des reseaux d\u0027eau sur-presses (surpression permanente ou surpression au moment de l\u0027utilisation) et/ou additives sont de couleur jaune sur au moins 50 % de leur surface.","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Équipier","q":"Quel outil utilise-t-on pour ouvrir une bouche d\u0027incendie ?","c":["La clé de poteau d\u0027incendie","La clé tricoise","La clé de barrage","Le col de cygne"],"r":2,"e":"Une bouche d\u0027incendie (colonne montante de 100 mm minimum, débit de 1 000 L/min) s\u0027ouvre avec la clé de barrage, en faisant treize tours. Le col de cygne fait partie du matériel d\u0027alimentation de l\u0027engin sur une bouche, mais c\u0027est la clé de barrage qui sert à l\u0027ouvrir.","ref":"§ 4 Les bouches d\u0027incendie (BI) — p. 28","p":"Pour l\u0027ouvrir, on utilise la clef de barrage et il faut faire treize tours.","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Équipier","q":"Quel débit peut-on obtenir en jumelant deux bouches d\u0027incendie de 100 mm ?","c":["1 000 L/min, soit 60 m³/h","1 500 L/min, soit 90 m³/h","2 000 L/min, soit 120 m³/h","3 000 L/min, soit 180 m³/h"],"r":2,"e":"Une bouche d\u0027incendie, alimentée par une colonne montante d\u0027au moins 100 mm, débite 1 000 L/min ; il n\u0027existe pas de bouche de 80 mm. Deux bouches de 100 peuvent être jumelées et offrir ainsi 2 000 L/min, soit 120 m³/h.","ref":"§ 4 Les bouches d\u0027incendie (BI) — p. 28","p":"Deux bouches de 100 mm peuvent en revanche etre jumelees et offrir ainsi un debit de 2 000 litres par minute (120 m3/h).","s":"gto-ext"},
{"t":"gto-ext","ch":"Ressources en eau","niv":"Chef d\u0027agrès","q":"Une piscine privée se trouve à proximité d\u0027une maison en feu. Que retient le guide sur cette ressource ?","c":["C\u0027est un PEI de plein droit, à utiliser en priorité sur les hydrants","Ce n\u0027est pas un PEI, mais elle peut servir si les conditions le permettent","Son utilisation est interdite aux sapeurs-pompiers, faute d\u0027être normalisée","Elle devient un PEI dès lors que son volume utile dépasse 30 m³"],"r":1,"e":"Les piscines privées ne peuvent garantir ni la pérennité de la ressource, ni celle de leur situation juridique, ni l\u0027accès des engins : elles ne sont pas considérées comme des PEI. Elles peuvent toutefois être utilisées, le cas échéant, si les conditions le permettent.","ref":"§ 4.5 Les piscines privées — p. 41","p":"Elles peuvent etre utilisees, le cas echeant, si les conditions le permettent, mais ne sont generalement pas identifiees sur les parcellaires. […] Elles ne sont pas considerees comme des points d\u0027eau d\u0027incendie.","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Équipier","q":"Comment le guide définit-il le débit ?","c":["La quantité d\u0027eau qui passe dans une section de tuyau par unité de temps","La force exercée par l\u0027eau par unité de surface, exprimée en bar","La perte de pression due au frottement de l\u0027eau contre les parois","La pression de l\u0027eau dans les tuyaux lorsque toutes les lances sont fermées"],"r":0,"e":"Le débit (symbole Q) est la quantité d\u0027eau qui passe dans une section de tuyau par unité de temps ; on l\u0027exprime en L/min pour les lances et en m³/h pour les ressources en eau. La force par unité de surface est la pression (en bar) ; la perte due au frottement correspond aux pertes de charge.","ref":"§ 1.1 Débit — p. 47","p":"Le debit correspond a la quantite d\u0027eau qui passe dans une section de tuyau, par unite de temps.","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Équipier","q":"Dans un même établissement, le débit est doublé. Comment évoluent les pertes de charge ?","c":["Elles sont multipliées par 2","Elles restent identiques","Elles sont multipliées par 4","Elles sont divisées par 2"],"r":2,"e":"Les pertes de charge sont directement proportionnelles au carré du débit : si on double le débit, on multiplie par 4 les pertes de charge. Elles sont en revanche indépendantes de la pression : seul le débit compte, car c\u0027est la quantité d\u0027eau qui frotte aux parois.","ref":"§ 1.3 Les pertes de charge — p. 48","p":"Directement proportionnelles au carre du debit (ex. si on double le debit, on multiplie par 4 les pertes de charge) ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Chef d\u0027équipe","q":"À débit identique, quel établissement présente le moins de pertes de charge ?","c":["Un tuyau long de petit diamètre","Un tuyau court de grand diamètre","Un tuyau long de grand diamètre","Un tuyau court de petit diamètre"],"r":1,"e":"Les pertes de charge sont directement proportionnelles à la longueur de l\u0027établissement et inversement proportionnelles au diamètre du tuyau (moins de frottement). C\u0027est pourquoi les tuyaux de gros diamètre sont utilisés pour les débits importants et/ou les établissements longs.","ref":"§ 1.3 Les pertes de charge — p. 48","p":"Directement proportionnelles a la longueur de l\u0027etablissement ; [...] Inversement proportionnelles au diametre du tuyau (moins de frottement) ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès : la lance sera établie 20 m plus haut que l\u0027engin-pompe. Quelle perte de pression due au dénivelé faut-il prendre en compte ?","c":["Environ 0,2 bar","Environ 4 bars","Environ 20 bars","Environ 2 bars"],"r":3,"e":"Les pertes de charge varient d\u00271 bar par 10 m de dénivelée : en pente positive, on perd 1 bar par 10 m de différence de hauteur, soit environ 2 bars pour 20 m ; en pente négative, on gagne au contraire 1 bar par 10 m.","ref":"§ 1.3 Les pertes de charge — p. 48","p":"Varient d\u00271 bar/10 m en fonction de la denivelee (si pente positive, perte de 1 bar par 10 m de difference de hauteur, si pente negative, gain de pression de 1 bar par 10 m).","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Équipier","q":"Qu\u0027est-ce qu\u0027une ligne d\u0027attaque ?","c":["L\u0027établissement reliant le point d\u0027eau incendie à l\u0027engin-pompe à alimenter","La ligne guide déroulée par le binôme pour son chemin de repli","La ligne de 70 reliant l\u0027engin-pompe à une division d\u0027alimentation","L\u0027établissement reliant une prise d\u0027eau (engin, division…) à la lance"],"r":3,"e":"Le guide distingue les points d\u0027eau incendie, qui alimentent l\u0027engin-pompe, des prises d\u0027eau (engin-pompe, division, colonne sèche ou humide, poteau relais…) qui alimentent les établissements d\u0027attaque. La ligne d\u0027attaque va de la prise d\u0027eau à la lance ; elle est établie par le binôme d\u0027attaque (BAT).","ref":"§ 3.1 Du point d\u0027eau vers le point d\u0027attaque — p. 49","p":"Des etablissements d\u0027attaque utilises par les equipes d\u0027attaque a partir de la prise d\u0027eau.","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Équipier","q":"En règle générale, de quoi se compose une ligne d\u0027attaque ?","c":["D\u0027une lance et de 2 à 3 tuyaux souples de diamètre 45","D\u0027une lance et de 2 à 3 tuyaux souples de diamètre 70","D\u0027une lance et de 5 à 6 tuyaux souples de diamètre 45","D\u0027une lance et d\u0027un tuyau semi-rigide de diamètre 110"],"r":0,"e":"La ligne d\u0027attaque est en règle générale composée d\u0027une lance et de 2 à 3 tuyaux souples de diamètre 45, alimentée par une prise d\u0027eau. Elle peut être réalisée avec des tuyaux en couronne, en écheveaux (épaulés ou pré-connectés en sac d\u0027attaque), ou pré-connectés en coffre ou sur un dévidoir.","ref":"§ 3.3 La ligne d\u0027attaque — p. 50","p":"La ligne d\u0027attaque est en regle generale un etablissement composee d\u0027une lance et de 2 a 3 tuyaux souples de diametre 45, alimentee par une prise d\u0027eau.","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Feu d\u0027appartement en étage : où la ligne d\u0027attaque doit-elle être établie, prête à l\u0027emploi, avant de pénétrer dans la zone d\u0027exclusion ?","c":["Sur le palier du niveau sinistré, devant la porte","Au niveau N+1, au-dessus du niveau sinistré","Au niveau N-1, sous le niveau sinistré","Dans le logement, une fois le foyer localisé"],"r":2,"e":"Le moyen hydraulique devant être prêt à l\u0027utilisation en zone d\u0027exclusion, il est établi avant d\u0027y pénétrer : au niveau N-1 en superstructure, à l\u0027extérieur du volume pour un feu de plain-pied, hors de la zone de propagation potentielle en infrastructure. Les établissements se font en sécurité vis-à-vis du feu, notamment parce que les personnels ne peuvent pas utiliser l\u0027eau pour se protéger.","ref":"§ 4.1 Sécurité vis-à-vis du feu — p. 52","p":"Le moyen hydraulique devant etre pret a l\u0027utilisation en zone d\u0027exclusion, ils doivent etre etablis avant d\u0027y penetrer : a l\u0027exterieur d\u0027un volume de plain-pied ; au niveau N-1 en superstructure ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Hydraulique et établissements","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès. Lors des établissements, quels emplacements faut-il éviter du fait du feu et de ses effets ?","c":["Le long des bords de voie et sur les paliers d\u0027escalier","Devant les ouvrants et au droit des façades touchées","Dans les cages d\u0027escalier et dans le jour des escaliers","Sur les échelles à main et les moyens élévateurs aériens"],"r":1,"e":"Les établissements se font en sécurité vis-à-vis du feu, car les personnels ne peuvent pas utiliser l\u0027eau pour se protéger : on évite d\u0027établir devant les ouvrants (angle de diffusion d\u0027un phénomène à cinétique rapide d\u0027environ 30°), au droit des façades et sous les toitures touchées par l\u0027incendie. Sur la voie publique, on suit au contraire le plus possible les bords de voie.","ref":"§ 4.1 Sécurité vis-à-vis du feu — p. 52","p":"Il faut ainsi eviter d\u0027etablir : devant les ouvrants (angle de diffusion d\u0027un potentiel phenomene a cinetique rapide d\u0027environ 30°) ; au droit des façades et sous les toitures touchees par l\u0027incendie.","s":"gto-ext"},
{"t":"gto-ext","ch":"Missions et ordres","niv":"Équipier","q":"Quelle est la vocation première du binôme d\u0027alimentation (BAL) ?","c":["Alimenter les prises d\u0027eau et/ou l\u0027engin-pompe","Établir la ou les lignes d\u0027attaque jusqu\u0027au foyer","Réaliser les reconnaissances intérieures du bâtiment","Assurer le déblai et la surveillance après l\u0027extinction"],"r":0,"e":"Les BAL ont pour vocation première d\u0027alimenter les prises d\u0027eau et/ou l\u0027engin-pompe, alors que les binômes d\u0027attaque (BAT) établissent la ou les lignes d\u0027attaque. Après sa mission d\u0027alimentation, un BAL peut recevoir une nouvelle mission BAT : établir une nouvelle lance ou devenir binôme de sécurité.","ref":"§ 5.1 Les missions des binômes et du conducteur — p. 53","p":"Les binomes d\u0027alimentation (BAL) ont pour vocation premiere d\u0027alimenter les prises d\u0027eau et/ou l\u0027engin pompe.","s":"gto-ext"},
{"t":"gto-ext","ch":"Missions et ordres","niv":"Chef d\u0027agrès","q":"Lors des établissements, laquelle de ces missions revient au conducteur de l\u0027engin-pompe ?","c":["Désigner le point d\u0027attaque et le cheminement du binôme","Relayer le porte-lance à la lance en cas de fatigue","Garantir l\u0027alimentation en eau de l\u0027établissement d\u0027attaque","Accompagner le chef d\u0027agrès lors de la reconnaissance du local"],"r":2,"e":"Le conducteur a pour mission d\u0027alimenter son engin (seul pour une prise d\u0027eau située à moins de 20 mètres, avec l\u0027aide du BAL pour une alimentation au dévidoir ou en aspiration), de garantir l\u0027alimentation en eau dans l\u0027établissement d\u0027attaque et de prévenir le chef d\u0027agrès de tout dysfonctionnement.","ref":"§ 5.1 Les missions des binômes et du conducteur — p. 53","p":"de garantir l\u0027alimentation en eau dans l\u0027etablissement d\u0027attaque ; de prevenir le chef d\u0027agres de tout disfonctionnement.","s":"gto-ext"},
{"t":"gto-ext","ch":"Missions et ordres","niv":"Chef d\u0027agrès","q":"Sur les lieux, vous voulez que vos binômes vous accompagnent avec le matériel a priori nécessaire avant de leur donner l\u0027ordre complet. Comment se termine votre ordre ?","c":["« … attendez mes ordres. »","« … établissez ! »","« … en attente. »","« … en reconnaissance. »"],"r":3,"e":"C\u0027est l\u0027ordre préparatoire « … en reconnaissance » : il donne les indications nécessaires pour que les binômes emportent le matériel a priori utile, alors que le point d\u0027attaque précis n\u0027est pas forcément encore connu. L\u0027ordre d\u0027exécution, lui, se termine par « … établissez » quand toutes les indications peuvent être données.","ref":"§ 6.1 Ordres préparatoires — p. 53","p":"si le chef d\u0027agres souhaite que les binomes se deplacent avec lui pendant la reconnaissance avant de leur signifier l\u0027ordre complet d\u0027execution, il debutera par un ordre preparatoire « ...en reconnaissance. »","s":"gto-ext"},
{"t":"gto-ext","ch":"Missions et ordres","niv":"Chef d\u0027agrès","q":"Que doit en principe comporter l\u0027ordre d\u0027établissement donné par le chef d\u0027agrès à un binôme ?","c":["Le nom du binôme, l\u0027heure d\u0027engagement, l\u0027autonomie ARI et la fréquence radio","Le moyen hydraulique, l\u0027emplacement, le cheminement, la mission et la sécurité","Le volume de la citerne, la pression de refoulement et le diamètre des tuyaux","Le type de lance seulement, le binôme choisissant point d\u0027attaque et cheminement"],"r":1,"e":"L\u0027ordre d\u0027établissement est précis mais concis : nature du moyen hydraulique (« ce que je veux »), emplacement (« à quel endroit »), cheminement (« par où »), mission (« pour quelle mission ») et conditions de sécurité. Il se termine par « … établissez ! », les éventuelles restrictions (établissement à sec, pénétration sur ordre) étant formulées avant.","ref":"§ 6.2 Ordre d\u0027exécution — p. 54","p":"Un ordre pour un etablissement doit en principe comporter La nature du moyen hydraulique : L\u0027emplacement : le cheminement, eventuellement le sens d\u0027etablissement : La mission : Les conditions de securite","s":"gto-ext"},
{"t":"gto-ext","ch":"Missions et ordres","niv":"Chef d\u0027agrès","q":"Votre ordre d\u0027exécution comporte une restriction à l\u0027engagement (établissement à sec, pénétration sur ordre). Où devez-vous la formuler ?","c":["Après le mot « établissez »","Avant le mot « établissez »","Dans un second ordre, une fois la lance en eau","Par radio, une fois le binôme engagé"],"r":1,"e":"L\u0027ordre d\u0027exécution se termine par « … établissez ». Les éventuelles restrictions à l\u0027engagement, comme une indication d\u0027établissement à sec ou une pénétration dans le volume sur ordre après attaque de transition, doivent être formulées avant ce mot.","ref":"§ 6.2 Ordre d\u0027exécution — p. 54","p":"Attention si des restrictions a l\u0027engagement doivent etre faites, elles doivent etre formulees avant l\u0027ordre « etablissez » Il peut en etre ainsi d\u0027une indication d\u0027etablissement a sec ou d\u0027un engagement sur ordre","s":"gto-ext"},
{"t":"gto-ext","ch":"Lance du dévidoir tournant","niv":"Équipier","q":"Quel est le diamètre des tuyaux semi-rigides de la lance du dévidoir tournant (LDT) ?","c":["25 ou 33 mm","40 ou 65 mm","45 ou 70 mm","70 ou 110 mm"],"r":0,"e":"La LDT est un cas particulier de la ligne d\u0027attaque : ses tuyaux semi-rigides de 25 ou 33 mm sont roulés sur un dévidoir tournant, pré-connectés à la lance et à la pompe, et ont vocation à être maintenus en eau en permanence. On dispose ainsi immédiatement de l\u0027eau, même tuyau partiellement déroulé.","ref":"§ 3.4 La lance du dévidoir tournant (LDT) — p. 51","p":"Les tuyaux, semi-rigides de diametre 25 ou 33 mm, sont roules sur un devidoir tournant, et pre-connectes a la lance et a la pompe.","s":"gto-ext"},
{"t":"gto-ext","ch":"Lance du dévidoir tournant","niv":"Chef d\u0027agrès","q":"Pour quel type de sinistre le guide destine-t-il l\u0027établissement de la lance du dévidoir tournant (LDT) ?","c":["Un feu au-delà du R+4 dans un immeuble sans colonne sèche","Un feu de grande surface nécessitant une attaque en masse","Un feu en étages traité par établissement oblique sur division","Un feu de plain-pied ou en étage limité, près du fourgon"],"r":3,"e":"La LDT permet d\u0027établir, à proximité immédiate du fourgon, une lance dont le débit peut atteindre de 80 à 300 L/min, pour un sinistre de plain-pied ou en étage limité : maison, garage, atelier, appartement au R+1, cave, sous-sol. Elle est limitée par la longueur disponible, et une inefficacité constatée impose un changement d\u0027établissement, donc une perte de temps.","ref":"§ 4 Schéma de principe d\u0027établissement d\u0027une LDT (ETB-1) — p. 56","p":"Etablir une lance dont le debit peut atteindre de 80 a 300 l/min a proximite immediate du fourgon, pour un sinistre de plain-pied ou en etage limite","s":"gto-ext"},
{"t":"gto-ext","ch":"Lance du dévidoir tournant","niv":"Équipier","q":"Quel avantage le guide attribue-t-il à l\u0027établissement de la lance du dévidoir tournant (LDT) ?","c":["Débit et portée adaptés à l\u0027attaque en masse","Longueur d\u0027établissement illimitée, sans prolongement","Rapidité et simplicité de mise en œuvre","Alimentation directe sur le poteau d\u0027incendie"],"r":2,"e":"La LDT, pré-connectée à la lance et à la pompe et maintenue en eau, offre rapidité et simplicité de mise en œuvre, maniabilité pendant l\u0027action et facilité de reconditionnement. En revanche, elle est limitée par la longueur disponible et nécessite un prolongement si nécessaire ; sa prise d\u0027eau est l\u0027engin.","ref":"§ 3 Mise en œuvre de la LDT — p. 56","p":"Rapidite et simplicite de mise en œuvre ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Lance du dévidoir tournant","niv":"Chef d\u0027équipe","q":"Lors de l\u0027établissement de la LDT, que doit faire le chef d\u0027équipe pour faciliter la mise en œuvre de l\u0027action ?","c":["Dérouler tout le tuyau avant de progresser","Faire une réserve de deux à trois tours sur l\u0027épaule","Laisser une boucle de réserve au pied de l\u0027engin","Faire une réserve de cinq à six tours au sol"],"r":1,"e":"Pour faciliter la mise en œuvre de l\u0027action, le chef d\u0027équipe fait une réserve de deux à trois tours sur l\u0027épaule. La LDT se déploie en déplacement rapide, du point d\u0027eau au point d\u0027attaque, la prise d\u0027eau étant l\u0027engin.","ref":"§ 5 Remarques (Établissement de la LDT) — p. 57","p":"afin de faciliter la mise en œuvre de l\u0027action, le chef d\u0027equipe doit faire une reserve sur l\u0027epaule de deux a trois tours ;","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Équipier","q":"En quoi consiste l\u0027établissement d\u0027une division d\u0027alimentation ou d\u0027une division d\u0027attaque ?","c":["À placer une division sur l\u0027engin pour augmenter la pression","À alimenter une division près du sinistre pour y brancher 1 ou 2 lignes","À relier deux engins-pompes en relais à l\u0027aide d\u0027une division","À placer une division au point d\u0027eau pour alimenter plusieurs engins"],"r":1,"e":"Établir une division consiste à alimenter une division au plus près du sinistre afin d\u0027y connecter une ou deux lignes d\u0027attaque. Pour l\u0027alimenter, l\u0027usage de tuyaux de diamètre 70 (dévidoir mobile, couronnes ou écheveaux) permet de limiter les pertes de charge.","ref":"§ 1 Conditions de mise en œuvre (Division) — p. 59","p":"L\u0027etablissement d\u0027une division d\u0027alimentation ou d\u0027attaque consiste a alimenter une division au plus pres du sinistre afin d\u0027y connecter une ou deux lignes d\u0027attaque.","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et votre engin doit alimenter la colonne sèche d\u0027un bâtiment. Que convient-il de vérifier pour garantir une bonne distribution de l\u0027eau ?","c":["La présence des bouchons sur chaque orifice","Le niveau d\u0027eau maintenu en permanence dans la colonne","La pression du réseau de ville raccordé à la colonne","Le fonctionnement des surpresseurs en pied de colonne"],"r":0,"e":"Une colonne sèche s\u0027alimente dans les mêmes conditions qu\u0027une division (dévidoir, tuyaux en couronnes ou en écheveaux). Elle est dotée de bouchons à chaque orifice, à vérifier pour garantir la distribution de l\u0027eau, sans perte d\u0027efficacité pour le binôme engagé ni inondation des locaux ; un sac de bouchons est généralement prévu dans les engins.","ref":"§ Alimentation d\u0027une colonne sèche (fiche ETB-2) — p. 62","p":"ces equipements sont dotes de bouchons a chaque orifice, qu\u0027il conviendra de verifier afin de garantir une bonne distribution de l\u0027eau pour la bonne realisation de la mission","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Équipier","q":"Pour un établissement vertical par l\u0027extérieur ou par le jour d\u0027escalier, à quoi sert la commande ?","c":["À fermer à distance l\u0027arrivée d\u0027eau de la division","À baliser le cheminement de repli du binôme","À bloquer la porte palière en position ouverte","À hisser les tuyaux, préalablement établis au sol"],"r":3,"e":"Pour un établissement vertical par l\u0027extérieur ou par le jour d\u0027escalier, les tuyaux sont établis au sol puis hissés à l\u0027aide de la commande, ou tirés derrière le chef BAT s\u0027il utilise une échelle ; l\u0027établissement peut alors être solidarisé par des sangles ou crochets d\u0027échelle.","ref":"§ 5 Remarques (Ligne d\u0027attaque sur une prise d\u0027eau) — p. 66","p":"Pour un etablissement vertical par l\u0027exterieur ou un jour d\u0027escalier, les tuyaux sont etablis au sol et hisses a l\u0027aide de la commande ou tires derriere le chef BAT si celui-ci utilise une echelle.","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Chef d\u0027agrès","q":"Feu au R+7 d\u0027un immeuble dépourvu de colonne sèche ou humide. Quel établissement le guide propose-t-il pour la ligne d\u0027attaque ?","c":["Une LDT prolongée par des tuyaux souples de 45 dans l\u0027escalier","Une lance sur division d\u0027alimentation posée au pied, par l\u0027escalier","Une lance sur division d\u0027attaque, elle-même alimentée en 70","Une lance sur l\u0027engin, hissée à la commande le long de la façade"],"r":2,"e":"Au-delà du R+4, sans colonne sèche ou humide, la lance est établie sur une division d\u0027attaque, prolongeant en tuyaux de 70 la division d\u0027alimentation positionnée en bas du bâtiment. Cela limite le recours aux tuyaux de 45, générateurs de pertes de charge. La lance sur division d\u0027alimentation par les escaliers vise en général au maximum le R+4.","ref":"§ 4 Établissement d\u0027une lance sur une division d\u0027attaque (ETB-3) — p. 66","p":"Etablir une ligne d\u0027attaque a l\u0027aide de tuyaux souples sur une division en prolongation d\u0027une division d\u0027alimentation, posee au pied d\u0027un batiment pour un sinistre situe au-dela du R+4 (en absence de colonne seche ou humide).","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Équipier","q":"À quoi sert principalement une lance queue de paon ?","c":["À attaquer en masse un feu sur une surface importante","À assurer un rideau d\u0027eau face à un flux thermique","À refroidir les fumées par impulsions dans un local","À produire de la mousse à l\u0027aide d\u0027un injecteur mobile"],"r":1,"e":"La lance queue de paon assure un rideau d\u0027eau face à un flux thermique ; avec la lance canon, elle sert notamment à couper la propagation entre deux bâtiments. L\u0027attaque en masse d\u0027un incendie sur une surface importante relève de la lance canon.","ref":"§ 2 Établissement d\u0027une lance canon ou queue de paon (ETB-5) — p. 75","p":"afin d\u0027attaquer en masse un incendie sur une surface importante pour une lance canon, ou bien assurer un rideau d\u0027eau face a un flux thermique pour la lance queue de paon.","s":"gto-ext"},
{"t":"gto-ext","ch":"Autres manœuvres d\u0027établissement","niv":"Chef d\u0027équipe","q":"Sur une ligne d\u0027attaque établie sur une division, un tuyau percé doit être remplacé. Qui ferme l\u0027alimentation en eau, et sur ordre de qui ?","c":["Le conducteur, sur ordre du chef d\u0027agrès","Le chef du BAL, de sa propre initiative","L\u0027équipier du BAT, sur ordre de son chef d\u0027équipe","Le chef d\u0027équipe du BAT, sur ordre du chef d\u0027agrès"],"r":2,"e":"L\u0027équipier du BAT ferme l\u0027alimentation sur ordre de son chef d\u0027équipe, qui reste au contact mais en sécurité. Dans tous les cas, la fermeture de l\u0027arrivée d\u0027eau est commandée par le chef d\u0027équipe du BAT : c\u0027est sa sécurité et celle de son équipier qui sont en jeu.","ref":"§ 3 Principes généraux (ETB-6 Prolongement ou remplacement de tuyau) — p. 77","p":"L\u0027equipier du binome d\u0027attaque est charge de fermer l\u0027alimentation en eau de l\u0027etablissement, sur ordre du chef d\u0027equipe, qui reste au contact de celle-ci, mais en securite","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Chef d\u0027agrès","q":"Pour utiliser au maximum les capacités de sa pompe, comment l\u0027alimentation d\u0027un engin-pompe doit-elle être réalisée si possible ?","c":["Par une seule ligne de 45 raccordée au poteau","Par une seule ligne de 70, quelle que soit la distance","Par trois lignes de 45 réunies sur un collecteur","Par une ligne de 110 ou par deux lignes de 70"],"r":3,"e":"L\u0027alimentation de l\u0027engin doit être si possible optimisée soit par une ligne de diamètre 110, soit par deux lignes de diamètre 70, afin d\u0027utiliser au maximum les capacités de sa pompe. Plus le diamètre est important, plus le débit peut être élevé et les pertes de charge faibles.","ref":"§ 2.2 Les situations types (Principes de la DECI) — p. 17","p":"L\u0027alimentation de l\u0027engin doit etre si possible optimisee, soit par une ligne de diametre 110, soit par deux lignes de diametre 70, afin d\u0027utiliser au maximum les capacites de sa pompe.","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un engin-pompe emportant environ 3 000 L d\u0027eau. Que retient le guide sur son alimentation dans les premiers temps de l\u0027intervention ?","c":["Elle doit être réalisée avant l\u0027ouverture de la première lance","Elle est réalisée par le conducteur seul, quelle que soit la distance","Elle est inutile tant que la citerne n\u0027est pas entièrement vide","Elle n\u0027est plus une obligation absolue si la réserve est suffisante"],"r":3,"e":"La performance actuelle des lances permet généralement d\u0027agir avec des quantités d\u0027eau plus faibles : avec une réserve suffisante (environ 3 000 L pour un engin classique), l\u0027alimentation n\u0027est plus une obligation absolue au début de l\u0027intervention. Un VPI disposant de peu d\u0027eau nécessite en revanche une alimentation rapide s\u0027il devait rester seul le temps de la montée en puissance.","ref":"§ 1 Objectifs (Alimentation d\u0027un dispositif hydraulique) — p. 67","p":"Dans les premiers temps de l\u0027intervention, l\u0027alimentation de l\u0027engin, s\u0027il dispose d\u0027une reserve d\u0027eau suffisante (engins classiques embarquant une quantite d\u0027eau d\u0027environ 3000 litres), n\u0027est donc plus une obligation absolue.","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Équipier","q":"Un engin-pompe est alimenté par un poteau d\u0027incendie. Quelle pression minimale faut-il à l\u0027arrivée à la pompe ?","c":["0,5 bar","1 bar","3 bars","6 bars"],"r":1,"e":"À l\u0027arrivée à la pompe, la pression doit être d\u0027au moins 1 bar, ce qui permet à l\u0027eau de couler en contrant la pression atmosphérique. Plus généralement, tout dispositif d\u0027alimentation d\u0027une pompe doit permettre d\u0027avoir au moins 1 bar à sa sortie.","ref":"§ 3 Connaissances techniques des pompes — p. 68","p":"dont la pression a l\u0027arrivee (a la pompe) doit etre au minimum de 1 bar (permettant de couler, contrant ainsi la pression atmospherique).","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Équipier","q":"En règle générale, au-delà de quelle part de ses capacités évite-t-on de faire travailler une pompe ?","c":["50 %","65 %","80 %","95 %"],"r":2,"e":"Quel que soit le type de pompe, on évite en général de la faire travailler à plus de 80 % de ses capacités, pour la préserver et garantir son intégrité, donc un maximum de sécurité pour les intervenants face au risque de rupture hydraulique.","ref":"§ 3 Connaissances techniques des pompes — p. 68","p":"En general, quel que soit le type de pompe, on evite de la faire travailler a plus de 80% de ses capacites, pour la preserver et ainsi garantir son integrite","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès d\u0027un VPI, qui dispose de peu d\u0027eau, et risquez de rester seul un moment. Que préconise le guide ?","c":["Attaquer sur la citerne seule, l\u0027eau embarquée suffisant","Alimenter rapidement l\u0027engin et adapter votre choix tactique","Attendre l\u0027arrivée d\u0027un FPT avant toute action sur le feu","Ouvrir la lance à plein débit pour éteindre avant la fin de l\u0027eau"],"r":1,"e":"Un FPT disposant de 3 000 L laisse une marge de manœuvre intéressante. En revanche, un VPI disposant de peu d\u0027eau nécessite une alimentation rapide s\u0027il devait rester seul le temps de la montée en puissance du dispositif. Le chef d\u0027agrès adapte alors son choix tactique : offensif, défensif ou de transition.","ref":"§ 4.1 Alimentation de l\u0027engin par le conducteur — p. 68","p":"l\u0027utilisation d\u0027un VPI disposant de peu d\u0027eau (600 a 1200 en general), necessite une alimentation rapide s\u0027il devait rester seul le temps de la montee en puissance du dispositif.","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Chef d\u0027équipe","q":"Le point d\u0027eau n\u0027est pas à proximité de l\u0027engin. Pourquoi le guide juge-t-il alors peu raisonnable que le conducteur alimente seul l\u0027engin ?","c":["Il devrait s\u0027éloigner de l\u0027engin, au détriment des équipes engagées","Il doit rester en permanence en liaison radio avec le CTA","Il ne dispose pas des clés de poteau et de bouche à bord","Il n\u0027est pas formé à la manœuvre des poteaux et des bouches d\u0027incendie"],"r":0,"e":"Le conducteur peut alimenter seul l\u0027engin tant que le point d\u0027eau est à proximité, car il doit pouvoir agir rapidement sur la pompe selon les besoins des binômes au contact du feu. Au-delà, ce n\u0027est pas raisonnable : il devrait s\u0027éloigner de l\u0027engin dans des conditions de sécurité défavorables pour les équipes engagées.","ref":"§ 5 Alimentation de l\u0027engin par le binôme d\u0027alimentation — p. 70","p":"L\u0027alimentation de l\u0027engin par le conducteur n\u0027est pas raisonnable car il devrait alors s\u0027eloigner de l\u0027engin dans des conditions de securite defavorables pour les equipes engagees.","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Équipier","q":"Le point d\u0027eau dispose d\u0027un dispositif d\u0027aspiration (poteau d\u0027aspiration, traînasse…) en bon état et l\u0027engin a une citerne. Que faire avant d\u0027aspirer ?","c":["Y refouler quelques secondes l\u0027eau de la citerne","Aspirer d\u0027abord à bas régime pour décoller les saletés","Laisser reposer l\u0027eau quelques minutes pour qu\u0027elle décante","Remonter la crépine pour la placer au ras de la surface"],"r":0,"e":"Lorsque le site dispose d\u0027un dispositif d\u0027aspiration (traînasse, poteau d\u0027aspiration…), on vérifie son état avant de mettre en place les matériels, puis on refoule dedans quelques secondes, si l\u0027engin dispose d\u0027une citerne, pour éviter d\u0027aspirer des saletés.","ref":"§ 6 Mise en aspiration de l\u0027engin — p. 71","p":"Il convient alors de verifier son etat avant de mettre en place les materiels, puis de refouler dedans quelques secondes (si l\u0027engin dispose d\u0027une citerne d\u0027eau) pour eviter d\u0027aspirer des saletes","s":"gto-ext"},
{"t":"gto-ext","ch":"Alimentation des engins","niv":"Chef d\u0027agrès","q":"Votre engin alimente les lances en action et une noria d\u0027engins-pompes est mise en place. Que préconise le guide pour votre engin ?","c":["Le faire relayer à chaque rotation par un engin plein","L\u0027envoyer lui-même se remplir au point d\u0027eau","Le laisser en place et le remplir avec les norias","Le rapprocher du point d\u0027eau pour raccourcir la noria"],"r":2,"e":"La noria consiste à faire, avec des engins-pompes, des allers-retours entre un ou plusieurs points d\u0027eau et le point d\u0027alimentation du dispositif. Pour garantir la pérennité de l\u0027eau au niveau des lances en action, il est préférable de laisser en place l\u0027engin qui alimente le dispositif et de le remplir avec les norias.","ref":"§ 7.2 Alimentation par une noria d\u0027engins-pompe — p. 72","p":"pour garantir la perennite de l\u0027eau au niveau des lances en action, il est preferable de laisser l\u0027engin alimentant le dispositif en place et de le remplir avec les norias.","s":"gto-ext"},
