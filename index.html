{"t":"gdo-ssuap","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"La victime, corpulente, doit être transférée à plat depuis un étage. Que peut faire le chef d\u0027agrès pour limiter l\u0027impact sur son équipage ?","c":["Demander des moyens complémentaires, tel un renfort brancardage","Imposer un portage à bras pour gagner du temps","Réaliser le transfert en force avec son seul équipage","Différer l\u0027évacuation jusqu\u0027à l\u0027arrivée de l\u0027équipe de relève"],"r":0,"e":"Selon la corpulence de la victime, la configuration des lieux ou la nécessité d\u0027un transfert à plat, le chef d\u0027agrès peut demander des moyens complémentaires (renfort brancardage, moyen élévateur aérien, équipe SMPM…) pour limiter l\u0027impact sur son équipage. Le guide demande d\u0027éviter le travail en force.","ref":"§ 2.2 La prévention des troubles musculo-squelettiques (chap. 3) — p. 36","p":"état de la victime nécessitant par exemple un transfert à plat, etc.), le chef d\u0027agrès peut demander des moyens complémentaires (renfort brancardage, moyens élévateur aérien, équipe SMPM, etc.) afin d\u0027en limiter l\u0027impact sur son équipage.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Selon le guide, la régulation médicale d\u0027une opération impliquant au moins une victime est…","c":["facultative si la victime est consciente et orientée","réservée aux seules situations d\u0027urgence vitale","réalisée sur place par le chef d\u0027agrès du VSAV","systématique et incombe au CRRA du SAMU"],"r":3,"e":"La régulation médicale d\u0027une opération impliquant au moins une victime est systématique et incombe au CRRA du SAMU. Elle vise notamment à déclencher une réponse médicale adaptée, à préparer l\u0027accueil du patient dans l\u0027établissement adapté et à organiser son transport.","ref":"§ 4.2 Les éléments spécifiques au SSUAP (chap. 4) — p. 41","p":"La régulation médicale d\u0027une opération impliquant au moins une victime est systématique et incombe au CRRA du SAMU.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Réponse opérationnelle","niv":"Chef d\u0027équipe","q":"Parmi ces motifs d\u0027intervention SSUAP, lequel le guide cite-t-il comme rendant nécessaire l\u0027intervention des forces de l\u0027ordre ?","c":["Une chute à domicile","Une crise d\u0027asthme","Une défenestration","Un malaise en magasin"],"r":2,"e":"Le CIC, le CORG et le CTA-CODIS s\u0027informent mutuellement et engagent les moyens appropriés lorsque les faits nécessitent l\u0027intervention des forces de l\u0027ordre, notamment en cas de rixe ou de violence aux personnes, de pendaison, de défenestration, de noyade ou d\u0027accident du travail.","ref":"§ 4.2 Les éléments spécifiques au SSUAP (chap. 4) — p. 42","p":"les faits rendent nécessaire une intervention des forces de l\u0027ordre au titre de leur attribution, notamment en cas de rixe ou de violence aux personnes, de pendaison, de défenestration, de noyade, d\u0027accident du travail.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"En route vers une intervention, le SAMU demande l\u0027arrêt de votre VSAV. Selon le guide, qui décide de la suite donnée à cette demande ?","c":["Le SAMU, dont la demande s\u0027impose alors au SIS sans délai","Le SIS, après analyse de la situation opérationnelle","Le requérant, qui peut annuler sa demande","Les forces de l\u0027ordre, si elles sont sur place"],"r":1,"e":"Si la demande d\u0027arrêt des moyens émane du SAMU, le SIS peut, après analyse de la situation opérationnelle, décider d\u0027arrêter ou de laisser ses moyens poursuivre l\u0027opération. Le SIS reste maître de ses moyens, et une décision d\u0027arrêt ne l\u0027exonère pas de sa responsabilité en cas de contentieux.","ref":"§ 4.4.2 L\u0027arrêt des moyens avant l\u0027arrivée sur les lieux (chap. 4) — p. 44","p":"Si la demande d\u0027arrêt des moyens émane du SAMU, le SIS peut, après analyse de la situation opérationnelle, décider d\u0027arrêter ou de laisser les moyens engagés poursuivre l\u0027opération.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Réponse opérationnelle","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès VSAV. À votre arrivée, un témoin guidé par l\u0027opérateur du CTA pratique un massage cardiaque. Que prévoit le guide vis-à-vis de ce témoin ?","c":["Le prendre en charge pour le valoriser dans son action","Lui demander de s\u0027éloigner pour libérer l\u0027espace de travail","Relever son identité pour la seule fiche bilan","Lui confier la poursuite du massage jusqu\u0027au départ"],"r":0,"e":"Les conseils aux requérants annexés au guide précisent que le témoin doit être pris en charge par le chef d\u0027agrès VSAV pour le valoriser dans son action. Face à une détresse vitale, l\u0027opérateur l\u0027a guidé dans les gestes au moins jusqu\u0027à l\u0027arrivée des primo-intervenants.","ref":"§ Annexe B Conseils aux requérants — p. 69","p":"Le témoin doit être pris en charge par le chef d\u0027agrès VSAV pour le valoriser dans son action.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Équipier","q":"Le zonage opérationnel respecte toujours le principe des trois zones. Quelle couleur désigne la zone contrôlée ?","c":["Rouge","Verte","Orange","Jaune"],"r":2,"e":"Le zonage opérationnel comprend une zone d\u0027exclusion dite rouge, une zone contrôlée dite orange et une zone de soutien dite verte. Les limites extérieures de la zone de soutien constituent le périmètre de sécurité.","ref":"§ 1.1 Principes généraux du zonage opérationnel (chap. 5) — p. 46","p":"une zone d\u0027exclusion dite rouge ; une zone contrôlée dite orange ; une zone de soutien dite verte.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Pour une seule victime, le zonage SSUAP est réduit à quelques mètres. Que permet-il notamment de garantir ?","c":["Le secret professionnel et la dignité de la personne","Le contrôle des EPI des intervenants engagés","La gestion des entrées et sorties des moyens de renfort","La protection contre un risque d\u0027explosion"],"r":0,"e":"Lorsqu\u0027il s\u0027agit d\u0027une seule victime, le zonage est réduit à quelques mètres ; il permet de garantir le secret professionnel, les données médicales à caractère personnel, les droits et la dignité de la personne.","ref":"§ 1.2 Le zonage opérationnel spécifique au SSUAP (chap. 5) — p. 47","p":"Lorsqu\u0027il s\u0027agit d\u0027une seule victime, ce zonage est réduit à quelques mètres. Il permet de garantir le secret professionnel, les données médicales à caractère personnel, les droits et la dignité de la personne.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Hors convention locale particulière, à quel moment le bilan patient-victime doit-il être transmis au médecin régulateur ?","c":["À l\u0027arrivée à l\u0027hôpital, avec la fiche bilan","Uniquement à la demande du CODIS","Pendant le trajet, une fois la victime installée","Dans les meilleurs délais, avant l\u0027évacuation"],"r":3,"e":"La transmission du bilan doit se faire dans les meilleurs délais avant l\u0027évacuation : il permet notamment au médecin régulateur de déterminer la nécessité de renforts médicaux et la destination de la victime.","ref":"§ 2.1 La prise en charge de la victime par les primo-intervenants (chap. 5) — p. 48","p":"La transmission du bilan patient-victime doit se faire dans les meilleurs délais avant l\u0027évacuation. Ce bilan est nécessaire au médecin régulateur pour permettre notamment à ce dernier de déterminer la nécessité de renforts médicaux et la destination","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Au vu de votre bilan, le médecin régulateur juge l\u0027évacuation non nécessaire. Que prévoit le guide, chaque fois que c\u0027est possible ?","c":["Évacuer malgré tout la victime par précaution","Faire signer à la victime une décharge de refus","Confier la victime à un voisin avant de quitter les lieux","Mettre l\u0027appelant en relation avec le régulateur"],"r":3,"e":"Si le médecin régulateur ne juge pas l\u0027évacuation nécessaire, la victime est laissée sur place, éventuellement dans l\u0027attente d\u0027une prise en charge ambulatoire. L\u0027appelant est mis en relation téléphonique directe, chaque fois que possible, avec le médecin régulateur qui lui explique cette décision.","ref":"§ 2.2 Le « laisser sur place » (chap. 5) — p. 49","p":"L\u0027appelant est mis en relation téléphonique directe, chaque fois que cela est possible, avec le médecin régulateur qui lui explique cette décision.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Équipier","q":"Une victime majeure, en pleine possession de ses capacités mentales, refuse d\u0027être évacuée. Selon le guide…","c":["le chef d\u0027agrès peut l\u0027y contraindre si son état l\u0027inquiète","rien n\u0027autorise un sapeur-pompier à la forcer à le suivre","sa famille peut exiger son évacuation","elle ne peut plus refuser si elle a appelé les secours"],"r":1,"e":"Toute victime majeure en pleine possession de ses capacités mentales peut refuser la prise en charge ou l\u0027évacuation : elle ne peut faire l\u0027objet d\u0027aucun acte sans son consentement, et rien n\u0027autorise un sapeur-pompier à la forcer à le suivre.","ref":"§ 2.3 Le refus de la victime à être prise en charge (chap. 5) — p. 49","p":"dispose du droit de refuser une prise en charge et ne peut faire l\u0027objet d\u0027aucun acte de diagnostic, de soins ou d\u0027évacuation sans son consentement. Rien n\u0027autorise un sapeur-pompier à forcer une personne à le suivre.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"L\u0027information délivrée par le chef d\u0027agrès à une victime qui refuse sa prise en charge doit être simple, intelligible, explicite et…","c":["exhaustive","écrite","loyale","rassurante"],"r":2,"e":"L\u0027information doit être simple, intelligible, explicite et loyale, c\u0027est-à-dire sans dissimulation ni exagération de l\u0027état, ni mensonge : le consentement comme le refus impliquent une obligation d\u0027information, au nom du consentement libre et éclairé.","ref":"§ 2.3 Le refus de la victime à être prise en charge (chap. 5) — p. 49","p":"L\u0027information donnée par le chef d\u0027agrès doit être : simple […] intelligible […] explicite […] loyale : sans dissimulation ni exagération de l\u0027état, ni mensonges","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Une victime lucide refuse sa prise en charge. Avant de quitter les lieux, que doit obligatoirement faire le chef d\u0027agrès ?","c":["Transmettre un bilan au régulateur précisant ce refus","Obtenir l\u0027accord écrit d\u0027un membre de la famille","Demander aux forces de l\u0027ordre de la contraindre","Attendre sur place qu\u0027un médecin vienne constater le refus"],"r":0,"e":"Le chef d\u0027agrès doit obligatoirement transmettre, avant de quitter les lieux, un bilan au médecin régulateur précisant que la personne refuse sa prise en charge. Chaque fois que possible, le régulateur s\u0027entretient par téléphone avec la personne ; cet entretien, facilité par le chef d\u0027agrès, peut l\u0027amener à revoir sa décision.","ref":"§ 2.3 Le refus de la victime à être prise en charge (chap. 5) — p. 49","p":"Le chef d\u0027agrès doit transmettre obligatoirement, avant de quitter les lieux de l\u0027opération de secours, un bilan au médecin régulateur précisant que la personne refuse sa prise en charge par les sapeurs-pompiers.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Comment les sapeurs-pompiers matérialisent-ils, autant que faire se peut, le refus de prise en charge d\u0027une victime ?","c":["Par une simple mention dans le message radio passé au CODIS","Par la signature d\u0027un témoin sur la fiche bilan","Par une décharge signée dont un double lui est laissé","Par l\u0027enregistrement vidéo de son refus oral"],"r":2,"e":"Autant que faire se peut, les sapeurs-pompiers matérialisent ce refus par une décharge de responsabilité signée, dont ils laissent un double à la victime.","ref":"§ 2.3 Le refus de la victime à être prise en charge (chap. 5) — p. 49","p":"Autant que faire se peut, les sapeurs-pompiers matérialisent ce refus par une décharge de responsabilité signée, dont ils laissent un double à la victime.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027agrès","q":"Pendant l\u0027évacuation, l\u0027état de la victime s\u0027aggrave alors que l\u0027hôpital n\u0027est plus qu\u0027à quelques minutes. Que doit faire le chef d\u0027agrès ?","c":["Poursuivre sans appel, l\u0027hôpital étant tout proche","S\u0027arrêter et attendre un SMUR sans prévenir le régulateur","Prévenir uniquement l\u0027infirmier d\u0027accueil à l\u0027arrivée","Refaire un bilan et recontacter en urgence le régulateur"],"r":3,"e":"En cas d\u0027aggravation, le chef d\u0027agrès doit impérativement réaliser un nouveau bilan et recontacter en urgence le médecin régulateur, quelle que soit la distance qui le sépare de l\u0027hôpital. Le médecin peut alors proposer de poursuivre, de suspendre l\u0027évacuation dans l\u0027attente d\u0027un moyen médicalisé ou de convenir d\u0027un point de jonction.","ref":"§ 2.4 L\u0027évacuation de la victime (chap. 5) — p. 50","p":"En cas d\u0027aggravation de l\u0027état de la victime, le chef d\u0027agrès doit impérativement réaliser un nouveau bilan et recontacter en urgence le médecin régulateur et ce, quelle que soit la distance qui le sépare de l\u0027hôpital de la destination.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"Jusqu\u0027à quand la victime reste-t-elle sous la responsabilité des secours à l\u0027arrivée dans la structure de soins d\u0027accueil ?","c":["Jusqu\u0027à l\u0027arrêt du VSAV devant le service des urgences","Jusqu\u0027à sa prise en charge par le personnel soignant","Jusqu\u0027à la fin de la transmission du bilan au régulateur","Jusqu\u0027à la réalisation de son dossier administratif"],"r":1,"e":"La victime est sous la responsabilité des secours tant qu\u0027elle n\u0027a pas été prise en charge par le personnel soignant de la structure de soins d\u0027accueil. La réalisation du dossier administratif d\u0027entrée n\u0027est pas du ressort des sapeurs-pompiers.","ref":"§ 2.5 La prise en charge par la structure de soins d\u0027accueil (chap. 5) — p. 50","p":"La victime est sous la responsabilité des secours tant qu\u0027elle n\u0027a pas été prise en charge par le personnel soignant de la structure de soins d\u0027accueil.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Conduite des opérations","niv":"Chef d\u0027équipe","q":"À l\u0027arrivée aux urgences, que doit réaliser l\u0027équipe avant le transfert de responsabilité au personnel soignant ?","c":["Un dernier bilan horodaté, renseigné sur la fiche bilan","Le dossier administratif d\u0027entrée du patient","Un message au CODIS pour obtenir l\u0027autorisation de transfert","Un inventaire des effets signé par la famille"],"r":0,"e":"Un dernier bilan horodaté, préalable au transfert de responsabilité, doit être réalisé et renseigné sur la fiche bilan. La fiche est ensuite remise, en général, à l\u0027infirmier d\u0027accueil et d\u0027orientation ; le dossier administratif d\u0027entrée ne relève pas des sapeurs-pompiers.","ref":"§ 2.5 La prise en charge par la structure de soins d\u0027accueil (chap. 5) — p. 50","p":"Un dernier bilan horodaté préalable au transfert de responsabilité doit être réalisé et renseigné sur la fiche bilan.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Dans lequel de ces cas le guide prévoit-il que les sapeurs-pompiers n\u0027engagent pas de gestes de secours ?","c":["Victime en ACR, famille opposant le non-acharnement","Victime en ACR découverte seule à son domicile","Victime en ACR âgée de plus de 85 ans, sans témoin","Victime en ACR depuis une durée inconnue du requérant"],"r":0,"e":"Parmi les situations ne nécessitant pas d\u0027actions de secours figure le refus de la famille qui oppose le droit au non-acharnement thérapeutique sur la victime. Le guide cite aussi la tête séparée du tronc, la raideur cadavérique ou la putréfaction, certaines situations exceptionnelles à nombreuses victimes et le danger imminent impossible à écarter.","ref":"§ 3.1 Les situations ne nécessitant pas d\u0027actions de secours (chap. 5) — p. 52","p":"Dans certains cas ou en fonction du contexte, les sapeurs-pompiers n\u0027engagent pas de gestes de secours : […] refus de la famille qui oppose le droit au non acharnement thérapeutique sur la victime","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027agrès","q":"Le médecin régulateur décide l\u0027arrêt de la réanimation. Que fait alors le chef d\u0027agrès vis-à-vis de la famille ?","c":["Il annonce lui-même le décès et en explique les causes","Il l\u0027invite à contacter son médecin traitant","Il lui remet un certificat de décès provisoire","Il la met en relation avec le régulateur via le CODIS"],"r":3,"e":"En cas d\u0027arrêt de la réanimation, le chef d\u0027agrès met en relation téléphonique, par l\u0027intermédiaire du CODIS, un membre de la famille avec le médecin régulateur, afin que celui-ci fasse part directement de sa décision et de ses raisons médicales. Les renseignements concernant les formalités administratives (certificat de décès, état civil…) ne sont pas du ressort des sapeurs-pompiers.","ref":"§ 3.2 L\u0027arrêt des manœuvres de réanimation (chap. 5) — p. 52","p":"En cas d\u0027arrêt de la réanimation, le chef d\u0027agrès met en relation téléphonique par l\u0027intermédiaire du CODIS, un membre de la famille de la personne décédée avec le médecin régulateur du CRRA 15","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Le chef d\u0027agrès confirme aux équipiers l\u0027arrêt de la réanimation décidé par le médecin régulateur. Que font-ils ?","c":["Ils rangent le matériel et assurent une présentation digne","Ils organisent avec la famille les démarches funéraires","Ils poursuivent la RCP jusqu\u0027à l\u0027arrivée d\u0027un médecin","Ils remplissent les formalités d\u0027état civil"],"r":0,"e":"Après confirmation de l\u0027arrêt de la réanimation, les équipiers rangent le matériel utilisé et veillent à une présentation digne de la personne décédée. Les renseignements concernant l\u0027accomplissement des formalités administratives et funéraires ne sont pas du ressort des sapeurs-pompiers.","ref":"§ 3.2 L\u0027arrêt des manœuvres de réanimation (chap. 5) — p. 52","p":"le chef d\u0027agrès se fait confirmer l\u0027arrêt de la réanimation par le médecin et en informe ses équipiers qui procèdent au rangement du matériel utilisé et veillent à assurer une présentation digne de la personne décédée.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027agrès","q":"Une personne relevant de soins psychiatriques sans consentement doit être transportée. Qu\u0027est-ce qui est indispensable avant tout transport ?","c":["L\u0027accord écrit et préalable de la personne concernée elle-même","La présence physique d\u0027un médecin et son examen clinique","La présence d\u0027un membre de la famille à bord","La signature d\u0027une décharge par le chef d\u0027agrès"],"r":1,"e":"La présence physique d\u0027un médecin et l\u0027examen clinique de la victime sont indispensables avant tout transport : le chef d\u0027agrès contacte le SAMU pour qu\u0027il engage un médecin. Ces situations font exception au principe général du consentement.","ref":"§ 3.3 Les personnes en situation d\u0027urgence psychiatrique (chap. 5) — p. 53","p":"La présence physique d\u0027un médecin et l\u0027examen clinique de la victime sont indispensables avant tout transport. Le chef d\u0027agrès contactera le SAMU pour qu\u0027il engage un médecin.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"Lors du bilan, une victime déclare avoir été frappée par son conjoint. Comment cette information est-elle consignée sur la fiche bilan ?","c":["En concluant à des violences conjugales avérées","En ne notant que les lésions, sans les propos","En attendant le dépôt d\u0027une plainte pour la noter","En précisant qu\u0027il s\u0027agit des dires de la victime"],"r":3,"e":"La réponse doit être consignée sur la fiche bilan en indiquant qu\u0027il s\u0027agit des dires de la victime ou d\u0027un témoin, par exemple « … déclare avoir été victime de violences conjugales ».","ref":"§ 3.4 Les victimes de violences intrafamiliales (chap. 5) — p. 53","p":"Dans l\u0027affirmative, la réponse doit être consignée sur le fiche bilan en indiquant qu\u0027il s\u0027agit des dires de la victime ou d\u0027un témoin « ...déclare avoir été victime de violences conjugales ».","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027agrès","q":"La victime nie toute violence, mais l\u0027attitude du conjoint et des blessures à répétition laissent des doutes. Que fait le chef d\u0027agrès au retour ?","c":["Il les consigne et en rend compte à sa hiérarchie","Il n\u0027en parle à personne au nom du secret professionnel","Il rappelle le conjoint pour obtenir des explications","Il dépose plainte lui-même au nom de la victime"],"r":0,"e":"Si des doutes persistent, le chef d\u0027agrès reste attentif au comportement de la victime et du conjoint ; au retour, il consigne ces éléments dans son compte rendu de sortie de secours et en rend compte à son supérieur hiérarchique, en vue d\u0027un éventuel signalement.","ref":"§ 3.4 Les victimes de violences intrafamiliales (chap. 5) — p. 54","p":"Au retour de l\u0027opération de secours, il consigne ces éléments dans son compte-rendu de sortie de secours et doit en rendre compte à son supérieur hiérarchique, en vue d\u0027un éventuel signalement.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Un mineur non émancipé, blessé, refuse d\u0027être pris en charge par les secours. Selon le guide…","c":["seul son responsable légal peut refuser","il peut refuser s\u0027il a plus de 15 ans","son refus s\u0027impose s\u0027il est peu blessé","il peut refuser s\u0027il est accompagné d\u0027un adulte"],"r":0,"e":"Un mineur ne peut pas refuser d\u0027être pris en charge par les secours ou d\u0027être hospitalisé : seul son responsable légal peut le faire. À défaut de représentant légal, le mineur est placé sous la protection et la responsabilité des sapeurs-pompiers.","ref":"§ 3.6 Les personnes mineures non accompagnées (chap. 5) — p. 55","p":"Un mineur ne peut pas refuser d\u0027être pris en charge par les secours ou d\u0027être hospitalisé. Seul son responsable légal peut le faire.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"Un enfant blessé à l\u0027école doit être évacué ; ses parents ne sont pas encore arrivés. Selon le guide, la présence d\u0027un parent…","c":["est obligatoire, sauf en cas d\u0027urgence vitale","n\u0027est pas obligatoire et ne doit pas la retarder","doit obligatoirement être remplacée par un enseignant","est obligatoire, sauf accord écrit de la direction"],"r":1,"e":"La présence d\u0027un parent ou d\u0027un responsable n\u0027est pas obligatoire pour l\u0027évacuation et ne doit pas la retarder. Sur un site avec encadrants, le chef d\u0027agrès recueille la fiche synthétique médicale du mineur, s\u0027assure que la famille est prévenue et lui indique la structure de soins d\u0027accueil.","ref":"§ 3.6 Les personnes mineures non accompagnées (chap. 5) — p. 55","p":"La présence d\u0027un parent ou d\u0027un responsable n\u0027est pas obligatoire pour l\u0027évacuation vers une structure d\u0027accueil de soins et ne doit pas retarder cette évacuation.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027agrès","q":"Un mineur seul, légèrement blessé, ne nécessite pas d\u0027évacuation. Aucun représentant légal, policier ou adulte en ayant la garde n\u0027est présent. Que fait le chef d\u0027agrès ?","c":["Il le laisse sur place après lui avoir donné des consignes","Il le raccompagne lui-même à son domicile avec le VSAV","Il contacte le médecin régulateur pour définir la conduite à tenir","Il l\u0027évacue d\u0027office vers les urgences pédiatriques"],"r":2,"e":"Un mineur seul sans nécessité d\u0027évacuation doit être confié à une tierce personne : représentant légal, forces de l\u0027ordre ou adulte en ayant la garde. À défaut de tierce personne majeure, le chef d\u0027agrès prend contact avec le médecin régulateur afin de déterminer la conduite à tenir.","ref":"§ 3.6 Les personnes mineures non accompagnées (chap. 5) — p. 55","p":"A défaut de présence d\u0027une tierce personne majeure, le chef d\u0027agrès prend contact avec le médecin régulateur afin de déterminer la conduite à tenir.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Une personne en état d\u0027ivresse est prise en charge sur la voie publique. Selon le guide, elle doit systématiquement faire l\u0027objet…","c":["d\u0027une simple mise à l\u0027abri, sans bilan","d\u0027un bilan complet et d\u0027une surveillance attentive","d\u0027une évacuation d\u0027office, sans bilan préalable","d\u0027un bilan sommaire si elle est connue du service"],"r":1,"e":"Les personnes en état d\u0027ivresse prises en charge doivent systématiquement faire l\u0027objet d\u0027un bilan complet et d\u0027une surveillance attentive. Il ne faut pas tomber dans la routine et garder à l\u0027esprit que leur état peut évoluer très rapidement, voire instantanément, vers une détresse vitale et une mort subite.","ref":"§ 3.7 Les personnes en état d\u0027ivresse publique et manifeste (chap. 5) — p. 56","p":"Les personnes présentant un état d\u0027ivresse prises en charge par les sapeurs-pompiers, le plus souvent sur la voie publique, doivent faire systématiquement l\u0027objet de toute l\u0027attention nécessaire (bilan complet) et d\u0027une surveillance attentive.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Face à une victime en situation de handicap, quelle attitude le guide recommande-t-il ?","c":["Caresser son animal d\u0027assistance pour la rassurer","S\u0027adresser d\u0027abord à son accompagnant","Lui demander comment elle souhaite être aidée","Déduire son handicap de son apparence"],"r":2,"e":"Le guide recommande de ne pas venir automatiquement en aide à la victime mais de lui demander comment l\u0027aider : elle expliquera ses besoins. Il faut aussi s\u0027adresser directement à elle et non à son accompagnant, ne pas présumer du type de handicap (certains sont invisibles) et ne pas toucher aux animaux d\u0027assistance.","ref":"§ 3.9 Les personnes présentant un handicap (chap. 5) — p. 57","p":"ne pas venir automatiquement en aide à la victime. Lui demander comment l\u0027aider. Elle expliquera ses besoins ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"Auprès d\u0027une personne présentant des troubles du comportement ou des idées suicidaires, comment organiser le contact ?","c":["Un seul interlocuteur, seul avec elle pour la mettre en confiance","Un seul interlocuteur, non isolé, en contact avec la victime","Plusieurs interlocuteurs qui se relaient pour l\u0027apaiser","Tout l\u0027équipage autour d\u0027elle pour la rassurer"],"r":1,"e":"Il faut s\u0027assurer qu\u0027un seul interlocuteur, non isolé, est en contact avec la victime, repérer et écarter les dangers, se tenir à distance suffisante pour ne pas pouvoir être saisi et conserver un chemin de retrait.","ref":"§ 3.10 Les personnes présentant des troubles du comportement (chap. 5) — p. 57","p":"s\u0027assurer qu\u0027un seul interlocuteur (non isolé) est en contact avec la victime ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Équipier","q":"Auprès d\u0027une personne présentant des troubles du comportement, quelle « bulle » individuelle le guide demande-t-il de respecter ?","c":["Au moins 50 centimètres","Au moins trois mètres","Au moins cinq mètres","Au moins un mètre"],"r":3,"e":"Le guide demande de respecter « la bulle » individuelle du sujet, d\u0027au moins un mètre : approcher une personne suicidaire sans son autorisation risque de précipiter le passage à l\u0027acte ou un acte agressif envers les sauveteurs.","ref":"§ 3.10 Les personnes présentant des troubles du comportement (chap. 5) — p. 57","p":"respecter « la bulle » individuelle du sujet (au moins un mètre)","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès auprès d\u0027une personne agitée présentant des troubles du comportement. Des renforts sont en route. Que pouvez-vous demander au CTA-CODIS ?","c":["Qu\u0027ils arrivent au plus vite avec tous leurs avertisseurs","Qu\u0027ils stationnent devant l\u0027entrée, feux allumés","Qu\u0027ils se présentent directement auprès de la victime","Qu\u0027ils coupent leurs avertisseurs à l\u0027approche des lieux"],"r":3,"e":"Si des moyens sont sollicités en renfort, le chef d\u0027agrès peut demander au CTA-CODIS de leur indiquer de couper les avertisseurs lumineux et deux tons à l\u0027approche des lieux, pour ne pas effrayer ou provoquer la victime.","ref":"§ 3.10 Les personnes présentant des troubles du comportement (chap. 5) — p. 59","p":"Si des moyens sont sollicités en renfort, le chef d\u0027agrès peut demander au CTA-CODIS de leur indiquer de couper les avertisseurs lumineux et deux tons à l\u0027approche des lieux pour ne pas effrayer ou provoquer la victime.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"L\u0027équipage intervient pour une personne ne répondant pas aux appels. Quel principe le guide prévoit-il ?","c":["Sonner et téléphoner pour vérifier son absence","Ne pas sonner ni rester devant la porte","Entrer de préférence par la porte d\u0027entrée","Entrer de préférence par une chambre"],"r":1,"e":"Les équipages doivent notamment ne pas sonner, ni faire appeler par téléphone, ne pas rester devant la porte, solliciter les forces de sécurité publique et accéder au logement en privilégiant une fenêtre plutôt que la porte d\u0027entrée, une cuisine plutôt qu\u0027une chambre.","ref":"§ 3.12 Les personnes ne répondant pas aux appels (chap. 5) — p. 60","p":"ne pas sonner, ni faire appeler par téléphone, ne pas rester devant la porte ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"Selon le guide, jusqu\u0027à quelle durée d\u0027immersion la notion de prompt secours reste-t-elle valable pour une personne noyée ?","c":["Une heure, voire 2 heures en eau très froide","10 minutes, au-delà il s\u0027agit d\u0027une recherche de corps","30 minutes, quelle que soit la température de l\u0027eau","6 heures, en eau très froide uniquement"],"r":0,"e":"La notion de prompt secours reste valable pour une personne noyée immergée pendant une heure, et pouvant aller jusqu\u0027à 2 heures dans une eau très froide (inférieure à 6°) ; cette durée peut être adaptée sur avis médical.","ref":"§ 3.14 Les noyades (chap. 5) — p. 60","p":"la notion de prompt secours reste valable pour une personne noyée, immergée pendant une durée d\u0027une heure et pouvant aller jusqu\u0027à 2 heures (cette durée peut être adaptée sur avis médical) dans une eau très froide - inférieure à 6°","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Situations particulières","niv":"Chef d\u0027équipe","q":"Dans quel cas les forces de l\u0027ordre doivent-elles être invitées à monter à bord du VSAV pendant l\u0027évacuation ?","c":["Uniquement sur réquisition écrite remise par le chef d\u0027agrès","Dès que la victime est violente, dangereuse ou menottée","Uniquement lorsqu\u0027il s\u0027agit d\u0027un détenu escorté","Seulement si un seul équipier est en cellule sanitaire"],"r":1,"e":"Les forces de l\u0027ordre doivent être invitées à monter à bord du VSAV pendant l\u0027évacuation dès lors que la victime est violente, dangereuse ou menottée. La neutralisation d\u0027une personne agitée leur incombe, même en cas de réquisition.","ref":"§ 3.16.1 Le transport des personnes violentes (chap. 5) — p. 61","p":"Les forces de l\u0027ordre doivent être invitées à monter à bord du VSAV pendant l\u0027évacuation dès lors que la victime est violente, dangereuse ou menottée.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Équipier","q":"Lors d\u0027une pendaison, comment l\u0027équipe libère-t-elle la victime afin de préserver les traces et indices ?","c":["En défaisant le nœud pour libérer le cou au plus vite","En coupant la corde, puis en défaisant le nœud","En coupant la corde sans défaire le nœud","En attendant l\u0027officier de police judiciaire"],"r":2,"e":"Pour limiter l\u0027impact des secours sur un lieu pouvant être une scène de crime, le guide prévoit de couper la corde sans défaire le nœud. L\u0027action des secours ne doit pas compromettre le travail des techniciens d\u0027investigation criminelle et de médecine légale.","ref":"§ 4 La préservation des traces et indices (chap. 5) — p. 62","p":"couper la corde s\u0027il s\u0027agit d\u0027une pendaison sans défaire le noeud ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Chef d\u0027équipe","q":"Sur une scène de crime présumée, le corps a dû être déplacé pour pratiquer une RCP. Que fait l\u0027équipe ?","c":["Elle replace le corps dans sa position initiale avant de partir","Elle indique aux forces de l\u0027ordre ce qui a été modifié","Elle n\u0027en dit rien, la RCP justifiant ce déplacement","Elle photographie la scène pour les archives du SIS"],"r":1,"e":"Il ne faut pas déplacer le corps, sauf si des actions comme la RCP sont entreprises : il convient alors de préciser aux forces de l\u0027ordre comment le corps et son environnement immédiat ont été déplacés ou modifiés. Les photos éventuelles sont réservées à l\u0027usage exclusif des forces de l\u0027ordre.","ref":"§ 4 La préservation des traces et indices (chap. 5) — p. 62","p":"ne pas déplacer le corps sauf si des actions sont entreprises comme la RCP. Il convient alors de préciser aux forces de l\u0027ordre comment le corps et son environnement immédiat ont été déplacés ou modifiés","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Chef d\u0027équipe","q":"Sur une scène de crime, que doit communiquer l\u0027équipage à l\u0027officier de police judiciaire ?","c":["Les identités de tout l\u0027équipage et les actions réalisées","Le seul nom du chef d\u0027agrès, responsable de l\u0027engin","Le bilan médical complet de la victime prise en charge","Aucune information sans accord écrit du CODIS"],"r":0,"e":"L\u0027équipage se tient à la disposition de l\u0027officier de police judiciaire et lui communique les identités de tous ses membres, en vue de prélèvements discriminatoires, ainsi que les actions réalisées (ouverture de porte, dégagement d\u0027urgence, RCP…). Le secret médical, lui, ne se partage pas avec les forces de l\u0027ordre.","ref":"§ 4 La préservation des traces et indices (chap. 5) — p. 62","p":"se tenir à la disposition de l\u0027officier de police judiciaire, communiquer les identités de tout l\u0027équipage (nom, prénom, coordonnées tél, centre de secours d\u0027appartenance, etc.) en vue de prélèvements discriminatoires à venir, ainsi que les actions des sapeurs-pompiers","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès du premier engin sur un accident à nombreuses victimes, vous effectuez la reconnaissance initiale. Sur quoi portent notamment vos renseignements ?","c":["L\u0027identité de chaque victime et de ses proches","Le choix des hôpitaux de destination des blessés","La définition d\u0027un PRM et d\u0027un PRV provisoires","Le nom des témoins et leur version des faits"],"r":2,"e":"Le premier COS réalise une première évaluation : nature précise du sinistre et localisation exacte, circonstances, nombre et état présumés des victimes, et définition d\u0027un point de regroupement des moyens (PRM) et d\u0027un point de rassemblement des victimes (PRV) provisoires.","ref":"§ 5 Les interventions face à de nombreuses victimes (chap. 5) — p. 63","p":"la définition du point de regroupement des moyens (PRM) et d\u0027un point de rassemblement des victimes (PRV) provisoires.","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Équipier","q":"Lors du premier tri sur un accident à nombreuses victimes, que fait-on des blessés légers et des impliqués ?","c":["On les regroupe à l\u0027écart des blessés graves","On les évacue en priorité pour libérer la zone","On les laisse auprès des blessés graves pour aider","On les laisse repartir sans recensement"],"r":0,"e":"Le tableau du premier tri prévoit, après catégorisation, de regrouper les blessés légers et les impliqués dans un lieu différent de celui des blessés graves. Les décédés sont laissés sur place et les blessés graves reçoivent les gestes de survie (damage control).","ref":"§ 5 Les interventions face à de nombreuses victimes (chap. 5) — p. 63","p":"A regrouper dans un lieu différent de celui des blessés graves","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Équipier","q":"Selon le code couleur de repérage des victimes, quelle couleur correspond à une victime qui a perdu connaissance et qui respire ?","c":["Noir","Jaune","Vert","Rouge"],"r":3,"e":"Dans le tableau de repérage, la couleur rouge regroupe la victime qui a perdu connaissance et qui respire (après une éventuelle LVA), la victime consciente en détresse vitale évidente et la victime qui présente une hémorragie. Le noir concerne notamment la victime inconsciente qui ne respire pas après LVA.","ref":"§ 5 Les interventions face à de nombreuses victimes (chap. 5) — p. 63","p":"Victime qui a perdu connaissance et qui respire (après une éventuelle LVA) Victime consciente qui présente une détresse vitale évidente (FR \u003e 30/min ou FC \u003e 120/min chez l\u0027adulte) Victime qui présente une hémorragie","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Équipier","q":"Lors du repérage de nombreuses victimes, dans quel ordre l\u0027intervenant les aborde-t-il ?","c":["En commençant par la victime qui crie le plus","En commençant par la plus proche de lui","En commençant par les enfants et les personnes âgées","En commençant par la plus éloignée du danger"],"r":1,"e":"Le repérage doit être rapide et reposer sur des critères simples : l\u0027intervenant aborde les victimes les unes après les autres, en commençant par la plus proche de l\u0027endroit où il se trouve, réalise un bilan d\u0027urgence primaire et les gestes de sauvetage.","ref":"§ 5 Les interventions face à de nombreuses victimes (chap. 5) — p. 64","p":"aborder les victimes les unes après les autres, en commençant par la victime la plus proche de l\u0027endroit où il se trouve ;","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Chef d\u0027équipe","q":"En quoi consiste le « damage control » appliqué aux blessés graves ?","c":["Traiter définitivement toutes les lésions avant l\u0027évacuation","Évacuer immédiatement le blessé sans aucun geste sur place","Prodiguer d\u0027abord les soins indispensables à sa survie","Classer les blessés selon le délai prévisible d\u0027évacuation"],"r":2,"e":"Le damage control consiste à prodiguer en première intention les soins immédiatement indispensables (arrêt des grandes hémorragies, sécurisation des voies aériennes…) pour assurer la survie du blessé, sans chercher à traiter définitivement la totalité de ses lésions.","ref":"§ 5 Les interventions face à de nombreuses victimes (chap. 5) — p. 64","p":"Le damage control consiste à prodiguer en première intention les soins immédiatement indispensables (arrêt des grandes hémorragies, sécurisation des voies aériennes, etc.) pour assurer la survie du blessé sans chercher à traiter définitivement la totalité de ses lésions","s":"gdo-ssuap"},
{"t":"gdo-ssuap","ch":"Traces et nombreuses victimes","niv":"Chef d\u0027agrès","q":"En dehors des attentats, à partir de combien de victimes l\u0027emploi de SINUS peut-il être ordonné par le COS ?","c":["Trois","Cinq","Dix","Vingt"],"r":1,"e":"L\u0027emploi de SINUS n\u0027est pas limité aux attentats : il peut être utilisé sur ordre du COS à partir de cinq victimes. Chaque victime reçoit dès sa prise en charge un référencement unique, lisible en clair et sous QR code, qui garantit sa traçabilité.","ref":"§ 5.2 Le dénombrement des victimes (chap. 5) — p. 65","p":"L\u0027emploi de SINUS n\u0027est pas limité aux attentats. Il peut être utilisé sur ordre du COS à partir de cinq victimes.","s":"gdo-ssuap"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Équipier","q":"Outre « éviter de se retrouver dans une situation nécessitant quelqu\u0027un pour être récupéré », quelles sont les deux autres règles de base de sauvegarde ?","c":["Toujours contrôler sa pression d\u0027air et son contact radio","Toujours progresser avec une lance en eau et une ligne guide","Toujours connaître ses itinéraires de repli et de secours","Toujours signaler son entrée et sa sortie au contrôle ARI"],"r":2,"e":"Le guide pose trois règles de base : éviter de se retrouver dans une situation nécessitant quelqu\u0027un pour être récupéré, toujours connaître son itinéraire de repli et toujours connaître son itinéraire de secours. Selon la citation reprise par le guide, violer les trois fait s\u0027effondrer les chances de survie.","ref":"§ Chapitre 1 (introduction) — p. 12","p":"Il existe trois règles de base : éviter de se retrouver dans une situation nécessitant quelqu\u0027un pour être récupéré ; toujours connaître son itinéraire de repli ; toujours connaître son itinéraire de secours.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027agrès","q":"Selon la règle des minimums, quel dispositif de sécurité doit être mis en place dès que possible pour les binômes engagés en zone d\u0027exclusion ?","c":["Un binôme de sécurité pour deux binômes engagés","Un binôme de sécurité pour un binôme engagé","Un binôme de sécurité pour l\u0027ensemble des binômes","Un équipier de sécurité pour chaque binôme engagé"],"r":1,"e":"Le principe du minimum de personnels prévoit un binôme de sécurité pour 1 binôme engagé, mis en place dès que possible. Le guide précise qu\u0027il ne s\u0027agit que d\u0027un premier échelon sécuritaire : extraire un sapeur-pompier inconscient demandera bien plus de deux personnes.","ref":"§ 1.1 La règle des minimums — p. 12","p":"le minimum de personnels : avec l\u0027engagement d\u0027un minimum de personnels en zone d\u0027exclusion, avec un binôme de sécurité mis en place pour 1 binôme engagé. Cette situation doit être mise en place dès que possible","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Équipier","q":"Selon le principe du « façadage », comment sont nommées les façades d\u0027un bâtiment ?","c":["A pour l\u0027accès principal, puis B, C, D dans le sens inverse des aiguilles d\u0027une montre","A pour la façade la plus exposée, puis B, C, D dans le sens des aiguilles d\u0027une montre","A pour la façade située au nord, puis B, C, D dans le sens des aiguilles d\u0027une montre","A pour l\u0027accès principal, puis B, C, D dans le sens des aiguilles d\u0027une montre"],"r":3,"e":"La façade A est la façade d\u0027accès principal ; les autres sont nommées B, C, D… en faisant le tour du bâtiment dans le sens des aiguilles d\u0027une montre. Ce langage commun évite les erreurs ; le COS s\u0027assure qu\u0027il est partagé par tous lors des points de situation.","ref":"§ 2.1 L\u0027identification des façades ou « façadage » — p. 13","p":"La façade A est la façade d\u0027accès principal. Les autres façades sont nommées « B », « C », « D »,... en faisant le tour du bâtiment dans le sens des aiguilles d\u0027une montre.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Équipier","q":"Qu\u0027est-ce que l\u0027itinéraire de repli selon le guide ?","c":["Un cheminement distinct de l\u0027accès, créé par échelle ou moyen aérien","Le chemin d\u0027accès normal emprunté par les binômes pour entrer","Le trajet balisé menant au point de rassemblement des intervenants","La zone de mise à l\u0027abri la plus proche des effets du sinistre"],"r":1,"e":"L\u0027itinéraire de repli est le chemin d\u0027accès normal emprunté par les binômes pour pénétrer dans le bâtiment ; reconnu et libéré de toute entrave, il est à utiliser prioritairement. L\u0027itinéraire de secours, lui, est différent de l\u0027itinéraire de repli ; sa création s\u0027anticipe par exemple par la mise en place d\u0027échelles à mains ou de moyens élévateurs aériens.","ref":"§ 2.2 Les itinéraires — p. 14","p":"Il est constitué par le chemin d\u0027accès normal qu\u0027ont emprunté les binômes pour pénétrer dans le bâtiment. Il a été reconnu et doit être libéré de toutes entraves","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et mettez en place un itinéraire de secours. Que prévoit le guide pour le matériel et le personnel qui y sont affectés ?","c":["Ils sont dédiés à cette mission pour en assurer la permanence","Ils peuvent être réaffectés à l\u0027attaque dès que le binôme progresse","Ils ne sont mis en place qu\u0027après un message de détresse","Ils sont mutualisés avec l\u0027alimentation en eau de l\u0027engin"],"r":0,"e":"L\u0027itinéraire de secours sert à l\u0027extraction rapide de l\u0027équipe engagée ou d\u0027une victime face à un danger immédiat : sa mise en place doit être anticipée et continue, et le matériel et le personnel sont dédiés à cette mission pour assurer la permanence des replis.","ref":"§ 2.2 Les itinéraires — p. 14","p":"A ce titre, sa mise en place doit être anticipée et continue. Le matériel utilisé et le personnel sont dédiés à cette mission afin d\u0027assurer la permanence des replis.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027agrès","q":"Un itinéraire de secours vient d\u0027être mis en place. Quelles informations les binômes engagés doivent-ils recevoir à son sujet ?","c":["Le nom de l\u0027engin, l\u0027heure de mise en place et l\u0027échelier","Le type d\u0027échelle employée, sa longueur et son mode d\u0027amarrage","Le niveau concerné, la façade et les particularités éventuelles","La pression d\u0027air restante et la position du binôme de sécurité"],"r":2,"e":"Une circulation permanente de l\u0027information doit être assurée entre les personnels engagés et ceux restés à l\u0027extérieur : les binômes engagés sont avisés de la mise en œuvre des itinéraires de secours avec leur localisation exacte (niveau concerné, dénomination de la façade, particularités éventuelles).","ref":"§ 2.2 Les itinéraires — p. 15","p":"Les binômes engagés sont avisés de la mise en œuvre des itinéraires de secours (localisation exacte : niveau concerné, dénomination de la façade, particularités éventuelles).","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027équipe","q":"Le binôme ne peut plus emprunter ni l\u0027itinéraire de repli ni l\u0027itinéraire de secours. Que préconise le guide ?","c":["Chercher une zone de mise à l\u0027abri des effets du sinistre","Se séparer afin de rechercher chacun une autre issue possible","Retirer les ARI pour progresser plus rapidement","Monter vers les étages supérieurs jusqu\u0027en toiture"],"r":0,"e":"En cas d\u0027impossibilité d\u0027emprunter l\u0027itinéraire de repli ou de secours, le binôme cherche une zone de mise à l\u0027abri des effets du sinistre : pièce, escalier encloisonné, couloir, espace d\u0027attente sécurisé (EAS) dans un ERP. Sauf circonstances exceptionnelles et imprévues, le binôme doit rester indissociable.","ref":"§ 2.2 Les itinéraires — p. 15","p":"En cas d\u0027impossibilité d\u0027emprunter l\u0027itinéraire de repli ou de secours, le binôme cherchera une zone de mise à l\u0027abri des effets du sinistre (pièce, escalier encloisonné, couloir, espaces d\u0027attente sécurisés (EAS) au sein d\u0027un ERP...).","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Équipier","q":"Pourquoi le guide interdit-il de disposer des balises lumineuses en ligne dans les volumes impactés par les fumées ?","c":["Elles gêneraient la lecture de la caméra thermique","Elles épuiseraient trop rapidement leurs batteries internes","Elles s\u0027échaufferaient et deviendraient inopérantes","Elles risqueraient de ne plus indiquer la bonne sortie"],"r":3,"e":"Les balises doivent être utilisées uniquement pour déterminer des issues. Disposées en ligne dans des volumes enfumés, elles créent un « effet Petit Poucet » dangereux qui pourrait ne plus indiquer la bonne sortie.","ref":"§ 2.2.1 La matérialisation des itinéraires — p. 15","p":"Il ne faut en aucun cas les disposer en ligne dans les volumes impactés par les fumées, sans quoi « l\u0027effet Petit Poucet » pourrait être dangereux et ne plus indiquer la bonne sortie.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Équipier","q":"Lors de la mise en place d\u0027une échelle à coulisse en itinéraire de secours, pourquoi augmente-t-on le piétage ?","c":["Pour que le haut de l\u0027échelle dépasse largement l\u0027appui de l\u0027ouvrant","Pour libérer un passage aux engins qui circulent le long de la façade","Pour adoucir la pente et amener le haut sous le rebord de l\u0027ouvrant","Pour permettre à deux sauveteurs d\u0027y monter simultanément sans risque"],"r":2,"e":"La mise en place consiste notamment à augmenter le piétage afin que la pente soit moins raide et que le haut de l\u0027échelle vienne juste en dessous du rebord de l\u0027ouvrant. L\u0027échelle est ensuite calée ou amarrée, et une balise verte est posée en partie haute, à l\u0027intérieur du local.","ref":"§ 2.2.2 L\u0027échelle à coulisse comme itinéraire de secours — p. 16","p":"augmenter le piétage afin que la pente présentée par l\u0027échelle soit moins raide et que le haut de l\u0027échelle vienne juste en-dessous du rebord de l\u0027ouvrant","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027agrès","q":"Un moyen élévateur aérien est positionné comme itinéraire de secours. Comment le guide prévoit-il d\u0027en garantir la permanence ?","c":["Par une balise lumineuse rouge posée en tête d\u0027échelle","Par une veille assurée par l\u0027échelier","Par un point radio régulier avec le chef d\u0027agrès","Par le repli de l\u0027échelle entre deux utilisations"],"r":1,"e":"Une fois positionné comme itinéraire de secours, le moyen élévateur aérien doit être uniquement dévolu à cette fonction, et la permanence de l\u0027itinéraire de secours doit être garantie par une veille de l\u0027échelier. Une balise rouge signale, elle, une zone de danger.","ref":"§ 2.2.1 Les moyens élévateurs aériens comme itinéraire de secours — p. 16","p":"Une fois positionné comme itinéraire de secours, le moyen élévateur aérien doit être uniquement dévolu à cette fonction. La permanence de l\u0027itinéraire de secours doit être garantie par une veille de l\u0027échelier.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Principes et itinéraires","niv":"Chef d\u0027équipe","q":"En situation dégradée dans un ERP, quel usage le guide prévoit-il des espaces d\u0027attente sécurisés (EAS) pour les sapeurs-pompiers ?","c":["S\u0027y réfugier et y attendre une aide extérieure","Y installer le point de rassemblement des intervenants","Y établir le poste de contrôle des porteurs d\u0027ARI","Y stocker le parc à matériel de proximité"],"r":0,"e":"Les EAS mettent à l\u0027abri des flammes, de la fumée et de la chaleur le public ne pouvant évacuer (personnes à mobilité réduite). Grâce à leur protection (portes et parois coupe-feu, éclairage de sécurité…), ils peuvent aussi servir de refuge aux sapeurs-pompiers en situation dégradée, dans l\u0027attente d\u0027une aide extérieure.","ref":"§ 2.2.2 Les espaces d\u0027attente sécurisés (EAS) — p. 17","p":"ces espaces peuvent donc être également utilisés par les sapeurs-pompiers en cas de situation dégradée, afin de s\u0027y réfugier et d\u0027y attendre une aide extérieure.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Signal d\u0027évacuation d\u0027urgence","niv":"Équipier","q":"Comment l\u0027ordre d\u0027évacuation générale est-il donné à la voix ou par radio ?","c":["« Évacuation – Évacuation – Évacuation »","« Urgent – Urgent – Urgent »","« Repli – Repli – Repli »","« Danger – Danger – Danger »"],"r":0,"e":"L\u0027ordre d\u0027évacuation générale peut s\u0027opérer à la voix ou par radio par « Évacuation – Évacuation – Évacuation », ou par un signal sonore (deux tons, corne de brume). La formule « Urgent » répétée trois fois introduit, elle, le message de détresse.","ref":"§ 3. Le signal d\u0027évacuation d\u0027urgence — p. 17","p":"L\u0027ordre d\u0027évacuation générale peut s\u0027opérer : à la voix, « Evacuation — Evacuation — Evacuation » ; par radio, « Evacuation — Evacuation — Evacuation » ; par un signal sonore (deux tons, corne de brume).","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Signal d\u0027évacuation d\u0027urgence","niv":"Équipier","q":"Dès que le signal d\u0027évacuation d\u0027urgence est actionné, que doivent faire les sapeurs-pompiers engagés ?","c":["Terminer leur action en cours puis se replier vers leur engin","Se mettre à l\u0027abri dans la pièce la plus proche et attendre","Se retirer sans délai et rejoindre le point de rassemblement","Rejoindre le binôme de sécurité au point de pénétration"],"r":2,"e":"Dès le signal actionné, les sapeurs-pompiers doivent sans délai se retirer du bâtiment et/ou de la zone d\u0027intervention pour rejoindre le point de rassemblement des intervenants, identifié par le chef d\u0027agrès ou le COS lors du point de situation, où un comptage est réalisé.","ref":"§ 3. Le signal d\u0027évacuation d\u0027urgence — p. 17","p":"Dès le signal actionné, les sapeurs-pompiers doivent sans délai se retirer du bâtiment et/ou de la zone d\u0027intervention pour rejoindre le point de rassemblement des intervenants","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Signal d\u0027évacuation d\u0027urgence","niv":"Chef d\u0027agrès","q":"Après le déclenchement du signal d\u0027évacuation d\u0027urgence, à qui le chef d\u0027agrès rend-il compte de la situation de son équipage ?","c":["Directement au CODIS par radio","Au COS ou au chef de secteur","À l\u0027officier de sécurité","Au chef d\u0027agrès du premier engin"],"r":1,"e":"Dès le signal actionné, les intervenants rejoignent le point de rassemblement où un comptage est réalisé, et chaque chef d\u0027agrès rend compte de la situation de son équipage au COS ou au chef de secteur.","ref":"§ 3. Le signal d\u0027évacuation d\u0027urgence — p. 17","p":"chaque chef d\u0027agrès rend compte de la situation de son équipage au COS ou au chef de secteur.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Signal d\u0027évacuation d\u0027urgence","niv":"Chef d\u0027équipe","q":"Après une évacuation d\u0027urgence, qui décide du réengagement des personnels sur la zone d\u0027opération ?","c":["Chaque chef d\u0027agrès pour son propre équipage","L\u0027officier sécurité ayant déclenché le signal","Le chef de secteur concerné par l\u0027évacuation","Le commandant des opérations de secours (COS)"],"r":3,"e":"Le réengagement de personnels sur la zone d\u0027opération s\u0027effectue sur ordre du COS. Le signal d\u0027évacuation peut être déclenché par le COS, l\u0027officier sécurité ou un chef de secteur, mais le réengagement, lui, relève de l\u0027ordre du COS.","ref":"§ 3. Le signal d\u0027évacuation d\u0027urgence — p. 17","p":"Le réengagement de personnels sur la zone d\u0027opération s\u0027effectue sur ordre du COS.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Chef d\u0027équipe","q":"Après un événement imprévu, le binôme fait un point rapide sur son état. À partir de cette analyse, quelles options le guide lui ouvre-t-il ?","c":["Tenter une évacuation ou se mettre en condition d\u0027attendre les secours","Poursuivre sa mission ou rejoindre au plus vite le binôme de sécurité","Attaquer le foyer ou rejoindre directement l\u0027itinéraire de secours","Retirer son ARI ou se raccorder sur la prise auxiliaire d\u0027un équipier"],"r":0,"e":"À partir de cette analyse, le binôme ou le sapeur-pompier dissocié peut tenter une évacuation (effort intense) ou se mettre en condition pour attendre les secours (économie d\u0027air). Il réévalue régulièrement la situation, notamment lors d\u0027un changement favorable ou défavorable des conditions.","ref":"§ Chapitre 2 (introduction) — p. 20","p":"A partir de cette analyse, il peut : tenter une évacuation (effort intense) ; se mettre en condition pour attendre les secours (économie d\u0027air).","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Équipier","q":"Dans le message de détresse construit selon le moyen mnémotechnique NELAR, que désigne la lettre A ?","c":["L\u0027adresse précise de l\u0027intervention en cours","L\u0027action menée par le binôme au moment de l\u0027incident","L\u0027autonomie restante ou la pression restante","L\u0027appel au binôme de sécurité avec réserve d\u0027air"],"r":2,"e":"NELAR : Nom de celui qui passe le message, Engin d\u0027affectation, Localisation, Autonomie restante ou à défaut pression restante dans chaque bouteille, Renfort nécessaire (qui, avec quoi) ou pas. Le message commence par « URGENT, URGENT, URGENT ».","ref":"§ 1.1 Le message de détresse — p. 20","p":"autonomie restante ou à défaut la pression restante dans chaque bouteille","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Chef d\u0027agrès","q":"Vous êtes chef d\u0027agrès et recevez le message de détresse NELAR d\u0027un de vos binômes. Que préconise le guide en réponse ?","c":["Répondre d\u0027un simple « reçu » afin de libérer la fréquence","Attendre la confirmation du COS avant de répondre au binôme","Lui demander de répéter son message pour bien le comprendre","Lui répéter son message pour confirmer sa prise en compte"],"r":3,"e":"Le message doit être répété par la personne qui l\u0027a réceptionné (COS, officier sécurité, chef d\u0027agrès…) à celui qui l\u0027a émis, pour lui faire comprendre que sa demande est bien prise en compte. Cette répétition diminue l\u0027état de stress de la victime.","ref":"§ 1.1 Le message de détresse — p. 20","p":"Le message doit être répété par la personne l\u0027ayant réceptionné (COS, officier sécurité, chef d\u0027agrès...) à celui qui l\u0027a émis, afin de lui faire comprendre que sa demande est bien prise en compte.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Équipier","q":"Dans la procédure AAALEERTER, à quel moment le sapeur-pompier en détresse déclenche-t-il la balise sonore de son ARI ?","c":["Une fois la détresse radio réalisée et répondue","Avant même de passer son message de détresse","Uniquement lorsque sa bouteille d\u0027air est totalement vide","Dès qu\u0027il entend approcher l\u0027équipe de sauvetage"],"r":0,"e":"Dans AAALEERTER, l\u0027action « Alarme » consiste à déclencher la balise sonore de l\u0027ARI une fois la détresse radio réalisée et répondue. Cette procédure s\u0027applique à partir du moment où le message de détresse a été lancé.","ref":"§ 1.2 L\u0027attente des secours — p. 21","p":"Une fois la détresse radio réalisée et répondue, je déclenche la balise sonore de mon ARI.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Équipier","q":"Dans l\u0027attente des secours, dans quel cas le guide admet-il le retrait de la soupape à la demande (SAD) ?","c":["Dès le déclenchement du sifflet de fin de charge de l\u0027ARI","En dernier recours, sans air ni raccordement à l\u0027équipier","Dès qu\u0027il faut économiser l\u0027air de sa bouteille","Dès qu\u0027il faut communiquer à la voix avec l\u0027extérieur"],"r":1,"e":"Le retrait de la SAD n\u0027intervient qu\u0027en dernier recours, quand la bouteille est vide et que l\u0027équipier n\u0027a plus d\u0027air ou qu\u0027on ne peut se raccorder sur sa prise auxiliaire, car il expose à l\u0027intoxication par les fumées. On remonte alors le bas de la cagoule sur le masque et on respire au plus près du sol.","ref":"§ 1.2 L\u0027attente des secours — p. 21","p":"Le retrait de la soupape à la demande ne doit être réalisé qu\u0027en dernier recours pour éviter un étouffement du porteur car il le soumet à un risque d\u0027intoxication par les fumées.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Détresse et attente des secours","niv":"Équipier","q":"En quoi consiste l\u0027« auto-packaging » conseillé au sapeur-pompier en détresse avant une éventuelle perte de conscience ?","c":["Serrer au maximum les bretelles et la ceinture de son ARI","Attacher la ligne guide à son ceinturon de maintien","Passer soi-même sa sangle ventrale sous la cuisse","Rassembler son matériel et ses outils contre soi"],"r":2,"e":"Avant de perdre conscience, il est conseillé d\u0027orienter son projecteur vers l\u0027arrivée présumée de l\u0027équipe de sauvetage et de faire son « auto-packaging » en passant soi-même sa sangle ventrale sous la cuisse, pour préparer son extraction et faire gagner du temps aux sauveteurs.","ref":"§ 1.2 L\u0027attente des secours — p. 21","p":"faire son « auto-packaging », en passant soi-même sa sangle ventrale sous la cuisse pour préparer son extraction et faire gagner du temps à l\u0027équipe de sauvetage.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Franchissement d\u0027obstacles","niv":"Chef d\u0027équipe","q":"Avant de franchir un obstacle, le guide demande d\u0027en évaluer les dimensions, la nature, la solidité et…","c":["la température de surface de l\u0027obstacle à franchir","la stabilité de la structure après l\u0027obstacle","la distance restante jusqu\u0027au point de sortie","le temps nécessaire au franchissement"],"r":1,"e":"Avant de franchir un obstacle, il faut en évaluer les dimensions (le contourner ou passer à travers), la nature, la solidité (risque d\u0027effondrement lors du franchissement) et la stabilité de la structure après l\u0027obstacle (trou, plancher instable…).","ref":"§ Chapitre 2 (introduction) — p. 20","p":"la solidité (risque d\u0027effondrement lors du franchissement) ; la stabilité de la structure après l\u0027obstacle (trou, plancher instable, etc.).","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Franchissement d\u0027obstacles","niv":"Équipier","q":"Pour progresser au sol sous des fils ou des câbles, pourquoi le guide recommande-t-il de privilégier l\u0027allongement sur le flanc gauche ?","c":["Pour protéger le manomètre contre les chocs et l\u0027écrasement","Pour garder la main droite libre pour tenir la lance","Pour ne pas arracher le flexible de la SAD","Pour éviter la fermeture du robinet de la bouteille"],"r":3,"e":"Pour passer des fils ou câbles, il faut être le plus lisse possible, passer dessous au plus près du sol et s\u0027aider des bras ou d\u0027un outil. L\u0027allongement sur le flanc gauche est privilégié afin d\u0027éviter la fermeture du robinet de bouteille pendant la progression.","ref":"§ 2. Le passage dans des fils ou des câbles — p. 23","p":"Privilégier l\u0027allongement au sol sur le flanc gauche, afin d\u0027éviter la fermeture du robinet de bouteille lors de la progression.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Franchissement d\u0027obstacles","niv":"Équipier","q":"Quel avantage le guide attribue-t-il à la technique de passage en avant pour franchir une trouée ou un passage étroit ?","c":["Elle permet d\u0027engager la bouteille d\u0027air en premier","Elle ne nécessite pas le desserrage des sangles","Elle convient mieux aux personnes corpulentes","Elle évite toute reconnaissance du volume suivant"],"r":1,"e":"La technique de passage en avant conserve la marche « en avant » et a l\u0027avantage de ne pas nécessiter le desserrage des sangles. Les personnes corpulentes seront plus avantagées avec le passage sur le dos, qui commence par engager la bouteille d\u0027air.","ref":"§ 3. Le franchissement d\u0027un passage étroit — p. 23","p":"La technique de passage en avant permet de franchir une trouée ou un passage étroit en conservant la marche « en avant ». Elle a l\u0027avantage de ne pas nécessiter le desserrage des sangles pour franchir l\u0027obstacle.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Franchissement d\u0027obstacles","niv":"Chef d\u0027équipe","q":"Un équipier envisage de retirer son ARI pour franchir un passage étroit. Selon le guide, quand cette technique est-elle admise ?","c":["En priorité, car c\u0027est la technique la plus rapide","Dès que le passage est plus étroit que les épaules","En dernier recours, si les autres techniques échouent","Uniquement lorsque sa bouteille est presque vide d\u0027air"],"r":2,"e":"Le retrait de l\u0027ARI ne s\u0027emploie qu\u0027en dernier recours, si le passage est irréalisable avec les autres techniques : le rééquipement est compliqué par le noir, le confinement et le stress, et la bouteille risque de se fermer par frottement avec le sol.","ref":"§ 4. Le retrait de l\u0027appareil respiratoire isolant — p. 24","p":"Cette technique ne doit être mise en œuvre qu\u0027en dernier recours si le passage de l\u0027obstacle n\u0027est pas réalisable avec les autres techniques.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Équipier","q":"Selon le guide, jusqu\u0027à quelle valeur un porteur d\u0027ARI peut-il réduire sa consommation d\u0027air en mode « économie d\u0027air » ?","c":["10 l/min","25 l/min","40 l/min","70 l/min"],"r":0,"e":"La consommation varie selon l\u0027effort : jusqu\u0027à 135 l/min pour un effort très intense, 90 ou 100 l/min pour un effort intense, entre 40 et 70 l/min pour un effort modéré. En mode « économie d\u0027air », le porteur peut la réduire jusqu\u0027à 10 l/min.","ref":"§ 5.1 Économiser l\u0027air — p. 25","p":"en mode « économie d\u0027air », le porteur peut réduire sa consommation jusqu\u0027à 10 l/min.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Équipier","q":"En quoi consiste la méthode respiratoire dite « 2/4 » décrite par le guide ?","c":["Inspirer sur 4 secondes, puis expirer sur 2 secondes","Inspirer sur 2 secondes, puis retenir son souffle 4 secondes","Deux inspirations brèves, puis quatre secondes d\u0027apnée","Inspirer sur 2 secondes, puis expirer sur 4 secondes"],"r":3,"e":"La méthode 2/4 consiste à inspirer sur une période de 2 secondes, expirer sur une période de 4 secondes, puis recommencer le cycle. Pour être efficaces, ces techniques doivent avoir été testées au préalable et travaillées régulièrement, avec et sans effort.","ref":"§ 5.2.1 Les techniques de respiration — p. 27","p":"Inspirer sur une période de 2 sec. ; 2. Expirer sur une période de 4 sec. ; 3. Recommencer le cycle.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Chef d\u0027équipe","q":"Le binôme, en attente des secours, entend son sifflet de fin de charge. Comment le guide propose-t-il de limiter l\u0027air « perdu » par ce sifflet ?","c":["En appuyant régulièrement sur le by-pass","En coiffant le sifflet avec son gant","En desserrant légèrement la sangle du masque","En réglant le détendeur sur une pression réduite"],"r":1,"e":"Le sifflet, déclenché lorsque la pression atteint 50 bar, consomme 4 à 7 litres par minute selon les modèles : cet air « perdu » compte en attente des secours. On peut réduire cet impact en coiffant le sifflet avec son gant ou en appliquant la technique de gestion d\u0027une fuite d\u0027air.","ref":"§ 5.2.2 L\u0027impact du sifflet — p. 27","p":"Il est possible de réduire cet impact en coiffant le sifflet avec son gant ou en appliquant la technique de gestion d\u0027une fuite d\u0027air décrite plus loin.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Chef d\u0027équipe","q":"Pour secourir un sapeur-pompier en difficulté avec son matériel respiratoire, laquelle de ces techniques le guide cite-t-il ?","c":["Le partage alterné d\u0027un même masque entre équipiers","Le retrait de la SAD pour respirer l\u0027air ambiant","L\u0027ouverture continue du by-pass de la victime","Le changement de dossard et/ou de masque"],"r":3,"e":"Le guide cite l\u0027assistance au moyen d\u0027une prise accessoire de l\u0027ARI d\u0027un équipier, l\u0027utilisation d\u0027une cagoule respiratoire, le changement de dossard et/ou de masque et l\u0027emploi d\u0027un lot d\u0027assistance respiratoire. Le retrait de la SAD n\u0027est qu\u0027un geste de dernier recours, faute d\u0027air.","ref":"§ 5.3 L\u0027assistance respiratoire du porteur — p. 27","p":"l\u0027assistance respiratoire au moyen d\u0027une prise accessoire de l\u0027ARI d\u0027un des équipiers ; l\u0027utilisation d\u0027une cagoule respiratoire ; le changement de dossard et/ou de masque ; l\u0027emploi d\u0027un lot d\u0027assistance respiratoire.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Chef d\u0027équipe","q":"La partie faciale d\u0027un équipier est endommagée et fuit. Quelle technique le guide prévoit-il pour maîtriser cette fuite d\u0027air ?","c":["Ouvrir le robinet 1/4 de tour, inspirer, puis le refermer","Laisser le robinet ouvert et appliquer la méthode Reilly","Fermer le robinet et respirer l\u0027air filtré par la cagoule","Maintenir le by-pass ouvert en continu jusqu\u0027à la sortie"],"r":0,"e":"Lors d\u0027un bris d\u0027équipement (partie faciale, tuyau, détendeur…), la fuite est maîtrisée en contrôlant le débit avec le robinet de la bouteille : ouvrir 1/4 de tour seulement et inspirer, fermer et retenir sa respiration jusqu\u0027au seuil de limite, expirer lentement, puis recommencer le cycle.","ref":"§ 5.4 La gestion d\u0027une fuite d\u0027air — p. 28","p":"ouvrir le robinet de la bouteille (1/4 de tour seulement) et inspirer (I) ; 2. fermer le robinet de la bouteille et retenir sa respiration (R) jusqu\u0027au seuil de limite ; 3. expirer lentement (E)","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Équipier","q":"Quel est l\u0027objet de la technique d\u0027évacuation d\u0027urgence dite du « bail-out » ?","c":["Descendre une victime inconsciente sur une échelle, pieds en avant","Remonter un équipier tombé dans une excavation avec un tuyau","Évacuer par une fenêtre un volume embrasé, en tenue de feu","Transférer l\u0027air d\u0027un ARI plein vers un ARI presque vide"],"r":2,"e":"Le « bail-out » facilite l\u0027évacuation d\u0027un volume embrasé par une fenêtre en tenue de feu complète, limite l\u0027exposition au flux thermique et réduit le temps d\u0027évacuation. L\u0027échelle à coulisse, amarrée ou calée, est positionnée en itinéraire de secours, avec un pied d\u0027échelle augmenté.","ref":"§ 6.1 L\u0027évacuation par une fenêtre ou « bail-out » — p. 28","p":"Cette technique permet de : faciliter l\u0027évacuation d\u0027un volume embrasé par une fenêtre en tenue de feu complète ; limiter l\u0027exposition du sapeur-pompier au flux thermique ; réduire le temps d\u0027évacuation.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Gestion de l\u0027air et évacuation","niv":"Chef d\u0027équipe","q":"Face à un danger imminent, le binôme doit s\u0027extraire par l\u0027extérieur au moyen de son tuyau, qui est vide. Que préconise le guide pour l\u0027amarrage ?","c":["Mettre le tuyau en eau avant toute descente","Faire un nœud simple en amont de l\u0027amarrage","Amarrer le tuyau au niveau d\u0027un raccord","Doubler le tuyau sur toute sa longueur"],"r":1,"e":"Le tuyau est amarré au préalable ; s\u0027il est vide, on effectue un nœud simple en amont de l\u0027amarrage. Il faut veiller à la place du raccord et éviter d\u0027attacher le tuyau à son niveau.","ref":"§ 6.2 L\u0027évacuation par l\u0027extérieur au moyen d\u0027un tuyau — p. 29","p":"Si le tuyau est vide, effectuer un nœud simple en amont de l\u0027amarrage. Il est important de veiller à la place du raccord et éviter d\u0027attacher le tuyau au niveau de celui-ci.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027agrès","q":"Selon le guide, quel risque la dimension émotionnelle du sauvetage d\u0027un collègue fait-elle peser sur les équipes présentes ?","c":["Un excès de prudence retardant l\u0027engagement des sauveteurs","Un refus collectif de s\u0027engager dans le volume sinistré","Une banalisation de l\u0027événement par les équipes sur place","Des réactions inappropriées : sidération, auto-engagement"],"r":3,"e":"Le sauvetage d\u0027un collègue génère un stress et une empathie qui peuvent prendre le pas sur le respect des procédures. Cela peut aboutir à des réactions inappropriées, voire à des phénomènes de sidération ou d\u0027auto-engagement compromettant la sécurité et la poursuite de l\u0027intervention.","ref":"§ Chapitre 3 (introduction) — p. 32","p":"L\u0027aspect psychologique peut aboutir à des réactions inappropriées des équipes présentes sur place, voire à des phénomènes de sidération ou d\u0027auto-engagements qui peuvent compromettre la sécurité et la poursuite de l\u0027intervention.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027agrès","q":"Vous désignez un binôme de sauvetage. En dessous de quelle pression d\u0027engagement sa capacité en air ne doit-elle pas descendre ?","c":["200 bar","250 bar","270 bar","280 bar"],"r":2,"e":"La capacité en air du binôme de sauvetage doit être à son maximum, sans descendre en dessous de la pression d\u0027engagement de 270 bar, au regard de l\u0027effort à fournir : stress de la mission, possibilité d\u0027assister en air le sapeur-pompier victime.","ref":"§ Chapitre 3 (introduction) — p. 33","p":"la capacité en air du binôme de sauvetage doit être à son maximum sans descendre en dessous de la pression d\u0027engagement de 270 bar, au regard de l\u0027effort qui risque d\u0027être fourni","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027agrès","q":"La mission d\u0027un binôme de sauvetage engagé pour un sapeur-pompier en difficulté peut-elle être couplée à une autre mission ?","c":["Non, sa mission est exclusive et prioritaire","Oui, avec une reconnaissance sur le même cheminement","Oui, avec l\u0027attaque du foyer menaçant la victime","Non, sauf sur ordre du COS pour une reconnaissance"],"r":0,"e":"Le binôme de sauvetage a une mission exclusive et prioritaire : le sauvetage d\u0027un ou de sapeurs-pompiers. En aucun cas sa mission ne peut être couplée avec une mission de reconnaissance ou d\u0027attaque.","ref":"§ Chapitre 3 (introduction) — p. 33","p":"Le binôme de sauvetage a une mission exclusive et prioritaire : le sauvetage d\u0027un/de sapeurs-pompiers. En aucun cas sa mission ne peut être couplée avec une mission de reconnaissance ou d\u0027attaque.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027équipe","q":"Votre équipier est en difficulté. Lors de son évaluation, quel geste le guide associe-t-il à l\u0027évaluation de sa conscience ?","c":["Un retrait bref de son masque","Un appui bref sur le by-pass","Une fermeture brève de son robinet","Un desserrage de ses bretelles d\u0027ARI"],"r":1,"e":"Le sauveteur évalue la situation et le risque de sur-accident, évalue la conscience en faisant un appui bref sur le by-pass, évalue la respiration (bruits, buée dans le masque, mouvements respiratoires), vérifie les équipements (flexibles, pression) et lance un message de détresse NELAR.","ref":"§ 1.1 L\u0027évaluation et la stabilisation d\u0027un équipier en difficulté — p. 33","p":"évaluer la conscience et faire un appui bref sur le by-pass","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027équipe","q":"Lors de l\u0027abordage d\u0027un équipier blessé ou inconscient, que faut-il réaliser selon le guide ?","c":["Le retrait systématique de son ARI, puis un bilan secouriste complet","Le déshabillage complet de sa tenue de feu avant tout déplacement","Un bilan complet sur place avant toute mesure de dégagement","Un bilan rapide, une assistance en air si besoin, le packaging"],"r":3,"e":"L\u0027abordage est la première étape de prise en charge : faire un premier bilan et préparer le dégagement, par un rapide bilan secouriste, une assistance en air si besoin (flexible de transmission d\u0027ARI à ARI ou lot d\u0027assistance) et le « packaging » pour faciliter l\u0027extraction.","ref":"§ 1.1.1 L\u0027abordage de la victime — p. 34","p":"Il est pour cela nécessaire de faire un rapide bilan secouriste, de l\u0027assister en air si besoin et de faire le « packaging » pour faciliter son extraction.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Équipier","q":"Qu\u0027appelle-t-on le « packaging » d\u0027un sapeur-pompier en difficulté ?","c":["Son conditionnement sur une planche de sauvetage","La conversion de son dossard d\u0027ARI en harnais","Le retrait complet de son ARI avant la traction","Son enveloppement dans une couverture de survie"],"r":1,"e":"Le packaging consiste à convertir le dossard d\u0027ARI du sauveteur en difficulté en harnais. Cette conversion facilite l\u0027opération de traction et donc son évacuation.","ref":"§ 1.1.2 La conversion du dossard d\u0027ARI en harnais ou packaging — p. 34","p":"Le packaging permet de faciliter l\u0027évacuation d\u0027un sauveteur en difficulté en convertissant son dossard d\u0027ARI en harnais.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage : engagement, abordage","niv":"Chef d\u0027équipe","q":"Dans quelle situation le guide envisage-t-il le retrait du harnais de l\u0027ARI d\u0027un sapeur-pompier victime ?","c":["Victime consciente et capable de se déplacer seule","Bouteille encore à plus de la moitié de sa pression","Obligation de passer dans des passages étroits","Traction au sol sur un cheminement court et dégagé"],"r":2,"e":"Le retrait du harnais allège l\u0027ensemble et peut faciliter l\u0027extraction. Il est envisageable s\u0027il n\u0027y a plus d\u0027air dans la bouteille et que l\u0027assistance en air est impossible, en cas d\u0027obligation de passer dans des passages étroits, ou pour une extraction par un ouvrant donnant à l\u0027air libre.","ref":"§ 1.1.3 Le retrait du harnais de l\u0027ARI — p. 34","p":"Le retrait du harnais peut faciliter l\u0027extraction de la victime en allégeant l\u0027ensemble, il est envisageable dans certains cas : plus d\u0027air dans la bouteille et assistance en air impossible, obligation de passer dans des passages étroits","s":"gto-sauvg"},
