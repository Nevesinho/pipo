{"t":"gto-sauvg","ch":"Sauvetage par un binôme","niv":"Chef d\u0027équipe","q":"Dans quelle situation la traction d\u0027un pompier « victime » au moyen de la hache Halligan est-elle décrite comme très efficace ?","c":["Dans le franchissement d\u0027un trou de plancher","Dans la descente sur une échelle à coulisse","Dans le passage sous des fils ou des câbles","Dans la montée ou la descente d\u0027un escalier"],"r":3,"e":"Le manche de la hache Halligan, engagé dans les bretelles du dossard, permet une traction avec un support rigide ; le packaging est nécessaire. Cette technique est très efficace dans la montée ou la descente d\u0027un escalier.","ref":"§ 2.1.1 La technique avec la hache Halligan tool — p. 36","p":"La hache est engagée dans les bretelles du dossard et permet une traction avec un support rigide. Le packaging est nécessaire. Cette technique est très efficace dans la montée ou la descente d\u0027un escalier.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage par un binôme","niv":"Chef d\u0027équipe","q":"Le binôme de sauvetage doit extraire un collègue dans un couloir trop étroit pour s\u0027y tenir côte à côte. Quelle technique de traction le guide propose-t-il ?","c":["La traction parallèle","La hache Halligan","Le « tirer-pousser »","Le « Nance drill »"],"r":2,"e":"Le « tirer-pousser » (« push and pull ») s\u0027utilise dans un environnement étroit, tel un couloir, où les sauveteurs n\u0027ont pas la place de se tenir l\u0027un à côté de l\u0027autre : l\u0027un tire, l\u0027autre pousse, la victime se déplaçant d\u0027un seul bloc. Le packaging est nécessaire.","ref":"§ 2.1.3 La technique du « tirer-pousser » — p. 36","p":"Cette technique appelée aussi « push and pull » s\u0027utilise dans un environnement étroit tel qu\u0027un couloir, où les sauveteurs n\u0027auraient pas la place de se tenir l\u0027un à côté de l\u0027autre pour tracter la victime.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage par un binôme","niv":"Équipier","q":"Pour faire monter un escalier à un sapeur-pompier victime, comment se répartissent les deux sauveteurs selon le guide ?","c":["L\u0027un saisit le dossard de l\u0027ARI, l\u0027autre se place sous ses genoux","Les deux saisissent le dossard, victime face contre le sol","L\u0027un tire la victime par les bras, l\u0027autre pousse ses pieds","L\u0027un porte la victime sur son dos, l\u0027autre la sécurise par derrière"],"r":0,"e":"Pour monter, un sauveteur saisit le dossard de l\u0027ARI et un deuxième se place sous les genoux du pompier en difficulté. Pour descendre, la victime a la face contre le sol et les deux sauveteurs saisissent le dossard de l\u0027ARI.","ref":"§ 2.2 L\u0027évacuation par l\u0027escalier — p. 37","p":"Pour monter, un sauveteur saisit le dossard de l\u0027ARI. Un deuxième se place sous les genoux du pompier en difficulté.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage par un binôme","niv":"Chef d\u0027agrès","q":"Combien de sauveteurs la technique dite « Denver drill » nécessite-t-elle selon le guide ?","c":["Deux, tous deux dans le volume de la victime","Trois, dont deux dans le volume de la victime","Quatre, dont deux hors du volume de la victime","Trois, tous hors du volume de la victime"],"r":1,"e":"Le « Denver drill » se réalise à trois sauveteurs, dont deux dans le volume où se trouve la victime. Il exige un engagement physique important : le choix du personnel désigné et sa capacité en air doivent être pris en compte par le COS, et un entraînement régulier est nécessaire.","ref":"§ 2.3 La technique dite de « Denver Drill » — p. 37","p":"Cette technique se réalise à trois sauveteurs, dont deux sauveteurs dans le volume concerné où réside la victime. Pour être maîtrisée, elle nécessite un entraînement régulier.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Sauvetage par un binôme","niv":"Chef d\u0027agrès","q":"Dans quel cas l\u0027emploi d\u0027une planche de sauvetage pour extraire un sapeur-pompier se justifie-t-il selon le guide ?","c":["Un cheminement long et complexe, avec gravats ou dénivelés","Une extraction de quelques mètres dans un couloir dégagé","Une victime consciente et encore capable de se déplacer seule","Une traction rapide sur un sol plan et sans obstacle"],"r":0,"e":"La planche de sauvetage glisse sur tous les types de sol, les escaliers et les échelles, et reste dirigeable dans toutes les directions. Son emploi se justifie pour un cheminement long et complexe, avec des gravats, des virages ou des différences de niveaux ; elle est également adaptée au milieu confiné.","ref":"§ 2.4 L\u0027évacuation avec du matériel de transport — p. 38","p":"L\u0027emploi de ce matériel de sauvetage se justifie pour un cheminement long et complexe, avec des gravats, des virages ou des différences de niveaux.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Dernier recours et déshabillage","niv":"Équipier","q":"Lors de l\u0027évacuation d\u0027un sapeur-pompier sur une échelle à coulisse par la technique « pieds en avant », que devient son ARI ?","c":["Il est conservé avec le masque pendant la descente","Il est conservé, mais le masque est retiré","Il est attaché aux jambes de la victime","Il est retiré avant la mise sur l\u0027échelle"],"r":3,"e":"Dans la technique « pieds en avant », le sauveteur sur l\u0027échelle pose les jambes de la victime sur ses épaules et descend en tenant les montants ; l\u0027ARI de l\u0027équipier à descendre est préalablement retiré. À l\u0027inverse, en descente latérale, la victime garde son ARI et son masque.","ref":"§ 3.1.1 La technique : pieds en avant — p. 39","p":"L\u0027ARI de l\u0027équipier à descendre est préalablement retiré.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Dernier recours et déshabillage","niv":"Chef d\u0027équipe","q":"La technique de remontée au moyen d\u0027un tuyau d\u0027un équipier tombé dans une excavation s\u0027adresse à quel type d\u0027équipier ?","c":["Un équipier conscient et valide","Un équipier inconscient muni de son ARI","Un équipier blessé aux membres inférieurs","Un équipier ayant dû retirer son ARI"],"r":0,"e":"Cette technique de dernier recours permet, au moyen d\u0027un tuyau formant une ganse, de remonter à la force des bras ou de sécuriser un co-équipier conscient et valide, en maintenant au besoin une protection hydraulique. Le dégagement d\u0027un pompier inconscient par un trou relève du « Nance drill ».","ref":"§ 3.2 La remontée d\u0027un équipier tombé dans une excavation — p. 40","p":"Cette technique de dernier recours permet au moyen d\u0027un tuyau de remonter ou de sécuriser un co-équipier conscient et valide tombé dans une excavation ou autres, elle permet également de maintenir une protection hydraulique au besoin.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Dernier recours et déshabillage","niv":"Chef d\u0027agrès","q":"Combien de pompiers au minimum le guide juge-t-il nécessaires pour réaliser la remontée d\u0027une victime par la technique du « Nance drill » ?","c":["Deux","Trois","Quatre","Six"],"r":2,"e":"Le « Nance drill » utilise un tuyau en eau sous pression dont la boucle, envoyée par le trou, enveloppe la victime munie de son ARI ; un sauveteur descend réaliser les amarrages. Un minimum de 4 pompiers est nécessaire pour réaliser la remontée dans de bonnes conditions.","ref":"§ 3.3 L\u0027évacuation par la technique de « Nance Drill » — p. 41","p":"Un minimum de 4 pompiers est nécessaire pour réaliser la remontée dans de bonnes conditions.","s":"gto-sauvg"},
{"t":"gto-sauvg","ch":"Dernier recours et déshabillage","niv":"Chef d\u0027équipe","q":"Déshabillage d\u0027un sauveteur inconscient en tenue de feu : à l\u0027annonce « prêt », quel est le rôle du sauveteur placé entre les jambes ?","c":["Il soulève la victime par la ceinture ventrale","Il retire le masque en coupant la SAD","Il maintient fermement les manches vers l\u0027arrière","Il tire le bas du pantalon en reculant"],"r":3,"e":"La technique se réalise à deux sauveteurs minimum, l\u0027un à la tête (T), l\u0027autre entre les jambes (J). (T) tient fermement les manches vers l\u0027arrière et annonce « prêt » ; (J), qui tient le bas des jambes du pantalon textile, tire alors en arrière en reculant.","ref":"§ Annexe B Déshabillage d\u0027un sauveteur inconscient — p. 45","p":"(T) attrape fermement les manches, les positionne vers l\u0027arrière et annonce «prêt». (J) attrape fermement le bas des jambes du pantalon textile. À l\u0027indication « prêt », (J) tire en arrière en reculant.","s":"gto-sauvg"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Équipier","q":"Selon le guide, l\u0027apport d\u0027air provoqué par la création d\u0027un ouvrant illustre quelle cause d\u0027évolution d\u0027une situation opérationnelle ?","c":["Une évolution naturelle, sans intervention humaine","Une évolution liée aux seules conditions météo","Une évolution consécutive aux actions de secours","Une évolution due à la panique des occupants"],"r":2,"e":"Le guide distingue les évolutions naturelles, sans intervention humaine (par exemple un changement de direction du vent), et celles qui résultent des actions de secours mises en œuvre, dont l\u0027apport d\u0027air par création d\u0027ouvrant est l\u0027exemple donné.","ref":"§ La complexité et le dynamisme d\u0027une opération (chap. 1) — p. 15","p":"soit naturellement (sans intervention humaine ; par exemple à cause du changement de direction du vent), soit à la suite des actions de secours mises en œuvre (apport d\u0027air par création d\u0027ouvrant par exemple)","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Chef d\u0027équipe","q":"Selon le guide, quelle particularité d\u0027une opération de secours traduit le fait que le COS n\u0027accède souvent au sinistre qu\u0027à partir du sol ?","c":["La vision partielle du problème","La non-prédictibilité du résultat","La singularité des opérations","L\u0027exposition aux risques"],"r":0,"e":"C\u0027est la vision partielle du problème : le COS n\u0027accède souvent au sinistre qu\u0027à partir du sol, dans son champ de vision. Cette vision parcellaire limite l\u0027accès aux informations et aux signaux et complique la compréhension globale du problème.","ref":"§ La vision partielle du problème (chap. 1) — p. 16","p":"La vision partielle du problème […] le COS n\u0027a souvent accès au sinistre qu\u0027à partir du sol, dans son champ de vision. Il ne perçoit que des parties morcelées du sinistre.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès, vous intervenez pour un feu de même nature, dans le même immeuble qu\u0027il y a un mois. Selon le guide, quelle attitude devez-vous adopter ?","c":["Reprendre à l\u0027identique la manœuvre qui avait réussi","Alléger la reconnaissance puisque les lieux sont connus","Appliquer tel quel le PEX du précédent feu","Vous prémunir de toute routine : chaque opération est unique"],"r":3,"e":"Chaque opération de secours est unique, même si elle ressemble à une autre par sa thématique ou sa localisation. Le COS peut s\u0027appuyer sur son expérience et sur les PEX ou RETEX, mais il doit systématiquement se prémunir de toute forme de routine.","ref":"§ La singularité des opérations (chap. 1) — p. 17","p":"Chaque opération de secours est unique. […] Si le COS peut s\u0027appuyer sur son expérience et sa connaissance notamment de partages d\u0027expériences (PEX) et/ou de retours d\u0027expérience (RETEX), il devra systématiquement se prémunir de toute forme de routine.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Équipier","q":"Selon le guide, quelle autorité assure la direction des opérations de secours (DOS) ?","c":["Le directeur départemental du SIS","Le chef de salle du CODIS","Le premier COS arrivé sur les lieux","Le maire ou le préfet, selon leurs pouvoirs de police"],"r":3,"e":"Le DOS est le maire ou le préfet, agissant dans le cadre de leurs pouvoirs de police respectifs. Le commandement des opérations de secours, placé sous leur autorité, relève du directeur départemental du SIS ou, en son absence, d\u0027un sapeur-pompier dans les conditions fixées par le règlement opérationnel.","ref":"§ Annexe A Abréviations utilisées dans ce guide — p. 87","p":"Directeur des opérations de secours, maire ou préfet.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Équipier","q":"Selon le guide, qui est généralement le premier commandant des opérations de secours (COS) d\u0027une opération ?","c":["Le chef de groupe","Le chef d\u0027agrès","L\u0027officier de garde du CODIS","Le chef de centre"],"r":1,"e":"Le chef d\u0027agrès, qui dirige un agrès composé d\u0027une ou de plusieurs équipes, est généralement le premier COS d\u0027une opération. Il peut également être l\u0027adjoint d\u0027un chef de groupe.","ref":"§ 5.1.2 Le chef d\u0027agrès (chap. 2) — p. 28","p":"Le chef d\u0027agrès […] Il peut être l\u0027adjoint d\u0027un chef de groupe. C\u0027est généralement le premier COS d\u0027une opération.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès, vous êtes COS d\u0027une opération. Selon le guide, jusqu\u0027à quel engagement de moyens pouvez-vous la commander ?","c":["Jusqu\u0027à l\u0027engagement d\u0027un agrès en plus du vôtre","Jusqu\u0027à l\u0027engagement de deux agrès en plus du vôtre","Jusqu\u0027à l\u0027engagement d\u0027un groupe complet d\u0027agrès","Uniquement tant que seul votre agrès est engagé"],"r":0,"e":"Le chef d\u0027agrès peut commander une opération nécessitant jusqu\u0027à l\u0027engagement d\u0027un agrès en plus du sien et/ou jusqu\u0027à l\u0027arrivée de l\u0027échelon supérieur. Le chef de groupe, lui, conduit un groupe de 2 à 4 agrès.","ref":"§ 5.1.2 Le chef d\u0027agrès (chap. 2) — p. 28","p":"Il peut commander une opération de secours nécessitant jusqu\u0027à l\u0027engagement d\u0027un agrès en plus du sien et/ou jusqu\u0027à l\u0027arrivée de l\u0027échelon supérieur.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Caractéristiques et organisation","niv":"Chef d\u0027agrès","q":"Vous êtes COS et une équipe spécialisée (GRIMP) arrive en renfort. Selon le guide, quelle est la place de son chef de détachement ?","c":["Il prend le commandement de l\u0027opération à votre place","Il agit sous votre autorité, vous conseille et rend compte","Il agit en autonomie, hors de votre idée de manœuvre","Il ne rend compte qu\u0027à son propre conseiller technique"],"r":1,"e":"Le chef de détachement d\u0027une spécialité agit sous l\u0027autorité du COS : il le conseille, inscrit l\u0027action de ses moyens dans l\u0027idée de manœuvre générale et rend compte systématiquement au COS ou à un chef de secteur. Les fonctions de chef de détachement et de COS doivent être dissociées.","ref":"§ 5.2.2 Les spécialités opérationnelles (chap. 2) — p. 30","p":"Sous l\u0027autorité du commandant des opérations de secours, le chef de détachement de la spécialité opérationnelle a pour mission : de conseiller le COS ; d\u0027inscrire l\u0027action de ses moyens spécialisés dans l\u0027idée de manœuvre générale","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Équipier","q":"Selon le guide, lors de la vérification de l\u0027engin à la prise de garde, que faut-il contrôler en plus de la présence des outils ?","c":["Leur date de fabrication et de mise en service","Leur numéro d\u0027inventaire et leur affectation","Leur conformité au catalogue du fabricant","Leur bon état et/ou leur bon fonctionnement"],"r":3,"e":"La vérification ne se limite pas à un contrôle visuel de présence : elle doit aussi s\u0027assurer du bon état des matériels (propreté de l\u0027agrès, tuyaux bien roulés, lance en position fermée…) et/ou de leur bon fonctionnement. Elle permet aussi de se remémorer l\u0027emplacement des matériels pour gagner du temps en opération.","ref":"§ 6.1 La vérification des matériels et EPI (chap. 2) — p. 31","p":"Cette vérification ne doit pas se limiter à un contrôle visuel de présence des outils, mais doit aussi permettre de s\u0027assurer de leur bon état (propreté de l\u0027agrès, tuyaux bien roulés, lance en position fermée, etc.) et/ou bon fonctionnement","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Équipier","q":"Selon le guide, quelles sont les cinq qualités physiques fondamentales que le sapeur-pompier doit développer ou entretenir ?","c":["Force, endurance, souplesse, adresse et vitesse","Force, endurance, équilibre, coordination et vitesse","Force, résistance, souplesse, équilibre et puissance","Endurance, puissance, adresse, agilité et réactivité"],"r":0,"e":"L\u0027activité opérationnelle exige des qualités physiques pour supporter les contraintes du métier. Le guide retient cinq qualités fondamentales : la force, l\u0027endurance, la souplesse, l\u0027adresse et la vitesse.","ref":"§ 6.2 Le maintien d\u0027une condition physique adaptée (chap. 2) — p. 31","p":"le sapeur-pompier doit veiller au développement et/ou à l\u0027entretien des cinq qualités physiques fondamentales que sont la force, l\u0027endurance, la souplesse, l\u0027adresse et la vitesse.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Chef d\u0027équipe","q":"Selon le guide, dans quel but l\u0027entraînement opérationnel intègre-t-il des situations dégradées ?","c":["Développer les automatismes","Savoir travailler à plusieurs","Développer l\u0027adaptabilité","Entretenir la condition physique"],"r":2,"e":"Le guide associe chaque modalité d\u0027entraînement à un objectif : la répétition des gestes développe les automatismes, la manœuvre d\u0027ensemble ou en équipe apprend à travailler à plusieurs, et l\u0027intégration de situations dégradées développe l\u0027adaptabilité.","ref":"§ 6.3 Un entraînement opérationnel régulier et adapté (chap. 2) — p. 31","p":"répétition de gestes techniques pour développer les automatismes ; manœuvre d\u0027ensemble ou en équipe pour savoir travailler à plusieurs ; […] intégration de situations dégradées pour développer l\u0027adaptabilité.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Équipier","q":"Selon le guide, par qui la connaissance du secteur, c\u0027est-à-dire l\u0027identification des risques du territoire de compétence, doit-elle être cultivée ?","c":["Par les seuls chefs d\u0027agrès","Par tous les personnels","Par le seul service prévision","Par les seuls officiers de garde"],"r":1,"e":"La connaissance du secteur doit être cultivée par tous les personnels. Cette forme d\u0027anticipation permet de prendre en compte en amont les dispositions tactiques et matérielles, grâce à une meilleure connaissance des infrastructures et des éléments de défense extérieure contre l\u0027incendie (DECI).","ref":"§ 6.4 La connaissance de secteur (chap. 2) — p. 31","p":"La connaissance du secteur correspond à l\u0027identification des risques du territoire de compétence. Elle doit être cultivée par tous les personnels.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Chef d\u0027équipe","q":"Selon le guide, à quoi s\u0027apparente le discernement attendu d\u0027un chef en opération ?","c":["À une obstination à maintenir sa première analyse","À un isolement pour réfléchir sans influence","À une prise de recul nécessaire pour réagir","À un alignement sur l\u0027opinion majoritaire"],"r":2,"e":"Le discernement s\u0027apparente à une prise de recul nécessaire pour réagir, jamais à une obstination dangereuse ni à un isolement physique ou intellectuel. Il permet de se détacher, si besoin, de l\u0027opinion majoritaire et d\u0027éviter les biais cognitifs, dont l\u0027effet tunnel.","ref":"§ 7.2 Faire preuve de discernement (chap. 2) — p. 35","p":"Cette capacité s\u0027apparente à une prise de recul nécessaire pour réagir, mais en aucun cas à une obstination dangereuse ou à un isolement physique voire intellectuel. Elle permet d\u0027éviter les effets de biais cognitifs, dont l\u0027effet tunnel.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Chef d\u0027équipe","q":"Selon le guide, en plus de s\u0027engager et d\u0027affronter le danger, le courage d\u0027un chef peut aussi consister à :","c":["Ne jamais revenir sur une décision","Toujours s\u0027engager le premier","Taire ses propres erreurs","Savoir aussi, parfois, renoncer"],"r":3,"e":"Pour le guide, le courage c\u0027est s\u0027engager et surmonter le danger avec sang-froid, mais c\u0027est parfois aussi savoir renoncer. C\u0027est également assumer ses décisions, même impopulaires, et reconnaître ses propres erreurs, car nul n\u0027est infaillible.","ref":"§ 7.3 Être courageux et responsable de ses actes (chap. 2) — p. 35","p":"Faire preuve de courage, c\u0027est s\u0027engager, affronter le danger, et le surmonter grâce au sang-froid et à la maîtrise de soi dans des contextes difficiles. Parfois le courage, c\u0027est aussi savoir renoncer.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Préparation et posture du chef","niv":"Chef d\u0027équipe","q":"Selon le guide, comment la notion de contrôle exercée par le chef sur ses subordonnés doit-elle être considérée ?","c":["Comme un signe de défiance","Comme une étape légitime et incontournable","Comme une étape réservée aux novices","Comme une mesure propre aux situations dégradées"],"r":1,"e":"La notion de contrôle est primordiale : elle ne doit pas être considérée comme un signe de défiance, mais comme une étape légitime et incontournable du processus d\u0027élaboration des ordres. Contrôler la bonne exécution des ordres figure d\u0027ailleurs parmi les quatre grands principes du commandement en opération.","ref":"§ 7.5 Gagner la confiance (chap. 2) — p. 35","p":"la notion de contrôle est primordiale, et ne doit pas être considérée comme un signe de défiance, mais bien au contraire comme une étape légitime et incontournable du processus d\u0027élaboration des ordres.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Chef d\u0027équipe","q":"En fin d\u0027opération, lors du désengagement progressif des secours, pourquoi le guide demande-t-il au commandement de rester vigilant ?","c":["Le sinistre y reprend presque systématiquement de la vigueur","Les relèves de personnels y sont interdites par le règlement","Cette phase est aussi accidentogène que la montée en puissance","La responsabilité de l\u0027opération y passe du COS au CODIS"],"r":2,"e":"La phase de sortie de l\u0027opération est aussi accidentogène que la montée en puissance, notamment en raison d\u0027une baisse possible d\u0027attention des intervenants. Le commandement doit donc rester vigilant pendant l\u0027organisation du désengagement et la remise en condition.","ref":"§ 1.1 Le phasage d\u0027une opération de secours (chap. 3) — p. 41","p":"Le commandement restera vigilant lors de cette phase aussi accidentogène que la phase de montée en puissance, notamment en raison d\u0027une baisse possible d\u0027attention des intervenants.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Équipier","q":"Selon les grands principes du commandement en opération, à combien de subordonnés au maximum un chef doit-il commander ?","c":["4 subordonnés","5 subordonnés","6 subordonnés","8 subordonnés"],"r":0,"e":"Le commandement repose sur quatre principes que chaque échelon doit respecter : ne commander qu\u0027à 4 subordonnés maximum, n\u0027ordonner qu\u0027à ses subordonnés directs, contrôler la bonne exécution des ordres et rendre compte à son supérieur direct.","ref":"§ 3 Commander en opération (chap. 3) — p. 42","p":"Le commandement en opération repose sur quatre grands principes, que chaque échelon doit respecter : ne commander qu\u0027à 4 subordonnés maximum ;","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès, vous voulez modifier l\u0027action de l\u0027équipier du binôme d\u0027attaque. Selon les principes du commandement, à qui donnez-vous l\u0027ordre ?","c":["Directement à l\u0027équipier concerné","Au conducteur, qui le relaiera","À tout l\u0027équipage, par radio","Au chef de l\u0027équipe concernée"],"r":3,"e":"Un chef n\u0027ordonne qu\u0027à ses subordonnés directs. Le chef d\u0027équipe dirige l\u0027équipier et coordonne l\u0027action de son équipe sous l\u0027autorité du chef d\u0027agrès : c\u0027est donc à lui que le chef d\u0027agrès donne l\u0027ordre.","ref":"§ 3 Commander en opération (chap. 3) — p. 42","p":"Le chef d\u0027équipe dirige un équipier et coordonne l\u0027action de son équipe dans le cadre de ses missions de secours, sous l\u0027autorité d\u0027un chef d\u0027agrès. […] n\u0027ordonner qu\u0027à ses subordonnés directs","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Chef d\u0027équipe","q":"Chef d\u0027équipe, votre binôme vient d\u0027achever la mission reçue. Selon les principes du commandement, à qui en rendez-vous compte ?","c":["Au chef d\u0027agrès de votre engin","Au CODIS, par message radio","Au chef de groupe présent","À l\u0027officier sécurité"],"r":0,"e":"Chaque échelon rend compte à son supérieur direct. Le chef d\u0027équipe agissant sous l\u0027autorité d\u0027un chef d\u0027agrès, c\u0027est à ce dernier qu\u0027il rend compte de l\u0027exécution de sa mission.","ref":"§ 3 Commander en opération (chap. 3) — p. 42","p":"Le chef d\u0027équipe dirige un équipier et coordonne l\u0027action de son équipe dans le cadre de ses missions de secours, sous l\u0027autorité d\u0027un chef d\u0027agrès. […] rendre compte à son supérieur direct.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Chef d\u0027équipe","q":"Selon le guide, quelles caractéristiques doivent présenter les ordres donnés en opération ?","c":["Détaillés, exhaustifs et systématiquement écrits","Techniques, chiffrés et formulés en jargon métier","Clairs, précis, concis, réalistes et réalisables","Généraux, pour laisser chacun choisir sa mission"],"r":2,"e":"Pour donner du sens à l\u0027action, les ordres doivent être clairs, précis et concis, transmis dans un vocabulaire simple et sans ambiguïté, réalistes et réalisables, et adaptés à la situation.","ref":"§ 3 Commander en opération (chap. 3) — p. 42","p":"Donnant du sens à l\u0027action, ces ordres doivent être : clairs, précis, concis ; transmis dans un vocabulaire simple et sans ambigüité ; réalistes et réalisables ; adaptés à la situation.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Commander en opération","niv":"Chef d\u0027équipe","q":"Selon le guide, au cours de l\u0027action, quel est le rôle du chef vis-à-vis de l\u0027autonomie de ses subordonnés ?","c":["Valider chacun de leurs gestes avant exécution","Définir leur bulle de liberté d\u0027action","Leur laisser fixer le projet commun","Exécuter lui-même les actions délicates"],"r":1,"e":"Le chef décide du projet commun et définit la bulle de liberté d\u0027action au sein de laquelle le subordonné peut exercer pleinement son autonomie. Le projet commun n\u0027est donc pas laissé au choix des subordonnés.","ref":"§ 3 Commander en opération (chap. 3) — p. 43","p":"Au cours de l\u0027action, le rôle du chef est de décider le projet commun et de définir la bulle de liberté d\u0027action au sein de laquelle le subordonné pourra exercer pleinement son autonomie.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès en transit, vous apercevez un important panache de fumée et jugez des renforts nécessaires. Selon le guide, que faites-vous ?","c":["Vous attendez d\u0027avoir fait la reconnaissance pour en demander","Vous laissez le CODIS seul juge de leur engagement","Vous les demandez dès le transit, depuis votre engin","Vous les faites demander par un officier, seul habilité"],"r":2,"e":"Les renforts peuvent être envoyés à la demande d\u0027un engin en transit, à la demande du COS arrivé sur les lieux ou par anticipation du centre opérationnel. Les COS successifs devront ensuite tenir compte des renforts éventuels demandés lors du transit.","ref":"§ 4.5 La gestion des renforts (chap. 3) — p. 45","p":"Les renforts identifiés par le centre opérationnel sont envoyés : à la demande d\u0027un engin en transit ;","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Chef d\u0027agrès","q":"Arrivé sur les lieux, vous demandez des renforts au centre opérationnel. Selon le guide, comment cette demande doit-elle être formulée ?","c":["Justifiée, qualifiée et quantifiée","Globale, sans détail, pour gagner du temps","Validée au préalable par le chef de groupe","Transmise uniquement par téléphone"],"r":0,"e":"La demande de renfort du COS arrivé sur les lieux se fonde sur son évaluation de la situation et de l\u0027évolution du sinistre : elle est justifiée, qualifiée et quantifiée.","ref":"§ 4.5 La gestion des renforts (chap. 3) — p. 45","p":"à la demande du COS arrivé sur les lieux, en fonction de son évaluation de la situation et de l\u0027évolution du sinistre. Cette demande est justifiée, qualifiée et quantifiée ;","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Chef d\u0027équipe","q":"Selon le guide, comment la relève des personnels doit-elle être organisée dans la mesure du possible ?","c":["Individu par individu, pour assurer la continuité","Selon l\u0027ancienneté des personnels engagés","À la seule demande des personnels fatigués","Par équipes entières, pour garder la cohésion"],"r":3,"e":"La relève découle de l\u0027analyse du contexte opérationnel. Elle doit concerner, dans la mesure du possible, des équipes et non des individus, afin de garder la cohésion des hommes et des secteurs.","ref":"§ 4.6 La gestion des relèves (chap. 3) — p. 46","p":"La relève des personnels est une conséquence de l\u0027analyse du contexte opérationnel. Elle doit concerner, dans la mesure du possible, des équipes et non des individus, ce qui permet de garder la cohésion des hommes et des secteurs.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Équipier","q":"Lors du déplacement d\u0027un groupe ou d\u0027une colonne, une fois les moyens arrivés sur les lieux d\u0027intervention, que fait-on des avertisseurs lumineux selon le guide ?","c":["On les éteint pour ne pas éblouir les intervenants","On les maintient allumés en permanence","On ne les laisse allumés que de nuit","On les éteint sauf sur voie rapide"],"r":1,"e":"Lors de l\u0027engagement opérationnel, une fois les moyens arrivés sur les lieux, les avertisseurs lumineux sont maintenus allumés en permanence. Le conducteur adapte par ailleurs sa vitesse au véhicule et au terrain et respecte les règles de guidage.","ref":"§ 5.1.2 L\u0027ordre de mouvement (chap. 3) — p. 48","p":"Lors de l\u0027engagement opérationnel : une fois les moyens arrivés sur les lieux d\u0027intervention, les avertisseurs lumineux sont maintenus en permanence allumés ;","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Équipier","q":"Selon le guide, à quelle condition un véhicule de secours bénéficie-t-il de la priorité de passage prévue par le code de la route ?","c":["Utiliser au moins les avertisseurs lumineux","Utiliser ensemble avertisseurs sonores et lumineux","Circuler en permanence feux de route allumés","Être engagé sur un départ validé par le CTA"],"r":1,"e":"Les véhicules de secours sont des véhicules d\u0027intérêt général prioritaires. Pour bénéficier de cette priorité, ils doivent utiliser de manière concomitante les avertisseurs sonores et lumineux (article R415-12 du code de la route), sans mettre en danger les sapeurs-pompiers ni les autres usagers.","ref":"§ 5.1.3 Les règles de conduite (chap. 3) — p. 48","p":"Pour bénéficier de cette priorité, les secours doivent utiliser de manière concomitante les avertisseurs sonores et lumineux (art. R415-12 du code de la route).","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Équipier","q":"Selon le guide, dans quel cas le port de la ceinture de sécurité est-il de rigueur à bord d\u0027un véhicule de secours ?","c":["Dès lors que le véhicule en est équipé","Uniquement aux places avant de l\u0027engin","Uniquement lors des transits sur autoroute","Sauf lors des départs en urgence"],"r":0,"e":"Le port de la ceinture de sécurité est de rigueur dès lors que le véhicule en est équipé. Lors des déplacements en groupe ou en colonne, il est obligatoire pour l\u0027ensemble des personnels, à toutes les places pourvues.","ref":"§ 5.1.3 Les règles de conduite (chap. 3) — p. 48","p":"Le port de la ceinture de sécurité est de rigueur dans le véhicule dès lors que ce dernier en est équipé.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Renforts, relèves et conduite","niv":"Équipier","q":"En intervention urgente, l\u0027engin aborde un feu rouge. Selon le guide, quelle règle élémentaire de prudence s\u0027applique ?","c":["Le franchir sans ralentir, car prioritaire","S\u0027arrêter et attendre le feu vert","Le contourner sans ralentir","Le franchir à vitesse limitée"],"r":3,"e":"La conduite d\u0027un véhicule d\u0027intérêt général prioritaire ne doit jamais occulter les règles élémentaires de prudence : le guide cite l\u0027exemple du franchissement d\u0027un feu rouge à vitesse limitée. La priorité ne doit mettre en danger ni les sapeurs-pompiers ni les autres usagers.","ref":"§ 5.1.3 Les règles de conduite (chap. 3) — p. 49","p":"La conduite d\u0027un véhicule d\u0027intérêt général prioritaire ne doit jamais occulter les règles élémentaires de prudence, comme par exemple le franchissement d\u0027un feu rouge à vitesse limitée.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027agrès","q":"Selon le guide, de quels domaines relèvent les réactions immédiates que le COS entreprend dès son arrivée sur les lieux ?","c":["Extinction, ventilation, protection et déblai","Zonage, sectorisation, logistique et relève","Action (dont sauvetages), renseignement et information","Reconnaissance, attaque et surveillance"],"r":2,"e":"Les réactions immédiates sont les actions que le COS entreprend dès son arrivée, avant le raisonnement tactique. Elles relèvent de l\u0027action (dont les sauvetages et mises en sécurité), du renseignement et de l\u0027information.","ref":"§ 5.2.1 Les réactions immédiates (chap. 3) — p. 49","p":"Les réactions immédiates correspondent aux actions que le COS doit entreprendre dès son arrivée sur les lieux. […] Ces différents actes peuvent être du domaine : de l\u0027action, dont les sauvetages et mise en sécurité ; du renseignement ; de l\u0027information.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027agrès","q":"Chef d\u0027agrès COS, vous voyez arriver le chef de groupe sur les lieux. Selon le guide, quand le point de situation doit-il être réalisé ?","c":["Juste après qu\u0027il a pris le commandement","Avant son éventuelle prise de commandement","Uniquement s\u0027il le demande expressément","En fin d\u0027intervention, pour le rapport"],"r":1,"e":"À l\u0027arrivée d\u0027un supérieur hiérarchique, un point de situation est réalisé avant son éventuelle prise de commandement. Il présente la situation générale, les risques, les mesures prises et les actions principales effectuées ou en cours.","ref":"§ 5.2.2 Le point de situation (chap. 3) — p. 49","p":"À l\u0027arrivée d\u0027un supérieur hiérarchique un point de situation est réalisé avant son éventuelle prise de commandement. Une présentation de la situation générale, des risques, des mesures prises et des actions principales (effectuées ou en cours) est réalisée.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027équipe","q":"Selon le guide, à partir de quand le raisonnement tactique est-il utilisé par les personnels ?","c":["Dès le début de leur engagement","Après l\u0027arrivée d\u0027un chef de groupe","Une fois les sauvetages terminés","Dès l\u0027installation d\u0027un PC"],"r":0,"e":"Le raisonnement tactique est une méthode de réflexion utilisée par les personnels dès le début de leur engagement. Il permet de répondre aux problèmes posés, de structurer le commandement et de répartir les missions entre les moyens engagés.","ref":"§ 5.3 Construction du raisonnement tactique (chap. 3) — p. 50","p":"Le raisonnement tactique est une méthode de réflexion, utilisée par les personnels dès le début de leur engagement. Elle permet de répondre aux problématiques posées par l\u0027enjeu opérationnel, de structurer le commandement et d\u0027organiser la répartition des missions","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Équipier","q":"Selon le guide, quel champ est commun à toutes les marches générales des opérations (MGO), quel que soit le type d\u0027opération ?","c":["L\u0027attaque","La ventilation","La décontamination","La reconnaissance"],"r":3,"e":"Quelle que soit l\u0027opération, les MGO ont en commun la reconnaissance, les sauvetages et mises en sécurité, les actions spécifiques au domaine d\u0027intervention, la protection et le reconditionnement. La MGO ne remplace pas pour autant la méthode de raisonnement tactique.","ref":"§ 5.5 La marche générale des opérations (chap. 3) — p. 51","p":"Néanmoins, et quel que soit l\u0027opération, les champs suivants sont communs : la reconnaissance ; les sauvetages et mises en sécurité ; les actions spécifiques au domaine d\u0027intervention ; la protection ; le reconditionnement.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027équipe","q":"Selon le guide, que met en rapport la balance bénéfice-risque intégrée à la réflexion du COS ?","c":["Les risques d\u0027une action et ses bénéfices éventuels","Les bénéfices d\u0027une action et les moyens disponibles","Les bénéfices d\u0027une action et son coût financier","Les risques d\u0027une action et le délai pour la mener"],"r":0,"e":"La balance bénéfice-risque est le rapport entre les risques encourus lors d\u0027une action, ou générés par elle, et ses éventuels bénéfices pour les personnes, les biens ou l\u0027environnement. Elle conduit à se demander si la prise de risque en vaut la peine et si l\u0027engagement des équipes est justifié.","ref":"§ 5.6.1 La balance bénéfice-risque (chap. 3) — p. 52","p":"La balance bénéfice-risque constitue le rapport entre les risques encourus lors d\u0027une action, ou générés par une action, et ses éventuels bénéfices pour les personnes, les biens ou l\u0027environnement.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027équipe","q":"Selon le guide, quel ordre permet de lancer les actions suivantes au fur et à mesure de l\u0027évolution de la situation ?","c":["L\u0027ordre initial","L\u0027ordre préparatoire","L\u0027ordre de conduite","L\u0027ordre de mouvement"],"r":2,"e":"L\u0027ordre initial permet d\u0027initier l\u0027exécution des premières actions ; l\u0027ordre de conduite permet de lancer les actions suivantes au fur et à mesure de l\u0027évolution de la situation. Ces ordres peuvent être exprimés à la voix ou par radio.","ref":"§ 5.6.2 Les ordres initiaux et les ordres de conduite (chap. 3) — p. 53","p":"l\u0027ordre initial permet d\u0027initier l\u0027exécution des 1ères actions ; l\u0027ordre de conduite permet de lancer les actions suivantes au fur et à mesure de l\u0027évolution de la situation.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027équipe","q":"Selon le guide, quel moyen mnémotechnique les chefs d\u0027agrès et chefs d\u0027équipe utilisent-ils pour formaliser leur ordre initial et leurs ordres de conduite ?","c":["SMES","SOIEC","SAOIELC","DPIF"],"r":0,"e":"Les chefs d\u0027agrès et chefs d\u0027équipe formalisent leur ordre initial et leurs ordres de conduite grâce au SMES. Le SOIEC est utilisé par le chef de groupe et le SAOIELC par les chefs de colonne et de site.","ref":"§ 5.6.2 Les ordres initiaux et les ordres de conduite (chap. 3) — p. 54","p":"Le SMES Les chefs d\u0027agrès et chefs d\u0027équipes utiliseront l\u0027ordre initial et les ordres de conduite suivants. Ils sont formalisés grâce au moyen mnémotechnique suivant","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Équipier","q":"Dans un ordre au format SMES, que recouvre la dernière lettre S ?","c":["La situation après exécution","Le soutien sanitaire à prévoir","Les mesures de sécurité à appliquer","La sectorisation de l\u0027intervention"],"r":2,"e":"Dans le SMES, le dernier S correspond à la Sécurité : les mesures de sécurité individuelles et collectives. Le premier S désigne la Situation, le M la Mission et le E l\u0027Exécution.","ref":"§ 5.6.2 Les ordres initiaux et les ordres de conduite (chap. 3) — p. 54","p":"S Situation Description de la situation M Mission Objectifs à atteindre E Exécution Expression des ordres S Sécurité Mesures de sécurité individuelles et collectives","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Raisonnement tactique et ordres","niv":"Chef d\u0027équipe","q":"Dans un ordre au format SMES, que contient la rubrique « Mission » ?","c":["Les moyens à engager","Les objectifs à atteindre","La description de la situation","L\u0027expression des ordres"],"r":1,"e":"Dans le SMES, la Mission précise les objectifs à atteindre. La description de la situation relève de la rubrique Situation et l\u0027expression des ordres de la rubrique Exécution.","ref":"§ 5.6.2 Les ordres initiaux et les ordres de conduite (chap. 3) — p. 54","p":"M Mission Objectifs à atteindre E Exécution Expression des ordres","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027équipe","q":"Selon le guide, qu\u0027est-ce que la situation tactique (SITAC) ?","c":["Un message radio décrivant la situation au CODIS","Un schéma de la zone, des moyens, des actions et du commandement","Un tableau de suivi des personnels engagés et de leurs horaires","Un plan d\u0027établissement répertorié complété sur place"],"r":1,"e":"La SITAC est un schéma décrivant la zone d\u0027intervention et ses caractéristiques, les moyens engagés ou prévus, les actions effectuées ou prévues et l\u0027organisation du commandement. Élaborée avec une charte graphique commune, elle permet au COS de partager sa vision de l\u0027opération.","ref":"§ 5.7.2 La situation tactique (chap. 3) — p. 60","p":"La situation tactique (SITAC) est un schéma décrivant, pour une opération donnée, la zone d\u0027intervention et ses caractéristiques, les moyens engagés/prévus, les actions effectuées/prévues ainsi que l\u0027organisation du commandement.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Équipier","q":"Un hélicoptère du SAMU arrive sur la zone d\u0027intervention où vole un drone du SIS. Selon le guide, quelle règle s\u0027applique ?","c":["Le drone peut continuer s\u0027il reste à basse altitude","Le drone continue si le télépilote garde l\u0027hélicoptère à vue","Le drone ne doit plus voler : priorité à l\u0027aéronef habité","Le drone continue avec l\u0027accord du seul télépilote"],"r":2,"e":"En présence de tout aéronef sur la zone d\u0027intervention (sécurité civile, SAMU, gendarmerie…), il est formellement interdit de faire voler un aéronef télépiloté : la priorité absolue revient à l\u0027aéronef avec une présence humaine à bord.","ref":"§ 5.7.2.2.2 L\u0027engagement sur la zone d\u0027intervention (chap. 3) — p. 63","p":"En cas de présence de tout aéronef sur la zone d\u0027intervention (sécurité civile, SAMU, gendarmerie, etc.), il est formellement interdit de faire voler un aéronef télépiloté, la priorité absolue demeurant à l\u0027aéronef comportant une présence humaine à son bord.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027agrès","q":"Selon le guide, quel est l\u0027objet de l\u0027ordre complémentaire de transmission (OCT) mis en place lors de chaque opération ?","c":["Planifier à l\u0027avance les réseaux d\u0027un site répertorié","Fixer l\u0027organisation des communications du département","Désigner sans ambiguïté le COS auprès des acteurs","Relier chaque niveau aux niveaux supérieur et inférieur"],"r":3,"e":"Sur chaque opération, l\u0027OCT permet à chaque niveau hiérarchique de communiquer avec le niveau supérieur et le niveau inférieur. La planification préalable relève de l\u0027ordre particulier de transmission (OPT) et l\u0027organisation départementale de l\u0027OBDSIC.","ref":"§ 5.7.3 Les ordres de transmissions (chap. 3) — p. 63","p":"Lors de chaque opération, un OCT est mis en place pour permettre à chaque niveau hiérarchique de communiquer avec le niveau supérieur et le niveau inférieur.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027agrès","q":"Selon le guide, quelle forme d\u0027anticipation, conduite par tous les COS, permet d\u0027envisager une évolution de la situation à court terme ?","c":["L\u0027anticipation réflexe","L\u0027anticipation réfléchie","L\u0027anticipation planifiée","L\u0027anticipation stratégique"],"r":0,"e":"L\u0027anticipation réflexe est conduite par tous les COS pour envisager une évolution à court terme (propagation d\u0027un sinistre…) et porte sur les enjeux prioritaires. L\u0027anticipation réfléchie concerne les enjeux secondaires et plus lointains dans le temps.","ref":"§ 5.7.4.4 L\u0027anticipation réflexe (chap. 3) — p. 65","p":"L\u0027anticipation réflexe est conduite par tous les COS, et leur permet d\u0027envisager une évolution de la situation à court terme : propagation d\u0027un sinistre, etc. Elle doit concerner les enjeux prioritaires analysés sur l\u0027opération.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Équipier","q":"Selon le guide, à quoi est lié le message de statut ?","c":["À la description globale de la situation au centre opérationnel","À l\u0027identification de celui qui détient la fonction de COS","À l\u0027état opérationnel du moyen (départ, sur les lieux…)","À une demande de moyens supplémentaires au CODIS"],"r":2,"e":"Le message de statut est lié à l\u0027état opérationnel du moyen : départ, présent sur les lieux, disponible ou non. La description globale de la situation relève du message d\u0027ambiance et l\u0027identification du COS du message de commandement.","ref":"§ 5.8 La remontée d\u0027information (chap. 3) — p. 68","p":"Le message de statut lié à l\u0027état opérationnel du moyen : départ, présent sur les lieux, disponible ou non, etc.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027agrès","q":"Selon le guide, quel message, transmis le plus tôt possible, décrit au centre opérationnel une vision globale de la situation ?","c":["Le message d\u0027ambiance","Le message d\u0027urgence","Le message de statut","Le message de commandement"],"r":0,"e":"Le message d\u0027ambiance, transmis le plus tôt possible, décrit une vision globale de la situation au centre opérationnel ; la prise de commandement peut y être intégrée. Il suit la trame « je suis, je vois, je demande ». Le message d\u0027urgence sert, lui, à prendre la priorité des transmissions en cas de mise en danger.","ref":"§ 5.8 La remontée d\u0027information (chap. 3) — p. 68","p":"Le message d\u0027ambiance : transmis le plus tôt possible, il a pour […] objectif de décrire une vision globale de la situation au centre […] opérationnel. La prise de commandement peut être intégrée à ce message.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027équipe","q":"Selon le guide, quel message permet à l\u0027ensemble des acteurs de terrain ou de gestion d\u0027identifier sans ambiguïté qui détient la fonction de COS ?","c":["Le message de statut","Le message d\u0027urgence","Le message de compte-rendu","Le message de commandement"],"r":3,"e":"Le message de commandement permet à tous les acteurs, sur le terrain comme dans les structures de gestion, d\u0027identifier sans ambiguïté qui détient la fonction de COS. La prise de COS est aussi à formaliser aux personnels sur le terrain, au CODIS et à tous les acteurs présents.","ref":"§ 5.8 La remontée d\u0027information (chap. 3) — p. 68","p":"Le message de commandement : il permet à l\u0027ensemble des acteurs […] de terrain ou de gestion d\u0027identifier sans ambiguïté qui détient la fonction de COS.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Équipier","q":"Un binôme se retrouve en situation de mise en danger. Selon le guide, quel message permet de prendre la priorité des transmissions ?","c":["Le message d\u0027urgence","Le message d\u0027ambiance","Le message de statut","Le message de compte-rendu"],"r":0,"e":"Le message d\u0027urgence permet de prendre la priorité des transmissions en cas de mise en danger. Il peut être associé à la diffusion du signal de repli en cas de risque imminent pour les personnels.","ref":"§ 5.8 La remontée d\u0027information (chap. 3) — p. 68","p":"Le message d\u0027urgence : il permet de prendre la priorité des transmissions dans le cas d\u0027une situation de mise en danger. Il peut être associé à la diffusion du signal de repli en cas de risque imminent pour les personnels.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Outils de gestion et messages","niv":"Chef d\u0027agrès","q":"Selon le guide, de quoi le message de compte-rendu informe-t-il l\u0027autorité ?","c":["De la seule identité du COS en fonction sur l\u0027opération","De l\u0027état de l\u0027engin : départ, présent sur les lieux, disponible","De la situation, de ses évolutions, des actions et des besoins","D\u0027une mise en danger justifiant de prendre la priorité radio"],"r":2,"e":"Le message de compte-rendu informe l\u0027autorité de la situation en cours, de ses possibles évolutions, des actions entreprises et des besoins supplémentaires. Normé, il suit la trame « je suis, je vois, je prévois, je fais, je demande ».","ref":"§ 5.8 La remontée d\u0027information (chap. 3) — p. 68","p":"Le message de compte-rendu : il permet d\u0027informer l\u0027autorité de la situation en cours, de ses possibles évolutions, des actions entreprises et des besoins supplémentaires.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Équipier","q":"Selon le guide, comment se répartit la sécurité des intervenants en opération ?","c":["Elle relève uniquement de l\u0027officier sécurité, conseiller du COS","Elle est déléguée à chaque chef d\u0027agrès pour son équipage","Elle incombe au CODIS, qui surveille les engagements","Elle est l\u0027affaire de chacun, sous la responsabilité du COS"],"r":3,"e":"La sécurité est l\u0027affaire de chaque intervenant, mais la sécurité des personnels engagés est de la pleine responsabilité du COS. L\u0027officier sécurité, lorsqu\u0027il est mis en place, est son conseiller technique pour la sécurité.","ref":"§ 6.1 Le rôle du COS (chap. 3) — p. 70","p":"La sécurité est l\u0027affaire de chaque intervenant. […] Sur opération, la sécurité des personnels engagés est de la pleine responsabilité du commandant des opérations de secours.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Selon le guide, quelle règle le COS applique-t-il à l\u0027engagement des personnels lorsque les actions à accomplir sont difficiles, voire dangereuses ?","c":["L\u0027augmenter pour écourter l\u0027exposition","Le limiter au strict minimum nécessaire","Le confier au seul officier sécurité","Le différer jusqu\u0027à l\u0027arrivée d\u0027un officier"],"r":1,"e":"Parmi ses obligations de sécurité, le COS doit limiter au strict minimum l\u0027engagement des personnels, notamment pour les actions difficiles voire dangereuses. Il définit aussi les EPI et les règles de sécurité et en fait vérifier l\u0027application.","ref":"§ 6.1 Le rôle du COS (chap. 3) — p. 70","p":"Ainsi, le COS doit : assurer la sécurité des personnels engagés (sapeurs-pompiers, agents d\u0027autres services, etc.) ; limiter au strict minimum l\u0027engagement des personnels, notamment si les actions à accomplir sont difficiles voire dangereuses","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Équipier","q":"Selon le guide, quelles contraintes le port des EPI peut-il lui-même entraîner pour les intervenants ?","c":["Stress thermique et réduction du champ de vision","Exposition accrue aux fumées et aux gaz toxiques","Moindre protection contre les flammes et la chaleur","Moindre protection contre les chocs et les projections"],"r":0,"e":"La situation opérationnelle génère des risques, et le port des EPI peut lui-même entraîner des contraintes : stress thermique, réduction du champ de vision, épuisement. Le COS doit les prendre en compte.","ref":"§ 6.1 Le rôle du COS (chap. 3) — p. 70","p":"La situation opérationnelle génère des risques, et le port des EPI lui-même peut entrainer des contraintes (stress thermique, réduction du champ de vision, épuisement, etc.) à prendre en compte.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Équipier","q":"Selon le guide, quelle couleur désigne la zone contrôlée dans le zonage opérationnel ?","c":["Rouge","Verte","Orange","Blanche"],"r":2,"e":"Le zonage distingue une zone d\u0027exclusion dite rouge, une zone contrôlée dite orange et une zone de soutien dite verte. Une zone public, sans restriction opérationnelle, peut se situer au-delà de la zone de soutien.","ref":"§ 6.2 Le zonage (chap. 3) — p. 71","p":"une zone d\u0027exclusion dite rouge ; une zone contrôlée dite orange ; une zone de soutien dite verte.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Premier COS sur les lieux avec peu de moyens, vous ne pouvez pas encore réaliser un zonage complet. Selon le guide, que pouvez-vous déjà faire ?","c":["Rien, car le zonage nécessite un dispositif déjà complet","Attendre l\u0027arrivée du chef de groupe pour définir les zones","Identifier la zone d\u0027exclusion et ses points de pénétration","Confier l\u0027ensemble du zonage aux seules forces de l\u0027ordre"],"r":2,"e":"Lorsque le dispositif n\u0027est pas encore complet, le COS peut déjà appliquer les principes du zonage : identifier la zone d\u0027exclusion et son ou ses points de pénétration, identifier une zone pour les matériels souillés et choisir l\u0027emplacement d\u0027un PRV pour les éventuelles victimes.","ref":"§ 6.2 Le zonage (chap. 3) — p. 71","p":"Lorsque le dispositif n\u0027est pas encore complet, le COS peut en utiliser les principes et réaliser notamment : l\u0027identification de la zone d\u0027exclusion et de son (ses) point(s) de pénétration ;","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Chef d\u0027agrès","q":"Selon le guide, qui doit connaître le nombre et les missions des personnels engagés dans la zone d\u0027exclusion ?","c":["L\u0027officier sécurité seul, conseiller du COS","Le COS et les chefs d\u0027agrès ou de secteurs concernés","Le seul CODIS, qui tient la main courante","Le chef d\u0027équipe du binôme engagé uniquement"],"r":1,"e":"Dans la zone d\u0027exclusion, où les intervenants sont directement exposés aux risques, l\u0027accès est strictement restreint aux équipes disposant des EPI adaptés, et le nombre et les missions des personnels engagés doivent être connus du COS et des chefs d\u0027agrès ou de secteurs concernés.","ref":"§ 6.2 Le zonage (chap. 3) — p. 72","p":"ZONE D\u0027EXCLUSION […] Le nombre et les missions des personnels engagés doivent être connus du COS et des chefs d\u0027agrès ou de secteurs concernés.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Chef d\u0027équipe","q":"Selon le guide, dans quelle zone figurent les phases d\u0027enregistrement et d\u0027engagement des binômes avec les matériels de suivi adaptés ?","c":["La zone d\u0027exclusion","La zone de soutien","La zone public","La zone contrôlée"],"r":3,"e":"La zone contrôlée est une zone tampon d\u0027où est coordonné l\u0027engagement vers la zone d\u0027exclusion : on y trouve l\u0027enregistrement et l\u0027engagement des binômes avec des matériels de suivi adaptés, par exemple en risque chimique ou lors de reconnaissances longues en parc de stationnement couvert.","ref":"§ 6.2 Le zonage (chap. 3) — p. 72","p":"ZONE CONTROLEE Il y figure les phases d\u0027enregistrement et d\u0027engagement des binômes avec les matériels de suivi adaptés","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Sécurité des intervenants","niv":"Chef d\u0027équipe","q":"L\u0027officier sécurité constate un danger grave et imminent pour des intervenants. Selon le guide, que fait-il ?","c":["Il informe le COS et attend sa décision avant toute mesure","Il fait prendre les mesures de préservation, puis rend compte","Il rend compte au CODIS, qui ordonne alors le repli des équipes","Il consigne le fait en vue du retour d\u0027expérience"],"r":1,"e":"Constatant un danger grave et imminent, l\u0027officier sécurité fait prendre immédiatement les mesures de préservation nécessaires et rend compte sans délai au COS, dont il est le conseiller technique pour la sécurité.","ref":"§ 6.3 L\u0027officier sécurité (chap. 3) — p. 74","p":"constatant un danger grave et imminent, il fait prendre immédiatement les mesures de préservation nécessaires et rend compte sans délai au COS.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Chef d\u0027agrès","q":"En route, votre engin est bloqué dans un embouteillage et vous jugez ne pas pouvoir arriver dans un délai raisonnable. Selon le guide, que faites-vous ?","c":["Vous demandez un autre vecteur et signalez le secteur à éviter","Vous attendez la fin du bouchon, puis rendez compte du retard","Vous circulez à contresens pour rejoindre au plus vite les lieux","Vous faites demi-tour et rentrez au centre de secours"],"r":0,"e":"Si le chef d\u0027agrès juge qu\u0027il ne pourra pas arriver dans des délais raisonnables, il demande l\u0027engagement d\u0027un autre vecteur en précisant au centre opérationnel le secteur routier à éviter. La consignation du message sur la main courante permettra de justifier le retard en cas de contentieux.","ref":"§ 7.1 Le retard dans la progression des secours (chap. 3) — p. 74","p":"si le chef d\u0027agrès juge qu\u0027il ne pourra se présenter sur les lieux dans des délais raisonnables, il doit demander l\u0027engagement d\u0027un autre vecteur en précisant à son centre opérationnel le secteur routier à éviter.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Chef d\u0027agrès","q":"En route vers un feu, vous découvrez un accident de la circulation avec un blessé. Selon le guide, quelle conduite adoptez-vous ?","c":["Prendre les mesures nécessaires puis reprendre la mission","Poursuivre sans vous arrêter, la mission initiale primant","Traiter l\u0027accident et abandonner la mission initiale","Rester sur place avec l\u0027équipage jusqu\u0027à l\u0027arrivée d\u0027aide"],"r":0,"e":"Si, lors de son déplacement, le chef d\u0027agrès rencontre une autre situation relevant de l\u0027action des secours, il prend toutes les mesures pour y faire face (demande de secours, personnel laissé sur place…) puis reprend sa mission initiale.","ref":"§ 7.1 Le retard dans la progression des secours (chap. 3) — p. 74","p":"si le chef d\u0027agrès rencontre une autre situation relevant de l\u0027action des secours, il prend toutes les mesures pour y faire face (demande de secours, personnel laissé sur place, etc.) et reprend sa mission initiale.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Équipier","q":"Selon le guide, quelle attitude faut-il privilégier face à une agression physique ?","c":["L\u0027affrontement, pour protéger l\u0027équipage","L\u0027immobilisation de l\u0027agresseur","La négociation prolongée avec l\u0027agresseur","La fuite, plutôt que l\u0027affrontement"],"r":3,"e":"Face à l\u0027agression physique, la fuite est souvent la meilleure des protections et doit être privilégiée à la logique d\u0027affrontement. Le guide recommande aussi de systématiser les dépôts de plainte après toute agression pour éviter la banalisation du phénomène.","ref":"§ 7.2 Les agressions (chap. 3) — p. 74","p":"Face à l\u0027agression physique, la fuite est souvent la meilleure des protections et sera privilégiée à la logique d\u0027affrontement.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Chef d\u0027agrès","q":"Face à des outrages et menaces, vous estimez le risque trop important pour accomplir la mission. Selon le guide, que faites-vous ?","c":["Poursuivre la mission dans sa totalité, comme initialement prévu","Attendre l\u0027arrivée des forces de l\u0027ordre avant toute mesure","Tenter seul une médiation avec les individus menaçants","Protéger le personnel tout en appelant les forces de l\u0027ordre"],"r":3,"e":"Face aux outrages et menaces, le COS évalue le risque d\u0027accomplir la mission dans sa totalité. S\u0027il l\u0027estime trop important, il prend les premières mesures de sauvegarde de son personnel et demande simultanément l\u0027intervention des forces de l\u0027ordre.","ref":"§ 7.2 Les agressions (chap. 3) — p. 74","p":"S\u0027il estime que le risque est trop important, il prend les premières mesures de sauvegarde de son personnel et demande simultanément l\u0027intervention des forces de l\u0027ordre.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Équipier","q":"Selon le guide, qu\u0027est-ce que l\u0027effet tunnel ?","c":["Une désorientation due à une longue progression en local enfumé","Une accélération brutale des fumées dans un couloir ou un escalier","Une montée d\u0027adrénaline réduisant performances et champ de vision","Une perte des liaisons radio en sous-sol, en parking ou en tunnel"],"r":2,"e":"L\u0027effet tunnel est une réaction psycho-physiologique : une montée d\u0027adrénaline provoque une réduction sensible des performances intellectuelles et physiques et un rétrécissement du champ de vision. Il peut conduire les secours à des réactions inadaptées, par exemple lors d\u0027un accident en service commandé.","ref":"§ 7.4 L\u0027accident ou le décès en service commandé (chap. 3) — p. 75","p":"L\u0027effet tunnel est une réaction psycho-physiologique se caractérisant par une montée d\u0027adrénaline qui provoque […] une réduction sensible des performances intellectuelles et physiques, et un rétrécissement du champ de vision.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Équipier","q":"Les secours interviennent sur une scène de crime présumée. Selon le guide, quelle règle s\u0027applique ?","c":["Attendre les enquêteurs avant tout geste de secours","Porter secours en priorité, sans gêner l\u0027enquête ultérieure","Préserver toutes les traces avant de porter le moindre secours","Ne secourir qu\u0027avec l\u0027accord des forces de l\u0027ordre"],"r":1,"e":"La règle demeure de porter secours en priorité, tout en ménageant la possibilité pour les enquêteurs de réaliser ensuite leurs investigations. Le COS garde cette notion à l\u0027esprit, car la priorité donnée au secours peut polluer une potentielle scène de crime.","ref":"§ 7.6 Les scènes de crime (chap. 3) — p. 77","p":"La règle demeure de porter secours en priorité, tout en ménageant la possibilité pour les enquêteurs de réaliser leurs investigations par la suite.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Équipier","q":"Sur une scène de crime présumée, quelle pratique est proscrite selon le guide ?","c":["Suivre un cheminement unique","Baliser la zone","Aérer les locaux","Se rappeler l\u0027état des accès"],"r":2,"e":"Aérer les locaux fait partie des pratiques proscrites, comme toucher ou déplacer des objets, encombrer la zone ou déplacer une personne en décès manifeste avant l\u0027arrivée des enquêteurs. Le cheminement unique, le balisage et la mémorisation de l\u0027état des accès sont au contraire préconisés.","ref":"§ 7.6 Les scènes de crime (chap. 3) — p. 77","p":"Certaines pratiques sont proscrites comme : […] toucher ou déplacer des objets ; encombrer la zone avec des personnes inutiles ; aérer les locaux.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Désordres opérationnels","niv":"Chef d\u0027agrès","q":"Lors d\u0027un secours à personne, l\u0027équipage découvre des signes de maltraitance. Selon le guide, que fait le COS ?","c":["Il interroge lui-même l\u0027entourage pour établir les faits","Il interrompt sa mission jusqu\u0027à l\u0027arrivée de la police","Il en fait seulement état dans son rapport d\u0027intervention","Il alerte forces de l\u0027ordre et/ou SAMU, sans perdre sa mission de vue"],"r":3,"e":"Face à une découverte pouvant mettre des vies en péril (maltraitance, signes de radicalisation…) ou relevant de la justice, le COS demande l\u0027intervention des forces de l\u0027ordre et/ou renseigne le SAMU, sans perdre de vue la priorité initiale de la mission.","ref":"§ 7.7 Les découvertes diverses (chap. 3) — p. 78","p":"Le COS demandera l\u0027intervention des forces de l\u0027ordre et/ou renseignera le SAMU, sans perdre de vue la priorité initiale de la mission.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Après l\u0027opération","niv":"Chef d\u0027équipe","q":"Selon le guide, dans quel délai idéal le défusing est-il réalisé après l\u0027événement ?","c":["Dans les 3 à 8 jours","Dans les 3 à 8 heures","Au bout de deux semaines","Au-delà d\u0027un mois"],"r":1,"e":"Le défusing se fait généralement dans les 3 jours suivant l\u0027événement, idéalement au plus tôt, dans les 3 à 8 heures. Il réunit des participants volontaires, ayant vécu la même intervention et qui se connaissent.","ref":"§ 2.2.1 Le défusing (chap. 4) — p. 82","p":"Généralement, le défusing se fait dans les 3 jours qui suivent l\u0027évènement, et idéalement au plus tôt après (dans les 3 à 8 heures).","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Après l\u0027opération","niv":"Équipier","q":"Selon le guide, par qui le débriefing psychologique est-il animé ?","c":["Par le COS de l\u0027intervention","Par le chef de centre concerné","Par un collègue ayant vécu l\u0027événement","Par un professionnel de santé formé"],"r":3,"e":"Le débriefing psychologique est animé par un professionnel de santé formé. C\u0027est une intervention psychologique précoce, individuelle ou collective, qui vise à réduire les réactions induites par un événement à caractère traumatique.","ref":"§ 2.2.2 Le débriefing psychologique (chap. 4) — p. 82","p":"Animé par un professionnel de santé formé, c\u0027est une intervention psychologique précoce, individuelle ou collective, qui s\u0027adresse aux victimes d\u0027un événement potentiellement traumatisant.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Après l\u0027opération","niv":"Chef d\u0027agrès","q":"Selon le guide, qui doit réaliser un rapport d\u0027intervention pour clôturer une opération de secours ?","c":["Le seul COS, au nom de tous les engins","Le COS, les chefs de secteur et chaque chef d\u0027agrès","Chaque sapeur-pompier ayant participé à l\u0027intervention","L\u0027opérateur du CODIS ayant traité l\u0027appel"],"r":1,"e":"Pour clôturer une opération, le COS, le ou les chefs de secteur et chaque chef d\u0027agrès réalisent un rapport d\u0027intervention. Dématérialisés, ces rapports alimentent les tableaux de bord, les indicateurs et les statistiques nationales des SIS.","ref":"§ 3 Le rapport d\u0027intervention (chap. 4) — p. 83","p":"Pour clôturer une opération de secours, le COS, chef(s) de secteur et chaque chef d\u0027agrès doivent réaliser un rapport d\u0027intervention.","s":"gdo-cmdt"},
{"t":"gdo-cmdt","ch":"Après l\u0027opération","niv":"Équipier","q":"Selon le guide, quel principe doit guider la réalisation d\u0027un retour d\u0027expérience (RETEX) ?","c":["Identifier le responsable des difficultés rencontrées","Évaluer individuellement chaque intervenant engagé","Comprendre la situation, sans désigner de responsable","Se limiter au seul fonctionnement interne du SIS"],"r":2,"e":"Le RETEX cherche à comprendre la situation et non à désigner un responsable. Il s\u0027inscrit dans une démarche non disciplinaire, avec un esprit critique constructif et objectif, et dans une perspective interservices et de sécurité globale.","ref":"§ 5.2 Le retour d\u0027expérience (chap. 4) — p. 85","p":"chercher à comprendre la situation et non pas à désigner un responsable ; cultiver l\u0027esprit critique dans une posture constructive et objective ; inscrire la pratique du RETEX dans une démarche non disciplinaire ;","s":"gdo-cmdt"}
];
</script>
<script>
(function(){
const app=document.getElementById('app');
const KEY='qcm-gdo-gto-v3', OLDKEY='qcm-gdo-gto-v2';
const LEVELS=['Équipier',"Chef d'équipe","Chef d'agrès"];
// Révision espacée (boîtes de Leitner) : délai en jours avant de revoir, selon la boîte atteinte
const BOX_DAYS=[0,0,1,3,7,16,35];
const MASTER=4; // boîte à partir de laquelle une question est « maîtrisée »
const EXAM_N=30, EXAM_MIN=30;
const DAYMS=86400000;
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAYMS);};

/* ───── État (appareil + compte) ───── */
let st={v:3,lvl:2,srs:{},exams:[],flags:[]};
try{
  const s=localStorage.getItem(KEY);
  if(s)st=Object.assign(st,JSON.parse(s));
  else{const o=JSON.parse(localStorage.getItem(OLDKEY)||'null');
    if(o){const t=today();Object.keys(o.seen||{}).forEach(id=>{const ok=o.ok&&o.ok[id]?1:0;st.srs[id]=[ok?2:1,ok?t+1:t,ok,1];});if(typeof o.lvl==='number')st.lvl=o.lvl;}}
}catch(e){}
let rev=0;
function save(){rev++;try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}scheduleSync();}

const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);};
QUESTIONS.forEach(q=>{q.id=q.t+'-'+hash(q.q);q.lv=Math.max(0,LEVELS.indexOf(q.niv));});
const pool=()=>QUESTIONS.filter(q=>q.lv<=st.lvl);
const themeOf=id=>THEMES.find(t=>t.id===id);
const refOf=q=>(SOURCES[q.s]||themeOf(q.t).src)+(q.ref?' · '+q.ref:'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letters=['A','B','C','D'];
const S_=q=>st.srs[q.id];
const isSeen=q=>!!S_(q), isWrong=q=>S_(q)&&S_(q)[2]===0, isMastered=q=>S_(q)&&S_(q)[0]>=MASTER, isDue=q=>S_(q)&&S_(q)[1]<=today();
function stats(list){let seen=0,ok=0,m=0,due=0,wrong=0;list.forEach(q=>{const e=S_(q);if(!e)return;seen++;if(e[2])ok++;else wrong++;if(e[0]>=MASTER)m++;if(e[1]<=today())due++;});return {n:list.length,seen,ok,m,due,wrong,pct:seen?Math.round(100*ok/seen):0};}
function record(q,good){const e=S_(q),b=e?e[0]:0;const nb=good?Math.min(6,Math.max(1,b)+1):1;st.srs[q.id]=[nb,today()+(good?BOX_DAYS[nb]:0),good?1:0,Date.now()];save();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},3200);}
const inClaude=()=>!!(window.claude&&window.claude.use); // hors de claude.ai (site web autonome) : pas de signalement à Claude
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');

/* ───── Synchronisation avec le compte (capacité db) ───── */
let db=null,progRef=null,syncing=false,syncedRev=0,syncTimer=null;
function mergeRemote(r){
  if(!r)return;
  Object.entries(r.srs||{}).forEach(([id,e])=>{const l=st.srs[id];if(Array.isArray(e)&&(!l||(e[3]||0)>(l[3]||0)))st.srs[id]=e;});
  const ex={};[...(st.exams||[]),...(r.exams||[])].forEach(x=>{if(x&&x.at)ex[x.at]=x;});
  st.exams=Object.values(ex).sort((a,b)=>a.at-b.at).slice(-40);
  try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
}
function scheduleSync(){if(!progRef)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,3000);}
async function pushSync(){
  if(!progRef||syncing||syncedRev===rev)return;
  syncing=true;const r=rev;
  try{await progRef.set({v:3,srs:st.srs,exams:st.exams,at:Date.now()});syncedRev=r;}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){progRef=null;syncing=false;return;}}
  syncing=false;if(syncedRev!==rev)scheduleSync();
}
async function flushFlags(){
  if(!db||!st.flags||!st.flags.length)return;
  const left=[];
  for(const f of st.flags){try{await db.collection('signalements').add(f);}catch(e){left.push(f);}}
  st.flags=left;try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d)return;db=d;
    const uid=u?await u.id():null;
    // un invité extérieur (lecture seule) ne peut rien écrire : sa progression reste sur son appareil
    const canWrite=u?await u.can('data.write'):null;
    if(canWrite===false){db=null;return;}
    if(uid){progRef=db.doc('data/users/'+uid+'/progress');
      const snap=await progRef.get();
      if(snap.exists)mergeRemote(snap.data());
      rev++;scheduleSync();}
    await flushFlags();
    if(screen==='home')home();
  }catch(e){}
})();

/* ───── Accueil ───── */
let screen='home';
function home(){
  screen='home';stopTimer();
  const all=pool(),s=stats(all);
  const dueN=all.filter(isDue).length,newN=all.length-s.seen;
  let h=`<h2>Réviser les guides nationaux</h2><p class="lead">${all.length} questions vérifiées sur les PDF officiels de la DGSCGC${FICHES.length?', avec des fiches de cours par chapitre':''}. Choisis ton niveau, puis un mode ou un guide.</p>
  <div class="eyebrow">Niveau (inclut les niveaux précédents)</div>
  <div class="chips">${LEVELS.map((l,i)=>`<button class="chip ${st.lvl===i?'on':''}" type="button" data-l="${i}">${esc(l)} · ${QUESTIONS.filter(q=>q.lv<=i).length}</button>`).join('')}</div>
  <div class="stats"><div class="stat"><b>${s.m}</b><span>maîtrisées sur ${all.length}</span></div><div class="stat"><b>${s.seen?s.pct+'%':'—'}</b><span>de réussite (${s.seen} vues)</span></div><div class="stat"><b>${dueN}</b><span>à revoir aujourd'hui</span></div></div>
  <div class="today"><div class="eyebrow">Révision du jour</div>
    <p>${dueN?`${dueN} question${dueN>1?'s':''} à revoir : celles que tu as ratées et celles dont le délai de révision est échu.`:(s.seen?'Rien à revoir aujourd\'hui. Avance avec de nouvelles questions.':'Commence par de nouvelles questions : chaque réponse programme sa prochaine révision (1, 3, 7, 16 puis 35 jours si tu réponds juste).')}</p>
    ${dueN?`<button class="btn primary" id="m-due" type="button">Réviser maintenant <span class="n">· ${Math.min(dueN,40)}</span></button>`:`<button class="btn primary" id="m-new0" type="button" ${newN?'':'disabled'}>Découvrir 20 nouvelles questions</button>`}
  </div>
  <div class="modes">
    <button class="btn" id="m-new" type="button" ${newN?'':'disabled'}>Nouvelles questions <span class="n">· ${newN}</span></button>
    <button class="btn" id="m-exam" type="button">Examen blanc <span class="n">· ${EXAM_N} q · ${EXAM_MIN} min</span></button>
    <button class="btn" id="m-weak" type="button">Mes points faibles</button>
    <button class="btn" id="m-wrong" type="button" ${s.wrong?'':'disabled'}>Mes erreurs <span class="n">· ${s.wrong}</span></button>
    <button class="btn" id="m-flash" type="button">Flashcards</button>
    <button class="btn" id="m-fiches" type="button" ${FICHES.length?'':'hidden'}>Fiches de cours</button>
  </div>
  <div class="eyebrow">Par guide</div><div class="themes">`;
  THEMES.forEach(t=>{const l=all.filter(q=>q.t===t.id);if(!l.length)return;const ss=stats(l);
    h+=`<button class="card" type="button" data-theme="${t.id}"><span class="nom">${esc(t.nom)}</span><span class="pct">${ss.seen?ss.pct+'%':'—'}</span><span class="sub">${l.length} questions · ${ss.m} maîtrisées · ${ss.seen} vues</span><span class="bar"><i style="width:${Math.round(100*ss.m/l.length)}%"></i></span></button>`;});
  h+=`</div><p class="note">Questions et fiches rédigées puis vérifiées d'après les guides nationaux publiés par la DGSCGC (PDF en ligne sur le site de la Sécurité civile, juillet 2026). Chaque correction cite le passage du guide, avec sa section et sa page. Les consignes de ton SDIS priment toujours sur ce support de révision. ${progRef?'Progression enregistrée sur ton compte : tu la retrouves sur tous tes appareils.':'Progression enregistrée sur cet appareil.'}</p>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{st.lvl=+b.dataset.l;save();home();});
  const dueBtn=document.getElementById('m-due');if(dueBtn)dueBtn.onclick=()=>startQuiz(all.filter(isDue).sort((a,b)=>S_(a)[1]-S_(b)[1]||S_(a)[0]-S_(b)[0]).slice(0,40),'Révision du jour');
  const newList=()=>shuffle(all.filter(q=>!isSeen(q))).slice(0,20);
  const n0=document.getElementById('m-new0');if(n0)n0.onclick=()=>startQuiz(newList(),'Nouvelles questions');
  document.getElementById('m-new').onclick=()=>startQuiz(newList(),'Nouvelles questions');
  document.getElementById('m-exam').onclick=()=>examIntro();
  document.getElementById('m-weak').onclick=weak;
  document.getElementById('m-wrong').onclick=()=>startQuiz(shuffle(all.filter(isWrong)),'Mes erreurs');
  document.getElementById('m-flash').onclick=flashPicker;
  document.getElementById('m-fiches').onclick=fichesPicker;
  app.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>themeScreen(b.dataset.theme));
  window.scrollTo(0,0);
}

/* ───── Écran d'un guide : chapitres, fiche, quiz ───── */
function themeScreen(tid,preset){
  screen='theme';
  const t=themeOf(tid);const list=pool().filter(q=>q.t===tid);
  const chapters=[...new Set(list.map(q=>q.ch))];
  let sel=new Set(preset&&preset.length?preset:chapters);let count='20';
  function draw(){
    const p=list.filter(q=>sel.has(q.ch));
    const hasFiche=FICHES.some(f=>f.t===tid&&sel.has(f.ch));
    const counts=[['10','10'],['20','20'],['all','Toutes ('+p.length+')']];
    app.innerHTML=`<div class="eyebrow">${esc(t.court)} · niveau ${esc(LEVELS[st.lvl])}</div><h2>${esc(t.nom)}</h2><p class="lead">${list.length} questions · ${chapters.length} chapitres. Source : ${esc(t.src)}.</p>
    <div class="eyebrow">Chapitres</div>
    <div class="chips">${chapters.map(c=>{const cl=list.filter(q=>q.ch===c);const ss=stats(cl);return `<button class="chip ${sel.has(c)?'on':''}" type="button" data-c="${esc(c)}">${esc(c)} (${cl.length})${ss.seen?' · '+ss.pct+'%':''}</button>`;}).join('')}</div>
    <div class="eyebrow">Nombre de questions</div>
    <div class="chips">${counts.map(([v,l])=>`<button class="chip ${count===v?'on':''}" type="button" data-n="${v}">${l}</button>`).join('')}</div>
    <div class="actions"><button class="btn" id="fi" type="button" ${hasFiche?'':'disabled'}>Lire la fiche</button><button class="btn" id="fl" type="button" ${p.length?'':'disabled'}>Flashcards</button><button class="btn primary" id="go" type="button" ${p.length?'':'disabled'}>Lancer le quiz</button></div>
    <div class="actions"><button class="btn ghost" id="back" type="button">Accueil</button></div>`;
    app.querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{const k=c.dataset.c;sel.has(k)?sel.delete(k):sel.add(k);draw();});
    app.querySelectorAll('[data-n]').forEach(c=>c.onclick=()=>{count=c.dataset.n;draw();});
    document.getElementById('back').onclick=home;
    document.getElementById('fi').onclick=()=>fiche(tid,[...sel]);
    document.getElementById('fl').onclick=()=>flash(shuffle(p));
